 accessed and stored?","context":"An organization currently uses Microsoft Outlook installed on individual desktop computers. The company decides to transition all employees to Gmail, allowing staff to access their messages through a standard web browser.","options":[{"t":"Emails are accessed as Software as a Service (SaaS) and stored on the hosting provider's servers.","c":true,"fb":"Webmail operates as SaaS, storing emails remotely on host servers rather than on local hard drives."},{"t":"Employees can no longer organize their messages into folders or search for specific emails.","c":false,"fb":"Webmail provides full folder organization, searching, and filtering capabilities."},{"t":"Emails must now be printed out on paper before employees are allowed to read them.","c":false,"fb":"Webmail displays messages directly on screen inside any web browser."},{"t":"Employees can no longer send or receive email messages from users with different email providers.","c":false,"fb":"Webmail communicates across all standard email providers."}]},{"cat":"02","type":"mcq","stem":"What primary operational advantage distinguishes Instant Messaging (IM) from traditional email?","options":[{"t":"IM enables real-time communication with virtually no delay between sending and receiving.","c":true,"fb":"Instant messaging lets people talk in real time with virtually zero delay compared to email."},{"t":"IM prevents users from attaching images, photos, or digital files to conversations.","c":false,"fb":"Modern IM software allows users to easily send text messages, photos, and files."},{"t":"IM deletes all message history immediately as soon as a conversation window is closed.","c":false,"fb":"Instant messages are stored, allowing users to retrieve past conversations anytime."},{"t":"IM requires users to have a dedicated landline telephone connection to send messages.","c":false,"fb":"IM operates over mobile cellular data and internet networks, not old landlines."}]},{"cat":"02","type":"scenario","stem":"Which programs are designed to provide desktop instant messaging and team collaboration?","context":"A project team needs desktop software that allows members to send real-time instant messages and collaborate from their computers as easily as they chat on smartphones.","options":[{"t":"Slack and Microsoft Teams","c":true,"fb":"Slack and Microsoft Teams bring smartphone-style instant messaging to desktop computers for teamwork."},{"t":"Microsoft Word and LibreOffice Writer","c":false,"fb":"Word and Writer are word processing programs used to draft text documents."},{"t":"Microsoft Excel and Apple Numbers","c":false,"fb":"Excel and Numbers are spreadsheet programs used to calculate numerical data."},{"t":"Adobe Premiere and DaVinci Resolve","c":false,"fb":"Premiere and DaVinci Resolve are digital video editing programs."}]},{"cat":"02","type":"mcq","stem":"Which web browser is typically pre-installed as the default bundled browser on Linux distributions?","options":[{"t":"Microsoft Edge","c":false,"fb":"Microsoft Edge is the bundled default browser on Windows."},{"t":"Mozilla Firefox","c":true,"fb":"Linux computers usually come pre-installed with Mozilla Firefox."},{"t":"Apple Safari","c":false,"fb":"Safari is exclusive to Apple operating systems."},{"t":"Google Chrome","c":false,"fb":"Chrome is a third-party browser that requires separate installation, not the Linux default."}]},{"cat":"02","type":"scenario","stem":"Which default browser pairing correctly identifies each platform's pre-installed browser?","context":"An IT technician sets up new equipment: a Windows desktop PC, an Apple MacBook, and a Linux workstation. The technician checks the default pre-installed web browser on each computer.","options":[{"t":"Windows: Google Chrome; Mac: Safari; Linux: Microsoft Edge","c":false,"fb":"Windows bundles Edge, not Chrome; Linux does not bundle Edge."},{"t":"Windows: Mozilla Firefox; Mac: Google Chrome; Linux: Safari","c":false,"fb":"Windows bundles Edge, Mac bundles Safari, and Linux does not bundle Safari."},{"t":"Windows: Microsoft Edge; Mac: Safari; Linux: Mozilla Firefox","c":true,"fb":"Windows comes bundled with Microsoft Edge, Apple devices with Safari, and Linux with Mozilla Firefox."},{"t":"Windows: Microsoft Edge; Mac: Mozilla Firefox; Linux: Google Chrome","c":false,"fb":"Apple devices bundle Safari, and Linux typically bundles Firefox."}]},{"cat":"02","type":"scenario","stem":"Why was the attachment rejected, and what is the standard solution?","context":"An employee needs to send a 400 MB video presentation to a client. When trying to attach the file directly to an outgoing email message, the email program refuses to send it.","options":[{"t":"Email services usually limit attachments to about 25 MB; upload the file to cloud storage and share a link.","c":true,"fb":"Email attachments are typically capped around 25 MB, which is solved by sharing via cloud storage."},{"t":"Email programs can only send plain text; the employee must convert the video into a word document.","c":false,"fb":"Video files cannot be converted into word documents; file size was the limitation."},{"t":"Email programs cannot send files to external clients; the employee must mail a physical optical disc.","c":false,"fb":"Files can be shared digitally over the internet using cloud storage services."},{"t":"Email services charge a cash penalty for every file attached; the employee must purchase an email license.","c":false,"fb":"Rejection is caused by technical attachment size limits, not payment penalties."}]},{"cat":"02","type":"mcq","stem":"What is a major advantage of using a cloud file-sharing service like Dropbox or OneDrive instead of emailing files back and forth?","options":[{"t":"Cloud storage eliminates the requirement for an active internet connection to download files.","c":false,"fb":"Users must have internet access to access and download files stored in the cloud."},{"t":"Cloud storage allows users to upload a file once and share access rather than emailing large files repeatedly.","c":true,"fb":"Cloud services make it easy to share large files and avoid sending multiple email copies."},{"t":"Cloud storage services provide unlimited file storage capacity completely free without any subscription.","c":false,"fb":"Cloud storage offers a limited free tier, but requires a paid subscription for more space."},{"t":"Cloud storage automatically converts static text documents into interactive video conferences.","c":false,"fb":"File storage holds files, whereas video conferencing is handled by communication software."}]},{"cat":"02","type":"mcq","stem":"Which type of software is designed to help teams plan project timelines, assign tasks to workers, and monitor progress?","options":[{"t":"Work management software","c":true,"fb":"Work management software helps plan, track, organize project work, and assign tasks."},{"t":"Web browsing software","c":false,"fb":"Web browsing software is used to view and navigate web pages on the internet."},{"t":"Digital imaging software","c":false,"fb":"Digital imaging software is used to edit and process photos."},{"t":"Video editing software","c":false,"fb":"Video editing software is used to cut, trim, and produce video clips."}]},{"cat":"02","type":"scenario","stem":"Which platforms are designed specifically for this work management purpose?","context":"A project manager coordinates a team of remote workers and needs software that organizes tasks, tracks deadlines, logs time spent on projects, and displays progress on a visual dashboard.","options":[{"t":"Monday.com and Trello","c":true,"fb":"Monday.com, Trello, Jira, and Basecamp are popular work management platforms with timelines and dashboards."},{"t":"Microsoft Edge and Mozilla Firefox","c":false,"fb":"Edge and Firefox are web browsers used for surfing the internet."},{"t":"Apple Keynote and Microsoft PowerPoint","c":false,"fb":"Keynote and PowerPoint are presentation programs used to create slide decks."},{"t":"Adobe Premiere and DaVinci Resolve","c":false,"fb":"Premiere and DaVinci Resolve are video editing tools."}]},{"cat":"02","type":"mcq","stem":"Which type of software organizes data into square grids of rows and columns and is used to calculate formulas and perform math?","options":[{"t":"Spreadsheet software","c":true,"fb":"Spreadsheets are square grids of rows and columns that store, calculate, and analyze numerical data."},{"t":"Presentation software","c":false,"fb":"Presentation software uses slides to display visual ideas and animations."},{"t":"Word processing software","c":false,"fb":"Word processing software is used for typing, formatting, and editing text documents."},{"t":"Web browsing software","c":false,"fb":"Web browsing software displays websites on the internet."}]},{"cat":"02","type":"scenario","stem":"Which type of software is best suited for creating and formatting this text document?","context":"An administrative assistant needs to write a formal business report that includes headings, paragraphs, and automatic spell-checking.","options":[{"t":"Word processing software","c":true,"fb":"Word processors are designed specifically for reading, writing, formatting, and editing text documents."},{"t":"Spreadsheet software","c":false,"fb":"Spreadsheets are designed for storing numerical data and calculating formulas in grids."},{"t":"Presentation software","c":false,"fb":"Presentation software is designed for creating visual slides for an audience."},{"t":"Digital imaging software","c":false,"fb":"Digital imaging software is used to edit and manipulate photographs."}]},{"cat":"02","type":"mcq","stem":"What capabilities make Microsoft Excel the most popular spreadsheet software for handling large amounts of data?","options":[{"t":"It has powerful analysis tools and a macro language to automate tasks.","c":true,"fb":"Excel works well with large amounts of data, offers advanced analysis, and has a macro language."},{"t":"It is provided completely free and pre-installed on all Apple Mac computers.","c":false,"fb":"Apple Numbers is free on Macs, whereas Microsoft Excel requires a paid commercial license."},{"t":"It is designed strictly for everyday basic spreadsheets and cannot handle large datasets.","c":false,"fb":"Apple Numbers is limited to everyday spreadsheets, whereas Excel is built for large datasets."},{"t":"It lacks the ability to create visual charts, tables, or graphs.","c":false,"fb":"Excel provides extensive support for creating charts, tables, and graphs."}]},{"cat":"02","type":"scenario","stem":"Why is Apple Numbers NOT the ideal choice for this advanced task?","context":"A financial analyst working on a Mac needs to analyze a massive database containing years of transactions and automate recurring calculations using macros.","options":[{"t":"Numbers is designed for everyday basic spreadsheets and is not built for large datasets or advanced analysis.","c":true,"fb":"Numbers is designed for everyday basic spreadsheets rather than large datasets or advanced analysis."},{"t":"Numbers cannot perform basic mathematical calculations like addition or subtraction.","c":false,"fb":"Numbers includes all standard basic math features needed for everyday spreadsheets."},{"t":"Numbers runs exclusively inside a web browser and cannot be installed on a Mac computer.","c":false,"fb":"Numbers is an installed desktop application bundled free with Apple Mac computers."},{"t":"Numbers requires paying an expensive monthly subscription fee on Apple devices.","c":false,"fb":"Numbers is free with every Apple Mac computer."}]},{"cat":"02","type":"multi","stem":"Which statements accurately describe open-source office suites such as LibreOffice and Apache OpenOffice? Select the TWO correct statements.","options":[{"t":"They are available as free software packages.","c":true,"fb":"LibreOffice and OpenOffice are free software packages made by open-source companies."},{"t":"They offer user interfaces with a similar feel to Microsoft Office programs.","c":true,"fb":"Their similar feel to Microsoft programs makes switching between suites easy."},{"t":"They require users to pay a monthly commercial license fee to use them.","c":false,"fb":"Open-source suites are available for free without licensing fees."},{"t":"They are proprietary software packages that only work on Apple Mac computers.","c":false,"fb":"They are open-source and cross-platform, not Apple-exclusive."},{"t":"They cannot be used to create text documents or spreadsheets.","c":false,"fb":"LibreOffice and OpenOffice provide full word processing and spreadsheet tools."}]},{"cat":"02","type":"scenario","stem":"Which software package provides a free open-source alternative with a similar feel to Microsoft Office?","context":"A small community clinic needs word processing and spreadsheet software for its office computers but has no budget to purchase commercial Microsoft Office licenses.","options":[{"t":"LibreOffice","c":true,"fb":"LibreOffice is a free open-source software suite that provides tools comparable to Microsoft Office."},{"t":"Adobe Premiere","c":false,"fb":"Adobe Premiere is commercial video editing software requiring a paid subscription."},{"t":"Microsoft Outlook","c":false,"fb":"Microsoft Outlook is a commercial email client requiring a paid license."},{"t":"Miro","c":false,"fb":"Miro is an online digital whiteboard tool for visual brainstorming."}]},{"cat":"02","type":"mcq","stem":"Why do smartphone users generally spend less time using mobile web browsers compared to computer users?","options":[{"t":"Dedicated apps compete for attention, and touchscreens make long scrolling tiring and less precise.","c":true,"fb":"Mobile apps provide tailored experiences, while small screens and touch interfaces make web browsing more tiring and less precise."},{"t":"Smartphone browsers are strictly prohibited from connecting to the internet.","c":false,"fb":"Smartphone browsers connect to the internet over cellular and Wi-Fi networks."},{"t":"Mobile web browsers charge users a fee for every web page they open.","c":false,"fb":"Standard web browsing does not incur fees per page viewed."},{"t":"Smartphone screens cannot display pictures, colors, or formatted text on websites.","c":false,"fb":"Modern smartphone displays easily render full-color web pages with pictures and text."}]},{"cat":"02","type":"scenario","stem":"What software solution directly addresses this mobile usability problem?","context":"A commercial retail bank notices that customers struggle to complete banking transactions when using mobile phone web browsers due to small screens and imprecise touch inputs.","options":[{"t":"Offering a dedicated mobile banking application designed for touchscreens.","c":true,"fb":"Dedicated mobile banking apps are designed specifically for smaller touchscreens to improve user experience."},{"t":"Requiring customers to access their bank accounts through a remote assistance session.","c":false,"fb":"Remote assistance is an IT troubleshooting tool, not a customer banking interface."},{"t":"Requiring customers to visit a physical bank branch to check account balances.","c":false,"fb":"Mobile banking apps allow customers to access financial information remotely."},{"t":"Forcing mobile customers to install multiple web browsers on their phones.","c":false,"fb":"Switching browsers does not solve small screen touch precision hurdles."}]},{"cat":"02","type":"mcq","stem":"What key collaboration capability allows distributed teams to work together effectively in Google Docs?","options":[{"t":"Simultaneous real-time editing on a single shared document","c":true,"fb":"Cloud productivity suites like Google Docs allow team members to create, share, and edit a document simultaneously in real time."},{"t":"Distributing document copies exclusively through postal mail on optical discs","c":false,"fb":"Cloud suites operate online over standard internet connections."},{"t":"Restricting editing permissions so only one person can view a file each week","c":false,"fb":"Cloud suites are designed for continuous multi-user team collaboration."},{"t":"Requiring each team member to install a different, incompatible word processor","c":false,"fb":"Google Docs provides a unified browser-based interface for all users."}]},{"cat":"02","type":"mcq","stem":"What is a primary reason for the widespread global popularity of the WhatsApp messaging platform?","options":[{"t":"It allows users to send texts worldwide without incurring expensive carrier international charges.","c":true,"fb":"WhatsApp is popular globally because it avoids costly international fees added by cellphone carriers."},{"t":"It is an operating system built exclusively for desktop computers.","c":false,"fb":"WhatsApp is a messaging app available across mobile and desktop devices."},{"t":"It requires users to pay a subscription fee for every message sent.","c":false,"fb":"WhatsApp does not charge fees per message."},{"t":"It prohibits users from sending photos, files, or creating group chats.","c":false,"fb":"WhatsApp allows users to send text messages, photos, and files, and create group chats."}]},{"cat":"02","type":"mcq","stem":"Which features and security protections specifically characterize Apple's iMessage service?","options":[{"t":"It uses end-to-end encryption and works well with iCloud, Siri, and FaceTime.","c":true,"fb":"iMessage uses end-to-end encryption and integrates natively with iCloud, Siri, and FaceTime."},{"t":"It is an open-source messaging application built exclusively for Android smartphones.","c":false,"fb":"iMessage is Apple's proprietary instant messaging service, not an Android tool."},{"t":"It requires an active landline telephone connection to transmit text messages.","c":false,"fb":"iMessage operates over cellular data and Wi-Fi networks."},{"t":"It charges users expensive international fees for every message sent to another Apple device.","c":false,"fb":"iMessage does not charge international text fees over data connections."}]},{"cat":"02","type":"mcq","stem":"In presentation software like Microsoft PowerPoint, what term refers to the individual visual pages displayed on a screen to an audience?","options":[{"t":"Slides","c":true,"fb":"Presentation software uses slides as individual visual pages to display text, animations, pictures, and charts to an audience."},{"t":"Sheets","c":false,"fb":"Sheets or worksheets are the row-and-column grids used in spreadsheet programs like Excel."},{"t":"Layers","c":false,"fb":"Layers are stacked visual planes used in digital imaging software like Photoshop."},{"t":"Tracks","c":false,"fb":"Tracks are audio and video timeline channels used in video editing software."}]},{"cat":"02","type":"mcq","stem":"Which type of software is used to create visual representations of projects, such as flowcharts and IT network diagrams?","options":[{"t":"Diagramming and graphics software","c":true,"fb":"Diagramming software creates visual representations like project flowcharts and IT network structures."},{"t":"Word processing software","c":false,"fb":"Word processing software is used to write and format text documents like reports."},{"t":"Email client software","c":false,"fb":"Email client software is used to send and manage email messages."},{"t":"Spreadsheet software","c":false,"fb":"Spreadsheet software is used to store and calculate numerical data in rows and columns."}]},{"cat":"02","type":"mcq","stem":"Which software tool provides an online workspace where teams and students can brainstorm together using text, pictures, videos, and links?","options":[{"t":"Digital whiteboards (e.g. Miro)","c":true,"fb":"Digital whiteboards provide interactive workspaces for team brainstorming and remote learning."},{"t":"Video editing software (e.g. DaVinci Resolve)","c":false,"fb":"DaVinci Resolve is used to edit and produce digital videos."},{"t":"Email client software (e.g. Microsoft Outlook)","c":false,"fb":"Microsoft Outlook is used to manage email, calendars, and contacts."},{"t":"Remote assistance software (e.g. Quick Assist)","c":false,"fb":"Quick Assist is used by technicians to troubleshoot computers remotely."}]},{"cat":"02","type":"multi","stem":"Which tasks are standard image editing functions supported by digital imaging software? Select the TWO correct statements.","options":[{"t":"Cropping, resizing, rotating, and recoloring digital photos.","c":true,"fb":"Common tasks in imaging software include cropping, resizing, rotating, and recoloring."},{"t":"Previewing changes and comparing the original image with the edited version before saving.","c":true,"fb":"Imaging software allows previewing changes and comparing the original image with the edited version."},{"t":"Writing automated macro scripts to calculate compound financial interest.","c":false,"fb":"Macros and financial formulas are features of spreadsheet software."},{"t":"Generating multi-slide presentation decks with animated speech notes.","c":false,"fb":"Slide decks and presentation animations are features of presentation software."},{"t":"Controlling a remote computer's keyboard and mouse over the internet.","c":false,"fb":"Controlling remote input peripherals is a feature of remote assistance software."}]},{"cat":"02","type":"scenario","stem":"Which pairing correctly matches a free/basic video tool with a professional editing suite?","context":"A media intern needs a free program for quick video touch-ups, while the production lead requires professional video editing software for commercial movie production.","options":[{"t":"Free/Basic: Microsoft Clipchamp; Professional: Adobe Premiere or DaVinci Resolve","c":true,"fb":"Clipchamp is a free basic editing app, while Adobe Premiere and DaVinci Resolve are professional options."},{"t":"Free/Basic: Microsoft Excel; Professional: Apple Keynote","c":false,"fb":"Excel is spreadsheet software and Keynote is presentation software."},{"t":"Free/Basic: Microsoft Word; Professional: Microsoft Outlook","c":false,"fb":"Word is a word processor and Outlook is an email client."},{"t":"Free/Basic: Adobe Premiere; Professional: Apple Pages","c":false,"fb":"Premiere is professional video software, while Pages is a word processor."}]},{"cat":"03","type":"fitb","stem":"The software that manages hardware and software resources and provides common services for programs is the ____.","sub":"os-definition-role","subtype":"term","answer":["operating system","OS"],"caseSensitive":false,"fb":"An operating system manages resources and provides the services needed for programs to run."},{"cat":"03","type":"scenario","stem":"Which component provides this foundation?","sub":"os-definition-role","context":"A smart TV contains a processor, memory, and a screen. Its applications need software that manages these resources and allows users to interact with the device.","options":[{"t":"The television application","c":false,"fb":"Correction: an individual application performs a task; it does not provide the operating system’s resource-management foundation."},{"t":"The operating system","c":true,"fb":"The OS manages the device’s resources and provides an environment for applications."},{"t":"The physical screen","c":false,"fb":"The screen is hardware, not the software that manages resources."},{"t":"The stored video","c":false,"fb":"A video is data used by an application, not resource-management software."}]},{"cat":"03","type":"mcq","stem":"Why is a CLI generally harder to learn than a GUI?","sub":"cli-gui-tradeoffs","options":[{"t":"It requires more memory","c":false,"fb":"A CLI uses fewer system resources; memory demand does not explain its learning difficulty."},{"t":"It requires graphical navigation","c":false,"fb":"Graphical navigation belongs to a GUI rather than a CLI."},{"t":"It requires command memorization","c":true,"fb":"Users must remember commands to operate a CLI."},{"t":"It prevents script execution","c":false,"fb":"Scripting is a CLI strength, not a restriction."}]},{"cat":"03","type":"multi","stem":"An administrator wants the advantages of a CLI. Select the three features that support this choice.","sub":"cli-gui-tradeoffs","options":[{"t":"Lower resource use","c":true,"fb":"A CLI uses fewer system resources, which benefits older computers."},{"t":"Automatic typo correction","c":false,"fb":"Mistyped characters can cause mistakes; automatic correction is not a stated CLI advantage."},{"t":"Faster scripted tasks","c":true,"fb":"Scripts execute instructions quickly and reduce repetitive work."},{"t":"Less command memorization","c":false,"fb":"CLI users need to remember commands, contributing to the learning difficulty."},{"t":"Quick system navigation","c":true,"fb":"Quick navigation is one of the CLI’s strengths."}]},{"cat":"03","type":"scenario","stem":"Which CLI limitation does this illustrate?","sub":"cli-gui-tradeoffs","context":"A beginner types commands into a console. A mistyped character causes an error, and the interface provides little feedback while the command is being entered.","options":[{"t":"Mandatory graphical navigation","c":false,"fb":"A CLI accepts typed commands rather than requiring graphical navigation."},{"t":"Excessive graphical resource use","c":false,"fb":"Graphical resource use is associated with a GUI; a CLI uses fewer resources."},{"t":"Inability to automate tasks","c":false,"fb":"CLI scripting supports automation."},{"t":"Error-prone command entry","c":true,"fb":"Mistyping and limited feedback make command entry vulnerable to mistakes."}]},{"cat":"03","type":"mcq","stem":"What acts as the go-between for applications and hardware?","sub":"os-application-intermediary","options":[{"t":"The operating system","c":true,"fb":"The OS handles hardware access for applications."},{"t":"The application developer","c":false,"fb":"A developer creates software; the OS provides the running intermediary."},{"t":"The hardware manufacturer","c":false,"fb":"A manufacturer produces hardware rather than acting as the software intermediary."},{"t":"The computer user","c":false,"fb":"The user interacts with the system, but the OS handles application access to hardware."}]},{"cat":"03","type":"scenario","stem":"Why should the revision be made carefully?","sub":"os-application-intermediary","context":"A graphics application relies on the OS to send output to a printer. A proposed OS revision changes services used by the application.","options":[{"t":"Printers must become operating systems","c":false,"fb":"Printers remain hardware devices; an OS revision does not change their role."},{"t":"Applications stop needing hardware access","c":false,"fb":"The application still needs hardware access through the OS."},{"t":"Existing applications may stop working","c":true,"fb":"OS changes can disrupt services that existing software relies on."},{"t":"Developers must manufacture printer hardware","c":false,"fb":"Compatibility concerns do not require developers to manufacture hardware."}]},{"cat":"03","type":"fitb","stem":"Software designed to control a specific hardware model on a particular operating system is a ____.","sub":"device-drivers","subtype":"term","answer":["driver","device driver"],"caseSensitive":false,"fb":"A driver provides control for a particular hardware device on a supported OS."},{"cat":"03","type":"mcq","stem":"The OS cannot identify a newly connected printer; where should a technician look for its correct driver?","sub":"device-drivers","options":[{"t":"Any printer’s driver package","c":false,"fb":"A driver must match the specific hardware model and OS."},{"t":"The manufacturer’s website","c":true,"fb":"The manufacturer’s website is the appropriate place to find and download the correct driver."},{"t":"Another OS’s driver package","c":false,"fb":"A driver for another operating system may not match the installed OS."},{"t":"The printer’s document folder","c":false,"fb":"Stored documents do not provide the software needed to control the printer."}]},{"cat":"03","type":"fitb","stem":"The memory-addressing limit associated with a 32-bit system is ____.","sub":"bit-architecture-memory-limit","subtype":"term","answer":["4GB","4 GB"],"caseSensitive":false,"fb":"The 32-bit memory-addressing limit is 4GB; 64-bit architecture supports a much larger address range."},{"cat":"03","type":"scenario","stem":"Which combination meets the requirement?","sub":"bit-architecture-memory-limit","context":"A workstation needs an architecture capable of addressing much more memory than the 32-bit limit. Its CPU and operating system can both be selected for this requirement.","options":[{"t":"32-bit CPU; 32-bit OS","c":false,"fb":"This retains the 32-bit memory-addressing limitation."},{"t":"32-bit CPU; larger display","c":false,"fb":"Display size does not increase the architecture’s memory-addressing capacity."},{"t":"32-bit OS; newer interface","c":false,"fb":"An interface change does not remove the 32-bit addressing limit."},{"t":"64-bit CPU; 64-bit OS","c":true,"fb":"A 64-bit CPU and OS support addressing far more memory."}]},{"cat":"03","type":"mcq","stem":"Which operating system type is designed for a single purpose with few resources?","sub":"embedded-os","options":[{"t":"Embedded operating system","c":true,"fb":"An embedded OS uses few resources and serves a specific purpose."},{"t":"Commercial operating system","c":false,"fb":"Commercial describes licensing and source-code access, not a single-purpose resource requirement."},{"t":"Open-source operating system","c":false,"fb":"Open-source describes code availability, not necessarily a single-purpose design."},{"t":"Text-based operating system","c":false,"fb":"Text-based describes the interface; it does not require a single-purpose device."}]},{"cat":"03","type":"multi","stem":"An engineer is choosing an OS for a dedicated medical device. Select the three characteristics that fit an embedded OS.","sub":"embedded-os","options":[{"t":"Broad desktop task support","c":false,"fb":"An embedded OS is designed for a specific purpose rather than broad desktop use."},{"t":"Low operating-system cost","c":true,"fb":"Low cost is a characteristic of embedded operating systems."},{"t":"High system-resource demand","c":false,"fb":"Embedded operating systems use few resources."},{"t":"Single-purpose device operation","c":true,"fb":"An embedded OS serves the dedicated function of its device."},{"t":"Frequent real-time optimization","c":true,"fb":"Embedded operating systems are often optimized for real-time processing."}]},{"cat":"03","type":"mcq","stem":"What does “open-source” establish about software?","sub":"open-source-vs-commercial","options":[{"t":"Every copy costs nothing","c":false,"fb":"Open-source software is not necessarily free of charge."},{"t":"Its source is secret","c":false,"fb":"Open-source code is available for people to inspect and use."},{"t":"Its source is accessible","c":true,"fb":"Source-code availability is a defining feature of open-source software."},{"t":"Every license covers one device","c":false,"fb":"A one-device license is associated with the commercial licensing model described here."}]},{"cat":"03","type":"multi","stem":"A project allows users to inspect and change its source code. Select the two features that match its open-source model.","sub":"open-source-vs-commercial","options":[{"t":"Guaranteed zero purchase price","c":false,"fb":"Open-source software may still have a purchase price."},{"t":"Publicly viewable source code","c":true,"fb":"Users can inspect the code used to create the software."},{"t":"Mandatory single-device licensing","c":false,"fb":"Single-device licensing is not a defining requirement of open-source software."},{"t":"Secret developer-only source code","c":false,"fb":"Keeping the source secret conflicts with allowing users to inspect it."},{"t":"User-modifiable source code","c":true,"fb":"Users can change how the software works by modifying its source."}]},{"cat":"03","type":"scenario","stem":"Which action satisfies this condition?","sub":"open-source-vs-commercial","context":"An open-source project permits modifications on the condition that changes are made available to everyone else. A developer modifies the program’s behavior.","options":[{"t":"Share the modified code","c":true,"fb":"Making the changes available to others satisfies the project’s stated condition."},{"t":"Keep the changes secret","c":false,"fb":"Secret changes do not meet the requirement to make modifications available."},{"t":"Purchase a device license","c":false,"fb":"Buying a license does not fulfill the stated requirement to share changes."},{"t":"Publish only the price","c":false,"fb":"A price announcement does not make the modifications available."}]},{"cat":"03","type":"fitb","stem":"The free Linux distribution available since 2004 and commonly used for servers and cloud applications is ____.","sub":"linux-origin-distros","subtype":"term","answer":["Ubuntu"],"caseSensitive":false,"fb":"Ubuntu is a Linux distribution used for servers and cloud applications."},{"cat":"03","type":"mcq","stem":"Which pairing correctly identifies Linux’s creator and the environment its UNIX-based design supports?","sub":"linux-origin-distros","options":[{"t":"Microsoft; single-user and single-tasking","c":false,"fb":"Linux was created by Linus Torvalds and supports multiple users and tasks."},{"t":"Apple; multi-user and multitasking","c":false,"fb":"The environment matches, but Apple did not create Linux."},{"t":"Torvalds; single-user and single-tasking","c":false,"fb":"The creator matches, but Linux follows a multi-user, multitasking design."},{"t":"Torvalds; multi-user and multitasking","c":true,"fb":"Linus Torvalds created Linux using the multi-user, multitasking design associated with UNIX."}]},{"cat":"03","type":"multi","stem":"Select the three members of the popular personal-computer OS group from this list.","sub":"os-market-landscape","options":[{"t":"Windows","c":true,"fb":"Windows belongs to the popular personal-computer OS group."},{"t":"Android","c":false,"fb":"Android belongs to the main smartphone OS group in this classification."},{"t":"macOS","c":true,"fb":"macOS belongs to the popular personal-computer OS group."},{"t":"iOS","c":false,"fb":"iOS belongs to the main smartphone OS group in this classification."},{"t":"ChromeOS","c":true,"fb":"ChromeOS belongs to the popular personal-computer OS group."}]},{"cat":"03","type":"mcq","stem":"An older PC cannot meet a newer OS version’s resource requirements; what best explains the failed upgrade?","sub":"os-market-landscape","options":[{"t":"Newer versions need fewer resources","c":false,"fb":"Some newer versions require more resources than older hardware provides."},{"t":"Hardware resources are insufficient","c":true,"fb":"The older PC cannot supply the resources required by the newer version."},{"t":"Version numbers guarantee hardware compatibility","c":false,"fb":"A newer version number does not guarantee support for older hardware."},{"t":"Every OS version requires smartphones","c":false,"fb":"OS versions exist for different device groups, including personal computers."}]},{"cat":"03","type":"fitb","stem":"The earlier operating-system design on which macOS is based is ____.","sub":"windows-vs-macos","subtype":"term","answer":["UNIX"],"caseSensitive":false,"fb":"macOS follows the same general design as UNIX."},{"cat":"03","type":"multi","stem":"A buyer is evaluating macOS and its relationship with Apple hardware. Select the two matching characteristics.","sub":"windows-vs-macos","options":[{"t":"Runs only on Apple computers","c":true,"fb":"macOS operates on Apple computers."},{"t":"Runs on every PC brand","c":false,"fb":"macOS does not share the broad hardware-brand support described for other PC operating systems."},{"t":"Guarantees complete immunity to viruses","c":false,"fb":"A Mac can still get a virus; security is not absolute immunity."},{"t":"Apple designs hardware and software","c":true,"fb":"Apple’s control of both helps it make macOS secure and stable."},{"t":"Apple develops only the software","c":false,"fb":"Apple designs both the hardware and software."}]},{"cat":"03","type":"mcq","stem":"A planner contrasts irregular Windows major releases with macOS’s regular release pattern; which schedule matches macOS?","sub":"windows-vs-macos","options":[{"t":"Every spring","c":false,"fb":"Spring is not the stated annual macOS release season."},{"t":"Every summer","c":false,"fb":"Summer is not the stated annual macOS release season."},{"t":"Every autumn","c":true,"fb":"macOS follows an annual autumn release pattern."},{"t":"Every winter","c":false,"fb":"Winter is not the stated annual macOS release season."}]},{"cat":"03","type":"fitb","stem":"A text-based operating system accepts typed commands through a ____.","sub":"text-based-os-servers","subtype":"term","answer":["CLI","command line interface","command-line interface","command line interface (CLI)"],"caseSensitive":false,"fb":"A CLI accepts commands typed into a console without requiring clickable icons."},{"cat":"03","type":"mcq","stem":"A server administrator prioritizes fast tasks, stability, and reliability; which OS style best matches these priorities?","sub":"text-based-os-servers","options":[{"t":"Text-based operating system","c":true,"fb":"Text-based systems are well suited to servers because of their task speed, stability, and reliability."},{"t":"Touch-first graphical operating system","c":false,"fb":"Touch interaction does not explain the server advantages identified in the stem."},{"t":"Stylus-first graphical operating system","c":false,"fb":"Stylus interaction supports visual input rather than the stated text-based server advantages."},{"t":"Eye-controlled graphical operating system","c":false,"fb":"Eye selection is a visual input method, not the basis of the stated server benefits."}]},{"cat":"03","type":"mcq","stem":"Which pair of input methods lets tablet users manipulate onscreen icons?","sub":"visual-os-input","options":[{"t":"Keyboard commands and scripts","c":false,"fb":"Commands and scripts describe text-based interaction rather than the tablet input methods asked for."},{"t":"Eye direction and finger pinch","c":false,"fb":"This pair describes Apple Vision Pro selection."},{"t":"Driver loading and hardware detection","c":false,"fb":"These are OS hardware-management functions, not user input methods."},{"t":"Finger touch and stylus","c":true,"fb":"Tablet icons can be manipulated with a finger or stylus."}]},{"cat":"03","type":"mcq","stem":"An Apple Vision Pro user looks at an icon; which action signals selection of that icon?","sub":"visual-os-input","options":[{"t":"Touch the headset display","c":false,"fb":"The described selection method uses a finger pinch rather than touching the display."},{"t":"Pinch the fingers together","c":true,"fb":"Looking identifies the icon, and pinching signals its selection."},{"t":"Type a console command","c":false,"fb":"Console commands belong to CLI interaction rather than this visual selection method."},{"t":"Install the icon’s driver","c":false,"fb":"Drivers control hardware; installing one is not an icon-selection gesture."}]},{"cat":"03","type":"mcq","stem":"Why does ChromeOS boot faster than a traditional operating system?","sub":"chromeos-traits","options":[{"t":"It loads more software","c":false,"fb":"ChromeOS has less software to load, not more."},{"t":"It preserves every guest setting","c":false,"fb":"Guest settings reset after logout or restart; preserving them is not the explanation."},{"t":"It loads less software","c":true,"fb":"Having less software to load contributes to faster booting."},{"t":"It avoids all browser use","c":false,"fb":"ChromeOS relies heavily on the browser."}]},{"cat":"03","type":"multi","stem":"A Chromebook is shared through guest sessions. Select the three characteristics that match ChromeOS.","sub":"chromeos-traits","options":[{"t":"Heavy browser reliance","c":true,"fb":"ChromeOS relies heavily on the browser."},{"t":"Permanent guest personalization","c":false,"fb":"Guest settings and personalization reset after logout or restart."},{"t":"Cloud-based operating-system design","c":true,"fb":"ChromeOS is cloud-based and works best with an Internet connection."},{"t":"Guest settings reset on logout","c":true,"fb":"Ending a guest session resets its settings and personalization."},{"t":"Full independence from Internet access","c":false,"fb":"ChromeOS works best online, and account sign-in requires an Internet connection in the described setup."}]},{"cat":"03","type":"fitb","stem":"Main memory holds active programs and data but loses its contents when power is removed, so it is described as ____.","sub":"memory-and-main-memory","subtype":"term","answer":["volatile"],"caseSensitive":false,"fb":"Volatile memory requires power to retain its contents."},{"cat":"03","type":"mcq","stem":"Memory consists of an array of bytes or words; what uniquely identifies each location?","sub":"memory-and-main-memory","options":[{"t":"Its stored data value","c":false,"fb":"A stored value is the content of a location, not its address."},{"t":"Its currently running program","c":false,"fb":"A program uses memory but does not serve as the unique identifier of each location."},{"t":"Its time of allocation","c":false,"fb":"Allocation time is not the identifier assigned to each byte or word."},{"t":"Its unique memory address","c":true,"fb":"Each byte or word in memory has a unique address."}]},{"cat":"03","type":"mcq","stem":"Which OS function controls the allocation and deallocation of memory to processes?","sub":"memory-management-purpose","options":[{"t":"Driver management","c":false,"fb":"Driver management controls hardware through device-specific software."},{"t":"Memory management","c":true,"fb":"Memory management assigns memory to processes and releases it afterward."},{"t":"Static linking","c":false,"fb":"Static linking combines program modules into an executable."},{"t":"Dynamic loading","c":false,"fb":"Dynamic loading brings routines into memory when needed."}]},{"cat":"03","type":"multi","stem":"An OS must manage memory while several processes execute. Select the three tasks that belong to memory management.","sub":"memory-management-purpose","options":[{"t":"Track process memory usage","c":true,"fb":"Tracking occupied memory helps the OS manage available space."},{"t":"Combine compiler object files","c":false,"fb":"Combining object files is the linker's task."},{"t":"Minimize memory fragmentation","c":true,"fb":"Reducing fragmentation supports efficient memory utilization."},{"t":"Maintain process data integrity","c":true,"fb":"Memory management helps protect data integrity during execution."},{"t":"Identify printer driver models","c":false,"fb":"Identifying hardware and loading its driver belongs to driver management."}]},{"cat":"03","type":"mcq","stem":"Which pairing correctly identifies the generators of logical and physical addresses?","sub":"logical-vs-physical-address","options":[{"t":"Logical: MMU; physical: CPU","c":false,"fb":"This reverses the generators of the two address types."},{"t":"Logical: CPU; physical: linker","c":false,"fb":"A linker combines object files; it does not generate physical addresses."},{"t":"Logical: CPU; physical: MMU","c":true,"fb":"The CPU generates logical addresses, and the MMU maps them to physical addresses."},{"t":"Logical: linker; physical: MMU","c":false,"fb":"Logical addresses originate from the CPU, not the linker."}]},{"cat":"03","type":"scenario","stem":"What type of address results from the MMU's mapping?","sub":"logical-vs-physical-address","context":"A CPU generates an address while a program runs. The MMU maps that address to an actual location used by the memory hardware.","options":[{"t":"Physical address","c":true,"fb":"The mapped address identifies an actual memory hardware location."},{"t":"Logical address","c":false,"fb":"The logical address is the CPU-generated input to the mapping."},{"t":"Page table","c":false,"fb":"A page table is a mapping structure, not an address type."},{"t":"Partition table","c":false,"fb":"A partition table tracks partitions, not the resulting hardware address."}]},{"cat":"03","type":"multi","stem":"Select the two names that identify an address generated by the CPU before MMU mapping.","sub":"logical-vs-physical-address","options":[{"t":"Real address","c":false,"fb":"A real address is another name for a physical address."},{"t":"Virtual address","c":true,"fb":"Virtual address and logical address refer to the CPU-generated address."},{"t":"Physical address","c":false,"fb":"A physical address is produced through MMU mapping."},{"t":"Logical address","c":true,"fb":"This is the address type generated by the CPU."},{"t":"Frame","c":false,"fb":"A frame is a physical memory block used in paging, not an address synonym."}]},{"cat":"03","type":"mcq","stem":"Which loading method places the entire program into memory at a fixed address?","sub":"static-vs-dynamic-loading","options":[{"t":"Dynamic loading","c":false,"fb":"Dynamic loading brings in routines only when they are needed."},{"t":"Static linking","c":false,"fb":"Static linking combines modules into an executable rather than specifying this loading method."},{"t":"Dynamic linking","c":false,"fb":"Dynamic linking uses stubs for library routine references."},{"t":"Static loading","c":true,"fb":"Static loading loads the whole program at a fixed address and requires more memory."}]},{"cat":"03","type":"scenario","stem":"Which loading method explains this behavior?","sub":"static-vs-dynamic-loading","context":"A large application has routines that may never be called. These routines remain on disk in relocatable form and enter memory only when called.","options":[{"t":"Static loading","c":false,"fb":"Static loading would place the entire program into memory."},{"t":"Dynamic loading","c":true,"fb":"Dynamic loading keeps unused routines on disk until they are called."},{"t":"Fixed partition allocation","c":false,"fb":"Fixed partition allocation organizes memory into fixed-sized partitions."},{"t":"Dynamic partition allocation","c":false,"fb":"Dynamic partition allocation sizes memory partitions to processes, not routine calls."}]},{"cat":"03","type":"fitb","stem":"The program that combines compiler-generated object files into a single executable is the ____.","sub":"static-vs-dynamic-linking","subtype":"term","answer":["linker"],"caseSensitive":false,"fb":"A linker combines one or more object files into an executable; static linking includes all necessary modules without a runtime dependency."},{"cat":"03","type":"multi","stem":"A dynamically linked program references a library routine. Select the three features of the stub mechanism.","sub":"static-vs-dynamic-linking","options":[{"t":"Includes a small code stub","c":true,"fb":"Dynamic linking includes a stub for each appropriate library routine reference."},{"t":"Always reloads an existing routine","c":false,"fb":"The stub checks whether the routine is already in memory before loading it."},{"t":"Checks whether the routine is resident","c":true,"fb":"The stub determines whether the required routine is already in memory."},{"t":"Loads the routine if absent","c":true,"fb":"A routine is loaded when the stub finds that it is not already in memory."},{"t":"Combines every module before execution","c":false,"fb":"Combining all necessary modules into one executable describes static linking."}]},{"cat":"03","type":"fitb","stem":"In monoprogramming, the operating system can be protected from the user program by a ____.","sub":"monoprogramming","subtype":"term","answer":["fence register","a fence register"],"caseSensitive":false,"fb":"A fence register protects the OS section from the user program in the single-process memory arrangement."},{"cat":"03","type":"multi","stem":"A monoprogramming system divides memory into two sections. Select the two occupants of those sections.","sub":"monoprogramming","options":[{"t":"Operating system","c":true,"fb":"One memory section holds the operating system, commonly in low memory with the interrupt vectors."},{"t":"Separate code segment","c":false,"fb":"Dividing a process into code, data, and stack segments describes segmentation."},{"t":"Separate data segment","c":false,"fb":"A data segment is not one of monoprogramming's two main memory sections."},{"t":"Separate stack segment","c":false,"fb":"A stack segment belongs to a segmented process layout."},{"t":"User program","c":true,"fb":"The other section holds the single user program."}]},{"cat":"03","type":"mcq","stem":"Which allocation strategy uses a fixed number of fixed-sized contiguous partitions, each holding one process?","sub":"fixed-vs-dynamic-partitioning","options":[{"t":"Dynamic partition allocation","c":false,"fb":"Dynamic partitions vary in size according to process requirements."},{"t":"Non-contiguous allocation","c":false,"fb":"Non-contiguous allocation allows parts of a process to occupy separate locations."},{"t":"Fixed partition allocation","c":true,"fb":"Fixed partition allocation uses fixed-sized partitions with one process per partition."},{"t":"Segmentation allocation","c":false,"fb":"Segmentation divides a process into variable-sized logical parts."}]},{"cat":"03","type":"fitb","stem":"To record which fixed memory partitions are free or occupied, the OS maintains a ____.","sub":"fixed-vs-dynamic-partitioning","subtype":"term","answer":["partition table"],"caseSensitive":false,"fb":"A partition table tracks the status of memory partitions; it does not map pages or segments."},{"cat":"03","type":"scenario","stem":"Which allocation strategy is being used?","sub":"fixed-vs-dynamic-partitioning","context":"An OS creates partitions sized to the processes requesting memory. This reduces wasted space, but fragmentation can still occur.","options":[{"t":"Fixed partition allocation","c":false,"fb":"Fixed partitions retain predetermined sizes rather than matching each process."},{"t":"Dynamic partition allocation","c":true,"fb":"Dynamic partitions vary with process sizes, reducing waste while still risking fragmentation."},{"t":"Paging allocation","c":false,"fb":"Paging divides processes and memory into equal-sized pages and frames."},{"t":"Monoprogramming allocation","c":false,"fb":"Monoprogramming uses one OS section and one user-program section."}]},{"cat":"03","type":"mcq","stem":"Which allocation method places a process in one continuous block of adjacent memory locations?","sub":"contiguous-vs-noncontiguous","options":[{"t":"Contiguous allocation","c":true,"fb":"Contiguous allocation keeps the process in a single continuous memory block."},{"t":"Non-contiguous allocation","c":false,"fb":"Non-contiguous allocation allows parts of a process to occupy separate locations."},{"t":"Paging allocation","c":false,"fb":"Paging is a non-contiguous method using pages and frames."},{"t":"Segmentation allocation","c":false,"fb":"Segmentation is a non-contiguous method using variable-sized segments."}]},{"cat":"03","type":"scenario","stem":"Which allocation category permits this arrangement?","sub":"contiguous-vs-noncontiguous","context":"A process is split into three parts. Each part occupies a different memory region, with other processes between the regions.","options":[{"t":"Contiguous allocation","c":false,"fb":"Contiguous allocation requires one continuous block for the process."},{"t":"Static loading","c":false,"fb":"Static loading concerns loading the entire program at a fixed address."},{"t":"Monoprogramming","c":false,"fb":"Monoprogramming provides an OS section and a single user-program section."},{"t":"Non-contiguous allocation","c":true,"fb":"Non-contiguous allocation permits process parts to occupy non-adjacent locations."}]},{"cat":"03","type":"fitb","stem":"In paging, physical memory is divided into fixed-sized blocks called ____, each matching the size of a page.","sub":"paging-vs-segmentation","subtype":"term","answer":["frames","frame"],"caseSensitive":false,"fb":"Pages divide the process, while same-sized frames divide physical memory."},{"cat":"03","type":"multi","stem":"Select the two correct pairings between an allocation technique and its mapping structure.","sub":"paging-vs-segmentation","options":[{"t":"Paging: segment table","c":false,"fb":"A segment table maps segments, not pages."},{"t":"Segmentation: partition table","c":false,"fb":"A partition table tracks memory partition status."},{"t":"Paging: page table","c":true,"fb":"A page table maps logical pages to physical frames."},{"t":"Paging: partition table","c":false,"fb":"Paging needs page-to-frame mappings rather than partition-status records."},{"t":"Segmentation: segment table","c":true,"fb":"A segment table maps logical segments to physical memory."}]},{"cat":"03","type":"fitb","stem":"An application is divided into variable-sized code, data, and stack regions; this memory allocation technique is ____.","sub":"paging-vs-segmentation","subtype":"term","answer":["segmentation"],"caseSensitive":false,"fb":"Segmentation uses variable-sized logical regions, whereas paging uses fixed-sized pages."},{"cat":"03","type":"mcq","stem":"Which placement algorithm chooses the smallest available memory block large enough for a process?","sub":"placement-algorithm-rules","options":[{"t":"First Fit","c":false,"fb":"First Fit selects the first suitable block in search order."},{"t":"Best Fit","c":true,"fb":"Best Fit selects the smallest available block that can hold the process."},{"t":"Worst Fit","c":false,"fb":"Worst Fit selects the largest available block."},{"t":"Next Fit","c":false,"fb":"Next Fit searches from the last allocation position rather than minimizing block size."}]},{"cat":"03","type":"multi","stem":"Select the three correct pairings of placement algorithms and selection rules.","sub":"placement-algorithm-rules","options":[{"t":"First Fit: first suitable block","c":true,"fb":"First Fit stops at the first block large enough for the process."},{"t":"Best Fit: largest available block","c":false,"fb":"Selecting the largest block is Worst Fit's rule."},{"t":"Worst Fit: largest available block","c":true,"fb":"Worst Fit chooses the largest available block."},{"t":"Next Fit: always restart at beginning","c":false,"fb":"Next Fit continues searching from the last allocation position."},{"t":"Next Fit: search from last allocation","c":true,"fb":"Next Fit uses the last allocation position as its search starting point."}]},{"cat":"03","type":"scenario","stem":"Which placement algorithm explains this search?","sub":"placement-algorithm-rules","context":"The last allocation used B2. For the next process, the OS searches B3, B4, and B5 before wrapping around to B1. It accepts the first block that fits.","options":[{"t":"Best Fit","c":false,"fb":"Best Fit compares suitable block sizes to select the smallest."},{"t":"Worst Fit","c":false,"fb":"Worst Fit selects the largest block rather than the first encountered fit."},{"t":"Next Fit","c":true,"fb":"Next Fit continues searching after the last allocation and wraps around if needed."},{"t":"First Fit","c":false,"fb":"First Fit starts its search at the beginning rather than continuing after B2."}]},{"cat":"03","type":"mcq","stem":"Starting with B1–B5 = 100, 500, 200, 300, 600 KB, allocate P1–P4 = 212, 417, 112, 426 KB in order, reusing block remainders; which algorithm allocates all four?","sub":"placement-algorithm-trace","options":[{"t":"First Fit","c":false,"fb":"First Fit assigns P1→B2, P2→B5, and P3→B2, leaving no block large enough for P4."},{"t":"Worst Fit","c":false,"fb":"Worst Fit assigns P1→B5, P2→B2, and P3→B5; P4 cannot fit afterward."},{"t":"Next Fit","c":false,"fb":"Next Fit assigns P1→B2, P2→B5, and P3→B2; P4 remains unallocated."},{"t":"Best Fit","c":true,"fb":"Best Fit assigns P1→B4, P2→B2, P3→B3, and P4→B5."}]},{"cat":"03","type":"mcq","stem":"Starting with B1–B5 = 100, 500, 200, 300, 600 KB, apply First Fit to P1–P4 = 212, 417, 112, 426 KB in order, reusing remainders; which proposed result is incorrect?","sub":"placement-algorithm-trace","options":[{"t":"P1 → B2","c":false,"fb":"This is correct: B1 is too small, so P1 takes B2."},{"t":"P2 → B5","c":false,"fb":"This is correct: after P1, B5 is the first block large enough for P2."},{"t":"P3 → B3","c":true,"fb":"This is incorrect: B2's 288 KB remainder is encountered first and fits P3."},{"t":"P4 → unallocated","c":false,"fb":"This is correct: after P3, no remaining block can hold 426 KB."}]},{"cat":"03","type":"scenario","stem":"How much free space remains in B5 immediately after P3 is allocated?","sub":"placement-algorithm-trace","context":"Initially, B1–B5 contain 100, 500, 200, 300, and 600 KB. P1–P4 request 212, 417, 112, and 426 KB in order. Worst Fit is used, and block remainders stay available.","options":[{"t":"276 KB","c":true,"fb":"P1 leaves 388 KB in B5; P2 uses B2; P3 then leaves 388 − 112 = 276 KB in B5."},{"t":"388 KB","c":false,"fb":"This is B5's remainder after P1; it ignores P3's allocation."},{"t":"174 KB","c":false,"fb":"This is B5's final remainder under Best Fit after P4, not the Worst Fit result."},{"t":"176 KB","c":false,"fb":"This is B2's remainder after P3 under First Fit or Next Fit."}]},{"cat":"03","type":"mcq","stem":"Which technique temporarily moves a process from main memory to disk so another process can run?","sub":"swapping","options":[{"t":"Segmentation","c":false,"fb":"Segmentation divides a process into variable-sized logical regions."},{"t":"Swapping","c":true,"fb":"Swapping temporarily transfers processes between main memory and secondary memory."},{"t":"Static linking","c":false,"fb":"Static linking combines program modules into one executable."},{"t":"Paging","c":false,"fb":"Paging divides processes into pages and memory into frames."}]},{"cat":"03","type":"scenario","stem":"What happens to P1 after it is loaded back?","sub":"swapping","context":"RAM holds P1 = 200 KB and P2 = 300 KB, filling its 500 KB capacity. P3 = 200 KB arrives. The OS stores P1 on disk and loads P3 into the freed space. Later, P1 is loaded back into RAM.","options":[{"t":"It remains permanently deleted","c":false,"fb":"Swapping temporarily stores P1 on disk; it does not delete the process."},{"t":"It becomes a free partition","c":false,"fb":"P1 remains a process, not a memory partition."},{"t":"It resumes execution","c":true,"fb":"A swapped-out process resumes once it is loaded back into main memory."},{"t":"It becomes a library stub","c":false,"fb":"A stub supports dynamic linking and is unrelated to restoring a swapped process."}]},{"cat":"03","type":"mcq","stem":"A 70 KB process occupies a fixed 100 KB partition; what describes the unused 30 KB inside that allocated partition?","sub":"internal-fragmentation","options":[{"t":"External fragmentation","c":false,"fb":"External fragmentation concerns scattered free blocks outside allocated partitions."},{"t":"Dynamic loading","c":false,"fb":"Dynamic loading delays loading routines until they are needed."},{"t":"Swapping","c":false,"fb":"Swapping transfers processes between RAM and disk."},{"t":"Internal fragmentation","c":true,"fb":"The unused space lies inside an allocated block larger than the process requires."}]},{"cat":"03","type":"fitb","stem":"Processes needing 70, 85, and 60 KB each receive a separate 100 KB fixed partition; their total internal fragmentation is ____ KB.","sub":"internal-fragmentation","subtype":"numeric","answer":["85"],"caseSensitive":false,"fb":"The unused spaces are 30, 15, and 40 KB; 30 + 15 + 40 = 85 KB."},{"cat":"03","type":"mcq","stem":"A process needs one contiguous 180 KB block, but the only free blocks are 50, 70, and 80 KB, separated by occupied regions; why does allocation fail despite 200 KB being free?","sub":"external-fragmentation","options":[{"t":"No single free block fits","c":true,"fb":"The largest free block is only 80 KB, so the process cannot obtain one contiguous 180 KB block."},{"t":"Total free memory is insufficient","c":false,"fb":"The total is 50 + 70 + 80 = 200 KB, which exceeds 180 KB."},{"t":"Unused space occupies allocated partitions","c":false,"fb":"That describes internal fragmentation, whereas these spaces are separate free blocks."},{"t":"The process already occupies RAM","c":false,"fb":"The process is requesting allocation; scattered free blocks are the stated obstacle."}]},{"cat":"03","type":"fitb","stem":"When enough total free memory exists but is scattered among non-adjacent blocks that cannot provide one sufficiently large contiguous block, the problem is called ____.","sub":"external-fragmentation","subtype":"term","answer":["external fragmentation"],"caseSensitive":false,"fb":"External fragmentation leaves sufficient total free space distributed between allocated regions, preventing a large contiguous allocation."},{"cat":"04","type":"mcq","stem":"Which component selects the ready process that receives the CPU?","sub":"cpu-scheduling-basics","options":[{"t":"Ready queue","c":false,"fb":"The ready queue holds eligible processes; it does not make scheduling decisions."},{"t":"Short-term scheduler","c":true,"fb":"The short-term scheduler chooses which ready process receives the processor."},{"t":"Gantt chart","c":false,"fb":"A Gantt chart represents execution order; it does not select processes."},{"t":"CPU burst","c":false,"fb":"A CPU burst describes processing time, not a scheduling component."}]},{"cat":"04","type":"scenario","stem":"Which scheduling purpose should guide the correction?","sub":"cpu-scheduling-basics","context":"Several processes share one processor. The scheduler repeatedly favors some processes while leaving others without an opportunity to execute.","options":[{"t":"Favoring earlier selections","c":false,"fb":"Repeatedly favoring the same processes can preserve unequal access."},{"t":"Maximizing individual waiting","c":false,"fb":"Increasing waiting does not address unfair processor allocation."},{"t":"Ensuring fair CPU access","c":true,"fb":"Scheduling aims to ensure fairness and minimize resource starvation."},{"t":"Preventing all process execution","c":false,"fb":"Blocking execution defeats the purpose of allocating the processor."}]},{"cat":"04","type":"mcq","stem":"Two algorithms have equal CPU utilization and throughput; which change in Algorithm B indicates better scheduling performance?","sub":"scheduling-criteria-direction","options":[{"t":"Longer turnaround time","c":false,"fb":"Longer turnaround means processes spend more time from submission to completion."},{"t":"Shorter waiting time","c":true,"fb":"Reducing time spent waiting in the ready queue improves scheduling performance."},{"t":"Longer response time","c":false,"fb":"A later first response is undesirable."},{"t":"Longer waiting time","c":false,"fb":"More ready-queue waiting worsens performance."}]},{"cat":"04","type":"multi","stem":"Select the three changes that move scheduling metrics in their desired directions.","sub":"scheduling-criteria-direction","options":[{"t":"Increased CPU utilization","c":true,"fb":"Greater utilization keeps the processor busy for more of the elapsed time."},{"t":"Increased turnaround time","c":false,"fb":"Turnaround time should decrease, not increase."},{"t":"Increased throughput","c":true,"fb":"Completing more processes per time unit is desirable."},{"t":"Increased response time","c":false,"fb":"Response time should decrease so the first response arrives sooner."},{"t":"Reduced waiting time","c":true,"fb":"Less ready-queue waiting is desirable."}]},{"cat":"04","type":"mcq","stem":"Which metric measures the number of processes completed per time unit?","sub":"scheduling-metric-definitions","options":[{"t":"Waiting time","c":false,"fb":"Waiting time measures time spent in the ready queue."},{"t":"Response time","c":false,"fb":"Response time measures the interval before the first response."},{"t":"Turnaround time","c":false,"fb":"Turnaround time measures the interval from submission to completion."},{"t":"Throughput","c":true,"fb":"Throughput counts completed processes per time unit."}]},{"cat":"04","type":"scenario","stem":"Which metric is represented by the interval from time 2 to time 7?","sub":"scheduling-metric-definitions","context":"A request is submitted at time 2. Its first response appears at time 7. The process finishes at time 18.","options":[{"t":"Response time","c":true,"fb":"Response time ends when the first response is produced."},{"t":"Turnaround time","c":false,"fb":"Turnaround would extend from time 2 to completion at time 18."},{"t":"Throughput","c":false,"fb":"Throughput counts completions per time unit rather than this request's delay."},{"t":"CPU utilization","c":false,"fb":"Utilization measures the percentage of elapsed time the CPU is busy."}]},{"cat":"04","type":"mcq","stem":"A process is submitted at time 2, produces its first response at time 7, and completes at time 18; what is its turnaround time?","sub":"scheduling-metric-definitions","options":[{"t":"5 time units","c":false,"fb":"This is the submission-to-first-response interval."},{"t":"11 time units","c":false,"fb":"This measures first response to completion, omitting the earlier interval."},{"t":"16 time units","c":true,"fb":"Turnaround covers the entire submission-to-completion interval: 18 − 2 = 16."},{"t":"18 time units","c":false,"fb":"The completion timestamp alone does not account for submission at time 2."}]},{"cat":"04","type":"mcq","stem":"Which criterion considers utilization of CPU, memory, I/O devices, and other resources together?","sub":"secondary-scheduling-criteria","options":[{"t":"Predictability","c":false,"fb":"Predictability concerns consistent response time."},{"t":"Balanced utilization","c":true,"fb":"Balanced utilization evaluates multiple system resources rather than CPU usage alone."},{"t":"Preferential treatment","c":false,"fb":"Preferential treatment favors processes with higher priorities."},{"t":"Fairness","c":false,"fb":"Fairness concerns execution opportunities and preventing starvation."}]},{"cat":"04","type":"multi","stem":"Select the three secondary criteria concerning resource balance, response consistency, or priority preference.","sub":"secondary-scheduling-criteria","options":[{"t":"Throughput","c":false,"fb":"Throughput is the primary metric for completions per time unit."},{"t":"Predictability","c":true,"fb":"Predictability concerns consistency in response time."},{"t":"Balanced utilization","c":true,"fb":"Balanced utilization considers CPU and other resource usage together."},{"t":"Response time","c":false,"fb":"Response time is a primary timing metric; consistency of response time is predictability."},{"t":"Preferential treatment","c":true,"fb":"Preferential treatment gives consideration to higher-priority processes."}]},{"cat":"04","type":"mcq","stem":"What distinguishes non-preemptive scheduling once a process begins running?","sub":"preemptive-vs-nonpreemptive","options":[{"t":"Runs until termination","c":true,"fb":"The selected process continues executing until it terminates."},{"t":"Stops at every arrival","c":false,"fb":"A new arrival does not automatically interrupt a non-preemptive process."},{"t":"Returns before burst completion","c":false,"fb":"Interruption before the burst is consumed describes preemptive behavior."},{"t":"Stops after each quantum","c":false,"fb":"Quantum-based interruption is associated with preemptive Round Robin."}]},{"cat":"04","type":"multi","stem":"Select the three algorithms that permit interruption of a running process before its CPU burst is fully consumed.","sub":"preemptive-vs-nonpreemptive","options":[{"t":"FCFS","c":false,"fb":"FCFS is non-preemptive and lets the running process finish."},{"t":"PP","c":true,"fb":"Preemptive Priority can interrupt a process when a higher-priority process arrives."},{"t":"SRTF","c":true,"fb":"Shortest Remaining Time First permits preemption."},{"t":"SJF","c":false,"fb":"The SJF version used here is non-preemptive."},{"t":"RR","c":true,"fb":"Round Robin can interrupt a process when its time slice expires."}]},{"cat":"04","type":"scenario","stem":"To which state is the interrupted process returned?","sub":"preemptive-vs-nonpreemptive","context":"A process is executing and still has unused CPU burst time. The operating system interrupts it so another ready process can run.","options":[{"t":"Running","c":false,"fb":"It has lost the CPU, so it is no longer the running process."},{"t":"Terminated","c":false,"fb":"Interruption does not mean its processing has finished."},{"t":"Not yet arrived","c":false,"fb":"An already executing process has necessarily arrived."},{"t":"Ready","c":true,"fb":"Preemption moves the interrupted process back to the ready state."}]},{"cat":"04","type":"mcq","stem":"Which expression calculates a process's turnaround time?","sub":"tat-wt-formulas","options":[{"t":"Start − arrival","c":false,"fb":"This gives waiting time when the process executes once without interruption."},{"t":"Completion − arrival","c":true,"fb":"Turnaround measures the interval from arrival to completion."},{"t":"Turnaround − burst","c":false,"fb":"This calculates waiting time."},{"t":"Completion − start","c":false,"fb":"This omits time before the first execution."}]},{"cat":"04","type":"mcq","stem":"A process arrives at time 4, starts at time 10, and runs uninterrupted for 6 units until time 16; what is its waiting time?","sub":"tat-wt-formulas","options":[{"t":"12 time units","c":false,"fb":"This is turnaround time: 16 − 4."},{"t":"10 time units","c":false,"fb":"The start timestamp must be reduced by the arrival time."},{"t":"6 time units","c":true,"fb":"Waiting is 10 − 4 = 6, also equal to (16 − 4) − 6."},{"t":"4 time units","c":false,"fb":"The arrival timestamp is not the waiting duration."}]},{"cat":"04","type":"scenario","stem":"What is its total waiting time?","sub":"tat-wt-formulas","context":"A process arrives at time 3 with a total CPU burst of 5 units. It runs from time 5 to 7, is preempted, then runs from time 11 to 14 and completes.","options":[{"t":"6 time units","c":true,"fb":"Turnaround is 14 − 3 = 11; waiting is 11 − 5 = 6."},{"t":"2 time units","c":false,"fb":"First start minus arrival counts only the initial wait and omits waiting after preemption."},{"t":"7 time units","c":false,"fb":"Completion minus the first interruption is not total waiting time."},{"t":"11 time units","c":false,"fb":"This is turnaround time and still includes the CPU burst."}]},{"cat":"04","type":"mcq","stem":"The CPU executes 18 units of total burst time during 24 elapsed units; what is its utilization?","sub":"cpu-utilization-calculation","options":[{"t":"25%","c":false,"fb":"This is the idle percentage: (24 − 18) ÷ 24 × 100."},{"t":"100%","c":false,"fb":"Six elapsed units are idle, so utilization is below 100%."},{"t":"133.3%","c":false,"fb":"This reverses the ratio by dividing elapsed time by burst time."},{"t":"75%","c":true,"fb":"Utilization is 18 ÷ 24 × 100 = 75%."}]},{"cat":"04","type":"scenario","stem":"What is CPU utilization over the entire interval?","sub":"cpu-utilization-calculation","context":"During a 25-unit observation interval, the CPU executes one process for 8 units and another for 12 units. It is idle for the remaining 5 units.","options":[{"t":"100%","c":false,"fb":"Dividing busy time by busy time incorrectly excludes the idle interval."},{"t":"80%","c":true,"fb":"Total burst time is 20; utilization is 20 ÷ 25 × 100 = 80%."},{"t":"20%","c":false,"fb":"This is the idle fraction, not the busy fraction."},{"t":"25%","c":false,"fb":"This divides idle time by busy time rather than busy time by elapsed time."}]},{"cat":"04","type":"fitb","stem":"In FCFS, the delay caused when one long front process forces shorter processes behind it to wait is called the ____.","sub":"fcfs-convoy-effect","subtype":"term","answer":["convoy effect"],"caseSensitive":false,"fb":"The convoy effect occurs because FCFS processes jobs in arrival order and cannot interrupt the long front process."},{"cat":"04","type":"scenario","stem":"Which execution order follows FCFS and produces the convoy effect?","sub":"fcfs-convoy-effect","context":"Under FCFS, a 20-unit process begins at time 0. Two 1-unit processes arrive at times 1 and 2 while it is running.","options":[{"t":"First short, second short, long","c":false,"fb":"FCFS cannot move both later short processes ahead of the running long process."},{"t":"Long, second short, first short","c":false,"fb":"After the long process, the earlier short arrival must precede the later one."},{"t":"Long, first short, second short","c":true,"fb":"The long process finishes first, and the shorter processes follow in arrival order."},{"t":"Second short, first short, long","c":false,"fb":"This reverses arrival order and bypasses the process already running."}]},{"cat":"04","type":"fitb","stem":"For FCFS turnaround times of 13, 15, 14, 13, and 20 units, the average turnaround time is ____ units.","sub":"fcfs-worked-schedule","subtype":"numeric","answer":["15"],"caseSensitive":false,"fb":"The total turnaround time is 75 units; dividing by five jobs gives 15."},{"cat":"04","type":"scenario","stem":"What is their average waiting time?","sub":"fcfs-worked-schedule","context":"Five jobs execute under FCFS. Each line gives arrival time and CPU burst:\n```text\nJ1: arrival 0, burst 13\nJ2: arrival 3, burst 5\nJ3: arrival 8, burst 4\nJ4: arrival 15, burst 6\nJ5: arrival 17, burst 9\n```","options":[{"t":"7.60 units","c":true,"fb":"Waiting times are 0, 10, 10, 7, and 11; their sum is 38, giving 38 ÷ 5 = 7.60."},{"t":"7.40 units","c":false,"fb":"This belongs to the SJF order, which runs J3 before J2."},{"t":"15.00 units","c":false,"fb":"This is the FCFS average turnaround time, which includes CPU execution."},{"t":"9.00 units","c":false,"fb":"This belongs to the NPP order rather than arrival-order execution."}]},{"cat":"04","type":"mcq","stem":"Which rule resolves equal CPU burst times among ready processes under non-preemptive SJF?","sub":"sjf-selection-rules","options":[{"t":"Highest assigned priority","c":false,"fb":"SJF uses FCFS for equal bursts, not assigned priority."},{"t":"Latest arrival first","c":false,"fb":"This reverses the FCFS tie-breaking order."},{"t":"Shortest remaining time","c":false,"fb":"This describes SRTF's selection basis rather than SJF's equal-burst tie-breaker."},{"t":"Earliest arrival first","c":true,"fb":"SJF breaks equal-burst ties using FCFS."}]},{"cat":"04","type":"fitb","stem":"Under SJF, a long process waiting indefinitely because shorter processes keep arriving experiences ____.","sub":"sjf-selection-rules","subtype":"term","answer":["starvation"],"caseSensitive":false,"fb":"Repeated selection of shorter arrived jobs can prevent a long ready process from receiving the CPU."},{"cat":"04","type":"scenario","stem":"Which process executes next, and until when?","sub":"sjf-selection-rules","context":"Non-preemptive SJF makes a selection at time 10. A arrived at time 2 with burst 6; B arrived at time 7 with burst 3; C will arrive at time 12 with burst 1. No process is currently running.","options":[{"t":"A until time 16","c":false,"fb":"A arrived earlier, but B has the shorter burst among arrived jobs."},{"t":"B until time 13","c":true,"fb":"B has the shortest available burst and runs its full 3 units without interruption."},{"t":"C until time 13","c":false,"fb":"C has not arrived at the selection time and cannot be chosen."},{"t":"B until time 12","c":false,"fb":"C's later arrival cannot interrupt B under non-preemptive SJF."}]},{"cat":"04","type":"mcq","stem":"For non-preemptive SJF, J1–J5 have arrivals (0, 3, 8, 15, 17) and bursts (13, 5, 4, 6, 9); which execution order results?","sub":"sjf-worked-schedule","options":[{"t":"J1–J2–J3–J4–J5","c":false,"fb":"This follows FCFS; SJF selects J3 before J2 at time 13."},{"t":"J3–J2–J4–J5–J1","c":false,"fb":"Sorting all jobs by burst ignores arrival times; only J1 is available initially."},{"t":"J1–J3–J2–J4–J5","c":true,"fb":"J1 finishes first, then the shortest arrived jobs are selected at each completion."},{"t":"J1–J2–J4–J5–J3","c":false,"fb":"This is the NPP order, determined by assigned priorities."}]},{"cat":"04","type":"scenario","stem":"What are the average turnaround and waiting times, respectively?","sub":"sjf-worked-schedule","context":"A non-preemptive SJF schedule produces these results:\n```text\nJob:        J1  J2  J3  J4  J5\nArrival:     0   3   8  15  17\nBurst:      13   5   4   6   9\nCompletion: 13  22  17  28  37\n```","options":[{"t":"14.80 and 7.40","c":true,"fb":"Turnaround totals 74 and waiting totals 37; dividing each by five gives these averages."},{"t":"15.00 and 7.60","c":false,"fb":"These are the FCFS averages, based on J2 executing before J3."},{"t":"16.40 and 9.00","c":false,"fb":"These are the NPP averages, based on priority ordering."},{"t":"23.40 and 16.00","c":false,"fb":"These result from averaging completion timestamps as turnaround, then subtracting the average burst."}]},{"cat":"04","type":"mcq","stem":"At an NPP selection point, ready jobs A, B, and C have priorities 5, 2, and 4, respectively; which job runs next?","sub":"npp-selection-rules","options":[{"t":"A, then runs to completion","c":false,"fb":"Priority 5 is lower than priorities 2 and 4; larger numbers do not mean higher priority."},{"t":"C, then runs to completion","c":false,"fb":"Priority 4 is lower than B's priority 2."},{"t":"B, then stops at any arrival","c":false,"fb":"B is selected, but non-preemptive execution is not interrupted by a new arrival."},{"t":"B, then runs to completion","c":true,"fb":"B has the lowest priority number and therefore the highest priority; NPP lets it finish."}]},{"cat":"04","type":"multi","stem":"Select the three rules or risks that apply to non-preemptive priority scheduling.","sub":"npp-selection-rules","options":[{"t":"Larger priority numbers win","c":false,"fb":"Lower priority numbers represent higher priorities."},{"t":"Consider only arrived processes","c":true,"fb":"Selection is restricted to processes already in the ready queue."},{"t":"Break priority ties using FCFS","c":true,"fb":"Equal-priority processes are ordered by arrival."},{"t":"Interrupt on higher-priority arrival","c":false,"fb":"This is preemptive priority behavior; NPP lets the running process finish."},{"t":"Low-priority processes risk starvation","c":true,"fb":"Repeated selection of higher-priority processes can leave lower-priority processes waiting."}]},{"cat":"04","type":"mcq","stem":"For NPP with J1–J5 arrivals (0, 3, 8, 15, 17), bursts (13, 5, 4, 6, 9), and priorities (4, 3, 5, 1, 2), which execution order results?","sub":"npp-worked-schedule","options":[{"t":"J1–J2–J3–J4–J5","c":false,"fb":"This is arrival order; NPP gives J4 and J5 priority over J3."},{"t":"J1–J2–J4–J5–J3","c":true,"fb":"At each completion, NPP selects the arrived job with the lowest priority number."},{"t":"J1–J3–J2–J4–J5","c":false,"fb":"This is the SJF order, based on CPU burst lengths."},{"t":"J4–J5–J2–J1–J3","c":false,"fb":"This sorts all priorities without checking arrivals; J4 is unavailable at time 0."}]},{"cat":"04","type":"mcq","stem":"An NPP schedule has turnaround times (13, 15, 29, 9, 16) and corresponding bursts (13, 5, 4, 6, 9); what is its average waiting time?","sub":"npp-worked-schedule","options":[{"t":"16.40 units","c":false,"fb":"This is average turnaround time, before removing CPU execution time."},{"t":"7.40 units","c":false,"fb":"This is the average burst time, not the average waiting time."},{"t":"9.00 units","c":true,"fb":"Waiting times are 0, 10, 25, 3, and 7; 45 ÷ 5 = 9."},{"t":"25.00 units","c":false,"fb":"This is J3's individual waiting time, not the five-job average."}]},{"cat":"04","type":"mcq","stem":"Which arrival immediately interrupts a running process under preemptive priority scheduling?","sub":"pp-preemption-rule","options":[{"t":"A higher-priority process","c":true,"fb":"A newly arriv
