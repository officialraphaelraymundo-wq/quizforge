ed higher-priority process immediately preempts the running process."},{"t":"A lower-priority process","c":false,"fb":"A lower-priority arrival does not displace a higher-priority running process."},{"t":"Any shorter-burst process","c":false,"fb":"PP compares priority, not burst length."},{"t":"Any newly arrived process","c":false,"fb":"Arrival alone is insufficient; the new process must have higher priority."}]},{"cat":"04","type":"mcq","stem":"Which outcome is NOT guaranteed when preemptive priority allows higher-priority arrivals to interrupt lower-priority execution?","sub":"pp-preemption-rule","options":[{"t":"Interrupting lower-priority execution","c":false,"fb":"This is the specified behavior when a higher-priority process arrives."},{"t":"Starting higher-priority arrivals immediately","c":false,"fb":"Immediate execution of a higher-priority arrival is the preemption rule."},{"t":"Returning interrupted processes to ready","c":false,"fb":"Interrupted unfinished processes return to the ready state."},{"t":"Reducing average waiting time","c":true,"fb":"Preemption may increase lower-priority waiting and does not guarantee a lower overall average."}]},{"cat":"04","type":"mcq","stem":"For PP with J1–J5 arrivals (0, 3, 8, 15, 17), bursts (13, 5, 4, 6, 9), and priorities (4, 3, 5, 1, 2), which execution sequence results?","sub":"pp-worked-schedule","options":[{"t":"J1–J2–J4–J5–J3","c":false,"fb":"This is the non-preemptive priority sequence and omits interrupted J1 segments."},{"t":"J1–J2–J1–J4–J5–J1–J3","c":true,"fb":"J2 and J4 interrupt J1; J5 follows J4, then J1 finishes before J3."},{"t":"J1–J2–J3–J1–J4–J1–J5","c":false,"fb":"This follows remaining-time selection rather than the specified priorities."},{"t":"J1–J2–J1–J4–J1–J5–J3","c":false,"fb":"After J4 finishes, J5's priority 2 places it ahead of J1's priority 4."}]},{"cat":"04","type":"scenario","stem":"What are the average turnaround and waiting times, respectively?","sub":"pp-worked-schedule","context":"A PP schedule has execution segments J1(0–3), J2(3–8), J1(8–15), J4(15–21), J5(21–30), J1(30–33), and J3(33–37). Job data are:\n```text\nJob:     J1  J2  J3  J4  J5\nArrival:  0   3   8  15  17\nBurst:   13   5   4   6   9\n```","options":[{"t":"16.40 and 9.00","c":false,"fb":"These are the NPP averages, which exclude the PP interruption pattern."},{"t":"25.80 and 18.40","c":false,"fb":"These incorrectly treat completion timestamps as turnaround times before subtracting bursts."},{"t":"17.20 and 9.80","c":true,"fb":"Turnaround times total 86 and waiting times total 49; dividing each by five gives these averages."},{"t":"17.20 and 0.80","c":false,"fb":"Using only first start minus arrival misses J1's and J3's later waiting; use turnaround minus burst."}]},{"cat":"04","type":"mcq","stem":"Under SRTF, what must a newly arrived process have to preempt the running process?","sub":"srtf-preemption-rule","options":[{"t":"An earlier arrival time","c":false,"fb":"Earlier arrival alone does not determine SRTF selection; remaining burst time does."},{"t":"A shorter remaining burst","c":true,"fb":"SRTF preempts when the new process needs less remaining CPU time than the running process."},{"t":"A higher assigned priority","c":false,"fb":"Assigned priority determines priority scheduling, not SRTF selection."},{"t":"A longer original burst","c":false,"fb":"SRTF favors the shortest remaining burst, not the longest original burst."}]},{"cat":"04","type":"scenario","stem":"Which decision correctly applies the preemption rule?","sub":"srtf-preemption-rule","context":"Under SRTF, process A originally needed 13 units and has already executed for 10 units. Process B now arrives needing 4 units. No other process is ready.","options":[{"t":"Switch to B; 4 < 13","c":false,"fb":"This compares B with A’s original burst instead of A’s remaining burst."},{"t":"Switch to B; arrivals preempt","c":false,"fb":"A new arrival causes preemption only when its remaining burst is shorter."},{"t":"Continue A; 3 < 4","c":true,"fb":"A has 13 − 10 = 3 units remaining, which is shorter than B’s 4 units."},{"t":"Continue A; SRTF forbids preemption","c":false,"fb":"SRTF allows preemption, but B does not satisfy the condition here."}]},{"cat":"04","type":"fitb","stem":"The average turnaround time is ____ time units.","sub":"srtf-worked-schedule","subtype":"number","answer":["12.6"],"caseSensitive":false,"fb":"Turnaround times are 28, 5, 4, 6, and 20. Their sum is 63; 63 ÷ 5 = 12.6."},{"cat":"04","type":"scenario","stem":"What is the average waiting time?","sub":"srtf-worked-schedule","context":"Five jobs finish under SRTF with turnaround times 28, 5, 4, 6, and 20. Their corresponding CPU bursts are 13, 5, 4, 6, and 9. Some jobs execute in several separate intervals.","options":[{"t":"12.60 units","c":false,"fb":"This is the average turnaround time; it still includes CPU execution."},{"t":"7.40 units","c":false,"fb":"This is the average CPU burst, 37 ÷ 5, rather than the average waiting time."},{"t":"0.00 units","c":false,"fb":"Preemption and delayed execution make J1 and J5 wait even though other jobs have zero waiting time."},{"t":"5.20 units","c":true,"fb":"Waiting times are turnaround minus burst: 15, 0, 0, 0, and 11. Their average is 26 ÷ 5 = 5.20."}]},{"cat":"04","type":"mcq","stem":"What specifies the CPU time allowed for one turn in round-robin scheduling?","sub":"rr-quantum-mechanics","options":[{"t":"Assigned process priority","c":false,"fb":"Round robin uses queue turns and a time limit rather than assigned priority."},{"t":"Time slice or quantum","c":true,"fb":"The quantum specifies the CPU time allocated during each turn."},{"t":"Original arrival time","c":false,"fb":"Arrival affects entry into the ready queue, not the duration of a turn."},{"t":"Total turnaround time","c":false,"fb":"Turnaround measures time from arrival to completion, not the allocated turn length."}]},{"cat":"04","type":"scenario","stem":"What happens when A uses its full turn?","sub":"rr-quantum-mechanics","context":"Round robin uses a quantum of 3 units. Process A starts a turn with 5 units remaining. Processes B and C are waiting in that order; no new process arrives.","options":[{"t":"A finishes; B then C wait","c":false,"fb":"A still has 2 units remaining, so it cannot finish."},{"t":"A runs 2 more; B and C wait","c":false,"fb":"An unfinished process must yield when its quantum expires."},{"t":"A keeps 2; queue becomes B–C–A","c":true,"fb":"A uses 3 units, retains 2, and returns to the queue’s tail."},{"t":"A keeps 2; queue becomes A–B–C","c":false,"fb":"A returns to the tail, not the front."}]},{"cat":"04","type":"multi","stem":"Select the THREE events that follow round-robin queue and completion rules.","sub":"rr-quantum-mechanics","options":[{"t":"Arriving jobs enter the tail","c":true,"fb":"New arrivals are placed at the end of the circular ready queue."},{"t":"Unfinished jobs reclaim the front","c":false,"fb":"A job whose quantum expires returns to the tail."},{"t":"Completed jobs leave the queue","c":true,"fb":"A job terminates after its required CPU burst is fully consumed."},{"t":"Highest-priority jobs bypass the queue","c":false,"fb":"Round robin selects jobs by queue order, not assigned priority."},{"t":"Expired unfinished jobs enter the tail","c":true,"fb":"Preemption at quantum expiry returns an unfinished job to the queue’s end."}]},{"cat":"04","type":"scenario","stem":"At what time does J2 complete?","sub":"rr-worked-schedule","context":"Round robin uses a quantum of 3. J2 arrives at time 3 with a burst of 5. J2 runs from 3 to 6, waits while J1 runs from 6 to 9, and then resumes.","options":[{"t":"11","c":true,"fb":"J2 has 2 units remaining at time 9, so it finishes at 9 + 2 = 11."},{"t":"8","c":false,"fb":"This assumes J2 runs continuously for 5 units after arriving, ignoring its interruption."},{"t":"9","c":false,"fb":"Time 9 is when J2 resumes; its remaining 2 units still need execution."},{"t":"12","c":false,"fb":"J2 needs only 2 more units, so it does not consume the full 3-unit quantum."}]},{"cat":"04","type":"mcq","stem":"For five jobs under RR with quantum 3, total turnaround is 87 and total CPU burst is 37; what is their average waiting time?","sub":"rr-worked-schedule","options":[{"t":"17.40 units","c":false,"fb":"This is 87 ÷ 5, the average turnaround time."},{"t":"7.40 units","c":false,"fb":"This is 37 ÷ 5, the average CPU burst."},{"t":"50.00 units","c":false,"fb":"This is the total waiting time, 87 − 37, before dividing by five jobs."},{"t":"10.00 units","c":true,"fb":"Total waiting is 87 − 37 = 50; average waiting is 50 ÷ 5 = 10.00."}]},{"cat":"04","type":"multi","stem":"For one five-job workload, average turnaround times are FCFS 15.0, SJF 14.8, NPP 16.4, and PP 17.2. Select the THREE supported comparisons.","sub":"algorithm-performance-comparison","options":[{"t":"SJF performs worse than FCFS","c":false,"fb":"SJF’s 14.8 is lower than FCFS’s 15.0; lower turnaround is better."},{"t":"NPP performs worse than SJF","c":true,"fb":"NPP averages 16.4, compared with SJF’s lower 14.8."},{"t":"PP performs better than NPP","c":false,"fb":"PP averages 17.2, which is higher than NPP’s 16.4."},{"t":"SJF performs better than FCFS","c":true,"fb":"SJF has the lower average turnaround, 14.8 versus 15.0."},{"t":"PP performs worse than NPP","c":true,"fb":"Adding preemption increases average turnaround in this workload."}]},{"cat":"04","type":"scenario","stem":"Which explanation fits these results?","sub":"algorithm-performance-comparison","context":"A workload produces these average waiting times: FCFS: 7.60; SJF: 7.40; NPP: 9.00; PP: 9.80. SJF selects shorter available jobs, while NPP and PP use assigned priorities.","options":[{"t":"Priority ordering guarantees shorter waits","c":false,"fb":"Both priority algorithms have higher average waiting times than FCFS and SJF here."},{"t":"Short jobs help; preemption need not","c":true,"fb":"SJF improves the average by favoring shorter jobs, while PP performs worse than NPP in this case."},{"t":"Preemption eliminates all waiting time","c":false,"fb":"PP still produces waiting, including additional waiting for interrupted processes."},{"t":"Arrival ordering always minimizes waiting","c":false,"fb":"FCFS follows arrival order, yet SJF achieves a lower average waiting time here."}]},{"cat":"04","type":"mcq","stem":"What is the main purpose of process coordination?","sub":"process-coordination-objectives","options":[{"t":"Rank processes solely by burst","c":false,"fb":"Burst-based ranking describes a scheduling choice, not the overall purpose of coordination."},{"t":"Give processes unrestricted shared access","c":false,"fb":"Uncontrolled simultaneous access can corrupt shared data."},{"t":"Manage safe cooperation among processes","c":true,"fb":"Coordination supports correct execution, effective communication, and safe resource sharing."},{"t":"Prevent communication among cooperating processes","c":false,"fb":"Coordination enables and organizes communication rather than preventing it."}]},{"cat":"04","type":"multi","stem":"A system runs several cooperating processes that share data and devices. Select the THREE outcomes process coordination should achieve.","sub":"process-coordination-objectives","options":[{"t":"Preserve shared-data integrity","c":true,"fb":"Maintaining consistent and correct shared data is a coordination objective."},{"t":"Permit conflicting simultaneous updates","c":false,"fb":"Conflicting updates can cause corruption; coordination controls such access."},{"t":"Coordinate cooperating processes’ communication","c":true,"fb":"Coordination organizes information exchange between cooperating processes."},{"t":"Prevent resource starvation","c":true,"fb":"Preventing starvation is one of the problems coordination addresses."},{"t":"Leave circular waits unresolved","c":false,"fb":"Unresolved circular resource waits can produce deadlocks, which coordination aims to prevent or handle."}]},{"cat":"04","type":"mcq","stem":"What does process synchronization establish for concurrent access to shared resources?","sub":"process-synchronization","options":[{"t":"Uncontrolled simultaneous resource access","c":false,"fb":"Uncontrolled access can produce inconsistent results."},{"t":"Execution ordered by arrival only","c":false,"fb":"Arrival-based CPU selection is FCFS, not the defining function of synchronization."},{"t":"Communication limited to network sockets","c":false,"fb":"Synchronization concerns orderly execution and resource access, not one communication mechanism."},{"t":"An orderly, controlled access sequence","c":true,"fb":"Synchronization coordinates critical operations so shared resources are accessed in a proper sequence."}]},{"cat":"04","type":"scenario","stem":"Which mechanism directly explains this ordered updating?","sub":"process-synchronization","context":"Two employee processes update the same product’s inventory. Both attempt to modify the quantity at the same time. The system delays the second update until the first update completes.","options":[{"t":"Process synchronization","c":true,"fb":"Synchronization ensures one critical update finishes before another begins."},{"t":"Shortest-job-first scheduling","c":false,"fb":"Choosing CPU jobs by burst length does not itself establish an orderly sequence for shared-data updates."},{"t":"Interprocess message exchange","c":false,"fb":"Exchanging information does not by itself describe the enforced update sequence in this case."},{"t":"Deadlock detection","c":false,"fb":"The system is ordering updates, not identifying processes waiting indefinitely for each other’s resources."}]},{"cat":"04","type":"fitb","stem":"The semaphore wait operation, which decreases its integer counter, is denoted by ____.","sub":"semaphore-vs-mutex","subtype":"term","answer":["P","wait","wait (P)"],"caseSensitive":false,"fb":"P denotes wait; V denotes signal. Wait decreases the semaphore value."},{"cat":"04","type":"fitb","stem":"The operation responsible for this increase is denoted by ____.","sub":"semaphore-vs-mutex","subtype":"term","answer":["V","signal","signal (V)"],"caseSensitive":false,"fb":"V denotes signal and increases the semaphore value; P denotes wait and decreases it."},{"cat":"04","type":"multi","stem":"Select the THREE properties that correctly distinguish semaphore operations and mutex ownership.","sub":"semaphore-vs-mutex","options":[{"t":"Signal decreases the semaphore counter","c":false,"fb":"Signal, or V, increases the counter; wait, or P, decreases it."},{"t":"Semaphores use an integer counter","c":true,"fb":"A semaphore coordinates access through an integer value."},{"t":"Any thread can unlock a mutex","c":false,"fb":"Only the thread or process that locked the mutex can unlock it."},{"t":"Wait decreases the semaphore counter","c":true,"fb":"The wait operation, P, decreases the semaphore value."},{"t":"Mutex unlocking requires the owner","c":true,"fb":"Mutex ownership restricts unlocking to the thread or process that acquired the lock."}]},{"cat":"04","type":"fitb","stem":"The portion of a program that accesses or modifies shared variables, files, or hardware devices is called the ____.","sub":"mutual-exclusion-critical-section","subtype":"term","answer":["critical section"],"caseSensitive":false,"fb":"A critical section contains shared-resource operations whose simultaneous execution may produce inconsistent results."},{"cat":"04","type":"mcq","stem":"Several processes want to write directly to one printer; which principle permits only one process to access it at a time?","sub":"mutual-exclusion-critical-section","options":[{"t":"Interprocess communication","c":false,"fb":"IPC enables information exchange; it does not by itself guarantee exclusive printer access."},{"t":"Deadlock avoidance","c":false,"fb":"Avoidance checks whether granting resource requests preserves a safe state."},{"t":"Mutual exclusion","c":true,"fb":"Mutual exclusion allows only one process at a time to access a shared resource."},{"t":"CPU burst estimation","c":false,"fb":"Estimating CPU time does not enforce exclusive access to a printer."}]},{"cat":"04","type":"multi","stem":"Select the THREE mechanisms used to implement mutual exclusion.","sub":"mutual-exclusion-critical-section","options":[{"t":"Mutex locks","c":true,"fb":"Mutex locks restrict critical-section access to one owner at a time."},{"t":"Network sockets","c":false,"fb":"Sockets provide network communication; they are not identified here as mutual-exclusion mechanisms."},{"t":"Binary semaphores","c":true,"fb":"Binary semaphores use values 0 and 1 to allow one process to access a resource at a time."},{"t":"Message queues","c":false,"fb":"Message queues support information exchange through OS-managed queues."},{"t":"Monitors","c":true,"fb":"Monitors are included among mechanisms implementing mutual exclusion."}]},{"cat":"04","type":"mcq","stem":"Which IPC mechanism enables processes on different computers to communicate through a network?","sub":"ipc-mechanisms","options":[{"t":"Ordinary pipes","c":false,"fb":"Ordinary pipes provide one-way communication between related processes."},{"t":"Sockets","c":true,"fb":"Sockets support communication between processes on different computers through a network."},{"t":"Shared memory","c":false,"fb":"Shared memory exchanges information through a common memory region."},{"t":"Signals","c":false,"fb":"Signals notify a process that an event has occurred."}]},{"cat":"04","type":"fitb","stem":"A process receives a notification that a particular event occurred; the IPC mechanism used for such event notifications is ____.","sub":"ipc-mechanisms","subtype":"term","answer":["signals","signal"],"caseSensitive":false,"fb":"Signals notify processes about events, whereas message queues exchange messages and shared memory exposes a common memory region."},{"cat":"04","type":"multi","stem":"Select the THREE correctly matched IPC mechanisms and functions.","sub":"ipc-mechanisms","options":[{"t":"Ordinary pipes: unrelated-process communication","c":false,"fb":"Ordinary pipes connect related processes; named pipes allow communication between unrelated processes."},{"t":"Shared memory: common memory region","c":true,"fb":"Processes exchange information by accessing the same memory region."},{"t":"Named pipes: unrelated-process communication","c":true,"fb":"Named pipes allow unrelated processes to communicate."},{"t":"Signals: common memory region","c":false,"fb":"Signals provide event notification; common-region access describes shared memory."},{"t":"Message queues: OS-managed message exchange","c":true,"fb":"Message queues exchange messages through queues managed by the operating system."}]},{"cat":"04","type":"mcq","stem":"What does resource sharing require the OS to do with limited system resources?","sub":"resource-sharing","options":[{"t":"Allocate them efficiently and fairly","c":true,"fb":"Resource sharing controls allocation and use so multiple processes can share limited resources."},{"t":"Give every process unrestricted access","c":false,"fb":"Unrestricted access can produce conflicts and inconsistent results."},{"t":"Reserve every resource permanently","c":false,"fb":"Permanent reservation prevents resources from being shared among processes."},{"t":"Distribute only CPU execution time","c":false,"fb":"Resource sharing also covers memory, files, printers, and other resources."}]},{"cat":"04","type":"scenario","stem":"Which action best applies controlled resource sharing?","sub":"resource-sharing","context":"Several users submit documents to one printer. The printer can service only one document at a time. The OS must organize access so all submitted jobs can be served.","options":[{"t":"Allow every job to write simultaneously","c":false,"fb":"Simultaneous direct access can mix output instead of controlling use of the printer."},{"t":"Reserve the printer for its first user","c":false,"fb":"Permanent reservation prevents other users from sharing the limited device."},{"t":"Discard all jobs after the first","c":false,"fb":"Discarding later jobs does not provide fair access to the shared resource."},{"t":"Queue jobs and service one at a time","c":true,"fb":"Queuing print jobs controls access to the single printer and allows jobs to be served in sequence."}]},{"cat":"04","type":"mcq","stem":"Which situation defines a deadlock?","sub":"deadlock-definition","options":[{"t":"Processes take turns using resources","c":false,"fb":"Taking turns allows progress and is an example of controlled access."},{"t":"One process waits behind another","c":false,"fb":"Ordinary queuing can end when the current user releases the resource."},{"t":"Processes indefinitely await each other’s resources","c":true,"fb":"Deadlocked processes cannot proceed because each waits for a resource held by another."},{"t":"Processes receive shorter CPU turns","c":false,"fb":"Shorter CPU turns describe scheduling behavior and do not establish a deadlock."}]},{"cat":"04","type":"fitb","stem":"This resource-waiting situation is a ____.","sub":"deadlock-definition","subtype":"term","answer":["deadlock"],"caseSensitive":false,"fb":"Each process waits indefinitely for a resource held by the other, preventing both from continuing."},{"cat":"04","type":"mcq","stem":"What distinguishes deadlock prevention from avoidance?","sub":"deadlock-prevention-vs-avoidance","options":[{"t":"Periodically detecting existing circular waits","c":false,"fb":"Periodic checks for an existing deadlock describe detection."},{"t":"Preventing a necessary condition from occurring","c":true,"fb":"Prevention stops a necessary deadlock condition from arising; avoidance evaluates requests for safe allocation."},{"t":"Granting requests only in safe states","c":false,"fb":"Checking that requests preserve a safe state describes avoidance."},{"t":"Terminating processes after detecting deadlock","c":false,"fb":"Termination after detection is a recovery method."}]},{"cat":"04","type":"scenario","stem":"Which deadlock strategy is being applied?","sub":"deadlock-prevention-vs-avoidance","context":"Process A already holds a printer and requests a scanner. Before granting the scanner, the OS evaluates whether the resulting allocation would remain safe. The request is temporarily denied because it would leave an unsafe state.","options":[{"t":"Deadlock recovery","c":false,"fb":"Recovery eliminates a deadlock that has already been detected."},{"t":"Deadlock detection","c":false,"fb":"Detection checks whether deadlock has occurred; this decision evaluates a request before granting it."},{"t":"Deadlock avoidance","c":true,"fb":"Avoidance grants requests only when the resulting allocation keeps the system in a safe state."},{"t":"Deadlock prevention","c":false,"fb":"Prevention removes a necessary condition, such as requiring all needed resources to be requested together before starting."}]},{"cat":"04","type":"multi","stem":"Select the TWO actions that exemplify prevention or avoidance, rather than detection or recovery.","sub":"deadlock-prevention-vs-avoidance","options":[{"t":"Require all needed resources up front","c":true,"fb":"Requesting needed resources together prevents a process from holding one while waiting for another."},{"t":"Terminate an already deadlocked process","c":false,"fb":"Terminating a deadlocked process is recovery."},{"t":"Restore a deadlocked process’s checkpoint","c":false,"fb":"Rolling back an affected process is recovery."},{"t":"Deny requests that leave unsafe states","c":true,"fb":"Avoidance evaluates requests and denies those that would leave an unsafe state."},{"t":"Periodically check for existing circular waits","c":false,"fb":"Periodic checks for circular waiting exemplify detection."}]},{"cat":"04","type":"mcq","stem":"Which strategy periodically checks whether circular resource waiting has produced a deadlock?","sub":"deadlock-detection-recovery","options":[{"t":"Deadlock detection","c":true,"fb":"Detection checks wh // The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Java syntax highlighting for the code box.
// Tokenises the RAW source and escapes each token as it wraps it. Never run
// a highlighter over already-escaped HTML -- it tears &quot; and &lt; apart.
// Comments and strings come first in the alternation, so a keyword sitting
// inside a string or a comment is not coloured.
const JAVA_KEYWORDS = /^(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|record|sealed|permits|yield)$/;
const JAVA_TOKEN_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function highlightJava(src) {
  let out = '', last = 0, m;
  JAVA_TOKEN_RE.lastIndex = 0;
  while ((m = JAVA_TOKEN_RE.exec(src)) !== null) {
    if (m.index > last) out += escapeHtml(src.slice(last, m.index));
    const txt = m[0];
    let cls = null;
    if (m[1]) cls = 'tok-comment';
    else if (m[2]) cls = 'tok-string';
    else if (m[3]) cls = 'tok-annot';
    else if (m[4]) cls = 'tok-num';
    else if (m[5]) {
      if (JAVA_KEYWORDS.test(m[5])) cls = 'tok-kw';
      else if (/^[A-Z]/.test(m[5])) cls = 'tok-type';
    }
    out += cls ? `<span class="${cls}">${escapeHtml(txt)}</span>` : escapeHtml(txt);
    last = m.index + txt.length;
  }
  if (last < src.length) out += escapeHtml(src.slice(last));
  return out;
}

// Highlight only what we can actually parse. Anything not tagged java --
// pseudocode, plain text -- falls through to the plain escaped path.
function renderCodeBody(code, lang) {
  const src = String(code).trim();
  return (lang && String(lang).toLowerCase() === 'java') ? highlightJava(src) : escapeHtml(src);
}

function formatInline(s) {
  if (!s) return '';
  return String(s).replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const badge = (lang ? lang.toUpperCase() + ' ' : '') + 'CODE';
    return `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${renderCodeBody(code, lang || 'java')}</code></pre></div>`;
  });

  // 2. Inline code backticks `code`
  text = text.replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'parsons') { return { type:q.type, stem:q.stem, lines:q.lines, origIdx:q.origIdx, cat:q.cat }; }
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function pScore(q, ans){
  var seq=pSeq(q), need=seq.length; ans=ans||[];
  var marks=ans.map(function(k,pos){ var l=q.lines[k]; return !!(l && !l.distractor && pos<need && String(l.code).trim()===seq[pos]); });
  var right=marks.filter(Boolean).length, filled=ans.length>0;
  var status = !filled ? 'skipped' : (right===need && ans.length===need) ? 'correct' : right===0 ? 'wrong' : 'partial';
  return { score: need?right/need:0, status:status, marks:marks, right:right, need:need };
}
function pRowHTML(q,k,mk){

       + '<div class="p-code">'+renderCodeBody(l.code, l.codeLang||'java')+'</div>'+badge+'</li>';
}
function parsonsHTML(q,i,isChecked,r){

var pDrag=null;
function wireParsons(i){

  for(var n=0;n<hs.length;n++){ (function(h){ h.addEventListener('pointerdown', function(e){ pDown(e,i); }); })(hs[n]); }
}
function pDown(e,i){
  if(state.checked[i]) return;
  var row=e.target.closest('.p-row'); if(!row) return;
  pDrag={ i:i, k:+row.dataset.k, row:row, startX:e.clientX, startY:e.clientY, started:false };
  try{ row.setPointerCapture(e.pointerId); }catch(_){}
  document.addEventListener('pointermove', pMove, {passive:false});
  document.addEventListener('pointerup', pUp);
  document.addEventListener('pointercancel', pUp);
}
function pMoveClone(x,y){ pDrag.clone.style.left=(x-pDrag.offX)+'px'; pDrag.clone.style.top=(y-pDrag.offY)+'px'; }
function pMove(e){
  if(!pDrag)return;
  if(!pDrag.started){
    var dx=e.clientX-pDrag.startX, dy=e.clientY-pDrag.startY;
    if(dx*dx+dy*dy < 36) return;
    var rect=pDrag.row.getBoundingClientRect();
    var clone=pDrag.row.cloneNode(true); clone.classList.add('p-clone'); clone.classList.remove('p-dragging');
    clone.style.width=rect.width+'px'; document.body.appendChild(clone);
    pDrag.clone=clone; pDrag.offX=pDrag.startX-rect.left; pDrag.offY=pDrag.startY-rect.top;
    pDrag.row.classList.add('p-dragging'); pDrag.started=true;
  }
  e.preventDefault(); pMoveClone(e.clientX,e.clientY); pShowInsert(e.clientX,e.clientY);
}
function pTarget(x,y){
  var a=document.getElementById('pAnswer'), b=document.getElementById('pBank');
  var ar=a.getBoundingClientRect(), br=b?b.getBoundingClientRect():null, pad=14, zoneEl;
  if(y>=ar.top-pad && y<=ar.bottom+pad) zoneEl=a;
  else if(br && y>=br.top-pad && y<=br.bottom+pad) zoneEl=b;
  else zoneEl = (!br || y<br.top) ? a : b;
  var rows=[].slice.call(zoneEl.querySelectorAll('.p-row:not(.p-dragging)')), idx=rows.length;
  for(var n=0;n<rows.length;n++){ var rr=rows[n].getBoundingClientRect(); if(y<rr.top+rr.height/2){ idx=n; break; } }
  return { zone: zoneEl.id, idx:idx, zoneEl:zoneEl, rows:rows };
}
function pShowInsert(x,y){
  var old=document.querySelectorAll('.p-insert'); for(var n=0;n<old.length;n++) old[n].remove();
  var t=pTarget(x,y), bar=document.createElement('div'); bar.className='p-insert';
  if(t.idx>=t.rows.length) t.zoneEl.appendChild(bar); else t.zoneEl.insertBefore(bar,t.rows[t.idx]);
}
function pUp(e){
  if(!pDrag)return;
  if(pDrag.started){
    var i=pDrag.i, k=pDrag.k, t=pTarget(e.clientX,e.clientY);
    var ans=state.answers[i], bank=state.pBank[i];
    var ai=ans.indexOf(k); if(ai>=0) ans.splice(ai,1);
    var bi=bank.indexOf(k); if(bi>=0) bank.splice(bi,1);
    var arr = (t.zone==='pAnswer') ? ans : bank;
    arr.splice(Math.min(t.idx,arr.length),0,k);
    var row=document.querySelector('.p-row.p-dragging');
    if(row){ if(t.idx>=t.rows.length) t.zoneEl.appendChild(row); else t.zoneEl.insertBefore(row,t.rows[t.idx]); row.classList.remove('p-dragging'); }
    pRefreshEmpty(i);
    var cb=document.getElementById('checkBtn'); if(cb) cb.disabled = ans.length===0;
  }
  pCleanup();
}
function pRefreshEmpty(i){
  var a=document.getElementById('pAnswer'); if(!a) return;
  var has=a.querySelectorAll('.p-row').length>0;
  a.classList.toggle('p-empty', !has);
  var hint=a.querySelector('.p-hint');
  if(has && hint) hint.remove();
  if(!has && !hint){ var d=document.createElement('div'); d.className='p-hint'; d.textContent='Drag the correct lines here, in order'; a.appendChild(d); }
}
function pCleanup(){
  if(pDrag && pDrag.clone) pDrag.clone.remove();
  var ins=document.querySelectorAll('.p-insert'); for(var n=0;n<ins.length;n++) ins[n].remove();
  var dg=document.querySelectorAll('.p-row.p-dragging'); for(var m=0;m<dg.length;m++) dg[m].classList.remove('p-dragging');
  pDrag=null;
  document.removeEventListener('pointermove', pMove);
  document.removeEventListener('pointerup', pUp);

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'parsons') { return pScore(q, selectedIdxs); }
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);

    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';

    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? BANK.filter(q => state.focusedCats.includes(q.cat)) : BANK;
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');

  }

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (q.type === 'parsons') { tagLabel = 'Arrange the code'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in">';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${formatContent(q.context)}</div></div>`;
  }
  html += `<div class="qstem">${formatContent(q.stem)}</div>`;
  if (q.code) {
    const badge = q.codeEyebrow || (q.codeLang ? q.codeLang.toUpperCase() + ' CODE' : 'CODE SNIPPET');
    html += `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${renderCodeBody(q.code, q.codeLang)}</code></pre></div>`;
  }

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${formatInline(q.hint)}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${formatInline(q.fb)}</div>`;
    }
    html += `</div>`;
  } else if (q.type === 'parsons') {
    html += parsonsHTML(q, state.current, isChecked, r);
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          if (isMulti) {
            cls += ' is-missed';
            marker = '\u25CB';
            tagsHtml = '<span class="opt-tag miss">Missed choice</span>';
            showFeedback = true;
          } else {
            cls += ' is-correct';
            marker = '\u2713';
            tagsHtml = '<span class="opt-tag ans">Correct answer</span>';
            showFeedback = true;
          }
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${formatInline(opt.t)}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${formatInline(opt.fb)}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (q.type === 'parsons') {
    if (!isChecked) wireParsons(state.current);
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('Abandon this quiz and return to setup? Your progress will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.querySelectorAll('a[href="../index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const quiz = $('view-quiz');
    if (quiz && !quiz.classList.contains('hidden')) {
      if (!confirm('Leave this quiz and return to the Reviewer Hub? Your current progress will be lost.')) {
        e.preventDefault();
      } else {
        stopTimer();
      }
    }
  });
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 24px; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    <div class="btn-row">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="../index.html" class="btn ghost">← Back to Index</a>
        <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
        <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      </div>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    state.questions = buildActiveQuiz();
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
</body>
</html>
