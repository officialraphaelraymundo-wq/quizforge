itb","stem":"The memory-addressing limit associated with a 32-bit system is ____.","sub":"bit-architecture-memory-limit","subtype":"term","answer":["4GB","4 GB"],"caseSensitive":false,"fb":"The 32-bit memory-addressing limit is 4GB; 64-bit architecture supports a much larger address range."},{"cat":"03","type":"scenario","stem":"Which combination meets the requirement?","sub":"bit-architecture-memory-limit","context":"A workstation needs an architecture capable of addressing much more memory than the 32-bit limit. Its CPU and operating system can both be selected for this requirement.","options":[{"t":"32-bit CPU; 32-bit OS","c":false,"fb":"This retains the 32-bit memory-addressing limitation."},{"t":"32-bit CPU; larger display","c":false,"fb":"Display size does not increase the architecture’s memory-addressing capacity."},{"t":"32-bit OS; newer interface","c":false,"fb":"An interface change does not remove the 32-bit addressing limit."},{"t":"64-bit CPU; 64-bit OS","c":true,"fb":"A 64-bit CPU and OS support addressing far more memory."}]},{"cat":"03","type":"mcq","stem":"Which operating system type is designed for a single purpose with few resources?","sub":"embedded-os","options":[{"t":"Embedded operating system","c":true,"fb":"An embedded OS uses few resources and serves a specific purpose."},{"t":"Commercial operating system","c":false,"fb":"Commercial describes licensing and source-code access, not a single-purpose resource requirement."},{"t":"Open-source operating system","c":false,"fb":"Open-source describes code availability, not necessarily a single-purpose design."},{"t":"Text-based operating system","c":false,"fb":"Text-based describes the interface; it does not require a single-purpose device."}]},{"cat":"03","type":"multi","stem":"An engineer is choosing an OS for a dedicated medical device. Select the three characteristics that fit an embedded OS.","sub":"embedded-os","options":[{"t":"Broad desktop task support","c":false,"fb":"An embedded OS is designed for a specific purpose rather than broad desktop use."},{"t":"Low operating-system cost","c":true,"fb":"Low cost is a characteristic of embedded operating systems."},{"t":"High system-resource demand","c":false,"fb":"Embedded operating systems use few resources."},{"t":"Single-purpose device operation","c":true,"fb":"An embedded OS serves the dedicated function of its device."},{"t":"Frequent real-time optimization","c":true,"fb":"Embedded operating systems are often optimized for real-time processing."}]},{"cat":"03","type":"mcq","stem":"What does “open-source” establish about software?","sub":"open-source-vs-commercial","options":[{"t":"Every copy costs nothing","c":false,"fb":"Open-source software is not necessarily free of charge."},{"t":"Its source is secret","c":false,"fb":"Open-source code is available for people to inspect and use."},{"t":"Its source is accessible","c":true,"fb":"Source-code availability is a defining feature of open-source software."},{"t":"Every license covers one device","c":false,"fb":"A one-device license is associated with the commercial licensing model described here."}]},{"cat":"03","type":"multi","stem":"A project allows users to inspect and change its source code. Select the two features that match its open-source model.","sub":"open-source-vs-commercial","options":[{"t":"Guaranteed zero purchase price","c":false,"fb":"Open-source software may still have a purchase price."},{"t":"Publicly viewable source code","c":true,"fb":"Users can inspect the code used to create the software."},{"t":"Mandatory single-device licensing","c":false,"fb":"Single-device licensing is not a defining requirement of open-source software."},{"t":"Secret developer-only source code","c":false,"fb":"Keeping the source secret conflicts with allowing users to inspect it."},{"t":"User-modifiable source code","c":true,"fb":"Users can change how the software works by modifying its source."}]},{"cat":"03","type":"scenario","stem":"Which action satisfies this condition?","sub":"open-source-vs-commercial","context":"An open-source project permits modifications on the condition that changes are made available to everyone else. A developer modifies the program’s behavior.","options":[{"t":"Share the modified code","c":true,"fb":"Making the changes available to others satisfies the project’s stated condition."},{"t":"Keep the changes secret","c":false,"fb":"Secret changes do not meet the requirement to make modifications available."},{"t":"Purchase a device license","c":false,"fb":"Buying a license does not fulfill the stated requirement to share changes."},{"t":"Publish only the price","c":false,"fb":"A price announcement does not make the modifications available."}]},{"cat":"03","type":"fitb","stem":"The free Linux distribution available since 2004 and commonly used for servers and cloud applications is ____.","sub":"linux-origin-distros","subtype":"term","answer":["Ubuntu"],"caseSensitive":false,"fb":"Ubuntu is a Linux distribution used for servers and cloud applications."},{"cat":"03","type":"mcq","stem":"Which pairing correctly identifies Linux’s creator and the environment its UNIX-based design supports?","sub":"linux-origin-distros","options":[{"t":"Microsoft; single-user and single-tasking","c":false,"fb":"Linux was created by Linus Torvalds and supports multiple users and tasks."},{"t":"Apple; multi-user and multitasking","c":false,"fb":"The environment matches, but Apple did not create Linux."},{"t":"Torvalds; single-user and single-tasking","c":false,"fb":"The creator matches, but Linux follows a multi-user, multitasking design."},{"t":"Torvalds; multi-user and multitasking","c":true,"fb":"Linus Torvalds created Linux using the multi-user, multitasking design associated with UNIX."}]},{"cat":"03","type":"multi","stem":"Select the three members of the popular personal-computer OS group from this list.","sub":"os-market-landscape","options":[{"t":"Windows","c":true,"fb":"Windows belongs to the popular personal-computer OS group."},{"t":"Android","c":false,"fb":"Android belongs to the main smartphone OS group in this classification."},{"t":"macOS","c":true,"fb":"macOS belongs to the popular personal-computer OS group."},{"t":"iOS","c":false,"fb":"iOS belongs to the main smartphone OS group in this classification."},{"t":"ChromeOS","c":true,"fb":"ChromeOS belongs to the popular personal-computer OS group."}]},{"cat":"03","type":"mcq","stem":"An older PC cannot meet a newer OS version’s resource requirements; what best explains the failed upgrade?","sub":"os-market-landscape","options":[{"t":"Newer versions need fewer resources","c":false,"fb":"Some newer versions require more resources than older hardware provides."},{"t":"Hardware resources are insufficient","c":true,"fb":"The older PC cannot supply the resources required by the newer version."},{"t":"Version numbers guarantee hardware compatibility","c":false,"fb":"A newer version number does not guarantee support for older hardware."},{"t":"Every OS version requires smartphones","c":false,"fb":"OS versions exist for different device groups, including personal computers."}]},{"cat":"03","type":"fitb","stem":"The earlier operating-system design on which macOS is based is ____.","sub":"windows-vs-macos","subtype":"term","answer":["UNIX"],"caseSensitive":false,"fb":"macOS follows the same general design as UNIX."},{"cat":"03","type":"multi","stem":"A buyer is evaluating macOS and its relationship with Apple hardware. Select the two matching characteristics.","sub":"windows-vs-macos","options":[{"t":"Runs only on Apple computers","c":true,"fb":"macOS operates on Apple computers."},{"t":"Runs on every PC brand","c":false,"fb":"macOS does not share the broad hardware-brand support described for other PC operating systems."},{"t":"Guarantees complete immunity to viruses","c":false,"fb":"A Mac can still get a virus; security is not absolute immunity."},{"t":"Apple designs hardware and software","c":true,"fb":"Apple’s control of both helps it make macOS secure and stable."},{"t":"Apple develops only the software","c":false,"fb":"Apple designs both the hardware and software."}]},{"cat":"03","type":"mcq","stem":"A planner contrasts irregular Windows major releases with macOS’s regular release pattern; which schedule matches macOS?","sub":"windows-vs-macos","options":[{"t":"Every spring","c":false,"fb":"Spring is not the stated annual macOS release season."},{"t":"Every summer","c":false,"fb":"Summer is not the stated annual macOS release season."},{"t":"Every autumn","c":true,"fb":"macOS follows an annual autumn release pattern."},{"t":"Every winter","c":false,"fb":"Winter is not the stated annual macOS release season."}]},{"cat":"03","type":"fitb","stem":"A text-based operating system accepts typed commands through a ____.","sub":"text-based-os-servers","subtype":"term","answer":["CLI","command line interface","command-line interface","command line interface (CLI)"],"caseSensitive":false,"fb":"A CLI accepts commands typed into a console without requiring clickable icons."},{"cat":"03","type":"mcq","stem":"A server administrator prioritizes fast tasks, stability, and reliability; which OS style best matches these priorities?","sub":"text-based-os-servers","options":[{"t":"Text-based operating system","c":true,"fb":"Text-based systems are well suited to servers because of their task speed, stability, and reliability."},{"t":"Touch-first graphical operating system","c":false,"fb":"Touch interaction does not explain the server advantages identified in the stem."},{"t":"Stylus-first graphical operating system","c":false,"fb":"Stylus interaction supports visual input rather than the stated text-based server advantages."},{"t":"Eye-controlled graphical operating system","c":false,"fb":"Eye selection is a visual input method, not the basis of the stated server benefits."}]},{"cat":"03","type":"mcq","stem":"Which pair of input methods lets tablet users manipulate onscreen icons?","sub":"visual-os-input","options":[{"t":"Keyboard commands and scripts","c":false,"fb":"Commands and scripts describe text-based interaction rather than the tablet input methods asked for."},{"t":"Eye direction and finger pinch","c":false,"fb":"This pair describes Apple Vision Pro selection."},{"t":"Driver loading and hardware detection","c":false,"fb":"These are OS hardware-management functions, not user input methods."},{"t":"Finger touch and stylus","c":true,"fb":"Tablet icons can be manipulated with a finger or stylus."}]},{"cat":"03","type":"mcq","stem":"An Apple Vision Pro user looks at an icon; which action signals selection of that icon?","sub":"visual-os-input","options":[{"t":"Touch the headset display","c":false,"fb":"The described selection method uses a finger pinch rather than touching the display."},{"t":"Pinch the fingers together","c":true,"fb":"Looking identifies the icon, and pinching signals its selection."},{"t":"Type a console command","c":false,"fb":"Console commands belong to CLI interaction rather than this visual selection method."},{"t":"Install the icon’s driver","c":false,"fb":"Drivers control hardware; installing one is not an icon-selection gesture."}]},{"cat":"03","type":"mcq","stem":"Why does ChromeOS boot faster than a traditional operating system?","sub":"chromeos-traits","options":[{"t":"It loads more software","c":false,"fb":"ChromeOS has less software to load, not more."},{"t":"It preserves every guest setting","c":false,"fb":"Guest settings reset after logout or restart; preserving them is not the explanation."},{"t":"It loads less software","c":true,"fb":"Having less software to load contributes to faster booting."},{"t":"It avoids all browser use","c":false,"fb":"ChromeOS relies heavily on the browser."}]},{"cat":"03","type":"multi","stem":"A Chromebook is shared through guest sessions. Select the three characteristics that match ChromeOS.","sub":"chromeos-traits","options":[{"t":"Heavy browser reliance","c":true,"fb":"ChromeOS relies heavily on the browser."},{"t":"Permanent guest personalization","c":false,"fb":"Guest settings and personalization reset after logout or restart."},{"t":"Cloud-based operating-system design","c":true,"fb":"ChromeOS is cloud-based and works best with an Internet connection."},{"t":"Guest settings reset on logout","c":true,"fb":"Ending a guest session resets its settings and personalization."},{"t":"Full independence from Internet access","c":false,"fb":"ChromeOS works best online, and account sign-in requires an Internet connection in the described setup."}]},{"cat":"03","type":"fitb","stem":"Main memory holds active programs and data but loses its contents when power is removed, so it is described as ____.","sub":"memory-and-main-memory","subtype":"term","answer":["volatile"],"caseSensitive":false,"fb":"Volatile memory requires power to retain its contents."},{"cat":"03","type":"mcq","stem":"Memory consists of an array of bytes or words; what uniquely identifies each location?","sub":"memory-and-main-memory","options":[{"t":"Its stored data value","c":false,"fb":"A stored value is the content of a location, not its address."},{"t":"Its currently running program","c":false,"fb":"A program uses memory but does not serve as the unique identifier of each location."},{"t":"Its time of allocation","c":false,"fb":"Allocation time is not the identifier assigned to each byte or word."},{"t":"Its unique memory address","c":true,"fb":"Each byte or word in memory has a unique address."}]},{"cat":"03","type":"mcq","stem":"Which OS function controls the allocation and deallocation of memory to processes?","sub":"memory-management-purpose","options":[{"t":"Driver management","c":false,"fb":"Driver management controls hardware through device-specific software."},{"t":"Memory management","c":true,"fb":"Memory management assigns memory to processes and releases it afterward."},{"t":"Static linking","c":false,"fb":"Static linking combines program modules into an executable."},{"t":"Dynamic loading","c":false,"fb":"Dynamic loading brings routines into memory when needed."}]},{"cat":"03","type":"multi","stem":"An OS must manage memory while several processes execute. Select the three tasks that belong to memory management.","sub":"memory-management-purpose","options":[{"t":"Track process memory usage","c":true,"fb":"Tracking occupied memory helps the OS manage available space."},{"t":"Combine compiler object files","c":false,"fb":"Combining object files is the linker's task."},{"t":"Minimize memory fragmentation","c":true,"fb":"Reducing fragmentation supports efficient memory utilization."},{"t":"Maintain process data integrity","c":true,"fb":"Memory management helps protect data integrity during execution."},{"t":"Identify printer driver models","c":false,"fb":"Identifying hardware and loading its driver belongs to driver management."}]},{"cat":"03","type":"mcq","stem":"Which pairing correctly identifies the generators of logical and physical addresses?","sub":"logical-vs-physical-address","options":[{"t":"Logical: MMU; physical: CPU","c":false,"fb":"This reverses the generators of the two address types."},{"t":"Logical: CPU; physical: linker","c":false,"fb":"A linker combines object files; it does not generate physical addresses."},{"t":"Logical: CPU; physical: MMU","c":true,"fb":"The CPU generates logical addresses, and the MMU maps them to physical addresses."},{"t":"Logical: linker; physical: MMU","c":false,"fb":"Logical addresses originate from the CPU, not the linker."}]},{"cat":"03","type":"scenario","stem":"What type of address results from the MMU's mapping?","sub":"logical-vs-physical-address","context":"A CPU generates an address while a program runs. The MMU maps that address to an actual location used by the memory hardware.","options":[{"t":"Physical address","c":true,"fb":"The mapped address identifies an actual memory hardware location."},{"t":"Logical address","c":false,"fb":"The logical address is the CPU-generated input to the mapping."},{"t":"Page table","c":false,"fb":"A page table is a mapping structure, not an address type."},{"t":"Partition table","c":false,"fb":"A partition table tracks partitions, not the resulting hardware address."}]},{"cat":"03","type":"multi","stem":"Select the two names that identify an address generated by the CPU before MMU mapping.","sub":"logical-vs-physical-address","options":[{"t":"Real address","c":false,"fb":"A real address is another name for a physical address."},{"t":"Virtual address","c":true,"fb":"Virtual address and logical address refer to the CPU-generated address."},{"t":"Physical address","c":false,"fb":"A physical address is produced through MMU mapping."},{"t":"Logical address","c":true,"fb":"This is the address type generated by the CPU."},{"t":"Frame","c":false,"fb":"A frame is a physical memory block used in paging, not an address synonym."}]},{"cat":"03","type":"mcq","stem":"Which loading method places the entire program into memory at a fixed address?","sub":"static-vs-dynamic-loading","options":[{"t":"Dynamic loading","c":false,"fb":"Dynamic loading brings in routines only when they are needed."},{"t":"Static linking","c":false,"fb":"Static linking combines modules into an executable rather than specifying this loading method."},{"t":"Dynamic linking","c":false,"fb":"Dynamic linking uses stubs for library routine references."},{"t":"Static loading","c":true,"fb":"Static loading loads the whole program at a fixed address and requires more memory."}]},{"cat":"03","type":"scenario","stem":"Which loading method explains this behavior?","sub":"static-vs-dynamic-loading","context":"A large application has routines that may never be called. These routines remain on disk in relocatable form and enter memory only when called.","options":[{"t":"Static loading","c":false,"fb":"Static loading would place the entire program into memory."},{"t":"Dynamic loading","c":true,"fb":"Dynamic loading keeps unused routines on disk until they are called."},{"t":"Fixed partition allocation","c":false,"fb":"Fixed partition allocation organizes memory into fixed-sized partitions."},{"t":"Dynamic partition allocation","c":false,"fb":"Dynamic partition allocation sizes memory partitions to processes, not routine calls."}]},{"cat":"03","type":"fitb","stem":"The program that combines compiler-generated object files into a single executable is the ____.","sub":"static-vs-dynamic-linking","subtype":"term","answer":["linker"],"caseSensitive":false,"fb":"A linker combines one or more object files into an executable; static linking includes all necessary modules without a runtime dependency."},{"cat":"03","type":"multi","stem":"A dynamically linked program references a library routine. Select the three features of the stub mechanism.","sub":"static-vs-dynamic-linking","options":[{"t":"Includes a small code stub","c":true,"fb":"Dynamic linking includes a stub for each appropriate library routine reference."},{"t":"Always reloads an existing routine","c":false,"fb":"The stub checks whether the routine is already in memory before loading it."},{"t":"Checks whether the routine is resident","c":true,"fb":"The stub determines whether the required routine is already in memory."},{"t":"Loads the routine if absent","c":true,"fb":"A routine is loaded when the stub finds that it is not already in memory."},{"t":"Combines every module before execution","c":false,"fb":"Combining all necessary modules into one executable describes static linking."}]},{"cat":"03","type":"fitb","stem":"In monoprogramming, the operating system can be protected from the user program by a ____.","sub":"monoprogramming","subtype":"term","answer":["fence register","a fence register"],"caseSensitive":false,"fb":"A fence register protects the OS section from the user program in the single-process memory arrangement."},{"cat":"03","type":"multi","stem":"A monoprogramming system divides memory into two sections. Select the two occupants of those sections.","sub":"monoprogramming","options":[{"t":"Operating system","c":true,"fb":"One memory section holds the operating system, commonly in low memory with the interrupt vectors."},{"t":"Separate code segment","c":false,"fb":"Dividing a process into code, data, and stack segments describes segmentation."},{"t":"Separate data segment","c":false,"fb":"A data segment is not one of monoprogramming's two main memory sections."},{"t":"Separate stack segment","c":false,"fb":"A stack segment belongs to a segmented process layout."},{"t":"User program","c":true,"fb":"The other section holds the single user program."}]},{"cat":"03","type":"mcq","stem":"Which allocation strategy uses a fixed number of fixed-sized contiguous partitions, each holding one process?","sub":"fixed-vs-dynamic-partitioning","options":[{"t":"Dynamic partition allocation","c":false,"fb":"Dynamic partitions vary in size according to process requirements."},{"t":"Non-contiguous allocation","c":false,"fb":"Non-contiguous allocation allows parts of a process to occupy separate locations."},{"t":"Fixed partition allocation","c":true,"fb":"Fixed partition allocation uses fixed-sized partitions with one process per partition."},{"t":"Segmentation allocation","c":false,"fb":"Segmentation divides a process into variable-sized logical parts."}]},{"cat":"03","type":"fitb","stem":"To record which fixed memory partitions are free or occupied, the OS maintains a ____.","sub":"fixed-vs-dynamic-partitioning","subtype":"term","answer":["partition table"],"caseSensitive":false,"fb":"A partition table tracks the status of memory partitions; it does not map pages or segments."},{"cat":"03","type":"scenario","stem":"Which allocation strategy is being used?","sub":"fixed-vs-dynamic-partitioning","context":"An OS creates partitions sized to the processes requesting memory. This reduces wasted space, but fragmentation can still occur.","options":[{"t":"Fixed partition allocation","c":false,"fb":"Fixed partitions retain predetermined sizes rather than matching each process."},{"t":"Dynamic partition allocation","c":true,"fb":"Dynamic partitions vary with process sizes, reducing waste while still risking fragmentation."},{"t":"Paging allocation","c":false,"fb":"Paging divides processes and memory into equal-sized pages and frames."},{"t":"Monoprogramming allocation","c":false,"fb":"Monoprogramming uses one OS section and one user-program section."}]},{"cat":"03","type":"mcq","stem":"Which allocation method places a process in one continuous block of adjacent memory locations?","sub":"contiguous-vs-noncontiguous","options":[{"t":"Contiguous allocation","c":true,"fb":"Contiguous allocation keeps the process in a single continuous memory block."},{"t":"Non-contiguous allocation","c":false,"fb":"Non-contiguous allocation allows parts of a process to occupy separate locations."},{"t":"Paging allocation","c":false,"fb":"Paging is a non-contiguous method using pages and frames."},{"t":"Segmentation allocation","c":false,"fb":"Segmentation is a non-contiguous method using variable-sized segments."}]},{"cat":"03","type":"scenario","stem":"Which allocation category permits this arrangement?","sub":"contiguous-vs-noncontiguous","context":"A process is split into three parts. Each part occupies a different memory region, with other processes between the regions.","options":[{"t":"Contiguous allocation","c":false,"fb":"Contiguous allocation requires one continuous block for the process."},{"t":"Static loading","c":false,"fb":"Static loading concerns loading the entire program at a fixed address."},{"t":"Monoprogramming","c":false,"fb":"Monoprogramming provides an OS section and a single user-program section."},{"t":"Non-contiguous allocation","c":true,"fb":"Non-contiguous allocation permits process parts to occupy non-adjacent locations."}]},{"cat":"03","type":"fitb","stem":"In paging, physical memory is divided into fixed-sized blocks called ____, each matching the size of a page.","sub":"paging-vs-segmentation","subtype":"term","answer":["frames","frame"],"caseSensitive":false,"fb":"Pages divide the process, while same-sized frames divide physical memory."},{"cat":"03","type":"multi","stem":"Select the two correct pairings between an allocation technique and its mapping structure.","sub":"paging-vs-segmentation","options":[{"t":"Paging: segment table","c":false,"fb":"A segment table maps segments, not pages."},{"t":"Segmentation: partition table","c":false,"fb":"A partition table tracks memory partition status."},{"t":"Paging: page table","c":true,"fb":"A page table maps logical pages to physical frames."},{"t":"Paging: partition table","c":false,"fb":"Paging needs page-to-frame mappings rather than partition-status records."},{"t":"Segmentation: segment table","c":true,"fb":"A segment table maps logical segments to physical memory."}]},{"cat":"03","type":"fitb","stem":"An application is divided into variable-sized code, data, and stack regions; this memory allocation technique is ____.","sub":"paging-vs-segmentation","subtype":"term","answer":["segmentation"],"caseSensitive":false,"fb":"Segmentation uses variable-sized logical regions, whereas paging uses fixed-sized pages."},{"cat":"03","type":"mcq","stem":"Which placement algorithm chooses the smallest available memory block large enough for a process?","sub":"placement-algorithm-rules","options":[{"t":"First Fit","c":false,"fb":"First Fit selects the first suitable block in search order."},{"t":"Best Fit","c":true,"fb":"Best Fit selects the smallest available block that can hold the process."},{"t":"Worst Fit","c":false,"fb":"Worst Fit selects the largest available block."},{"t":"Next Fit","c":false,"fb":"Next Fit searches from the last allocation position rather than minimizing block size."}]},{"cat":"03","type":"multi","stem":"Select the three correct pairings of placement algorithms and selection rules.","sub":"placement-algorithm-rules","options":[{"t":"First Fit: first suitable block","c":true,"fb":"First Fit stops at the first block large enough for the process."},{"t":"Best Fit: largest available block","c":false,"fb":"Selecting the largest block is Worst Fit's rule."},{"t":"Worst Fit: largest available block","c":true,"fb":"Worst Fit chooses the largest available block."},{"t":"Next Fit: always restart at beginning","c":false,"fb":"Next Fit continues searching from the last allocation position."},{"t":"Next Fit: search from last allocation","c":true,"fb":"Next Fit uses the last allocation position as its search starting point."}]},{"cat":"03","type":"scenario","stem":"Which placement algorithm explains this search?","sub":"placement-algorithm-rules","context":"The last allocation used B2. For the next process, the OS searches B3, B4, and B5 before wrapping around to B1. It accepts the first block that fits.","options":[{"t":"Best Fit","c":false,"fb":"Best Fit compares suitable block sizes to select the smallest."},{"t":"Worst Fit","c":false,"fb":"Worst Fit selects the largest block rather than the first encountered fit."},{"t":"Next Fit","c":true,"fb":"Next Fit continues searching after the last allocation and wraps around if needed."},{"t":"First Fit","c":false,"fb":"First Fit starts its search at the beginning rather than continuing after B2."}]},{"cat":"03","type":"mcq","stem":"Starting with B1–B5 = 100, 500, 200, 300, 600 KB, allocate P1–P4 = 212, 417, 112, 426 KB in order, reusing block remainders; which algorithm allocates all four?","sub":"placement-algorithm-trace","options":[{"t":"First Fit","c":false,"fb":"First Fit assigns P1→B2, P2→B5, and P3→B2, leaving no block large enough for P4."},{"t":"Worst Fit","c":false,"fb":"Worst Fit assigns P1→B5, P2→B2, and P3→B5; P4 cannot fit afterward."},{"t":"Next Fit","c":false,"fb":"Next Fit assigns P1→B2, P2→B5, and P3→B2; P4 remains unallocated."},{"t":"Best Fit","c":true,"fb":"Best Fit assigns P1→B4, P2→B2, P3→B3, and P4→B5."}]},{"cat":"03","type":"mcq","stem":"Starting with B1–B5 = 100, 500, 200, 300, 600 KB, apply First Fit to P1–P4 = 212, 417, 112, 426 KB in order, reusing remainders; which proposed result is incorrect?","sub":"placement-algorithm-trace","options":[{"t":"P1 → B2","c":false,"fb":"This is correct: B1 is too small, so P1 takes B2."},{"t":"P2 → B5","c":false,"fb":"This is correct: after P1, B5 is the first block large enough for P2."},{"t":"P3 → B3","c":true,"fb":"This is incorrect: B2's 288 KB remainder is encountered first and fits P3."},{"t":"P4 → unallocated","c":false,"fb":"This is correct: after P3, no remaining block can hold 426 KB."}]},{"cat":"03","type":"scenario","stem":"How much free space remains in B5 immediately after P3 is allocated?","sub":"placement-algorithm-trace","context":"Initially, B1–B5 contain 100, 500, 200, 300, and 600 KB. P1–P4 request 212, 417, 112, and 426 KB in order. Worst Fit is used, and block remainders stay available.","options":[{"t":"276 KB","c":true,"fb":"P1 leaves 388 KB in B5; P2 uses B2; P3 then leaves 388 − 112 = 276 KB in B5."},{"t":"388 KB","c":false,"fb":"This is B5's remainder after P1; it ignores P3's allocation."},{"t":"174 KB","c":false,"fb":"This is B5's final remainder under Best Fit after P4, not the Worst Fit result."},{"t":"176 KB","c":false,"fb":"This is B2's remainder after P3 under First Fit or Next Fit."}]},{"cat":"03","type":"mcq","stem":"Which technique temporarily moves a process from main memory to disk so another process can run?","sub":"swapping","options":[{"t":"Segmentation","c":false,"fb":"Segmentation divides a process into variable-sized logical regions."},{"t":"Swapping","c":true,"fb":"Swapping temporarily transfers processes between main memory and secondary memory."},{"t":"Static linking","c":false,"fb":"Static linking combines program modules into one executable."},{"t":"Paging","c":false,"fb":"Paging divides processes into pages and memory into frames."}]},{"cat":"03","type":"scenario","stem":"What happens to P1 after it is loaded back?","sub":"swapping","context":"RAM holds P1 = 200 KB and P2 = 300 KB, filling its 500 KB capacity. P3 = 200 KB arrives. The OS stores P1 on disk and loads P3 into the freed space. Later, P1 is loaded back into RAM.","options":[{"t":"It remains permanently deleted","c":false,"fb":"Swapping temporarily stores P1 on disk; it does not delete the process."},{"t":"It becomes a free partition","c":false,"fb":"P1 remains a process, not a memory partition."},{"t":"It resumes execution","c":true,"fb":"A swapped-out process resumes once it is loaded back into main memory."},{"t":"It becomes a library stub","c":false,"fb":"A stub supports dynamic linking and is unrelated to restoring a swapped process."}]},{"cat":"03","type":"mcq","stem":"A 70 KB process occupies a fixed 100 KB partition; what describes the unused 30 KB inside that allocated partition?","sub":"internal-fragmentation","options":[{"t":"External fragmentation","c":false,"fb":"External fragmentation concerns scattered free blocks outside allocated partitions."},{"t":"Dynamic loading","c":false,"fb":"Dynamic loading delays loading routines until they are needed."},{"t":"Swapping","c":false,"fb":"Swapping transfers processes between RAM and disk."},{"t":"Internal fragmentation","c":true,"fb":"The unused space lies inside an allocated block larger than the process requires."}]},{"cat":"03","type":"fitb","stem":"Processes needing 70, 85, and 60 KB each receive a separate 100 KB fixed partition; their total internal fragmentation is ____ KB.","sub":"internal-fragmentation","subtype":"numeric","answer":["85"],"caseSensitive":false,"fb":"The unused spaces are 30, 15, and 40 KB; 30 + 15 + 40 = 85 KB."},{"cat":"03","type":"mcq","stem":"A process needs one contiguous 180 KB block, but the only free blocks are 50, 70, and 80 KB, separated by occupied regions; why does allocation fail despite 200 KB being free?","sub":"external-fragmentation","options":[{"t":"No single free block fits","c":true,"fb":"The largest free block is only 80 KB, so the process cannot obtain one contiguous 180 KB block."},{"t":"Total free memory is insufficient","c":false,"fb":"The total is 50 + 70 + 80 = 200 KB, which exceeds 180 KB."},{"t":"Unused space occupies allocated partitions","c":false,"fb":"That describes internal fragmentation, whereas these spaces are separate free blocks."},{"t":"The process already occupies RAM","c":false,"fb":"The process is requesting allocation; scattered free blocks are the stated obstacle."}]},{"cat":"03","type":"fitb","stem":"When enough total free memory exists but is scattered among non-adjacent blocks that cannot provide one sufficiently large contiguous block, the problem is called ____.","sub":"external-fragmentation","subtype":"term","answer":["external fragmentation"],"caseSensitive":false,"fb":"External fragmentation leaves sufficient total free space distributed between allocated regions, preventing a large contiguous allocation."},{"cat":"04","type":"mcq","stem":"Which component selects the ready process that receives the CPU?","sub":"cpu-scheduling-basics","options":[{"t":"Ready queue","c":false,"fb":"The ready queue holds eligible processes; it does not make scheduling decisions."},{"t":"Short-term scheduler","c":true,"fb":"The short-term scheduler chooses which ready process receives the processor."},{"t":"Gantt chart","c":false,"fb":"A Gantt chart represents execution order; it does not select processes."},{"t":"CPU burst","c":false,"fb":"A CPU burst describes processing time, not a scheduling component."}]},{"cat":"04","type":"scenario","stem":"Which scheduling purpose should guide the correction?","sub":"cpu-scheduling-basics","context":"Several processes share one processor. The scheduler repeatedly favors some processes while leaving others without an opportunity to execute.","options":[{"t":"Favoring earlier selections","c":false,"fb":"Repeatedly favoring the same processes can preserve unequal access."},{"t":"Maximizing individual waiting","c":false,"fb":"Increasing waiting does not address unfair processor allocation."},{"t":"Ensuring fair CPU access","c":true,"fb":"Scheduling aims to ensure fairness and minimize resource starvation."},{"t":"Preventing all process execution","c":false,"fb":"Blocking execution defeats the purpose of allocating the processor."}]},{"cat":"04","type":"mcq","stem":"Two algorithms have equal CPU utilization and throughput; which change in Algorithm B indicates better scheduling performance?","sub":"scheduling-criteria-direction","options":[{"t":"Longer turnaround time","c":false,"fb":"Longer turnaround means processes spend more time from submission to completion."},{"t":"Shorter waiting time","c":true,"fb":"Reducing time spent waiting in the ready queue improves scheduling performance."},{"t":"Longer response time","c":false,"fb":"A later first response is undesirable."},{"t":"Longer waiting time","c":false,"fb":"More ready-queue waiting worsens performance."}]},{"cat":"04","type":"multi","stem":"Select the three changes that move scheduling metrics in their desired directions.","sub":"scheduling-criteria-direction","options":[{"t":"Increased CPU utilization","c":true,"fb":"Greater utilization keeps the processor busy for more of the elapsed time."},{"t":"Increased turnaround time","c":false,"fb":"Turnaround time should decrease, not increase."},{"t":"Increased throughput","c":true,"fb":"Completing more processes per time unit is desirable."},{"t":"Increased response time","c":false,"fb":"Response time should decrease so the first response arrives sooner."},{"t":"Reduced waiting time","c":true,"fb":"Less ready-queue waiting is desirable."}]},{"cat":"04","type":"mcq","stem":"Which metric measures the number of processes completed per time unit?","sub":"scheduling-metric-definitions","options":[{"t":"Waiting time","c":false,"fb":"Waiting time measures time spent in the ready queue."},{"t":"Response time","c":false,"fb":"Response time measures the interval before the first response."},{"t":"Turnaround time","c":false,"fb":"Turnaround time measures the interval from submission to completion."},{"t":"Throughput","c":true,"fb":"Throughput counts completed processes per time unit."}]},{"cat":"04","type":"scenario","stem":"Which metric is represented by the interval from time 2 to time 7?","sub":"scheduling-metric-definitions","context":"A request is submitted at time 2. Its first response appears at time 7. The process finishes at time 18.","options":[{"t":"Response time","c":true,"fb":"Response time ends when the first response is produced."},{"t":"Turnaround time","c":false,"fb":"Turnaround would extend from time 2 to completion at time 18."},{"t":"Throughput","c":false,"fb":"Throughput counts completions per time unit rather than this request's delay."},{"t":"CPU utilization","c":false,"fb":"Utilization measures the percentage of elapsed time the CPU is busy."}]},{"cat":"04","type":"mcq","stem":"A process is submitted at time 2, produces its first response at time 7, and completes at time 18; what is its turnaround time?","sub":"scheduling-metric-definitions","options":[{"t":"5 time units","c":false,"fb":"This is the submission-to-first-response interval."},{"t":"11 time units","c":false,"fb":"This measures first response to completion, omitting the earlier interval."},{"t":"16 time units","c":true,"fb":"Turnaround covers the entire submission-to-completion interval: 18 − 2 = 16."},{"t":"18 time units","c":false,"fb":"The completion timestamp alone does not account for submission at time 2."}]},{"cat":"04","type":"mcq","stem":"Which criterion considers utilization of CPU, memory, I/O devices, and other resources together?","sub":"secondary-scheduling-criteria","options":[{"t":"Predictability","c":false,"fb":"Predictability concerns consistent response time."},{"t":"Balanced utilization","c":true,"fb":"Balanced utilization evaluates multiple system resources rather than CPU usage alone."},{"t":"Preferential treatment","c":false,"fb":"Preferential treatment favors processes with higher priorities."},{"t":"Fairness","c":false,"fb":"Fairness concerns execution opportunities and preventing starvation."}]},{"cat":"04","type":"multi","stem":"Select the three secondary criteria concerning resource balance, response consistency, or priority preference.","sub":"secondary-scheduling-criteria","options":[{"t":"Throughput","c":false,"fb":"Throughput is the primary metric for completions per time unit."},{"t":"Predictability","c":true,"fb":"Predictability concerns consistency in response time."},{"t":"Balanced utilization","c":true,"fb":"Balanced utilization considers CPU and other resource usage together."},{"t":"Response time","c":false,"fb":"Response time is a primary timing metric; consistency of response time is predictability."},{"t":"Preferential treatment","c":true,"fb":"Preferential treatment gives consideration to higher-priority processes."}]},{"cat":"04","type":"mcq","stem":"What distinguishes non-preemptive scheduling once a process begins running?","sub":"preemptive-vs-nonpreemptive","options":[{"t":"Runs until termination","c":true,"fb":"The selected process continues executing until it terminates."},{"t":"Stops at every arrival","c":false,"fb":"A new arrival does not automatically interrupt a non-preemptive process."},{"t":"Returns before burst completion","c":false,"fb":"Interruption before the burst is consumed describes preemptive behavior."},{"t":"Stops after each quantum","c":false,"fb":"Quantum-based interruption is associated with preemptive Round Robin."}]},{"cat":"04","type":"multi","stem":"Select the three algorithms that permit interruption of a running process before its CPU burst is fully consumed.","sub":"preemptive-vs-nonpreemptive","options":[{"t":"FCFS","c":false,"fb":"FCFS is non-preemptive and lets the running process finish."},{"t":"PP","c":true,"fb":"Preemptive Priority can interrupt a process when a higher-priority process arrives."},{"t":"SRTF","c":true,"fb":"Shortest Remaining Time First permits preemption."},{"t":"SJF","c":false,"fb":"The SJF version used here is non-preemptive."},{"t":"RR","c":true,"fb":"Round Robin can interrupt a process when its time slice expires."}]},{"cat":"04","type":"scenario","stem":"To which state is the interrupted process returned?","sub":"preemptive-vs-nonpreemptive","context":"A process is executing and still has unused CPU burst time. The operating system interrupts it so another ready process can run.","options":[{"t":"Running","c":false,"fb":"It has lost the CPU, so it is no longer the running process."},{"t":"Terminated","c":false,"fb":"Interruption does not mean its processing has finished."},{"t":"Not yet arrived","c":false,"fb":"An already executing process has necessarily arrived."},{"t":"Ready","c":true,"fb":"Preemption moves the interrupted process back to the ready state."}]},{"cat":"04","type":"mcq","stem":"Which expression calculates a process's turnaround time?","sub":"tat-wt-formulas","options":[{"t":"Start − arrival","c":false,"fb":"This gives waiting time when the process executes once without interruption."},{"t":"Completion − arrival","c":true,"fb":"Turnaround measures the interval from arrival to completion."},{"t":"Turnaround − burst","c":false,"fb":"This calculates waiting time."},{"t":"Completion − start","c":false,"fb":"This omits time before the first execution."}]},{"cat":"04","type":"mcq","stem":"A process arrives at time 4, starts at time 10, and runs uninterrupted for 6 units until time 16; what is its waiting time?","sub":"tat-wt-formulas","options":[{"t":"12 time units","c":false,"fb":"This is turnaround time: 16 − 4."},{"t":"10 time units","c":false,"fb":"The start timestamp must be reduced by the arrival time."},{"t":"6 time units","c":true,"fb":"Waiting is 10 − 4 = 6, also equal to (16 − 4) − 6."},{"t":"4 time units","c":false,"fb":"The arrival timestamp is not the waiting duration."}]},{"cat":"04","type":"scenario","stem":"What is its total waiting time?","sub":"tat-wt-formulas","context":"A process arrives at time 3 with a total CPU burst of 5 units. It runs from time 5 to 7, is preempted, then runs from time 11 to 14 and completes.","options":[{"t":"6 time units","c":true,"fb":"Turnaround is 14 − 3 = 11; waiting is 11 − 5 = 6."},{"t":"2 time units","c":false,"fb":"First start minus arrival counts only the initial wait and omits waiting after preemption."},{"t":"7 time units","c":false,"fb":"Completion minus the first interruption is not total waiting time."},{"t":"11 time units","c":false,"fb":"This is turnaround time and still includes the CPU burst."}]},{"cat":"04","type":"mcq","stem":"The CPU executes 18 units of total burst time during 24 elapsed units; what is its utilization?","sub":"cpu-utilization-calculation","options":[{"t":"25%","c":false,"fb":"This is the idle percentage: (24 − 18) ÷ 24 × 100."},{"t":"100%","c":false,"fb":"Six elapsed units are idle, so utilization is below 100%."},{"t":"133.3%","c":false,"fb":"This reverses the ratio by dividing elapsed time by burst time."},{"t":"75%","c":true,"fb":"Utilization is 18 ÷ 24 × 100 = 75%."}]},{"cat":"04","type":"scenario","stem":"What is CPU utilization over the entire interval?","sub":"cpu-utilization-calculation","context":"During a 25-unit observation interval, the CPU executes one process for 8 units and another for 12 units. It is idle for the remaining 5 units.","options":[{"t":"100%","c":false,"fb":"Dividing busy time by busy time incorrectly excludes the idle interval."},{"t":"80%","c":true,"fb":"Total burst time is 20; utilization is 20 ÷ 25 × 100 = 80%."},{"t":"20%","c":false,"fb":"This is the idle fraction, not the busy fraction."},{"t":"25%","c":false,"fb":"This divides idle time by busy time rather than busy time by elapsed time."}]},{"cat":"04","type":"fitb","stem":"In FCFS, the delay caused when one long front process forces shorter processes behind it to wait is called the ____.","sub":"fcfs-convoy-effect","subtype":"term","answer":["convoy effect"],"caseSensitive":false,"fb":"The convoy effect occurs because FCFS processes jobs in arrival order and cannot interrupt the long front process."},{"cat":"04","type":"scenario","stem":"Which execution order follows FCFS and produces the convoy effect?","sub":"fcfs-convoy-effect","context":"Under FCFS, a 20-unit process begins at time 0. Two 1-unit processes arrive at times 1 and 2 while it is running.","options":[{"t":"First short, second short, long","c":false,"fb":"FCFS cannot move both later short processes ahead of the running long process."},{"t":"Long, second short, first short","c":false,"fb":"After the long process, the earlier short arrival must precede the later one."},{"t":"Long, first short, second short","c":true,"fb":"The long process finishes first, and the shorter processes follow in arrival order."},{"t":"Second short, first short, long","c":false,"fb":"This reverses arrival order and bypasses the process already running."}]},{"cat":"04","type":"fitb","stem":"For FCFS turnaround times of 13, 15, 14, 13, and 20 units, the average turnaround time is ____ units.","sub":"fcfs-worked-schedule","subtype":"numeric","answer":["15"],"caseSensitive":false,"fb":"The total turnaround time is 75 units; dividing by five jobs gives 15."},{"cat":"04","type":"scenario","stem":"What is their average waiting time?","sub":"fcfs-worked-schedule","context":"Five jobs execute under FCFS. Each line gives arrival time and CPU burst:\n```text\nJ1: arrival 0, burst 13\nJ2: arrival 3, burst 5\nJ3: arrival 8, burst 4\nJ4: arrival 15, burst 6\nJ5: arrival 17, burst 9\n```","options":[{"t":"7.60 units","c":true,"fb":"Waiting times are 0, 10, 10, 7, and 11; their sum is 38, giving 38 ÷ 5 = 7.60."},{"t":"7.40 units","c":false,"fb":"This belongs to the SJF order, which runs J3 before J2."},{"t":"15.00 units","c":false,"fb":"This is the FCFS average turnaround time, which includes CPU execution."},{"t":"9.00 units","c":false,"fb":"This belongs to the NPP order rather than arrival-order execution."}]},{"cat":"04","type":"mcq","stem":"Which rule resolves equal CPU burst times among ready processes under non-preemptive SJF?","sub":"sjf-selection-rules","options":[{"t":"Highest assigned priority","c":false,"fb":"SJF uses FCFS for equal bursts, not assigned priority."},{"t":"Latest arrival first","c":false,"fb":"This reverses the FCFS tie-breaking order."},{"t":"Shortest remaining time","c":false,"fb":"This describes SRTF's selection basis rather than SJF's equal-burst tie-breaker."},{"t":"Earliest arrival first","c":true,"fb":"SJF breaks equal-burst ties using FCFS."}]},{"cat":"04","type":"fitb","stem":"Under SJF, a long process waiting indefinitely because shorter processes keep arriving experiences ____.","sub":"sjf-selection-rules","subtype":"term","answer":["starvation"],"caseSensitive":false,"fb":"Repeated selection of shorter arrived jobs can prevent a long ready process from receiving the CPU."},{"cat":"04","type":"scenario","stem":"Which process executes next, and until when?","sub":"sjf-selection-rules","context":"Non-preemptive SJF makes a selection at time 10. A arrived at time 2 with burst 6; B arrived at time 7 with burst 3; C will arrive at time 12 with burst 1. No process is currently running.","options":[{"t":"A until time 16","c":false,"fb":"A arrived earlier, but B has the shorter burst among arrived jobs."},{"t":"B until time 13","c":true,"fb":"B has the shortest available burst and runs its full 3 units without interruption."},{"t":"C until time 13","c":false,"fb":"C has not arrived at the selection time and cannot be chosen."},{"t":"B until time 12","c":false,"fb":"C's later arrival cannot interrupt B under non-preemptive SJF."}]},{"cat":"04","type":"mcq","stem":"For non-preemptive SJF, J1–J5 have arrivals (0, 3, 8, 15, 17) and bursts (13, 5, 4, 6, 9); which execution order results?","sub":"sjf-worked-schedule","options":[{"t":"J1–J2–J3–J4–J5","c":false,"fb":"This follows FCFS; SJF selects J3 before J2 at time 13."},{"t":"J3–J2–J4–J5–J1","c":false,"fb":"Sorting all jobs by burst ignores arrival times; only J1 is available initially."},{"t":"J1–J3–J2–J4–J5","c":true,"fb":"J1 finishes first, then the shortest arrived jobs are selected at each completion."},{"t":"J1–J2–J4–J5–J3","c":false,"fb":"This is the NPP order, determined by assigned priorities."}]},{"cat":"04","type":"scenario","stem":"What are the average turnaround and waiting times, respectively?","sub":"sjf-worked-schedule","context":"A non-preemptive SJF schedule produces these results:\n```text\nJob:        J1  J2  J3  J4  J5\nArrival:     0   3   8  15  17\nBurst:      13   5   4   6   9\nCompletion: 13  22  17  28  37\n```","options":[{"t":"14.80 and 7.40","c":true,"fb":"Turnaround totals 74 and waiting totals 37; dividing each by five gives these averages."},{"t":"15.00 and 7.60","c":false,"fb":"These are the FCFS averages, based on J2 executing before J3."},{"t":"16.40 and 9.00","c":false,"fb":"These are the NPP averages, based on priority ordering."},{"t":"23.40 and 16.00","c":false,"fb":"These result from averaging completion timestamps as turnaround, then subtracting the average burst."}]},{"cat":"04","type":"mcq","stem":"At an NPP selection point, ready jobs A, B, and C have priorities 5, 2, and 4, respectively; which job runs next?","sub":"npp-selection-rules","options":[{"t":"A, then runs to completion","c":false,"fb":"Priority 5 is lower than priorities 2 and 4; larger numbers do not mean higher priority."},{"t":"C, then runs to completion","c":false,"fb":"Priority 4 is lower than B's priority 2."},{"t":"B, then stops at any arrival","c":false,"fb":"B is selected, but non-preemptive execution is not interrupted by a new arrival."},{"t":"B, then runs to completion","c":true,"fb":"B has the lowest priority number and therefore the highest priority; NPP lets it finish."}]},{"cat":"04","type":"multi","stem":"Select the three rules or risks that apply to non-preemptive priority scheduling.","sub":"npp-selection-rules","options":[{"t":"Larger priority numbers win","c":false,"fb":"Lower priority numbers represent higher priorities."},{"t":"Consider only arrived processes","c":true,"fb":"Selection is restricted to processes already in the ready queue."},{"t":"Break priority ties using FCFS","c":true,"fb":"Equal-priority processes are ordered by arrival."},{"t":"Interrupt on higher-priority arrival","c":false,"fb":"This is preemptive priority behavior; NPP lets the running process finish."},{"t":"Low-priority processes risk starvation","c":true,"fb":"Repeated selection of higher-priority processes can leave lower-priority processes waiting."}]},{"cat":"04","type":"mcq","stem":"For NPP with J1–J5 arrivals (0, 3, 8, 15, 17), bursts (13, 5, 4, 6, 9), and priorities (4, 3, 5, 1, 2), which execution order results?","sub":"npp-worked-schedule","options":[{"t":"J1–J2–J3–J4–J5","c":false,"fb":"This is arrival order; NPP gives J4 and J5 priority over J3."},{"t":"J1–J2–J4–J5–J3","c":true,"fb":"At each completion, NPP selects the arrived job with the lowest priority number."},{"t":"J1–J3–J2–J4–J5","c":false,"fb":"This is the SJF order, based on CPU burst lengths."},{"t":"J4–J5–J2–J1–J3","c":false,"fb":"This sorts all priorities without checking arrivals; J4 is unavailable at time 0."}]},{"cat":"04","type":"mcq","stem":"An NPP schedule has turnaround times (13, 15, 29, 9, 16) and corresponding bursts (13, 5, 4, 6, 9); what is its average waiting time?","sub":"npp-worked-schedule","options":[{"t":"16.40 units","c":false,"fb":"This is average turnaround time, before removing CPU execution time."},{"t":"7.40 units","c":false,"fb":"This is the average burst time, not the average waiting time."},{"t":"9.00 units","c":true,"fb":"Waiting times are 0, 10, 25, 3, and 7; 45 ÷ 5 = 9."},{"t":"25.00 units","c":false,"fb":"This is J3's individual waiting time, not the five-job average."}]},{"cat":"04","type":"mcq","stem":"Which arrival immediately interrupts a running process under preemptive priority scheduling?","sub":"pp-preemption-rule","options":[{"t":"A higher-priority process","c":true,"fb":"A newly arrived higher-priority process immediately preempts the running process."},{"t":"A lower-priority process","c":false,"fb":"A lower-priority arrival does not displace a higher-priority running process."},{"t":"Any shorter-burst process","c":false,"fb":"PP compares priority, not burst length."},{"t":"Any newly arrived process","c":false,"fb":"Arrival alone is insufficient; the new process must have higher priority."}]},{"cat":"04","type":"mcq","stem":"Which outcome is NOT guaranteed when preemptive priority allows higher-priority arrivals to interrupt lower-priority execution?","sub":"pp-preemption-rule","options":[{"t":"Interrupting lower-priority execution","c":false,"fb":"This is the specified behavior when a higher-priority process arrives."},{"t":"Starting higher-priority arrivals immediately","c":false,"fb":"Immediate execution of a higher-priority arrival is the preemption rule."},{"t":"Returning interrupted processes to ready","c":false,"fb":"Interrupted unfinished processes return to the ready state."},{"t":"Reducing average waiting time","c":true,"fb":"Preemption may increase lower-priority waiting and does not guarantee a lower overall average."}]},{"cat":"04","type":"mcq","stem":"For PP with J1–J5 arrivals (0, 3, 8, 15, 17), bursts (13, 5, 4, 6, 9), and priorities (4, 3, 5, 1, 2), which execution sequence results?","sub":"pp-worked-schedule","options":[{"t":"J1–J2–J4–J5–J3","c":false,"fb":"This is the non-preemptive priority sequence and omits interrupted J1 segments."},{"t":"J1–J2–J1–J4–J5–J1–J3","c":true,"fb":"J2 and J4 interrupt J1; J5 follows J4, then J1 finishes before J3."},{"t":"J1–J2–J3–J1–J4–J1–J5","c":false,"fb":"This follows remaining-time selection rather than the specified priorities."},{"t":"J1–J2–J1–J4–J1–J5–J3","c":false,"fb":"After J4 finishes, J5's priority 2 places it ahead of J1's priority 4."}]},{"cat":"04","type":"scenario","stem":"What are the average turnaround and waiting times, respectively?","sub":"pp-worked-schedule","context":"A PP schedule has execution segments J1(0–3), J2(3–8), J1(8–15), J4(15–21), J5(21–30), J1(30–33), and J3(33–37). Job data are:\n```text\nJob:     J1  J2  J3  J4  J5\nArrival:  0   3   8  15  17\nBurst:   13   5   4   6   9\n```","options":[{"t":"16.40 and 9.00","c":false,"fb":"These are the NPP averages, which exclude the PP interruption pattern."},{"t":"25.80 and 18.40","c":false,"fb":"These incorrectly treat completion timestamps as turnaround times before subtracting bursts."},{"t":"17.20 and 9.80","c":true,"fb":"Turnaround times total 86 and waiting times total 49; dividing each by five gives these averages."},{"t":"17.20 and 0.80","c":false,"fb":"Using only first start minus arrival misses J1's and J3's later waiting; use turnaround minus burst."}]},{"cat":"04","type":"mcq","stem":"Under SRTF, what must a newly arrived process have to preempt the running process?","sub":"srtf-preemption-rule","options":[{"t":"An earlier arrival time","c":false,"fb":"Earlier arrival alone does not determine SRTF selection; remaining burst time does."},{"t":"A shorter remaining burst","c":true,"fb":"SRTF preempts when the new process needs less remaining CPU time than the running process."},{"t":"A higher assigned priority","c":false,"fb":"Assigned priority determines priority scheduling, not SRTF selection."},{"t":"A longer original burst","c":false,"fb":"SRTF favors the shortest remaining burst, not the longest original burst."}]},{"cat":"04","type":"scenario","stem":"Which decision correctly applies the preemption rule?","sub":"srtf-preemption-rule","context":"Under SRTF, process A originally needed 13 units and has already executed for 10 units. Process B now arrives needing 4 units. No other process is ready.","options":[{"t":"Switch to B; 4 < 13","c":false,"fb":"This compares B with A’s original burst instead of A’s remaining burst."},{"t":"Switch to B; arrivals preempt","c":false,"fb":"A new arrival causes preemption only when its remaining burst is shorter."},{"t":"Continue A; 3 < 4","c":true,"fb":"A has 13 − 10 = 3 units remaining, which is shorter than B’s 4 units."},{"t":"Continue A; SRTF forbids preemption","c":false,"fb":"SRTF allows preemption, but B does not satisfy the condition here."}]},{"cat":"04","type":"fitb","stem":"The average turnaround time is ____ time units.","sub":"srtf-worked-schedule","subtype":"number","answer":["12.6"],"caseSensitive":false,"fb":"Turnaround times are 28, 5, 4, 6, and 20. Their sum is 63; 63 ÷ 5 = 12.6."},{"cat":"04","type":"scenario","stem":"What is the average waiting time?","sub":"srtf-worked-schedule","context":"Five jobs finish under SRTF with turnaround times 28, 5, 4, 6, and 20. Their corresponding CPU bursts are 13, 5, 4, 6, and 9. Some jobs execute in several separate intervals.","options":[{"t":"12.60 units","c":false,"fb":"This is the average turnaround time; it still includes CPU execution."},{"t":"7.40 units","c":false,"fb":"This is the average CPU burst, 37 ÷ 5, rather than the average waiting time."},{"t":"0.00 units","c":false,"fb":"Preemption and delayed execution make J1 and J5 wait even though other jobs have zero waiting time."},{"t":"5.20 units","c":true,"fb":"Waiting times are turnaround minus burst: 15, 0, 0, 0, and 11. Their average is 26 ÷ 5 = 5.20."}]},{"cat":"04","type":"mcq","stem":"What specifies the CPU time allowed for one turn in round-robin scheduling?","sub":"rr-quantum-mechanics","options":[{"t":"Assigned process priority","c":false,"fb":"Round robin uses queue turns and a time limit rather than assigned priority."},{"t":"Time slice or quantum","c":true,"fb":"The quantum specifies the CPU time allocated during each turn."},{"t":"Original arrival time","c":false,"fb":"Arrival affects entry into the ready queue, not the duration of a turn."},{"t":"Total turnaround time","c":false,"fb":"Turnaround measures time from arrival to completion, not the allocated turn length."}]},{"cat":"04","type":"scenario","stem":"What happens when A uses its full turn?","sub":"rr-quantum-mechanics","context":"Round robin uses a quantum of 3 units. Process A starts a turn with 5 units remaining. Processes B and C are waiting in that order; no new process arrives.","options":[{"t":"A finishes; B then C wait","c":false,"fb":"A still has 2 units remaining, so it cannot finish."},{"t":"A runs 2 more; B and C wait","c":false,"fb":"An unfinished process must yield when its quantum expires."},{"t":"A keeps 2; queue becomes B–C–A","c":true,"fb":"A uses 3 units, retains 2, and returns to the queue’s tail."},{"t":"A keeps 2; queue becomes A–B–C","c":false,"fb":"A returns to the tail, not the front."}]},{"cat":"04","type":"multi","stem":"Select the THREE events that follow round-robin queue and completion rules.","sub":"rr-quantum-mechanics","options":[{"t":"Arriving jobs enter the tail","c":true,"fb":"New arrivals are placed at the end of the circular ready queue."},{"t":"Unfinished jobs reclaim the front","c":false,"fb":"A job whose quantum expires returns to the tail."},{"t":"Completed jobs leave the queue","c":true,"fb":"A job terminates after its required CPU burst is fully consumed."},{"t":"Highest-priority jobs bypass the queue","c":false,"fb":"Round robin selects jobs by queue order, not assigned priority."},{"t":"Expired unfinished jobs enter the tail","c":true,"fb":"Preemption at quantum expiry returns an unfinished job to the queue’s end."}]},{"cat":"04","type":"scenario","stem":"At what time does J2 complete?","sub":"rr-worked-schedule","context":"Round robin uses a quantum of 3. J2 arrives at time 3 with a burst of 5. J2 runs from 3 to 6, waits while J1 runs from 6 to 9, and then resumes.","options":[{"t":"11","c":true,"fb":"J2 has 2 units remaining at time 9, so it finishes at 9 + 2 = 11."},{"t":"8","c":false,"fb":"This assumes J2 runs continuously for 5 units after arriving, ignoring its interruption."},{"t":"9","c":false,"fb":"Time 9 is when J2 resumes; its remaining 2 units still need execution."},{"t":"12","c":false,"fb":"J2 needs only 2 more units, so it does not consume the full 3-unit quantum."}]},{"cat":"04","type":"mcq","stem":"For five jobs under RR with quantum 3, total turnaround is 87 and total CPU burst is 37; what is their average waiting time?","sub":"rr-worked-schedule","options":[{"t":"17.40 units","c":false,"fb":"This is 87 ÷ 5, the average turnaround time."},{"t":"7.40 units","c":false,"fb":"This is 37 ÷ 5, the average CPU burst."},{"t":"50.00 units","c":false,"fb":"This is the total waiting time, 87 − 37, before dividing by five jobs."},{"t":"10.00 units","c":true,"fb":"Total waiting is 87 − 37 = 50; average waiting is 50 ÷ 5 = 10.00."}]},{"cat":"04","type":"multi","stem":"For one five-job workload, average turnaround times are FCFS 15.0, SJF 14.8, NPP 16.4, and PP 17.2. Select the THREE supported comparisons.","sub":"algorithm-performance-comparison","options":[{"t":"SJF performs worse than FCFS","c":false,"fb":"SJF’s 14.8 is lower than FCFS’s 15.0; lower turnaround is better."},{"t":"NPP performs worse than SJF","c":true,"fb":"NPP averages 16.4, compared with SJF’s lower 14.8."},{"t":"PP performs better than NPP","c":false,"fb":"PP averages 17.2, which is higher than NPP’s 16.4."},{"t":"SJF performs better than FCFS","c":true,"fb":"SJF has the lower average turnaround, 14.8 versus 15.0."},{"t":"PP performs worse than NPP","c":true,"fb":"Adding preemption increases average turnaround in this workload."}]},{"cat":"04","type":"scenario","stem":"Which explanation fits these results?","sub":"algorithm-performance-comparison","context":"A workload produces these average waiting times: FCFS: 7.60; SJF: 7.40; NPP: 9.00; PP: 9.80. SJF selects shorter available jobs, while NPP and PP use assigned priorities.","options":[{"t":"Priority ordering guarantees shorter waits","c":false,"fb":"Both priority algorithms have higher average waiting times than FCFS and SJF here."},{"t":"Short jobs help; preemption need not","c":true,"fb":"SJF improves the average by favoring shorter jobs, while PP performs worse than NPP in this case."},{"t":"Preemption eliminates all waiting time","c":false,"fb":"PP still produces waiting, including additional waiting for interrupted processes."},{"t":"Arrival ordering always minimizes waiting","c":false,"fb":"FCFS follows arrival order, yet SJF achieves a lower average waiting time here."}]},{"cat":"04","type":"mcq","stem":"What is the main purpose of process coordination?","sub":"process-coordination-objectives","options":[{"t":"Rank processes solely by burst","c":false,"fb":"Burst-based ranking describes a scheduling choice, not the overall purpose of coordination."},{"t":"Give processes unrestricted shared access","c":false,"fb":"Uncontrolled simultaneous access can corrupt shared data."},{"t":"Manage safe cooperation among processes","c":true,"fb":"Coordination supports correct execution, effective communication, and safe resource sharing."},{"t":"Prevent communication among cooperating processes","c":false,"fb":"Coordination enables and organizes communication rather than preventing it."}]},{"cat":"04","type":"multi","stem":"A system runs several cooperating processes that share data and devices. Select the THREE outcomes process coordination should achieve.","sub":"process-coordination-objectives","options":[{"t":"Preserve shared-data integrity","c":true,"fb":"Maintaining consistent and correct shared data is a coordination objective."},{"t":"Permit conflicting simultaneous updates","c":false,"fb":"Conflicting updates can cause corruption; coordination controls such access."},{"t":"Coordinate cooperating processes’ communication","c":true,"fb":"Coordination organizes information exchange between cooperating processes."},{"t":"Prevent resource starvation","c":true,"fb":"Preventing starvation is one of the problems coordination addresses."},{"t":"Leave circular waits unresolved","c":false,"fb":"Unresolved circular resource waits can produce deadlocks, which coordination aims to prevent or handle."}]},{"cat":"04","type":"mcq","stem":"What does process synchronization establish for concurrent access to shared resources?","sub":"process-synchronization","options":[{"t":"Uncontrolled simultaneous resource access","c":false,"fb":"Uncontrolled access can produce inconsistent results."},{"t":"Execution ordered by arrival only","c":false,"fb":"Arrival-based CPU selection is FCFS, not the defining function of synchronization."},{"t":"Communication limited to network sockets","c":false,"fb":"Synchronization concerns orderly execution and resource access, not one communication mechanism."},{"t":"An orderly, controlled access sequence","c":true,"fb":"Synchronization coordinates critical operations so shared resources are accessed in a proper sequence."}]},{"cat":"04","type":"scenario","stem":"Which mechanism directly explains this ordered updating?","sub":"process-synchronization","context":"Two employee processes update the same product’s inventory. Both attempt to modify the quantity at the same time. The system delays the second update until the first update completes.","options":[{"t":"Process synchronization","c":true,"fb":"Synchronization ensures one critical update finishes before another begins."},{"t":"Shortest-job-first scheduling","c":false,"fb":"Choosing CPU jobs by burst length does not itself establish an orderly sequence for shared-data updates."},{"t":"Interprocess message exchange","c":false,"fb":"Exchanging information does not by itself describe the enforced update sequence in this case."},{"t":"Deadlock detection","c":false,"fb":"The system is ordering updates, not identifying processes waiting indefinitely for each other’s resources."}]},{"cat":"04","type":"fitb","stem":"The semaphore wait operation, which decreases its integer counter, is denoted by ____.","sub":"semaphore-vs-mutex","subtype":"term","answer":["P","wait","wait (P)"],"caseSensitive":false,"fb":"P denotes wait; V denotes signal. Wait decreases the semaphore value."},{"cat":"04","type":"fitb","stem":"The operation responsible for this increase is denoted by ____.","sub":"semaphore-vs-mutex","subtype":"term","answer":["V","signal","signal (V)"],"caseSensitive":false,"fb":"V denotes signal and increases the semaphore value; P denotes wait and decreases it."},{"cat":"04","type":"multi","stem":"Select the THREE properties that correctly distinguish semaphore operations and mutex ownership.","sub":"semaphore-vs-mutex","options":[{"t":"Signal decreases the semaphore counter","c":false,"fb":"Signal, or V, increases the counter; wait, or P, decreases it."},{"t":"Semaphores use an integer counter","c":true,"fb":"A semaphore coordinates access through an integer value."},{"t":"Any thread can unlock a mutex","c":false,"fb":"Only the thread or process that locked the mutex can unlock it."},{"t":"Wait decreases the semaphore counter","c":true,"fb":"The wait operation, P, decreases the semaphore value."},{"t":"Mutex unlocking requires the owner","c":true,"fb":"Mutex ownership restricts unlocking to the thread or process that acquired the lock."}]},{"cat":"04","type":"fitb","stem":"The portion of a program that accesses or modifies shared variables, files, or hardware devices is called the ____.","sub":"mutual-exclusion-critical-section","subtype":"term","answer":["critical section"],"caseSensitive":false,"fb":"A critical section contains shared-resource operations whose simultaneous execution may produce inconsistent results."},{"cat":"04","type":"mcq","stem":"Several processes want to write directly to one printer; which principle permits only one process to access it at a time?","sub":"mutual-exclusion-critical-section","options":[{"t":"Interprocess communication","c":false,"fb":"IPC enables information exchange; it does not by itself guarantee exclusive printer access."},{"t":"Deadlock avoidance","c":false,"fb":"Avoidance checks whether granting resource requests preserves a safe state."},{"t":"Mutual exclusion","c":true,"fb":"Mutual exclusion allows only one process at a time to access a shared resource."},{"t":"CPU burst estimation","c":false,"fb":"Estimating CPU time does not enforce exclusive access to a printer."}]},{"cat":"04","type":"multi","stem":"Select the THREE mechanisms used to implement mutual exclusion.","sub":"mutual-exclusion-critical-section","options":[{"t":"Mutex locks","c":true,"fb":"Mutex locks restrict critical-section access to one owner at a time."},{"t":"Network sockets","c":false,"fb":"Sockets provide network communication; they are not identified here as mutual-exclusion mechanisms."},{"t":"Binary semaphores","c":true,"fb":"Binary semaphores use values 0 and 1 to allow one process to access a resource at a time."},{"t":"Message queues","c":false,"fb":"Message queues support information exchange through OS-managed queues."},{"t":"Monitors","c":true,"fb":"Monitors are included among mechanisms implementing mutual exclusion."}]},{"cat":"04","type":"mcq","stem":"Which IPC mechanism enables processes on different computers to communicate through a network?","sub":"ipc-mechanisms","options":[{"t":"Ordinary pipes","c":false,"fb":"Ordinary pipes provide one-way communication between related processes."},{"t":"Sockets","c":true,"fb":"Sockets support communication between processes on different computers through a network."},{"t":"Shared memory","c":false,"fb":"Shared memory exchanges information through a common memory region."},{"t":"Signals","c":false,"fb":"Signals notify a process that an event has occurred."}]},{"cat":"04","type":"fitb","stem":"A process receives a notification that a particular event occurred; the IPC mechanism used for such event notifications is ____.","sub":"ipc-mechanisms","subtype":"term","answer":["signals","signal"],"caseSensitive":false,"fb":"Signals notify processes about events, whereas message queues exchange messages and shared memory exposes a common memory region."},{"cat":"04","type":"multi","stem":"Select the THREE correctly matched IPC mechanisms and functions.","sub":"ipc-mechanisms","options":[{"t":"Ordinary pipes: unrelated-process communication","c":false,"fb":"Ordinary pipes connect related processes; named pipes allow communication between unrelated processes."},{"t":"Shared memory: common memory region","c":true,"fb":"Processes exchange information by accessing the same memory region."},{"t":"Named pipes: unrelated-process communication","c":true,"fb":"Named pipes allow unrelated processes to communicate."},{"t":"Signals: common memory region","c":false,"fb":"Signals provide event notification; common-region access describes shared memory."},{"t":"Message queues: OS-managed message exchange","c":true,"fb":"Message queues exchange messages through queues managed by the operating system."}]},{"cat":"04","type":"mcq","stem":"What does resource sharing require the OS to do with limited system resources?","sub":"resource-sharing","options":[{"t":"Allocate them efficiently and fairly","c":true,"fb":"Resource sharing controls allocation and use so multiple processes can share limited resources."},{"t":"Give every process unrestricted access","c":false,"fb":"Unrestricted access can produce conflicts and inconsistent results."},{"t":"Reserve every resource permanently","c":false,"fb":"Permanent reservation prevents resources from being shared among processes."},{"t":"Distribute only CPU execution time","c":false,"fb":"Resource sharing also covers memory, files, printers, and other resources."}]},{"cat":"04","type":"scenario","stem":"Which action best applies controlled resource sharing?","sub":"resource-sharing","context":"Several users submit documents to one printer. The printer can service only one document at a time. The OS must organize access so all submitted jobs can be served.","options":[{"t":"Allow every job to write simultaneously","c":false,"fb":"Simultaneous direct access can mix output instead of controlling use of the printer."},{"t":"Reserve the printer for its first user","c":false,"fb":"Permanent reservation prevents other users from sharing the limited device."},{"t":"Discard all jobs after the first","c":false,"fb":"Discarding later jobs does not provide fair access to the shared resource."},{"t":"Queue jobs and service one at a time","c":true,"fb":"Queuing print jobs controls access to the single printer and allows jobs to be served in sequence."}]},{"cat":"04","type":"mcq","stem":"Which situation defines a deadlock?","sub":"deadlock-definition","options":[{"t":"Processes take turns using resources","c":false,"fb":"Taking turns allows progress and is an example of controlled access."},{"t":"One process waits behind another","c":false,"fb":"Ordinary queuing can end when the current user releases the resource."},{"t":"Processes indefinitely await each other’s resources","c":true,"fb":"Deadlocked processes cannot proceed because each waits for a resource held by another."},{"t":"Processes receive shorter CPU turns","c":false,"fb":"Shorter CPU turns describe scheduling behavior and do not establish a deadlock."}]},{"cat":"04","type":"fitb","stem":"This resource-waiting situation is a ____.","sub":"deadlock-definition","subtype":"term","answer":["deadlock"],"caseSensitive":false,"fb":"Each process waits indefinitely for a resource held by the other, preventing both from continuing."},{"cat":"04","type":"mcq","stem":"What distinguishes deadlock prevention from avoidance?","sub":"deadlock-prevention-vs-avoidance","options":[{"t":"Periodically detecting existing circular waits","c":false,"fb":"Periodic checks for an existing deadlock describe detection."},{"t":"Preventing a necessary condition from occurring","c":true,"fb":"Prevention stops a necessary deadlock condition from arising; avoidance evaluates requests for safe allocation."},{"t":"Granting requests only in safe states","c":false,"fb":"Checking that requests preserve a safe state describes avoidance."},{"t":"Terminating processes after detecting deadlock","c":false,"fb":"Termination after detection is a recovery method."}]},{"cat":"04","type":"scenario","stem":"Which deadlock strategy is being applied?","sub":"deadlock-prevention-vs-avoidance","context":"Process A already holds a printer and requests a scanner. Before granting the scanner, the OS evaluates whether the resulting allocation would remain safe. The request is temporarily denied because it would leave an unsafe state.","options":[{"t":"Deadlock recovery","c":false,"fb":"Recovery eliminates a deadlock that has already been detected."},{"t":"Deadlock detection","c":false,"fb":"Detection checks whether deadlock has occurred; this decision evaluates a request before granting it."},{"t":"Deadlock avoidance","c":true,"fb":"Avoidance grants requests only when the resulting allocation keeps the system in a safe state."},{"t":"Deadlock prevention","c":false,"fb":"Prevention removes a necessary condition, such as requiring all needed resources to be requested together before starting."}]},{"cat":"04","type":"multi","stem":"Select the TWO actions that exemplify prevention or avoidance, rather than detection or recovery.","sub":"deadlock-prevention-vs-avoidance","options":[{"t":"Require all needed resources up front","c":true,"fb":"Requesting needed resources together prevents a process from holding one while waiting for another."},{"t":"Terminate an already deadlocked process","c":false,"fb":"Terminating a deadlocked process is recovery."},{"t":"Restore a deadlocked process’s checkpoint","c":false,"fb":"Rolling back an affected process is recovery."},{"t":"Deny requests that leave unsafe states","c":true,"fb":"Avoidance evaluates requests and denies those that would leave an unsafe state."},{"t":"Periodically check for existing circular waits","c":false,"fb":"Periodic checks for circular waiting exemplify detection."}]},{"cat":"04","type":"mcq","stem":"Which strategy periodically checks whether circular resource waiting has produced a deadlock?","sub":"deadlock-detection-recovery","options":[{"t":"Deadlock detection","c":true,"fb":"Detection checks whether a deadlock has occurred and identifies circular waiting."},{"t":"Deadlock prevention","c":false,"fb":"Prevention stops a necessary condition from occurring before deadlock can arise."},{"t":"Deadlock avoidance","c":false,"fb":"Avoidance evaluates each resource request for a safe resulting state."},{"t":"Deadlock recovery","c":false,"fb":"Recovery acts to eliminate a deadlock after it has been detected."}]},{"cat":"04","type":"scenario","stem":"Which recovery method did the OS use?","sub":"deadlock-detection-recovery","context":"The OS detects that A and B are deadlocked over a printer and scanner. It forcibly takes the printer from B and assigns it to A. A can now continue.","options":[{"t":"Rolling back a process","c":false,"fb":"Rollback restores a process to a saved checkpoint; no checkpoint restoration occurs here."},{"t":"Terminating a process","c":false,"fb":"Neither process is described as being terminated."},{"t":"Checking for circular waiting","c":false,"fb":"The circular wait has already been detected; checking does not describe the corrective action."},{"t":"Reclaiming allocated resources","c":true,"fb":"The OS forcibly retrieves an allocated resource and reallocates it to break the deadlock."}]},{"cat":"04","type":"multi","stem":"A deadlock has already been detected. Select the THREE actions that can recover from it.","sub":"deadlock-detection-recovery","options":[{"t":"Terminate an affected process","c":true,"fb":"Termination releases the process’s resources so other processes can proceed."},{"t":"Repeat the circular-wait check","c":false,"fb":"Rechecking detects or confirms the problem; it does not itself break the deadlock."},{"t":"Reclaim an allocated resource","c":true,"fb":"Taking back an allocated resource can break the resource-waiting cycle."},{"t":"Roll back to a checkpoint","c":true,"fb":"Restoring an earlier checkpoint can release a resource and allow another process to continue."},{"t":"Require upfront requests before starting","c":false,"fb":"Upfront resource requests exemplify prevention before execution, rather than recovery from an existing deadlock."}]},{"cat":"05","type":"mcq","stem":"Which user interface design enabled early Windows operating systems to make computing accessible to non-technical home users compared to text-based systems like DOS?","sub":"gui-vs-cli-evolution","options":[{"t":"Graphical User Interface","c":true,"fb":"Replaced text command entry with visual elements like windows, icons, and menus."},{"t":"Command-Line Interface","c":false,"fb":"Relied entirely on typed text commands in shells like DOS and required technical training."},{"t":"Text-Based Interface","c":false,"fb":"[outside] Used text-mode console menus rather than graphical desktop windows and icons."},{"t":"Voice User Interface","c":false,"fb":"[outside] Relies on speech recognition rather than visual graphical desktop controls."}]},{"cat":"05","type":"mcq","stem":"Which taskbar alignment style was introduced in Windows 11 to refresh the desktop interface?","sub":"windows-desktop-interface","options":[{"t":"Center-aligned taskbar","c":true,"fb":"Windows 11 centers the taskbar app icons and Start button by default."},{"t":"Left-aligned taskbar","c":false,"fb":"Represents the traditional desktop layout used in Windows 10 and earlier versions."},{"t":"Right-aligned taskbar","c":false,"fb":"[outside] Reserved for the notification area and clock rather than application launchers."},{"t":"Vertical dock taskbar","c":false,"fb":"[outside] Anchors icons along a screen edge, not the default Windows 11 layout."}]},{"cat":"05","type":"multi","stem":"Which three standard interface components are located directly on the default Windows 10 taskbar? Select the THREE correct options.","sub":"windows-desktop-interface","options":[{"t":"Start button","c":true,"fb":"Anchors the far-left corner of the taskbar to launch the Start menu."},{"t":"Search box","c":true,"fb":"Provides direct desktop and web search access directly on the
