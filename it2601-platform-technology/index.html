 taskbar."},{"t":"Notification area","c":true,"fb":"Displays background process icons, network status, and the system clock."},{"t":"Control Panel applet","c":false,"fb":"Found within administrative windows rather than anchored directly to the taskbar."},{"t":"Command prompt window","c":false,"fb":"Administrative terminal that must be launched manually, not a default taskbar component."}]},{"cat":"05","type":"mcq","stem":"Which interface serves as the modern, touch-friendly administrative console preferred for system management in Windows 10 and 11?","sub":"settings-vs-control-panel","options":[{"t":"Settings app","c":true,"fb":"Modern touch-enabled interface organized into high-level configuration categories."},{"t":"Control Panel","c":false,"fb":"Legacy administrative interface that uses individual configuration applets."},{"t":"Computer Management","c":false,"fb":"[outside] Administrative MMC console combining storage, services, and system tools."},{"t":"Windows Mobility Center","c":false,"fb":"[outside] Quick-adjust tile interface for mobile hardware like brightness and volume."}]},{"cat":"05","type":"mcq","stem":"When comparing the top-level navigation structure of the Settings app in Windows 11 to Windows 10, what structural difference is present in Windows 11?","sub":"settings-vs-control-panel","options":[{"t":"It has no Home page","c":true,"fb":"Windows 11 eliminates the top-level Home page, using persistent sidebar navigation."},{"t":"It removes all categories","c":false,"fb":"Settings remains organized into dedicated top-level configuration categories."},{"t":"It merges into Control Panel","c":false,"fb":"Settings remains distinct while legacy Control Panel applets are phased out."},{"t":"It disables touch controls","c":false,"fb":"Touch spacing and gesture controls were expanded rather than removed."}]},{"cat":"05","type":"mcq","stem":"What Windows structure stores an individual user's personal folders and private application configuration data?","sub":"user-accounts-and-profiles","options":[{"t":"User profile","c":true,"fb":"Contains personal directories like Documents and app-specific configuration data."},{"t":"Public desktop","c":false,"fb":"Stores shared shortcuts visible to all users on the computer rather than private profile data."},{"t":"Windows Registry root","c":false,"fb":"System-wide configuration database rather than an individual user's file and folder structure."},{"t":"Access Control List","c":false,"fb":"Defines security permissions for objects rather than holding personal files and app data."}]},{"cat":"05","type":"multi","stem":"Which three default personal folders are automatically created within a Windows user profile? Select the THREE correct options.","sub":"user-accounts-and-profiles","options":[{"t":"Documents","c":true,"fb":"Standard profile repository for user text files, spreadsheets, and personal documents."},{"t":"Pictures","c":true,"fb":"Dedicated personal directory created automatically for user image files."},{"t":"Music","c":true,"fb":"Dedicated personal directory created automatically for user audio files."},{"t":"System32","c":false,"fb":"Core operating system directory containing system binaries, libraries, and device drivers."},{"t":"ProgramData","c":false,"fb":"Global system directory storing shared application settings across all accounts."}]},{"cat":"05","type":"mcq","stem":"Which account privilege type is automatically assigned to the first user created during Windows setup?","sub":"account-privilege-types","options":[{"t":"Administrator","c":true,"fb":"Granted full privileges to modify system configuration and manage other accounts."},{"t":"Standard user","c":false,"fb":"Recommended for subsequent daily-use accounts, but not assigned to the initial setup account."},{"t":"Guest account","c":false,"fb":"[outside] Minimal temporary access account disabled by default in modern Windows."},{"t":"Power User","c":false,"fb":"[outside] Deprecated legacy group that is not assigned to the setup account."}]},{"cat":"05","type":"scenario","stem":"Which account privilege level is assigned to this employee's account?","sub":"account-privilege-types","context":"An employee logs into their Windows office computer to install an approved desktop utility. When running the installer, an elevation prompt appears requesting administrative credentials, preventing the user from proceeding with the system-wide installation.","options":[{"t":"Standard user","c":true,"fb":"Limited to their own profile and restricted from making machine-wide software installations."},{"t":"Administrator","c":false,"fb":"Possesses full rights to approve elevation prompts and perform system-wide installations."},{"t":"Guest user","c":false,"fb":"[outside] Intended for temporary visitors with minimal rights and disabled by default."},{"t":"Power user","c":false,"fb":"[outside] Legacy account group with intermediate rights that is deprecated in modern Windows."}]},{"cat":"05","type":"mcq","stem":"Which type of Windows user account authenticates credentials exclusively on a single local machine without cloud synchronization?","sub":"local-vs-microsoft-account","options":[{"t":"Local account","c":true,"fb":"Authenticates against the local machine only and keeps all preferences on that single computer."},{"t":"Microsoft account","c":false,"fb":"Connects to Microsoft cloud services and synchronizes personalization across multiple devices."},{"t":"Domain account","c":false,"fb":"Authenticates against a centralized network domain controller rather than a single standalone PC."},{"t":"Azure AD account","c":false,"fb":"[outside] Cloud-based identity managed through corporate directory services across tenant systems."}]},{"cat":"05","type":"scenario","stem":"Which user account type must be configured on both computers?","sub":"local-vs-microsoft-account","context":"An employee uses a Windows desktop at the office and a Windows laptop while traveling. The employee wants themes, desktop wallpaper, and browsing preferences automatically synchronized between both computers without joining a corporate domain.","options":[{"t":"Microsoft account","c":true,"fb":"Links to Microsoft cloud services to sync personalization and preferences across devices."},{"t":"Local account","c":false,"fb":"Confines authentication and profile preferences strictly to a single physical computer."},{"t":"Guest account","c":false,"fb":"[outside] Temporary local account that wipes user data upon sign-out without saving or syncing."},{"t":"Built-in administrator","c":false,"fb":"Local emergency account that does not support cloud synchronization of personalization."}]},{"cat":"05","type":"mcq","stem":"Within the Accounts settings page, which subpage manages PINs and biometric authentication through Windows Hello?","sub":"account-settings-subpages","options":[{"t":"Sign-in options","c":true,"fb":"Configures Windows Hello face, fingerprint, PIN, and password settings."},{"t":"Your info","c":false,"fb":"Displays account profile pictures and links to web-based account management."},{"t":"Email & accounts","c":false,"fb":"Stores credentials for external email, calendar, and social media accounts."},{"t":"Sync your settings","c":false,"fb":"Configures cloud synchronization of desktop preferences and passwords across PCs."}]},{"cat":"05","type":"mcq","stem":"Which subpage under the Accounts category connects a Windows computer to a centrally managed corporate domain network?","sub":"account-settings-subpages","options":[{"t":"Access work or school","c":true,"fb":"Connects a PC to enterprise Active Directory domains or device management systems."},{"t":"Family & other users","c":false,"fb":"Manages secondary user profiles and family safety accounts on the local computer."},{"t":"Sync your settings","c":false,"fb":"Manages cloud synchronization of personal themes and settings across devices."},{"t":"Email & accounts","c":false,"fb":"Stores personal email credentials rather than joining corporate domain networks."}]},{"cat":"05","type":"mcq","stem":"Which Windows settings category controls Microsoft telemetry data collection and restricts application access to the webcam and microphone?","sub":"privacy-and-app-permissions","options":[{"t":"Privacy and Security","c":true,"fb":"Manages OS diagnostic telemetry reporting and restricts app access to hardware peripherals."},{"t":"System","c":false,"fb":"Configures display, sound, notifications, power options, and hardware specifications."},{"t":"Personalization","c":false,"fb":"Configures desktop aesthetics such as themes, wallpapers, color schemes, and fonts."},{"t":"Ease of Access","c":false,"fb":"[outside] Configures accessibility features like Narrator, Magnifier, and High Contrast."}]},{"cat":"05","type":"mcq","stem":"Why is synchronizing a computer's system clock to an accurate time source critical for reliable Windows operation?","sub":"time-and-language-settings","options":[{"t":"Authentication protocols and backup scheduling","c":true,"fb":"Network authentication protocols like Kerberos fail if clock drift occurs, and backups misfire."},{"t":"Monitor refresh rate synchronization","c":false,"fb":"Display refresh rates are governed by display hardware and drivers, not the system clock."},{"t":"CPU clock frequency multiplier scaling","c":false,"fb":"CPU multipliers are managed by processor hardware and ACPI states, not system time."},{"t":"Virtual memory paging file allocation","c":false,"fb":"Virtual memory paging is managed based on RAM demand rather than clock synchronization."}]},{"cat":"05","type":"mcq","stem":"Which keyboard shortcut toggles between active input languages and keyboard layouts in Windows?","sub":"time-and-language-settings","options":[{"t":"START + SPACE","c":true,"fb":"Standard shortcut to toggle between installed keyboard languages and input methods."},{"t":"CTRL + SHIFT","c":false,"fb":"Legacy layout switch, but START + SPACE is the standard modern Windows shortcut."},{"t":"ALT + TAB","c":false,"fb":"Standard shortcut to cycle through currently open application windows."},{"t":"START + L","c":false,"fb":"Standard shortcut to immediately lock the Windows workstation console."}]},{"cat":"05","type":"mcq","stem":"Which Windows Settings category configures desktop wallpapers, themes, color schemes, and system fonts?","sub":"personalization-settings","options":[{"t":"Personalization","c":true,"fb":"Manages visual styling, wallpapers, color accents, themes, fonts, and taskbar properties."},{"t":"Time & Language","c":false,"fb":"Manages regional formats, system clock synchronization, speech recognition, and keyboard layouts."},{"t":"Update & Security","c":false,"fb":"Manages operating system patches, feature releases, backup routines, and recovery tools."},{"t":"Privacy & Security","c":false,"fb":"Manages telemetry data collection, diagnostic reporting, and application hardware permissions."}]},{"cat":"05","type":"mcq","stem":"Under Advanced System Settings > Performance Options, how should processor scheduling be configured on an interactive desktop workstation?","sub":"advanced-system-settings","options":[{"t":"Optimize for foreground applications","c":true,"fb":"Ensures responsive user interaction by giving priority to user-facing desktop programs."},{"t":"Optimize for background services","c":false,"fb":"Configures longer time slices appropriate for servers running daemons, not desktop PCs."},{"t":"Allocate equal processor time slices","c":false,"fb":"Windows does not provide a fixed equal round-robin scheduling toggle in this dialog."},{"t":"Dedicate all execution cores to kernel","c":false,"fb":"Starves user applications and renders the interactive desktop shell unresponsive."}]},{"cat":"05","type":"scenario","stem":"Which configuration area inside Advanced System Settings contains these virtual memory settings?","sub":"advanced-system-settings","context":"A technician is troubleshooting system memory bottlenecks on a CAD workstation. To optimize paging behavior, the technician must manually specify custom initial and maximum paging file sizes.","options":[{"t":"Performance Options","c":true,"fb":"Contains visual effects, processor scheduling, and virtual memory paging file configuration."},{"t":"Startup and Recovery","c":false,"fb":"Configures default boot menus, system failure behavior, and memory dump file paths."},{"t":"Hardware Profiles","c":false,"fb":"[outside] Deprecated legacy area for docking stations; does not configure virtual memory."},{"t":"Remote Assistance","c":false,"fb":"Configures remote desktop and assistance permissions rather than storage or memory."}]},{"cat":"05","type":"mcq","stem":"What is the policy regarding operating system updates in standard retail editions of Windows?","sub":"windows-update-policies","options":[{"t":"Paused temporarily but not disabled permanently","c":true,"fb":"Windows Update allows updates to be temporarily delayed but prevents permanent disabling."},{"t":"Postponed without limits through standard system settings","c":false,"fb":"Standard editions allow updates to be paused for limited periods rather than postponed without restriction."},{"t":"Downloaded automatically but installed after manual review","c":false,"fb":"Critical updates download and install automatically without waiting for manual user review."},{"t":"Applied to third-party drivers while bypassing security fixes","c":false,"fb":"Standard Windows Update applies cumulative security patches and feature updates together."}]},{"cat":"05","type":"scenario","stem":"Which type of Windows update is being deployed?","sub":"windows-update-policies","context":"An IT department initiates an automated deployment that introduces major new operating system capabilities and upgrades eligible Windows 10 computers to Windows 11 while retaining user profiles.","options":[{"t":"Feature update","c":true,"fb":"Introduces major OS features and performs in-place version upgrades like Windows 10 to 11."},{"t":"Quality update","c":false,"fb":"[outside] Monthly cumulative update providing security fixes and bug patches without major OS upgrades."},{"t":"Dynamic update","c":false,"fb":"[outside] Pre-installation package updating setup binaries during active OS installation."},{"t":"Definition update","c":false,"fb":"Updates Windows Defender antivirus signatures rather than deploying new OS capabilities."}]},{"cat":"05","type":"mcq","stem":"What consequence occurs on a Windows computer if product activation is not completed within the allowed grace period?","sub":"security-and-product-activation","options":[{"t":"Personalization and OS features are disabled","c":true,"fb":"Customization options lock out and persistent watermark notifications appear on screen."},{"t":"Antivirus definition updates are suspended","c":false,"fb":"Windows Security continues to download malware definitions even on unactivated installations."},{"t":"Local network adapter traffic is blocked","c":false,"fb":"Network adapters maintain full connectivity to allow users to purchase or activate licenses."},{"t":"User sessions automatically log off hourly","c":false,"fb":"[outside] Regular retail Windows continues running active sessions rather than forcing hourly logoffs."}]},{"cat":"05","type":"scenario","stem":"Which interface provides this unified security management console?","sub":"security-and-product-activation","context":"A security administrator needs to verify real-time malware protection status, inspect firewall profiles, and review device hardware security health from a single consolidated dashboard.","options":[{"t":"Windows Security","c":true,"fb":"Serves as the centralized dashboard for Defender antivirus, firewall, and device health."},{"t":"Action Center","c":false,"fb":"Displays incoming system notifications and quick-action toggles rather than security tools."},{"t":"Performance Monitor","c":false,"fb":"Analyzes system resource counters and performance graphs rather than antivirus security."},{"t":"Computer Management","c":false,"fb":"[outside] Hosts administrative consoles like Event Viewer and Disk Management, not antivirus tools."}]},{"cat":"05","type":"mcq","stem":"Which advanced management console displays all installed internal and peripheral hardware, installed driver versions, and resource assignments?","sub":"device-manager","options":[{"t":"Device Manager","c":true,"fb":"Central administrative tool displaying installed hardware, driver versions, and resource states."},{"t":"Devices and Printers","c":false,"fb":"High-level Control Panel applet showing icons for external peripherals without detailed driver data."},{"t":"System Information","c":false,"fb":"Read-only summary tool displaying system specifications rather than managing hardware drivers."},{"t":"Disk Management","c":false,"fb":"Manages disk partitions, volumes, and drive letters rather than general hardware devices."}]},{"cat":"05","type":"mcq","stem":"Which executable or command opens Device Manager directly from the Windows Run dialog?","sub":"device-manager","options":[{"t":"devmgmt.msc","c":true,"fb":"Microsoft Management Console snap-in file that launches Device Manager directly."},{"t":"diskmgmt.msc","c":false,"fb":"Microsoft Management Console snap-in file that launches Disk Management."},{"t":"compmgmt.msc","c":false,"fb":"Microsoft Management Console snap-in file that launches Computer Management."},{"t":"services.msc","c":false,"fb":"Microsoft Management Console snap-in file that launches the Services management console."}]},{"cat":"05","type":"scenario","stem":"What does this yellow exclamation mark indicate?","sub":"device-manager-status-indicators","context":"After assembling a new desktop computer and installing Windows, a technician opens Device Manager and observes a yellow exclamation mark overlay next to an audio controller entry.","options":[{"t":"Missing driver or resource conflict","c":true,"fb":"Windows detected the physical device but failed to find a compatible driver or detected conflicting resources."},{"t":"Disabled device or administrative shutdown","c":false,"fb":"A device turned off manually by a user or administrator is indicated by a down arrow overlay."},{"t":"Unplugged hardware or disconnected cable","c":false,"fb":"Disconnected Plug and Play hardware is removed from view or hidden rather than marked with an exclamation mark."},{"t":"Corrupt firmware or failed self-test","c":false,"fb":"[outside] Device Manager does not inspect internal firmware integrity during basic hardware enumeration."}]},{"cat":"05","type":"scenario","stem":"What does this down arrow overlay signify?","sub":"device-manager-status-indicators","context":"While reviewing installed network devices on a corporate laptop, an IT technician notices a small down arrow overlay on the cellular broadband adapter icon in Device Manager.","options":[{"t":"The device is disabled","c":true,"fb":"Indicates the hardware device has been manually turned off by a user or administrator."},{"t":"The driver is corrupt","c":false,"fb":"Driver corruption or missing software is indicated by a yellow exclamation mark."},{"t":"The device is downloading firmware","c":false,"fb":"Firmware updates do not display down arrow indicator icons in Device Manager."},{"t":"The hardware has an I/O conflict","c":false,"fb":"Resource and I/O conflicts are flagged with a yellow exclamation mark icon."}]},{"cat":"05","type":"mcq","stem":"How should an administrator completely delete a hardware device driver from the Windows operating system?","sub":"device-removal-and-disabling","options":[{"t":"Select Uninstall device in Device Manager","c":true,"fb":"Removes the device registration and allows deletion of the driver software package."},{"t":"Select Disable device in Device Manager","c":false,"fb":"Shuts down device operation but leaves its driver files fully installed in Windows."},{"t":"Disconnect the peripheral cable from PC","c":false,"fb":"Physically removing hardware leaves the driver files registered inside Windows."},{"t":"Click Safely Remove Hardware in taskbar","c":false,"fb":"Flushes cache and unmounts the device for safe removal while leaving its driver installed."}]},{"cat":"05","type":"scenario","stem":"How should the technician stop this malfunctioning hardware from operating?","sub":"device-removal-and-disabling","context":"An integrated sound chip on an office computer emits loud static, disrupting audio calls. The technician cannot open the sealed computer chassis to physically disconnect the chip and wants to preserve the driver for future diagnostics.","options":[{"t":"Disable the device in Device Manager","c":true,"fb":"Shuts off hardware access immediately without uninstalling driver files from the system."},{"t":"Select Uninstall device in Device Manager","c":false,"fb":"Deletes device registration, which may cause Windows to automatically reinstall it at reboot."},{"t":"Clear the device sound cache in Settings","c":false,"fb":"Windows Settings does not have a device cache clearing tool to stop hardware execution."},{"t":"Roll back the device driver to default","c":false,"fb":"Reverts to an earlier driver version but leaves the sound card running and producing noise."}]},{"cat":"05","type":"mcq","stem":"At what resolution and refresh rate are TFT and OLED flat-panel monitors designed to operate for optimal clarity?","sub":"display-and-sound-configuration","options":[{"t":"Native resolution and refresh rate","c":true,"fb":"Flat-panel pixel matrices produce the sharpest rendering when matching their fixed physical grid."},{"t":"Highest interpolated resolution and rate","c":false,"fb":"Interpolated display modes calculate artificial pixels, causing image blur and distortion."},{"t":"Dynamic refresh rate and resolution","c":false,"fb":"[outside] Dynamic modes adjust timing on the fly for gaming but do not define the panel's physical hardware baseline."},{"t":"Maximum GPU-scaled resolution and rate","c":false,"fb":"[outside] GPU upscaling renders above physical panel limits, introducing scaling overhead without improving panel sharpness."}]},{"cat":"05","type":"scenario","stem":"Which setting must be adjusted in Windows Display settings to ensure seamless cursor movement?","sub":"display-and-sound-configuration","context":"A user sets up dual monitors side by side. When moving the mouse pointer across the right edge of the physical left screen, the cursor gets stuck and only crosses over if moved to the bottom corner.","options":[{"t":"Relative display positioning","c":true,"fb":"Rearranging monitor rectangles to match their physical positions ensures smooth cursor travel."},{"t":"Color calibration profile","c":false,"fb":"Adjusts color balance and gamma for graphics accuracy, not mouse cursor coordinates."},{"t":"Refresh rate frequency","c":false,"fb":"Governs screen redraw speed per second and does not influence multi-monitor boundary crossing."},{"t":"Text scaling percentage","c":false,"fb":"Adjusts the size of UI text and icons rather than screen coordinate alignment."}]},{"cat":"05","type":"mcq","stem":"Which hidden file on the root of the boot volume stores memory contents when a computer enters ACPI S4 hibernation?","sub":"acpi-power-states","options":[{"t":"hiberfil.sys","c":true,"fb":"Dedicated root file where active RAM contents are written during ACPI S4 hibernation."},{"t":"pagefile.sys","c":false,"fb":"Manages active virtual memory paging when physical RAM runs low during standard operation."},{"t":"swapfile.sys","c":false,"fb":"Used specifically to page Universal Windows Platform (UWP) app data, not S4 hibernation."},{"t":"bootmgr.sys","c":false,"fb":"[outside] Windows boot manager binary responsible for system startup rather than power-state storage."}]},{"cat":"05","type":"multi","stem":"Which three ACPI power states represent Standby (Suspend to RAM) modes where CPU execution stops while memory remains powered? Select the THREE correct options.","sub":"acpi-power-states","options":[{"t":"S1","c":true,"fb":"Standby state where CPU halts execution while memory remains powered."},{"t":"S2","c":true,"fb":"Deeper standby state cutting CPU power while maintaining system RAM."},{"t":"S3","c":true,"fb":"Low-power Standby (Suspend to RAM) keeping memory active for fast resume."},{"t":"S4","c":false,"fb":"Hibernation (Suspend to Disk) that saves RAM contents to disk and cuts all power."},{"t":"S0","c":false,"fb":"Fully operational working state where all system components receive power."}]},{"cat":"05","type":"mcq","stem":"Which Windows power mode combines Standby and Hibernate by writing memory contents to disk while continuing to power RAM?","sub":"windows-power-modes","options":[{"t":"Hybrid Sleep","c":true,"fb":"Writes RAM to disk while maintaining memory power, allowing fast wake and outage protection."},{"t":"Modern Standby","c":false,"fb":"Connected standby mode using S0 low-power idle to maintain background network tasks."},{"t":"Fast Startup","c":false,"fb":"[outside] Boot acceleration mode saving the kernel session to disk upon complete shutdown."},{"t":"Soft Off","c":false,"fb":"ACPI S5 power state where the system shuts down completely and session state is lost."}]},{"cat":"05","type":"scenario","stem":"Which power management feature enables this continuous background connectivity?","sub":"windows-power-modes","context":"A technician notices that a sleeping executive laptop continues to synchronize incoming emails and accept VoIP calls with minimal battery draw while the screen remains off.","options":[{"t":"Modern Standby","c":true,"fb":"Uses ACPI S0 low-power idle to maintain background networking with minimal battery consumption."},{"t":"Hybrid Sleep","c":false,"fb":"Designed for desktop power-cut protection without maintaining active network connections."},{"t":"ACPI S3 Standby","c":false,"fb":"Cuts power to network adapters, halting email synchronization and incoming VoIP calls."},{"t":"ACPI S4 Hibernate","c":false,"fb":"Powers off the machine completely after writing RAM to disk, preventing all network tasks."}]},{"cat":"05","type":"mcq","stem":"What storage term describes an underlying physical division of space on a hard disk drive or solid-state drive?","sub":"partitions-volumes-and-drives","options":[{"t":"Partition","c":true,"fb":"Identifies an underlying physical division of storage."},{"t":"Volume","c":false,"fb":"Represents a formatted logical storage unit."},{"t":"Drive","c":false,"fb":"Represents a volume assigned an access letter."},{"t":"Cluster","c":false,"fb":"[outside] Represents an allocation unit of file sectors."}]},{"cat":"05","type":"mcq","stem":"In Windows storage terminology, what defines a formatted logical volume that has been assigned an access letter?","sub":"partitions-volumes-and-drives","options":[{"t":"Drive","c":true,"fb":"A formatted volume assigned a specific letter."},{"t":"Partition","c":false,"fb":"An underlying physical division before formatting."},{"t":"Volume","c":false,"fb":"A formatted logical unit without an assigned letter."},{"t":"Spindle","c":false,"fb":"[outside] The mechanical axle rotating magnetic drive platters."}]},{"cat":"05","type":"mcq","stem":"Which volume on Disk 0 contains the Windows operating system files and is assigned the drive letter C?","sub":"windows-default-disk-layout","options":[{"t":"Boot volume","c":true,"fb":"Holds Windows OS files and letter C."},{"t":"System volume","c":false,"fb":"Holds EFI bootloader files without a letter."},{"t":"Recovery partition","c":false,"fb":"Stores recovery environment files without a letter."},{"t":"Paging volume","c":false,"fb":"[outside] Holds virtual memory swap files rather than OS binaries."}]},{"cat":"05","type":"multi","stem":"Which two default Windows Disk 0 partitions do not receive assigned drive letters? Select the TWO correct options.","sub":"windows-default-disk-layout","options":[{"t":"System volume","c":true,"fb":"Houses EFI boot files without an assigned letter."},{"t":"Recovery partition","c":true,"fb":"Stores recovery environment tools without an assigned letter."},{"t":"Boot volume","c":false,"fb":"Assigned the letter C to hold the operating system."},{"t":"User profile volume","c":false,"fb":"[outside] Part of the C drive rather than a separate unlettered partition."},{"t":"Paging file partition","c":false,"fb":"[outside] Managed within the boot volume without a separate partition."}]},{"cat":"05","type":"scenario","stem":"Which partition houses the Extensible Firmware Interface (EFI) bootloader files?","sub":"windows-default-disk-layout","context":"A technician examines the default partition layout of Disk 0 on a UEFI-based Windows installation. The disk contains an OS boot partition, a recovery partition, and a hidden firmware boot structure.","options":[{"t":"System volume","c":true,"fb":"Contains hardware bootloader files and EFI utilities."},{"t":"Boot volume","c":false,"fb":"Holds the main Windows operating system files."},{"t":"Recovery partition","c":false,"fb":"Houses WinRE diagnostic and repair tools."},{"t":"Reserved partition","c":false,"fb":"[outside] Holds partition metadata rather than EFI bootloader code."}]},{"cat":"05","type":"mcq","stem":"Which modern partition style is required to boot systems using UEFI and support disks larger than 2 TB?","sub":"mbr-vs-gpt-partitioning","options":[{"t":"GPT","c":true,"fb":"Supports UEFI boot and disks exceeding 2 TB."},{"t":"MBR","c":false,"fb":"Legacy table limited to BIOS and 2 TB disks."},{"t":"EFS","c":false,"fb":"File-level encryption feature rather than a partition style."},{"t":"ACL","c":false,"fb":"Access control list mechanism for file permissions."}]},{"cat":"05","type":"scenario","stem":"Which partition style must be chosen to allocate the entire drive capacity?","sub":"mbr-vs-gpt-partitioning","context":"A technician connects a newly purchased 4 TB mechanical secondary hard drive to a Windows workstation. Disk Management prompts to initialize the disk before creating volumes.","options":[{"t":"GPT","c":true,"fb":"Accommodates storage capacities exceeding the 2 TB limit."},{"t":"MBR","c":false,"fb":"Caps addressable disk capacity at 2 TB."},{"t":"NTFS","c":false,"fb":"A file system rather than a partition initialization style."},{"t":"FAT32","c":false,"fb":"A file system format limited to 32 GB volumes."}]},{"cat":"05","type":"multi","stem":"Which three advanced storage features are natively supported by NTFS but absent in FAT32? Select the THREE correct options.","sub":"ntfs-vs-fat32-file-systems","options":[{"t":"File-level permissions","c":true,"fb":"Employs access control lists on files and folders."},{"t":"Transparent file encryption","c":true,"fb":"Uses Encrypting File System to protect data."},{"t":"User disk quotas","c":true,"fb":"Restricts maximum storage consumption by individual user accounts."},{"t":"Universal operating system compatibility","c":false,"fb":"FAT32 provides wider cross-platform support across non-Windows operating systems."},{"t":"High seek times","c":false,"fb":"Seek times are mechanical drive characteristics rather than file system features."}]},{"cat":"05","type":"scenario","stem":"Which file system format on the flash drive causes this copy operation to fail?","sub":"ntfs-vs-fat32-file-systems","context":"A user attempts to copy a 5 GB operating system installation ISO file to an empty 64 GB USB flash drive. Windows immediately displays an error stating the file is too large for the destination file system.","options":[{"t":"FAT32","c":true,"fb":"Imposes an absolute individual file size limit of 4 GB."},{"t":"NTFS","c":false,"fb":"Supports file sizes reaching multiple terabytes without issue."},{"t":"exFAT","c":false,"fb":"[outside] Supports individual file sizes far exceeding 4 GB."},{"t":"WinRE","c":false,"fb":"Windows recovery environment rather than a storage file system."}]},{"cat":"05","type":"mcq","stem":"Which command does Windows issue to solid-state drive controllers to identify deleted blocks for wear-leveling?","sub":"disk-fragmentation-and-trim","options":[{"t":"TRIM","c":true,"fb":"Signals deleted data blocks for garbage collection and wear-leveling."},{"t":"UNMAP","c":false,"fb":"[outside] SCSI command used in enterprise SANs and virtualization rather than consumer ATA drives in Windows."},{"t":"FLUSH","c":false,"fb":"[outside] Controller command that commits volatile cache contents to permanent non-volatile storage."},{"t":"PURGE","c":false,"fb":"[outside] Storage management operation that clears temporary caches rather than signaling deleted blocks."}]},{"cat":"05","type":"scenario","stem":"Why should traditional defragmentation be avoided on this solid-state drive?","sub":"disk-fragmentation-and-trim","context":"A junior technician notices reduced storage read speeds on a workstation equipped with a solid-state drive and prepares to run a thorough disk defragmentation schedule.","options":[{"t":"It causes unnecessary cell wear without benefit","c":true,"fb":"Solid-state drives have no read heads and suffer write degradation."},{"t":"It corrupts controller wear-leveling lookup tables","c":false,"fb":"[outside] Drive controllers automatically manage internal translation tables and are not corrupted by defragmentation."},{"t":"It depletes drive over-provisioning reserve blocks","c":false,"fb":"[outside] Over-provisioning blocks are managed by internal firmware rather than exhausted by defragmentation routines."},{"t":"It triggers excessive read-disturb errors in memory","c":false,"fb":"[outside] Read-disturb issues occur during repetitive read cycles rather than active file cluster defragmentation."}]},{"cat":"05","type":"mcq","stem":"Below what percentage of free storage space does Windows boot volume performance begin to degrade significantly?","sub":"disk-capacity-depletion-and-cleanup","options":[{"t":"20 percent","c":true,"fb":"Performance drops noticeably below 20% available space."},{"t":"50 percent","c":false,"fb":"Disks maintain normal operational performance at this level."},{"t":"10 percent","c":false,"fb":"Performance degrades well before reaching this remaining capacity."},{"t":"5 percent","c":false,"fb":"Critical exhaustion point occurring long after degradation begins."}]},{"cat":"05","type":"scenario","stem":"At what remaining free disk capacity threshold does Windows generate this automatic warning?","sub":"disk-capacity-depletion-and-cleanup","context":"A user downloads large video files onto the main C: drive until the storage volume is nearly completely full. Windows suddenly displays an automatic Low Disk Space notification balloon.","options":[{"t":"200 MB","c":true,"fb":"Windows triggers the warning at 200 MB free space."},{"t":"2 GB","c":false,"fb":"Performance may degrade here, but no warning balloon fires."},{"t":"500 MB","c":false,"fb":"[outside] Threshold is lower than half a gigabyte."},{"t":"50 MB","c":false,"fb":"System instability occurs before reaching this low limit."}]},{"cat":"05","type":"mcq","stem":"What physical damage typically occurs when an active mechanical hard disk drive experiences a sudden physical shock or impact?","sub":"storage-drive-damage-types","options":[{"t":"Platter damage and bad sectors","c":true,"fb":"Read/write heads impact magnetic platters, creating bad sectors."},{"t":"Spindle seizure and bearing damage","c":false,"fb":"[outside] Spindle motor bearings can seize from sustained wear or defects, but sudden impacts primarily cause head-to-platter contact."},{"t":"Head misalignment and track errors","c":false,"fb":"[outside] Actuator arm tracking errors can occur over time, but surface platter damage and bad sectors are the direct physical result of impact shock."},{"t":"Circuit fracture and board shorts","c":false,"fb":"[outside] Circuit board traces rarely fracture from moderate drops compared to immediate internal magnetic platter surface damage."}]},{"cat":"05","type":"mcq","stem":"Which Windows security prompt must be confirmed to grant administrative privileges when launching an elevated Command Prompt?","sub":"command-prompt-elevation","options":[{"t":"User Account Control","c":true,"fb":"Prompts the administrator for elevated privilege authorization."},{"t":"Windows Defender Firewall","c":false,"fb":"Manages inbound and outbound network connection rules."},{"t":"Plug and Play Manager","c":false,"fb":"Automatically configures newly connected hardware devices."},{"t":"Windows Activation Guard","c":false,"fb":"Validates operating system licensing rather than privilege elevation."}]},{"cat":"05","type":"scenario","stem":"Which default working directory is displayed upon opening this command window?","sub":"command-prompt-elevation","context":"A support technician searches for \"cmd\" in the Windows Start menu, presses CTRL + SHIFT + ENTER, and accepts the elevation prompt to open administrative CLI tools.","options":[{"t":"C:\\Windows\\System32","c":true,"fb":"Elevated command sessions open in the System32 directory."},{"t":"C:\\Users\\<Username>","c":false,"fb":"Standard non-elevated command sessions open in the user profile directory."},{"t":"C:\\Program Files","c":false,"fb":"Standard installation directory for desktop software applications."},{"t":"C:\\Windows\\Logs","c":false,"fb":"Storage location for system installation and update logs."}]},{"cat":"05","type":"mcq","stem":"Which command switch sorts a Windows command-line directory listing by file size?","sub":"cli-navigation-dir-and-cd","options":[{"t":"dir /o:s","c":true,"fb":"The /o:s switch orders directory output by file size."},{"t":"dir /o:n","c":false,"fb":"Sorts directory output alphabetically by file name."},{"t":"dir /t:w","c":false,"fb":"Displays the last written/modified time field for items."},{"t":"dir /a:s","c":false,"fb":"Filters directory output to show only system files."}]},{"cat":"05","type":"scenario","stem":"Which command immediately switches the working directory to the root of the C: drive?","sub":"cli-navigation-dir-and-cd","context":"A technician is currently navigating within a deeply nested directory path located at `C:\\Users\\Admin\\Documents\\Projects\\2026\\Archive`.","options":[{"t":"cd \\","c":true,"fb":"Immediately navigates to the root of the active drive."},{"t":"cd ..","c":false,"fb":"Moves up exactly one level to the immediate parent directory."},{"t":"cls","c":false,"fb":"Clears the terminal screen without changing the active directory."},{"t":"cd D:","c":false,"fb":"Queries the active path on drive D without changing root."}]},{"cat":"05","type":"mcq","stem":"Which Windows command-line utility is capable of relocating files between directories and renaming existing directories?","sub":"cli-basic-file-operations","options":[{"t":"move","c":true,"fb":"Moves files between locations or renames target directories."},{"t":"copy","c":false,"fb":"Duplicates files to another location without renaming directories."},{"t":"rmdir","c":false,"fb":"Deletes an empty or populated directory from the file system."},{"t":"mkdir","c":false,"fb":"Creates a new directory rather than renaming or moving."}]},{"cat":"05","type":"scenario","stem":"Which command and switch combination executes this deletion quietly?","sub":"cli-basic-file-operations","context":"A network administrator needs to delete an obsolete directory tree containing several nested subfolders and files via a deployment script without pausing for user confirmation prompts.","options":[{"t":"rmdir /s /q","c":true,"fb":"Removes directory trees (/s) quietly without confirmation prompts (/q)."},{"t":"rmdir /s /e","c":false,"fb":"The /e parameter is a robocopy switch, not a valid rmdir switch."},{"t":"mkdir /s /q","c":false,"fb":"The mkdir command creates new directories rather than deleting them."},{"t":"copy /s /q","c":false,"fb":"The copy command duplicates files rather than removing directory structures."}]},{"cat":"05","type":"mcq","stem":"Which robust command-line file copy utility is designed to replace xcopy by reliably preserving NTFS attributes and directory structures?","sub":"robocopy-utility","options":[{"t":"robocopy","c":true,"fb":"Robust file copy utility preserving NTFS attributes and hierarchies."},{"t":"copy","c":false,"fb":"Basic file copy command lacking robust synchronization capabilities."},{"t":"diskpart","c":false,"fb":"Disk partitioning utility rather than a file copy utility."},{"t":"chkdsk","c":false,"fb":"File system integrity scanner rather than a file replication tool."}]},{"cat":"05","type":"mcq","stem":"Which switch added to the robocopy command instructs it to copy all subdirectories, including empty directories?","sub":"robocopy-utility","options":[{"t":"/e","c":true,"fb":"Copies subdirectories including empty ones."},{"t":"/s","c":false,"fb":"Copies subdirectories containing files but excludes empty directories."},{"t":"/b","c":false,"fb":"[outside] Copies files in Backup mode with administrative privileges rather than copying empty subdirectories."},{"t":"/m","c":false,"fb":"[outside] Copies only files with the Archive attribute set rather than including empty subdirectories."}]},{"cat":"05","type":"mcq","stem":"Which interactive command-line utility enables disk partitioning and permits destructive operations on system volumes without GUI safeguards?","sub":"diskpart-utility","options":[{"t":"diskpart","c":true,"fb":"Interactive partition tool allowing unsafeguarded disk operations."},{"t":"chkdsk","c":false,"fb":"Verifies file system integrity and scans for bad sectors."},{"t":"cleanmgr","c":false,"fb":"Launches Disk Cleanup to remove temporary operating system files."},{"t":"resmon","c":false,"fb":"Opens Resource Monitor to inspect real-time process resource consumption."}]},{"cat":"05","type":"scenario","stem":"What is the first command the administrator must enter inside the diskpart sub-shell to target this physical drive?","sub":"diskpart-utility","context":"A storage administrator opens an elevated Command Prompt and types `diskpart` to enter the interactive partitioning environment. The administrator needs to inspect and modify partitions on the primary physical drive.","options":[{"t":"select disk 0","c":true,"fb":"Designates the primary physical hard disk as the active target."},{"t":"detail volume 1","c":false,"fb":"Displays volume properties after a volume has already been chosen."},{"t":"format /fs:ntfs","c":false,"fb":"Formats a partition but cannot execute before selecting a target drive."},{"t":"assign letter=c","c":false,"fb":"Mounts a volume letter after partition selection and creation."}]},{"cat":"05","type":"mcq","stem":"Which Windows command-line utility prepares a storage volume with a specified file system and checks for bad sectors by default?","sub":"format-command","options":[{"t":"format","c":true,"fb":"Prepares volumes with a file system and scans bad sectors."},{"t":"chkdsk","c":false,"fb":"Tests existing file system integrity and repairs sector errors."},{"t":"sfc","c":false,"fb":"Verifies protected system files against the local cache."},{"t":"robocopy","c":false,"fb":"Copies directory trees and files across storage volumes."}]},{"cat":"05","type":"mcq","stem":"Which Windows command-line utility verifies the integrity of the file system and scans storage drives for bad sectors?","sub":"chkdsk-utility","options":[{"t":"chkdsk","c":true,"fb":"Verifies file system integrity and scans disk sectors."},{"t":"diskpart","c":false,"fb":"Manages disk partitions, volumes, and drive letter assignments."},{"t":"sfc","c":false,"fb":"Scans and repairs corrupted operating system DLL files."},{"t":"cleanmgr","c":false,"fb":"Scans and clears temporary files to recover disk space."}]},{"cat":"05","type":"scenario","stem":"How does Windows respond when this chkdsk command is executed against the active boot drive?","sub":"chkdsk-utility","context":"A technician opens an elevated command prompt on a running Windows workstation and executes `chkdsk C: /f` to repair suspected file system errors on the active operating system drive.","options":[{"t":"Prompts to schedule scan at restart","c":true,"fb":"Active operating system drives cannot be locked, so Windows offers to run autochk at the next boot."},{"t":"Executes read-only scan without making repairs","c":false,"fb":"The /f switch requests repair, which cannot run read-only; Windows prompts to reschedule instead."},{"t":"Locks open files while pausing background services","c":false,"fb":"Windows cannot lock an active boot volume during normal operation by pausing services."},{"t":"Aborts operation and reports an access error","c":false,"fb":"An elevated prompt has sufficient privileges, but prompts for a reboot scan rather than aborting."}]},{"cat":"05","type":"mcq","stem":"Which Windows command-line utility controls system logoff, computer power-down, restart, and hibernation states?","sub":"shutdown-command","options":[{"t":"shutdown","c":true,"fb":"Manages system power-off, restart, logoff, and hibernation."},{"t":"diskpart","c":false,"fb":"Controls partition structures and storage volume configurations."},{"t":"taskkill","c":false,"fb":"[outside] Terminates specific running processes and applications by PID."},{"t":"devmgmt","c":false,"fb":"Opens Device Manager to configure installed hardware components."}]},{"cat":"05","type":"scenario","stem":"Which switch added to the shutdown command aborts this active timed restart before the timer expires?","sub":"shutdown-command","context":"An administrator mistakenly initiates a remote computer restart with a 60-second delay timer by executing a command in the Command Prompt.","options":[{"t":"/a","c":true,"fb":"The /a switch aborts a pending timed shutdown or restart."},{"t":"/s","c":false,"fb":"Shuts down the computer rather than aborting the pending action."},{"t":"/l","c":false,"fb":"Logs off the current user session without aborting the shutdown timer."},{"t":"/h","c":false,"fb":"Puts the system into hibernation instead of canceling the restart."}]},{"cat":"05","type":"mcq","stem":"Which command-line utility scans protected Windows Resource Protection files and replaces corrupted files using the local cache?","sub":"sfc-utility","options":[{"t":"sfc","c":true,"fb":"System File Checker verifies and repairs protected system files."},{"t":"chkdsk","c":false,"fb":"Checks storage volume integrity and recovers bad sectors."},{"t":"diskpart","c":false,"fb":"Configures storage partitions and volume attributes."},{"t":"robocopy","c":false,"fb":"Replicates file hierarchies and preserves directory attributes."}]},{"cat":"05","type":"mcq","stem":"Which switch parameter instructs the sfc utility to execute an immediate scan and repair of all protected system files?","sub":"sfc-utility","options":[{"t":"/scannow","c":true,"fb":"Scans and repairs protected operating system files immediately."},{"t":"/verifyonly","c":false,"fb":"[outside] Scans system file integrity without performing repairs on corrupted files."},{"t":"/scanonce","c":false,"fb":"Schedules a single system file verification to run during the next restart."},{"t":"/scanboot","c":false,"fb":"Configures system file verification to execute every time the computer boots."}]},{"cat":"05","type":"mcq","stem":"What is the first step in the structured CompTIA six-step troubleshooting methodology?","sub":"troubleshooting-methodology-steps","options":[{"t":"Identify the problem","c":true,"fb":"The first troubleshooting step, focusing on gathering user symptoms and establishing problem scope."},{"t":"Determine possible cause","c":false,"fb":"The fifth step, which correlates observations to establish the root issue after gathering data."},{"t":"Interpret diagnostic results","c":false,"fb":"The fourth step, which formulates hypotheses based on observed facts and metrics."},{"t":"Gather system evidence","c":false,"fb":"The third step, which collects resource counters, error logs, and hardware states."}]},{"cat":"05","type":"multi","stem":"Which three actions constitute the first three consecutive steps of the CompTIA troubleshooting methodology? Select the THREE correct options.","sub":"troubleshooting-methodology-steps","options":[{"t":"Identify the problem","c":true,"fb":"First step gathering initial user symptoms."},{"t":"Select an appropriate tool","c":true,"fb":"Second step choosing diagnostic utilities."},{"t":"Gather evidence","c":true,"fb":"Third step observing logs and hardware status."},{"t":"Recommend next action","c":false,"fb":"The sixth and final step in the workflow."},{"t":"Disassemble all hardware","c":false,"fb":"[outside] Unwarranted physical teardown not included in the methodology."}]},{"cat":"05","type":"mcq","stem":"Which Windows administrative tool provides a quick, real-time snapshot of running processes and high-level hardware performance tabs?","sub":"task-manager","options":[{"t":"Task Manager","c":true,"fb":"Provides real-time process monitoring and performance tabs."},{"t":"Event Viewer","c":false,"fb":"Displays recorded operational and diagnostic log files."},{"t":"Device Manager","c":false,"fb":"Displays installed hardware status and driver assignments."},{"t":"System Information","c":false,"fb":"Displays comprehensive hardware specs and BIOS versions."}]},{"cat":"05","type":"mcq","stem":"Which executable filename opens Task Manager directly when entered into the Windows Run dialog?","sub":"task-manager","options":[{"t":"taskmgr.exe","c":true,"fb":"Direct executable name for launching Task Manager."},{"t":"resmon.exe","c":false,"fb":"Launches the in-depth Resource Monitor utility."},{"t":"perfmon.exe","c":false,"fb":"Launches the long-term Performance Monitor utility."},{"t":"cleanmgr.exe","c":false,"fb":"Launches the Disk Cleanup storage management utility."}]},{"cat":"05","type":"mcq","stem":"A workstation experiences severe slowdowns. Task Manager indicates that physical RAM is near capacity and paging file utilization remains consistently high. What condition does this pattern indicate?","sub":"task-manager-memory-interpretation","options":[{"t":"Physical memory starvation","c":true,"fb":"Sustained high paging file utilization alongside full RAM indicates physical memory starvation."},{"t":"Normal memory caching","c":false,"fb":"High RAM usage alone can be normal caching, but sustained paging indicates inadequate physical RAM."},{"t":"Processor thread saturation","c":false,"fb":"Processor scheduling manages thread execution priorities rather than virtual paging file allocation."},{"t":"Video memory fragmentation","c":false,"fb":"Paging file activity reflects system RAM exhaustion rather than GPU video memory allocation."}]},{"cat":"05","type":"scenario","stem":"What does this operational state indicate?","sub":"task-manager-memory-interpretation","context":"A technician monitors a Windows 10 workstation that is running multiple office applications smoothly. Task Manager reports physical RAM usage at 90%, while paging file utilization remains below 5%.","options":[{"t":"Normal Windows data caching","c":true,"fb":"Windows aggressively caches data in available RAM while keeping paging file activity low."},{"t":"Critical memory starvation","c":false,"fb":"Memory starvation requires high paging file activity alongside exhausted physical RAM."},{"t":"Unresolved virtual memory leak","c":false,"fb":"Memory leaks steadily drive up paging file commits and degrade responsiveness over time."},{"t":"Faulty address bus allocation","c":false,"fb":"Hardware allocation faults generate system crash errors rather than high cache retention."}]},{"cat":"05","type":"mcq","stem":"Which built-in Windows utility provides detailed process-level breakdowns of real-time disk read/write queues, network connections, and open file handles?","sub":"resource-monitor","options":[{"t":"Resource Monitor","c":true,"fb":"Resource Monitor tracks per-process disk queues, open file handles, and network connections."},{"t":"Performance Monitor","c":false,"fb":"Performance Monitor tracks counter sets over extended timeframes rather than immediate file handles."},{"t":"Task Manager","c":false,"fb":"Task Manager shows high-level performance metrics but does not list process-level file handles."},{"t":"Device Manager","c":false,"fb":"Device Manager manages driver configurations and hardware statuses, not real-time disk queues."}]},{"cat":"05","type":"mcq","stem":"Which executable command opens Resource Monitor directly from the command prompt or Run dialog box?","sub":"resource-monitor","options":[{"t":"resmon.exe","c":true,"fb":"The command resmon.exe immediately launches Resource Monitor."},{"t":"perfmon.exe","c":false,"fb":"The perfmon.exe command launches Performance Monitor instead of Resource Monitor."},{"t":"taskmgr.exe","c":false,"fb":"The taskmgr.exe command launches Task Manager."},{"t":"msinfo32.exe","c":false,"fb":"The msinfo32.exe command launches the System Information utility."}]},{"cat":"05","type":"mcq","stem":"Which Windows administrative console records system events, driver load failures, software application crashes, and security audit logs?","sub":"event-viewer","options":[{"t":"Event Viewer","c":true,"fb":"Event Viewer centralizes operating system, application, and security audit event logs in dedicated records."},{"t":"Resource Monitor","c":false,"fb":"Tracks real-time process threads, disk queues, and network connections rather than recording discrete event logs."},{"t":"Performance Monitor","c":false,"fb":"Records quantitative system counter metrics over time rather than application crash events."},{"t":"Reliability Monitor","c":false,"fb":"[outside] Displays a timeline stability index rather than hosting the raw system and security event logs."}]},{"cat":"05","type":"mcq","stem":"Which Microsoft Management Console (.msc) file launches Event Viewer from the Windows Run prompt or command line?","sub":"event-viewer","options":[{"t":"eventvwr.msc","c":true,"fb":"Running eventvwr.msc opens the Event Viewer console."},{"t":"devmgmt.msc","c":false,"fb":"Launches the Device Manager console to manage hardware devices and drivers."},{"t":"diskmgmt.msc","c":false,"fb":"[outside] Launches the Disk Management console to configure partitions and storage volumes."},{"t":"compmgmt.msc","c":false,"fb":"[outside] Launches the Computer Management console which hosts multiple administrative tools together."}]},{"cat":"05","type":"multi","stem":"Under the standard Windows Logs node in Event Viewer, events are grouped into four primary categories. Select the FOUR standard Windows Logs categories.","sub":"event-viewer-categories-and-severities","options":[{"t":"System","c":true,"fb":"System logs record core OS component events and driver status."},{"t":"Application","c":true,"fb":"Application logs record events raised by installed programs and software services."},{"t":"Security","c":true,"fb":"Security logs record audit events including logons and privilege changes."},{"t":"Setup","c":true,"fb":"Setup logs record operating system and update installation events."},{"t":"Performance","c":false,"fb":"Performance is not a standard Windows Logs category; performance counters belong to Performance Monitor."},{"t":"Network","c":false,"fb":"[outside] Network is not a standard Windows Logs category under Windows Logs in Event Viewer."}]},{"cat":"05","type":"scenario","stem":"Which event severity level signifies that a core system component or service has halted completely?","sub":"event-viewer-categories-and-severities","context":"While reviewing the System log in Event Viewer after an unexpected operating system reboot, an administrator filters entries to identify the primary failure that caused the outage.","options":[{"t":"Critical","c":true,"fb":"Critical indicates the highest severity where a system component or service has failed completely."},{"t":"Error","c":false,"fb":"Error indicates a significant non-fatal service or operational failure rather than a complete system halt."},{"t":"Warning","c":false,"fb":"Warning indicates a potential future issue, such as low drive capacity."},{"t":"Audit Failure","c":false,"fb":"Audit Failure records access or authentication denials in the Security log."}]},{"cat":"05","type":"mcq","stem":"Which Windows diagnostic utility compiles a detailed inventory of hardware specifications, BIOS/UEFI firmware versions, and installed driver paths in a single window?","sub":"system-information-tool","options":[{"t":"System Information","c":true,"fb":"System Information aggregates detailed hardware specifications, firmware versions, and driver file paths."},{"t":"Device Manager","c":false,"fb":"Device Manager configures hardware devices and drivers but does not provide an integrated system summary report."},{"t":"Task Manager","c":false,"fb":"Task Manager tracks active runtime resource utilization rather than firmware and driver paths."},{"t":"Resource Monitor","c":false,"fb":"Resource Monitor inspects real-time process resource consumption."}]},{"cat":"05","type":"mcq","stem":"Which executable command is entered in the Windows Run prompt or command line to open the System Information utility?","sub":"system-information-tool","options":[{"t":"msinfo32.exe","c":true,"fb":"The command msinfo32.exe launches the System Information utility."},{"t":"msconfig.exe","c":false,"fb":"[outside] Launches the System Configuration utility to configure boot options and services."},{"t":"resmon.exe","c":false,"fb":"Launches Resource Monitor to inspect real-time process resources and disk queues."},{"t":"perfmon.exe","c":false,"fb":"Launches Performance Monitor to analyze performance counters and system graphs."}]},{"cat":"05","type":"mcq","stem":"Which diagnostic utility uses customizable counters, real-time graph visualization, and data collector sets to track intermittent performance bottlenecks over days or weeks?","sub":"performance-monitor","options":[{"t":"Performance Monitor","c":true,"fb":"Performance Monitor logs customizable performance counters over time using data collector sets."},{"t":"Resource Monitor","c":false,"fb":"Resource Monitor displays real-time resource usage but does not log data collector sets over extended periods."},{"t":"Task Manager","c":false,"fb":"Task Manager displays immediate performance snapshots without long-term counter logging."},{"t":"Event Viewer","c":false,"fb":"Event Viewer logs discrete system events rather than continuous numerical performance metrics."}]},{"cat":"05","type":"mcq","stem":"Which executable command launches the Performance Monitor console from the Run dialog or command line?","sub":"performance-monitor","options":[{"t":"perfmon.exe","c":true,"fb":"The executable perfmon.exe launches Performance Monitor."},{"t":"resmon.exe","c":false,"fb":"The resmon.exe command launches Resource Monitor."},{"t":"taskmgr.exe","c":false,"fb":"The taskmgr.exe command launches Task Manager."},{"t":"cleanmgr.exe","c":false,"fb":"The cleanmgr.exe command launches Disk Cleanup."}]},{"cat":"05","type":"mcq","stem":"Which command-line executable launches the Disk Cleanup utility to scan drives and remove temporary files, Recycle Bin contents, and cached update files?","sub":"cleanmgr-tool","options":[{"t":"cleanmgr.exe","c":true,"fb":"The cleanmgr.exe command runs Disk Cleanup to free storage space."},{"t":"diskmgmt.msc","c":false,"fb":"The diskmgmt.msc console manages partitions and volumes, not temporary file deletion."},{"t":"diskpart.exe","c":false,"fb":"The diskpart.exe tool partitions disks and does not scan or delete temporary files."},{"t":"chkdsk.exe","c":false,"fb":"The chkdsk.exe utility checks file system integrity and repairs disk errors."}]},{"cat":"05","type":"mcq","stem":"Which addressing mechanism automatically assigns an IP address within the 169.254.0.0/16 address space when a client fails to contact a DHCP server?","sub":"network-adapter-connection-states","options":[{"t":"APIPA","c":true,"fb":"Automatically assigns link-local addresses in the 169.254.0.0/16 range when no DHCP server responds."},{"t":"DHCP","c":false,"fb":"Dynamically leases IP addresses from a network server rather than generating link-local fallback addresses."},{"t":"SLAAC","c":false,"fb":"[outside] Generates IPv6 addresses automatically using router advertisements rather than IPv4 fallback."},{"t":"BOOTP","c":false,"fb":"[outside] Legacy network protocol that retrieves IP configuration from a server rather than generating local addresses."}]},{"cat":"05","type":"scenario","stem":"What scope of network communication is permitted for this computer?","sub":"network-adapter-connection-states","context":"An office workstation's network adapter status displays \"Limited Connectivity.\" Running ipconfig reveals that the Ethernet adapter has been assigned the IPv4 address 169.254.10.5 with a subnet mask of 255.255.0.0 and no default gateway.","options":[{"t":"Communication with local subnet hosts","c":true,"fb":"APIPA link-local addresses allow communication solely with hosts on the same physical broadcast domain."},{"t":"Communication across routed private subnets","c":false,"fb":"APIPA addresses lack a default gateway and cannot route traffic across intermediate routers to other subnets."},{"t":"Communication restricted to local loopback","c":false,"fb":"The host can communicate with other APIPA clients on the same link, not merely internal loopback."},{"t":"Communication with public Internet hosts","c":false,"fb":"APIPA addresses are non-routable link-local addresses that cannot traverse the public Internet."}]},{"cat":"05","type":"mcq","stem":"Which specific web address does the Windows operating system probe to test outbound Internet connectivity and DNS name resolution?","sub":"network-no-internet-state","options":[{"t":"www.msftconnecttest.com","c":true,"fb":"Windows probes www.msftconnecttest.com to confirm active Internet connectivity."},{"t":"www.msftncsi.com","c":false,"fb":"[outside] Legacy Network Connectivity Status Indicator probe address utilized in earlier Windows releases."},{"t":"www.msftdiagnostics.com","c":false,"fb":"[outside] Not an active network connectivity probe address utilized by the Windows operating system."},{"t":"www.msftconnectivity.com","c":false,"fb":"[outside] Fictitious address not utilized by the Windows Network Connectivity Status Indicator service."}]},{"cat":"05","type":"scenario","stem":"Which connection status does Windows assign to this network interface?","sub":"network-no-internet-state","context":"A laptop connected to an office Wi-Fi network receives a valid local IP address, subnet mask, and default gateway from DHCP. However, the client fails to resolve domain names or reach external websites.","options":[{"t":"No Internet Access","c":true,"fb":"A valid gateway configuration lacking outbound connectivity triggers the No Internet Access status."},{"t":"Limited Connectivity","c":false,"fb":"Limited Connectivity typically indicates a DHCP failure where an APIPA address is assigned."},{"t":"Disconnected","c":false,"fb":"Disconnected indicates that the physical cable is unplugged or the Wi-Fi radio is off."},{"t":"Unidentified Network","c":false,"fb":"Unidentified network refers to location profile classification rather than Internet connectivity state."}]},{"cat":"05","type":"mcq","stem":"Which command-line utility displays the basic IPv4/IPv6 address, subnet mask, and default gateway for all active network interfaces?","sub":"ipconfig-utility","options":[{"t":"ipconfig","c":true,"fb":"The ipconfig command outputs IP addresses, subnet masks, and default gateways for active interfaces."},{"t":"netsh","c":false,"fb":"[outside] Command-line scripting utility used to modify network configurations rather than viewing basic IP summaries."},{"t":"route","c":false,"fb":"[outside] Displays and manipulates the local IP routing table rather than reporting adapter configuration."},{"t":"getmac","c":false,"fb":"[outside] Displays Media Access Control (MAC) hardware addresses rather than IP addresses and gateways."}]},{"cat":"05","type":"mcq","stem":"A technician needs to clear stale and incorrect DNS records stored locally on a client machine. Which ipconfig command switch performs this action?","sub":"ipconfig-utility","options":[{"t":"/flushdns","c":true,"fb":"The /flushdns switch purges and resets the local DNS resolver cache."},{"t":"/displaydns","c":false,"fb":"Outputs the current contents of the local DNS resolver cache to the console without clearing entries."},{"t":"/registerdns","c":false,"fb":"[outside] Initiates manual dynamic registration of DNS names and IP addresses with DNS servers."},{"t":"/cleardns","c":false,"fb":"[outside] Fictitious command switch; not a valid parameter for the ipconfig utility."}]},{"cat":"05","type":"mcq","stem":"Which command-line diagnostic tool transmits ICMP Echo Request packets to verify basic layer-3 network connectivity with a destination host?","sub":"ping-utility","options":[{"t":"ping","c":true,"fb":"The ping command uses ICMP Echo Request and Echo Reply messages to test connectivity."},{"t":"tracert","c":false,"fb":"Increments TTL values sequentially to map intermediate router hops rather than testing basic single-host reachability."},{"t":"pathping","c":false,"fb":"Combines ping and tracert over an extended testing window to analyze per-hop packet loss."},{"t":"netstat","c":false,"fb":"Displays active TCP/UDP sockets and interface statistics rather than sending ICMP echo requests."}]},{"cat":"05","type":"mcq","stem":"When monitoring network stability during a cable replacement, which ping switch instructs the command to send echo requests continuously until interrupted with CTRL + C?","sub":"ping-utility","options":[{"t":"-t","c":true,"fb":"The -t switch forces ping to transmit echo requests continuously until halted."},{"t":"-a","c":false,"fb":"The -a switch resolves IP addresses to hostnames."},{"t":"-n","c":false,"fb":"The -n switch specifies a fixed count of echo requests to send."},{"t":"-l","c":false,"fb":"The -l switch specifies the send buffer payload size."}]},{"cat":"05","type":"mcq","stem":"When troubleshooting network connectivity using the standard five-step ping diagnostic methodology, which IP address must be tested first?","sub":"ping-diagnostic-sequence","options":[{"t":"127.0.0.1","c":true,"fb":"Pinging the local loopback address (127.0.0.1) is step 1, confirming the local TCP/IP stack is functioning."},{"t":"192.168.1.50","c":false,"fb":"Pinging the assigned local IP address tests network adapter binding, performed in step 2."},{"t":"192.168.1.1","c":false,"fb":"Pinging the local default gateway tests local physical LAN connectivity, performed in step 3."},{"t":"8.8.8.8","c":false,"fb":"Pinging a remote external address tests router forwarding through the gateway, performed in step 4."}]},{"cat":"05","type":"scenario","stem":"At which network component does this diagnostic failure isolate the problem?","sub":"ping-diagnostic-sequence","context":"A user cannot connect to network file shares or websites. A technician executes the ping diagnostic sequence: pings to 127.0.0.1 and the workstation's static IP succeed, but pings to the default gateway (192.168.1.1) time out.","options":[{"t":"Local patch cable or switch port","c":true,"fb":"Failing at the default gateway step isolates the issue to the local physical connection or switch."},{"t":"Local TCP/IP protocol stack","c":false,"fb":"A successful loopback ping confirms the local TCP/IP software stack is healthy."},{"t":"Remote DNS name server resolution","c":false,"fb":"Gateway ping uses direct IP addresses; DNS is tested in step 5 using hostnames."},{"t":"External ISP router forwarding","c":false,"fb":"ISP routing issues affect remote IP forwarding (step 4), not the local gateway link."}]},{"cat":"05","type":"scenario","stem":"What underlying network condition causes this error response?","sub":"ping-error-messages","context":"A technician pings another workstation located on the same local IP subnet (192.168.1.55). The ping utility immediately returns the message: \"Reply from 192.168.1.20: Destination host unreachable.\"","options":[{"t":"No ARP response was received","c":true,"fb":"Destination host unreachable on a local subnet indicates failure to resolve the target MAC address via ARP."},{"t":"A remote router dropped packets","c":false,"fb":"Local subnet communication does not pass through routers; router drops cause hop timeout errors."},{"t":"The DNS server failed lookup","c":false,"fb":"Pinging by raw IP bypasses DNS lookup entirely."},{"t":"The local loopback adapter failed","c":false,"fb":"Loopback failure prevents packet transmission rather than generating host unreachable replies."}]},{"cat":"05","type":"scenario","stem":"What does the \"Request timed out\" notification indicate about packet transmission?","sub":"ping-error-messages","context":"While testing connectivity to an external web server by IP address, a network administrator runs ping and observes that all four transmitted echo packets result in \"Request timed out.\"","options":[{"t":"Packets were sent without reply","c":true,"fb":"Request timed out indicates the packet was routed, but no echo reply returned before timeout."},{"t":"The local network cable disconnected","c":false,"fb":"A disconnected cable generates a media disconnected or general failure error message."},{"t":"The default gateway is invalid","c":false,"fb":"An invalid or missing gateway generates a network unreachable or transmission failure error."},{"t":"The target hostname failed lookup","c":false,"fb":"Hostname resolution failure prevents sending packets and produces an unresolvable host error."}]},{"cat":"05","type":"mcq","stem":"Which diagnostic utility discovers the route taken across an IP network by sending packets with progressively increasing Time-To-Live (TTL) values?","sub":"tracert-utility","options":[{"t":"tracert","c":true,"fb":"The tracert utility increments TTL values to map every router hop to a remote destination."},{"t":"pathping","c":false,"fb":"Combines ping and tracert to analyze packet loss per hop over time rather than simply mapping the path with TTL increments."},{"t":"route","c":false,"fb":"[outside] Displays and edits the local IP routing table rather than discovering network hops by sending packets."},{"t":"ping","c":false,"fb":"Sends echo requests with standard TTLs to test destination reachability without mapping intermediate hops."}]},{"cat":"05","type":"mcq","stem":"What intermediate network data does the tracert command display for each router hop along the path to a remote destination?","sub":"tracert-utility","options":[{"t":"Router IP and round-trip time","c":true,"fb":"Tracert outputs the IP address and round-trip response times for each intermediate router."},{"t":"Packet loss percentage and latency","c":false,"fb":"Calculating statistical packet loss percentages per hop requires running pathping."},{"t":"Interface MAC address and MTU","c":false,"fb":"[outside] Tracert operates at layer 3 and does not display layer 2 MAC addresses or MTU sizes."},{"t":"Routing protocol metric and flags","c":false,"fb":"[outside] Tracert measures ICMP transit times rather than reporting internal routing protocol metric values."}]},{"cat":"05","type":"mcq","stem":"Which command-line diagnostic tool combines the functionality of ping and tracert over an extended measurement window to calculate packet loss percentages at each router hop?","sub":"pathping-utility","options":[{"t":"pathping","c":true,"fb":"The pathping utility combines ping and tracert to calculate latency and packet loss per hop."},{"t":"tracert","c":false,"fb":"Reports round-trip times for intermediate hops but does not calculate packet loss percentages over an extended sampling window."},{"t":"ping","c":false,"fb":"Tests reachability to an endpoint but does not analyze individual intermediate hops along the network path."},{"t":"route","c":false,"fb":"[outside] Displays and configures local IP routing tables rather than measuring latency and packet loss across hops."}]},{"cat":"05","type":"scenario","stem":"Which utility should the technician run over a multi-minute measurement window to isolate the problematic hop?","sub":"pathping-utility","context":"Users report intermittent packet loss and degraded VoIP quality when connecting to a remote branch office. A technician needs to pinpoint exactly which intermediate router along the path is dropping packets.","options":[{"t":"pathping","c":true,"fb":"The pathping tool analyzes intermediate hops over several minutes to report per-hop packet loss."},{"t":"tracert","c":false,"fb":"Standard tracert does not sample hops over time to calculate statistical packet loss percentages."},{"t":"ping","c":false,"fb":"Standard ping measures loss only at the final destination host, not across each intermediate router."},{"t":"nslookup","c":false,"fb":"The nslookup tool tests DNS name resolution rather than router packet loss."}]},{"cat":"05","type":"mcq","stem":"Which command-line diagnostic tool queries Domain Name System (DNS) servers to resolve hostnames, verify IP mappings, and inspect specific resource records?","sub":"nslookup-utility","options":[{"t":"nslookup","c":true,"fb":"The nslookup tool queries DNS name servers to test name resolution and inspect records."},{"t":"dig","c":false,"fb":"[outside] Specialized DNS lookup utility common in Unix environments rather than the default Windows built-in tool."},{"t":"dnscmd","c":false,"fb":"[outside] Administrative utility used to configure and manage Windows DNS Server services rather than client record queries."},{"t":"whois","c":false,"fb":"[outside] Queries domain registrar databases for ownership and registration details rather than querying DNS servers for resource records."}]},{"cat":"05","type":"scenario","stem":"Which command syntax correctly executes this targeted query?","sub":"nslookup-utility","context":"An administrator investigates an email routing issue and needs to bypass local DNS servers to query Google Public DNS (8.8.8.8) specifically for the Mail Exchange (MX) records of domain comptia.org.","options":[{"t":"nslookup -type=mx comptia.org 8.8.8.8","c":true,"fb":"The syntax `nslookup -type=mx comptia.org 8.8.8.8` targets server 8.8.8.8 for MX records."},{"t":"nslookup -type=mx 8.8.8.8 comptia.org","c":false,"fb":"Places the server IP ahead of the domain, causing nslookup to treat 8.8.8.8 as the target query host."},{"t":"nslookup comptia.org 8.8.8.8 -type=mx","c":false,"fb":"Places the switch parameter at the end rather than preceding the target host argument."},{"t":"nslookup -type=mail comptia.org 8.8.8.8","c":false,"fb":"Uses the descriptive word mail rather than the official DNS resource record abbreviation mx."}]},{"cat":"05","type":"mcq","stem":"Which command-line diagnostic utility displays active TCP connections, listening ports, Ethernet interface statistics, and IPv4/IPv6 protocol counters?","sub":"netstat-utility","options":[{"t":"netstat","c":true,"fb":"The netstat utility displays active TCP connections, listening ports, and protocol statistics."},{"t":"nbtstat","c":false,"fb":"[outside] Displays NetBIOS over TCP/IP protocol statistics and name resolution tables rather than general TCP connections."},{"t":"netsh","c":false,"fb":"[outside] Command-line scripting framework used to configure networking components rather than monitoring active sockets."},{"t":"route","c":false,"fb":"[outside] Displays and manages IP routing tables rather than active transport layer connections and listening ports."}]},{"cat":"05","type":"mcq","stem":"In an elevated command prompt, which netstat switch displays the executable program name involved in creating each active network connection or listening port?","sub":"netstat-utility","options":[{"t":"-b","c":true,"fb":"The -b switch displays the executable component that opened each active connection or listening port."},{"t":"-a","c":false,"fb":"The -a switch displays all active connections and listening ports without process names."},{"t":"-o","c":false,"fb":"The -o switch displays the numerical Process ID (PID) rather than the executable program name."},{"t":"-n","c":false,"fb":"The -n switch displays addresses and port numbers in numerical format without name resolution."}]}]};

// with a missing/unknown key becomes 'other' (excluded from exam

BANK.forEach(q => {

// ── Sub-topic (variant) groups ──────────────────────────────────
// Questions that carry the same `sub` key inside the same category
// are VARIANTS OF ONE CONCEPT — three different ways of asking about
// the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  const pool = availableQuestions();
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = pool.filter(q => q.cat === c.key).length;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}
