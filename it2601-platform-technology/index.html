<style>

:root{--bg:#0F0E13;--bg-2:#1C1A22;--bg-deep:#25222E;--bg-raise:#2E2A3A;--ink:#F4F1EA;--ink-soft:#B9B6C0;--ink-mute:#8B8895;--rule:#2A2733;--rule-strong:#3F3A4D;--accent:#C9A96E;--accent-deep:#6B5530;--accent-soft:#2A2115;--correct:#7FC49A;--correct-bg:#14261D;--correct-edge:#2C4A3A;--wrong:#E0707F;--wrong-bg:#2B151B;--wrong-edge:#4A2530;--gold:#A98BE0;--gold-bg:#211A33;--gold-edge:#3F3163;--purple:#5B3F8C;--purple-lt:#8A6BC4;--shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);--display:"Cormorant Garamond",Garamond,"Palatino Linotype",Georgia,serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",Menlo,monospace;--tok-type:#A98BE0;}

.qverdict-icon { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 1.125rem; line-height: 1; }

/* --- palette test overrides --- */
.masthead,.divider-double{border-color:var(--accent)}
.display{font-weight:600}.display em{font-weight:600}
.qstem{font-size:1.6875rem;font-weight:500}
.progress-info .qcount{font-weight:500}
.opt-feedback{font-size:1rem}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
.opt.selected{border-color:var(--purple-lt)}
.opt.selected .opt-marker{background:var(--purple-lt);border-color:var(--purple-lt);color:#fff}
.qtype-tag{background:var(--purple);color:var(--ink)}
.section-label::before{content:"\2660";width:auto;height:auto;background:none;color:var(--accent);font-size:0.875rem;line-height:1}
.tabs{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 14px;margin-bottom:18px;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button[data-v]{font-family:var(--body);font-size:0.875rem;padding:6px 14px;background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--rule-strong);border-radius:99px;cursor:pointer}
.tabs button[data-v].on{border-color:var(--accent);color:var(--accent)}

/* ---- v2: research-based refinements ---- */
/* Readability: thin display face is kept for headings only; explanations use the sturdier body face (WCAG 1.4.3 note on thin fonts) */
.opt-feedback{font-family:var(--body);font-style:normal;font-size:0.9688rem;line-height:1.55;color:var(--ink-soft)}
.opt-text{font-size:1.0312rem}
.qstem{font-weight:600}
/* Small labels: raise the tiny mono sizes */
.qverdict-text{font-size:0.7812rem}
.opt-tag{font-size:0.7188rem;padding:2px 8px}
.jump-dot{width:40px;height:40px;font-size:0.8125rem}
.question-jumper{gap:8px}
.qtype-tag{font-size:0.75rem}
.progress-info{font-size:0.7812rem}
/* Contrast fixes: dark text on light markers */
.opt.is-wrong .opt-marker,.opt.is-wrong .opt-tag.you{color:var(--bg)}
.opt.selected .opt-marker{background:var(--purple-lt);color:var(--bg)}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
/* Not colour alone (WCAG 1.4.1): shape + symbol + border style for each result */
.opt.is-correct{border-width:2px;border-style:solid}
.opt.is-wrong{border-style:dashed}
.opt.is-missed{border-style:dotted;border-width:2px}
.opt.is-correct .opt-marker,.opt.is-wrong .opt-marker,.opt.is-missed .opt-marker{font-size:0}
.opt.is-correct .opt-marker::after{content:"\2713";font-size:0.875rem}
.opt.is-wrong .opt-marker::after{content:"\2717";font-size:0.875rem}
.opt.is-missed .opt-marker::after{content:"!";font-size:0.875rem}
/* Learning: after Check, the right answer is the loudest thing; wrong picks stay visible but calmer */
.opt.is-correct{box-shadow:0 0 0 1px var(--correct),0 0 20px rgba(127,196,154,.30)}
.opt.is-wrong{box-shadow:none;background:rgba(224,112,127,.08)}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed){opacity:1}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed) .opt-text{color:var(--ink-mute)}
/* Touch targets (WCAG 2.5.8 min 24px; Material 48dp with 8dp gaps) */
.btn{min-height:48px}
.count-card,.topic-chip,.time-chip{min-height:48px}
.options{gap:12px}
.toggle{width:52px;height:30px}
.toggle::after{width:22px;height:22px}
.toggle.on::after{transform:translateX(22px)}
.opt-toggle-row{min-height:56px}
:focus-visible{outline:3px solid var(--purple-lt);outline-offset:3px}
@media (max-width:600px){
  .nav-row{position:sticky;bottom:0;z-index:4;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
  .nav-right{width:100%}
  .nav-right .btn.primary,.nav-right .btn:not(.ghost){flex:1}
  .qcard{padding:26px 18px}
  .qverdict{margin:-26px -18px 22px}
  .qstem{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3: restrained playing-card theme ---- */
.qcard{position:relative;border-radius:12px;padding-bottom:58px;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,169,110,.28);border-radius:8px;pointer-events:none}

/* ============================================================
   QuizForge shared theme — load in BOTH hub and quiz templates
   Dark is default; light "paper" mode follows the phone setting.
   ============================================================ */
:root{
  --bg:#0F0E13; --bg-2:#1C1A22; --bg-deep:#25222E; --bg-raise:#2E2A3A;
  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#C9A96E; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;
  --gold:#A98BE0; --gold-bg:#211A33; --gold-edge:#3F3163;   /* "partial / missed" = lavender */
  --bg-glow:rgba(91,63,140,.30); --bg-glow-2:rgba(91,63,140,.14); --spade-alpha:.09;
  --frame:rgba(201,169,110,.30);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --radius-card:12px; --radius-ctl:8px;
  --display:"Cormorant Garamond",Garamond,"Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --tok-type:#A98BE0;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;
    --ink:#1C1A22; --ink-soft:#45414F; --ink-mute:#66626F;
    --rule:#DDD6C8; --rule-strong:#C4BAA6;
    --accent:#80612A; --accent-deep:#5A441D; --accent-soft:#F1E8D6;
    --purple:#5B3F8C; --purple-lt:#6546A3; --on-purple:#FBF9F4;
    --correct:#23704A; --correct-bg:#E2F0E6; --correct-edge:#A9CFB7;
    --wrong:#A8324A; --wrong-bg:#F8E3E7; --wrong-edge:#E0AAB5;
    --gold:#6546A3; --gold-bg:#ECE5F6; --gold-edge:#C6B6E6;
    --bg-glow:rgba(91,63,140,.12); --bg-glow-2:rgba(201,169,110,.12); --spade-alpha:.06;
    --frame:rgba(128,97,42,.35);
    --shadow:0 1px 0 rgba(28,26,34,.05),0 8px 24px -14px rgba(28,26,34,.25);
    --tok-type:#6546A3;
    color-scheme:light;
  }
}

  --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;

/* ============================================================
   QuizForge shared theme — "Reading Room" variant — load in BOTH hub and quiz templates

:root{

  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#B39A6B; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;

}

/* ================= Reading Room overrides ================= */
body{background-image:radial-gradient(900px 600px at 6% -10%,var(--lamp),transparent 62%),radial-gradient(900px 600px at 105% 115%,var(--bg-glow-2),transparent 60%)}
.display{font-weight:500}
.display em{font-style:italic;color:var(--accent)}
.eyebrow{font-family:var(--type);font-size:0.875rem;letter-spacing:0;text-transform:none;color:var(--accent)}
.divider-double{border-color:var(--rule-strong)}
.section-label{font-family:var(--display);font-size:1.375rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.section-label::before{content:none}
/* masthead: course code as a call number */
.codex{font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:0;border:0;background:none;color:var(--ink-soft);padding:0}
.codex::after{content:" \2660";font-size:0.5625rem;color:var(--ink-mute);opacity:.7}
.stamp{font-family:var(--type);font-size:0.7812rem;letter-spacing:.04em;border:1px solid var(--rule-strong);padding:2px 8px;color:var(--ink-mute)}
.crumb{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8125rem}
/* length choices as small catalog cards */
.count-card{border-radius:4px;background-color:var(--page);background-image:linear-gradient(var(--purple),var(--purple)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--ruled) 21px 22px);background-size:100% 2px,100% 100%;background-position:0 0,0 0;background-repeat:no-repeat}
.count-card.active{background-color:var(--bg-deep);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.count-num{font-weight:500}
.count-label{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.ot-title{font-family:var(--display);font-size:1.25rem;font-weight:500}
.ot-sub{font-family:var(--type);font-size:0.8125rem;letter-spacing:0;text-transform:none}
.setup-summary .ss-item .ss-key,.meta-item .meta-key{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.7812rem}
.meta-row{border-left-color:var(--purple)}
/* progress: a purple ribbon */
.progress-bar{height:6px;background:var(--rule);border-radius:0}
.progress-fill{background:var(--purple-lt);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%)}
.progress-info{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.jump-dot{font-family:var(--type);border-radius:3px}
.jump-dot.current::after{content:none}
/* the question card is a book page */
.qcard{border-radius:3px;background-color:var(--page);background-image:linear-gradient(90deg,var(--page-edge),transparent 22px);padding-right:58px;padding-bottom:50px;overflow:visible}
.qcard::before{content:"\2660";inset:auto;top:-1px;right:24px;width:15px;height:58px;border:0;border-radius:0;background:var(--purple);color:var(--bg);font-size:0.5rem;line-height:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);z-index:2}
.qverdict{border-radius:0;margin:-32px -58px 26px -30px;padding-right:58px}
.folio{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--display);font-style:italic;font-size:0.9375rem;color:var(--ink-mute)}
.qtype-tag{font-family:var(--type);font-size:0.7812rem;letter-spacing:0;text-transform:none;background:none;color:var(--accent);padding:0;border:0}
.qstem{font-family:var(--display);font-weight:500;font-size:1.6875rem;line-height:1.28}
.opt{border-radius:4px}
.opt-text{font-family:var(--body)}
.opt-marker{font-family:var(--type);border-radius:3px}
/* explanations read like margin notes */
.opt-feedback{position:relative;margin-top:10px;padding:2px 0 2px 14px;border-left:2px solid var(--rule-strong);background:none}
.opt-feedback::before{content:"Note \2014 ";font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute)}
.opt.is-correct .opt-feedback{border-left-color:var(--correct)}
.opt.is-wrong .opt-feedback{border-left-color:var(--wrong)}
.opt.is-missed .opt-feedback{border-left-color:var(--gold)}
.opt-tag{font-family:var(--type);letter-spacing:0;text-transform:none;border-radius:2px}
.qverdict-text{font-family:var(--body);letter-spacing:0;text-transform:none}
.btn{border-radius:4px}
/* results: library date stamp */
.score-dial .fill{stroke:var(--purple-lt)}
.verdict-eyebrow{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem;color:var(--accent)}
.verdict{font-family:var(--display);font-weight:500}
.date-stamp{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:6px 14px;border:2px solid var(--purple-lt);outline:1px solid var(--purple-lt);outline-offset:2px;border-radius:3px;font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-lt);transform:rotate(-4deg);opacity:.9}
.date-stamp b{font-size:0.75rem}
@media (max-width:600px){
  .qcard{padding:24px 44px 44px 18px}
  .qcard::before{right:14px;width:13px;height:48px}
  .qverdict{margin:-24px -44px 22px -18px;padding-right:44px}
  .qstem{font-size:1.4375rem}
  .section-label{font-size:1.1875rem}
}

/* ================= quiet whimsy ================= */
/* pencil notes in the verdict banner */
.qverdict{position:relative}
.qverdict{flex-wrap:wrap}
.qverdict::after{position:static;margin-left:auto;max-width:48%;text-align:right;line-height:1.05;transform:rotate(-3deg);font-family:"Caveat","Segoe Print",cursive;font-weight:500;font-size:1.1875rem;opacity:.85;pointer-events:none}
.qverdict.correct::after{content:"nicely done";color:var(--correct)}
.qverdict.wrong::after{content:"happens to the best of us";color:var(--wrong)}
/* the ribbon sways once when you get one right */
@keyframes ribbon-sway{0%{transform:rotate(0)}25%{transform:rotate(5deg)}55%{transform:rotate(-3deg)}80%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
.qcard::before{transform-origin:50% 0}
.qcard:has(.qverdict.correct)::before{animation:ribbon-sway 1.4s ease-out 1}
/* dog-eared page corner that folds a little more on hover */
.qcard::after{content:"";position:absolute;left:-1px;bottom:-1px;width:16px;height:16px;background:linear-gradient(45deg,var(--bg) 50%,var(--bg-raise) 50%);box-shadow:1px -1px 2px rgba(0,0,0,.18);transition:width .25s,height .25s}
.qcard:hover::after{width:24px;height:24px}
/* results: stamp + due slip */
.stamp-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.stamp-row .date-stamp{margin-top:0}
.due-slip{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:10px;padding:8px 14px 10px;background-color:var(--page);background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--ruled) 17px 18px);border:1px solid var(--rule-strong);border-top:3px solid var(--purple);font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute);transform:rotate(1.5deg)}
.due-slip b{font-size:1rem;color:var(--ink)}
.due-slip em{grid-column:1/-1;font-style:normal;font-family:"Caveat",cursive;font-size:1.0625rem;color:var(--ink-soft)}
@media (max-width:600px){.qverdict::after{font-size:1.0625rem;max-width:44%}}
@media (max-width:380px){.qverdict::after{display:none}}
@media (prefers-reduced-motion:reduce){.qcard:has(.qverdict.correct)::before{animation:none}.qcard::after{transition:none}}

/* ---- intuitiveness pass ---- */
.nav-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.quiet{background:none;border:none;color:var(--ink-mute);font-size:0.875rem;padding:8px 10px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn.quiet:hover,.btn.quiet:focus-visible{color:var(--wrong)}
/* jump dots: a mark as well as a colour, so status reads without colour vision */
.jump-dot.checked-correct::after,.jump-dot.checked-wrong::after,.jump-dot.checked-partial::after{position:absolute;top:1px;right:3px;font-size:0.625rem;line-height:1;color:var(--bg);font-family:var(--body);font-weight:600}
.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}
.jump-dot.checked-partial::after,.jump-dot.checked-partial.current::after{content:"\00BD"}
@media (max-width:600px){.nav-left{width:100%;justify-content:space-between}}


/* ================= live engine additions ================= */

.qcard,#view-results,.display{overflow-wrap:anywhere}

.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}

umans is the primary role of output."},{"t":"Input represents data sent to external speakers, while output represents keystrokes entered on a keyboard.","c":false,"fb":"Speakers deliver output to users, whereas keyboards provide input to the system."},{"t":"Input is information the CPU saves to long-term storage, while output is data fetched into RAM.","c":false,"fb":"Storage read and write operations are distinct from user input and output communication."},{"t":"Input provides instructions to the computer, while output returns processed results to the user.","c":true,"fb":"Input delivers user instructions into the computer, while output presents the resulting information."}]},{"cat":"01","type":"multi","stem":"Which two hardware devices function exclusively as **output** devices? Select the TWO correct statements.","options":[{"t":"Conductive touchscreen display","c":false,"fb":"Touchscreens serve as dual input and output devices by registering touches."},{"t":"Inkjet document printer","c":true,"fb":"Printers transfer processed digital text and images onto physical paper."},{"t":"Talk-to-text microphone","c":false,"fb":"Microphones capture sound waves and deliver them as input to the computer."},{"t":"Digitizer stylus pen","c":false,"fb":"A stylus is an input tool used to draw or write on digitizer screens."},{"t":"Desktop computer monitor","c":true,"fb":"Monitors visually present processed text and graphical information to the user."}]},{"cat":"01","type":"mcq","stem":"In the early 1980s, what technological change caused the mouse to become the primary input device for personal computers?","options":[{"t":"Operating systems introduced graphical interfaces that utilized clicking and dragging.","c":true,"fb":"Graphical interfaces made pointing, clicking, and dragging much easier than typing text commands."},{"t":"Mechanical hard drives were replaced by flash-based solid-state storage.","c":false,"fb":"Storage drive transitions did not dictate the adoption of GUI mouse controls."},{"t":"Conductive multi-touch digitizers became standard on laptop displays.","c":false,"fb":"Conductive touchscreens evolved decades after early 1980s personal computer mice."},{"t":"Computers eliminated wired peripheral connections in favor of wireless links.","c":false,"fb":"Wireless connectivity was developed much later and did not drive early mouse adoption."}]},{"cat":"01","type":"fitb","stem":"Modern touchscreen devices register user taps and gestures by detecting the electrical ____ of human fingers.","subtype":"term","answer":["conductivity"],"caseSensitive":false,"fb":"Touchscreens rely on the natural electrical conductivity of human skin to track touches and gestures."},{"cat":"01","type":"fitb","stem":"The programming acronym ____ expresses the principle that the quality and accuracy of computer output is determined directly by the input provided.","subtype":"acronym","answer":["GIGO","Garbage In Garbage Out","Garbage In","Garbage Out"],"caseSensitive":false,"fb":"GIGO (\"Garbage In, Garbage Out\") highlights that inaccurate input inevitably leads to inaccurate output."},{"cat":"01","type":"mcq","stem":"In information technology, what defines a peripheral device?","options":[{"t":"An internal chip on the motherboard that executes arithmetic and logic instructions.","c":false,"fb":"Internal processors like the CPU are core system components, not peripherals."},{"t":"A permanent system routine stored on the hard drive to boot the operating system.","c":false,"fb":"System software routines and boot files are programs, not peripheral hardware units."},{"t":"A hardware device outside the main computer that connects via cable or wirelessly to expand capabilities.","c":true,"fb":"Peripherals are auxiliary tools (such as screens, printers, and speakers) connected externally."},{"t":"The volatile memory module that temporarily holds active program instructions.","c":false,"fb":"System RAM is an internal primary memory component rather than an external peripheral."}]},{"cat":"01","type":"scenario","stem":"How are the 3D printer, monitor, and speakers classified in computer architecture?","context":"An office workstation is configured with a desktop tower connected to a 3D printer, an external monitor, and a set of desktop speakers via USB cables and Bluetooth.","options":[{"t":"Core processing units","c":false,"fb":"Processing units refer to the internal CPU, not auxiliary external devices."},{"t":"Peripheral devices","c":true,"fb":"External tools connected wired or wirelessly to assist the computer are classified as peripherals."},{"t":"Volatile system memory","c":false,"fb":"System memory consists of internal RAM modules, not external hardware accessories."},{"t":"Internal mass storage platters","c":false,"fb":"Storage platters are the internal physical components of mechanical hard drives."}]},{"cat":"01","type":"multi","stem":"Which two hardware components are internal core system units rather than external **peripheral** devices? Select the TWO correct statements.","options":[{"t":"Desktop 3D printer","c":false,"fb":"A 3D printer is an auxiliary external output peripheral."},{"t":"External desktop speaker","c":false,"fb":"External audio speakers are external output peripherals."},{"t":"Central Processing Unit (CPU)","c":true,"fb":"The CPU is an internal core processing chip located inside the computer."},{"t":"Handheld barcode scanner","c":false,"fb":"A barcode scanner is an auxiliary external input peripheral."},{"t":"System RAM module","c":true,"fb":"RAM modules are internal primary memory components installed on the motherboard."}]},{"cat":"01","type":"mcq","stem":"Approximately how long does a modern CPU take to execute a single operational step?","options":[{"t":"One nanosecond (one-billionth of a second)","c":true,"fb":"CPU operations are executed in approximately one nanosecond, or one-billionth of a second."},{"t":"One millisecond (one-thousandth of a second)","c":false,"fb":"A millisecond is one million times slower than standard CPU instruction execution speeds."},{"t":"One microsecond (one-millionth of a second)","c":false,"fb":"A microsecond is one thousand times slower than nanosecond CPU cycle operations."},{"t":"One full second","c":false,"fb":"Modern CPUs execute billions of cycles per second, making individual steps take nanoseconds."}]},{"cat":"01","type":"scenario","stem":"Which hardware component coordinates and processes these concurrent tasks at the same time?","context":"While playing a streaming video, a mobile operating system handles an incoming calendar alert, downloads an email update, and checks cellular signal strength simultaneously.","options":[{"t":"Optical read-only drive","c":false,"fb":"Optical drives only read disc media and cannot execute or coordinate active system tasks."},{"t":"Solid-state flash platter","c":false,"fb":"Storage drives hold files persistently but do not process live execution instructions."},{"t":"Conductive digitizer screen","c":false,"fb":"Digitizer screens detect touches and display images, while the CPU handles processing."},{"t":"Central Processing Unit (CPU)","c":true,"fb":"The CPU serves as the brain of the device, processing instructions and multitasking concurrent operations."}]},{"cat":"01","type":"fitb","stem":"The hardware component that serves as the \"brain\" of the computer by interpreting input instructions and running calculations is the ____.","subtype":"acronym","answer":["CPU","Central Processing Unit","processor"],"caseSensitive":false,"fb":"The CPU (Central Processing Unit) interprets instructions and executes processing tasks across the system."},{"cat":"01","type":"mcq","stem":"Why is Random Access Memory (RAM) described as volatile memory?","options":[{"t":"It contains delicate mechanical platters that degrade when physically moved.","c":false,"fb":"Mechanical platters are components of hard disk drives, not system RAM."},{"t":"Its contents are wiped clean whenever electrical power is turned off.","c":true,"fb":"RAM is volatile because it requires continuous power to hold data; turning off power clears it."},{"t":"It retains installed programs and operating system files permanently without power.","c":false,"fb":"Permanent retention without power is the defining property of persistent mass storage."},{"t":"It prevents the CPU from modifying or updating stored data once loaded.","c":false,"fb":"RAM allows the CPU to read and rewrite operational data continuously during execution."}]},{"cat":"01","type":"scenario","stem":"Why were the unsaved document changes lost while the operating system files remained intact?","context":"A user is actively editing a document when a sudden power outage turns off the desktop computer. Upon rebooting, the operating system loads normally, but the unsaved document changes are gone.","options":[{"t":"Installed operating system files reside in volatile RAM, whereas unsaved text is kept on disk.","c":false,"fb":"Operating system files reside in persistent storage, while active unsaved data resides in volatile RAM."},{"t":"Mass storage drives require continuous electrical power to preserve their stored files.","c":false,"fb":"Mass storage devices are non-volatile and retain saved data without electrical power."},{"t":"Unsaved work was held only in volatile RAM, while operating system files reside in persistent storage.","c":true,"fb":"RAM loses its data immediately when power cuts out, whereas persistent mass storage retains data indefinitely."},{"t":"System RAM automatically writes every keystroke directly into magnetic sectors.","c":false,"fb":"RAM does not automatically commit active working memory to persistent storage without saving."}]},{"cat":"01","type":"multi","stem":"Which two statements describe the characteristics of **persistent mass storage** (such as HDDs or SSDs) rather than system RAM? Select the TWO correct statements.","options":[{"t":"Retains programs and data safely even when the computer is turned o  stored on the drive."},{"t":"The CPU executes the program directly from mass storage platters without using memory.","c":false,"fb":"The CPU cannot execute software directly from storage drives; files must first load into RAM."},{"t":"The application files are moved from RAM to the hard drive to protect them from erasure.","c":false,"fb":"Programs reside primarily on the hard drive and are copied into RAM for execution."},{"t":"The application files are copied from long-term storage into RAM so the CPU can execute them.","c":true,"fb":"The CPU requires active software to be placed into volatile RAM shelf space to run it."}]},{"cat":"01","type":"scenario","stem":"What primary purpose is served by placing the program into system RAM?","context":"A user double-clicks an image editing program icon. The computer retrieves the software files from the hard disk and places them into system RAM before opening the window.","options":[{"t":"It gives the CPU the fast temporary workspace required to access and run program instructions.","c":true,"fb":"RAM provides the rapid temporary memory shelf the CPU needs to execute active software code."},{"t":"It archives the image editing program permanently so it survives power outages.","c":false,"fb":"Permanent archiving is handled by persistent mass storage, not volatile RAM."},{"t":"It converts digital graphic files into physical paper printouts automatically.","c":false,"fb":"Printing onto paper is the function of a printer peripheral."},{"t":"It replaces the CPU by performing all graphic calculations on the memory stick.","c":false,"fb":"The CPU performs processing calculations; RAM merely stores the instructions and active data."}]},{"cat":"01","type":"fitb","stem":"When starting a computer, the operating system and active software are loaded from persistent mass storage into ____ so that the CPU can quickly access them.","subtype":"acronym","answer":["RAM","Random Access Memory","system memory","memory"],"caseSensitive":false,"fb":"Software must be loaded from persistent mass storage into RAM (Random Access Memory) for CPU execution."},{"cat":"01","type":"mcq","stem":"Why are Hard Disk Drives (HDDs) more susceptible to physical failure from drops or bumps than Solid-State Drives (SSDs)?","options":[{"t":"HDDs utilize volatile flash memory chips that erase when physically shaken.","c":false,"fb":"Flash memory is non-volatile and used in solid-state drives rather than mechanical HDDs."},{"t":"HDDs contain spinning magnetic platters and moving mechanical read/write components.","c":true,"fb":"Mechanical moving parts inside an HDD can be misaligned or damaged when bumped or dropped."},{"t":"HDDs record data on optical disc layers that crack under physical vibration.","c":false,"fb":"Optical layers belong to CD, DVD, and Blu-ray media, not magnetic hard disk drives."},{"t":"HDDs depend on continuous wireless network signals to retain platter data.","c":false,"fb":"HDDs are physical wired storage devices that store data magnetically without wireless networks."}]},{"cat":"01","type":"scenario","stem":"Which storage technology is best suited for this laptop, and why?","context":"A field technician needs a durable internal drive for a laptop used in rugged mobile environments where mechanical shocks and frequent movement occur.","options":[{"t":"Solid-State Drive (SSD), because it uses flash memory chips with no moving mechanical parts.","c":true,"fb":"SSDs rely on solid-state flash memory, making them faster and resistant to mechanical shock."},{"t":"Hard Disk Drive (HDD), because its internal spinning platters absorb mechanical shocks.","c":false,"fb":"Mechanical spinning platters in HDDs are vulnerable to physical shocks and movement."},{"t":"CD-ROM optical drive, because laser reading lenses are immune to physical movement.","c":false,"fb":"Optical drives contain moving mechanical laser assemblies and are not intended for primary OS storage."},{"t":"Volatile RAM module, because it permanently preserves local storage without battery power.","c":false,"fb":"RAM is volatile and loses all stored data when the computer is turned off."}]},{"cat":"01","type":"mcq","stem":"Which hard disk drive form factor is standard for laptop computers?","options":[{"t":"5.25-inch","c":false,"fb":"5.25-inch is a legacy desktop drive bay dimension, not a laptop drive standard."},{"t":"3.5-inch","c":false,"fb":"3.5-inch hard disk drives are standard for desktop computers and servers."},{"t":"2.5-inch","c":true,"fb":"Laptops standardly utilize the smaller 2.5-inch hard drive form factor."},{"t":"1.8-inch","c":false,"fb":"2.5-inch is the standard laptop hard disk drive form factor."}]},{"cat":"01","type":"mcq","stem":"What marking on an optical disc indicates that a user can record or rewrite new data to it?","options":[{"t":"A \"ROM\" designation printed on the disc label","c":false,"fb":"ROM stands for Read-Only Memory, indicating that data cannot be written or modified."},{"t":"A \"GIGO\" quality verification emblem","c":false,"fb":"GIGO is a conceptual programming acronym, not an optical disc media format."},{"t":"A 3.5-inch form factor specification","c":false,"fb":"Form factor measurements like 3.5-inch refer to magnetic hard disk drives."},{"t":"A \"-R\" or \"-RW\" suffix attached to the disc name","c":true,"fb":"Suffixes like -R (Recordable) and -RW (Rewritable) indicate that data can be saved to the disc."}]},{"cat":"01","type":"scenario","stem":"Why are optical discs appropriate for backup archiving but generally unsuitable for running active programs?","context":"A company archives historical records and video presentations by burning backup copies onto removable optical discs such as DVDs and Blu-ray discs.","options":[{"t":"Optical discs lose their recorded data as soon as they are ejected from the drive.","c":false,"fb":"Optical discs are non-volatile and retain their physical recordings permanently."},{"t":"Optical discs are effective for holding static files but are not designed for frequent application execution.","c":true,"fb":"Optical discs excel at long-term media backup but lack the performance and rewritability needed for running software."},{"t":"Optical discs cannot physically store video recordings or document files.","c":false,"fb":"Optical discs are explicitly designed to store video, audio, picture, and document files."},{"t":"Optical discs require permanent soldering to the system motherboard to function.","c":false,"fb":"Optical drives connect via standard internal or external peripheral interfaces."}]},{"cat":"01","type":"mcq","stem":"According to the handout, how did users interact with personal computers in the 1970s?","options":[{"t":"They typed specific text commands they had to memorize.","c":true,"fb":"[M0] Correct. Early PCs used only a keyboard, and users needed to know the exact commands to type."},{"t":"They used a mouse to click and drag icons.","c":false,"fb":"[M1] This describes the early 1980s graphical interface, not the 1970s."},{"t":"They tapped a touchscreen with their fingers.","c":false,"fb":"[M2] Touchscreens came much later; the handout lists this as a modern input method."},{"t":"They used wireless gestures captured by cameras.","c":false,"fb":"[M3] Early personal computers relied on keyboards rather than camera tracking."}]},{"cat":"01","type":"mcq","stem":"Which input device does the handout describe as letting users write by speaking, using talk-to-text?","options":[{"t":"Microphone","c":true,"fb":"[M0] Correct. Microphones enabled talk-to-text input to write without typing."},{"t":"Projector","c":false,"fb":"[M4] A projector is an output display device, not an audio input tool."},{"t":"Solid-state drive","c":false,"fb":"[M5] A solid-state drive is a storage component rather than an audio input tool."},{"t":"GPS receiver","c":false,"fb":"[M6] A GPS receiver provides navigational directions rather than speech input."}]},{"cat":"01","type":"mcq","stem":"The handout describes touchpads and trackballs as serving what purpose on laptops?","options":[{"t":"A more precise alternative to early mouse devices.","c":true,"fb":"[M0] Correct, this is exactly how the handout describes them."},{"t":"A way to print documents wirelessly onto paper.","c":false,"fb":"[M6] Printing is an output function, not related to touchpads/trackballs."},{"t":"A tool for scanning physical papers into digital images.","c":false,"fb":"[M7] Scanning isn't discussed in the handout as a function of touchpads/trackballs."},{"t":"An internal component used to boost CPU processing speed.","c":false,"fb":"[M8] Touchpads and trackballs are pointing input tools, not processor accelerators."}]},{"cat":"01","type":"fitb","stem":"The special pen that allows people to write directly on certain device screens is called a ____.","subtype":"term","answer":["stylus"],"caseSensitive":false,"fb":"Correct — the handout names the stylus as a popular input device for writing on device screens."},{"cat":"01","type":"mcq","stem":"Besides touchscreens using electrical conductivity from fingers, how does the handout say other input devices can connect to a computer?","options":[{"t":"Using either a wired or wireless connection.","c":true,"fb":"[M0] Correct, the handout notes input devices can connect either way."},{"t":"Only through a wired USB cable.","c":false,"fb":"[M9] The handout says wireless connections are also possible, not just wired."},{"t":"Only through Bluetooth wireless signals.","c":false,"fb":"[M10] The handout does not limit connections to wireless only; wired is also mentioned."},{"t":"Through the same electrical conductivity used by touchscreens.","c":false,"fb":"[M11] Conductivity is specific to how touchscreens read finger touches, not a general connection method."}]},{"cat":"01","type":"fitb","stem":"The phrase \"Garbage In, Garbage Out,\" used to describe how output quality depends on input quality, originated in the programming community as early as the year ____.","subtype":"value","answer":["1957"],"caseSensitive":false,"fb":"Correct — the handout states GIGO was already in use by the programming community in 1957."},{"cat":"01","type":"scenario","stem":"Which principle from the handout best explains why this incorrect report was produced?","context":"A data-entry clerk accidentally enters a customer's birth year as 1902 instead of 2002. The company's system later generates a report showing this customer is over 120 years old.","options":[{"t":"Garbage In, Garbage Out — the accuracy of the output is determined by the input.","c":true,"fb":"[M0] Correct. The handout explains that if a person enters incorrect information, the computer returns inaccurate data."},{"t":"Central Processing Unit delay — the CPU failed to calculate the formula fast enough.","c":false,"fb":"[M12] This scenario is about input quality, not processing speed."},{"t":"System memory volatility — the RAM wiped the active record when power was removed.","c":false,"fb":"[M13] Volatility relates to power loss wiping RAM, not incorrect data entry."},{"t":"Persistent storage failure — the hard disk drive corrupted the customer database.","c":false,"fb":"[M14] Persistent storage relates to keeping data safe when powered off, not data accuracy."}]},{"cat":"01","type":"mcq","stem":"According to the handout, why does a computer's processor NOT actually need a screen for its own internal work?","options":[{"t":"Screens exist only to make processed data understandable to humans.","c":true,"fb":"[M0] Correct, the handout states the computer does not need to show anything on a screen for itself."},{"t":"Computers process information faster without any output devices attached.","c":false,"fb":"[M15] The handout doesn't claim removing output devices speeds up processing."},{"t":"All modern computer architectures now utilize audio output exclusively.","c":false,"fb":"[M16] The handout does not state this; screens remain a common output device."},{"t":"External peripherals are prevented from exchanging data with the CPU.","c":false,"fb":"[M17] Peripherals connect and communicate with the system to provide input or receive output."}]},{"cat":"01","type":"multi","stem":"Which two of the following are output devices mentioned in the handout? Select the TWO correct statements.","options":[{"t":"Projector","c":true,"fb":"[M0] Correct, projectors are listed as an output device example for watching movies on big screens."},{"t":"GPS device","c":true,"fb":"[M0] Correct, GPS devices are listed as an output device example for step-by-step directions."},{"t":"Barcode scanner","c":false,"fb":"[M18] Barcode scanners capture external codes and deliver them as input to the system."},{"t":"Keyboard","c":false,"fb":"[M18] Keyboards enter user text instructions and function as input devices."}]},{"cat":"01","type":"mcq","stem":"What does the handout say 3D printers do?","options":[{"t":"Fabricate physical models from plastic or resin in home and industrial settings.","c":true,"fb":"[M0] Correct, this matches the handout's description of 3D printers."},{"t":"Print two-dimensional text and photos onto paper sheets using toner or ink.","c":false,"fb":"[M19] This describes a regular document printer, not a 3D printer."},{"t":"Calculate satellite positioning data and give turn-by-turn road directions.","c":false,"fb":"[M20] This describes a GPS device, not a 3D printer."},{"t":"Clear active application workspace memory automatically whenever powered off.","c":false,"fb":"[M21] Memory clearing upon power loss is a characteristic of volatile RAM, not 3D printing."}]},{"cat":"01","type":"fitb","stem":"Modern CPUs can run billions of computing cycles every ____.","subtype":"term","answer":["second","seconds"],"caseSensitive":false,"fb":"Correct — the handout states modern CPUs can run billions of these cycles every second."},{"cat":"01","type":"scenario","stem":"How does the handout characterize the CPU's execution during this network streaming process?","context":"A user on a smartphone taps a streaming video link. The device CPU talks to the streaming app, sends a request to the nearest cell tower, and processes the incoming video data returned from the server for display.","options":[{"t":"The CPU handles sending the request and processing the returning video instantly while multitasking.","c":true,"fb":"[M0] Correct. The handout states the CPU gets this communication and display done instantly alongside other tasks."},{"t":"The CPU halts all background applications and alerts until video playback finishes.","c":false,"fb":"[M22] The CPU continues multitasking background apps, emails, and alerts during playback."},{"t":"The CPU permanently archives the full video stream to disk before display begins.","c":false,"fb":"[M23] Streaming data is processed and displayed in real time rather than permanently saved to disk."},{"t":"The CPU requires physical wired cables to transmit data to the nearest cell tower.","c":false,"fb":"[M24] Communication with cell towers occurs wirelessly through radio signals."}]},{"cat":"01","type":"mcq","stem":"Besides processing instructions, what other task does the handout say the CPU sometimes asks RAM to do?","options":[{"t":"Keep instructions ready in a queue while the CPU works on other instructions.","c":true,"fb":"[M0] Correct, the handout states the CPU sometimes asks RAM to keep instructions ready while it works on others."},{"t":"Permanently save the instructions so they are not lost when the computer shuts down.","c":false,"fb":"[M25] Permanent saving is a function of the hard drive (persistent storage), not RAM, which is volatile."},{"t":"Print the instructions to paper for review.","c":false,"fb":"[M26] Printing is unrelated to RAM's role of holding instructions temporarily."},{"t":"Send the instructions directly to the cell tower.","c":false,"fb":"[M27] Sending data to a cell tower relates to network communication, not RAM's instruction-queuing role."}]},{"cat":"01","type":"mcq","stem":"According to the handout, which hard disk form factor is standard for desktop computers and enterprise servers, in contrast to laptops?","options":[{"t":"3.5-inch","c":true,"fb":"[M0] Correct, the handout states most servers and desktops use the 3.5-inch size."},{"t":"2.5-inch","c":false,"fb":"[M28] The handout states laptops use the 2.5-inch size, not desktops or servers."},{"t":"5.25-inch","c":false,"fb":"[M29] This size is not mentioned in the handout."},{"t":"1.8-inch","c":false,"fb":"[M29] This size is not mentioned in the handout."}]},{"cat":"01","type":"multi","stem":"Which two statements about storage capacity and optical media are accurate according to the handout? Select the TWO correct statements.","options":[{"t":"Hard disk drive capacity ranges from 100 GB up to 18 TB.","c":true,"fb":"[M0] Correct, the handout states this exact capacity range for HDDs."},{"t":"Optical discs like CDs and DVDs are used less because USB flash drives and cloud storage make data easier to keep safe.","c":true,"fb":"[M0] Correct, the handout attributes optical media's decline to flash drives and cloud storage."},{"t":"Optical discs were originally designed to be easily rewritable with new data.","c":false,"fb":"[M30] The handout states optical discs were originally Read-Only Memory (ROM), meaning good for holding data but not for adding new data."},{"t":"SSDs store data on spinning magnetic disks like HDDs.","c":false,"fb":"[M31] The handout states SSDs use flash memory, not magnetic disks — magnetic disks are how HDDs work."}]},{"cat":"02","type":"mcq","stem":"What is the fundamental definition of computer software?","options":[{"t":"The physical electronic circuitry that makes up a computer system","c":false,"fb":"Physical circuitry describes computer hardware, not software."},{"t":"A set of instructions that an operating system reads and follows to perform tasks","c":true,"fb":"Software is a set of programmed instructions that tells a computer what to do."},{"t":"The internal electrical wiring that distributes power from the wall outlet","c":false,"fb":"Electrical wiring provides electrical power, not software instructions."},{"t":"The networking cables used to link computers together in a local area network","c":false,"fb":"Network cables are physical connection hardware, not program software."}]},{"cat":"02","type":"multi","stem":"Why do commercial software developers predominantly create application software for Microsoft Windows first? Select the TWO correct statements.","options":[{"t":"It features an active global installed base exceeding one billion devices.","c":true,"fb":"Over one billion devices use Windows, providing the largest potential user market."},{"t":"It provides software developers with the safest commercial bet to make money.","c":true,"fb":"The massive Windows user base makes it the most financially reliable target."},{"t":"It is a completely free and open-source operating system maintained by volunteers.","c":false,"fb":"Windows is proprietary commercial software developed by Microsoft."},{"t":"It only allows software applications to be used on smartphones and tablets.","c":false,"fb":"Windows is primarily a desktop and laptop operating system."},{"t":"It automatically converts Apple macOS applications to run without modification.","c":false,"fb":"Applications are built for a specific OS and cannot run on another OS without code changes."}]},{"cat":"02","type":"scenario","stem":"Which type of software is specifically designed for this classroom task?","context":"A high school teacher wants to present visual lecture notes to students using digital slides containing animations, pictures, and summary points.","options":[{"t":"Presentation software","c":true,"fb":"Presentation software uses slides to present visual ideas, charts, and animations to an audience."},{"t":"Spreadsheet software","c":false,"fb":"Spreadsheet software stores and calculates data in grids of rows and columns."},{"t":"Word processing software","c":false,"fb":"Word processing software is used to create text documents like reports and letters."},{"t":"Video editing software","c":false,"fb":"Video editing software is used to cut and assemble video clips."}]},{"cat":"02","type":"mcq","stem":"What core capability does remote assistance software provide to a computer technician?","options":[{"t":"The ability to view the screen and control the mouse and keyboard of another computer over the internet","c":true,"fb":"Remote assistance allows technicians to see the screen, control peripherals, and transfer files."},{"t":"The ability to increase the physical storage capacity of the remote computer's hard drive","c":false,"fb":"Remote software cannot physically enlarge hardware storage capacity."},{"t":"The ability to control another computer when neither machine has an active network connection","c":false,"fb":"Remote assistance strictly requires an active internet connection to function."},{"t":"The ability to physically repair broken electronic components inside the remote computer's case","c":false,"fb":"Software cannot perform physical repairs on broken hardware components."}]},{"cat":"02","type":"scenario","stem":"What is the underlying cause preventing the remote assistance session from connecting?","context":"An employee working from home calls the IT helpdesk because their laptop cannot load web pages or connect to the internet. A technician attempts to start a Quick Assist session to troubleshoot the laptop, but the connection fails.","options":[{"t":"Remote assistance software cannot function without an active internet connection.","c":true,"fb":"Remote assistance software strictly requires an active internet connection to communicate with remote computers."},{"t":"Quick Assist only works if the technician's computer is physically located in the same building.","c":false,"fb":"Remote assistance connects over the internet across any physical distance."},{"t":"Remote assistance software is only permitted to run on Apple Mac computers.","c":false,"fb":"Quick Assist is built into Microsoft Windows, and Windows has supported remote access since Windows XP."},{"t":"Remote assistance sessions can only be established between smartphones and tablets.","c":false,"fb":"Quick Assist and remote assistance are standard desktop troubleshooting tools."}]},{"cat":"02","type":"multi","stem":"Which operations can a technician perform on a user's computer during a remote assistance session? Select the TWO correct statements.","options":[{"t":"Use a keyboard and mouse to configure system settings and run programs.","c":true,"fb":"Remote assistance allows taking full mouse and keyboard control to work with any program or setting."},{"t":"Send files back and forth between both connected computers.","c":true,"fb":"Remoting software allows bidirectional file transfer between the user and technician."},{"t":"Continue troubleshooting sessions when the remote computer has no internet access.","c":false,"fb":"Remote assistance strictly requires an active internet connection."},{"t":"Physically solder loose electrical connections on the remote computer's motherboard.","c":false,"fb":"Software tools cannot make physical repairs to electronic hardware."},{"t":"Replace defective physical RAM chips through remote software commands.","c":false,"fb":"Hardware memory modules cannot be physically replaced through software."}]},{"cat":"02","type":"fitb","stem":"An email service accessed entirely through a web browser where messages remain stored on the provider's servers is categorized as ____.","subtype":"term","answer":["Software as a Service","SaaS","Software as a Service (SaaS)"],"caseSensitive":false,"hint":"Cloud software delivery model","fb":"Browser-based email services like Gmail are examples of Software as a Service (SaaS), where messages are stored on the hosting provider's servers rather than managed locally."},{"cat":"02","type":"scenario","stem":"How does this transition alter how employee email is accessed and stored?","context":"An organization currently uses Microsoft Outlook installed on individual desktop computers. The company decides to transition all employees to Gmail, allowing staff to access their messages through a standard web browser.","options":[{"t":"Emails are accessed as Software as a Service (SaaS) and stored on the hosting provider's servers.","c":true,"fb":"Webmail operates as SaaS, storing emails remotely on host servers rather than on local hard drives."},{"t":"Employees can no longer organize their messages into folders or search for specific emails.","c":false,"fb":"Webmail provides full folder organization, searching, and filtering capabilities."},{"t":"Emails must now be printed out on paper before employees are allowed to read them.","c":false,"fb":"Webmail displays messages directly on screen inside any web browser."},{"t":"Employees can no longer send or receive email messages from users with different email providers.","c":false,"fb":"Webmail communicates across all standard email providers."}]},{"cat":"02","type":"mcq","stem":"What primary operational advantage distinguishes Instant Messaging (IM) from traditional email?","options":[{"t":"IM enables real-time communication with virtually no delay between sending and receiving.","c":true,"fb":"Instant messaging lets people talk in real time with virtually zero delay compared to email."},{"t":"IM prevents users from attaching images, photos, or digital files to conversations.","c":false,"fb":"Modern IM software allows users to easily send text messages, photos, and files."},{"t":"IM deletes all message history immediately as soon as a conversation window is closed.","c":false,"fb":"Instant messages are stored, allowing users to retrieve past conversations anytime."},{"t":"IM requires users to have a dedicated landline telephone connection to send messages.","c":false,"fb":"IM operates over mobile cellular data and internet networks, not old landlines."}]},{"cat":"02","type":"scenario","stem":"Which programs are designed to provide desktop instant messaging and team collaboration?","context":"A project team needs desktop software that allows members to send real-time instant messages and collaborate from their computers as easily as they chat on smartphones.","options":[{"t":"Slack and Microsoft Teams","c":true,"fb":"Slack and Microsoft Teams bring smartphone-style instant messaging to desktop computers for teamwork."},{"t":"Microsoft Word and LibreOffice Writer","c":false,"fb":"Word and Writer are word processing programs used to draft text documents."},{"t":"Microsoft Excel and Apple Numbers","c":false,"fb":"Excel and Numbers are spreadsheet programs used to calculate numerical data."},{"t":"Adobe Premiere and DaVinci Resolve","c":false,"fb":"Premiere and DaVinci Resolve are digital video editing programs."}]},{"cat":"02","type":"mcq","stem":"Which web browser is typically pre-installed as the default bundled browser on Linux distributions?","options":[{"t":"Microsoft Edge","c":false,"fb":"Microsoft Edge is the bundled default browser on Windows."},{"t":"Mozilla Firefox","c":true,"fb":"Linux computers usually come pre-installed with Mozilla Firefox."},{"t":"Apple Safari","c":false,"fb":"Safari is exclusive to Apple operating systems."},{"t":"Google Chrome","c":false,"fb":"Chrome is a third-party browser that requires separate installation, not the Linux default."}]},{"cat":"02","type":"scenario","stem":"Which default browser pairing correctly identifies each platform's pre-installed browser?","context":"An IT technician sets up new equipment: a Windows desktop PC, an Apple MacBook, and a Linux workstation. The technician checks the default pre-installed web browser on each computer.","options":[{"t":"Windows: Google Chrome; Mac: Safari; Linux: Microsoft Edge","c":false,"fb":"Windows bundles Edge, not Chrome; Linux does not bundle Edge."},{"t":"Windows: Mozilla Firefox; Mac: Google Chrome; Linux: Safari","c":false,"fb":"Windows bundles Edge, Mac bundles Safari, and Linux does not bundle Safari."},{"t":"Windows: Microsoft Edge; Mac: Safari; Linux: Mozilla Firefox","c":true,"fb":"Windows comes bundled with Microsoft Edge, Apple devices with Safari, and Linux with Mozilla Firefox."},{"t":"Windows: Microsoft Edge; Mac: Mozilla Firefox; Linux: Google Chrome","c":false,"fb":"Apple devices bundle Safari, and Linux typically bundles Firefox."}]},{"cat":"02","type":"scenario","stem":"Why was the attachment rejected, and what is the standard solution?","context":"An employee needs to send a 400 MB video presentation to a client. When trying to attach the file directly to an outgoing email message, the email program refuses to send it.","options":[{"t":"Email services usually limit attachments to about 25 MB; upload the file to cloud storage and share a link.","c":true,"fb":"Email attachments are typically capped around 25 MB, which is solved by sharing via cloud storage."},{"t":"Email programs can only send plain text; the employee must convert the video into a word document.","c":false,"fb":"Video files cannot be converted into word documents; file size was the limitation."},{"t":"Email programs cannot send files to external clients; the employee must mail a physical optical disc.","c":false,"fb":"Files can be shared digitally over the internet using cloud storage services."},{"t":"Email services charge a cash penalty for every file attached; the employee must purchase an email license.","c":false,"fb":"Rejection is caused by technical attachment size limits, not payment penalties."}]},{"cat":"02","type":"mcq","stem":"What is a major advantage of using a cloud file-sharing service like Dropbox or OneDrive instead of emailing files back and forth?","options":[{"t":"Cloud storage eliminates the requirement for an active internet connection to download files.","c":false,"fb":"Users must have internet access to access and download files stored in the cloud."},{"t":"Cloud storage allows users to upload a file once and share access rather than emailing large files repeatedly.","c":true,"fb":"Cloud services make it easy to share large files and avoid sending multiple email copies."},{"t":"Cloud storage services provide unlimited file storage capacity completely free without any subscription.","c":false,"fb":"Cloud storage offers a limited free tier, but requires a paid subscription for more space."},{"t":"Cloud storage automatically converts static text documents into interactive video conferences.","c":false,"fb":"File storage holds files, whereas video conferencing is handled by communication software."}]},{"cat":"02","type":"mcq","stem":"Which type of software is designed to help teams plan project timelines, assign tasks to workers, and monitor progress?","options":[{"t":"Work management software","c":true,"fb":"Work management software helps plan, track, organize project work, and assign tasks."},{"t":"Web browsing software","c":false,"fb":"Web browsing software is used to view and navigate web pages on the internet."},{"t":"Digital imaging software","c":false,"fb":"Digital imaging software is used to edit and process photos."},{"t":"Video editing software","c":false,"fb":"Video editing software is used to cut, trim, and produce video clips."}]},{"cat":"02","type":"scenario","stem":"Which platforms are designed specifically for this work management purpose?","context":"A project manager coordinates a team of remote workers and needs software that organizes tasks, tracks deadlines, logs time spent on projects, and displays progress on a visual dashboard.","options":[{"t":"Monday.com and Trello","c":true,"fb":"Monday.com, Trello, Jira, and Basecamp are popular work management platforms with timelines and dashboards."},{"t":"Microsoft Edge and Mozilla Firefox","c":false,"fb":"Edge and Firefox are web browsers used for surfing the internet."},{"t":"Apple Keynote and Microsoft PowerPoint","c":false,"fb":"Keynote and PowerPoint are presentation programs used to create slide decks."},{"t":"Adobe Premiere and DaVinci Resolve","c":false,"fb":"Premiere and DaVinci Resolve are video editing tools."}]},{"cat":"02","type":"mcq","stem":"Which type of software organizes data into square grids of rows and columns and is used to calculate formulas and perform math?","options":[{"t":"Spreadsheet software","c":true,"fb":"Spreadsheets are square grids of rows and columns that store, calculate, and analyze numerical data."},{"t":"Presentation software","c":false,"fb":"Presentation software uses slides to display visual ideas and animations."},{"t":"Word processing software","c":false,"fb":"Word processing software is used for typing, formatting, and editing text documents."},{"t":"Web browsing software","c":false,"fb":"Web browsing software displays websites on the internet."}]},{"cat":"02","type":"scenario","stem":"Which type of software is best suited for creating and formatting this text document?","context":"An administrative assistant needs to write a formal business report that includes headings, paragraphs, and automatic spell-checking.","options":[{"t":"Word processing software","c":true,"fb":"Word processors are designed specifically for reading, writing, formatting, and editing text documents."},{"t":"Spreadsheet software","c":false,"fb":"Spreadsheets are designed for storing numerical data and calculating formulas in grids."},{"t":"Presentation software","c":false,"fb":"Presentation software is designed for creating visual slides for an audience."},{"t":"Digital imaging software","c":false,"fb":"Digital imaging software is used to edit and manipulate photographs."}]},{"cat":"02","type":"mcq","stem":"What capabilities make Microsoft Excel the most popular spreadsheet software for handling large amounts of data?","options":[{"t":"It has powerful analysis tools and a macro language to automate tasks.","c":true,"fb":"Excel works well with large amounts of data, offers advanced analysis, and has a macro language."},{"t":"It is provided completely free and pre-installed on all Apple Mac computers.","c":false,"fb":"Apple Numbers is free on Macs, whereas Microsoft Excel requires a paid commercial license."},{"t":"It is designed strictly for everyday basic spreadsheets and cannot handle large datasets.","c":false,"fb":"Apple Numbers is limited to everyday spreadsheets, whereas Excel is built for large datasets."},{"t":"It lacks the ability to create visual charts, tables, or graphs.","c":false,"fb":"Excel provides extensive support for creating charts, tables, and graphs."}]},{"cat":"02","type":"scenario","stem":"Why is Apple Numbers NOT the ideal choice for this advanced task?","context":"A financial analyst working on a Mac needs to analyze a massive database containing years of transactions and automate recurring calculations using macros.","options":[{"t":"Numbers is designed for everyday basic spreadsheets and is not built for large datasets or advanced analysis.","c":true,"fb":"Numbers is designed for everyday basic spreadsheets rather than large datasets or advanced analysis."},{"t":"Numbers cannot perform basic mathematical calculations like addition or subtraction.","c":false,"fb":"Numbers includes all standard basic math features needed for everyday spreadsheets."},{"t":"Numbers runs exclusively inside a web browser and cannot be installed on a Mac computer.","c":false,"fb":"Numbers is an installed desktop application bundled free with Apple Mac computers."},{"t":"Numbers requires paying an expensive monthly subscription fee on Apple devices.","c":false,"fb":"Numbers is free with every Apple Mac computer."}]},{"cat":"02","type":"multi","stem":"Which statements accurately describe open-source office suites such as LibreOffice and Apache OpenOffice? Select the TWO correct statements.","options":[{"t":"They are available as free software packages.","c":true,"fb":"LibreOffice and OpenOffice are free software packages made by open-source companies."},{"t":"They offer user interfaces with a similar feel to Microsoft Office programs.","c":true,"fb":"Their similar feel to Microsoft programs makes switching between suites easy."},{"t":"They require users to pay a monthly commercial license fee to use them.","c":false,"fb":"Open-source suites are available for free without licensing fees."},{"t":"They are proprietary software packages that only work on Apple Mac computers.","c":false,"fb":"They are open-source and cross-platform, not Apple-exclusive."},{"t":"They cannot be used to create text documents or spreadsheets.","c":false,"fb":"LibreOffice and OpenOffice provide full word processing and spreadsheet tools."}]},{"cat":"02","type":"scenario","stem":"Which software package provides a free open-source alternative with a similar feel to Microsoft Office?","context":"A small community clinic needs word processing and spreadsheet software for its office computers but has no budget to purchase commercial Microsoft Office licenses.","options":[{"t":"LibreOffice","c":true,"fb":"LibreOffice is a free open-source software suite that provides tools comparable to Microsoft Office."},{"t":"Adobe Premiere","c":false,"fb":"Adobe Premiere is commercial video editing software requiring a paid subscription."},{"t":"Microsoft Outlook","c":false,"fb":"Microsoft Outlook is a commercial email client requiring a paid license."},{"t":"Miro","c":false,"fb":"Miro is an online digital whiteboard tool for visual brainstorming."}]},{"cat":"02","type":"mcq","stem":"Why do smartphone users generally spend less time using mobile web browsers compared to computer users?","options":[{"t":"Dedicated apps compete for attention, and touchscreens make long scrolling tiring and less precise.","c":true,"fb":"Mobile apps provide tailored experiences, while small screens and touch interfaces make web browsing more tiring and less precise."},{"t":"Smartphone browsers are strictly prohibited from connecting to the internet.","c":false,"fb":"Smartphone browsers connect to the internet over cellular and Wi-Fi networks."},{"t":"Mobile web browsers charge users a fee for every web page they open.","c":false,"fb":"Standard web browsing does not incur fees per page viewed."},{"t":"Smartphone screens cannot display pictures, colors, or formatted text on websites.","c":false,"fb":"Modern smartphone displays easily render full-color web pages with pictures and text."}]},{"cat":"02","type":"scenario","stem":"What software solution directly addresses this mobile usability problem?","context":"A commercial retail bank notices that customers struggle to complete banking transactions when using mobile phone web browsers due to small screens and imprecise touch inputs.","options":[{"t":"Offering a dedicated mobile banking application designed for touchscreens.","c":true,"fb":"Dedicated mobile banking apps are designed specifically for smaller touchscreens to improve user experience."},{"t":"Requiring customers to access their bank accounts through a remote assistance session.","c":false,"fb":"Remote assistance is an IT troubleshooting tool, not a customer banking interface."},{"t":"Requiring customers to visit a physical bank branch to check account balances.","c":false,"fb":"Mobile banking apps allow customers to access financial information remotely."},{"t":"Forcing mobile customers to install multiple web browsers on their phones.","c":false,"fb":"Switching browsers does not solve small screen touch precision hurdles."}]},{"cat":"02","type":"mcq","stem":"What key collaboration capability allows distributed teams to work together effectively in Google Docs?","options":[{"t":"Simultaneous real-time editing on a single shared document","c":true,"fb":"Cloud productivity suites like Google Docs allow team members to create, share, and edit a document simultaneously in real time."},{"t":"Distributing document copies exclusively through postal mail on optical discs","c":false,"fb":"Cloud suites operate online over standard internet connections."},{"t":"Restricting editing permissions so only one person can view a file each week","c":false,"fb":"Cloud suites are designed for continuous multi-user team collaboration."},{"t":"Requiring each team member to install a different, incompatible word processor","c":false,"fb":"Google Docs provides a unified browser-based interface for all users."}]},{"cat":"02","type":"mcq","stem":"What is a primary reason for the widespread global popularity of the WhatsApp messaging platform?","options":[{"t":"It allows users to send texts worldwide without incurring expensive carrier international charges.","c":true,"fb":"WhatsApp is popular globally because it avoids costly international fees added by cellphone carriers."},{"t":"It is an operating system built exclusively for desktop computers.","c":false,"fb":"WhatsApp is a messaging app available across mobile and desktop devices."},{"t":"It requires users to pay a subscription fee for every message sent.","c":false,"fb":"WhatsApp does not charge fees per message."},{"t":"It prohibits users from sending photos, files, or creating group chats.","c":false,"fb":"WhatsApp allows users to send text messages, photos, and files, and create group chats."}]},{"cat":"02","type":"mcq","stem":"Which features and security protections specifically characterize Apple's iMessage service?","options":[{"t":"It uses end-to-end encryption and works well with iCloud, Siri, and FaceTime.","c":true,"fb":"iMessage uses end-to-end encryption and integrates natively with iCloud, Siri, and FaceTime."},{"t":"It is an open-source messaging application built exclusively for Android smartphones.","c":false,"fb":"iMessage is Apple's proprietary instant messaging service, not an Android tool."},{"t":"It requires an active landline telephone connection to transmit text messages.","c":false,"fb":"iMessage operates over cellular data and Wi-Fi networks."},{"t":"It charges users expensive international fees for every message sent to another Apple device.","c":false,"fb":"iMessage does not charge international text fees over data connections."}]},{"cat":"02","type":"mcq","stem":"In presentation software like Microsoft PowerPoint, what term refers to the individual visual pages displayed on a screen to an audience?","options":[{"t":"Slides","c":true,"fb":"Presentation software uses slides as individual visual pages to display text, animations, pictures, and charts to an audience."},{"t":"Sheets","c":false,"fb":"Sheets or worksheets are the row-and-column grids used in spreadsheet programs like Excel."},{"t":"Layers","c":false,"fb":"Layers are stacked visual planes used in digital imaging software like Photoshop."},{"t":"Tracks","c":false,"fb":"Tracks are audio and video timeline channels used in video editing software."}]},{"cat":"02","type":"mcq","stem":"Which type of software is used to create visual representations of projects, such as flowcharts and IT network diagrams?","options":[{"t":"Diagramming and graphics software","c":true,"fb":"Diagramming software creates visual representations like project flowcharts and IT network structures."},{"t":"Word processing software","c":false,"fb":"Word processing software is used to write and format text documents like reports."},{"t":"Email client software","c":false,"fb":"Email client software is used to send and manage email messages."},{"t":"Spreadsheet software","c":false,"fb":"Spreadsheet software is used to store and calculate numerical data in rows and columns."}]},{"cat":"02","type":"mcq","stem":"Which software tool provides an online workspace where teams and students can brainstorm together using text, pictures, videos, and links?","options":[{"t":"Digital whiteboards (e.g. Miro)","c":true,"fb":"Digital whiteboards provide interactive workspaces for team brainstorming and remote learning."},{"t":"Video editing software (e.g. DaVinci Resolve)","c":false,"fb":"DaVinci Resolve is used to edit and produce digital videos."},{"t":"Email client software (e.g. Microsoft Outlook)","c":false,"fb":"Microsoft Outlook is used to manage email, calendars, and contacts."},{"t":"Remote assistance software (e.g. Quick Assist)","c":false,"fb":"Quick Assist is used by technicians to troubleshoot computers remotely."}]},{"cat":"02","type":"multi","stem":"Which tasks are standard image editing functions supported by digital imaging software? Select the TWO correct statements.","options":[{"t":"Cropping, resizing, rotating, and recoloring digital photos.","c":true,"fb":"Common tasks in imaging software include cropping, resizing, rotating, and recoloring."},{"t":"Previewing changes and comparing the original image with the edited version before saving.","c":true,"fb":"Imaging software allows previewing changes and comparing the original image with the edited version."},{"t":"Writing automated macro scripts to calculate compound financial interest.","c":false,"fb":"Macros and financial formulas are features of spreadsheet software."},{"t":"Generating multi-slide presentation decks with animated speech notes.","c":false,"fb":"Slide decks and presentation animations are features of presentation software."},{"t":"Controlling a remote computer's keyboard and mouse over the internet.","c":false,"fb":"Controlling remote input peripherals is a feature of remote assistance software."}]},{"cat":"02","type":"scenario","stem":"Which pairing correctly matches a free/basic video tool with a professional editing suite?","context":"A media intern needs a free program for quick video touch-ups, while the production lead requires professional video editing software for commercial movie production.","options":[{"t":"Free/Basic: Microsoft Clipchamp; Professional: Adobe Premiere or DaVinci Resolve","c":true,"fb":"Clipchamp is a free basic editing app, while Adobe Premiere and DaVinci Resolve are professional options."},{"t":"Free/Basic: Microsoft Excel; Professional: Apple Keynote","c":false,"fb":"Excel is spreadsheet software and Keynote is presentation software."},{"t":"Free/Basic: Microsoft Word; Professional: Microsoft Outlook","c":false,"fb":"Word is a word processor and Outlook is an email client."},{"t":"Free/Basic: Adobe Premiere; Professional: Apple Pages","c":false,"fb":"Premiere is professional video software, while Pages is a word processor."}]},{"cat":"03","type":"fitb","stem":"The software that manages hardware and software resources and provides common services for programs is the ____.","sub":"os-definition-role","subtype":"term","answer":["operating system","OS"],"caseSensitive":false,"fb":"An operating system manages resources and provides the services needed for programs to run."},{"cat":"03","type":"scenario","stem":"Which component provides this foundation?","sub":"os-definition-role","context":"A smart TV contains a processor, memory, and a screen. Its applications need software that manages these resources and allows users to interact with the device.","options":[{"t":"The television application","c":false,"fb":"Correction: an individual application performs a task; it does not provide the operating system’s resource-management foundation."},{"t":"The operating system","c":true,"fb":"The OS manages the device’s resources and provides an environment for applications."},{"t":"The physical screen","c":false,"fb":"The screen is hardware, not the software that manages resources."},{"t":"The stored video","c":false,"fb":"A video is data used by an application, not resource-management software."}]},{"cat":"03","type":"mcq","stem":"Why is a CLI generally harder to learn than a GUI?","sub":"cli-gui-tradeoffs","options":[{"t":"It requires more memory","c":false,"fb":"A CLI uses fewer system resources; memory demand does not explain its learning difficulty."},{"t":"It requires graphical navigation","c":false,"fb":"Graphical navigation belongs to a GUI rather than a CLI."},{"t":"It requires command memorization","c":true,"fb":"Users must remember commands to operate a CLI."},{"t":"It prevents script execution","c":false,"fb":"Scripting is a CLI strength, not a restriction."}]},{"cat":"03","type":"multi","stem":"An administrator wants the advantages of a CLI. Select the three features that support this choice.","sub":"cli-gui-tradeoffs","options":[{"t":"Lower resource use","c":true,"fb":"A CLI uses fewer system resources, which benefits older computers."},{"t":"Automatic typo correction","c":false,"fb":"Mistyped characters can cause mistakes; automatic correction is not a stated CLI advantage."},{"t":"Faster scripted tasks","c":true,"fb":"Scripts execute instructions quickly and reduce repetitive work."},{"t":"Less command memorization","c":false,"fb":"CLI users need to remember commands, contributing to the learning difficulty."},{"t":"Quick system navigation","c":true,"fb":"Quick navigation is one of the CLI’s strengths."}]},{"cat":"03","type":"scenario","stem":"Which CLI limitation does this illustrate?","sub":"cli-gui-tradeoffs","context":"A beginner types commands into a console. A mistyped character causes an error, and the interface provides little feedback while the command is being entered.","options":[{"t":"Mandatory graphical navigation","c":false,"fb":"A CLI accepts typed commands rather than requiring graphical navigation."},{"t":"Excessive graphical resource use","c":false,"fb":"Graphical resource use is associated with a GUI; a CLI uses fewer resources."},{"t":"Inability to automate tasks","c":false,"fb":"CLI scripting supports automation."},{"t":"Error-prone command entry","c":true,"fb":"Mistyping and limited feedback make command entry vulnerable to mistakes."}]},{"cat":"03","type":"mcq","stem":"What acts as the go-between for applications and hardware?","sub":"os-application-intermediary","options":[{"t":"The operating system","c":true,"fb":"The OS handles hardware access for applications."},{"t":"The application developer","c":false,"fb":"A developer creates software; the OS provides the running intermediary."},{"t":"The hardware manufacturer","c":false,"fb":"A manufacturer produces hardware rather than acting as the software intermediary."},{"t":"The computer user","c":false,"fb":"The user interacts with the system, but the OS handles application access to hardware."}]},{"cat":"03","type":"scenario","stem":"Why should the revision be made carefully?","sub":"os-application-intermediary","context":"A graphics application relies on the OS to send output to a printer. A proposed OS revision changes services used by the application.","options":[{"t":"Printers must become operating systems","c":false,"fb":"Printers remain hardware devices; an OS revision does not change their role."},{"t":"Applications stop needing hardware access","c":false,"fb":"The application still needs hardware access through the OS."},{"t":"Existing applications may stop working","c":true,"fb":"OS changes can disrupt services that existing software relies on."},{"t":"Developers must manufacture printer hardware","c":false,"fb":"Compatibility concerns do not require developers to manufacture hardware."}]},{"cat":"03","type":"fitb","stem":"Software designed to control a specific hardware model on a particular operating system is a ____.","sub":"device-drivers","subtype":"term","answer":["driver","device driver"],"caseSensitive":false,"fb":"A driver provides control for a particular hardware device on a supported OS."},{"cat":"03","type":"mcq","stem":"The OS cannot identify a newly connected printer; where should a technician look for its correct driver?","sub":"device-drivers","options":[{"t":"Any printer’s driver package","c":false,"fb":"A driver must match the specific hardware model and OS."},{"t":"The manufacturer’s website","c":true,"fb":"The manufacturer’s website is the appropriate place to find and download the correct driver."},{"t":"Another OS’s driver package","c":false,"fb":"A driver for another operating system may not match the installed OS."},{"t":"The printer’s document folder","c":false,"fb":"Stored documents do not provide the software needed to control the printer."}]},{"cat":"03","type":"f
