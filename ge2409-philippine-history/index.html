th an earlier war's U.S. losses."},{"t":"65 miles (105 km)","c":true,"fb":"The march covered about 65 miles, or 105 kilometers."},{"t":"Over one million Filipinos","c":false,"fb":"This confuses a total occupation death estimate with march participation."}]},{"cat":"03","type":"mcq","stem":"Who headed the Second Philippine Republic during Japanese occupation?","sub":"japanese-control","options":[{"t":"Emilio Aguinaldo","c":false,"fb":"This confuses a Philippine-American War leader with occupation-era government."},{"t":"William McKinley","c":false,"fb":"This confuses an earlier U.S. president with a wartime Philippine president."},{"t":"Theodore Roosevelt","c":false,"fb":"This confuses the 1902 war settlement with Japanese occupation."},{"t":"José P. Laurel","c":true,"fb":"José P. Laurel served as president of the Japanese-backed Second Philippine Republic."}]},{"cat":"03","type":"multi","stem":"Which TWO methods supported Japanese wartime economic exploitation?","sub":"japanese-control","options":[{"t":"Forced labor","c":true,"fb":"Forced labor was imposed to support Japan's wartime needs."},{"t":"English instruction","c":false,"fb":"This confuses Japanese economic control with earlier U.S. education policy."},{"t":"Resource extraction","c":true,"fb":"Japanese authorities used Philippine resources for their war effort."},{"t":"Thomasite deployment","c":false,"fb":"This imports an American education reform into Japanese rule."},{"t":"Public-school expansion","c":false,"fb":"This confuses occupation exploitation with U.S. educational development."}]},{"cat":"03","type":"mcq","stem":"What best describes the Hukbalahap?","sub":"hukbalahap","options":[{"t":"Japanese puppet government","c":false,"fb":"This confuses a resistance organization with the occupation government."},{"t":"Communist-led guerrilla movement","c":true,"fb":"The Hukbalahap was a communist-led movement resisting Japanese forces."},{"t":"American teaching group","c":false,"fb":"This confuses wartime guerrillas with an earlier education program."},{"t":"U.S. military command","c":false,"fb":"This mistakes a Filipino resistance group for an American command structure."}]},{"cat":"03","type":"mcq","stem":"What happened to the Hukbalahap after its wartime resistance?","sub":"hukbalahap","options":[{"t":"It established public schools","c":false,"fb":"This assigns an American education reform to a guerrilla movement."},{"t":"It formed the Second Republic","c":false,"fb":"This confuses resistance forces with the occupation government."},{"t":"It gained postwar political influence","c":true,"fb":"The Hukbalahap became more influential in Philippine politics after the war."},{"t":"It led American occupation","c":false,"fb":"This confuses anti-Japanese resistance with earlier U.S. colonial administration."}]},{"cat":"03","type":"mcq","stem":"When did the Battle of Leyte Gulf occur?","sub":"leyte-gulf","options":[{"t":"February 1945","c":false,"fb":"This confuses Leyte Gulf with a later battle for Manila."},{"t":"April 1942","c":false,"fb":"This confuses Leyte Gulf with the fall of Bataan."},{"t":"September 1945","c":false,"fb":"This confuses Leyte Gulf with Japan's formal surrender."},{"t":"October 1944","c":true,"fb":"The Battle of Leyte Gulf took place in October 1944."}]},{"cat":"03","type":"mcq","stem":"Which historic promise was fulfilled during the Battle of Leyte Gulf in October 1944?","sub":"leyte-gulf","options":[{"t":"General Douglas MacArthur landed in the Philippines","c":true,"fb":"Douglas MacArthur fulfilled his famous promise to return to the Philippines."},{"t":"José P. Laurel established the Second Republic","c":false,"fb":"This confuses the occupation-era government with the Allied liberation campaign."},{"t":"Filipino and American forces surrendered at Bataan","c":false,"fb":"This confuses an Allied defeat in 1942 with the 1944 liberation campaign."},{"t":"Japan signed the surrender aboard the USS Missouri","c":false,"fb":"This jumps ahead to the war's final conclusion in September 1945."}]},{"cat":"03","type":"multi","stem":"Which TWO features marked the Battle of Leyte Gulf?","sub":"leyte-gulf","options":[{"t":"Large-scale Kamikaze use","c":true,"fb":"Leyte Gulf saw Japan's first large-scale use of Kamikaze pilots."},{"t":"Second Republic established","c":false,"fb":"This confuses a political development of occupation with the naval battle."},{"t":"Bataan surrender occurred","c":false,"fb":"This imports a 1942 land defeat into the Leyte campaign."},{"t":"Manila was recaptured","c":false,"fb":"This confuses Leyte Gulf with a later urban liberation battle."},{"t":"Japanese fleet decisively defeated","c":true,"fb":"The U.S. Navy's victory crippled Japanese naval power."}]},{"cat":"03","type":"mcq","stem":"About how many Filipino civilians died during Manila's liberation?","sub":"liberation-of-manila","options":[{"t":"About 4,200","c":false,"fb":"This confuses Manila casualties with U.S. losses from an earlier war."},{"t":"About 76,000","c":false,"fb":"This imports the number associated with surrendered Bataan soldiers."},{"t":"Around 100,000","c":true,"fb":"Around 100,000 Filipino civilians were killed during the battle."},{"t":"Over one million","c":false,"fb":"This confuses a city battle with the occupation-wide death estimate."}]},{"cat":"03","type":"scenario","stem":"Which event fits this description?","sub":"liberation-of-manila","context":"Heavy bombardment and Japanese massacres devastated historic districts during a fierce February 1945 urban battle.","options":[{"t":"Battle of Leyte Gulf","c":false,"fb":"This confuses a naval battle with an urban battle."},{"t":"Fall of Bataan","c":false,"fb":"This confuses the 1942 surrender with a later city battle."},{"t":"Japanese surrender","c":false,"fb":"This confuses combat inside the Philippines with Japan's formal capitulation."},{"t":"Liberation of Manila","c":true,"fb":"The February 1945 battle devastated Manila and ended Japanese control there."}]},{"cat":"03","type":"mcq","stem":"When did Japan formally surrender aboard the USS Missouri?","sub":"war-end-independence","options":[{"t":"August 6, 1945","c":false,"fb":"This confuses the surrender with an earlier atomic bombing date."},{"t":"September 2, 1945","c":true,"fb":"Japan formally surrendered aboard the USS Missouri on September 2, 1945."},{"t":"August 9, 1945","c":false,"fb":"This confuses the surrender with another atomic bombing date."},{"t":"July 4, 1946","c":false,"fb":"This confuses Japan's surrender with Philippine independence."}]},{"cat":"03","type":"multi","stem":"Which TWO places were hit by U.S. atomic bombs before Japan surrendered?","sub":"war-end-independence","options":[{"t":"Hiroshima","c":true,"fb":"Hiroshima was struck by an atomic bomb on August 6, 1945."},{"t":"Manila","c":false,"fb":"This confuses a devastated Philippine city with an atomic-bomb target."},{"t":"Bataan","c":false,"fb":"This confuses a Philippine battle area with the final bombing campaign."},{"t":"Nagasaki","c":true,"fb":"Nagasaki was struck by an atomic bomb on August 9, 1945."},{"t":"Leyte Gulf","c":false,"fb":"This confuses a naval battle location with an atomic-bomb target."}]},{"cat":"03","type":"fitb","stem":"Philippine independence was granted on July 4, ____.","sub":"war-end-independence","subtype":"year","answer":["1946"],"caseSensitive":false,"fb":"Full Philippine independence was granted on July 4, 1946, after World War II."},{"cat":"03","type":"mcq","stem":"About how many Filipinos died during the Japanese occupation?","sub":"occupation-effects","options":[{"t":"Over one million","c":true,"fb":"More than one million Filipinos died from wartime violence, labor, starvation, and disease."},{"t":"Around 100,000","c":false,"fb":"This narrows an occupation-wide total to casualties from one major battle."},{"t":"About 76,000","c":false,"fb":"This confuses total deaths with the number associated with Bataan prisoners."},{"t":"About 4,200","c":false,"fb":"This imports a military-loss figure from the Philippine-American War."}]},{"cat":"03","type":"multi","stem":"Which TWO were lasting effects of the Japanese occupation?","sub":"occupation-effects","options":[{"t":"Nationwide public education","c":false,"fb":"This confuses occupation effects with earlier American education reform."},{"t":"English-based instruction","c":false,"fb":"This imports a U.S. colonial education policy into the occupation's effects."},{"t":"Stronger postwar nationalism","c":true,"fb":"Wartime suffering and resistance strengthened postwar nationalism."},{"t":"U.S. colonial rule","c":false,"fb":"This confuses an earlier colonial outcome with consequences of Japanese occupation."},{"t":"Worthless Mickey Mouse Money","c":true,"fb":"Japanese-issued currency lost its value amid severe wartime inflation."}]},{"cat":"04","type":"mcq","stem":"Destroyed industries, agriculture and trade left widespread poverty and unemployment after the war. Which reconstruction challenge is this?","sub":"reconstruction-challenges","options":[{"t":"Economic devastation","c":true,"fb":"The war destroyed industries, agriculture and trade, causing poverty and unemployment."},{"t":"Infrastructure damage","c":false,"fb":"Infrastructure damage concerns ruined cities, roads, bridges and public buildings, not lost livelihoods."},{"t":"Political instability","c":false,"fb":"Political instability concerns competing factions and armed movements, not lost industries."},{"t":"Social displacement","c":false,"fb":"Social displacement concerns homeless Filipinos and returning veterans."}]},{"cat":"04","type":"multi","stem":"Which THREE were among the challenges of post-war reconstruction? Select the THREE correct options.","sub":"reconstruction-challenges","options":[{"t":"Economic devastation","c":true,"fb":"Destroyed industries, agriculture and trade were a listed challenge."},{"t":"Social displacement","c":true,"fb":"Homeless Filipinos and returning veterans needed reintegration."},{"t":"Political instability","c":true,"fb":"Competing factions and armed movements marked the transition to independence."},{"t":"Overpopulation of Manila","c":false,"fb":"Overpopulation of Manila is not a listed challenge; Manila's problem was wartime destruction."},{"t":"Surplus of farm exports","c":false,"fb":"The war destroyed agriculture and trade, so a surplus is the opposite of the actual problem."}]},{"cat":"04","type":"scenario","stem":"Which reconstruction challenge does this situation show?","sub":"reconstruction-challenges","context":"Soon after the war, many Filipinos have no homes. Soldiers coming back from the front cannot find a place in civilian life.","options":[{"t":"Social displacement","c":true,"fb":"Homelessness and the reintegration of returning veterans define this challenge."},{"t":"Economic devastation","c":false,"fb":"Economic devastation concerns destroyed industries, agriculture and trade."},{"t":"Political instability","c":false,"fb":"Political instability concerns factions competing for power."},{"t":"War reparations and foreign influence","c":false,"fb":"This challenge concerns negotiating U.S. aid and reparations, not housing and veterans."}]},{"cat":"04","type":"fitb","stem":"The armed movement whose presence during the post-war political instability reflected unresolved social and economic grievances was the ____.","sub":"hukbalahap","subtype":"term","answer":["Hukbalahap","Huk"],"caseSensitive":false,"fb":"The Hukbalahap was the armed movement whose presence showed that social and economic grievances remained unresolved."},{"cat":"04","type":"mcq","stem":"The presence of the Hukbalahap during post-war instability reflected what?","sub":"hukbalahap","options":[{"t":"Unresolved social and economic grievances","c":true,"fb":"The handout ties armed movements such as the Hukbalahap to unresolved social and economic grievances."},{"t":"Successful reintegration of veterans","c":false,"fb":"Veteran reintegration was a challenge, not something the Hukbalahap showed as achieved."},{"t":"Full recovery of rural communities","c":false,"fb":"Rural communities recovered more slowly, so this reverses the point."},{"t":"Smooth transition to full independence","c":false,"fb":"The transition created tensions and competition for power, so it was not smooth."}]},{"cat":"04","type":"mcq","stem":"Why was U.S. assistance to the post-war Philippines shaped by Cold War concerns?","sub":"us-aid-and-cold-war-interest","options":[{"t":"Seen as strategic Southeast Asian ally","c":true,"fb":"The Philippines was viewed as a strategic ally in Southeast Asia."},{"t":"Seen as a neutral buffer state","c":false,"fb":"The country was viewed as an ally, not a neutral state."},{"t":"Owed large wartime debts to Washington","c":false,"fb":"Wartime debts are not the stated reason; the Cold War concern was the country's value as a strategic ally."},{"t":"Still governed directly as a colony","c":false,"fb":"The country was transitioning to full independence, with new sovereignty to manage."}]},{"cat":"04","type":"mcq","stem":"The new republic must negotiate financial aid and reparations from the U.S. while managing its new sovereignty. Under which challenge does this fall?","sub":"us-aid-and-cold-war-interest","options":[{"t":"War reparations and foreign influence","c":true,"fb":"Negotiating U.S. aid and reparations while managing sovereignty is this challenge."},{"t":"Economic devastation and unemployment","c":false,"fb":"That challenge covers destroyed industries, agriculture and trade at home."},{"t":"Infrastructure damage and rebuilding","c":false,"fb":"That challenge covers ruined cities, roads, bridges and public buildings."},{"t":"Social displacement of returning veterans","c":false,"fb":"That challenge covers homelessness and veteran reintegration."}]},{"cat":"04","type":"mcq","stem":"Which 1946 measure provided U.S. financial aid to support the country's rebuilding after World War II?","sub":"philippine-rehabilitation-act","options":[{"t":"Philippine Rehabilitation Act","c":true,"fb":"The Philippine Rehabilitation Act of 1946 provided U.S. financial aid for rebuilding."},{"t":"Bell Trade Act","c":false,"fb":"The Bell Trade Act established economic ties with the U.S. and was criticized for favoring American interests."},{"t":"Parity Rights Amendment","c":false,"fb":"The Parity Rights Amendment, enacted in 1947, granted Americans equal rights to exploit natural resources."},{"t":"Kilusang Bagong Lipunan","c":false,"fb":"This was Marcos's New Society Movement during Martial Law, not a post-war aid measure."}]},{"cat":"04","type":"mcq","stem":"What did the Philippine Rehabilitation Act mainly do?","sub":"philippine-rehabilitation-act","options":[{"t":"Provided U.S. financial aid for rebuilding","c":true,"fb":"Its purpose was U.S. financial aid to support post-war rebuilding."},{"t":"Tied Philippine trade to U.S. interests","c":false,"fb":"That describes the Bell Trade Act."},{"t":"Gave Americans equal resource rights","c":false,"fb":"That describes the Parity Rights Amendment."},{"t":"Moved the government to a parliament","c":false,"fb":"That was the 1973 Constitution under Marcos."}]},{"cat":"04","type":"fitb","stem":"The Philippine Rehabilitation Act, which provided U.S. financial aid for post-war rebuilding, was passed in the year ____.","sub":"philippine-rehabilitation-act","subtype":"year","answer":["1946"],"caseSensitive":false,"fb":"The Philippine Rehabilitation Act of 1946 provided U.S. aid; the Parity Rights Amendment came a year later, in 1947."},{"cat":"04","type":"mcq","stem":"Which measure established economic ties with the United States but was criticized for favoring American interests?","sub":"bell-trade-act","options":[{"t":"Bell Trade Act","c":true,"fb":"The Bell Trade Act set up economic ties with the U.S. and drew criticism for favoring American interests."},{"t":"Philippine Rehabilitation Act","c":false,"fb":"This act is described as providing U.S. financial aid, not as establishing economic ties."},{"t":"Parity Rights Amendment","c":false,"fb":"This amendment granted Americans equal rights to exploit natural resources; it is a different measure."},{"t":"1973 Constitution","c":false,"fb":"The 1973 Constitution belongs to the Martial Law period, not post-war economic ties."}]},{"cat":"04","type":"mcq","stem":"Why was the Bell Trade Act criticized?","sub":"bell-trade-act","options":[{"t":"Favored American over Filipino interests","c":true,"fb":"Critics said it favored American interests over those of the newly independent nation."},{"t":"Granted Americans equal resource rights","c":false,"fb":"That describes the Parity Rights Amendment."},{"t":"Withheld U.S. aid for rebuilding","c":false,"fb":"Aid came through the Philippine Rehabilitation Act, which is a separate measure."},{"t":"Ended trade with the United States","c":false,"fb":"The act established economic ties; it did not end trade."}]},{"cat":"04","type":"mcq","stem":"Which measure granted American citizens equal rights to exploit Philippine natural resources?","sub":"parity-rights-amendment","options":[{"t":"Parity Rights Amendment","c":true,"fb":"The Parity Rights Amendment gave Americans equal rights to exploit natural resources."},{"t":"Bell Trade Act","c":false,"fb":"The Bell Trade Act is described as establishing economic ties with the U.S., not as granting resource rights."},{"t":"Philippine Rehabilitation Act","c":false,"fb":"This act supplied U.S. financial aid for rebuilding."},{"t":"Proclamation No. 1081","c":false,"fb":"This proclamation declared Martial Law in 1972."}]},{"cat":"04","type":"fitb","stem":"The amendment that granted American citizens equal rights to exploit Philippine natural resources was enacted in the year ____.","sub":"parity-rights-amendment","subtype":"year","answer":["1947"],"caseSensitive":false,"fb":"The Parity Rights Amendment was enacted in 1947, one year after the 1946 Rehabilitation Act and Roxas's election."},{"cat":"04","type":"mcq","stem":"The Parity Rights Amendment sparked debates over which issue?","sub":"parity-rights-amendment","options":[{"t":"National sovereignty and economic independence","c":true,"fb":"Granting Americans equal resource rights raised questions about sovereignty and economic independence."},{"t":"Voting rights of returning veterans","c":false,"fb":"The debates were about control of natural resources, not veteran voting."},{"t":"Funding for school reconstruction","c":false,"fb":"School rebuilding belonged to social programs, not this amendment."},{"t":"Term limits for the presidency","c":false,"fb":"Term limits became an issue under the 1973 Constitution, not here."}]},{"cat":"04","type":"fitb","stem":"Public works restored roads and bridges, and the city of ____, which suffered extensive wartime destruction, underwent massive reconstruction.","sub":"rebuilding-and-social-programs","subtype":"term","answer":["Manila"],"caseSensitive":false,"fb":"Cities like Manila, which suffered extensive wartime destruction, underwent massive reconstruction to restore key areas and support economic recovery."},{"cat":"04","type":"mcq","stem":"Which task did post-war public works projects prioritize?","sub":"rebuilding-and-social-programs","options":[{"t":"Restoring roads, bridges, government buildings","c":true,"fb":"Public works prioritized restoring roads, bridges and government buildings."},{"t":"Building new overseas trade ports","c":false,"fb":"Public works focused on restoring existing infrastructure, not new overseas ports."},{"t":"Expanding rural irrigation canals","c":false,"fb":"Irrigation is not named; the stated priorities were roads, bridges and government buildings."},{"t":"Constructing housing for foreign investors","c":false,"fb":"Housing is not named among the public works priorities, which were roads, bridges and government buildings."}]},{"cat":"04","type":"multi","stem":"Which THREE were part of the post-war social programs and rehabilitation efforts? Select the THREE correct options.","sub":"rebuilding-and-social-programs","options":[{"t":"Resettling displaced families","c":true,"fb":"Resettling displaced families was a core social program."},{"t":"Supporting war veterans","c":true,"fb":"Support for war veterans was part of rehabilitation."},{"t":"Rebuilding schools to improve literacy","c":true,"fb":"Educational reforms rebuilt schools and improved literacy."},{"t":"Granting Americans resource rights","c":false,"fb":"That was the Parity Rights Amendment, a political measure, not a social program."},{"t":"Abolishing presidential term limits","c":false,"fb":"This happened under the 1973 Constitution, much later."}]},{"cat":"04","type":"mcq","stem":"Which groups recovered faster than rural communities after the war?","sub":"uneven-recovery-to-authoritarianism","options":[{"t":"Urban centers and elites","c":true,"fb":"Benefits were uneven, with urban centers and elites recovering faster."},{"t":"Farmers and rural laborers","c":false,"fb":"Rural communities lagged behind, so this reverses the point."},{"t":"Displaced families and veterans","c":false,"fb":"These groups needed resettlement and support, and were not named as faster recoverers."},{"t":"Armed movements in the provinces","c":false,"fb":"Armed movements are linked to unresolved grievances, not named as faster recoverers."}]},{"cat":"04","type":"scenario","stem":"What did this persistent hardship make more likely?","sub":"uneven-recovery-to-authoritarianism","context":"Years after the war, cities and elites have rebuilt and prospered. Rural towns stay poor. Politics remains unstable and the country still depends on foreign help.","options":[{"t":"Conditions enabling authoritarian rule","c":true,"fb":"Persistent hardship, instability and foreign dependence weakened democratic institutions and enabled authoritarian rule."},{"t":"Stronger democratic institutions","c":false,"fb":"These conditions weakened democratic institutions, not strengthened them."},{"t":"Equal recovery across all regions","c":false,"fb":"Recovery was incomplete and uneven, so equality did not follow."},{"t":"Full independence from foreign aid","c":false,"fb":"Foreign dependence persisted and contributed to the weakening of institutions."}]},{"cat":"04","type":"mcq","stem":"Who was President from 1944 to 1946 and worked on securing post-war aid from the United States?","sub":"osmena","options":[{"t":"Sergio Osmeña Sr.","c":true,"fb":"Osmeña was President from 1944 to 1946 and sought U.S. aid for reconstruction."},{"t":"Manuel Roxas","c":false,"fb":"Roxas became the first President of the independent republic in 1946."},{"t":"Elpidio Quirino","c":false,"fb":"Quirino held office from 1948 to 1953."},{"t":"Ferdinand Marcos Sr.","c":false,"fb":"Marcos served from 1965 to 1986, long after the post-war period."}]},{"cat":"04","type":"mcq","stem":"Sergio Osmeña Sr. is best known for which role in post-war recovery?","sub":"osmena","options":[{"t":"Securing post-war aid from the U.S.","c":true,"fb":"He advocated for financial assistance and reconstruction support from the United States."},{"t":"Leading the first independent republic","c":false,"fb":"That describes Manuel Roxas, who served from 1946 to 1948."},{"t":"Promoting industrialization and housing","c":false,"fb":"That describes Elpidio Quirino."},{"t":"Signing Proclamation No. 1081","c":false,"fb":"Marcos signed that proclamation in 1972."}]},{"cat":"04","type":"mcq","stem":"Who won the 1946 elections and became the first President of the independent Republic of the Philippines?","sub":"roxas","options":[{"t":"Manuel Roxas","c":true,"fb":"Roxas won the 1946 elections and served as the first President of the independent republic."},{"t":"Sergio Osmeña Sr.","c":false,"fb":"Osmeña was President from 1944 to 1946, before independence."},{"t":"Elpidio Quirino","c":false,"fb":"Quirino was Roxas's Vice President and later President from 1948."},{"t":"Ferdinand Marcos Sr.","c":false,"fb":"Marcos became President in 1965."}]},{"cat":"04","type":"mcq","stem":"Manuel Roxas served as President during which years?","sub":"roxas","options":[{"t":"1946 to 1948","c":true,"fb":"Roxas served from 1946 to 1948 as the first President of the independent republic."},{"t":"1944 to 1946","c":false,"fb":"These are Osmeña's years in office."},{"t":"1948 to 1953","c":false,"fb":"These are Quirino's years in office."},{"t":"1965 to 1986","c":false,"fb":"These are Marcos's years in office."}]},{"cat":"04","type":"multi","stem":"Manuel Roxas is credited with which THREE of the following? Select the THREE correct options.","sub":"roxas","options":[{"t":"Leading economic recovery","c":true,"fb":"He led economic recovery after the war."},{"t":"Political stabilization","c":true,"fb":"He focused on stabilizing the government and political life."},{"t":"Securing U.S. financial aid","c":true,"fb":"He secured U.S. financial aid and implemented reconstruction programs."},{"t":"Promoting industrialization and housing","c":false,"fb":"That is credited to Elpidio Quirino."},{"t":"Introducing the New Society Movement","c":false,"fb":"Kilusang Bagong Lipunan was introduced by Marcos under Martial Law."}]},{"cat":"04","type":"mcq","stem":"Elpidio Quirino continued post-war recovery as President. Which programs did he promote?","sub":"quirino","options":[{"t":"Parity rights and resource exploitation","c":false,"fb":"Parity rights came from the 1947 Parity Rights Amendment under Roxas, not Quirino's programs."},{"t":"Trade ties and U.S. reparations","c":false,"fb":"The Bell Trade Act and aid were earlier recovery measures, not Quirino's initiatives."},{"t":"Industrialization, housing, and social welfare","c":true,"fb":"Quirino promoted industrialization, housing programs, and social welfare initiatives."},{"t":"Parliamentary reform and rule by decree","c":false,"fb":"These belong to the Marcos era, not Quirino's post-war recovery efforts."}]},{"cat":"04","type":"mcq","stem":"Elpidio Quirino, Manuel Roxas's Vice President, held the presidency during which years?","sub":"quirino","options":[{"t":"1944 to 1946","c":false,"fb":"These are the years of Osmeña's presidency."},{"t":"1946 to 1948","c":false,"fb":"These are Roxas's years; Quirino took over after him."},{"t":"1948 to 1953","c":true,"fb":"Quirino served as President from 1948 to 1953."},{"t":"1965 to 1986","c":false,"fb":"These are Marcos's years as President, not Quirino's."}]},{"cat":"04","type":"fitb","stem":"The Vice President under Manuel Roxas who later became President from 1948 to 1953 was ____.","sub":"quirino","subtype":"name","answer":["Quirino","Elpidio Quirino"],"caseSensitive":false,"fb":"Elpidio Quirino served as Roxas's Vice President and then as President from 1948 to 1953."},{"cat":"04","type":"mcq","stem":"Ferdinand Marcos Sr. served as President of the Philippines for which span?","sub":"marcos-tenure-and-martial-law-period","options":[{"t":"1965 to 1986","c":true,"fb":"Marcos was President from 1965 to 1986."},{"t":"1972 to 1981","c":false,"fb":"These are the martial law years, not his whole presidency."},{"t":"1972 to 1986","c":false,"fb":"Mixes the start of Martial Law with his ouster; his presidency began in 1965."},{"t":"1965 to 1981","c":false,"fb":"Martial Law ended in 1981, but he stayed President until 1986."}]},{"cat":"04","type":"mcq","stem":"Marcos kept the country under martial law during which years?","sub":"marcos-tenure-and-martial-law-period","options":[{"t":"1965 to 1986","c":false,"fb":"This is the full presidency, not the martial law period."},{"t":"1972 to 1986","c":false,"fb":"Martial Law was officially lifted in 1981, even though authoritarian rule continued to 1986."},{"t":"1972 to 1983","c":false,"fb":"1983 is the year of the Ninoy Aquino assassination, not the end of Martial Law."},{"t":"1972 to 1981","c":true,"fb":"Martial Law ran from 1972 until it was officially lifted in 1981."}]},{"cat":"04","type":"multi","stem":"Select the TWO correct spans for the Marcos years.","sub":"marcos-tenure-and-martial-law-period","options":[{"t":"Presidency: 1965 to 1986","c":true,"fb":"Marcos was President from 1965 to 1986."},{"t":"Martial Law: 1965 to 1986","c":false,"fb":"Martial Law began in 1972, not at the start of his presidency."},{"t":"Martial Law: 1972 to 1981","c":true,"fb":"Martial Law lasted from 1972 to 1981."},{"t":"Presidency: 1972 to 1981","c":false,"fb":"This confuses the martial law period with his presidency."},{"t":"Authoritarian rule ended in 1981","c":false,"fb":"Authoritarian rule continued until his 1986 ouster despite the 1981 lifting."}]},{"cat":"04","type":"mcq","stem":"Marcos cited communist insurgency as grounds for extraordinary powers. What do critics argue about this claim?","sub":"martial-law-justification-and-critique","options":[{"t":"It was exaggerated to legitimize control","c":true,"fb":"Critics argue the threats were exaggerated to legitimize authoritarian control."},{"t":"It was understated by the government","c":false,"fb":"Critics say the threat was overstated, not understated."},{"t":"It was invented by the Hukbalahap","c":false,"fb":"The Hukbalahap is a post-war armed movement, not the source of this critique."},{"t":"It was resolved before 1972","c":false,"fb":"Critics do not claim it was resolved; they claim it was exaggerated."}]},{"cat":"04","type":"mcq","stem":"Which was NOT among the threats Marcos cited to justify Martial Law?","sub":"martial-law-justification-and-critique","options":[{"t":"Communist insurgency","c":false,"fb":"Marcos did cite communist insurgency."},{"t":"Civil unrest","c":false,"fb":"Marcos did cite civil unrest."},{"t":"Foreign debt crisis","c":true,"fb":"Heavy foreign debt was a consequence of his rule, not a justification he cited."},{"t":"Rebellion","c":false,"fb":"Marcos did cite rebellion."}]},{"cat":"04","type":"scenario","stem":"According to such critics, what was the real aim behind the declaration?","sub":"martial-law-justification-and-critique","context":"In 1972, Marcos placed the country under martial law, citing communist insurgency, civil unrest, and rebellion. A historian reviewing the period argues these threats were overstated.","options":[{"t":"Rebuild war-damaged infrastructure","c":false,"fb":"Reconstruction was a post-war goal, not the critics' claim about Martial Law."},{"t":"Extend rule beyond the constitutional limit","c":true,"fb":"Critics argue Marcos used Martial Law to extend his rule and suppress political opposition."},{"t":"Secure U.S. aid for recovery","c":false,"fb":"U.S. aid belonged to the post-war reconstruction era, not the critique of Martial Law."},{"t":"Reintegrate returning war veterans","c":false,"fb":"Veteran reintegration was a post-war challenge, unrelated to the critique."}]},{"cat":"04","type":"mcq","stem":"Martial Law was presented as temporary. What did it actually do to the balance of power?","sub":"executive-concentration-and-rule-by-decree","options":[{"t":"Concentrated authority in the executive","c":true,"fb":"It concentrated authority in the executive branch."},{"t":"Shifted authority to the legislature","c":false,"fb":"Power moved toward the executive, not the legislature."},{"t":"Restored authority to local governments","c":false,"fb":"Nothing suggests power was returned to local governments."},{"t":"Divided authority among three branches","c":false,"fb":"Authority was concentrated in the executive, not divided; the shift weakened democratic institutions."}]},{"cat":"04","type":"multi","stem":"Select the TWO effects of Martial Law on governance.","sub":"executive-concentration-and-rule-by-decree","options":[{"t":"Rule through decree became normal","c":true,"fb":"It normalized rule through decree rather than consent."},{"t":"Legislative power was strengthened","c":false,"fb":"Authority was concentrated in the executive, not the legislature."},{"t":"Democratic institutions were weakened","c":true,"fb":"Concentrating power in the executive weakened democratic institutions."},{"t":"Rule by consent became stronger","c":fal oid for fraud","c":false,"fb":"The official COMELEC results declared Marcos the winner; they did not void the elections."},{"t":"Marcos the winner","c":true,"fb":"COMELEC's official results declared Marcos the winner."}]},{"cat":"04","type":"fitb","stem":"The independent count of the 1986 snap elections, which showed Corazon Aquino leading, was run by ____ (give the acronym).","sub":"namfrel","subtype":"term","answer":["NAMFREL"],"caseSensitive":false,"fb":"NAMFREL ran the independent count showing Corazon Aquino leading, in contrast to the official COMELEC results favoring Marcos."},{"cat":"04","type":"mcq","stem":"The independent count of the 1986 snap elections showed which candidate leading?","sub":"namfrel","options":[{"t":"Benigno Aquino Jr.","c":false,"fb":"Ninoy had been assassinated in 1983 and was not a candidate."},{"t":"Ferdinand Marcos","c":false,"fb":"Marcos was declared winner in the official COMELEC results, not the independent count."},{"t":"Sergio Osmeña","c":false,"fb":"Osmeña was president in 1944–1946 and is unrelated to the 1986 elections."},{"t":"Corazon Aquino","c":true,"fb":"The independent count showed Corazon Aquino leading."}]},{"cat":"04","type":"mcq","stem":"Which description fits the NAMFREL count of the 1986 snap elections?","sub":"namfrel","options":[{"t":"Independent count; Marcos leading","c":false,"fb":"Marcos was declared the winner in the official results, not in the independent count."},{"t":"Government count confirming the result","c":false,"fb":"NAMFREL's count was independent, and it conflicted with the official result."},{"t":"Independent count; Aquino leading","c":true,"fb":"NAMFREL ran the independent count, which showed Corazon Aquino leading."},{"t":"Decree-ordered count; tie reported","c":false,"fb":"No decree or tie is described; the count was independent and showed Aquino leading."}]},{"cat":"04","type":"mcq","stem":"The fall of the Marcos regime left which questions unresolved?","sub":"regime-collapse-causes","optio // Every question declares its own `cat` key in the pack. Anything
// with a missing/unknown key becomes 'other' (excluded from exam
// simulation, still reachable in normal practice mode).
BANK.forEach(q => {
  if (!q.cat || !CATEGORIES.some(c => c.key === q.cat)) q.cat = 'other';
});

// ── Sub-topic (variant) groups ──────────────────────────────────
// Questions that carry the same `sub` key inside the same category
// are VARIANTS OF ONE CONCEPT — three different ways of asking about
// the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

/* ── Exam-blueprint helpers (engine code — no edits needed) ──────── */
// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Java syntax highlighting for the code box.
// Tokenises the RAW source and escapes each token as it wraps it. Never run
// a highlighter over already-escaped HTML -- it tears &quot; and &lt; apart.
// Comments and strings come first in the alternation, so a keyword sitting
// inside a string or a comment is not coloured.
const JAVA_KEYWORDS = /^(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|record|sealed|permits|yield)$/;
const JAVA_TOKEN_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function highlightJava(src) {
  let out = '', last = 0, m;
  JAVA_TOKEN_RE.lastIndex = 0;
  while ((m = JAVA_TOKEN_RE.exec(src)) !== null) {
    if (m.index > last) out += escapeHtml(src.slice(last, m.index));
    const txt = m[0];
    let cls = null;
    if (m[1]) cls = 'tok-comment';
    else if (m[2]) cls = 'tok-string';
    else if (m[3]) cls = 'tok-annot';
    else if (m[4]) cls = 'tok-num';
    else if (m[5]) {
      if (JAVA_KEYWORDS.test(m[5])) cls = 'tok-kw';
      else if (/^[A-Z]/.test(m[5])) cls = 'tok-type';
    }
    out += cls ? `<span class="${cls}">${escapeHtml(txt)}</span>` : escapeHtml(txt);
    last = m.index + txt.length;
  }
  if (last < src.length) out += escapeHtml(src.slice(last));
  return out;
}

// Highlight only what we can actually parse. Anything not tagged java --
// pseudocode, plain text -- falls through to the plain escaped path.
function renderCodeBody(code, lang) {
  const src = String(code).replace(/^\r?\n+/, '').replace(/\r?\n\s*$/, '');
  return (lang && String(lang).toLowerCase() === 'java') ? highlightJava(src) : escapeHtml(src);
}

function formatInline(s) {
  if (!s) return '';
  const parts = String(s).split(/(`[^`]+`)/g);
  return parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  const blocks = [];
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const isDiagram = lang && ['text', 'diagram', 'ascii', 'tree'].includes(lang.toLowerCase());
    const badge = isDiagram ? 'DIAGRAM' : ((lang ? lang.toUpperCase() + ' ' : '') + 'CODE');
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    const placeholder = `___BLOCK_${blocks.length}___`;
    blocks.push(`<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(code, lang || 'java')}</code></pre></div>`);
    return placeholder;
  });

  // 2. Format inline code & escape remaining text
  const parts = text.split(/(`[^`]+`)/g);
  text = parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');

  // 3. Restore fenced code blocks
  blocks.forEach((block, i) => {
    text = text.replace(`___BLOCK_${i}___`, block);
  });

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'parsons') { return { type:q.type, stem:q.stem, lines:q.lines, origIdx:q.origIdx, cat:q.cat }; }
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

}

function pSeq(q){ return q.lines.filter(function(l){return !l.distractor;}).map(function(l){return String(l.code).trim();}); }
function pEnsure(i){

function pScore(q, ans){
  var seq=pSeq(q), need=seq.length; ans=ans||[];
  // l.swap: lines of one swap group may sit in any order among themselves
  var want=q.lines.filter(function(l){return !l.distractor;});
  var marks=ans.map(function(k,pos){ var l=q.lines[k]; return !!(l && !l.distractor && pos<need && (String(l.code).trim()===seq[pos] || (l.swap && want[pos].swap===l.swap))); });
  var right=marks.filter(Boolean).length, filled=ans.length>0;
  var status = !filled ? 'skipped' : (right===need && ans.length===need) ? 'correct' : right===0 ? 'wrong' : 'partial';
  return { score: need?right/need:0, status:status, marks:marks, right:right, need:need };
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'parsons') { return pScore(q, selectedIdxs); }
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

// ----- length picker -----
$('countGrid').addEventListener('click', e => {

// ----- focus toggle + topic chips -----
function renderTopicGrid() {
  const grid = $('topicGrid');
  grid.innerHTML = '';
  // Objectives with zero questions are hidden until you write them.
  CATEGORIES.filter(cat => (CAT_COUNTS[cat.key] || 0) > 0).forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'topic-chip';
    chip.dataset.key = cat.key;
    if (state.focusedCats.includes(cat.key)) chip.classList.add('on');
    chip.innerHTML = `
      <div class="topic-chip-check"></div>
      <div class="topic-chip-label">${cat.label}</div>
      <div class="topic-chip-count">${CAT_COUNTS[cat.key]}</div>
    `;
    chip.addEventListener('click', () => {
      const i = state.focusedCats.indexOf(cat.key);
      if (i >= 0) state.focusedCats.splice(i, 1);
      else state.focusedCats.push(cat.key);
      chip.classList.toggle('on');
      updateSetupSummary();
    });
    grid.appendChild(chip);
  });
}
renderTopicGrid();

// weighted blueprint draw. Switching it OFF restores whatever the

    $('timePicker').classList.toggle('hidden', !state.timerEnabled);

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'At the end, when you finish';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'At the end, when you finish';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Right after you press Check';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? BANK.filter(q => state.focusedCats.includes(q.cat)) : BANK;
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}
updateSetupSummary();

// ----- start the quiz -----
$('startBtn').addEventListener('click', () => {
  state.questions = buildActiveQuiz();
  state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
  state.checked   = state.questions.map(() => false);
  state.current   = 0;
  state.timeUp    = false;
  state.timeUsedMs = 0;

  $('view-setup').classList.add('hidden');
  $('view-quiz').classList.remove('hidden');
  $('view-quiz').classList.add('fade-in');
  $('qTotal').textContent = state.questions.length;

  // Test-mode notice
  $('testNotice').classList.toggle('hidden', !state.timerEnabled);

  // Start timer if needed

    startTimer(state.timerMinutes * 60 * 1000);
  }

  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });
  { const cur = jumper.querySelector('.current'); if (cur) jumper.scrollLeft = cur.offsetLeft - jumper.clientWidth / 2 + cur.offsetWidth / 2; }

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (q.type === 'parsons') { tagLabel = 'Arrange the code'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in"><span class="folio" aria-hidden="true">— ' + (state.current + 1) + ' —</span>';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  html += `<span class="qnum-inline">${state.current + 1} of ${state.questions.length}</span>`;
  html += `<div class="qstem">${formatContent(q.stem)}</div>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${formatContent(q.context)}</div></div>`;
  }
  if (q.code) {
    const isDiagram = q.codeLang && ['text', 'diagram', 'ascii', 'tree'].includes(q.codeLang.toLowerCase());
    const badge = q.codeEyebrow || (isDiagram ? 'DIAGRAM' : (q.codeLang ? q.codeLang.toUpperCase() + ' CODE' : 'CODE SNIPPET'));
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    html += `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(q.code, q.codeLang)}</code></pre></div>`;
  }

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${formatInline(q.hint)}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${formatInline(q.fb)}</div>`;
    }
    html += `</div>`;
  } else if (q.type === 'parsons') {
    html += parsonsHTML(q, state.current, isChecked, r);
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          if (isMulti) {
            cls += ' is-missed';
            marker = '\u25CB';
            tagsHtml = '<span class="opt-tag miss">Missed choice</span>';
            showFeedback = true;
          } else {
            cls += ' is-correct';
            marker = '\u2713';
            tagsHtml = '<span class="opt-tag ans">Correct answer</span>';
            showFeedback = true;
          }
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${formatInline(opt.t)}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${formatInline(opt.fb)}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (q.type === 'parsons') {
    if (!isChecked) wireParsons(state.current);
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('End this quiz and go back to setup? Your answers will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.querySelectorAll('a[href="../index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const quiz = $('view-quiz');
    if (quiz && !quiz.classList.contains('hidden')) {
      if (!confirm('Leave this quiz and return to the Reviewer Hub? Your current progress will be lost.')) {
        e.preventDefault();
      } else {
        stopTimer();
      }
    }
  });
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Library date stamp; a due slip suggests a re-read when the score is under 90%.
  const fmtDay = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
  const today = new Date();
  const due = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
  const dueSlip = pct < 90
    ? `<div class="due-slip"><span>Date due</span><b>${fmtDay(due).replace(/ \d{4}$/, '')}</b></div>`
    : '';
  const stampHtml = `<div class="stamp-row"><div class="date-stamp" aria-label="Well read, ${fmtDay(today)}"><span>Well read</span><b aria-hidden="true">&#9824;</b><span>${fmtDay(today)}</span></div>${dueSlip}</div>`;

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 1.5rem; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
        ${stampHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    <div class="btn-row">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="../index.html" class="btn ghost">← Back to Index</a>
        <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
        <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      </div>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    state.questions = buildActiveQuiz();
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
<script>
(function(){var b=document.querySelector('.theme-preview');if(!b)return;var root=document.documentElement;
try{var saved=localStorage.getItem('qf-theme');if(saved==='light'||saved==='dark')root.dataset.theme=saved}catch(e){}
function cur(){var t=root.dataset.theme;if(t)return t;return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function label(){var next=cur()==='light'?'dark':'light';b.textContent=next==='light'?'Light mode':'Dark mode';b.setAttribute('aria-label','Switch to '+next+' mode')}
b.onclick=function(){var next=cur()==='light'?'dark':'light';root.dataset.theme=next;try{localStorage.setItem('qf-theme',next)}catch(e){}label()};label();})();
</script>
</body>
