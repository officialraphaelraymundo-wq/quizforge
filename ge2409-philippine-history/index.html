<style>

:root{--bg:#0F0E13;--bg-2:#1C1A22;--bg-deep:#25222E;--bg-raise:#2E2A3A;--ink:#F4F1EA;--ink-soft:#B9B6C0;--ink-mute:#8B8895;--rule:#2A2733;--rule-strong:#3F3A4D;--accent:#C9A96E;--accent-deep:#6B5530;--accent-soft:#2A2115;--correct:#7FC49A;--correct-bg:#14261D;--correct-edge:#2C4A3A;--wrong:#E0707F;--wrong-bg:#2B151B;--wrong-edge:#4A2530;--gold:#A98BE0;--gold-bg:#211A33;--gold-edge:#3F3163;--purple:#5B3F8C;--purple-lt:#8A6BC4;--shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);--display:"Cormorant Garamond",Garamond,"Palatino Linotype",Georgia,serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",Menlo,monospace;--tok-type:#A98BE0;}

/* --- palette test overrides --- */
.masthead,.divider-double{border-color:var(--accent)}
.display{font-weight:600}.display em{font-weight:600}
.qstem{font-size:1.6875rem;font-weight:500}
.progress-info .qcount{font-weight:500}
.opt-feedback{font-size:1rem}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
.opt.selected{border-color:var(--purple-lt)}
.opt.selected .opt-marker{background:var(--purple-lt);border-color:var(--purple-lt);color:#fff}
.qtype-tag{background:var(--purple);color:var(--ink)}
.section-label::before{content:"\2660";width:auto;height:auto;background:none;color:var(--accent);font-size:0.875rem;line-height:1}
.tabs{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 14px;margin-bottom:18px;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button[data-v]{font-family:var(--body);font-size:0.875rem;padding:6px 14px;background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--rule-strong);border-radius:99px;cursor:pointer}
.tabs button[data-v].on{border-color:var(--accent);color:var(--accent)}

/* ---- v2: research-based refinements ---- */
/* Readability: thin display face is kept for headings only; explanations use the sturdier body face (WCAG 1.4.3 note on thin fonts) */
.opt-feedback{font-family:var(--body);font-style:normal;font-size:0.9688rem;line-height:1.55;color:var(--ink-soft)}
.opt-text{font-size:1.0312rem}
.qstem{font-weight:600}
/* Small labels: raise the tiny mono sizes */
.qverdict-text{font-size:0.7812rem}
.opt-tag{font-size:0.7188rem;padding:2px 8px}
.jump-dot{width:40px;height:40px;font-size:0.8125rem}
.question-jumper{gap:8px}
.qtype-tag{font-size:0.75rem}
.progress-info{font-size:0.7812rem}
/* Contrast fixes: dark text on light markers */
.opt.is-wrong .opt-marker,.opt.is-wrong .opt-tag.you{color:var(--bg)}
.opt.selected .opt-marker{background:var(--purple-lt);color:var(--bg)}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
/* Not colour alone (WCAG 1.4.1): shape + symbol + border style for each result */
.opt.is-correct{border-width:2px;border-style:solid}
.opt.is-wrong{border-style:dashed}
.opt.is-missed{border-style:dotted;border-width:2px}
.opt.is-correct .opt-marker,.opt.is-wrong .opt-marker,.opt.is-missed .opt-marker{font-size:0}
.opt.is-correct .opt-marker::after{content:"\2713";font-size:0.875rem}
.opt.is-wrong .opt-marker::after{content:"\2717";font-size:0.875rem}
.opt.is-missed .opt-marker::after{content:"!";font-size:0.875rem}
/* Learning: after Check, the right answer is the loudest thing; wrong picks stay visible but calmer */
.opt.is-correct{box-shadow:0 0 0 1px var(--correct),0 0 20px rgba(127,196,154,.30)}
.opt.is-wrong{box-shadow:none;background:rgba(224,112,127,.08)}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed){opacity:1}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed) .opt-text{color:var(--ink-mute)}
/* Touch targets (WCAG 2.5.8 min 24px; Material 48dp with 8dp gaps) */
.btn{min-height:48px}
.count-card,.topic-chip,.time-chip{min-height:48px}
.options{gap:12px}
.toggle{width:52px;height:30px}
.toggle::after{width:22px;height:22px}
.toggle.on::after{transform:translateX(22px)}
.opt-toggle-row{min-height:56px}
:focus-visible{outline:3px solid var(--purple-lt);outline-offset:3px}
@media (max-width:600px){
  .nav-row{position:sticky;bottom:0;z-index:4;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
  .nav-right{width:100%}
  .nav-right .btn.primary,.nav-right .btn:not(.ghost){flex:1}
  .qcard{padding:26px 18px}

  .qstem{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3: restrained playing-card theme ---- */
.qcard{position:relative;border-radius:12px;padding-bottom:58px;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,169,110,.28);border-radius:8px;pointer-events:none}

/* ============================================================
   QuizForge shared theme — load in BOTH hub and quiz templates
   Dark is default; light "paper" mode follows the phone setting.
   ============================================================ */
:root{
  --bg:#0F0E13; --bg-2:#1C1A22; --bg-deep:#25222E; --bg-raise:#2E2A3A;
  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#C9A96E; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;
  --gold:#A98BE0; --gold-bg:#211A33; --gold-edge:#3F3163;   /* "partial / missed" = lavender */
  --bg-glow:rgba(91,63,140,.30); --bg-glow-2:rgba(91,63,140,.14); --spade-alpha:.09;
  --frame:rgba(201,169,110,.30);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --radius-card:12px; --radius-ctl:8px;
  --display:"Cormorant Garamond",Garamond,"Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --tok-type:#A98BE0;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;
    --ink:#1C1A22; --ink-soft:#45414F; --ink-mute:#66626F;
    --rule:#DDD6C8; --rule-strong:#C4BAA6;
    --accent:#80612A; --accent-deep:#5A441D; --accent-soft:#F1E8D6;
    --purple:#5B3F8C; --purple-lt:#6546A3; --on-purple:#FBF9F4;
    --correct:#23704A; --correct-bg:#E2F0E6; --correct-edge:#A9CFB7;
    --wrong:#A8324A; --wrong-bg:#F8E3E7; --wrong-edge:#E0AAB5;
    --gold:#6546A3; --gold-bg:#ECE5F6; --gold-edge:#C6B6E6;
    --bg-glow:rgba(91,63,140,.12); --bg-glow-2:rgba(201,169,110,.12); --spade-alpha:.06;
    --frame:rgba(128,97,42,.35);
    --shadow:0 1px 0 rgba(28,26,34,.05),0 8px 24px -14px rgba(28,26,34,.25);
    --tok-type:#6546A3;
    color-scheme:light;
  }
}

  --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;

/* ============================================================
   QuizForge shared theme — "Reading Room" variant — load in BOTH hub and quiz templates
   Dark is default; light "paper" mode follows the phone setting.

:root{

  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#B39A6B; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;

}

/* ================= Reading Room overrides ================= */
body{background-image:radial-gradient(900px 600px at 6% -10%,var(--lamp),transparent 62%),radial-gradient(900px 600px at 105% 115%,var(--bg-glow-2),transparent 60%)}
.display{font-weight:500}
.display em{font-style:italic;color:var(--accent)}
.eyebrow{font-family:var(--type);font-size:0.875rem;letter-spacing:0;text-transform:none;color:var(--accent)}
.divider-double{border-color:var(--rule-strong)}
.section-label{font-family:var(--display);font-size:1.375rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.section-label::before{content:none}
/* masthead: course code as a call number */
.codex{font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:0;border:0;background:none;color:var(--ink-soft);padding:0}
.codex::after{content:" \2660";font-size:0.5625rem;color:var(--ink-mute);opacity:.7}
.stamp{font-family:var(--type);font-size:0.7812rem;letter-spacing:.04em;border:1px solid var(--rule-strong);padding:2px 8px;color:var(--ink-mute)}
.crumb{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8125rem}
/* length choices as small catalog cards */
.count-card{border-radius:4px;background-color:var(--page);background-image:linear-gradient(var(--purple),var(--purple)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--ruled) 21px 22px);background-size:100% 2px,100% 100%;background-position:0 0,0 0;background-repeat:no-repeat}
.count-card.active{background-color:var(--bg-deep);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.count-num{font-weight:500}
.count-label{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.ot-title{font-family:var(--display);font-size:1.25rem;font-weight:500}
.ot-sub{font-family:var(--type);font-size:0.8125rem;letter-spacing:0;text-transform:none}
.setup-summary .ss-item .ss-key,.meta-item .meta-key{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.7812rem}
.meta-row{border-left-color:var(--purple)}
/* progress: a purple ribbon */
.progress-bar{height:6px;background:var(--rule);border-radius:0}
.progress-fill{background:var(--purple-lt);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%)}
.progress-info{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.jump-dot{font-family:var(--type);border-radius:3px}
.jump-dot.current::after{content:none}
/* the question card is a book page */
.qcard{border-radius:3px;background-color:var(--page);background-image:linear-gradient(90deg,var(--page-edge),transparent 22px);padding-right:58px;padding-bottom:50px;overflow:visible}
.qcard::before{content:"\2660";inset:auto;top:-1px;right:24px;width:15px;height:58px;border:0;border-radius:0;background:var(--purple);color:var(--bg);font-size:0.5rem;line-height:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);z-index:2}
.qverdict{border-radius:0;margin:-32px -58px 26px -30px;padding-right:58px}
.folio{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--display);font-style:italic;font-size:0.9375rem;color:var(--ink-mute)}
.qtype-tag{font-family:var(--type);font-size:0.7812rem;letter-spacing:0;text-transform:none;background:none;color:var(--accent);padding:0;border:0}
.qstem{font-family:var(--display);font-weight:500;font-size:1.6875rem;line-height:1.28}
.opt{border-radius:4px}
.opt-text{font-family:var(--body)}
.opt-marker{font-family:var(--type);border-radius:3px}
/* explanations read like margin notes */
.opt-feedback{position:relative;margin-top:10px;padding:2px 0 2px 14px;border-left:2px solid var(--rule-strong);background:none}
.opt-feedback::before{content:"Note \2014 ";font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute)}
.opt.is-correct .opt-feedback{border-left-color:var(--correct)}
.opt.is-wrong .opt-feedback{border-left-color:var(--wrong)}
.opt.is-missed .opt-feedback{border-left-color:var(--gold)}
.opt-tag{font-family:var(--type);letter-spacing:0;text-transform:none;border-radius:2px}
.qverdict-text{font-family:var(--body);letter-spacing:0;text-transform:none}
.btn{border-radius:4px}
/* results: library date stamp */
.score-dial .fill{stroke:var(--purple-lt)}
.verdict-eyebrow{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem;color:var(--accent)}
.verdict{font-family:var(--display);font-weight:500}
.date-stamp{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:6px 14px;border:2px solid var(--purple-lt);outline:1px solid var(--purple-lt);outline-offset:2px;border-radius:3px;font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-lt);transform:rotate(-4deg);opacity:.9}
.date-stamp b{font-size:0.75rem}
@media (max-width:600px){
  .qcard{padding:24px 44px 44px 18px}
  .qcard::before{right:14px;width:13px;height:48px}
  .qverdict{margin:-24px -44px 22px -18px;padding-right:44px}
  .qstem{font-size:1.4375rem}
  .section-label{font-size:1.1875rem}
}

/* ================= quiet whimsy ================= */
/* pencil notes in the verdict banner */
.qverdict{position:relative}
.qverdict{flex-wrap:wrap}
.qverdict::after{position:static;margin-left:auto;max-width:48%;text-align:right;line-height:1.05;transform:rotate(-3deg);font-family:"Caveat","Segoe Print",cursive;font-weight:500;font-size:1.1875rem;opacity:.85;pointer-events:none}
.qverdict.correct::after{content:"nicely done";color:var(--correct)}
.qverdict.wrong::after{content:"happens to the best of us";color:var(--wrong)}
/* the ribbon sways once when you get one right */
@keyframes ribbon-sway{0%{transform:rotate(0)}25%{transform:rotate(5deg)}55%{transform:rotate(-3deg)}80%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
.qcard::before{transform-origin:50% 0}
.qcard:has(.qverdict.correct)::before{animation:ribbon-sway 1.4s ease-out 1}
/* dog-eared page corner that folds a little more on hover */
.qcard::after{content:"";position:absolute;left:-1px;bottom:-1px;width:16px;height:16px;background:linear-gradient(45deg,var(--bg) 50%,var(--bg-raise) 50%);box-shadow:1px -1px 2px rgba(0,0,0,.18);transition:width .25s,height .25s}
.qcard:hover::after{width:24px;height:24px}
/* results: stamp + due slip */
.stamp-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.stamp-row .date-stamp{margin-top:0}
.due-slip{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:10px;padding:8px 14px 10px;background-color:var(--page);background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--ruled) 17px 18px);border:1px solid var(--rule-strong);border-top:3px solid var(--purple);font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute);transform:rotate(1.5deg)}
.due-slip b{font-size:1rem;color:var(--ink)}
.due-slip em{grid-column:1/-1;font-style:normal;font-family:"Caveat",cursive;font-size:1.0625rem;color:var(--ink-soft)}
@media (max-width:600px){.qverdict::after{font-size:1.0625rem;max-width:44%}}
@media (max-width:380px){.qverdict::after{display:none}}
@media (prefers-reduced-motion:reduce){.qcard:has(.qverdict.correct)::before{animation:none}.qcard::after{transition:none}}

/* ---- intuitiveness pass ---- */
.nav-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.quiet{background:none;border:none;color:var(--ink-mute);font-size:0.875rem;padding:8px 10px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn.quiet:hover,.btn.quiet:focus-visible{color:var(--wrong)}
/* jump dots: a mark as well as a colour, so status reads without colour vision */
.jump-dot.checked-correct::after,.jump-dot.checked-wrong::after,.jump-dot.checked-partial::after{position:absolute;top:1px;right:3px;font-size:0.625rem;line-height:1;color:var(--bg);font-family:var(--body);font-weight:600}
.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}
.jump-dot.checked-partial::after,.jump-dot.checked-partial.current::after{content:"\00BD"}
@media (max-width:600px){.nav-left{width:100%;justify-content:space-between}}


/* ================= live engine additions ================= */
/* 360px with large text: long code identifiers wrap instead of widening the page; the counter row may wrap */
.qcard,#view-results,.display{overflow-wrap:anywhere}

.btn.quiet{background:none;border:none;color:var(--ink-mute);font-size:0.875rem;padding:8px 10px;text-decoration:underline;text-underline-offset:3px}

/* jump dots carry a mark as well as a colour */
.jump-dot.checked-correct::after,.jump-dot.checked-wrong::after,.jump-dot.checked-partial::after{position:absolute;top:1px;right:3px;font-size:0.625rem;line-height:1;color:var(--bg);font-family:var(--body);font-weight:600}
.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}

aries","c":true,"fb":"Listed as a primary-source example."},{"t":"Official documents","c":true,"fb":"Listed as a primary-source example."},{"t":"Newspaper articles","c":true,"fb":"Listed as a primary-source example."},{"t":"Textbook chapters","c":false,"fb":"A later account, not a first-hand one."},{"t":"Documentary films","c":false,"fb":"Not among the examples listed."}]},{"cat":"01","type":"mcq","stem":"Which is the oldest known written document found in the Philippines?","sub":"lci-basics","options":[{"t":"Laguna Copperplate Inscription","c":true,"fb":"Dated 900 CE, the oldest known document."},{"t":"Boxer Codex","c":false,"fb":"Created around 1590, far later."},{"t":"Doctrina Christiana","c":false,"fb":"Printed in 1593, far later."},{"t":"Butuan Boat manifest","c":false,"fb":"No such document appears in the handout."}]},{"cat":"01","type":"fitb","stem":"The Laguna Copperplate Inscription dates to the year ____ CE.","sub":"lci-basics","subtype":"year","answer":["900"],"caseSensitive":false,"fb":"The LCI dates to 900 CE, making it the oldest known Philippine document."},{"cat":"01","type":"mcq","stem":"The Laguna Copperplate Inscription was written in which script?","sub":"lci-basics","options":[{"t":"Kawi","c":true,"fb":"Written in Kawi script on a copper sheet."},{"t":"Baybayin","c":false,"fb":"Baybayin evolved from Kawi but is not the LCI script."},{"t":"Latin","c":false,"fb":"Introduced later by the Spanish."},{"t":"Arabic","c":false,"fb":"Not the script of this document."}]},{"cat":"01","type":"mcq","stem":"What transaction does the Laguna Copperplate Inscription record?","sub":"lci-content","options":[{"t":"The forgiveness of a debt","c":true,"fb":"It records the forgiveness of Namwaran's debt."},{"t":"The sale of farming land","c":false,"fb":"No land sale appears in the document."},{"t":"A treaty between two datus","c":false,"fb":"No treaty is recorded."},{"t":"A marriage between families","c":false,"fb":"No marriage is recorded."}]},{"cat":"01","type":"mul r."},{"t":"Lived independently and could not be sold","c":false,"fb":"That describes the other subtype."},{"t":"Served the datu as a warrior","c":false,"fb":"That describes the Timawa."},{"t":"Was exempt from manual labor","c":false,"fb":"That describes the Maginoo."}]},{"cat":"01","type":"mcq","stem":"How could an Alipin leave bondage?","sub":"alipin-subtypes","options":[{"t":"By buying their freedom","c":true,"fb":"They could earn money and buy freedom."},{"t":"By joining the babaylan","c":false,"fb":"Not a route named in the handout."},{"t":"By marrying a Timawa","c":false,"fb":"Not a route named in the handout."},{"t":"By leaving the barangay","c":false,"fb":"Not a route named in the handout."}]},{"cat":"01","type":"multi","stem":"Which THREE were economic activities of Indigenous Filipinos? Select the THREE economic activities.","sub":"economic-activities","options":[{"t":"Agriculture","c":true,"fb":"Cultivating rice, root crops and fruits."},{"t":"Weaving and pottery","c":true,"fb":"Producing textiles and ceramic wares."},{"t":"Trade","c":true,"fb":"Routes reached China, India and neighbouring polities."},{"t":"Coin minting","c":false,"fb":"Not among the activities listed."},{"t":"Printing","c":false,"fb":"Printing began with the Spanish in 1593."}]},{"cat":"01","type":"mcq","stem":"Pre-colonial Filipinos established trade routes with which places?","sub":"economic-activities","options":[{"t":"China, India and Southeast Asia","c":true,"fb":"The three trading partners named."},{"t":"Spain, Mexico and Peru","c":false,"fb":"Those came with colonial galleon trade."},{"t":"Japan, Korea and Taiwan","c":false,"fb":"Taiwan appears only via the Jade Road."},{"t":"Arabia, Persia and Egypt","c":false,"fb":"Not named in the handout."}]},{"cat":"01","type":"mcq","stem":"What did pre-colonial Filipino animism centre on?","sub":"animism-babaylan","options":[{"t":"Nature spirits and ancestral worship","c":true,"fb":"Animism held both at its core."},{"t":"One god and a written scripture","c":false,"fb":"That arrived with Islam and Christianity."},{"t":"Worship of the reigning datu","c":false,"fb":"The datu was a political leader."},{"t":"Rejection of ritual practice","c":false,"fb":"Ritual was central, led by the babaylan."}]},{"cat":"01","type":"fitb","stem":"Pre-colonial shamans who performed rituals and healing ceremonies were called ____.","sub":"animism-babaylan","subtype":"term","answer":["babaylan"],"caseSensitive":false,"fb":"The babaylan were shamans, healers, advisers and cultural custodians."},{"cat":"01","type":"mcq","stem":"Besides healing, what role did the babaylan hold in the community?","sub":"animism-babaylan","options":[{"t":"Adviser and cultural custodian","c":true,"fb":"They advised and preserved culture."},{"t":"Commander of the datu's warriors","c":false,"fb":"Warfare was the datu's and Timawa's role."},{"t":"Collector of tribute and debts","c":false,"fb":"Not a role named in the handout."},{"t":"Keeper of the barangay's script","c":false,"fb":"Not a role named in the handout."}]},{"cat":"01","type":"mcq","stem":"Islam arrived in Mindanao during which century?","sub":"islam-mindanao","options":[{"t":"The 14th century","c":true,"fb":"Its arrival introduced monotheism to the region."},{"t":"The 10th century","c":false,"fb":"That is nearer the date of the LCI."},{"t":"The 16th century","c":false,"fb":"That is when the Spanish arrived."},{"t":"The 19th century","c":false,"fb":"Far later than the handout states."}]},{"cat":"01","type":"mcq","stem":"What political structures developed with the arrival of Islam?","sub":"islam-mindanao","options":[{"t":"Sultanates","c":true,"fb":"Islam contributed to organized sultanates."},{"t":"Barangays","c":false,"fb":"Those existed before Islam arrived."},{"t":"Encomiendas","c":false,"fb":"Those came with Spanish colonisation."},{"t":"Principalia","c":false,"fb":"That was a Spanish-era local elite."}]},{"cat":"01","type":"mcq","stem":"The Balangay boat was built from which materials?","sub":"balangay","options":[{"t":"Hardwood and wooden pegs","c":true,"fb":"No metal fastenings are mentioned."},{"t":"Bamboo and woven rattan","c":false,"fb":"Not the materials described."},{"t":"Hardwood and iron nails","c":false,"fb":"Wooden pegs, not iron, held it together."},{"t":"Reeds and animal hide","c":false,"fb":"Not the materials described."}]},{"cat":"01","type":"mcq","stem":"How many people could a Balangay carry?","sub":"balangay","options":[{"t":"Up to 50","c":true,"fb":"The handout gives fifty as its capacity."},{"t":"Up to 10","c":false,"fb":"Lower than the figure given."},{"t":"Up to 100","c":false,"fb":"Higher than the figure given."},{"t":"Up to 500","c":false,"fb":"Far higher than the figure given."}]},{"cat":"01","type":"fitb","stem":"Balangay boats were excavated in Butuan in the year ____.","sub":"balangay","subtype":"year","answer":["1976"],"caseSensitive":false,"fb":"They were discovered in Butuan in 1976; a replica sailed in 2009."},{"cat":"01","type":"mcq","stem":"The Maritime Jade Road connected the Philippines with which places?","sub":"maritime-jade-road","options":[{"t":"Taiwan and Southeast Asia","c":true,"fb":"Jade came mainly from Taiwan."},{"t":"China and India only","c":false,"fb":"Those are the general trade partners, not this route."},{"t":"Japan and Korea","c":false,"fb":"Not part of this route."},{"t":"Spain and Mexico","c":false,"fb":"Those belong to the colonial era."}]},{"cat":"01","type":"mcq","stem":"Roughly how long did the Maritime Jade Road last?","sub":"maritime-jade-road","options":[{"t":"About 3,000 years","c":true,"fb":"From 2000 BCE to 1000 CE."},{"t":"About 300 years","c":false,"fb":"Far shorter than the period given."},{"t":"About 500 years","c":false,"fb":"Far shorter than the period given."},{"t":"About 10,000 years","c":false,"fb":"Far longer than the period given."}]},{"cat":"01","type":"mcq","stem":"How many characters does Baybayin have?","sub":"baybayin","options":[{"t":"17","c":true,"fb":"Fourteen consonants and three vowels."},{"t":"14","c":false,"fb":"That is the consonant count alone."},{"t":"20","c":false,"fb":"Not the figure given in the handout."},{"t":"26","c":false,"fb":"That is the Latin alphabet's count."}]},{"cat":"01","type":"mcq","stem":"Baybayin evolved from which earlier script?","sub":"baybayin","options":[{"t":"Kawi","c":true,"fb":"Baybayin developed from the Kawi script."},{"t":"Latin","c":false,"fb":"Latin displaced Baybayin later."},{"t":"Arabic","c":false,"fb":"Not the script it developed from."},{"t":"Sanskrit","c":false,"fb":"Not named as its parent script."}]},{"cat":"01","type":"fitb","stem":"A bill proposing Baybayin as the national writing system was filed in ____.","sub":"baybayin","subtype":"year","answer":["2018"],"caseSensitive":false,"fb":"The 2018 bill proposed Baybayin as the national writing system."},{"cat":"02","type":"mcq","stem":"In which year did Ferdinand Magellan arrive in the Philippines?","sub":"magellan-arrival","options":[{"t":"1521","c":true,"fb":"Magellan reached the islands in 1521."},{"t":"1565","c":false,"fb":"That is the year of the first permanent settlement."},{"t":"1571","c":false,"fb":"That is the year Manila became the capital."},{"t":"1872","c":false,"fb":"That is the year of the Gomburza execution."}]},{"cat":"02","type":"mcq","stem":"Under whose flag did the Portuguese explorer Magellan sail?","sub":"magellan-arrival","options":[{"t":"Spain","c":true,"fb":"He was Portuguese but sailed under the Spanish flag."},{"t":"Portugal","c":false,"fb":"His nationality, not the flag he sailed under."},{"t":"Mexico","c":false,"fb":"Mexico features later, in the galleon trade."},{"t":"The Netherlands","c":false,"fb":"Not connected to this expedition."}]},{"cat":"02","type":"mcq","stem":"What was the aim of Magellan's expedition?","sub":"magellan-arrival","options":[{"t":"A westward route to the Spice Islands","c":true,"fb":"The islands were an unplanned encounter."},{"t":"The capture of Manila as a capital","c":false, ","type":"fitb","stem":"The chieftain who defeated Magellan at the Battle of Mactan was ____.","sub":"battle-of-mactan","subtype":"name","answer":["Lapu-Lapu","Lapulapu"],"caseSensitive":false,"fb":"Lapu-Lapu and his warriors killed Magellan at Mactan."},{"cat":"02","type":"mcq","stem":"What did the Battle of Mactan demonstrate?","sub":"battle-of-mactan","options":[{"t":"Native resistance to foreign intervention","c":true,"fb":"It highlighted local resistance."},{"t":"The success of Christian conversion","c":false,"fb":"Conversion efforts caused the conflict."},{"t":"The start of the galleon trade","c":false,"fb":"That began under later colonial rule."},{"t":"The founding of a Spanish colony","c":false,"fb":"No colony was founded by Magellan."}]},{"cat":"02","type":"mcq","stem":"Who established the first permanent Spanish settlement in the Philippines?","sub":"spanish-settlements","options":[{"t":"Miguel López de Legazpi","c":true,"fb":"He settled Cebu in 1565."},{"t":"Ferdinand Magellan","c":false,"fb":"He died before any settlement was founded."},{"t":"Rajah Humabon of Cebu","c":false,"fb":"A local ruler, not a Spanish official."},{"t":"Father Jacinto Zamora","c":false,"fb":"One of the Gomburza priests, much later."}]},{"cat":"02","type":"fitb","stem":"Legazpi established the first permanent Spanish settlement in Cebu in ____.","sub":"spanish-settlements","subtype":"year","answer":["1565"],"caseSensitive":false,"fb":"The 1565 Cebu settlement began formal Spanish colonisation."},{"cat":"02","type":"mcq","stem":"Manila was established as the colonial capital in which year?","sub":"spanish-settlements","options":[{"t":"1571","c":true,"fb":"Manila became the capital in 1571."},{"t":"1565","c":false,"fb":"That is the Cebu settlement year."},{"t":"1521","c":false,"fb":"That is Magellan's arrival year."},{"t":"1592","c":false,"fb":"Not a date given in the handout."}]},{"cat":"02","type":"mcq","stem":"Who carried out the conversion of Filipinos to Catholicism?","sub":"conversion-christianity","options":[{"t":"Missionaries","c":true,"fb":"Missionaries drove the conversion effort."},{"t":"Encomenderos","c":false,"fb":"They collected tribute, though they taught religion too."},{"t":"Ilustrados","c":false,"fb":"Educated reformists of the 1880s."},{"t":"Mestizos","c":false,"fb":"A social group, not an evangelising body."}]},{"cat":"02","type":"mcq","stem":"Besides religious practice, what else did conversion influence?","sub":"conversion-christianity","options":[{"t":"Cultural traditions","c":true,"fb":"Conversion reshaped cultural traditions too."},{"t":"Ocean trade routes","c":false,"fb":"Those were shaped by the galleon trade."},{"t":"Land ownership rules","c":false,"fb":"Those featured in later revolts."},{"t":"The Baybayin script","c":false,"fb":"That belongs to the earlier lesson."}]},{"cat":"02","type":"mcq","stem":"What right did the encomienda system grant Spanish settlers?","sub":"encomienda","options":[{"t":"The right to collect tribute","c":true,"fb":"Tribute collection from local populations."},{"t":"The right to own the land outright","c":false,"fb":"Tribute, not outright ownership, is specified."},{"t":"The right to appoint local datus","c":false,"fb":"Officials replaced chieftains separately."},{"t":"The right to trade with Mexico","c":false,"fb":"That describes the galleon trade."}]},{"cat":"02","type":"mcq","stem":"What were encomienda holders expected to give in return?","sub":"encomienda","options":[{"t":"Protection and Christian teaching","c":true,"fb":"The two duties owed in exchange for tribute."},{"t":"Wages and land titles","c":false,"fb":"Neither is named in the handout."},{"t":"Schooling in Latin and law","c":false,"fb":"Education came through religious orders."},{"t":"Seats in the Spanish Cortes","c":false,"fb":"That was a Propaganda Movement demand."}]},{"cat":"02","type":"fitb","stem":"The system granting Spanish settlers tribute rights over locals was the ____ system.","sub":"encomienda","subtype":"term","a "c":false,"fb":"That is an ilustrado."},{"t":"A member of a religious order","c":false,"fb":"That is a missionary."}]},{"cat":"02","type":"mcq","stem":"Which trade route linked the colony to Mexico?","sub":"economic-changes","options":[{"t":"The Manila-Acapulco galleon trade","c":true,"fb":"It connected Manila with Mexico and beyond."},{"t":"The Maritime Jade Road","c":false,"fb":"A precolonial route to Taiwan."},{"t":"The Spice Islands route","c":false,"fb":"Magellan's intended destination."},{"t":"The Cebu-Homonhon route","c":false,"fb":"Not a trade route in the handout."}]},{"cat":"02","type":"multi","stem":"Which THREE became important export crops under Spanish rule? Select the THREE colonial cash crops.","sub":"economic-changes","options":[{"t":"Sugar","c":true,"fb":"Named as a major cash crop."},{"t":"Tobacco","c":true,"fb":"Named as a major cash crop."},{"t":"Hemp","c":true,"fb":"Named as a major cash crop."},{"t":"Rice","c":false,"fb":"A local staple, not an export cash crop here."},{"t":"Jade","c":false,"fb":"A precolonial trade good, and not a crop."}]},{"cat":"02","type":"mcq","stem":"What problem did the focus on export crops create?","sub":"economic-changes","options":[{"t":"Neglect of local agricultural needs","c":true,"fb":"Native farmers faced economic hardship."},{"t":"A shortage of Spanish missionaries","c":false,"fb":"Unrelated to crop policy."},{"t":"The end of the galleon trade","c":false,"fb":"The galleon trade carried these exports."},{"t":"The collapse of the encomienda","c":false,"fb":"Not stated in the handout."}]},{"cat":"02","type":"mcq","stem":"Who established the first formal schools in the colony?","sub":"educational-reforms","options":[{"t":"Religious orders","c":true,"fb":"Formal education came through religious institutions."},{"t":"The Spanish Cortes","c":false,"fb":"A parliament in Spain, not a school founder."},{"t":"The ilustrados","c":false,"fb":"They campaigned for education much later."},{"t":"Encomienda holders","c":false,"fb":"Their duty was tribute-linked instruction only."}]},{"cat":"02","type":"mcq","stem":"What did colonial education concentrate on?","sub":"educational-reforms","options":[{"t":"Religion and the Spanish language","c":true,"fb":"The two focuses of instruction."},{"t":"Science and mathematics","c":false,"fb":"Not the focus described."},{"t":"Trade and navigation","c":false,"fb":"Not the focus described."},{"t":"Law and public administration","c":false,"fb":"Not the focus described."}]},{"cat":"02","type":"mcq","stem":"What happened to traditional chieftains under Spanish rule?","sub":"political-changes","options":[{"t":"They were replaced by Spanish officials","c":true,"fb":"Their power was diminished."},{"t":"They were given seats in the Spanish Cortes","c":false,"fb":"Representation there was never granted."},{"t":"They kept full authority locally","c":false,"fb":"Their authority was reduced."},{"t":"They became encomienda holders","c":false,"fb":"That role went to Spanish settlers."}]},{"cat":"02","type":"mcq","stem":"How was authority organised across the islands under Spanish rule?","sub":"political-changes","options":[{"t":"A centralized government","c":true,"fb":"Authority was centralised under the Spanish."},{"t":"A federation of barangays","c":false,"fb":"Barangays lost their independence."},{"t":"A council of local datus","c":false,"fb":"Chieftains were displaced instead."},{"t":"An elected colonial assembly","c":false,"fb":"No such body is described."}]},{"cat":"02","type":"mcq","stem":"The Dagohoy Rebellion lasted between which years?","sub":"dagohoy-rebellion","options":[{"t":"1744 to 1829","c":true,"fb":"The longest revolt named in the handout."},{"t":"1521 to 1565","c":false,"fb":"That spans Magellan to Legazpi instead."},{"t":"1872 to 1892","c":false,"fb":"That spans Gomburza to the Katipunan."},{"t":"1889 to 1895","c":false,"fb":"That is the life of La Solidaridad."}]},{"cat":"02","type":"multi","stem":"Which THREE grievances commonly caused revolts under Spanish rule? Select the THREE grievances behind the revolts.","sub":"dagohoy-rebellion","options":[{"t":"Land ownership","c":true,"fb":"Named as a source of grievance."},{"t":"Taxation","c":true,"fb":"Named as a source of grievance."},{"t":"Forced labor","c":true,"fb":"Named as a source of grievance."},{"t":"Denial of the vote","c":false,"fb":"Not among the grievances listed."},{"t":"Loss of the Baybayin script","c":false,"fb":"Not among the grievances listed."}]},{"cat":"02","type":"mcq","stem":"What is folk Catholicism?","sub":"religious-syncretism","options":[{"t":"Christian practice blended with indigenous belief","c":true,"fb":"Both survive together in one practice."},{"t":"Catholic worship conducted only in Spanish","c":false,"fb":"Language is not what defines it."},{"t":"A rejection of all precolonial deities","c":false,"fb":"Those beliefs persisted rather than vanished."},{"t":"The teaching duty of encomienda holders","c":false,"fb":"That is a colonial obligation, not a practice."}]},{"cat":"02","type":"scenario","stem":"Which impact of Spanish rule does this illustrate?","sub":"religious-syncretism","context":"A community festival honours a Catholic saint, and participants carry anting-anting amulets while performing rituals inherited from precolonial practice.","options":[{"t":"Religious syncretism","c":true,"fb":"Christian and indigenous practice fused together."},{"t":"Educational reform","c":false,"fb":"No schooling is involved here."},{"t":"The encomienda system","c":false,"fb":"No tribute or protection is involved."},{"t":"Political centralisation","c":false,"fb":"No governance change is involved."}]},{"cat":"02","type":"mcq","stem":"On what date were the Gomburza priests executed?","sub":"gomburza","options":[{"t":"February 17, 1872","c":true,"fb":"Executed for alleged support of the Cavite Mutiny."},{"t":"March 18, 1521","c":false,"fb":"That is Magellan's first contact."},{"t":"April 7, 1521","c":false,"fb":"That is the Humabon alliance."},{ olic orders","c":false,"fb":"Not among the objectives listed."},{"t":"Immediate armed independence","c":false,"fb":"That was the revolutionaries' approach."},{"t":"Return of precolonial datus","c":false,"fb":"Not among the objectives listed."}]},{"cat":"02","type":"multi","stem":"Which THREE were main objectives of the Propaganda Movement? Select the THREE main objectives.","sub":"propaganda-objectives","options":[{"t":"Advocacy for reforms","c":true,"fb":"Representation, free speech, legal equality."},{"t":"National identity","c":true,"fb":"Unity through Filipino culture and history."},{"t":"Education and enlightenment","c":true,"fb":"An educated populace could claim its rights."},{"t":"Armed revolution","c":false,"fb":"That marked the shift away from this movement."},{"t":"Restoration of Baybayin","c":false,"fb":"Not among the objectives listed."}]},{"cat":"02","type":"mcq","stem":"Who founded the newspaper La Solidaridad?","sub":"lopez-jaena","options":[{"t":"Graciano López Jaena","c":true,"fb":"He founded it in 1889 as the movement's platform."},{"t":"Marcelo H. del Pilar","c":false,"fb":"He became its editor the following year."},{"t":"José Rizal","c":false,"fb":"He wrote novels rather than founding this paper."},{"t":"Andres Bonifacio","c":false,"fb":"He founded a revolutionary society instead."}]},{"cat":"02","type":"fitb","stem":"La Solidaridad was founded in the year ____.","sub":"lopez-jaena","subtype":"year","answer":["1889"],"caseSensitive":false,"fb":"López Jaena founded La Solidaridad in 1889."},{"cat":"02","type":"mcq","stem":"Which newspaper did Marcelo H. del Pilar edit in 1882?","sub":"del-pilar","options":[{"t":"Diariong Tagalog","c":true,"fb":"He edited it before joining La Solidaridad."},{"t":"La Solidaridad","c":false,"fb":"He took that over in 1890."},{"t":"Noli Me Tangere","c":false,"fb":"A novel, not a newspaper."},{"t":"La Liga Filipina","c":false,"fb":"A reformist society, not a newspaper."}]},{"cat":"02","type":"mcq","stem":"In which year did del Pilar replace López Jaena as editor of La Solidaridad?","sub":"del-pilar","options":[{"t":"1890","c":true,"fb":"He continued its campaign for reform."},{"t":"1889","c":false,"fb":"That is the year the paper was founded."},{"t":"1892","c":false,"fb":"That is the year of La Liga Filipina."},{"t":"1895","c":false,"fb":"That is the year the paper ceased."}]},{"cat":"02","type":"mcq","stem":"What did del Pilar consider an essential tool for social change?","sub":"del-pilar","options":[{"t":"The press","c":true,"fb":"He used writing to criticise Spanish policies."},{"t":"Armed struggle","c":false,"fb":"That was Bonifacio's approach."},{"t":"Religious instruction","c":false,"fb":"That was a colonial project."},{"t":"Foreign military aid","c":false,"fb":"Not mentioned in the handout."}]},{"cat":"02","type":"mcq","stem":"Which novel did José Rizal publish in 1887?","sub":"rizal-works","options":[{"t":"Noli Me Tangere","c":true,"fb":"His first novel exposing colonial injustice."},{"t":"El Filibusterismo","c":false,"fb":"Published in 1891."},{"t":"La Solidaridad","c":false,"fb":"A newspaper, not a novel."},{"t":"Diariong Tagalog","c":false,"fb":"A newspaper, not a novel."}]},{"cat":"02","type":"mcq","stem":"El Filibusterismo was published in which year?","sub":"rizal-works","options":[{"t":"1891","c":true,"fb":"Rizal's second novel."},{"t":"1887","c":false,"fb":"That is the year of his first novel."},{"t":"1892","c":false,"fb":"That is the year of La Liga Filipina."},{"t":"1889","c":false,"fb":"That is the year La Solidaridad began."}]},{"cat":"02","type":"mcq","stem":"What was La Liga Filipina?","sub":"rizal-works","options":[{"t":"A reformist society seeking peaceful change","c":true,"fb":"Founded by Rizal in 1892."},{"t":"A secret society planning armed revolt","c":false,"fb":"That describes the Katipunan."},{"t":"A newspaper printed in Spain","c":false,"fb":"That describes La Solidaridad."},{"t":"A school founded in Dapitan","c":false,"fb":"Dapitan was his place of exile."}]},{"cat":"02","type":"mcq","stem":"Where was Rizal exiled in 1892?","sub":"rizal-exile","options":[{"t":"Dapitan","c":true,"fb":"He worked there on education and science."},{"t":"Homonhon","c":false,"fb":"Site of Magellan's first contact."},{"t":"Cavite","c":false,"fb":"Associated with the 1872 mutiny."},{"t":"Mactan","c":false,"fb":"Site of the battle with Magellan."}]},{"cat":"02","type":"mcq","stem":"What did Rizal concentrate on during his exile?","sub":"rizal-exile","options":[{"t":"Education, science and public service","c":true,"fb":"His three areas of work in Dapitan."},{"t":"Editing La Solidaridad from abroad","c":false,"fb":"Del Pilar edited it by then."},{"t":"Organising an armed uprising","c":false,"fb":"That was Bonifacio's path."},{"t":"Writing his first novel","c":false,"fb":"Noli was published five years earlier."}]},{"cat":"02","type":"fitb","stem":"La Solidaridad ceased publication in the year ____.","sub":"la-solidaridad-end","subtype":"year","answer":["1895"],"caseSensitive":false,"fb":"It closed in 1895 for lack of funds and declining influence."},{"cat":"02","type":"mcq","stem":"Who is known as the Father of the Philippine Revolution?","sub":"bonifacio","options":[{"t":"Andres Bonifacio","c":true,"fb":"He founded the Katipunan in 1892."},{"t":"Emilio Aguinaldo","c":false,"fb":"He led forces in the later stages."},{"t":"José Rizal","c":false,"fb":"He pursued peaceful reform instead."},{"t":"Graciano López Jaena","c":false,"fb":"A journalist of the Propaganda Movement."}]},{"cat":"02","type":"fitb","stem":"The secret revolutionary society founded by Bonifacio in 1892 was the ____.","sub":"bonifacio","subtype":"term","answer":["Katipunan","KKK"],"caseSensitive":false,"fb":"The Katipunan aimed to overthrow Spanish rule by armed struggle."},{"cat":"02","type":"mcq","stem":"How did Bonifacio's approach differ from the Propaganda Movement's?","sub":"bonifacio","options":[{"t":"He favoured armed struggle over reform","c":true,"fb":"Direct action rather than petition."},{"t":"He worked through the Spanish Cortes","c":false,"fb":"That was the reformists' demand."},{"t":"He campaigned from Spain","c":false,"fb":"The reformists campaigned abroad."},{"t":"He relied on newspapers alone","c":false,"fb":"That describes the propagandists."}]},{"cat":"02","type":"mcq","stem":"Who became the first president of the First Philippine Republic?","sub":"aguinaldo","options":[{"t":"Emilio Aguinaldo","c":true,"fb":"He led the republic from 1899 to 1901."},{"t":"Andres Bonifacio","c":false,"fb":"He founded the Katipunan instead."},{"t":"Marcelo H. del Pilar","c":false,"fb":"A journalist of the Propaganda Movement."},{"t":"Mariano Gómez","c":false,"fb":"One of the Gomburza priests."}]},{"cat":"02","type":"mcq","stem":"The First Philippine Republic lasted between which years?","sub":"aguinaldo","options":[{"t":"1899 to 1901","c":true,"fb":"The span given for the republic."},{"t":"1892 to 1895","c":false,"fb":"That spans the Katipunan's founding to La Solidaridad's end."},{"t":"1744 to 1829","c":false,"fb":"That is the Dagohoy Rebellion."},{"t":"1885 to 1890","c":false,"fb":"Not a span given in the handout."}]},{"cat":"02","type":"mcq","stem":"In which later conflict did Aguinaldo lead resistance?","sub":"aguinaldo","options":[{"t":"The Philippine-American War","c":true,"fb":"He resisted American colonisation after the Spanish defeat."},{"t":"The Battle of Mactan","c":false,"fb":"That happened in 1521."},{"t":"The Cavite Mutiny","c":false,"fb":"That happened in 1872."},{"t":"The Dagohoy Rebellion","c":false,"fb":"That ended in 1829."}]},{"cat":"02","type":"mcq","stem":"What ended in 1895 for lack of financial support?","sub":"la-solidaridad-end","options":[{"t":"La Solidaridad","c":true,"fb":"The movement's main platform closed that year."},{"t":"La Liga Filipina","c":false,"fb":"Rizal's society, founded three years earlier."},{"t":"Diariong Tagalog","c":false,"fb":"Del Pilar's earlier newspaper of 1882."},{"t":"The Katipunan","c":false,"fb":"Founded in 1892 and active into the revolution."}]},{"cat":"03","type":"mcq","stem":"When did the Philippine-American War begin?","sub":"paw-outbreak","options":[{"t":"February 4, 1899","c":true,"fb":"Fighting began on this date near Manila after an American soldier fired at Filipino troops."},{"t":"June 12, 1898","c":false,"fb":"This confuses the outbreak of war with the earlier declaration of Philippine independence."},{"t":"March 23, 1901","c":false,"fb":"This confuses the war's outbreak with a major event involving Aguinaldo later in the conflict."},{"t":"July 4, 1902","c":false,"fb":"This confuses the beginning of the conflict with its officially declared end."}]},{"cat":"03","type":"multi","stem":"Which TWO details describe the outbreak on February 4, 1899?","sub":"paw-outbreak","options":[{"t":"American soldier fired","c":true,"fb":"The initial armed clash involved an American soldier shooting at Filipino troops."},{"t":"Fighting occurred near Manila","c":true,"fb":"The confrontation occurred near Manila as tensions became open conflict."},{"t":"Aguinaldo captured in Palanan","c":false,"fb":"This places a later event from 1901 at the war's beginning."},{"t":"Roosevelt offered amnesty","c":false,"fb":"This confuses the outbreak with actions taken near the conflict's official end."},{"t":"Japan attacked the Philippines","c":false,"fb":"This mixes the Philippine-American War with the later World War II period."}]},{"cat":"03","type":"mcq","stem":"What did the Treaty of Paris transfer to the United States?","sub":"treaty-of-paris","options":[{"t":"Control of the Philippines","c":true,"fb":"The treaty transferred control of the Philippines from Spain to the United States."},{"t":"Control of Filipino guerrillas","c":false,"fb":"This mistakes a transfer of colonial control for command over resistance forces."},{"t":"Leadership of Philippine forces","c":false,"fb":"This confuses international sovereignty with military leadership."},{"t":"Leadership of the Republic","c":false,"fb":"This treats the treaty as a change in Filipino political leadership rather than foreign control."}]},{"cat":"03","type":"mcq","stem":"How did Emilio Aguinaldo view the U.S. acquisition under the Treaty of Paris?","sub":"treaty-of-paris","options":[{"t":"Betrayal of Philippine independence","c":true,"fb":"Aguinaldo regarded the transfer as a betrayal of the independence Filipinos had sought."},{"t":"Recognition of Philippine independence","c":false,"fb":"This reverses Aguinaldo's interpretation by treating foreign control as recognition."},{"t":"End of armed resistance","c":false,"fb":"This assumes the transfer removed the reason for resistance instead of intensifying the dispute."},{"t":"Restoration of Spanish authority","c":false,"fb":"This confuses the new colonial transfer with a return to Spanish rule."}]},{"cat":"03","type":"mcq","stem":"What was the first major engagement of the Philippine-American War?","sub":"battle-of-manila-1899","options":[{"t":"Battle of Caloocan","c":false,"fb":"This confuses another battle associated with Filipino resistance with the first major engagement."},{"t":"Battle of Manila","c":true,"fb":"The February 4–5, 1899 Battle of Manila was the war's first major engagement."},{"t":"Battle of Leyte Gulf","c":false,"fb":"This mixes the Philippine-American War with a major World War II battle."},{"t":"Defense of Tirad Pass","c":false,"fb":"This confuses a later delaying action with the war's opening major battle."}]},{"cat":"03","type":"mcq","stem":"What followed the Filipino defeat in the Battle of Manila?","sub":"battle-of-manila-1899","options":[{"t":"Immediate American withdrawal","c":false,"fb":"This assumes the defeated side's retreat caused the opposing force to leave."},{"t":"Restoration of Spanish control","c":false,"fb":"This confuses the battle's military result with a return to the previous colonial power."},{"t":"Shift to guerrilla warfare","c":true,"fb":"Aguinaldo's forces retreated into the countryside and adopted guerrilla tactics."},{"t":"Japanese military occupation","c":false,"fb":"This mixes events from 1899 with the much later World War II occupation."}]},{"cat":"03","type":"mcq","stem":"Who captured Emilio Aguinaldo on March 23, 1901?","sub":"aguinaldo-capture","options":[{"t":"Arthur MacArthur Jr.","c":false,"fb":"This confuses the overall U.S. commander with the officer who carried out the capture operation."},{"t":"William McKinley","c":false,"fb":"This mistakes the U.S. president for the field commander responsible for the operation."},{"t":"Frederick Funston","c":true,"fb":"General Frederick Funston led the operation that captured Aguinaldo in Palanan."},{"t":"Theodore Roosevelt","c":false,"fb":"This confuses a later U.S. president associated with the war's declared end with the capture operation."}]},{"cat":"03","type":"mcq","stem":"How did Funston's force gain access to Aguinaldo's hideout?","sub":"aguinaldo-capture","options":[{"t":"They posed as prisoners","c":true,"fb":"Funston's troops used a prisoner disguise to infiltrate Aguinaldo's position."},{"t":"They used naval bombardment","c":false,"fb":"This transfers a conventional battle tactic to a covert capture operation."},{"t":"They offered general amnesty","c":false,"fb":"This confuses the capture operation with a later policy toward surrendering insurgents."},{"t":"They attacked from artillery","c":false,"fb":"This treats infiltration as if it were an open battlefield assault."}]},{"cat":"03","type":"fitb","stem":"Aguinaldo swore allegiance to the United States on April 1, ____.","sub":"aguinaldo-capture","subtype":"year","answer":["1901"],"caseSensitive":false,"fb":"After his March 23 capture, Aguinaldo was brought to Manila and took the oath of allegiance on April 1, 1901."},{"cat":"03","type":"mcq","stem":"When was the Philippine-American War officially declared ended?","sub":"paw-end-resistance","options":[{"t":"July 4, 1898","c":false,"fb":"This shifts the official end into
