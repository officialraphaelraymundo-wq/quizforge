l community leader expands his settlement's influence by negotiating trade pacts with neighboring coastal settlements, leading warrior defenses, and securing diplomatic alliances.","options":[{"t":"A Spanish encomendero managing a royal estate","c":false,"fb":"Encomenderos were Spanish colonial grant holders."},{"t":"A datu governing an independent barangay","c":true,"fb":"Accurately describes a datu exercising political, economic, and military leadership in a barangay."},{"t":"A Timawa commoner running for provincial election","c":false,"fb":"Timawa were freemen, not political rulers or provincial candidates."},{"t":"A European governor-general establishing a royal court","c":false,"fb":"European governors-general were post-colonial administrative figures."}]},{"cat":"01","type":"multi","stem":"Which of the following statements accurately describe political governance in pre-colonial barangays? Select the TWO correct statements.","options":[{"t":"Datus maintained political authority through alliances, governance, and military leadership.","c":true,"fb":"Accurately reflects how datus built and sustained governance over barangays."},{"t":"All barangays across the Philippine archipelago were subject to a single centralized law code.","c":false,"fb":"Misconception: M-barangay-monarchy-myth. Barangays were independent settlements, not a single empire."},{"t":"Settlements operated as independent political units that engaged in regional trade and warfare.","c":true,"fb":"Reflects the autonomous, self-governing nature of pre-colonial barangays."},{"t":"Datus were appointed directly by foreign monarchs in Spain and China.","c":false,"fb":"Datus derived authority from local nobility lineage, leadership, and alliances."},{"t":"Pre-colonial communities possessed no legal structures or dispute resolution mechanisms.","c":false,"fb":"Misconception: M-barangay-no-governance. Pre-colonial societies maintained custom and legal mechanisms."}]},{"cat":"01","type":"mcq","stem":"Which privileges and duties defined the Maginoo social class in pre-colonial society?","options":[{"t":"They were debt-bonded workers who performed mandatory agricultural labor for commoners.","c":false,"fb":"Misconception: M-maginoo-peasant-labor. Reverses social hierarchy; dependents worked for nobility."},{"t":"They were the ruling class who held political power, owned land, and were exempt from manual labor.","c":true,"fb":"Correctly describes the political, economic, and social status of the Maginoo."},{"t":"They were foreign traders restricted from owning land or engaging in barangay governance.","c":false,"fb":"Foreign traders were external actors, whereas Maginoo were native rulers."},{"t":"They were landless warriors obligated to pay annual tribute to the Alipin class.","c":false,"fb":"Misconception: M-maginoo-peasant-labor. Inverts social roles and obligations."}]},{"cat":"01","type":"scenario","stem":"What colonial social class did these Maginoo families become part of under Spanish rule?","context":"Following Spanish colonization, descendants of pre-colonial datus and rajahs maintained local social prestige and were integrated into the colonial administration as local elites.","options":[{"t":"Aliping Namamahay","c":false,"fb":"Namamahay were pre-colonial household-owning dependents."},{"t":"Principalia","c":true,"fb":"Maginoo nobility were integrated into the Principalia elite during colonial rule."},{"t":"Babaylan","c":false,"fb":"Babaylan were indigenous spiritual shamans."},{"t":"Encomienda","c":false,"fb":"Encomienda was a land and tribute collection system, not a social class of people."}]},{"cat":"01","type":"multi","stem":"Which of the following statements regarding the pre-colonial Maginoo class are correct? Select the TWO correct statements.","options":[{"t":"The class included ruling figures such as datus, rajahs, sultans, and their families.","c":true,"fb":"Accurately lists the nobility titles belonging to the Maginoo class."},{"t":"Members of the Maginoo class were required to perform daily manual labor in communal fields.","c":false,"fb":"Misconception: M-maginoo-peasant-labor. Maginoo were explicitly exempt from manual labor."},{"t":"Their governance systems were influenced by cultural connections with Indian and Malay cultures.","c":true,"fb":"Handout explicitly notes Indian and Malay cultural influences on Maginoo governance."},{"t":"Spanish colonization completely erased all Maginoo family lineages within the first year.","c":false,"fb":"Misconception: M-maginoo-extinction-myth. Maginoo lineages survived and formed the Principalia."},{"t":"Maginoo status was restricted exclusively to foreign Spanish administrators.","c":false,"fb":"Maginoo was an indigenous pre-colonial nobility class."}]},{"cat":"01","type":"mcq","stem":"What role and status did the Timawa hold in the pre-colonial social structure?","options":[{"t":"They were noble rulers who exercised absolute political power over datus.","c":false,"fb":"Ruling nobility were Maginoo; Timawa were free commoners below Maginoo."},{"t":"They were free commoners who could own land, engage in trade, and serve as warriors.","c":true,"fb":"Accurately defines the rights, economic activities, and warrior status of Timawa."},{"t":"They were debt-bonded dependents restricted from participating in community decisions.","c":false,"fb":"Misconception: M-timawa-debt-bonded. Debt-bonded workers were Alipin, not free Timawa."},{"t":"They were foreign captives forced into mandatory domestic servitude.","c":false,"fb":"Captives in domestic servitude were Aliping Sagigilid."}]},{"cat":"01","type":"scenario","stem":"To which social class did this villager belong?","context":"A pre-colonial villager owns a plot of land, operates a small trading vessel, and accompanies the local datu on military campaigns, receiving a portion of captured war spoils.","options":[{"t":"Aliping Sagigilid","c":false,"fb":"Sagigilid lived with masters and lacked independent trading vessels or property."},{"t":"Timawa","c":true,"fb":"Describes a free commoner engaging in trade, landowning, and warrior duty with war spoils."},{"t":"Maginoo","c":false,"fb":"While Maginoo led campaigns, general commoner warriors with land were Timawa."},{"t":"Babaylan","c":false,"fb":"Babaylan were spiritual shamans, not regular warrior-commoners."}]},{"cat":"01","type":"multi","stem":"Which of the following rights and responsibilities applied to the Timawa class? Select the TWO correct statements.","options":[{"t":"They possessed social mobility and could potentially rise to Maginoo status.","c":true,"fb":"Handout explicitly states social mobility allowed Timawa to achieve Maginoo status."},{"t":"They were legally classified as property and could be sold at local markets.","c":false,"fb":"Misconception: M-timawa-debt-bonded. Timawa were free commoners and could not be sold."},{"t":"As warriors, they served the datu during warfare and shared in war spoils.","c":true,"fb":"Accurately describes the military obligation and war spoil rights of Timawa."},{"t":"They were strictly prohibited from owning land or engaging in agriculture.","c":false,"fb":"Timawa actively owned land and worked in farming, fishing, and trade."},{"t":"They were entirely exempt from participating in barangay community decisions.","c":false,"fb":"Timawa had the right to participate in community decisions."}]},{"cat":"01","type":"mcq","stem":"What major historical shift was introduced by the arrival of Islam in Mindanao in the 14th century?","options":[{"t":"The total elimination of all maritime trade routes with China and India","c":false,"fb":"Islamic introduction expanded regional trade rather than eliminating it."},{"t":"The introduction of monotheism and organized political structures like sultanates","c":true,"fb":"Accurately identifies 14th-century monotheism and sultanate governance."},{"t":"The establishment of the first Spanish encomienda administrative systems","c":false,"fb":"Misconception: M-islam-date-error. Encomiendas were Spanish colonial institutions from the 16th century."},{"t":"The replacement of Baybayin script with the Latin alphabet across Luzon","c":false,"fb":"Misconception: M-islam-luzon-arrival. Latin alphabet was introduced by Spaniards, not 14th-century Islam in Mindanao."}]},{"cat":"01","type":"scenario","stem":"What historical development is illustrated by this transformation?","context":"In 14th-century Mindanao, a coastal polity adopts formal Islamic legal codes and establishes a centralized governance system headed by a sultan to manage regional trade and alliances.","options":[{"t":"The arrival of Islam and the development of organized sultanate political structures","c":true,"fb":"Illustrates how 14th-century Islam introduced formal law and sultanate governance."},{"t":"The implementation of Spanish municipal laws under the Principalia","c":false,"fb":"Misconception: M-islam-date-error. Describes 16th/17th-century Spanish colonial administration."},{"t":"The creation of the Laguna Copperplate Inscription under Kawi legal tradition","c":false,"fb":"The LCI is a 900 CE document associated with Luzon/Java, not 14th-century Mindanao sultanates."},{"t":"The decline of maritime trade along the Maritime Jade Road","c":false,"fb":"The Jade Road declined centuries earlier (c. 1000 CE)."}]},{"cat":"01","type":"multi","stem":"Which of the following impact statements regarding the arrival of Islam in Mindanao are accurate? Select the TWO correct statements.","options":[{"t":"It introduced monotheism to the religious landscape of early Philippines.","c":true,"fb":"Islam introduced monotheistic worship alongside indigenous animism."},{"t":"It occurred during the 14th century, prior to European contact.","c":true,"fb":"Handout explicitly places the arrival of Islam in Mindanao in the 14th Century."},{"t":"It prevented early communities from engaging in formal legal or governance systems.","c":false,"fb":"Misconception: M-islam-no-governance. Islam introduced formal legal and governance systems."},{"t":"It was brought to Luzon in 1593 through the publication of the Doctrina Christiana.","c":false,"fb":"Misconception: M-islam-luzon-arrival. The Doctrina Christiana was a Catholic catechism, not Islamic."},{"t":"It restricted political leadership exclusively to Spanish encomenderos.","c":false,"fb":"Misconception: M-islam-date-error. Sultanates were indigenous Islamic political structures."}]},{"cat":"01","type":"mcq","stem":"What is the primary method historians use to study past human events and affairs?","options":[{"t":"Interpreting available evidence and records","c":true,"fb":"History relies directly on analyzing available evidence to reconstruct the past."},{"t":"Relying exclusively on modern oral folklore","c":false,"fb":"Assumes modern oral folklore is the sole evidence used by historians."},{"t":"Generating speculative narratives of events","c":false,"fb":"Confuses evidence-based historical analysis with unverified speculation."},{"t":"Memorizing unverified dates and royal lineages","c":false,"fb":"Reduces historical inquiry to rote memorization without evidence appraisal."}]},{"cat":"01","type":"mcq","stem":"According to the foundational definition of Philippine history, what time span is covered by its recorded events?","options":[{"t":"From pre-colonial times to the present","c":true,"fb":"Philippine history covers all recorded events from pre-colonial societies to today."},{"t":"Exclusively from the 1896 Revolution onward","c":false,"fb":"Excludes the vast pre-colonial and Spanish colonial eras documented in the course."},{"t":"Strictly from the arrival of Magellan in 1521","c":false,"fb":"Overlooks pre-colonial recorded history established by early artifacts and records."},{"t":"Only the post-World War II independence period","c":false,"fb":"Restricts history to contemporary decades, ignoring foundational periods."}]},{"cat":"01","type":"multi","stem":"Which of the following are explicitly identified as core reasons to study history? Select the TWO correct statements.","options":[{"t":"Understanding change over time","c":true,"fb":"It helps explain how and why significant social and political changes occur."},{"t":"Predicting exact future political dates","c":false,"fb":"History provides lessons and patterns, not precise predictive forecasting."},{"t":"Developing critical thinking skills","c":true,"fb":"Evaluating evidence and sources strengthens critical analytical abilities."},{"t":"Establishing a single uniform global culture","c":false,"fb":"Studying history fosters cultural appreciation of diversity, not uniformity."},{"t":"Eliminating the need for primary source inquiry","c":false,"fb":"Historical understanding relies upon investigating primary sources, not removing them."}]},{"cat":"01","type":"mcq","stem":"How does studying history under the objective of \"Understanding Change\" assist modern citizens?","options":[{"t":"It explains the factors causing wars, reforms, and revolutions","c":true,"fb":"It helps analyze how and why major social and political transformations occur."},{"t":"It guarantees that societal crises will never happen again","c":false,"fb":"Assumes historical awareness automatically prevents future crises."},{"t":"It proves that human societies remain fundamentally static","c":false,"fb":"Misunderstands the concept of change as an assertion of permanence."},{"t":"It replaces the need to analyze economic and political factors","c":false,"fb":"Dismisses the causal factors that drive historical transitions."}]},{"cat":"01","type":"mcq","stem":"Which outcome exemplifies the \"Learning from the Past\" rationale for studying history?","options":[{"t":"Evaluating past achievements and mistakes to guide current decisions","c":true,"fb":"Analyzing historical precedents informs present-day problem-solving."},{"t":"Repeating past governance policies without modifying any procedures","c":false,"fb":"Treats history as a script for rigid replication rather than critical learning."},{"t":"Disregarding early pre-colonial customs in modern statecraft","c":false,"fb":"Ignores the value of historical insights in contemporary contexts."},{"t":"Focusing exclusively on victories while deleting past policy failures","c":false,"fb":"Erases mistakes, preventing genuine learning and balanced evaluation."}]},{"cat":"01","type":"mcq","stem":"Why does analyzing historical events cultivate \"Critical Thinking\"?","options":[{"t":"It requires students to evaluate sources and interpret evidence","c":true,"fb":"Assessing provenance, context, and bias sharpens critical analysis."},{"t":"It trains learners to accept every written account as absolute truth","c":false,"fb":"Contradicts critical thinking by promoting unquestioning acceptance."},{"t":"It prioritizes emotional reactions over documented material records","c":false,"fb":"Disregards empirical evidence in favor of unverified sentiment."},{"t":"It eliminates differing interpretations of complex social developments","c":false,"fb":"Assumes historical evidence produces only singular, uncontested answers."}]},{"cat":"01","type":"mcq","stem":"What defines a historical source as a primary source?","options":[{"t":"It is a first-hand account created during the period under study","c":true,"fb":"Primary sources originate directly from the historical period in question."},{"t":"It is an academic textbook summarizing centuries of historical data","c":false,"fb":"M-SEC-ANACHRONISM: Confuses secondary analytical summaries with first-hand sources."},{"t":"It is a modern encyclopedia entry written by professional researchers","c":false,"fb":"M-SEC-ANACHRONISM: Treats retrospective research syntheses as original accounts."},{"t":"It is an interpretive commentary written long after the event occurred","c":false,"fb":"M-SEC-ANACHRONISM: Mistakes post-event commentary for contemporary evidence."}]},{"cat":"01","type":"scenario","stem":"Which item functions as a primary source for the researcher's investigation?","context":"A researcher examining pre-colonial trade in Luzon discovers three items in a library archive: a modern 2024 university textbook chapter on maritime commerce, an excerpt from a 2010 journal article reviewing ancient pottery, and an original 10th-century inscribed metal sheet recovered from a riverbed.","options":[{"t":"The original 10th-century inscribed metal sheet","c":true,"fb":"The physical inscribed sheet is a first-hand artifact from the pre-colonial era."},{"t":"The 2024 university textbook chapter on commerce","c":false,"fb":"M-SEC-ANACHRONISM: Identifies a modern secondary textbook as an original artifact."},{"t":"The 2010 scholarly journal article review","c":false,"fb":"M-SEC-ANACHRONISM: Confuses a recent secondary review paper with historical evidence."},{"t":"All three items because they discuss the same pre-colonial topic","c":false,"fb":"M-SEC-ANACHRONISM: Assumes subject matter determines source type rather than time of origin."}]},{"cat":"01","type":"mcq","stem":"Which of the following materials CANNOT be classified as a primary source?","options":[{"t":"A 2022 published history monograph reviewing pre-colonial barter","c":true,"fb":"Modern retrospective analyses written long after the period are secondary sources."},{"t":"An original handwritten diary kept by an 18th-century local clerk","c":false,"fb":"M-MEDIA-LIMIT: Overlooks that personal contemporary writings are primary records."},{"t":"An official peace treaty signed by two pre-colonial village chiefs","c":false,"fb":"M-MEDIA-LIMIT: Fails to recognize that signed contemporary legal pacts are primary documents."},{"t":"A carved wooden tool excavated from an ancient settlement site","c":false,"fb":"M-MEDIA-LIMIT: Disregards archaeological physical artifacts as primary evidence."}]},{"cat":"01","type":"multi","stem":"Which of the following are explicitly recognized in the course handout as example types of primary sources? Select the TWO correct statements.","options":[{"t":"Letters and Diaries","c":true,"fb":"Personal writings provide direct insight into contemporary individual thoughts."},{"t":"Modern high school history textbooks","c":false,"fb":"M-SEC-ANACHRONISM: Classifies secondary pedagogical summaries as primary source types."},{"t":"Photographs and Artifacts","c":true,"fb":"Visual and physical objects provide material evidence of daily culture and life."},{"t":"Retrospective encyclopedic bibliographies","c":false,"fb":"M-SEC-ANACHRONISM: Confuses modern research indices with contemporary first-hand data."},{"t":"Peer-reviewed historiographical essays","c":false,"fb":"M-SEC-ANACHRONISM: Mistakes modern secondary journal essays for first-hand records."}]},{"cat":"01","type":"mcq","stem":"A historian wants to examine real-time public opinion and events as they unfolded during a historical crisis. Which primary source type is best suited for this purpose?","options":[{"t":"Newspaper articles published during that era","c":true,"fb":"Contemporary newspaper reports capture public reactions and events as they unfolded."},{"t":"Official legislative statutes enacted decades later","c":false,"fb":"M-TYPE-CONFUSION: Confuses immediate journalistic reporting with later legal codifications."},{"t":"Private financial ledgers of an uninvolved foreign firm","c":false,"fb":"M-TYPE-CONFUSION: Selects irrelevant private accounting records over public media reports."},{"t":"Personal diaries written secretly and never shared with the public","c":false,"fb":"M-TYPE-CONFUSION: Confuses private personal reflections with published public sentiment."}]},{"cat":"01","type":"fitb","stem":"Discovered in 1989, the oldest known written document found in the Philippines dates back to the year ____.","subtype":"year","answer":["900 CE","900 AD","900"],"caseSensitive":false,"fb":"The Laguna Copperplate Inscription dates precisely to 900 CE."},{"cat":"01","type":"mcq","stem":"In which script was the Laguna Copperplate Inscription written?","options":[{"t":"Kawi script","c":true,"fb":"The Laguna Copperplate Inscription was inscribed in early Kawi script."},{"t":"Baybayin script","c":false,"fb":"M-LCI-SCRIPT-BAYBAYIN: Confuses pre-colonial Kawi script with later Baybayin characters."},{"t":"Latin script","c":false,"fb":"M-LCI-SCRIPT-BAYBAYIN: Assumes Western European alphabetic writing was used in 900 CE."},{"t":"Arabic script","c":false,"fb":"M-LCI-SCRIPT-BAYBAYIN: Mistakenly attributes 14th-century Islamic script to the 900 CE inscription."}]},{"cat":"01","type":"scenario","stem":"What primary legal and economic transaction does this inscription record?","context":"An epigrapher translates a 900 CE copper document discovered near Laguna de Bay. The text explicitly mentions clearing the gold debt of an individual named Namwaran and references political centers such as Tondo, Dewata in Mindanao, and Medang in Java.","options":[{"t":"The formal forgiveness of Namwaran's debt","c":true,"fb":"The text is an official legal record clearing Namwaran and his descendants of debt."},{"t":"The establishment of an exclusive Catholic diocese","c":false,"fb":"M-LCI-SUBJECT-RELIGION: Anachronistically imposes Spanish colonial religious institutions onto 900 CE."},{"t":"A military declaration of war against Medang","c":false,"fb":"M-LCI-SUBJECT-RELIGION: Interprets a civil debt exoneration document as a military conquest decree."},{"t":"The coronation of a Spanish governor-general","c":false,"fb":"M-LCI-SUBJECT-RELIGION: Confuses pre-colonial Southeast Asian statecraft with Spanish colonial rule."}]},{"cat":"01","type":"multi","stem":"Which conclusions about pre-colonial Philippine society are directly confirmed by the Laguna Copperplate Inscription? Select the THREE correct statements.","options":[{"t":"Early Filipinos possessed an organized legal system","c":true,"fb":"The formal exoneration of debt demonstrates established legal mechanisms."},{"t":"Early communities maintained regional literacy and written records","c":true,"fb":"The sophisticated Kawi inscription confirms literacy and record-keeping."},{"t":"Early Filipinos maintained political and trade ties with Southeast Asia","c":true,"fb":"Mentions of Medang and Dewata prove active regional connections."},{"t":"Pre-colonial governance was unified under a single nationwide king","c":false,"fb":"M-LCI-PRIMITIVE-ISOLATION: Assumes a centralized monarchy rather than regional polities."},{"t":"Pre-colonial Filipinos had no established concept of debt or currency","c":false,"fb":"M-LCI-PRIMITIVE-ISOLATION: Denies the economic sophistication proved by the debt record."}]},{"cat":"01","type":"mcq","stem":"Why is the Laguna Copperplate Inscription considered a landmark discovery in Philippine historiography?","options":[{"t":"It challenges earlier assumptions that pre-colonial Filipinos lacked complex governance","c":true,"fb":"It proves pre-colonial literacy, legal systems, and organized commerce."},{"t":"It proves that Spanish friars introduced the earliest writing systems in Luzon","c":false,"fb":"M-LCI-PRIMITIVE-ISOLATION: Attributes early literacy to Spanish colonial missionaries."},{"t":"It established the first Spanish colonial settlement in Mindanao","c":false,"fb":"M-LCI-PRIMITIVE-ISOLATION: Confuses pre-colonial artifacts with colonial conquest events."},{"t":"It marks the end of indigenous seafaring trade with neighboring Asian polities","c":false,"fb":"M-LCI-PRIMITIVE-ISOLATION: Misinterprets evidence of trade ties as an end to maritime commerce."}]},{"cat":"01","type":"fitb","stem":"Created around 1590, the Boxer Codex manuscript is notable for containing over ____ illustrations depicting Filipino and Southeast Asian cultures.","subtype":"term","answer":["75","75+","seventy-five","seventy five"],"caseSensitive":false,"fb":"The Boxer Codex contains over 75 colored illustrations of clothing, weapons, and society."},{"cat":"01","type":"mcq","stem":"How does the Boxer Codex (c. 1590) challenge colonial perspectives regarding pre-colonial Filipinos?","options":[{"t":"It demonstrates a well-organized society with distinct social hierarchies and rich attire","c":true,"fb":"Visual and written records show sophisticated social organization and material culture."},{"t":"It proves that early Filipinos had no social stratification before Spanish arrival","c":false,"fb":"Denies the complex social hierarchy and ranking documented throughout the manuscript."},{"t":"It documents that pre-colonial indigenous people did not use weapons or craft textiles","c":false,"fb":"Contradicts the text's detailed depictions of ornate indigenous weaponry and clothing."},{"t":"It shows that pre-colonial communities completely lacked contact with Southeast Asia","c":false,"fb":"Ignores the codex's extensive coverage of regional Southeast Asian cultural connections."}]},{"cat":"01","type":"fitb","stem":"Printed in the year ____, the Doctrina Christiana holds the distinction of being the first book ever printed in the Philippines.","subtype":"year","answer":["1593"],"caseSensitive":false,"fb":"The Doctrina Christiana was printed in 1593 using wooden blocks."},{"cat":"01","type":"mcq","stem":"Which two writing scripts were used in the printing of the 1593 Doctrina Christiana?","options":[{"t":"Spanish (Latin alphabet) and Baybayin script","c":true,"fb":"The bilingual missionary text used both Spanish and indigenous Baybayin script."},{"t":"Kawi script and Arabic script","c":false,"fb":"M-DC-SCRIPT-KAWI: Confuses earlier Kawi and southern Arabic scripts with Baybayin."},{"t":"Latin alphabet and Kawi script","c":false,"fb":"M-DC-SCRIPT-KAWI: Mistakenly substitutes Kawi for the Baybayin script used in the book."},{"t":"Sanskrit and Chinese calligraphy","c":false,"fb":"M-DC-SCRIPT-KAWI: Proposes foreign Asian scripts not used in the 1593 catechism."}]},{"cat":"01","type":"multi","stem":"Which of the following are core Catholic prayers included in the bilingual Doctrina Christiana? Select the TWO correct statements.","options":[{"t":"Ama Namin (The Lord's Prayer)","c":true,"fb":"The Lord's Prayer was printed in both Spanish and Baybayin."},{"t":"The Islamic Shahada","c":false,"fb":"M-DC-SECULAR-LAW: Confuses Catholic catechism prayers with Islamic declarations."},{"t":"Aba Ginoo Maria (Hail Mary)","c":true,"fb":"The Hail Mary was one of the core prayers included for religious instruction."},{"t":"The Code of Kalantiaw","c":false,"fb":"M-DC-SECULAR-LAW: Introduces a legal code rather than Catholic instructional prayers."},{"t":"Namwaran's Debt Exoneration Decree","c":false,"fb":"M-DC-SECULAR-LAW: Confuses the content of the LCI with the Doctrina Christiana."}]},{"cat":"01","type":"mcq","stem":"What do the letters in the source analysis acronym CRISP stand for?","options":[{"t":"Check the Source, Recognize the Audience, Investigate the Content, Situate in History, Point out the Significance","c":true,"fb":"These constitute the five standard steps of the CRISP framework."},{"t":"Compare the Script, Review the Author, Identify the Period, Summarize the Text, Publish the Findings","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Replaces standardized analytical steps with invented research terms."},{"t":"Catalog the Story, Reconstruct the Artifact, Inspect the Grammar, Separate the Facts, Preserve the Document","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Substitutes preservation tasks for critical analysis components."},{"t":"Cite the Reference, Read the Annotation, Index the Chronology, Scrutinize the Language, Proofread the Translation","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses citation and editorial proofreading with historical evaluation."}]},{"cat":"01","type":"multi","stem":"Which of the following are valid components of the CRISP primary-source analysis framework? Select the THREE correct statements.","options":[{"t":"Check the Source","c":true,"fb":"Involves verifying who created the source, when, and why."},{"t":"Investigate the Content","c":true,"fb":"Involves analyzing internal claims, perspective, and potential bias."},{"t":"Point out the Significance","c":true,"fb":"Involves evaluating the historical importance and broader impact of the source."},{"t":"Conceal the Author's Biases","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Opposes critical investigation by advocating bias concealment."},{"t":"Memorize the Document Word-for-Word","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Replaces analytical evaluation with mechanical memorization."}]},{"cat":"01","type":"scenario","stem":"Which analytical model is the student demonstrating?","context":"A student analyzes an 1898 newspaper article reporting on the declaration of Philippine independence. To critically appraise the document, the student systematically examines its author's background, identifies the intended readers, dissects the factual arguments for bias, places the article within the Philippine-American geopolitical era, and assesses its impact on national identity.","options":[{"t":"The CRISP framework","c":true,"fb":"The student systematically applies all five steps of the CRISP analysis model."},{"t":"The Encomienda system","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses an economic-administrative labor system with a method of analysis."},{"t":"The Animist ritual cycle","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Mistakenly selects a religious ceremonial practice."},{"t":"The Principalia governance charter","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses a colonial social class structure with source evaluation."}]},{"cat":"01","type":"mcq","stem":"What is the specific focus of the \"Check the Source\" step in the CRISP framework?","options":[{"t":"Investigating who created the source, when, why, and in what context","c":true,"fb":"\"Check the Source\" examines creator provenance, timing, and reliability."},{"t":"Counting the exact number of words and grammatical errors in the text","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Focuses on superficial syntax rather than source provenance."},{"t":"Outlining the modern economic relevance of the document in 2026","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Anachronistically looks at modern utility instead of origin."},{"t":"Determining how the document can be translated into foreign languages","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Substitutes linguistic translation for author and context verification."}]},{"cat":"01","type":"scenario","stem":"Which step of the CRISP analysis framework is the historian executing?","context":"While reviewing an 1896 handwritten diary, a historian asks: \"Who penned this entry, on what exact date was it written, what were the author's motives, and under what circumstances was it produced?\"","options":[{"t":"Check the Source","c":true,"fb":"Inquiring about the creator, date, motive, and context is the core of \"Check the Source.\""},{"t":"Recognize the Audience","c":false,"fb":"M-CRISP-AUDIENCE-VS-SOURCE: Confuses author identity and origin with the intended recipient."},{"t":"Situate in History","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Confuses checking source authorship with broad narrative context."},{"t":"Point out the Significance","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Confuses verifying creator background with evaluating historical impact."}]},{"cat":"01","type":"mcq","stem":"When applying the \"Check the Source\" step, which inquiry would be INCORRECT or irrelevant to that specific stage?","options":[{"t":"\"How does this document alter modern 21st-century environmental policy?\"","c":true,"fb":"Investigating modern policy impact belongs to modern commentary, not source origin verification."},{"t":"\"Who was the author or creator of this document?\"","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Valid inquiry directly assessing authorial provenance."},{"t":"\"In what year and geographical location was this source produced?\"","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Valid inquiry establishing temporal and geographical origin."},{"t":"\"What underlying reason prompted the creator to record this account?\"","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Valid inquiry analyzing the creator's purpose and context."}]},{"cat":"01","type":"mcq","stem":"In the CRISP framework, what does \"Recognize the Audience\" require a researcher to determine?","options":[{"t":"The specific group or individuals for whom the source was created","c":true,"fb":"Identifies the intended readership to understand framing and tone."},{"t":"The modern publisher who reprinted the text in the current century","c":false,"fb":"M-CRISP-AUDIENCE-VS-SOURCE: Confuses current commercial re-publishers with historical recipients."},{"t":"The geological age of the materials upon which the text was inscribed","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Focuses on physical material dating rather than intended readers."},{"t":"The personal biography of the printer who carved the wooden blocks","c":false,"fb":"M-CRISP-AUDIENCE-VS-SOURCE: Confuses production craftsmen with the target audience."}]},{"cat":"01","type":"scenario","stem":"Which CRISP step did the student perform?","context":"A student reads a 1593 Spanish missionary tract and notes: \"This booklet was specifically addressed to newly converted native Filipinos and incoming Spanish friars to ensure standardized religious education.\"","options":[{"t":"Recognize the Audience","c":true,"fb":"Determining the intended recipients and users evaluates the audience."},{"t":"Investigate the Content","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Confuses identifying intended readers with dissecting text arguments."},{"t":"Situate in History","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Confuses audience identification with placing events in chronology."},{"t":"Point out the Significance","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Confuses target recipient analysis with overall historical significance."}]},{"cat":"01","type":"mcq","stem":"What is the primary objective when conducting the \"Investigate the Content\" step of the CRISP framework?","options":[{"t":"Analyzing what the text states and detecting underlying bias or perspective","c":true,"fb":"Scrutinizes arguments, factual claims, and personal viewpoints."},{"t":"Confirming the physical chemistry of the ink used on the document","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Focuses on material chemistry rather than textual substance."},{"t":"Checking whether the original author had surviving descendants","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Diverts attention to lineage rather than textual analysis."},{"t":"Identifying which modern museum currently owns the physical artifact","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses modern artifact custody with textual interpretation."}]},{"cat":"01","type":"scenario","stem":"Which step of the CRISP framework is the researcher carrying out?","context":"While analyzing a Spanish colonial dispatch regarding local unrest, a researcher highlights the writer's derogatory descriptions of indigenous leaders and notes how the report exaggerates Spanish military control to hide administrative failures.","options":[{"t":"Investigate the Content","c":true,"fb":"Scrutinizing the text's detailed claims to uncover bias and distortion represents this step."},{"t":"Recognize the Audience","c":false,"fb":"M-CRISP-AUDIENCE-VS-SOURCE: Confuses text bias analysis with identifying who received the report."},{"t":"Check the Source","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses analyzing textual substance with checking author credentials."},{"t":"Situate in History","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Confuses internal textual deconstruction with broad era contextualization."}]},{"cat":"01","type":"mcq","stem":"How does a historian execute the \"Situate in History\" step in the CRISP framework?","options":[{"t":"By connecting the primary source to the broader historical context and narrative of its era","c":true,"fb":"Places the document within the wider historical environment and timeline."},{"t":"By proving that the primary source has no connection to any other historical events","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Isolates the document, opposing the goal of contextualization."},{"t":"By deleting all references to foreign contacts and regional trade routes","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Erases external historical ties instead of situating the source."},{"t":"By evaluating only the grammatical correctness of the sentences","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Replaces historical contextualization with grammatical editing."}]},{"cat":"01","type":"scenario","stem":"Which CRISP analysis step is highlighted in this researcher's evaluation?","context":"A researcher examining the Boxer Codex (c. 1590) links its descriptions of maritime trade, social hierarchies, and metallurgy to the wider 16th-century Southeast Asian commerce networks before Spanish colonial consolidation took full effect.","options":[{"t":"Situate in History","c":true,"fb":"Connecting the manuscript to broader regional trade and historical eras exemplifies situating."},{"t":"Check the Source","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses linking to historical context with checking document provenance."},{"t":"Recognize the Audience","c":false,"fb":"M-CRISP-AUDIENCE-VS-SOURCE: Confuses broader historical synthesis with identifying target readers."},{"t":"Investigate the Content","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Confuses broad contextual integration with internal textual analysis."}]},{"cat":"01","type":"mcq","stem":"What is the core question addressed during the \"Point out the Significance\" step of the CRISP framework?","options":[{"t":"Why is this source important and what does it tell us about the people and era?","c":true,"fb":"Evaluates historical impact, meaning, and broader implications."},{"t":"What was the manufacturing cost of the paper or copper sheet?","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Confuses material manufacturing expense with historical impact."},{"t":"How many copies of the text were destroyed in wartime?","c":false,"fb":"M-CRISP-SITUATE-VS-SIGNIFICANCE: Focuses on physical loss statistics rather than significance."},{"t":"Which modern languages can this text be translated into?","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Substitutes translation options for historical value assessment."}]},{"cat":"01","type":"scenario","stem":"Which CRISP step does this conclusion represent?","context":"At the end of an analysis of the Laguna Copperplate Inscription, an essay concludes: \"This artifact is profoundly important because it conclusively refutes the claim that pre-colonial Filipinos lacked written legal frameworks and established economic systems.\"","options":[{"t":"Point out the Significance","c":true,"fb":"Explaining why the artifact matters and its transformative impact reflects this step."},{"t":"Check the Source","c":false,"fb":"M-CRISP-SOURCE-VS-CONTENT: Confuses concluding significance with initial creator verification."},{"t":"Recognize the Audience","c":false,"fb":"M-CRISP-AUDIENCE-VS-SOURCE: Confuses historical importance with identifying original readers."},{"t":"Investigate the Content","c":false,"fb":"M-CRISP-CONTENT-VS-SITUATE: Confuses overall impact with line-by-line textual analysis."}]},{"cat":"01","type":"fitb","stem":"Pre-colonial Filipino societies were organized into small, independent settlements known as ____, each led by a datu.","subtype":"term","answer":["barangay","barangays","balangay","balangays"],"caseSensitive":false,"fb":"Pre-colonial communities were organized into independent settlements called barangays."},{"cat":"01","type":"mcq","stem":"How were pre-colonial Philippine barangays politically organized and governed?","options":[{"t":"As independent settlements led by a datu through alliances, governance, and warfare","c":true,"fb":"Barangays were autonomous communities led by a local datu."},{"t":"As provinces governed by a single centralized emperor residing in Manila","c":false,"fb":"M-SOC-CENTRALIZED-EMPIRE: Anachronistically imposes a centralized empire onto independent barangays."},{"t":"As military garrisons controlled entirely by foreign European governors","c":false,"fb":"M-SOC-CENTRALIZED-EMPIRE: Confuses pre-colonial leadership with colonial military command."},{"t":"As leaderless communal societies with no political authority or social structure","c":false,"fb":"M-SOC-CENTRALIZED-EMPIRE: Denies the presence of organized datu leadership and governance."}]},{"cat":"01","type":"multi","stem":"Which of the following statements accurately describe political leadership in pre-colonial barangays? Select the TWO correct statements.","options":[{"t":"Barangays operated as small, autonomous communities","c":true,"fb":"Pre-colonial barangays were independent social and political units."},{"t":"Datus governed through leadership, alliances, and warfare","c":true,"fb":"Datus maintained authority through governance, diplomacy, and military strength."},{"t":"Datus were subject to a supreme national legislative senate","c":false,"fb":"M-SOC-CENTRALIZED-EMPIRE: Projects modern democratic institutions onto pre-colonial barangays."},{"t":"Barangays were prohibited from engaging in warfare or alliances","c":false,"fb":"M-SOC-CENTRALIZED-EMPIRE: Contradicts the reality of inter-barangay alliances and conflict."},{"t":"Datus were selected by Spanish colonial royal appointment","c":false,"fb":"M-SOC-CENTRALIZED-EMPIRE: Confuses pre-colonial authority with Spanish colonial appointments."}]},{"cat":"01","type":"mcq","stem":"Which social class held the highest status and ruling authority in the pre-colonial Philippines?","options":[{"t":"Maginoo","c":true,"fb":"The Maginoo constituted the ruling nobility, including datus and their families."},{"t":"Timawa","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Timawa were the free commoner class, ranked below Maginoo."},{"t":"Aliping Namamahay","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Aliping Namamahay were dependents, not the ruling class."},{"t":"Aliping Sagigilid","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Aliping Sagigilid were household dependents with the fewest rights."}]},{"cat":"01","type":"multi","stem":"Which privileges, roles, and characteristics applied to the Maginoo class in pre-colonial society? Select the THREE correct statements.","options":[{"t":"Exemption from manual labor","c":true,"fb":"The ruling noble class was exempt from performing manual field labor."},{"t":"Ownership of land and exercise of political power","c":true,"fb":"Maginoo held political, military, and landholding authority in the barangay."},{"t":"Formation of the Principalia class under Spanish colonization","c":true,"fb":"After colonization, Maginoo families were integrated into the local Principalia elite."},{"t":"Obligation to serve as debt-bonded household servants","c":false,"fb":"M-SOC-MAGINOO-LABOR: Confuses the ruling nobility with the dependent Alipin class."},{"t":"Complete exclusion from wearing fine clothing or gold ornaments","c":false,"fb":"M-SOC-MAGINOO-LABOR: Contradicts the historical record of Maginoo wearing fine attire."}]},{"cat":"01","type":"scenario","stem":"To which pre-colonial social class does this leader belong?","context":"In a pre-colonial coastal settlement, an elite leader named Rajah Matanda governs the community, enters into trade pacts with foreign merchants, possesses ancestral lands, is exempt from field labor, and claims lineage influenced by Indian and Malay traditions.","options":[{"t":"Maginoo","c":true,"fb":"Datus, rajahs, and their families made up the ruling Maginoo nobility."},{"t":"Timawa","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Timawa were free commoners, not ruling rajahs with datuship authority."},{"t":"Aliping Namamahay","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Confuses the highest ruling elite with independent-dwelling dependents."},{"t":"Aliping Sagigilid","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Confuses the ruling nobility with household debt-bonded servants."}]},{"cat":"01","type":"mcq","stem":"What was the primary social and military role of the Timawa class in pre-colonial Philippine society?","options":[{"t":"Free commoners who owned land, engaged in trade/farming, and served as warriors sharing war spoils","c":true,"fb":"Timawa were free individuals who fought for the datu and shared in war spoils."},{"t":"Debt-bonded servants who were forbidden from owning land or engaging in business","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Confuses free commoners with bonded Alipin servants."},{"t":"Ruling noble datus who were completely exempt from supporting the community in warfare","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Confuses Timawa commoners with the ruling Maginoo nobility."},{"t":"Enslaved captives who had no social mobility and could be sold at any time","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Mischaracterizes freemen as property-less chattel slaves."}]},{"cat":"01","type":"multi","stem":"Which of the following rights and roles characterized the Timawa class in pre-colonial society? Select the TWO correct statements.","options":[{"t":"They had the social mobility to rise to Maginoo status","c":true,"fb":"Timawa could elevate their social standing through wealth, alliances, or bravery."},{"t":"They could own private land and operate businesses","c":true,"fb":"Timawa held property rights and actively conducted farming, fishing, and trade."},{"t":"They were legally bonded to the datu's house and could be sold","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Confuses freemen rights with bonded Aliping Sagigilid status."},{"t":"They were barred from participating in community decisions","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Denies Timawa civic participation in barangay affairs."},{"t":"They were entirely exempt from participating in military expeditions","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Overlooks their crucial duty as warriors supporting the datu."}]},{"cat":"01","type":"scenario","stem":"Which social rank does this individual hold?","context":"A pre-colonial villager cultivates his own land, participates in community consultations, conducts trade with visiting merchants, joins the datu on military campaigns, and receives a designated share of the spoils of war.","options":[{"t":"Timawa","c":true,"fb":"Land ownership, warrior service, war spoils, and trading rights define the Timawa."},{"t":"Aliping Sagigilid","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Sagigilid lived in the master's house with minimal rights."},{"t":"Aliping Namamahay","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Namamahay were debt-bonded workers, not free warrior-commoners."},{"t":"Spanish Encomendero","c":false,"fb":"M-SOC-TIMAWA-NO-PROPERTY: Anachronistically inserts a Spanish colonial trustee."}]},{"cat":"01","type":"mcq","stem":"What was the key distinction between Aliping Namamahay and Aliping Sagigilid in pre-colonial society?","options":[{"t":"Aliping Namamahay lived in their own houses and could not be sold, while Aliping Sagigilid lived with their master","c":true,"fb":"Namamahay lived independently, whereas Sagigilid resided in the master's home."},{"t":"Aliping Namamahay were the ruling nobility, while Aliping Sagigilid were freemen warriors","c":false,"fb":"M-SOC-NAMAMAHAY-SAGIGILID-SWAP: Confuses dependent classes with Maginoo and Timawa ranks."},{"t":"Aliping Sagigilid owned vast tracts of land, while Aliping Namamahay were barred from having families","c":false,"fb":"M-SOC-NAMAMAHAY-SAGIGILID-SWAP: Reverses property rights and invents marriage bans."},{"t":"Aliping Namamahay were permanently enslaved with no rights, while Aliping Sagigilid were Spanish officials","c":false,"fb":"M-SOC-NAMAMAHAY-SAGIGILID-SWAP: Falsely depicts Namamahay as chattel and Sagigilid as colonial officers."}]},{"cat":"01","type":"scenario","stem":"How are Worker A and Worker B correctly classified?","context":"In a pre-colonial village, Worker A lives with his family in an independent home, renders agricultural labor to a master during harvest, and cannot be legally sold. Worker B lives directly inside the master's household, performs daily chores, and has fewer personal rights due to unpaid debt.","options":[{"t":"Worker A is an Aliping Namamahay; Worker B is an Aliping Sagigilid","c":true,"fb":"Worker A demonstrates independent living (Namamahay); Worker B lives in-house (Sagigilid)."},{"t":"Worker A is an Aliping Sagigilid; Worker B is an Aliping Namamahay","c":false,"fb":"M-SOC-NAMAMAHAY-SAGIGILID-SWAP: Directly swaps the definitions and traits of the two Alipin types."},{"t":"Worker A is a Maginoo noble; Worker B is a Timawa freeman","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Confuses dependent laborers with the ruling and freeman classes."},{"t":"Worker A is a Spanish friar; Worker B is an Encomendero","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Introduces Spanish colonial religious and administrative figures."}]},{"cat":"01","type":"mcq","stem":"How could an Alipin in pre-colonial Philippine society transition out of debt bondage?","options":[{"t":"By earning money and paying off debts to buy their freedom","c":true,"fb":"Alipin had the legal right to earn income, pay off obligations, and move up socially."},{"t":"Only by being exiled permanently to a foreign kingdom","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Assumes freedom required foreign banishment rather than debt settlement."},{"t":"By overthrowing the entire barangay system through military rebellion","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Replaces legal debt redemption with violent structural collapse."},{"t":"There was no legal mechanism, as status was unalterable for life","c":false,"fb":"M-SOC-ALIPIN-CHATTEL: Treats pre-colonial debt bondage as a rigid, inescapable lifetime caste."}]},{"cat":"01","type":"multi","stem":"Which of the following were major economic activities practiced by indigenous Filipinos prior to Spanish colonization? Select the THREE correct statements.","options":[{"t":"Agriculture, including cultivating rice, root crops, and fruits","c":true,"fb":"Farming was a staple subsistence and economic activity."},{"t":"Weaving and pottery, producing textiles and ceramic wares","c":true,"fb":"Craftsmanship included ceramic pottery and woven textiles."},{"t":"International trade with China, India, and Southeast Asian polities","c":true,"fb":"Active maritime trade networks connected early Filipinos regionally."},{"t":"Industrial steam-powered railway transportation","c":false,"fb":"Anachronistically introduces 19th-century industrial technology."},{"t":"Operation of large-scale mechanical petroleum refineries","c":false,"fb":"Introduces 20th-century fossil fuel refining into pre-colonial society."}]},{"cat":"01","type":"fitb","stem":"In pre-colonial animist spirituality, rituals, healing ceremonies, and cultural counseling were led by spiritual shamans called ____.","subtype":"term","answer":["babaylan","babaylans","catalonan","catalonans"],"caseSensitive":false,"fb":"Babaylan served as shamans, healers, advisers, and cultural custodians."},{"cat":"01","type":"mcq","stem":"During which century did Islam arrive in Mindanao, introducing monotheism and formal sultanate governance?","options":[{"t":"14th Century","c":true,"fb":"Islam was introduced to Mindanao during the 14th century."},{"t":"16th Century","c":false,"fb":"M-ISLAM-CENTURY-SWAP: Confuses the arrival of Islam with 16th-century Spanish colonization."},{"t":"10th Century","c":false,"fb":"M-ISLAM-CENTURY-SWAP: Confuses Islam's arrival with the era of the 900 CE Laguna Copperplate."},{"t":"19th Century","c":false,"fb":"M-ISLAM-CENTURY-SWAP: Moves the timeline forward to the late Spanish colonial period."}]},{"cat":"01","type":"multi","stem":"What key political and social changes resulted from the introduction of Islam to Mindanao in the 14th century? Select the TWO correct statements.","options":[{"t":"It introduced monotheism into the religious landscape","c":true,"fb":"Islam established monotheistic faith alongside indigenous traditions."},{"t":"It led to the formation of organized sultanates and legal systems","c":true,"fb":"Islamic governance introduced formal legal frameworks and sultanates."},{"t":"It completely eliminated all maritime trade with Asian polities","c":false,"fb":"M-ISLAM-ANIMIST-SYNCRETISM: Falsely claims Islam halted regional trade relations."},{"t":"It forced all southern communities to adopt the Spanish Latin alphabet","c":false,"fb":"M-ISLAM-ANIMIST-SYNCRETISM: Attributes Spanish colonial script policies to Islam."},{"t":"It dissolved all centralized leadership into isolated family units","c":false,"fb":"M-ISLAM-ANIMIST-SYNCRETISM: Contradicts the establishment of organized sultanates."}]},{"cat":"01","type":"scenario","stem":"Which political institution is the historian analyzing?","context":"A historian studies 14th-century political consolidation in southwestern Mindanao and observes the establishment of formal Islamic legal codes, dynastic leadership, and institutionalized diplomatic alliances with neighboring Southeast Asian rulers.","options":[{"t":"The Sultanate system","c":true,"fb":"The introduction of Islam established formal sultanates and structured governance."},{"t":"The Spanish Encomienda","c":false,"fb":"M-ISLAM-ANIMIST-SYNCRETISM: Confuses Islamic governance with Spanish colonial administrative units."},{"t":"The American Commonwealth","c":false,"fb":"M-ISLAM-ANIMIST-SYNCRETISM: Anachronistically cites a 20th-century political system."},{"t":"The Principalia Cabildo","c":false,"fb":"M-ISLAM-ANIMIST-SYNCRETISM: Confuses Islamic statecraft with Spanish municipal councils."}]},{"cat":"01","type":"mcq","stem":"What construction method and capacity characterized the ancient Balangay (Butuan Boat)?","options":[{"t":"Built of hardwood and wooden pegs, carrying up to 50 people","c":true,"fb":"The Balangay was constructed with hardwood planks and wooden pegs for up to 50 passengers."},{"t":"Built of iron plates and steel rivets, carrying up to 500 passengers","c":false,"fb":"M-BALANGAY-METAL-CONSTRUCTION: Anachronistically introduces modern industrial metal shipbuilding."},{"t":"Constructed of hollowed bamboo reeds, carrying a maximum of 2 people","c":false,"fb":"M-BALANGAY-METAL-CONSTRUCTION: Drastically understates the size, craftsmanship, and capacity."},{"t":"Assembled using modern synthetic fiberglass and combustion engines","c":false,"fb":"M-BALANGAY-METAL-CONSTRUCTION: Projects 20th-century synthetic materials into pre-colonial times."}]},{"cat":"01","type":"scenario","stem":"Which cultural artifact was excavated and commemorated in these events?","context":"In 1976, archaeologists excavating in Butuan unearth ancient plank boats joined with wooden pegs that connected early Filipino polities to trade with China as early as 1001 CE. In 2009, a reconstructed replica of this vessel successfully sails across Southeast Asia.","options":[{"t":"The Balangay (Butuan Boat)","c":true,"fb":"The Balangay was discovered in Butuan in 1976 and sailed as a replica in 2009."},{"t":"The Galleon San Diego","c":false,"fb":"M-BALANGAY-METAL-CONSTRUCTION: Confuses indigenous plank boats with Spanish colonial galleons."},{"t":"The Boxer Codex manuscript","c":false,"fb":"M-BALANGAY-METAL-CONSTRUCTION: Confuses a seafaring vessel with an illustrated manuscript."},{"t":"The Doctrina Christiana woodblock","c":false,"fb":"M-BALANGAY-METAL-CONSTRUCTION: Confuses a maritime watercraft with a printed religious text."}]},{"cat":"01","type":"mcq","stem":"What was the primary geographic scope and duration of the ancient Maritime Jade Road?","options":[{"t":"Connecting the Philippines, Taiwan, and Southeast Asia from 2000 BCE to 1000 CE (3,000 years)","c":true,"fb":"The Maritime Jade Road spanned 3,000 years, trading jade primarily from Taiwan."},{"t":"Connecting Manila directly to Acapulco from 1565 to 1815 (250 years)","c":false,"fb":"M-JADE-ROAD-TIMELINE: Confuses the ancient Jade Road with the Spanish Manila Galleon Trade."},{"t":"Linking Luzon to European Atlantic ports from 1898 to 1946 (48 years)","c":false,"fb":"M-JADE-ROAD-TIMELINE: Confuses ancient trade routes with American colonial trade."},{"t":"A domestic overland mountain trail operating exclusively within Mindanao for 50 years","c":false,"fb":"M-JADE-ROAD-TIMELINE: Mischaracterizes a vast maritime network as a local overland path."}]},{"cat":"01","type":"scenario","stem":"Which ancient commercial network is evidenced by these findings?","context":"An archaeologist unearths a collection of green nephrite ornaments in an ancient coastal Philippine burial site. Mineralogical tests show the raw jade originated in Taiwan and was crafted and exchanged through regional seafaring networks between 2000 BCE and 1000 CE.","options":[{"t":"The Maritime Jade Road","c":true,"fb":"The 3,000-year trade network traded jade mainly from Taiwan across Southeast Asia."},{"t":"The Spanish Tobacco Monopoly","c":false,"fb":"M-JADE-ROAD-TIMELINE: Confuses pre-colonial jade networks with an 18th-century Spanish monopoly."},{"t":"The Manila-Acapulco Galleon Trade","c":false,"fb":"M-JADE-ROAD-TIMELINE: Mistakenly selects the trans-Pacific Spanish colonial trade route."},{"t":"The Royal Company of the Philippines","c":false,"fb":"M-JADE-ROAD-TIMELINE: Confuses ancient pre-colonial trade with late colonial chartered companies."}]},{"cat":"01","type":"mcq","stem":"How is the ancient Baybayin script technically structured?","options":[{"t":"As an alphasyllabary consisting of 17 characters (14 consonants and 3 vowels)","c":true,"fb":"Baybayin has 17 core characters (14 consonants and 3 vowels) using vowel marks."},{"t":"As a Latin alphabet consisting of 26 letters (21 consonants and 5 vowels)","c":false,"fb":"M-BAYBAYIN-ALPHABET-LATIN: Confuses the pre-colonial script with the modern Latin alphabet."},{"t":"As an ideographic script of 500 picture symbols representing complete phrases","c":false,"fb":"M-BAYBAYIN-ALPHABET-LATIN: Mistakenly portrays Baybayin as a complex logographic script."},{"t":"As a pure numerical cipher of 9 digits developed exclusively for banking","c":false,"fb":"M-BAYBAYIN-ALPHABET-LATIN: Reduces an alphasyllabic writing system to numerical digits."}]},{"cat":"01","type":"multi","stem":"Which of the following statements accurately describe the history and evolution of Baybayin? Select the TWO correct statements.","options":[{"t":"It evolved from the older Kawi script","c":true,"fb":"Baybayin developed historically out of earlier regional Kawi scripts."},{"t":"It was written vertically and later horizontally","c":true,"fb":"The script transitioned directionally from vertical to horizontal writing."},{"t":"It completely replaced the Latin alphabet during Spanish colonization","c":false,"fb":"M-BAYBAYIN-KAWI-ORIGIN-REVERSE: Inverts history; Baybayin declined as Latin script spread."},{"t":"It originated in Europe and was introduced by Spanish missionaries","c":false,"fb":"M-BAYBAYIN-KAWI-ORIGIN-REVERSE: Misattributes indigenous script origin to European colonizers."},{"t":"It was created in 2018 as a brand-new modern constructed language","c":false,"fb":"M-BAYBAYIN-KAWI-ORIGIN-REVERSE: Confuses the 2018 national bill with the invention of the ancient script."}]},{"cat":"02","type":"mcq","stem":"In 1521, Ferdinand Magellan arrived in the Philippines. Which statement about him is correct?","options":[{"t":"He was a Spanish explorer seeking a route to Mexico","c":false,"fb":"this mixes up his nationality and goal; his expedition was aimed at the Spice Islands, not Mexico"},{"t":"He was a Portuguese explorer sailing under the Spanish flag","c":true,"fb":"Magellan was Portuguese but served Spain, and his expedition sought a westward route to the Spice Islands"},{"t":"He was a Portuguese explorer sent by Portugal to claim Cebu","c":false,"fb":"this assumes he sailed for his homeland; he actually served the Spanish crown"},{"t":"He was a Spanish explorer who had already visited the islands","c":false,"fb":"this treats the 1521 voyage as a return trip; he was the first European to set foot on the islands"}]},{"cat":"02","type":"mcq","stem":"Magellan's expedition had its first contact with locals in the Philippines when and where?","options":[{"t":"April 7, 1521, at Cebu, through an alliance with Rajah Humabon","c":false,"fb":"this mistakes a later political alliance for the very first contact, which was a trade visit"},{"t":"March 18, 1521, at Homonhon Island, when Suluan fishermen traded","c":true,"fb":"fishermen from Suluan visited the expedition at Homonhon Island and traded with them with them"},{"t":"March 18, 1521, at Mactan, through negotiations with Lapu-Lapu","c":false,"fb":"this moves the first contact to the site of the later conflict and to the wrong chieftain"},{"t":"April 7, 1521, at Homonhon Island, when Humabon's men visited","c":false,"fb":"this attaches the wrong ruler to Homonhon and delays the contact by three weeks"}]},{"cat":"02","type":"mcq","stem":"Which event in Magellan's Philippine expedition happened LAST?","options":[{"t":"The Battle of Mactan","c":true,"fb":"Magellan was killed at the Battle of Mactan, which came after both the Homonhon contact and the Cebu alliance"},{"t":"Trading with fishermen from Suluan at Homonhon Island","c":false,"fb":"this was the opening event of the expedition's contact with locals, not the last"},{"t":"The alliance with Rajah Humabon of Cebu","c":false,"fb":"the Humabon alliance on April 7, 1521 followed the March 18 contact at Homonhon, but one major event came after it"},{"t":"The first sighting of the Spice Islands","c":false,"fb":"the Spice Islands were the expedition's destination, beyond the Philippine stops described"}]},{"cat":"02","type":"fitb","stem":"Magellan was killed at the Battle of Mactan by the local chieftain ____ and his warriors.","subtype":"name","answer":["Lapu-Lapu","Lapulapu"],"caseSensitive":false,"hint":"This chieftain's name is now a common Filipino given name.","fb":"Lapu-Lapu resisted Magellan's attempt to assert Spanish dominance, and the battle showed native resistance to foreign intervention."},{"cat":"02","type":"multi","stem":"Which three characteristics defined Spanish colonization? Select the THREE key characteristics of Spanish colonization.","options":[{"t":"Conversion of Filipinos to Christianity through missionaries","c":true,"fb":"spreading Christianity was one of the Spaniards' primary goals"},{"t":"The encomienda system of tribute collection","c":true,"fb":"the Spanish government granted settlers tribute rights in exchange for protection and instruction"},{"t":"Cultural exchange in language, food, and clothing","c":true,"fb":"Spanish influence entered daily Filipino life, including loanwords and cuisine"},{"t":"Introduction of formal schools by religious orders","c":false,"fb":"formal schooling was a later impact of colonial rule, not one of the three defining characteristics"},{"t":"Adoption of the galleon trade as a colony-wide state religion","c":false,"fb":"this merges an economic arrangement with a religious goal; neither combination appears among the defining characteristics"}]},{"cat":"02","type":"mcq","stem":"Under the encomienda system, settlers were granted the right to collect tribute from local populations. What were they expected to give in return?","options":[{"t":"Protection and Christian instruction","c":true,"fb":"encomenderos were expected to protect indigenous people and teach them Christianity, though the system was often exploitative"},{"t":"Wages and land ownership for the natives","c":false,"fb":"this treats tribute as a labor contract; the system promised protection and religious teaching, not land or wages"},{"t":"Representation of natives in the Cortes","c":false,"fb":"this confuses the encomienda with a later reformist demand for parliamentary representation"},{"t":"Freedom for natives to trade with other colonies","c":false,"fb":"trade freedoms were not among the obligations the system placed on those collecting tribute"}]},{"cat":"02","type":"multi","stem":"In which areas of Filipino life did cultural exchange from the colonizers appear, according to the handout? Select the THREE areas where Spanish influence appeared in Filipino life.","options":[{"t":"Language","c":true,"fb":"many Filipino words have Spanish origins, such as merienda, cocina, and mesa"},{"t":"Food","c":true,"fb":"traditional Filipino dishes took on Spanish ingredients and cooking techniques"},{"t":"Clothing","c":true,"fb":"Spanish influence can be seen in Filipino clothing"},{"t":"Formal education","c":false,"fb":"schooling was a separate colonial reform, not one of the three channels of cultural exchange listed"},{"t":"Military organization","c":false,"fb":"the handout lists language, food, and clothing — not military structure — as the channels of cultural exchange"}]},{"cat":"02","type":"mcq","stem":"Where and when did Spain establish its first permanent settlement in the Philippines?","options":[{"t":"Manila, in 1565","c":false,"fb":"this attaches the founding date of the first settlement to the wrong city; Manila's role came later"},{"t":"Cebu, in 1571","c":false,"fb":"this swaps the two milestone dates between Cebu and Manila"},{"t":"Cebu, in 1565, under Miguel López de Legazpi","c":true,"fb":"Legazpi established the first permanent Spanish settlement in Cebu in 1565, beginning formal colonization"},{"t":"Homonhon, in 1521, under Ferdinand Magellan","c":false,"fb":"Magellan's 1521 arrival marked Spanish interest, but no permanent settlement was founded then"}]},{"cat":"02","type":"mcq","stem":"Which pairing of city and colonial role is correct?","options":[{"t":"Cebu — established as the capital of the colony","c":false,"fb":"this gives Cebu the political role that another city took on later"},{"t":"Manila — established as the capital in 1571","c":true,"fb":"after Legazpi's 1565 settlement in Cebu, the Spaniards established Manila as the capital in 1571"},{"t":"Manila — site of the first permanent settlement in 1565","c":false,"fb":"this gives Manila the founding role of the earlier Cebu settlement"},{"t":"Cebu — trading post of the Manila-Acapulco galleon route","c":false,"fb":"this invents a role for Cebu; the galleon trade ran between Manila and Acapulco"}]},{"cat":"02","type":"mcq","stem":"Which group held the highest positions in the social hierarchy under colonial rule?","options":[{"t":"Traditional chieftains and barangay leaders","c":false,"fb":"colonization actually diminished the power of traditional chieftains rather than placing them on top"},{"t":"Spanish settlers and mestizos","c":true,"fb":"settlers of Spanish background and those of mixed Spanish-Filipino ancestry held the highest positions, while natives faced discrimination"},{"t":"Ilustrados and Propaganda Movement writers","c":false,"fb":"the ilustrados were reformists who emerged in the 1880s; they did not sit atop the colonial-era social hierarchy"},{"t":"Spanish missionaries and their converts","c":false,"fb":"missionaries drove conversion but the top of the hierarchy belonged to settlers and mestizos"}]},{"cat":"02","type":"multi","stem":"Which crops became important exports in the colonial economy? Select the THREE cash crops that became important colonial exports.","options":[{"t":"Sugar","c":true,"fb":"sugar was one of the major cash crops of the colonial export economy"},{"t":"Tobacco","c":true,"fb":"tobacco was one of the major cash crops of the colonial export economy"},{"t":"Hemp","c":true,"fb":"hemp was one of the major cash crops of the colonial export economy"},{"t":"Rice","c":false,"fb":"the focus on export crops actually neglected local agricultural needs; rice is not listed as an export cash crop"},{"t":"Coconut","c":false,"fb":"coconut farming is not listed among the export crops; the export economy rested on sugar, tobacco, and hemp"}]},{"cat":"02","type":"mcq","stem":"How was formal education introduced under colonial rule?","options":[{"t":"Through religious orders, focusing on religion and Spanish","c":true,"fb":"schools run by religious orders centered on religious instruction and the Spanish language"},{"t":"Through secular public schools teaching practical trades","c":false,"fb":"this describes a modern secular system; colonial schooling ran through religious institutions"},{"t":"Through local chieftains teaching traditional customs","c":false,"fb":"the colonial school system was run by religious orders, not by chieftains or customary instruction"},{"t":"Through free compulsory schooling open to all Filipinos","c":false,"fb":"access was actually limited for many Filipinos, not universal"}]},{"cat":"02","type":"scenario","stem":"Which impact of Spanish colonial rule does this record illustrate?","context":"A historian examines a 1570s record showing that a village's traditional chieftain has been removed from power and a Spanish official appointed to govern the town directly, answerable to a centralized colonial administration.","options":[{"t":"Religious syncretism","c":false,"fb":"syncretism describes blended religious practice, not the transfer of political authority"},{"t":"Political changes under centralized government","c":true,"fb":"replacing local leaders with Spanish officials under a centralized government was a key political change that bred resentment"},{"t":"Economic changes from cash-crop exports","c":false,"fb":"the record concerns governance and authority, not crop production or trade"},{"t":"Educational reforms by religious orders","c":false,"fb":"the record concerns who holds political office, not schooling"}]},{"cat":"02","type":"multi","stem":"Which grievances most often drove Filipino revolts during the Spanish period? Select the THREE grievances that commonly sparked colonial revolts.","options":[{"t":"Land ownership disputes","c":true,"fb":"grievances over land ownership were a common root of uprisings like the Dagohoy Rebellion"},{"t":"Taxation","c":true,"fb":"grievances over taxation fueled repeated colonial-era revolts"},{"t":"Forced labor","c":true,"fb":"forced labor was a recurring source of resistance to colonial abuses"},{"t":"Religious persecution","c":false,"fb":"the revolts described targeted colonial abuses of land, tax, and labor — not religious persecution"},{"t":"Lack of representation in the Spanish Cortes","c":false,"fb":"Cortes representation was a reformist demand of the Propaganda Movement, not a driver of the rural revolts described"}]},{"cat":"02","type":"scenario","stem":"What does this blending of practices best illustrate?","context":"In a Bohol community, families wear anting-anting amulets to church fiestas. The rituals honor Catholic saints, but villagers also offer prayers to precolonial deities their ancestors worshipped.","options":[{"t":"The complete replacement of indigenous beliefs by Catholicism","c":false,"fb":"the practices coexist rather than replace each other, which is the opposite of full replacement"},{"t":"Religious syncretism producing folk Catholicism","c":true,"fb":"indigenous beliefs blended with Christian practices, giving rise to folk Catholicism"},{"t":"Political resistance to colonial authorities","c":false,"fb":"resistance took the form of revolts over land, tax, and labor — not blended worship"},{"t":"The educational work of religious orders","c":false,"fb":"religious-order schooling taught formal religion; the scene describes fused local practice instead"}]},{"cat":"02","type":"mcq","stem":"The Manila-Acapulco galleon trade connected the Philippines with which destination?","options":[{"t":"Spain, across the Atlantic","c":false,"fb":"the galleons did not sail directly to Spain; the route ran across the Pacific"},{"t":"Mexico, linking Manila to the wider world","c":true,"fb":"the galleon trade between Manila and Acapulco facilitated trade with Mexico and other parts of the world"},{"t":"Portugal, via the Spice Islands","c":false,"fb":"this confuses the trade route with Magellan's original Portuguese-connected goal"},{"t":"China, across the South China Sea","c":false,"fb":"China traded with the islands, but the galleon route named in the handout crossed the Pacific"}]},{"cat":"02","type":"mcq","stem":"Why were Fathers Gómez, Burgos, and Zamora — the Gomburza — executed in 1872?","options":[{"t":"For founding a secret revolutionary society","c":false,"fb":"this describes the later Katipunan; the priests were accused in connection with an earlier mutiny"},{"t":"For allegedly supporting the Cavite Mutiny","c":true,"fb":"the three priests were executed on February 17, 1872 for alleged support of the Cavite Mutiny"},{"t":"For writing novels exposing colonial injustices","c":false,"fb":"anti-colonial novels came later from a different reformist writer"},{"t":"For editing La Solidaridad without a license","c":false,"fb":"La Solidaridad did not exist until 1889, long after the executions"}]},{"cat":"02","type":"multi","stem":"Which were the main objectives of the Propaganda Movement? Select the THREE main objectives of the Propaganda Movement.","options":[{"t":"Advocacy for political and social reforms","c":true,"fb":"reformists sought Cortes representation, freedom of speech, and equality before the law"},{"t":"Fostering a national identity through culture and history","c":true,"fb":"promoting Filipino culture and history aimed to unite people against colonial oppression"},{"t":"Education and enlightenment of the populace","c":true,"fb":"the ilustrados believed an educated populace could better advocate for its rights"},{"t":"Restoration of precolonial chieftains to political power","c":false,"fb":"restoring chieftain rule was never a stated aim; the movement sought reforms within the colonial system"},{"t":"Overthrow of Spanish rule through armed struggle","c":false,"fb":"armed struggle was the Katipunan's aim; the Propaganda Movement pursued peaceful means"}]},{"cat":"02","type":"fitb","stem":"The Propaganda Movement was led by educated Filipinos known as the ____.","subtype":"term","answer":["ilustrados"],"caseSensitive":false,"fb":"The ilustrados believed reform could be achieved through peaceful means such as education, journalism, and political engagement."},{"cat":"02","type":"mcq","stem":"How did the ilustrados of the Propaganda Movement believe change should be achieved?","options":[{"t":"Through armed struggle and direct action","c":false,"fb":"this was the Katipunan's approach, adopted only after reformists lost faith in peaceful change"},{"t":"Through peaceful means like education, journalism, and politics","c":true,"fb":"the ilustrados pursued reform peacefully through education, journalism, and political engagement"},{"t":"Through boycott of the galleon trade","c":false,"fb":"no trade boycott is part of the movement's described methods"},{"t":"Through alliance with the Sultanates of Mindanao","c":false,"fb":"this invents an alliance; the movement's tools were education, journalism, and political engagement"}]},{"cat":"02","type":"multi","stem":"Which three events happened in 1892? Select the THREE events that occurred in 1892.","options":[{"t":"José Rizal founded La Liga Filipina","c":true,"fb":"Rizal founded the reformist society La Liga Filipina in 1892"},{"t":"Rizal was arrested and exiled to Dapitan","c":true,"fb":"shortly after founding La Liga Filipina, Rizal was exiled to Dapitan in 1892"},{"t":"Andres Bonifacio founded the Katipunan","c":true,"fb":"Bonifacio founded the Katipunan in 1892"},{"t":"La Solidaridad was founded","c":false,"fb":"the newspaper was founded several years earlier, in 1889"},{"t":"La Solidaridad ceased publication","c":false,"fb":"the paper stopped publication years later, in 1895"}]},{"cat":"02","type":"mcq","stem":"Who founded La Solidaridad, and in what year?","options":[{"t":"Marcelo H. del Pilar, in 1889","c":false,"fb":"this credits the paper's later editor with its founding"},{"t":"Graciano López Jaena, in 1889","c":true,"fb":"López Jaena, a journalist and orator, founded La Solidaridad in 1889 as the movement's main platform"},{"t":"José Rizal, in 1887","c":false,"fb":"1887 is the year of a reformist novel, and Rizal founded a society rather than this newspaper"},{"t":"Graciano López Jaena, in 1882","c":false,"fb":"1882 belongs to a different reformist publication, not this one"}]},{"cat":"02","type":"mcq","stem":"What changed in the leadership of La Solidaridad in 1890?","options":[{"t":"The paper ceased publication for lack of funds","c":false,"fb":"the paper continued for several more years after this leadership change"},{"t":"Graciano López Jaena returned as its editor","c":false,"fb":"this reverses the actual direction of the editorship change"},{"t":"Marcelo H. del Pilar replaced López Jaena as editor","c":true,"fb":"del Pilar took over as editor in 1890 and continued the campaign for reform and Filipino rights"},{"t":"José Rizal became its editor","c":false,"fb":"Rizal contributed as a novelist and society founder but never held the paper's editorship, which passed between two other reformists"}]},{"cat":"02","type":"mcq","stem":"Which reformist wrote Noli Me Tangere and El Filibusterismo?","options":[{"t":"José Rizal","c":true,"fb":"Rizal's two novels exposed the social injustices of colonial rule and inspired many Filipinos to seek change"},{"t":"Marcelo H. del Pilar","c":false,"fb":"del Pilar's contribution was through newspapers and editorial writing, not novels"},{"t":"Graciano López Jaena","c":false,"fb":"López Jaena was a journalist and orator who founded a newspaper, not the novelist in question"},{"t":"Andres Bonifacio","c":false,"fb":"Bonifacio belonged to the revolutionary generation, not the novel-writing reformists"}]},{"cat":"02","type":"fitb","stem":"In 1892, Rizal founded a peaceful reformist society called the ____.","subtype":"term","answer":["La Liga Filipina","Liga Filipina"],"caseSensitive":false,"hint":"Rizal founded it shortly after returning from Europe.","fb":"La Liga Filipina aimed to unite Filipinos in advocating for peaceful change and reforms."},{"cat":"02","type":"scenario","stem":"What fundamental shift in Filipino nationalist strategy do these two documents demonstrate?","context":"A historian comparing 19th-century primary sources contrasts an 1889 issue of La Solidaridad petitioning for representation in the Spanish Cortes with the 1892 founding platform of the Katipunan calling for the overthrow of Spanish rule.","options":[{"t":"A retreat from national unity back into isolated regional uprisings","c":false,"fb":"both movements sought national unity against colonial oppression rather than localized tribal revolts"},{"t":"The transition from peaceful reformism to radical armed revolution","c":true,"fb":"the documents show how Spanish repression pushed nationalists from non-violent political engagement to armed struggle"},{"t":"The transformation of a peasant rebellion into an elite parliamentary party","c":false,"fb":"this reverses the historical timeline; parliamentary petitions came first, followed by the secret revolutionary society"},{"t":"An abandonment of political independence in favor of religious assimilation","c":false,"fb":"neither document sought religious assimilation; both targeted colonial injustice and self-determination"}]},{"cat":"02","type":"mcq","stem":"After his arrest in 1892, where was Rizal exiled, and what did he focus on there?","options":[{"t":"Dapitan, on education, science, and public service","c":true,"fb":"Rizal spent his exile in Dapitan concentrating on education, science, and public service"},{"t":"Cavite, on organizing the Cavite Mutiny","c":false,"fb":"the Cavite Mutiny happened in 1872, before Rizal's exile, and he was not its organizer"},{"t":"Dapitan, on editing La Solidaridad","c":false,"fb":"the paper's editorial work was never Rizal's; his exile years were devoted to other pursuits"},{"t":"Europe, on writing his two novels","c":false,"
