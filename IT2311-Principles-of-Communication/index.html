sburgh in 1920."}]},{"cat":"01","type":"mcq","stem":"Which major digital communication milestone emerged in the United States during the period 2004–2006?","options":[{"t":"The development and the first use of the Internet","c":false,"fb":"The development and first use of the Internet occurred during 1982–1990."},{"t":"The rise of social media","c":true,"fb":"Historical milestones designate the 2004–2006 period as the milestone for the rise of social media in the United States."},{"t":"The discovery of radio waves","c":false,"fb":"Heinrich Hertz discovered radio waves in 1887."},{"t":"The beginning of 5G cellular service","c":false,"fb":"The beginning of 5G cellular service occurred in Uruguay in 2019."}]},{"cat":"01","type":"mcq","stem":"Which cellular network standard was rolled out worldwide in 2009?","options":[{"t":"The first fourth-generation LTE cellular networks","c":true,"fb":"Historical milestones list 2009 and Worldwide for the first fourth-generation LTE cellular networks."},{"t":"The beginning of 5G cellular service","c":false,"fb":"The beginning of 5G cellular service occurred in Uruguay in 2019."},{"t":"The development of Apple's iPhone","c":false,"fb":"The development of Apple's iPhone is listed as a 2007 milestone in the United States."},{"t":"The invention of the telephone","c":false,"fb":"Alexander Graham Bell invented the telephone in 1876."}]},{"cat":"02","type":"mcq","stem":"In electronic communication systems, how is a signal formally defined?","options":[{"t":"An electromagnetic or electrical current representing information carried from a source to a destination","c":true,"fb":"Accurately identifies the foundational definition of an electronic communication signal."},{"t":"A constant DC voltage level maintained across a transmission line to suppress noise","c":false,"fb":"Assumes signals are unvarying reference voltages rather than information-bearing dynamic currents."},{"t":"The physical copper medium through which data packets propagate between network nodes","c":false,"fb":"Confuses the physical transmission medium/channel with the propagating signal itself."},{"t":"A purely acoustic compression wave radiating directly through atmospheric channels","c":false,"fb":"Confuses electronic/electromagnetic signals with acoustic sound pressure waves."}]},{"cat":"02","type":"mcq","stem":"Which statement correctly describes the mathematical properties and units of circuit gain?","options":[{"t":"Voltage gain is expressed in decibels per meter, while power gain is expressed in Watts","c":false,"fb":"Incorrectly assigns dimensional units to standard linear gain ratios."},{"t":"Gain represents amplification where output amplitude is greater than input, and voltage gain is unitless","c":true,"fb":"Accurately states that gain represents amplification (A > 1) and is a unitless ratio."},{"t":"Gain is strictly present only when the ratio of output to input is less than 1","c":false,"fb":"Confuses circuit amplification gain with circuit attenuation."},{"t":"Linear voltage gain is expressed in units of Amperes","c":false,"fb":"Confuses the unitless voltage/power gain factor A with current gain units specified in Amperes."}]},{"cat":"02","type":"multi","stem":"Which statements correctly characterize gain and attenuation in communication circuits? Select the TWO correct statements regarding gain and attenuation.","options":[{"t":"An electronic circuit exhibits attenuation when its output signal is lower in amplitude than its input signal","c":true,"fb":"Accurately reflects the core condition of signal attenuation (Vout < Vin)."},{"t":"A circuit stage that provides signal amplification has a linear gain factor less than 1.0","c":false,"fb":"Assumes amplification corresponds to a gain factor below unity instead of above unity."},{"t":"Both gain and attenuation can be mathematically represented by the letter A","c":true,"fb":"Accurately identifies that the letter A denotes the input/output ratio for both gain and attenuation."},{"t":"Attenuation increases signal amplitude to compensate for noise introduced by physical channels","c":false,"fb":"Mistakenly attributes the function of an amplifier to an attenuator."},{"t":"Current gain is a dimensionless quantity that has no physical unit of measurement","c":false,"fb":"Overlooks the handout specification that current gain is expressed in Amperes."}]},{"cat":"02","type":"fitb","stem":"A circuit has an input voltage of 5 mV and an output voltage of 150 mV. The calculated voltage gain (Av) of the circuit is ____.","subtype":"value","answer":["30","30.0"],"caseSensitive":false,"hint":"Voltage gain is the ratio of output voltage to input voltage (Av = Vout / Vin).","fb":"Dividing Vout (150 mV) by Vin (5 mV) gives a voltage gain of 30."},{"cat":"02","type":"scenario","stem":"What is the magnitude of the input voltage (Vin) supplied to the preamplifier?","context":"An RF preamplifier circuit in a communication receiver is designed with a known voltage gain of 230. During a test bench measurement, an oscilloscope measures the output voltage (Vout) at exactly 0.7 V.","options":[{"t":"161.0 V","c":false,"fb":"Multiplies output voltage by gain (Vout * Av) instead of dividing."},{"t":"328.57 mV","c":false,"fb":"Inverts the formula to divide gain by output voltage (Av / Vout)."},{"t":"3.04 mV","c":true,"fb":"Correctly applies Vin = Vout / Av = 0.7 V / 230 ≈ 0.00304 V = 3.04 mV."},{"t":"0.0304 mV","c":false,"fb":"Introduces a power-of-ten metric prefix calculation error."}]},{"cat":"02","type":"mcq","stem":"An amplifier receives a small sensor signal of 140 μV and produces an amplified output of 65 mV. What is the calculated voltage gain (Av)?","options":[{"t":"464.29","c":true,"fb":"Correctly divides 65 x 10^-3 V by 140 x 10^-6 V to obtain 464.29."},{"t":"0.464","c":false,"fb":"Fails to convert microvolts and millivolts to base Volts, causing a 10^3 scaling error."},{"t":"2.15","c":false,"fb":"Inverts the ratio by dividing input voltage by output voltage (Vin / Vout)."},{"t":"9100.0","c":false,"fb":"Multiplies the two voltage magnitudes together instead of computing their ratio."}]},{"cat":"02","type":"mcq","stem":"Which formula correctly expresses the linear power gain (Ap) of an amplifier stage?","options":[{"t":"Ap = Pin / Pout","c":false,"fb":"Inverts the input and output terms in the transfer ratio."},{"t":"Ap = Pout / Pin","c":true,"fb":"Accurately identifies power gain as output power divided by input power."},{"t":"Ap = 10 * (Pout - Pin)","c":false,"fb":"Confuses linear ratio gain with arithmetic power difference."},{"t":"Ap = (Pout * Pin) / 2","c":false,"fb":"Uses an arbitrary product formula rather than an output-to-input ratio."}]},{"cat":"02","type":"fitb","stem":"An intermediate power amplifier receives an input power of 25 mW and delivers an output power of 500 mW to the antenna feed. The linear power gain (Ap) of this stage is ____.","subtype":"value","answer":["20","20.0"],"caseSensitive":false,"hint":"Compute the ratio of power output to power input (Ap = Pout / Pin).","fb":"Dividing Pout (500 mW) by Pin (25 mW) yields a power gain of 20."},{"cat":"02","type":"scenario","stem":"What is the total power delivered at the output of the third stage (Pout)?","context":"A transmitter power amplification chain consists of three cascaded amplifier stages with individual power gains of A1 = 5, A2 = 3, and A3 = 16. An input signal with a power level of Pin = 40 mW (0.040 W) is applied to the input of the first stage.","options":[{"t":"0.96 W","c":false,"fb":"Uses an incorrect total gain calculation (AT = 24) by adding stage gains instead of multiplying."},{"t":"9.6 W","c":true,"fb":"Correctly computes total gain AT = 5 * 3 * 16 = 240, then Pout = 240 * 0.040 W = 9.6 W."},{"t":"240.0 W","c":false,"fb":"Reports the total unitless gain factor rather than multiplying by the input power."},{"t":"1.67 W","c":false,"fb":"Divides total gain by input power instead of multiplying."}]},{"cat":"02","type":"mcq","stem":"How is the overall total gain (AT) calculated when multiple amplifier stages are connected in cascade?","options":[{"t":"By taking the arithmetic mean of all individual circuit gains","c":false,"fb":"Assumes stages average their amplification rather than compounding."},{"t":"By adding the individual linear gain factors (A1 + A2 + A3)","c":false,"fb":"Conflates decibel addition rules with linear gain factor multiplication."},{"t":"By multiplying the individual stage gains together (A1 * A2 * A3)","c":true,"fb":"Correctly identifies that overall linear cascaded gain is the product of individual gains."},{"t":"By taking the reciprocal sum of the individual gain stages","c":false,"fb":"Applies the parallel resistor formula to cascaded series stages."}]},{"cat":"02","type":"scenario","stem":"What is the final output voltage (Vout) emerging from the cascaded chain?","context":"A multistage signal conditioning path has three cascaded loss stages with individual attenuation factors of A1 = 0.2, A2 = 0.9, and A3 = 0.06. A signal with an amplitude of Vin = 3 V is applied to the input.","options":[{"t":"32.4 mV","c":true,"fb":"Correctly computes AT = 0.2 * 0.9 * 0.06 = 0.0108, then Vout = 0.0108 * 3 V = 0.0324 V = 32.4 mV."},{"t":"3.48 V","c":false,"fb":"Adds the attenuation factors (1.16) and multiplies by input voltage."},{"t":"277.7 V","c":false,"fb":"Divides the input voltage by the total attenuation factor instead of multiplying."},{"t":"324.0 mV","c":false,"fb":"Introduces a factor-of-ten decimal placement error during millivolt conversion."}]},{"cat":"02","type":"fitb","stem":"Three cascaded amplifier stages have individual voltage gains of 5, 3, and 4. The overall voltage gain (AT) of the cascaded system is ____.","subtype":"value","answer":["60","60.0"],"caseSensitive":false,"hint":"Total gain is found by multiplying individual stage gains: AT = A1 * A2 * A3.","fb":"Multiplying the individual gains (5 * 3 * 4) yields an overall system gain of 60."},{"cat":"02","type":"multi","stem":"Which statements correctly describe cascaded circuits and components? Select the TWO correct statements regarding cascaded processing stages.","options":[{"t":"In a cascaded system, the output of each preceding stage serves as the input to the following stage","c":true,"fb":"Accurately describes the sequential signal connection of cascaded circuit stages."},{"t":"The total gain of cascaded linear amplifiers is determined by summing their individual gains","c":false,"fb":"Incorrectly applies addition instead of multiplication to linear gain stages."},{"t":"The overall attenuation factor of cascaded lossy components is the product of their individual attenuation factors","c":true,"fb":"Correctly identifies that cascaded attenuations multiply together (AT = A1 * A2 * A3)."},{"t":"Cascading three attenuators with factors less than 1 results in a total system gain greater than 1","c":false,"fb":"Believes compounding losses can spontaneously create signal amplification."},{"t":"The total output voltage is calculated by dividing the input voltage by the product of stage gains","c":false,"fb":"Inverts the relationship between total gain and input voltage."}]},{"cat":"02","type":"mcq","stem":"For a resistive voltage divider composed of series resistors R1 and R2 (where output is taken across R2), what is the formula for the circuit attenuation factor A?","options":[{"t":"A = (R1 + R2) / R2","c":false,"fb":"Inverts the voltage divider transfer ratio."},{"t":"A = R2 / (R1 + R2)","c":true,"fb":"Accurately identifies the standard resistive divider attenuation ratio."},{"t":"A = R1 / R2","c":false,"fb":"Omits the total series resistance from the denominator."},{"t":"A = (R1 * R2) / (R1 + R2)","c":false,"fb":"Confuses voltage attenuation with parallel equivalent resistance."}]},{"cat":"02","type":"fitb","stem":"A voltage divider attenuator has resistor values of R1 = 200 Ω and R2 = 100 Ω. The attenuation factor (A) of this circuit, rounded to four decimal places, is ____.","subtype":"value","answer":["0.3333","0.333","1/3"],"caseSensitive":false,"hint":"Attenuation factor is A = R2 / (R1 + R2).","fb":"Dividing R2 (100) by R1 + R2 (300) yields an attenuation factor of 0.3333."},{"cat":"02","type":"mcq","stem":"To completely offset an attenuation stage having an attenuation factor A1 and restore overall circuit gain to unity (AT = 1), what gain A2 must the compensating amplifier possess?","options":[{"t":"A2 = 1 - A1","c":false,"fb":"Treats gain-loss cancellation as additive subtraction rather than multiplicative inverse."},{"t":"A2 = 1 / A1","c":true,"fb":"Correctly identifies that compensating amplifier gain must be the reciprocal of attenuation."},{"t":"A2 = A1^2","c":false,"fb":"Applies a power function instead of the reciprocal relationship."},{"t":"A2 = -A1","c":false,"fb":"Confuses linear gain compensation with arithmetic negation."}]},{"cat":"02","type":"scenario","stem":"What value of gain (A2) must be selected for the amplifier?","context":"A communication front-end contains a passive attenuator with resistors R1 = 750 Ω and R2 = 250 Ω, yielding an attenuation factor of A1 = 0.25. An engineer needs to place an amplifier stage (A2) immediately following the attenuator so that the final output voltage equals the original input voltage (Vout = Vin).","options":[{"t":"0.75","c":false,"fb":"Subtracts the attenuation factor from 1 (1 - 0.25) instead of taking the reciprocal."},{"t":"2.50","c":false,"fb":"Multiplies attenuation by 10 rather than calculating 1 / A1."},{"t":"4","c":true,"fb":"Correctly computes the reciprocal gain A2 = 1 / A1 = 1 / 0.25 = 4."},{"t":"1.25","c":false,"fb":"Adds the attenuation factor to 1 (1 + 0.25) rather than taking the reciprocal."}]},{"cat":"02","type":"mcq","stem":"What is the primary operational advantage of converting large gain and attenuation ratios into decibels (dB) in communication engineering?","options":[{"t":"It allows nonlinear semiconductor distortion to be completely eliminated from the circuit","c":false,"fb":"Mistakenly attributes physical circuit linearization to a mathematical unit conversion."},{"t":"It compresses huge numerical values reaching into the millions into smaller, manageable numbers that reflect human auditory response","c":true,"fb":"Accurately states that decibels compress large numbers logarithmically and model human ear response."},{"t":"It converts alternating current signals directly into direct current voltage levels","c":false,"fb":"Confuses decibel representation with power rectification."},{"t":"It increases the physical bandwidth and speed of light propagation in free space","c":false,"fb":"Confuses mathematical unit representation with physical medium propagation properties."}]},{"cat":"02","type":"mcq","stem":"Which mathematical formula is used to calculate the voltage gain or attenuation of a circuit in decibels?","options":[{"t":"dB = 10 log(Vout / Vin)","c":false,"fb":"Uses the multiplier for power (10) instead of the voltage multiplier (20)."},{"t":"dB = 20 log(Vout / Vin)","c":true,"fb":"Accurately identifies dB = 20 log(Vout / Vin) as the voltage decibel formula."},{"t":"dB = 20 ln(Vout * Vin)","c":false,"fb":"Uses natural logarithm and product of voltages instead of base-10 log of the ratio."},{"t":"dB = 2 log(Vin / Vout)","c":false,"fb":"Uses an incorrect scalar multiplier and inverts the ratio."}]},{"cat":"02","type":"scenario","stem":"What is the voltage gain of the amplifier expressed in decibels?","context":"A sensitive instrumentation amplifier receives an input signal of Vin = 4 mV (0.004 V) and produces an amplified output of Vout = 7 V.","options":[{"t":"32.43 dB","c":false,"fb":"Applies the power formula (dB = 10 log(Vout / Vin)) instead of the voltage formula (20 log)."},{"t":"64.86 dB","c":true,"fb":"Correctly computes ratio 7 / 0.004 = 1750, log(1750) ≈ 3.243, and 20 * 3.243 = 64.86 dB."},{"t":"48.86 dB","c":false,"fb":"Miscalculates the voltage ratio prior to taking the logarithm."},{"t":"-64.86 dB","c":false,"fb":"Applies a negative sign to an amplifying circuit that has a gain greater than 1."}]},{"cat":"02","type":"fitb","stem":"An amplifier increases an input signal of 1 V to an output of 100 V. The voltage gain expressed in decibels is ____ dB.","subtype":"value","answer":["40","40.0"],"caseSensitive":false,"hint":"Use dB = 20 log(Vout / Vin).","fb":"The ratio is 100 / 1 = 100; log(100) = 2; multiplying by 20 gives 40 dB."},{"cat":"02","type":"mcq","stem":"Which formula correctly expresses power gain or attenuation in decibels?","options":[{"t":"dB = 20 log(Pout / Pin)","c":false,"fb":"Uses the voltage/current multiplier (20) instead of the power multiplier (10)."},{"t":"dB = 10 log(Pin / Pout)","c":false,"fb":"Inverts the ratio by placing input power over output power."},{"t":"dB = 10 log(Pout / Pin)","c":true,"fb":"Accurately identifies dB = 10 log(Pout / Pin) as the power decibel formula."},{"t":"dB = 10 * (Pout / Pin)","c":false,"fb":"Omits the base-10 logarithm operation."}]},{"cat":"02","type":"scenario","stem":"What is the gain/attenuation of the filter expressed in decibels?","context":"A bandpass filter inserted into an antenna transmission line receives an input power of Pin = 60 mW and delivers an output power of Pout = 3 mW due to insertion loss.","options":[{"t":"-13.01 dB","c":true,"fb":"Correctly computes ratio 3 / 60 = 0.05, log(0.05) ≈ -1.301, and 10 * (-1.301) = -13.01 dB."},{"t":"-26.02 dB","c":false,"fb":"Uses the voltage multiplier of 20 instead of 10 for power (20 log(0.05))."},{"t":"+13.01 dB","c":false,"fb":"Disregards the negative sign produced when the ratio is less than 1."},{"t":"-1.30 dB","c":false,"fb":"Forgets to multiply the logarithm result by 10."}]},{"cat":"02","type":"fitb","stem":"A power amplifier receives an input power of 10 mW and outputs 1000 mW. The power gain of this amplifier in decibels is ____ dB.","subtype":"value","answer":["20","20.0"],"caseSensitive":false,"hint":"Apply the power decibel formula: dB = 10 log(Pout / Pin).","fb":"The power ratio is 1000 / 10 = 100; log(100) = 2; multiplying by 10 yields 20 dB."},{"cat":"02","type":"mcq","stem":"In decibel analysis, what does a negative decibel (-dB) value signify about a circuit stage?","options":[{"t":"The circuit is oscillating and generating excessive harmonic distortion","c":false,"fb":"Associates negative decibels with instability rather than attenuation."},{"t":"The stage exhibits attenuation or circuit loss where the gain is less than 1","c":true,"fb":"Accurately identifies that negative dB corresponds to attenuation or a gain factor below unity."},{"t":"The stage has amplified the signal with a 180° phase inversion","c":false,"fb":"Confuses a negative decibel magnitude with AC phase angle inversion."},{"t":"The circuit has achieved infinite voltage gain","c":false,"fb":"Misunderstands the physical meaning of negative logarithmic values."}]},{"cat":"02","type":"multi","stem":"Which statements accurately describe decibel polarity? Select the TWO correct statements regarding decibel sign conventions.","options":[{"t":"A circuit that amplifies a signal produces a positive decibel value","c":true,"fb":"Accurately states that gain greater than 1 results in positive dB."},{"t":"A circuit with an output amplitude lower than its input produces a negative decibel value","c":true,"fb":"Accurately states that attenuation/loss produces negative dB."},{"t":"A negative decibel value indicates that the output power is greater than the input power","c":false,"fb":"Claims negative dB represents amplification rather than loss."},{"t":"A positive decibel value indicates that the circuit has a linear gain factor between 0 and 1","c":false,"fb":"Confuses the linear gain range of attenuation with positive decibels."},{"t":"A decibel calculation of 0 dB indicates that the circuit is completely attenuating the signal to 0 Volts","c":false,"fb":"Mistakenly assumes 0 dB means zero output rather than unity gain (Vout = Vin)."}]},{"cat":"02","type":"fitb","stem":"In electronic communication, the rate of repetitive wave oscillations measured in cycles per second (cps) is defined as the unit named ____, named after a pioneer in electromagnetics.","subtype":"term","answer":["hertz","Hz"],"caseSensitive":false,"hint":"1 cps = 1 Hz, named after Heinrich Hertz.","fb":"Frequency in cycles per second is expressed in hertz (Hz) in honor of Heinrich Hertz."},{"cat":"02","type":"mcq","stem":"If a periodic alternating current completes 330 cycles in one second, what is its frequency expressed in standard units?","options":[{"t":"330 Hz","c":true,"fb":"Accurately applies the equivalence 1 cps = 1 Hz, yielding 330 Hz."},{"t":"3.3 kHz","c":false,"fb":"Introduces an incorrect metric scaling factor of 10."},{"t":"330 MHz","c":false,"fb":"Confuses base hertz with megahertz (10^6)."},{"t":"33 cps/s","c":false,"fb":"Creates a non-standard squared-time unit."}]},{"cat":"02","type":"mcq","stem":"Which of the following correctly pairs an SI metric prefix with its exact power of 10 multiplier used in frequency scaling?","options":[{"t":"Kilo (k) = 10^2","c":false,"fb":"Uses 10^2 (hundred) instead of 10^3 (thousand)."},{"t":"Mega (M) = 10^6","c":true,"fb":"Correctly identifies Mega (M) as representing 10^6 (1,000,000)."},{"t":"Giga (G) = 10^12","c":false,"fb":"Confuses Giga (10^9) with Tera (10^12)."},{"t":"Tera (T) = 10^9","c":false,"fb":"Confuses Tera (10^12) with Giga (10^9)."}]},{"cat":"02","type":"multi","stem":"Which frequency expressions correctly apply metric prefixes? Select the TWO correct frequency simplifications using standard SI prefixes.","options":[{"t":"8,000,000 Hz can be simplified as 8 MHz","c":true,"fb":"Correctly identifies that 8 * 10^6 Hz = 8 MHz."},{"t":"18,500,000,000 Hz can be simplified as 18.5 GHz","c":true,"fb":"Correctly identifies that 18.5 * 10^9 Hz = 18.5 GHz."},{"t":"3,000,000 Hz can be simplified as 30 kHz","c":false,"fb":"Uses an incorrect scale factor (10^5) instead of Mega (10^6)."},{"t":"450,000 Hz can be simplified as 4.5 MHz","c":false,"fb":"Scales by 10^5 instead of 10^6, misrepresenting the frequency by a factor of 10."},{"t":"12,000,000,000,000 Hz can be simplified as 12 GHz","c":false,"fb":"Confuses Tera (10^12) with Giga (10^9)."}]},{"cat":"02","type":"fitb","stem":"Electromagnetic waves propagate through free space at the speed of light (c), which equals exactly ____ m/s.","subtype":"value","answer":["300000000","3 x 10^8","3x10^8","3*10^8","300000000 m/s"],"caseSensitive":false,"hint":"Enter the full numeric value in meters per second without commas (e.g. 300000000 or 3 x 10^8).","fb":"The speed of light in free space is 300,000,000 m/s (3 * 10^8 m/s)."},{"cat":"02","type":"mcq","stem":"What is the mathematical relationship between the frequency (f) and wavelength (λ) of an electromagnetic wave?","options":[{"t":"λ = f / c","c":false,"fb":"Inverts the numerator and denominator in the wave equation."},{"t":"λ = c * f","c":false,"fb":"Multiplies speed of light by frequency instead of dividing."},{"t":"λ = c / f","c":true,"fb":"Correctly identifies that wavelength equals the speed of light divided by frequency."},{"t":"λ = (c + f) / 2","c":false,"fb":"Uses an arithmetic average instead of an inverse proportional ratio."}]},{"cat":"02","type":"fitb","stem":"A radio signal operates at a frequency of 3 MHz. Using the formula λ (m) = 300 / f (in MHz), the wavelength of this signal is ____ meters.","subtype":"value","answer":["100","100.0","100 m"],"caseSensitive":false,"hint":"Divide 300 by the frequency in MHz: λ = 300 / 3.","fb":"Dividing 300 by 3 MHz gives a wavelength of 100 meters."},{"cat":"02","type":"scenario","stem":"What is the physical wavelength (λ) of the radiated electromagnetic wave in free space?","context":"An RF broadcast engineer is tuning a VHF transmitter operating at a carrier frequency of 150 MHz.","options":[{"t":"0.5 meters","c":false,"fb":"Inverts the formula by dividing 150 MHz by 300 (f / 300)."},{"t":"2.0 meters","c":true,"fb":"Correctly applies λ = 300 / 150 MHz = 2.0 meters."},{"t":"45.0 meters","c":false,"fb":"Multiplies 300 by 150 and misplaces the decimal."},{"t":"20.0 meters","c":false,"fb":"Introduces a factor-of-ten scaling error during division."}]},{"cat":"02","type":"multi","stem":"Which statements correctly characterize wavelength and wave propagation? Select the TWO correct statements regarding wavelength and wave physical characteristics.","options":[{"t":"Wavelength is the distance occupied by one full cycle of a wave, measured between corresponding peaks of electric or magnetic fields","c":true,"fb":"Accurately reflects the physical definition of wavelength."},{"t":"As the frequency of an electromagnetic wave increases, its wavelength increases proportionally","c":false,"fb":"Assumes frequency and wavelength are directly proportional rather than inversely proportional."},{"t":"One meter is equivalent to 39.37 inches","c":true,"fb":"Accurately identifies the metric-to-imperial conversion factor specified in the text."},{"t":"Wavelength in electronic communication is represented by the Greek letter delta (Δ)","c":false,"fb":"Identifies delta instead of the Greek letter lambda (λ)."},{"t":"The wavelength of a signal propagating in free space is completely independent of the speed of light","c":false,"fb":"Ignores the fundamental governing role of the propagation velocity c."}]},{"cat":"02","type":"mcq","stem":"Which of the following is excluded from the definition of the electromagnetic spectrum?","options":[{"t":"Signals carried directly through physical cables","c":true,"fb":"Correctly identifies that signals confined to cables are excluded from the free-space EM spectrum definition."},{"t":"Invisible electromagnetic radiation such as infrared and ultraviolet light","c":false,"fb":"Incorrectly believes invisible light waves are excluded from the EM spectrum."},{"t":"High-frequency radar signals radiating into open space","c":false,"fb":"Believes radiated radar waves are excluded from the EM spectrum."},{"t":"Visible light frequencies illuminating the environment","c":false,"fb":"Believes visible light is excluded from the EM spectrum."}]},{"cat":"02","type":"mcq","stem":"Which frequency band and application pair correctly matches standard electromagnetic spectrum allocations?","options":[{"t":"Extremely Low Frequency (ELF): 30–300 GHz — Radar transmitters","c":false,"fb":"Confuses ELF (30–300 Hz) with EHF/SHF microwave bands."},{"t":"Very High Frequency (VHF): 30–300 MHz — FM radio and TV broadcasting","c":true,"fb":"Accurately pairs VHF (30–300 MHz) with FM radio and TV broadcasting."},{"t":"Ultra-High Frequency (UHF): 3–30 kHz — Submarine communications","c":false,"fb":"Confuses UHF (300 MHz–3 GHz) with VLF (3–30 kHz)."},{"t":"High Frequency (HF): 30–300 Hz — Alternating current power grids","c":false,"fb":"Confuses HF (3–300 MHz) with ELF (30–300 Hz)."}]},{"cat":"02","type":"multi","stem":"Which frequency band ranges and applications are accurately paired? Select the TWO correct spectrum band allocations.","options":[{"t":"Ultra-High Frequency (UHF) covers 300 MHz to 3 GHz and is used in walkie-talkies and two-way radios","c":true,"fb":"Accurately matches UHF parameters and applications."},{"t":"Super High Frequency (SHF) covers 3 to 30 GHz and is used for radar transmitters and wireless LANs","c":true,"fb":"Accurately matches SHF parameters and applications."},{"t":"Voice Frequency (VF) covers 30 to 300 kHz and is used for earthquake monitoring","c":false,"fb":"Confuses Voice Frequency (300–3000 Hz) with Low Frequency (30–300 kHz)."},{"t":"Medium Frequency (MF) covers 30 to 300 GHz and is used for GPS satellite navigation","c":false,"fb":"Confuses Medium Frequency (300 kHz–3 MHz) with Extremely High Frequency (30–300 GHz)."},{"t":"Very Low Frequency (VLF) covers 300 MHz to 3 GHz and is used for television broadcasting","c":false,"fb":"Confuses VLF (3–30 kHz) with UHF/VHF broadcast bands."}]},{"cat":"02","type":"fitb","stem":"The spectrum segment spanning 300 MHz to 3 GHz, commonly utilized for walkie-talkies and two-way radio communications, is abbreviated as ____.","subtype":"acronym","answer":["UHF"],"caseSensitive":false,"hint":"Ultra-High Frequency.","fb":"The 300 MHz to 3 GHz range is designated as Ultra-High Frequency (UHF)."},{"cat":"02","type":"scenario","stem":"According to the spectrum allocations, which band must the communication system utilize?","context":"A marine communications officer is selecting a frequency band capable of transmitting specialized radio signals to submerged submarines.","options":[{"t":"Medium Frequency (MF) operating between 300 kHz and 3 MHz","c":false,"fb":"Selects the AM radio broadcast band rather than the submarine band."},{"t":"Very Low Frequency (VLF) operating between 3 and 30 kHz","c":true,"fb":"Accurately identifies VLF (3–30 kHz) as the designated band for radio signals to submarines."},{"t":"Extremely High Frequency (EHF) operating between 30 and 300 GHz","c":false,"fb":"Selects the millimeter-wave Bluetooth/GPS band which cannot penetrate deep water."},{"t":"Super High Frequency (SHF) operating between 3 and 30 GHz","c":false,"fb":"Selects the radar/wireless LAN band instead of the submarine band."}]},{"cat":"02","type":"mcq","stem":"In the optical region of the electromagnetic spectrum, what are the wavelength boundaries defined for the visible spectrum?","options":[{"t":"0.7 to 10 μm","c":false,"fb":"Identifies the wavelength range for infrared radiation rather than visible light."},{"t":"0.4 to 0.8 μm","c":true,"fb":"Accurately identifies 0.4 to 0.8 μm (0.4 x 10^-6 m violet to 0.7/0.8 x 10^-6 m red) as the visible spectrum."},{"t":"10 to 100 μm","c":false,"fb":"Extends far beyond the visible range into the thermal infrared spectrum."},{"t":"0.01 to 0.1 μm","c":false,"fb":"Identifies the ultraviolet/X-ray region rather than the visible optical band."}]},{"cat":"03","type":"mcq","stem":"What is modulation?","sub":"modulation-definition","options":[{"t":"Passing raw message data unchanged through a transmission device","c":false,"fb":"This treats unchanged transmission as modulation even though no processing operation occurs."},{"t":"Displaying message voltage as a waveform on an oscilloscope","c":false,"fb":"This confuses observing a signal with processing it."},{"t":"Converting raw message data through a modulator for better transmission","c":true,"fb":"Modulation converts raw data into signals or waves to optimize transmission."},{"t":"Recovering message data from a waveform after reception","c":false,"fb":"This confuses a receiver-side recovery task with a transmitter-side process."}]},{"cat":"03","type":"scenario","stem":"Which process is the station performing?","sub":"modulation-definition","context":"A campus station converts a raw announcement into a signal or wave to optimize its transmission.","options":[{"t":"Modulation","c":true,"fb":"The station is converting raw message data into a form intended for optimized transmission."},{"t":"Time-domain display","c":false,"fb":"This mistakes signal observation for message preparation."},{"t":"Message recovery","c":false,"fb":"This places the operation on the receiving side of communication."},{"t":"Unchanged transmission","c":false,"fb":"This ignores the processing step described in the case."}]},{"cat":"03","type":"mcq","stem":"Which stated benefit of modulation helps a signal cover the greatest distance?","sub":"modulation-boosts-reach","options":[{"t":"Keeping the signal within the audio range","c":false,"fb":"This assumes remaining at the original audio frequencies improves reach."},{"t":"Making its oscilloscope display easier to read","c":false,"fb":"This confuses measurement convenience with transmission performance."},{"t":"Expanding the limits of human hearing","c":false,"fb":"This treats hearing limits as something modulation changes."},{"t":"Increasing its strength for maximum reach","c":true,"fb":"Modulation increases signal strength so it can achieve maximum reach."}]},{"cat":"03","type":"mcq","stem":"A remote station applies modulation because its signal does not reach the intended area. Which benefit matches that decision?","sub":"modulation-boosts-reach","options":[{"t":"A carrier frequency that stays constant","c":false,"fb":"This confuses a carrier characteristic with a transmission-range benefit."},{"t":"Greater signal strength and maximum reach","c":true,"fb":"The stated reach benefit comes from increasing the signal’s strength."},{"t":"A wider range of frequencies people can hear","c":false,"fb":"This assumes modulation changes the limits of human hearing."},{"t":"A clearer time-domain oscilloscope trace","c":false,"fb":"This treats displaying the signal as a way to extend its reach."}]},{"cat":"03","type":"mcq","stem":"Which description identifies the carrier signal before modulation?","sub":"carrier-signal-definition","options":[{"t":"A waveform steady in amplitude and frequency","c":true,"fb":"The unmodulated carrier is steady in both amplitude and frequency."},{"t":"The message selected for transmission","c":false,"fb":"This assigns the message role to the carrier."},{"t":"The output produced after modulation","c":false,"fb":"This assigns a post-process role to a pre-process waveform."},{"t":"A waveform already varying with the message","c":false,"fb":"This assumes message-driven variation exists before modulation occurs."}]},{"cat":"03","type":"multi","stem":"Which TWO properties identify a carrier signal before a broadcast message is applied? Select the TWO correct statements.","sub":"carrier-signal-definition","options":[{"t":"Its amplitude is steady.","c":true,"fb":"Steady amplitude is one defining property of the carrier before modulation."},{"t":"It is the message being transmitted.","c":false,"fb":"This confuses the source waveform with the message-bearing input."},{"t":"Its frequency is steady.","c":true,"fb":"Steady frequency is the carrier’s other defining property before modulation."},{"t":"It is the output after modulation.","c":false,"fb":"This places the carrier on the wrong side of the modulation process."},{"t":"It is the envelope around the AM waveform.","c":false,"fb":"This mistakes an outline around waveform peaks for the source waveform itself."}]},{"cat":"03","type":"mcq","stem":"What is the modulating signal?","sub":"modulating-signal-definition","options":[{"t":"The steady waveform used before modulation","c":false,"fb":"This assigns the carrier’s role to the message input."},{"t":"The message that must be transmitted","c":true,"fb":"The modulating signal contains the message intended for transmission."},{"t":"The output produced after modulation","c":false,"fb":"This selects a signal from the wrong side of the process."},{"t":"The circuit that combines two inputs","c":false,"fb":"This classifies processing hardware as a signal."}]},{"cat":"03","type":"multi","stem":"Which TWO inputs can serve as modulating signals in a broadcast? Select the TWO correct statements.","sub":"modulating-signal-definition","options":[{"t":"A news announcement entering the transmitter","c":true,"fb":"The announcement is message content intended for transmission."},{"t":"A steady RF waveform before modulation","c":false,"fb":"This confuses the source waveform with the message-bearing input."},{"t":"A music program entering the transmitter","c":true,"fb":"The music is message content intended for transmission."},{"t":"The output waveform after modulation","c":false,"fb":"This selects a signal produced at the wrong stage."},{"t":"The circuit combining the input signals","c":false,"fb":"This classifies a processing component as a message signal."}]},{"cat":"03","type":"mcq","stem":"Which description identifies the modulated signal?","sub":"modulated-signal-definition","options":[{"t":"The steady carrier before modulation","c":false,"fb":"This treats the original carrier as though it were the final output."},{"t":"The raw message entering the process","c":false,"fb":"This mistakes an input for the completed output."},{"t":"The microphone’s audio-frequency output","c":false,"fb":"This assumes an early input-stage signal has already completed modulation."},{"t":"The output signal produced after modulation","c":true,"fb":"The modulated signal is the resulting output of the modulation process."}]},{"cat":"03","type":"scenario","stem":"What is the waveform at the final point?","sub":"modulated-signal-definition","context":"A test bench marks three points: the message input, the steady carrier, and the waveform leaving the modulator.","options":[{"t":"Carrier signal","c":false,"fb":"This mistakes a pre-process waveform for the final output."},{"t":"Modulated signal","c":true,"fb":"The waveform leaving the modulation process is the modulated signal."},{"t":"Modulating signal","c":false,"fb":"This mistakes the message input for the resulting output."},{"t":"Transducer","c":false,"fb":"This classifies a hardware role as an output signal."}]},{"cat":"03","type":"mcq","stem":"Why is modulation applied to a signal that is unsuitable for a transmission device?","sub":"modulation-improves-unsuitable-signals","options":[{"t":"To pass the unsuitable signal through unchanged","c":false,"fb":"This assumes the incompatibility can simply be ignored."},{"t":"To display the signal on an oscilloscope","c":false,"fb":"This confuses observing the signal with making it usable."},{"t":"To improve the signal for the transmission device","c":true,"fb":"Modulation improves a signal that the device could not otherwise use properly."},{"t":"To modify the signal only after it is received","c":false,"fb":"This places the improvement at the wrong end of the link."}]},{"cat":"03","type":"mcq","stem":"A raw signal is unsuitable for the device that must transmit it. Which action reflects the purpose of modulation?","sub":"modulation-improves-unsuitable-signals","options":[{"t":"Process the signal before the transmission device","c":true,"fb":"Modulation improves the signal before the device transmits it."},{"t":"Send the unsuitable signal through unchanged","c":false,"fb":"This assumes the device can use an incompatible input without processing."},{"t":"Show the signal on a time-domain display","c":false,"fb":"This treats measurement as a remedy for incompatibility."},{"t":"Wait until reception before modifying it","c":false,"fb":"This moves the corrective operation to the wrong stage."}]},{"cat":"03","type":"fitb","stem":"The lower limit of the stated human audio spectrum is ____ Hz. Enter the bare number.","sub":"audio-spectrum-range","subtype":"value","answer":["20"],"caseSensitive":false,"fb":"The stated human audio spectrum begins at 20 Hz."},{"cat":"03","type":"fitb","stem":"A broadcast system covers the full stated human audio spectrum. Its upper limit is ____ kHz. Enter the bare number.","sub":"audio-spectrum-range","subtype":"value","answer":["20"],"caseSensitive":false,"fb":"The stated upper limit of the human audio spectrum is 20 kHz."},{"cat":"03","type":"mcq","stem":"What does amplitude modulation make possible for wireless transmission?","sub":"am-high-carries-low","options":[{"t":"A low-frequency signal carries a high-frequency signal","c":false,"fb":"This reverses the carrier-message frequency relationship."},{"t":"A high-frequency signal carries a low-frequency signal","c":true,"fb":"AM allows a high-frequency signal to carry a low-frequency message signal."},{"t":"A high-frequency signal replaces the original message","c":false,"fb":"This assumes carrying information requires discarding the message."},{"t":"The two signals remain separate during transmission","c":false,"fb":"This assumes no combining relationship is formed."}]},{"cat":"03","type":"scenario","stem":"What role does amplitude modulation provide?","sub":"am-high-carries-low","context":"A radio station needs to send low-frequency program audio wirelessly and introduces a high-frequency signal.","options":[{"t":"It makes the audio carry the high-frequency signal.","c":false,"fb":"This reverses which signal performs the carrying role."},{"t":"It replaces the program audio with the high-frequency signal.","c":false,"fb":"This treats the carrier as a substitute that erases the message."},{"t":"It sends the two signals separately without combining them.","c":false,"fb":"This assumes the signals remain unrelated during transmission."},{"t":"It makes the high-frequency signal carry the program audio.","c":true,"fb":"AM places the low-frequency audio on a high-frequency signal for transmission."}]},{"cat":"03","type":"mcq","stem":"Which relationship defines how the RF carrier responds to the modulating signal?","sub":"instantaneous-amplitude-proportional","options":[{"t":"Carrier amplitude varies in direct proportion.","c":true,"fb":"The carrier’s instantaneous amplitude follows the modulating signal proportionally."},{"t":"Carrier frequency varies in direct proportion.","c":false,"fb":"This assigns message-driven variation to the wrong carrier property."},{"t":"Carrier amplitude varies in inverse proportion.","c":false,"fb":"This assumes the two amplitudes move in opposite directions."},{"t":"Carrier amplitude remains unrelated and fixed.","c":false,"fb":"This assumes the message has no effect on carrier amplitude."}]},{"cat":"03","type":"mcq","stem":"A signal trace shows the modulating amplitude increasing. Which carrier response follows the stated relationship?","sub":"instantaneous-amplitude-proportional","options":[{"t":"Its frequency changes in the same proportion.","c":false,"fb":"This assigns the message’s influence to the wrong carrier property."},{"t":"Its instantaneous amplitude changes in the opposite way.","c":false,"fb":"This assumes an inverse response between the two amplitudes."},{"t":"Its instantaneous amplitude changes in direct proportion.","c":true,"fb":"The RF carrier’s instantaneous amplitude responds proportionally to the modulating signal."},{"t":"Its instantaneous amplitude remains unaffected.","c":false,"fb":"This treats carrier amplitude as independent of the message."}]},{"cat":"03","type":"fitb","stem":"At the input stage, a microphone receives an audio-frequency signal and acts as a ____.","sub":"microphone-transducer","subtype":"term","answer":["transducer"],"caseSensitive":false,"fb":"The microphone serves as the transducer that receives the audio-frequency input."},{"cat":"03","type":"mcq","stem":"During a live news broadcast, which statement correctly describes the microphone’s role before mixing?","sub":"microphone-transducer","options":[{"t":"It combines the input and converts it into RF.","c":false,"fb":"This assigns the mixer’s combining task to the microphone."},{"t":"It acts as a transducer receiving audio-frequency input.","c":true,"fb":"The microphone receives the audio input while serving as a transducer."},{"t":"It supplies the steady radio-frequency carrier waveform.","c":false,"fb":"This confuses the microphone with the source of the carrier."},{"t":"It sends the radio-frequency signal directly for broadcast.","c":false,"fb":"This skips the later transmitter stages and treats the microphone as the final RF source."}]},{"cat":"03","type":"fitb","stem":"The component that combines the input signal and turns it into a radio frequency acceptable to the transmission device is the ____.","sub":"mixer-converts-to-rf","subtype":"term","answer":["mixer"],"caseSensitive":false,"fb":"The mixer combines the input signal and produces the required radio-frequency signal."},{"cat":"03","type":"mcq","stem":"An audio-frequency input reaches a stage that combines it and produces RF acceptable to the transmission device. Which stage is being traced?","sub":"mixer-converts-to-rf","options":[{"t":"Microphone","c":false,"fb":"This assigns a later combining operation to the component that receives the input."},{"t":"Oscilloscope","c":false,"fb":"This confuses displaying a signal with processing it for transmission."},{"t":"Transmission device","c":false,"fb":"This assumes the destination of the processed signal performs the earlier combining stage."},{"t":"Mixer","c":true,"fb":"The mixer combines the input and turns it into an acceptable radio-frequency signal."}]},{"cat":"03","type":"mcq","stem":"Which description best defines amplitude modulation?","sub":"am-definition","options":[{"t":"Changing a signal’s amplitude","c":true,"fb":"Amplitude modulation focuses on modulating or changing signal amplitude."},{"t":"Changing a signal’s frequency","c":false,"fb":"This applies the modulation operation to a different signal property."},{"t":"Recovering a received message","c":false,"fb":"This confuses modulation with a receiver-side recovery operation."},{"t":"Plotting magnitude against frequency","c":false,"fb":"This confuses a representation of signals with a modulation process."}]},{"cat":"03","type":"mcq","stem":"Which statement characterizes amplitude modulation in a transmission system?","sub":"am-definition","options":[{"t":"The cycle frequency of an RF carrier is varied in proportion to an input signal while amplitude stays fixed","c":false,"fb":"Varying carrier frequency describes frequency modulation."},{"t":"The phase angle of an RF carrier is shifted to encode data while amplitude remains constant","c":false,"fb":"Altering phase describes phase modulation."},{"t":"The amplitude of an RF carrier wave is varied in accordance with an information-bearing message signal","c":true,"fb":"Amplitude modulation specifically focuses on altering the signal's amplitude."},{"t":"The incoming audio message is converted into discrete digital pulses without using an analog carrier","c":false,"fb":"Baseband digital transmission does not modulate an analog RF carrier."}]},{"cat":"03","type":"mcq","stem":"Which sequence correctly describes an AM communications system?","sub":"am-system-electrical-signal","options":[{"t":"Amplitude modification, then data-to-electrical conversion","c":false,"fb":"This reverses the order of the two operations."},{"t":"Data-to-electrical conversion, then the signal modifies only itself","c":false,"fb":"This collapses the message and the signal being modified into one."},{"t":"Data-to-electrical conversion, then the message changes another amplitude","c":true,"fb":"The electrical message signal is used to modify the amplitude of another signal."},{"t":"Data-to-electrical conversion, then the modulation process ends","c":false,"fb":"This treats an intermediate conversion as the completed process."}]},{"cat":"03","type":"mcq","stem":"A data-sending device has converted its data into an electrical message signal. A second signal is then introduced. What should happen next in the AM process?","sub":"am-system-electrical-signal","options":[{"t":"The message modifies the second signal’s amplitude.","c":true,"fb":"The electrical message signal is used to change the amplitude of another signal."},{"t":"The second signal is decoded back into raw data.","c":false,"fb":"This treats a transmitter-side stage as receiver-side recovery."},{"t":"The message changes only its own amplitude.","c":false,"fb":"This assumes the message and the signal being modified are the same signal."},{"t":"The process stops after the electrical conversion.","c":false,"fb":"This treats the first conversion as the entire AM process."}]},{"cat":"03","type":"mcq","stem":"Which statement describes the carrier during amplitude modulation?","sub":"carrier-frequency-constant","options":[{"t":"Its frequency changes while its amplitude stays constant.","c":false,"fb":"This swaps the behaviors of the carrier’s two properties."},{"t":"Its frequency and amplitude both remain constant.","c":false,"fb":"This assumes modulation leaves the carrier completely unchanged."},{"t":"Its frequency and amplitude both follow the message.","c":false,"fb":"This adds message-driven variation to both carrier properties."},{"t":"Its frequency stays constant while its amplitude follows the message.","c":true,"fb":"AM changes carrier amplitude while keeping carrier frequency constant."}]},{"cat":"03","type":"scenario","stem":"How should this observation be interpreted?","sub":"carrier-frequency-constant","context":"Music changes continuously while a transmitter’s carrier-frequency meter holds the same reading and the waveform height rises and falls.","options":[{"t":"The properties are reversed because frequency should follow the music.","c":false,"fb":"This swaps the expected behaviors of carrier frequency and amplitude."},{"t":"It shows the expected carrier behavior during amplitude modulation.","c":true,"fb":"The observation shows changing carrier amplitude with constant carrier frequency."},{"t":"It cannot be AM because both carrier properties should remain fixed.","c":false,"fb":"This assumes modulation leaves the entire carrier unchanged."},{"t":"It cannot be AM because both carrier properties should follow music.","c":false,"fb":"This assumes the message must vary both carrier properties."}]},{"cat":"03","type":"mcq","stem":"Which observation would conflict with the stated carrier behavior during amplitude modulation?","sub":"carrier-frequency-constant","options":[{"t":"Carrier height changes while the frequency meter holds its reading.","c":false,"fb":"This mistakes an ordinary vertical waveform change for a violation."},{"t":"Positive and negative peak heights change while frequency remains fixed.","c":false,"fb":"This treats peak-height movement as though the carrier’s cycle rate had changed."},{"t":"Carrier frequency shifts upward and downward as the message changes.","c":true,"fb":"Carrier frequency is supposed to remain constant during amplitude modulation."},{"t":"Envelope height varies while the carrier-frequency reading remains fixed.","c":false,"fb":"This confuses vertical envelope movement with carrier-frequency movement."}]},{"cat":"03","type":"mcq","stem":"When the modulating-signal amplitude increases, how does the carrier amplitude respond in AM?","sub":"modulating-amplitude-drives-carrier","options":[{"t":"It increases in direct proportion.","c":true,"fb":"AM makes the carrier height follow the increase in modulating-signal amplitude."},{"t":"It decreases in the same proportion.","c":false,"fb":"This assumes an inverse relationship between the two amplitudes."},{"t":"It remains at its original height.","c":false,"fb":"This confuses constant carrier frequency with constant carrier amplitude."},{"t":"It changes into a higher frequency.","c":false,"fb":"This treats an amplitude change as a change in the carrier’s cycle rate."}]},{"cat":"03","type":"scenario","stem":"What change should appear in the carrier waveform?","sub":"modulating-amplitude-drives-carrier","context":"A radio operator lowers the amplitude of the audio signal entering an AM stage.","options":[{"t":"Its amplitude should increase proportionally.","c":false,"fb":"This applies inverse tracking between the audio and carrier amplitudes."},{"t":"Its amplitude should decrease proportionally.","c":true,"fb":"Lower modulating amplitude produces a matching reduction in carrier amplitude."},{"t":"Its amplitude should remain unchanged.","c":false,"fb":"This mistakes the carrier’s constant frequency for constant height."},{"t":"Its cycle spacing should decrease.","c":false,"fb":"This assigns an amplitude adjustment to the carrier’s frequency."}]},{"cat":"03","type":"multi","stem":"Which TWO signal traces show the direct relationship between modulating amplitude and carrier amplitude? Select the TWO correct statements.","sub":"modulating-amplitude-drives-carrier","options":[{"t":"Modulating amplitude doubles; carrier amplitude doubles.","c":true,"fb":"Both amplitudes increase by the same proportional change."},{"t":"Modulating amplitude halves; carrier amplitude halves.","c":true,"fb":"Both amplitudes decrease by the same proportional change."},{"t":"Modulating amplitude rises; carrier amplitude falls.","c":false,"fb":"This trace assumes that the amplitudes move in opposite directions."},{"t":"Modulating amplitude falls; carrier height stays fixed.","c":false,"fb":"This trace treats carrier height as constant during modulation."},{"t":"Modulating amplitude rises; only carrier frequency rises.","c":false,"fb":"This trace changes the carrier’s cycle rate instead of its amplitude."}]},{"cat":"03","type":"mcq","stem":"What determines changes in both the positive and negative peaks of a modulated carrier?","sub":"carrier-peaks-follow-modulating","options":[{"t":"The carrier’s fixed frequency","c":false,"fb":"This treats cycle rate as the cause of changes in peak height."},{"t":"The drawn envelope as a separate input","c":false,"fb":"This treats a waveform boundary as an independent control signal."},{"t":"The modulating signal","c":true,"fb":"Both sets of carrier peaks change according to the modulating signal."},{"t":"Separate controls for each polarity","c":false,"fb":"This assumes the positive and negative portions respond independently."}]},{"cat":"03","type":"scenario","stem":"Which carrier-peak behavior should appear?","sub":"carrier-peaks-follow-modulating","context":"A message waveform rises and then falls while modulating a carrier.","options":[{"t":"Only the positive peaks should follow the message.","c":false,"fb":"This assumes that only one polarity responds to modulation."},{"t":"Both positive and negative peak magnitudes should follow the message.","c":true,"fb":"The peaks on both sides depend on the modulating signal."},{"t":"Peak spacing should change while peak height stays fixed.","c":false,"fb":"This treats carrier frequency as the quantity controlled by the message."},{"t":"The envelope should change first and force the peaks to move.","c":false,"fb":"This treats the drawn boundary as a separate causal signal."}]},{"cat":"03","type":"fitb","stem":"The imaginary line connecting the positive and negative peaks of an AM carrier waveform is the ____.","sub":"envelope-definition","subtype":"term","answer":["envelope"],"caseSensitive":false,"fb":"The envelope is the imaginary boundary formed by the changing carrier peaks."},{"cat":"03","type":"mcq","stem":"A technician draws a dashed boundary through the outer peaks of an AM waveform. What should the boundary be labeled?","sub":"envelope-definition","options":[{"t":"Sideband","c":false,"fb":"This confuses a frequency-spectrum component with a time-domain boundary."},{"t":"Carrier","c":false,"fb":"This confuses the complete rapid waveform with the line around its peaks."},{"t":"Oscilloscope time axis","c":false,"fb":"This mistakes a display reference line for part of the signal shape."},{"t":"Envelope","c":true,"fb":"The dashed boundary joining the carrier peaks is the envelope."}]},{"cat":"03","type":"multi","stem":"Which TWO features form the envelope on a simplified AM waveform? Select the TWO correct statements.","sub":"envelope-definition","options":[{"t":"An imaginary boundary joining successive positive peaks","c":true,"fb":"The upper carrier peaks trace one part of the envelope."},{"t":"The equally spaced carrier strokes","c":false,"fb":"This identifies the rapid carrier representation rather than its outer boundary."},{"t":"An imaginary boundary joining successive negative peaks","c":true,"fb":"The lower carrier peaks trace the other part of the envelope."},{"t":"A new spectral line above the carrier","c":false,"fb":"This imports a frequency-domain component into a waveform-boundary question."},{"t":"The horizontal time baseline","c":false,"fb":"This mistakes the graph’s reference axis for a signal feature."}]},{"cat":"03","type":"mcq","stem":"What do the equally spaced vertical lines of varying height represent in a simplified AM waveform?","sub":"simplified-waveform-vertical-lines","options":[{"t":"The low-frequency modulating signal alone","c":false,"fb":"This treats the message waveform as the repeated high-frequency strokes."},{"t":"The high-frequency carrier with varying amplitude","c":true,"fb":"Equal spacing represents constant carrier frequency, while height follows the modulating signal."},{"t":"The sidebands arranged along a frequency axis","c":false,"fb":"This confuses a time-domain waveform device with spectral components."},{"t":"The oscilloscope’s graticule divisions","c":false,"fb":"This treats the waveform marks as part of the display grid."}]},{"cat":"03","type":"scenario","stem":"How should the drawing be corrected?","sub":"simplified-waveform-vertical-lines","context":"An illustrator draws unevenly spaced vertical lines of equal height to represent an AM carrier.","options":[{"t":"Keep the drawing and label the lines as the modulating signal.","c":false,"fb":"This misidentifies the repeated strokes as the message waveform."},{"t":"Keep every height fixed and vary only the spacing.","c":false,"fb":"This encodes the message by carrier spacing instead of carrier height."},{"t":"Use equal spacing and vary the heights with the modulating signal.","c":true,"fb":"The simplified drawing keeps carrier frequency constant while showing changing amplitude."},{"t":"Replace the strokes with two equal-height sideband lines.","c":false,"fb":"This substitutes a frequency-domain spectrum for the simplified waveform."}]},{"cat":"03","type":"fitb","stem":"To display voltage or current variations as they occur over time, a technician uses an ____ screen.","sub":"time-domain-definition","subtype":"term","answer":["oscilloscope"],"caseSensitive":false,"fb":"An oscilloscope displays voltage or current variations in the time domain."},{"cat":"03","type":"mcq","stem":"Which description identifies a time-domain signal?","sub":"time-domain-definition","options":[{"t":"Signal magnitudes arranged across a frequency axis","c":false,"fb":"This describes a spectrum and substitutes frequency for elapsed time."},{"t":"Only voltage values, with current variations excluded","c":false,"fb":"This incorrectly limits the time domain to one electrical quantity."},{"t":"A waveform generated by the oscilloscope screen","c":false,"fb":"This treats the measuring display as the source of the observed signal."},{"t":"Voltage or current variations over time on an oscilloscope","c":true,"fb":"A time-domain display shows how voltage or current changes with time."}]},{"cat":"03","type":"mcq","stem":"What are the new frequencies generated above and below the carrier frequency during AM?","sub":"sidebands-definition","options":[{"t":"Sidebands","c":true,"fb":"Sidebands are the new upper and lower frequencies produced during modulation."},{"t":"Carrier frequencies","c":false,"fb":"This classifies the original central signal as though it were newly generated."},{"t":"Envelopes","c":false,"fb":"This confuses a time-domain waveform boundary with spectral frequencies."},{"t":"Bandwidths","c":false,"fb":"This treats a frequency span as though it were an individual component."}]},{"cat":"03","type":"scenario","stem":"How should the two new lines be classified?","sub":"sidebands-definition","context":"A spectrum analyzer initially shows one carrier line. After modulation, one new line appears above it and another appears below it.","options":[{"t":"Duplicated carrier lines","c":false,"fb":"This assumes every spectral line represents the original carrier."},{"t":"Upper and lower envelope edges","c":false,"fb":"This transfers a time-domain boundary into a frequency-domain display."},{"t":"Sidebands","c":true,"fb":"Modulation produces sideband frequencies on both sides of the carrier."},{"t":"Bandwidth boundaries","c":false,"fb":"This confuses individual components with the span measured between spectral limits."}]},{"cat":"03","type":"multi","stem":"A frequency-spectrum sketch labels five features. Which TWO labeled features are sidebands? Select the TWO correct options.","sub":"sidebands-definition","options":[{"t":"The original line at \\(f_c\\)","c":false,"fb":"This treats the existing carrier as a modulation-generated frequency."},{"t":"A new component above \\(f_c\\)","c":true,"fb":"A newly generated frequency above the carrier is a sideband."},{"t":"The outer boundary of the time waveform","c":false,"fb":"This imports an envelope feature into the frequency spectrum."},{"t":"A new component below \\(f_c\\)","c":true,"fb":"A newly generated frequency below the carrier is a sideband."},{"t":"The distance between the outer components","c":false,"fb":"This identifies a frequency span rather than a spectral component."}]},{"cat":"03","type":"mcq","stem":"An AM waveform is created by more than one frequency. Which representation is preferred for showing its components?","sub":"frequency-domain-preferred","options":[{"t":"A time-domain trace","c":false,"fb":"This emphasizes variation over time without separating the frequency components."},{"t":"A frequency-domain plot","c":true,"fb":"The frequency domain shows the multiple frequencies that create the AM waveform."},{"t":"An envelope outline alone","c":false,"fb":"This assumes the outer waveform shape identifies each spectral component."},{"t":"A carrier-only sketch","c":false,"fb":"This omits the additional frequencies produced during modulation."}]},{"cat":"03","type":"fitb","stem":"A transmitter produces a carrier together with additional modulation-generated frequencies. To view them at separate positions, an engineer displays the signal in the ____.","sub":"frequency-domain-preferred","subtype":"term","answer":["frequency domain","frequency-domain"],"caseSensitive":false,"fb":"The frequency domain separates the frequencies that combine to create the AM waveform."},{"cat":"03","type":"fitb","stem":"A carrier is 1000 kHz and its modulating frequency is 5 kHz. Calculate \\(f_{USB}\\). Enter the bare number in kHz: ____.","sub":"usb-formula","subtype":"value","answer":["1005"],"caseSensitive":false,"fb":"The upper sideband is \\(f_c+f_m=1000+5=1005\\) kHz."},{"cat":"03","type":"mcq","stem":"A transmitter uses \\(f_c=720\\) kHz and \\(f_m=4\\) kHz. What is its upper-sideband frequency?","sub":"usb-formula","options":[{"t":"716 kHz","c":false,"fb":"This subtracts the frequency offset and therefore uses the lower-sideband operation."},{"t":"720 kHz","c":false,"fb":"This leaves the carrier unchanged and ignores the modulation-generated offset."},{"t":"8 kHz","c":false,"fb":"This doubles the modulating frequency and confuses a bandwidth result with a sideband frequency."},{"t":"724 kHz","c":true,"fb":"The upper sideband is \\(720+4=724\\) kHz."}]},{"cat":"03","type":"fitb","stem":"A carrier is 1000 kHz and its modulating frequency is 5 kHz. Calculate \\(f_{LSB}\\). Enter the bare number in kHz: ____.","sub":"lsb-formula","subtype":"value","answer":["995"],"caseSensitive":false,"fb":"The lower sideband is \\(f_c-f_m=1000-5=995\\) kHz."},{"cat":"03","type":"scenario","stem":"Which frequency is the lower sideband?","sub":"lsb-formula","context":"A channel planner assigns a 680 kHz carrier with a 3 kHz modulating signal.","options":[{"t":"683 kHz","c":false,"fb":"This adds the offset and therefore uses the upper-sideband operation."},{"t":"677 kHz","c":true,"fb":"The lower sideband is \\(680-3=677\\) kHz."},{"t":"6 kHz","c":false,"fb":"This doubles the modulating frequency and reports a bandwidth value."},{"t":"680 kHz","c":false,"fb":"This reports the carrier and ignores the lower modulation-generated component."}]},{"cat":"03","type":"fitb","stem":"An AM signal has a modulating frequency of 5 kHz. Calculate its total bandwidth. Enter the bare number in kHz: ____.","sub":"bandwidth-formula","subtype":"value","answer":["10"],"caseSensitive":false,"fb":"Total AM bandwidth is \\(2f_m=2(5)=10\\) kHz."},{"cat":"03","type":"mcq","stem":"A spectrum shows \\(f_{USB}=1008\\) kHz and \\(f_{LSB}=992\\) kHz. What is the total bandwidth?","sub":"bandwidth-formula","options":[{"t":"8 kHz","c":false,"fb":"This reports only the one-sided offset from the center frequency."},{"t":"1000 kHz","c":false,"fb":"This reports the midpoint of the two sidebands rather than their separation."},{"t":"16 kHz","c":true,"fb":"The bandwidth is \\(1008-992=16\\) kHz."},{"t":"2000 kHz","c":false,"fb":"This adds the two sideband frequencies instead of measuring the span between them."}]},{"cat":"03","type":"multi","stem":"Which TWO entries use a valid AM bandwidth calculation? Select the TWO correct entries.","sub":"bandwidth-formula","options":[{"t":"\\(f_m=7\\) kHz gives \\(BW=14\\) kHz.","c":true,"fb":"Doubling the modulating frequency gives the total bandwidth."},{"t":"\\(f_m=7\\) kHz gives \\(BW=7\\) kHz.","c":false,"fb":"This reports only one modulating-frequency offset."},{"t":"\\(f_{USB}=1006\\) kHz and \\(f_{LSB}=994\\) kHz give \\(BW=2000\\) kHz.","c":false,"fb":"This adds the sideband frequencies instead of finding their separation."},{"t":"\\(f_{USB}=1006\\) kHz and \\(f_{LSB}=994\\) kHz give \\(BW=12\\) kHz.","c":true,"fb":"Subtracting the lower sideband from the upper sideband gives 12 kHz."},{"t":"\\(f_c=1000\\) kHz gives \\(BW=1000\\) kHz.","c":false,"fb":"This treats the carrier frequency itself as the occupied frequency span."}]},{"cat":"03","type":"mcq","stem":"Which axis arrangement is correct for an AM frequency-domain plot?","sub":"frequency-domain-axes","options":[{"t":"Horizontal: time; vertical: frequency","c":false,"fb":"This imports the horizontal coordinate from a time-domain display."},{"t":"Horizontal: frequency; vertical: signal magnitude","c":true,"fb":"Frequency is plotted horizontally, while voltage, current, or power magnitude is plotted vertically."},{"t":"Horizontal: magnitude; vertical: frequency","c":false,"fb":"This reverses the independent and magnitude axes."},{"t":"Horizontal: voltage; vertical: current","c":false,"fb":"This places magnitude quantities on both axes and omits the frequency coordinate."}]},{"cat":"03","type":"multi","stem":"An analyzer is being configured for an AM frequency-domain display. Which TWO axis labels are valid? Select the TWO correct labels.","sub":"frequency-domain-axes","options":[{"t":"Horizontal axis: frequency","c":true,"fb":"Frequency belongs on the horizontal axis of the spectrum."},{"t":"Horizontal axis: time","c":false,"fb":"This carries a time-domain coordinate into a frequency-domain display."},{"t":"Vertical axis: frequency","c":false,"fb":"This places frequency on the magnitude axis."},{"t":"Horizontal axis: power magnitude","c":false,"fb":"This assigns a magnitude quantity to the horizontal coordinate."},{"t":"Vertical axis: current magnitude","c":true,"fb":"Current is one of the signal magnitudes that may be shown vertically."}]},{"cat":"03","type":"mcq","stem":"Which amplitude relationship prevents the distortion and incorrect transmission described for AM?","sub":"vm-less-than-vc","options":[{"t":"\\(V_m=V_c\\)","c":false,"fb":"This assumes equal amplitudes satisfy a condition that requires a strict inequality."},{"t":"\\(V_m>V_c\\)","c":false,"fb":"This permits the modulating amplitude to exceed the carrier amplitude."},{"t":"The amplitude order is irrelevant.","c":false,"fb":"This ignores the required relationship between the two peak values."},{"t":"\\(V_m<V_c\\)","c":true,"fb":"Keeping the modulating amplitude below the carrier amplitude prevents the stated distortion."}]},{"cat":"03","type":"scenario","stem":"How should the setting be assessed?","sub":"vm-less-than-vc","context":"A transmitter is adjusted to \\(V_m=6.5\\) V and \\(V_c=8\\) V.","options":[{"t":"It satisfies the required amplitude relationship.","c":true,"fb":"The modulating amplitude is lower than the carrier amplitude."},{"t":"\\(V_m\\) should be raised to 8 V to prevent distortion.","c":false,"fb":"This treats equal peak values as the desired condition."},{"t":"\\(V_c\\) should be lowered below 6.5 V.","c":false,"fb":"This reverses which signal must have the larger peak amplitude."},{"t":"\\(V_m\\) may be raised above 8 V without concern.","c":false,"fb":"This assumes that exceeding the carrier amplitude has no consequence."}]},{"cat":"03","type":"multi","stem":"Which TWO transmitter settings satisfy \\(V_m<V_c\\)? Select the TWO correct settings.","sub":"vm-less-than-vc","options":[{"t":"\\(V_m=8\\) V and \\(V_c=8\\) V","c":false,"fb":"This assumes equal amplitudes meet a strict less-than condition."},{"t":"\\(V_m=4\\) V and \\(V_c=10\\) V","c":true,"fb":"The modulating amplitude is below the carrier amplitude."},{"t":"\\(V_m=9\\) V and \\(V_c=8\\) V","c":false,"fb":"This allows the modulating amplitude to exceed the carrier amplitude."},{"t":"\\(V_m=7\\) V and \\(V_c=8\\) V","c":true,"fb":"The setting preserves the required amplitude order."},{"t":"\\(V_m=6\\) V and \\(V_c=5\\) V because the carrier should be smaller","c":false,"fb":"This explicitly reverses the required relationship."}]},{"cat":"03","type":"mcq","stem":"Which equation gives the modulation index \\(m\\) from the peak modulating voltage \\(V_m\\) and peak carrier voltage \\(V_c\\)?","sub":"modulation-index-formula","options":[{"t":"\\(m=V_c/V_m\\)","c":false,"fb":"This reflects the reversed-ratio misconception; the numerator and denominator have exchanged roles."},{"t":"\\(m=V_m/V_c\\)","c":true,"fb":"Modulation index compares the peak modulating voltage with the peak carrier voltage."},{"t":"\\(m=(V_m+V_c)/2\\)","c":false,"fb":"This mistakes an average-voltage calculation for an index calculation."},{"t":"\\(m=(V_m-V_c)/2\\)","c":false,"fb":"This confuses the index with a half-difference calculation used for envelope readings."}]},{"cat":"03","type":"scenario","stem":"What is the modulation index?","sub":"modulation-index-formula","context":"During transmitter setup, the peak modulating voltage is 3.0 V and the peak unmodulated carrier voltage is 5.0 V.","options":[{"t":"1.67","c":false,"fb":"This results from the reversed-ratio misconception."},{"t":"4.00","c":false,"fb":"This treats the two voltages as values to be averaged."},{"t":"60","c":false,"fb":"This confuses the fractional index with its percentage-scaled form."},{"t":"0.60","c":true,"fb":"Dividing 3.0 V by 5.0 V gives a modulation index of 0.60."}]},{"cat":"03","type":"multi","stem":"Select the TWO calculation records that apply the modulation-index formula correctly.","sub":"modulation-index-formula","options":[{"t":"\\(V_m=2\\text{ V}, V_c=8\\text{ V}: m=2/8\\)","c":true,"fb":"The peak modulating voltage is compared with the peak carrier voltage."},{"t":"\\(V_m=2\\text{ V}, V_c=8\\text{ V}: m=8/2\\)","c":false,"fb":"This record shows the reversed-ratio misconception."},{"t":"\\(V_m=2\\text{ V}, V_c=8\\text{ V}: m=(8+2)/2\\)","c":false,"fb":"This record substitutes an average-voltage calculation."},{"t":"\\(V_m=4\\text{ V}, V_c=10\\text{ V}: m=4/10\\)","c":true,"fb":"The two peak voltages are arranged in the required ratio."},{"t":"\\(V_m=4\\text{ V}, V_c=10\\text{ V}: m=4\\times10\\)","c":false,"fb":"This record treats the two voltage values as factors in a product."}]},{"cat":"03","type":"mcq","stem":"Which term can replace “modulation index” without changing its meaning?","sub":"modulation-index-aliases","options":[{"t":"Percentage modulation","c":false,"fb":"This confuses a scaled presentation of the index with one of its listed equivalent names."},{"t":"Carrier amplitude","c":false,"fb":"This treats a measured signal quantity as the name of the index."},{"t":"Degree of modulation","c":true,"fb":"Degree of modulation is another name for the modulation index."},{"t":"Envelope voltage","c":false,"fb":"This treats a waveform measurement as the name of the index."}]},{"cat":"03","type":"multi","stem":"Select the THREE names that refer to the modulation index.","sub":"modulation-index-aliases","options":[{"t":"Degree of modulation","c":true,"fb":"This is an accepted equivalent name for modulation index."},{"t":"Percentage modulation","c":false,"fb":"This is the misconception that the scaled reporting form is itself an equivalent name."},{"t":"Modulating factor","c":true,"fb":"This is an accepted equivalent name for modulation index."},{"t":"Carrier amplitude","c":false,"fb":"This confuses a carrier measurement with the name of the index."},{"t":"Modulating coefficient","c":true,"fb":"This is an accepted equivalent name for modulation index."}]},{"cat":"03","type":"mcq","stem":"Which interpretation of \\(V_m\\) and \\(V_c\\) is correct when calculating modulation index?","sub":"modulation-index-peak-values","options":[{"t":"Both are peaks; \\(V_c\\) is unmodulated.","c":true,"fb":"Both quantities are peak values, and the carrier value is taken before modulation."},{"t":"\\(V_m\\) is an average; \\(V_c\\) is a peak.","c":false,"fb":"This uses a nonpeak measurement for the modulating voltage."},{"t":"Both are peaks; \\(V_c\\) is modulated.","c":false,"fb":"This uses the carrier after its amplitude has already been changed."},{"t":"Both are instantaneous waveform samples.","c":false,"fb":"This mistakes momentary readings for the specified peak values."}]},{"cat":"03","type":"scenario","stem":"Which pair should the technician use?","sub":"modulation-index-peak-values","context":"A technician is recording the two inputs needed for the modulation-index formula before an AM carrier is modulated.","options":[{"t":"RMS \\(V_m\\) and peak unmodulated \\(V_c\\)","c":false,"fb":"This substitutes a nonpeak measurement for the modulating voltage."},{"t":"Peak \\(V_m\\) and peak modulated-carrier voltage","c":false,"fb":"This takes the carrier reading after modulation has changed it."},{"t":"Peak \\(V_m\\) and peak unmodulated \\(V_c\\)","c":true,"fb":"These are the specified peak quantities for the ratio."},{"t":"Peak \\(V_m\\) and instantaneous unmodulated \\(V_c\\)","c":false,"fb":"This assumes a momentary carrier sample can replace its peak value."}]},{"cat":"03","type":"fitb","stem":"A modulation index of 0.64 corresponds to ____ percent modulation. Enter the bare number.","sub":"percentage-modulation","subtype":"value","answer":["64"],"caseSensitive":false,"fb":"Percentage modulation is obtained by multiplying 0.64 by 100."},{"cat":"03","type":"mcq","stem":"A controller stores a modulation index of 0.375. Which operation converts it to percentage modulation?","sub":"percentage-modulation","options":[{"t":"Divide by 100","c":false,"fb":"This applies the conversion in the opposite direction."},{"t":"Add 100","c":false,"fb":"This treats percentage conversion as addition instead of scaling."},{"t":"Attach a percent sign","c":false,"fb":"This leaves the decimal unscaled and merely changes its label."},{"t":"Multiply by 100","c":true,"fb":"Multiplying the index by 100 converts it to percentage modulation."}]},{"cat":"03","type":"fitb","stem":"An AM transmitter has a peak unmodulated carrier voltage of 8 V and a peak modulating voltage of 6.5 V. Its modulation index is ____. Enter the decimal value.","sub":"worked-example-ratio-method","subtype":"value","answer":["0.8125"],"caseSensitive":false,"fb":"Dividing 6.5 V by 8 V gives a modulation index of 0.8125."},{"cat":"03","type":"mcq","stem":"What is the percentage modulation when \\(V_c=8\\text{ V}\\) and \\(V_m=6.5\\text{ V}\\)?","sub":"worked-example-ratio-method","options":[{"t":"0.8125%","c":false,"fb":"This labels the fractional index directly as a percentage."},{"t":"81.3%","c":true,"fb":"The ratio is 0.8125, which becomes 81.3% when expressed as a percentage."},{"t":"123.1%","c":false,"fb":"This comes from placing the carrier and modulating voltages in reversed roles."},{"t":"18.8%","c":false,"fb":"This treats the voltage shortfall as the modulation percentage."}]},{"cat":"03","type":"mcq","stem":"How can an oscilloscope be used to derive the modulation index?","sub":"oscilloscope-derives-m","options":[{"t":"Measure only the carrier frequency.","c":false,"fb":"This substitutes a frequency reading for the required voltage information."},{"t":"Read the completed index directly from the trace.","c":false,"fb":"This assumes the waveform display performs the calculation automatically."},{"t":"Measure modulation and carrier voltages, then find their ratio.","c":true,"fb":"The voltage measurements provide the values needed to calculate the index."},{"t":"Multiply the two measured voltage values.","c":false,"fb":"This treats the readings as factors in a product rather than inputs to an index calculation."}]},{"cat":"03","type":"mcq","stem":"A field technician has connected an oscilloscope to an AM transmitter. Which workflow produces the modulation index?","sub":"oscilloscope-derives-m","options":[{"t":"Read the relevant modulation and carrier voltages, then calculate their ratio.","c":true,"fb":"This uses the oscilloscope readings in the required calculation."},{"t":"Read the carrier frequency and use it as the index.","c":false,"fb":"This confuses a frequency measurement with the required voltage measurements."},{"t":"Record one envelope peak and label it as the index.","c":false,"fb":"This assumes one voltage reading alone represents the complete index."},{"t":"Multiply the two voltage readings shown by the trace.","c":false,"fb":"This applies the voltage-product misconception."}]},{"cat":"03","type":"fitb","stem":"An oscilloscope trace has \\(V_{\\max}=6\\text{ V}\\) and \\(V_{\\min}=2\\text{ V}\\). The peak modulating voltage \\(V_m\\) is ____ V. Enter the bare number.","sub":"vm-half-difference","subtype":"value","answer":["2"],"caseSensitive":false,"fb":"Half of the 4 V difference between the readings is 2 V."},{"cat":"03","type":"mcq","stem":"Which equation calculates the peak modulating voltage from the envelope extrema?","sub":"vm-half-difference","options":[{"t":"\\(V_m=(V_{\\max}+V_{\\min})/2\\)","c":false,"fb":"This uses an average-style sum instead of the required envelope difference."},{"t":"\\(V_m=V_{\\max}-V_{\\min}\\)","c":false,"fb":"This finds the full difference but omits the required half-step."},{"t":"\\(V_m=(V_{\\max}-V_{\\min})/2\\)","c":true,"fb":"The peak modulating voltage is half the difference between the peak and trough."},{"t":"\\(V_m=(V_{\\min}-V_{\\max})/2\\)","c":false,"fb":"This reverses the peak and trough during subtraction."}]},{"cat":"03","type":"mcq","stem":"Which statement correctly identifies \\(V_{\\max}\\) and \\(V_{\\min}\\) on an AM waveform?","sub":"vmax-vmin-meaning","options":[{"t":"\\(V_{\\max}\\) is the peak during modulation, and \\(V_{\\min}\\) is the trough.","c":true,"fb":"The two labels identify the highest and lowest envelope readings."},{"t":"\\(V_{\\max}\\) is the trough, and \\(V_{\\min}\\) is the peak.","c":false,"fb":"This reflects the swapped-extrema misconception."},{"t":"\\(V_{\\max}\\) is the unmodulated carrier peak, and \\(V_{\\min}\\) is the modulating-signal peak.","c":false,"fb":"This confuses envelope extrema with two separate signal quantities."},{"t":"\\(V_{\\max}\\) is the full peak-to-peak span, and \\(V_{\\min}\\) is the zero reference.","c":false,"fb":"This treats the labels as oscilloscope landmarks rather than envelope extrema."}]},{"cat":"03","type":"scenario","stem":"Which label belongs to this reading?","sub":"vmax-vmin-meaning","context":"While inspecting an AM envelope, a technician points to its narrowest section and records the lowest amplitude of the modulated wave.","options":[{"t":"\\(V_m\\)","c":false,"fb":"This confuses an envelope extremum with the peak modulating voltage."},{"t":"\\(V_c\\)","c":false,"fb":"This confuses an envelope extremum with the peak carrier voltage."},{"t":"\\(V_{\\max}\\)","c":false,"fb":"This swaps the labels assigned to the high and low envelope readings."},{"t":"\\(V_{\\min}\\)","c":true,"fb":"\\(V_{\\min}\\) labels the trough or lowest value of the modulated wave."}]},{"cat":"03","type":"mcq","stem":"How is \\(V_{\\max}\\) related to the peak-to-peak value of the AM signal?","sub":"vmax-half-peak-to-peak","options":[{"t":"It equals the full peak-to-peak value.","c":false,"fb":"This fails to reduce the complete span to its one-sided value."},{"t":"It equals one-half of the peak-to-peak value.","c":true,"fb":"\\(V_
