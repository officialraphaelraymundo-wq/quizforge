rom heat-driven electron motion."}]},{"cat":"05","type":"mcq","stem":"Minute random variations of resistance in semiconductor material produce which noise, also called excess noise?","sub":"flicker-noise","options":[{"t":"Flicker noise","c":true,"fb":"Minute random resistance variations in semiconductor material produce flicker (excess) noise."},{"t":"Shot noise","c":false,"fb":"Shot noise comes from random carrier paths."},{"t":"Transit-time noise","c":false,"fb":"Transit-time noise depends on carrier transit time."},{"t":"Thermal noise","c":false,"fb":"Thermal noise comes from heat in a conductor, not semiconductor resistance variation."}]},{"cat":"05","type":"mcq","stem":"Which noise is inversely proportional to frequency, so it is also called 1/f noise?","sub":"flicker-noise","options":[{"t":"Flicker noise","c":true,"fb":"Flicker noise is inversely proportional to frequency, hence 1/f noise."},{"t":"Shot noise","c":false,"fb":"Shot noise comes from random carrier paths and is not called 1/f noise."},{"t":"Transit-time noise","c":false,"fb":"Transit-time noise depends on the signal period, not on 1/f behavior."},{"t":"White noise","c":false,"fb":"White noise contains all frequencies at random amplitudes."}]},{"cat":"05","type":"mcq","stem":"A circuit is never perfectly linear. Its nonlinearity generates new signals and harmonics. Which internal noise does this cause?","sub":"intermodulation-distortion","options":[{"t":"Semiconductor noise","c":false,"fb":"Semiconductor noise comes from carrier movement or resistance changes in diodes and transistors."},{"t":"Transit-time noise","c":false,"fb":"Transit-time noise occurs when carrier travel time equals the signal frequency's period."},{"t":"Intermodulation distortion","c":true,"fb":"Circuit nonlinearity generates new signals and harmonics, causing intermodulation distortion."},{"t":"Thermal agitation noise","c":false,"fb":"Thermal agitation noise comes from random heat-driven motion of free electrons in a conductor."}]},{"cat":"05","type":"mcq","stem":"Despite its name, intermodulation distortion falls under which kind of noise?","sub":"intermodulation-distortion","options":[{"t":"Internal noise","c":true,"fb":"It is classified as internal noise because it arises in receiver circuits."},{"t":"External noise","c":false,"fb":"It comes from circuit nonlinearities, not from outside sources."},{"t":"Industrial noise","c":false,"fb":"Industrial noise is man-made external noise."},{"t":"Interference","c":false,"fb":"Interference is other information signals, not circuit nonlinearity."}]},{"cat":"05","type":"scenario","stem":"Is noise likely to be a problem on this link?","sub":"when-noise-matters","context":"A link uses a high-power transmitter over a short distance. The received signal is strong.","options":[{"t":"Usually not","c":true,"fb":"Noise is usually not a problem over short distances or with high-power transmitters."},{"t":"Yes, always","c":false,"fb":"Noise is not always a problem. It matters mainly when received signals are very low in amplitude."},{"t":"Yes, for digital only","c":false,"fb":"Noise affects analog and digital signals alike. Here the strong signal keeps it from being a problem."},{"t":"Only below 30 MHz","c":false,"fb":"Atmospheric noise is strongest below 30 MHz, but this does not make noise a problem on a strong short link."}]},{"cat":"05","type":"mcq","stem":"A weak signal arrives with strong noise. What S/N ratio and reception result?","sub":"snr-concept","options":[{"t":"Low, unreliable","c":true,"fb":"Weak signal with strong noise gives a low S/N ratio and unreliable reception."},{"t":"Low, reliable","c":false,"fb":"A low S/N ratio means unreliable reception."},{"t":"High, unreliable","c":false,"fb":"Strong noise relative to the signal lowers the ratio, so it is not high."},{"t":"High, reliable","c":false,"fb":"This describes a strong signal with weak noise."}]},{"cat":"05","type":"mcq","stem":"Signal and noise strengths are compared in four cases. Which gives the highest S/N ratio?","sub":"snr-concept","options":[{"t":"Signal 10 mV, noise 1 mV","c":true,"fb":"S/N = 10, the largest ratio of the four."},{"t":"Signal 10 mV, noise 5 mV","c":false,"fb":"S/N = 2. Stronger noise lowers the ratio."},{"t":"Signal 1 mV, noise 0.5 mV","c":false,"fb":"S/N = 2. A weak noise alone does not give a high ratio; the signal must be strong relative to it."},{"t":"Signal 1 mV, noise 5 mV","c":false,"fb":"S/N = 0.2, the lowest ratio, from a weak signal with strong noise."}]},{"cat":"05","type":"scenario","stem":"What is S/N as a plain ratio?","sub":"snr-voltage-calc","context":"A receiver measures a signal voltage Vs = 6 mV and a noise voltage Vn = 0.2 mV.","options":[{"t":"30","c":true,"fb":"6 mV / 0.2 mV = 30."},{"t":"0.033","c":false,"fb":"The ratio was inverted (Vn/Vs)."},{"t":"5.8","c":false,"fb":"The values were subtracted instead of divided."},{"t":"3","c":false,"fb":"A decimal slip: 6/2 was used instead of 6/0.2."}]},{"cat":"05","type":"scenario","stem":"What is S/N in dB?","sub":"snr-voltage-calc","context":"Vs = 8 µV and Vn = 0.5 µV.","options":[{"t":"24.08 dB","c":true,"fb":"S/N = 16, and 20 log(16) = 24.08 dB."},{"t":"12.04 dB","c":false,"fb":"This uses 10 log, which is the power formula."},{"t":"16 dB","c":false,"fb":"This is the plain ratio, not converted to dB."},{"t":"1.20 dB","c":false,"fb":"This is log(16) without the multiplier."}]},{"cat":"05","type":"mcq","stem":"Which multiplier is used in the decibel formula for a voltage S/N ratio?","sub":"snr-voltage-calc","options":[{"t":"20","c":true,"fb":"Voltage uses dB = 20 log(S/N)."},{"t":"10","c":false,"fb":"10 is for power ratios."},{"t":"2","c":false,"fb":"There is no multiplier of 2."},{"t":"100","c":false,"fb":"100 is not used in the dB formula."}]},{"cat":"05","type":"scenario","stem":"What is S/N as a plain ratio?","sub":"snr-power-calc","context":"Ps = 8 µW and Pn = 200 nW.","options":[{"t":"40","c":true,"fb":"8×10⁻⁶ / 200×10⁻⁹ = 40."},{"t":"0.025","c":false,"fb":"The ratio was inverted (Pn/Ps)."},{"t":"4","c":false,"fb":"This is a unit-conversion slip."},{"t":"400","c":false,"fb":"This is a power-of-ten slip in the unit conversion."}]},{"cat":"05","type":"scenario","stem":"What is S/N in dB?","sub":"snr-power-calc","context":"Ps = 3 mW and Pn = 60 µW.","options":[{"t":"16.99 dB","c":true,"fb":"S/N = 50, and 10 log(50) = 16.99 dB."},{"t":"33.98 dB","c":false,"fb":"This uses 20 log, which is the voltage formula."},{"t":"50 dB","c":false,"fb":"This is the plain ratio, not converted to dB."},{"t":"1.70 dB","c":false,"fb":"This is log(50) without the multiplier."}]},{"cat":"05","type":"mcq","stem":"Which multiplier is used in the decibel formula for a power S/N ratio?","sub":"snr-power-calc","options":[{"t":"10","c":true,"fb":"Power S/N converts to decibels using dB = 10 log(S/N)."},{"t":"20","c":false,"fb":"A multiplier of 20 applies to voltage S/N ratios rather than power ratios."},{"t":"40","c":false,"fb":"Doubling the voltage multiplier of 20 over-scales the logarithmic ratio."},{"t":"100","c":false,"fb":"A factor of 100 converts a plain ratio into a percentage, not decibels."}]},{"cat":"05","type":"scenario","stem":"What is Ps?","sub":"snr-rearrange","context":"S/N = Ps/Pn. The S/N is 40 and Pn = 50 nW.","options":[{"t":"2000 nW","c":true,"fb":"Ps = (S/N) × Pn = 40 × 50 nW = 2000 nW."},{"t":"1.25 nW","c":false,"fb":"This divides Pn by S/N (50/40), which is the wrong rearrangement."},{"t":"90 nW","c":false,"fb":"This adds the values instead of multiplying."},{"t":"0.8 nW","c":false,"fb":"This divides S/N by Pn (40/50)."}]},{"cat":"05","type":"mcq","stem":"The ratio of input S/N power to output S/N power is called what?","sub":"noise-factor-nr","options":[{"t":"Noise factor","c":true,"fb":"NR = (S/N input) / (S/N output), also called noise ratio."},{"t":"Noise figure","c":false,"fb":"Noise figure is the noise factor expressed in decibels."},{"t":"Signal ratio","c":false,"fb":"This is not a defined term here."},{"t":"Noise power","c":false,"fb":"Noise power is a quantity, not this ratio."}]},{"cat":"05","type":"scenario","stem":"What is NR?","sub":"noise-factor-nr","context":"An amplifier has S/N input = 12 and S/N output = 4.","options":[{"t":"3","c":true,"fb":"NR = 12 / 4 = 3."},{"t":"0.33","c":false,"fb":"The ratio was inverted (output/input)."},{"t":"8","c":false,"fb":"The values were subtracted instead of divided."},{"t":"48","c":false,"fb":"The values were multiplied instead of divided."}]},{"cat":"05","type":"mcq","stem":"The noise factor expressed in decibels is called what?","sub":"noise-figure-calc","options":[{"t":"Noise figure","c":true,"fb":"NF = 10 log NR."},{"t":"Noise ratio","c":false,"fb":"Noise ratio is the plain (non-dB) noise factor."},{"t":"Signal figure","c":false,"fb":"This is not a defined term here."},{"t":"S/N figure","c":false,"fb":"S/N is a ratio of signal to noise, not the noise factor in dB."}]},{"cat":"05","type":"scenario","stem":"What is its noise figure in dB?","sub":"noise-figure-calc","context":"An amplifier has NR = 4.","options":[{"t":"6.02 dB","c":true,"fb":"NF = 10 log(4) = 6.02 dB."},{"t":"12.04 dB","c":false,"fb":"This uses 20 log instead of 10 log."},{"t":"0.60 dB","c":false,"fb":"This is log(4) without the multiplier."},{"t":"4 dB","c":false,"fb":"This treats NR as already being in dB."}]},{"cat":"05","type":"mcq","stem":"An unwanted alteration of an information signal's waveform in a device or channel is called what?","sub":"distortion-definition","options":[{"t":"Distortion","c":true,"fb":"Distortion is an unwanted alteration of the waveform."},{"t":"Thermal noise","c":false,"fb":"Thermal noise is random electron motion, not a waveform alteration."},{"t":"Interference","c":false,"fb":"Interference is the addition of unwanted signals from other sources."},{"t":"Attenuation","c":false,"fb":"[outside] A loss of signal strength, not an alteration of the waveform."}]},{"cat":"05","type":"mcq","stem":"Distortion alters which property of an information signal?","sub":"distortion-definition","options":[{"t":"Waveform","c":true,"fb":"Distortion alters the waveform of audio or video signals."},{"t":"Source identity","c":false,"fb":"The signal's source is unchanged."},{"t":"Carrier phase only","c":false,"fb":"Distortion is defined as a waveform alteration, not a phase-only one."},{"t":"Bandwidth allocation","c":false,"fb":"Bandwidth allocation is not what distortion alters."}]},{"cat":"05","type":"mcq","stem":"Which of these is NOT a cause of distortion?","sub":"distortion-causes","options":[{"t":"Random mix of added frequencies","c":true,"fb":"That describes noise. Distortion comes from environment, channel properties and distance."},{"t":"Environmental factors","c":false,"fb":"This is a cause of distortion."},{"t":"Channel properties","c":false,"fb":"This is a cause of distortion."},{"t":"Transmitter-receiver distance","c":false,"fb":"Distance is a cause of distortion."}]},{"cat":"05","type":"mcq","stem":"Compared with noise, which effects are easier to remove?","sub":"distortion-vs-noise","options":[{"t":"Distortion","c":true,"fb":"The effects of distortion are easier to remove than those of noise."},{"t":"Noise","c":false,"fb":"Noise effects are harder to remove."},{"t":"Both equally","c":false,"fb":"They are not equally easy to remove."},{"t":"Neither can be removed","c":false,"fb":"Distortion effects can be removed."}]},{"cat":"05","type":"mcq","stem":"How does distortion differ from noise when degrading a transmitted information signal?","sub":"distortion-vs-noise","options":[{"t":"Adds random frequencies across many amplitudes","c":false,"fb":"Adding many random frequencies at random amplitudes describes noise rather than distortion."},{"t":"Alters the waveform in a correctable way","c":true,"fb":"Distortion alters the signal's waveform without fully affecting it, making its effects easier to remove."},{"t":"Replaces weak signals with random static","c":false,"fb":"Static that completely overshadows a weak signal is caused by high-level noise."},{"t":"Mixes in other unwanted information signals","c":false,"fb":"Disrupting a signal by adding other unwanted information signals defines interference."}]},{"cat":"05","type":"scenario","stem":"Which signal condition is the likely cause?","sub":"distortion-effect-voice","context":"A speaker's voice arrives garbled, harsh and unnatural.","options":[{"t":"Distortion","c":true,"fb":"Distortion gives garbled, harsh, unnatural voice sounds."},{"t":"High S/N ratio","c":false,"fb":"A high S/N ratio means a strong signal relative to noise, not garbled sound."},{"t":"Strong signal power","c":false,"fb":"Signal strength does not by itself produce garbled, harsh sounds."},{"t":"Short link distance","c":false,"fb":"Distance is a cause of distortion, and a short one does not explain this."}]},{"cat":"05","type":"mcq","stem":"Which is a deliberate, desirable use of distortion?","sub":"distortion-desirable-uses","options":[{"t":"Electric guitar character","c":true,"fb":"Distortion gives the electric guitar a specific character."},{"t":"Garbled voice calls","c":false,"fb":"This is an unwanted effect."},{"t":"Static between stations","c":false,"fb":"Static is noise, not deliberate distortion."},{"t":"Lightning interference","c":false,"fb":"This is atmospheric noise."}]},{"cat":"05","type":"mcq","stem":"Which noise reduction system purposely distorts audio?","sub":"distortion-desirable-uses","options":[{"t":"Dolby system","c":true,"fb":"Dolby purposely distorts the audio, then undistorts it."},{"t":"Flicker system","c":false,"fb":"Flicker noise is a semiconductor noise, not a reduction system."},{"t":"Johnson system","c":false,"fb":"Johnson noise is thermal noise, not a reduction system."},{"t":"Shot system","c":false,"fb":"Shot noise is a semiconductor noise, not a reduction system."}]},{"cat":"05","type":"mcq","stem":"Which noise reduction system purposely distorts, then undistorts, an audio signal?","sub":"dolby-system","options":[{"t":"Dolby system","c":true,"fb":"This is the Dolby system."},{"t":"Thermal agitation","c":false,"fb":"Thermal agitation is a noise source, not a reduction system."},{"t":"Pink noise","c":false,"fb":"Pink noise is filtered or band-limited noise."},{"t":"Intermodulation","c":false,"fb":"Intermodulation distortion is an internal noise."}]},{"cat":"05","type":"scenario","stem":"What does this achieve?","sub":"dolby-system","context":"In the Dolby system, noise-prone parts of an audio signal are emphasized before the noisy channel. The process is reversed symmetrically afterward.","options":[{"t":"Lessens noise in received signal","c":true,"fb":"The symmetric undistortion lessens noise in the received signal."},{"t":"Makes the signal noise-free","c":false,"fb":"Noise in the received signal is lessened, not eliminated entirely."},{"t":"Removes all channel distortion","c":false,"fb":"Distortion is applied on purpose, and the aim is noise reduction."},{"t":"Increases the noise figure","c":false,"fb":"The purpose is to lessen noise, not worsen it."}]},{"cat":"05","type":"mcq","stem":"What is the linear SNR for a signal voltage of 9 mV and a noise voltage of 0.3 mV?","sub":"linear-voltage-snr","options":[{"t":"18","c":false,"fb":"Treats dividing by 0.3 as multiplying by 2 instead of dividing 9 mV by 0.3 mV."},{"t":"27","c":false,"fb":"Multiplies 9 by 3 after shifting the decimal on 0.3 mV without shifting 9 mV to 90."},{"t":"30","c":true,"fb":"Dividing identical millivolt units gives 9 mV / 0.3 mV = 30."},{"t":"90","c":false,"fb":"Scales the numerator 9 mV by 10 to clear the decimal in 0.3 mV, then forgets to divide by 3."}]},{"cat":"05","type":"scenario","stem":"What is the linear voltage SNR?","sub":"linear-voltage-snr","context":"During bench testing, a receiver input measures a signal voltage of 4.5 mV alongside 150 μV of background noise voltage.","options":[{"t":"30","c":true,"fb":"Converting 150 μV to 0.15 mV (or 4.5 mV to 4500 μV) yields 4.5 / 0.15 = 30."},{"t":"0.03","c":false,"fb":"Divides 4.5 directly by 150 without aligning millivolts (10^-3 V) and microvolts (10^-6 V)."},{"t":"300","c":false,"fb":"Shifts the metric conversion by four powers of ten instead of three (45,000 / 150)."},{"t":"675","c":false,"fb":"Multiplies the raw numerical values (4.5 × 150) instead of converting units and dividing."}]},{"cat":"05","type":"mcq","stem":"If a channel has a linear voltage SNR of 25 and a noise voltage of 0.4 mV, what is the signal voltage?","sub":"linear-voltage-snr","options":[{"t":"10 mV","c":true,"fb":"Rearranging S/N = Vs / Vn gives Vs = (S/N) × Vn = 25 × 0.4 mV = 10 mV."},{"t":"62.5 mV","c":false,"fb":"Divides SNR by noise voltage (25 / 0.4) instead of multiplying them."},{"t":"0.016 mV","c":false,"fb":"Divides noise voltage by SNR (0.4 / 25) instead of multiplying."},{"t":"1 mV","c":false,"fb":"Decimal placement error when multiplying 25 by 0.4."}]},{"cat":"05","type":"mcq","stem":"If the signal voltage is 8.4 μV and the linear voltage SNR is 12, what is the noise voltage?","sub":"linear-voltage-snr","options":[{"t":"0.7 μV","c":true,"fb":"Rearranging for noise voltage gives Vn = Vs / (S/N) = 8.4 μV / 12 = 0.7 μV."},{"t":"1.4 μV","c":false,"fb":"Divides 12 by 8.4 and truncates, inverting the formula as (S/N) / Vs instead of Vs / (S/N)."},{"t":"2.8 μV","c":false,"fb":"Divides 8.4 μV by 3 instead of the full SNR of 12, dropping a factor of 4."},{"t":"3.6 μV","c":false,"fb":"Subtracts 8.4 from 12 instead of dividing signal voltage by linear SNR."}]},{"cat":"05","type":"mcq","stem":"What is the linear SNR when signal power is 15 mW and noise power is 0.5 mW?","sub":"linear-power-snr","options":[{"t":"10","c":false,"fb":"Treats 0.5 mW as 1.5 mW during mental division (15 / 1.5) instead of dividing by one-half."},{"t":"15","c":false,"fb":"Drops the 0.5 mW denominator after cancelling units instead of dividing by 0.5."},{"t":"30","c":true,"fb":"Dividing signal power by noise power in matching units gives 15 mW / 0.5 mW = 30."},{"t":"75","c":false,"fb":"Multiplies 15 by 5 after clearing the decimal in 0.5 mW instead of dividing 150 by 5."}]},{"cat":"05","type":"scenario","stem":"What is the linear power SNR?","sub":"linear-power-snr","context":"An optical fiber link carries 8 μW of signal power while experiencing 160 nW of noise power at the detector.","options":[{"t":"50","c":true,"fb":"Converting 8 μW to 8000 nW gives Ps / Pn = 8000 nW / 160 nW = 50."},{"t":"0.05","c":false,"fb":"Divides 8 directly by 160 without converting microwatts (10^-6 W) and nanowatts (10^-9 W) to common units."},{"t":"500","c":false,"fb":"Uses a factor of 10,000 instead of 1,000 between microwatts and nanowatts."},{"t":"20","c":false,"fb":"Inverts the numerical values after partial scaling (160 / 8) instead of dividing converted signal power by noise power."}]},{"cat":"05","type":"mcq","stem":"Given a linear power SNR of 40 and a noise power of 25 nW, what is the signal power?","sub":"linear-power-snr","options":[{"t":"1 μW","c":true,"fb":"Multiplying Ps = (S/N) × Pn gives 40 × 25 nW = 1000 nW, which equals 1 μW."},{"t":"100 μW","c":false,"fb":"Misconverts 1000 nW to microwatts by shifting the decimal point one place instead of three."},{"t":"1.6 nW","c":false,"fb":"Divides SNR by noise power (40 / 25) instead of multiplying them."},{"t":"0.625 nW","c":false,"fb":"Divides noise power by SNR (25 / 40) instead of multiplying."}]},{"cat":"05","type":"mcq","stem":"If the signal power is 12 mW and the linear power SNR is 60, what is the noise power?","sub":"linear-power-snr","options":[{"t":"0.2 mW","c":true,"fb":"Solving Pn = Ps / (S/N) yields 12 mW / 60 = 0.2 mW."},{"t":"5 mW","c":false,"fb":"Inverts the rearrangement by dividing SNR by signal power (60 / 12)."},{"t":"720 mW","c":false,"fb":"Multiplies signal power by SNR (12 × 60) instead of dividing."},{"t":"2 mW","c":false,"fb":"Drops a factor of 10 when dividing 12 by 60."}]},{"cat":"05","type":"mcq","stem":"What is the SNR in decibels when the linear voltage ratio S/N is 100?","sub":"db-voltage-snr","options":[{"t":"40 dB","c":true,"fb":"Voltage SNR in dB uses 20 log10(100) = 20 × 2 = 40 dB."},{"t":"20 dB","c":false,"fb":"Uses the power multiplier 10 log10(100) instead of the voltage multiplier 20."},{"t":"200 dB","c":false,"fb":"Multiplies 20 by log10(100) incorrectly as 2 × 100 rather than evaluating log10(100) = 2."},{"t":"2000 dB","c":false,"fb":"Multiplies 20 directly by the linear ratio 100 without taking the base-10 logarithm."}]},{"cat":"05","type":"scenario","stem":"What is the voltage SNR in decibels?","sub":"db-voltage-snr","context":"An analog sensor outputs a 50 mV signal accompanied by 0.5 mV of noise on the line.","options":[{"t":"40 dB","c":true,"fb":"Linear S/N is 50 mV / 0.5 mV = 100, and 20 log10(100) = 20 × 2 = 40 dB."},{"t":"20 dB","c":false,"fb":"Computes linear S/N = 100 correctly, then applies the power multiplier 10 log10(100) instead of 20 log10(100)."},{"t":"60 dB","c":false,"fb":"Miscomputes 50 / 0.5 as 1000 instead of 100, giving 20 log10(1000) = 60 dB."},{"t":"30 dB","c":false,"fb":"Combines both errors: miscomputes 50 / 0.5 as 1000 and applies 10 log10(1000)."}]},{"cat":"05","type":"mcq","stem":"If a channel has a voltage SNR of 60 dB, what is its linear voltage ratio S/N?","sub":"db-voltage-snr","options":[{"t":"1000","c":true,"fb":"Using the inverse voltage formula, S/N = 10^(60 / 20) = 10^3 = 1000."},{"t":"1000000","c":false,"fb":"Divides dB by the power factor 10 (10^(60 / 10) = 10^6) instead of the voltage factor 20."},{"t":"3","c":false,"fb":"Stops after dividing 60 by 20 without raising 10 to that power."},{"t":"30","c":false,"fb":"Multiplies 10 by (60 / 20) instead of computing the exponent 10^(60 / 20)."}]},{"cat":"05","type":"mcq","stem":"What is the SNR in decibels when the linear power ratio S/N is 1000?","sub":"db-power-snr","options":[{"t":"30 dB","c":true,"fb":"Power SNR in dB uses 10 log10(1000) = 10 × 3 = 30 dB."},{"t":"60 dB","c":false,"fb":"Applies the voltage multiplier 20 log10(1000) instead of the power multiplier 10."},{"t":"3 dB","c":false,"fb":"Takes log10(1000) = 3 but forgets to multiply by 10."},{"t":"10000 dB","c":false,"fb":"Multiplies 10 directly by 1000 without taking the base-10 logarithm."}]},{"cat":"05","type":"scenario","stem":"What is the power SNR in decibels?","sub":"db-power-snr","context":"A radio transmitter delivers 20 mW of signal power into a channel with 0.2 mW of noise power.","options":[{"t":"20 dB","c":true,"fb":"Linear power ratio is 20 mW / 0.2 mW = 100, and 10 log10(100) = 10 × 2 = 20 dB."},{"t":"40 dB","c":false,"fb":"Finds Ps / Pn = 100, then mistakenly uses the voltage multiplier 20 log10(100)."},{"t":"10 dB","c":false,"fb":"Miscomputes 20 / 0.2 as 10 instead of 100, yielding 10 log10(10) = 10 dB."},{"t":"100 dB","c":false,"fb":"Reports the dimensionless linear power ratio (20 / 0.2 = 100) directly as decibels."}]},{"cat":"05","type":"mcq","stem":"If a communication link has a power SNR of 40 dB, what is its linear power ratio S/N?","sub":"db-power-snr","options":[{"t":"10,000","c":true,"fb":"Inverse power conversion gives S/N = 10^(40 / 10) = 10^4 = 10,000."},{"t":"20,000","c":false,"fb":"Doubles 10^4 by mixing the voltage factor of 2 into the power antilogarithm."},{"t":"40,000","c":false,"fb":"Multiplies 40 by 1,000 instead of evaluating 10^(40 / 10)."},{"t":"100,000","c":false,"fb":"Miscounts the exponent as 10^5 instead of 10^(40 / 10) = 10^4."}]},{"cat":"05","type":"mcq","stem":"Which logarithmic formula converts a linear voltage ratio Vs / Vn into decibel SNR?","sub":"db-multiplier-selection","options":[{"t":"20 log10(Vs / Vn)","c":true,"fb":"Voltage ratios require a multiplier of 20 on the base-10 logarithm."},{"t":"10 log10(Vs / Vn)","c":false,"fb":"A multiplier of 10 applies to power ratios (Ps / Pn), not voltage ratios."},{"t":"20 log10(Vn / Vs)","c":false,"fb":"Inverts signal and noise voltages inside the logarithm, yielding the negative of SNR (dB)."},{"t":"10^(Vs / 20 Vn)","c":false,"fb":"Confuses forward decibel conversion with the exponential antilog form used for inverse dB solving."}]},{"cat":"05","type":"mcq","stem":"An amplifier has an input power SNR of 60 and an output power SNR of 15. What is its linear Noise Factor (NR)?","sub":"linear-noise-factor","options":[{"t":"3","c":false,"fb":"Miscomputes 60 / 15 as 3 instead of 4."},{"t":"4","c":true,"fb":"Linear Noise Factor is NR = (S/N)input / (S/N)output = 60 / 15 = 4."},{"t":"6","c":false,"fb":"Divides 60 by 10 instead of the full output SNR of 15."},{"t":"15","c":false,"fb":"Reports the output power SNR directly instead of dividing input SNR by output SNR."}]},{"cat":"05","type":"scenario","stem":"What is the linear output power SNR?","sub":"linear-noise-factor","context":"A receiver front-end stage has a linear Noise Factor (NR) of 5 and receives a signal with an input power SNR of 100.","options":[{"t":"10","c":false,"fb":"Takes the square root of 100 or divides by 10 instead of dividing input SNR by NR = 5."},{"t":"20","c":true,"fb":"Rearranging NR = (S/N)input / (S/N)output gives (S/N)output = 100 / 5 = 20."},{"t":"50","c":false,"fb":"Divides input SNR by 2 instead of the given Noise Factor of 5."},{"t":"95","c":false,"fb":"Subtracts NR from input SNR (100 - 5), confusing linear ratio division with decibel subtraction."}]},{"cat":"05","type":"mcq","stem":"What linear input power SNR is required to maintain an output power SNR of 25 across a stage with a Noise Factor (NR) of 3?","sub":"linear-noise-factor","options":[{"t":"75","c":true,"fb":"Solving for required input SNR gives (S/N)input = NR × (S/N)output = 3 × 25 = 75."},{"t":"8.33","c":false,"fb":"Divides output SNR by NR (25 / 3) instead of multiplying to compensate for stage degradation."},{"t":"28","c":false,"fb":"Adds NR to output SNR (25 + 3), treating linear quantities as if they were in decibels."},{"t":"22","c":false,"fb":"Subtracts NR from output SNR (25 - 3) instead of multiplying linear ratios."}]},{"cat":"05","type":"mcq","stem":"What is the Noise Figure (NF) in decibels of an amplifier with a linear Noise Factor (NR) of 10?","sub":"noise-figure-nr-conversion","options":[{"t":"10 dB","c":true,"fb":"Noise Figure is NF = 10 log10(NR) = 10 log10(10) = 10 × 1 = 10 dB."},{"t":"20 dB","c":false,"fb":"Uses a multiplier of 20 instead of 10; NR is a power SNR ratio, so NF always uses 10 log10(NR)."},{"t":"1 dB","c":false,"fb":"Evaluates log10(10) = 1 without multiplying by 10."},{"t":"100 dB","c":false,"fb":"Multiplies 10 by NR directly (10 × 10) instead of taking the base-10 logarithm."}]},{"cat":"05","type":"mcq","stem":"If a receiver has a Noise Figure (NF) of 30 dB, what is its linear Noise Factor (NR)?","sub":"noise-figure-nr-conversion","options":[{"t":"1000","c":true,"fb":"Inverse conversion gives NR = 10^(NF / 10) = 10^(30 / 10) = 10^3 = 1000."},{"t":"31.62","c":false,"fb":"Divides NF by 20 instead of 10 (10^(30 / 20) = 10^1.5), confusing NF with voltage dB."},{"t":"300","c":false,"fb":"Multiplies NF by 10 instead of computing the power of 10."},{"t":"3","c":false,"fb":"Divides 30 by 10 to get the exponent 3, but omits the base-10 exponentiation."}]},{"cat":"05","type":"scenario","stem":"What is the Noise Figure (NF) of this stage?","sub":"noise-figure-nr-conversion","context":"A signal processing stage degrades the linear power SNR from 200 at its input down to 20 at its output.","options":[{"t":"10 dB","c":true,"fb":"First NR = 200 / 20 = 10, and converting to decibels gives NF = 10 log10(10) = 10 dB."},{"t":"20 dB","c":false,"fb":"Computes NR = 10 accurately, then mistakenly applies 20 log10(10) instead of 10 log10(10)."},{"t":"180 dB","c":false,"fb":"Subtracts linear power SNRs directly (200 - 20) as if they were already in decibels."},{"t":"-10 dB","c":false,"fb":"Inverts NR as output over input (20 / 200 = 0.1) before taking 10 log10(0.1)."}]},{"cat":"05","type":"mcq","stem":"What is the Noise Figure (NF) when the input SNR is 35 dB and the output SNR is 28 dB?","sub":"noise-figure-db-difference","options":[{"t":"5 dB","c":false,"fb":"Divides 35 by 7 instead of subtracting 28 dB from 35 dB."},{"t":"7 dB","c":true,"fb":"Using the decibel difference formula, NF (dB) = SNRinput (dB) - SNRoutput (dB) = 35 - 28 = 7 dB."},{"t":"13 dB","c":false,"fb":"Fails to borrow from the tens place when subtracting 28 from 35 (computing 38 - 25 = 13)."},{"t":"17 dB","c":false,"fb":"Subtracts 28 from 35 without borrowing from the tens column, inflating the tens digit by 1."}]},{"cat":"05","type":"scenario","stem":"What is the output SNR in decibels?","sub":"noise-figure-db-difference","context":"A low-noise amplifier with a 4.5 dB Noise Figure receives a signal having an input SNR of 26 dB.","options":[{"t":"21.5 dB","c":true,"fb":"Rearranging NF = SNRinput (dB) - SNRoutput (dB) gives SNRoutput = 26 dB - 4.5 dB = 21.5 dB."},{"t":"30.5 dB","c":false,"fb":"Adds NF to input SNR (26 + 4.5), which would incorrectly increase SNR across a noisy stage."},{"t":"5.78 dB","c":false,"fb":"Divides 26 dB by 4.5 dB, applying linear NR division to logarithmic decibel quantities."},{"t":"117 dB","c":false,"fb":"Multiplies input SNR in dB by NF in dB (26 × 4.5)."}]},{"cat":"05","type":"mcq","stem":"What input SNR in decibels is required to achieve a 19 dB output SNR across a stage with a 6 dB Noise Figure?","sub":"noise-figure-db-difference","options":[{"t":"25 dB","c":true,"fb":"Rearranging NF = SNRinput (dB) - SNRoutput (dB) gives SNRinput = 19 dB + 6 dB = 25 dB."},{"t":"13 dB","c":false,"fb":"Subtracts NF from output SNR (19 - 6) instead of adding NF to account for SNR loss."},{"t":"114 dB","c":false,"fb":"Multiplies output SNR by NF (19 × 6), confusing linear NR multiplication with decibel addition."},{"t":"3.17 dB","c":false,"fb":"Divides output SNR by NF (19 / 6) instead of adding the decibel values."}]},{"cat":"06","type":"mcq","stem":"Which receiver property identifies and isolates a desired signal from other signals in the frequency spectrum?","sub":"selectivity","options":[{"t":"Selectivity","c":true,"fb":"Selectivity is the receiver's ability to identify and select a desired signal from others in the spectrum."},{"t":"Sensitivity","c":false,"fb":"Sensitivity enables picking up and amplifying weak signals rather than isolating one frequency from others."},{"t":"Overall gain","c":false,"fb":"Overall gain is the input-to-output multiplication factor that determines sensitivity, not frequency isolation."},{"t":"Noise floor","c":false,"fb":"The noise floor is the internally generated noise baseline of a receiver, not a signal-selection property."}]},{"cat":"06","type":"mcq","stem":"A radio receiver rejects adjacent-channel interference while passing the intended signal because of which characteristic?","sub":"selectivity","options":[{"t":"Sensitivity","c":false,"fb":"Sensitivity governs weak-signal amplification, whereas rejecting adjacent channels requires frequency discrimination."},{"t":"Selectivity","c":true,"fb":"Selectivity allows a receiver to pass the desired signal and its sidebands while attenuating adjacent-channel signals."},{"t":"Shape factor","c":false,"fb":"Shape factor is a numerical ratio describing curve steepness, not the receiver property itself."},{"t":"Overall gain","c":false,"fb":"Overall gain amplifies signals uniformly across the passband and does not separate adjacent channels."}]},{"cat":"06","type":"mcq","stem":"Which receiver property picks up weak signals and amplifies them enough to recover the modulating signal?","sub":"sensitivity","options":[{"t":"Selectivity","c":false,"fb":"Selectivity isolates a desired signal from adjacent frequencies rather than amplifying weak signals."},{"t":"Sensitivity","c":true,"fb":"Sensitivity lets a receiver pick up weak signals and provide sufficient amplification to recover modulation."},{"t":"Shape factor","c":false,"fb":"Shape factor measures the skirt steepness of a tuned circuit's selectivity curve."},{"t":"Noise floor","c":false,"fb":"The noise floor is the receiver's internally generated noise level that limits weak-signal reception."}]},{"cat":"06","type":"mcq","stem":"Which receiver characteristic enables detection and recovery of low-level signals arriving from a distant transmitter?","sub":"sensitivity","options":[{"t":"Overall gain","c":false,"fb":"Overall gain primarily determines sensitivity, but it is the amplification factor rather than the receiver characteristic itself."},{"t":"Selectivity","c":false,"fb":"Selectivity separates a target signal from interfering frequencies rather than enabling weak-signal detection."},{"t":"Noise floor","c":false,"fb":"Noise floor is the baseline internal noise that competes with low-level incoming signals."},{"t":"Sensitivity","c":true,"fb":"Sensitivity enables a receiver to detect and amplify weak signals from distant transmitters so modulation can be recovered."}]},{"cat":"06","type":"mcq","stem":"Which basic circuit, also called a resonant circuit, is used inside a radio receiver to obtain signal selectivity?","sub":"lc-tuned-circuit","options":[{"t":"LC-tuned circuit","c":true,"fb":"Receivers obtain selectivity using LC-tuned circuits, also known as resonant circuits."},{"t":"RC-coupled circuit","c":false,"fb":"[outside] RC coupling passes signals between amplifier stages rather than forming an LC resonant selector."},{"t":"RL-filter circuit","c":false,"fb":"[outside] A simple RL filter lacks the resonant LC tank behavior used for receiver selectivity."},{"t":"Ceramic filter","c":false,"fb":"Ceramic filters are supplementary fixed filters added to steepen selectivity, not the basic LC resonant circuit."}]},{"cat":"06","type":"mcq","stem":"Which parameter of an LC-tuned circuit is controlled to determine its selectivity and bandwidth?","sub":"quality-factor","options":[{"t":"Shape factor","c":false,"fb":"Shape factor expresses the steepness of a response curve's skirts rather than serving as the LC control parameter."},{"t":"Quality factor","c":true,"fb":"Selectivity in an LC-tuned circuit is achieved by carefully controlling its quality factor."},{"t":"Overall gain","c":false,"fb":"Overall gain governs receiver amplification and sensitivity rather than tuned-circuit selectivity."},{"t":"Noise floor","c":false,"fb":"Noise floor measures internal receiver noise and does not control tuned-circuit bandwidth."}]},{"cat":"06","type":"mcq","stem":"What is the name of the factor denoted by Q that governs a resonant circuit's selectivity?","sub":"quality-factor","options":[{"t":"Shape factor","c":false,"fb":"Shape factor is the ratio of 60-dB to 6-dB bandwidths and is not denoted by Q."},{"t":"Damping factor","c":false,"fb":"[outside] Damping factor describes oscillation decay and is inversely related to Q rather than being Q itself."},{"t":"Quality factor","c":true,"fb":"The quality factor, denoted as Q, is controlled to govern an LC-tuned circuit's selectivity."},{"t":"Power factor","c":false,"fb":"[outside] Power factor is the ratio of real to apparent AC power, unrelated to tuned-circuit Q."}]},{"cat":"06","type":"mcq","stem":"Which metric expresses the steepness of a tuned circuit response curve's sides using two attenuation bandwidths?","sub":"shape-factor","options":[{"t":"Quality factor","c":false,"fb":"Quality factor relates resonant frequency to the 3-dB bandwidth rather than comparing 60-dB and 6-dB bandwidths."},{"t":"Skirt selectivity","c":false,"fb":"Skirt selectivity refers to the sides of the response curve themselves, not the numerical steepness metric."},{"t":"Shape factor","c":true,"fb":"Shape factor expresses skirt steepness as the ratio of the 60-dB down bandwidth to the 6-dB down bandwidth."},{"t":"Overall gain","c":false,"fb":"Overall gain measures signal amplification rather than selectivity curve steepness."}]},{"cat":"06","type":"mcq","stem":"What term refers to the sloping sides of a tuned circuit frequency response curve?","sub":"skirt-selectivity","options":[{"t":"Skirt selectivity","c":true,"fb":"Skirts, or skirt selectivity, refer to the sloping sides of a tuned circuit response curve."},{"t":"Shape factor","c":false,"fb":"Shape factor is the numerical ratio that quantifies skirt steepness, not the sides themselves."},{"t":"Quality factor","c":false,"fb":"Quality factor controls selectivity and bandwidth rather than naming the sides of the curve."},{"t":"Resonant frequency","c":false,"fb":"Resonant frequency is the center peak frequency of the response curve, not its sloping sides."}]},{"cat":"06","type":"mcq","stem":"Which receiver parameter multiplies the input signal to produce the output signal and primarily determines sensitivity?","sub":"overall-gain","options":[{"t":"Quality factor","c":false,"fb":"Quality factor controls tuned-circuit bandwidth and selectivity, not output amplification."},{"t":"Overall gain","c":true,"fb":"Overall gain multiplies the input signal to produce the output signal and is the main determinant of sensitivity."},{"t":"Shape factor","c":false,"fb":"Shape factor measures the steepness of selectivity curve skirts rather than signal amplification."},{"t":"Noise floor","c":false,"fb":"Noise floor is the receiver's internally generated noise level, not an amplification factor."}]},{"cat":"06","type":"mcq","stem":"Besides overall gain, which other parameter affects a communication receiver's sensitivity?","sub":"signal-to-noise-ratio","options":[{"t":"Shape factor","c":false,"fb":"Shape factor compares 60-dB and 6-dB bandwidths to describe selectivity steepness."},{"t":"Quality factor","c":false,"fb":"Quality factor compares resonant frequency to bandwidth in a tuned circuit."},{"t":"Signal-to-noise ratio","c":true,"fb":"Signal-to-noise ratio (SNR) affects receiver sensitivity alongside overall gain."},{"t":"Minimum discernible signal","c":false,"fb":"Minimum discernible signal is an input power metric used to express sensitivity rather than a factor affecting it."}]},{"cat":"06","type":"mcq","stem":"Which sensitivity metric equals the input signal level almost matching the receiver's average noise floor?","sub":"minimum-discernible-signal","options":[{"t":"Minimum discernible signal","c":true,"fb":"Minimum discernible signal (MDS) expresses sensitivity as the input signal level nearly equal to the average noise floor."},{"t":"Input signal-to-noise ratio","c":false,"fb":"[outside] Input signal-to-noise ratio compares signal power to noise power as a ratio rather than specifying the input threshold level itself."},{"t":"Spurious-free dynamic range","c":false,"fb":"[outside] Spurious-free dynamic range measures the usable dB span above the noise floor before spurious signals appear rather than the threshold input level."},{"t":"Receiver noise temperature","c":false,"fb":"[outside] Receiver noise temperature expresses internal noise in kelvins rather than an input signal level matching the noise floor."}]},{"cat":"06","type":"mcq","stem":"Which quantity expressed in dBm represents the weakest input signal distinguishable above internal receiver noise?","sub":"minimum-discernible-signal","options":[{"t":"Receiver compression point","c":false,"fb":"[outside] Receiver compression point marks the high input power in dBm where receiver gain begins to saturate rather than the lower detection threshold."},{"t":"Input signal-to-noise ratio","c":false,"fb":"[outside] Input signal-to-noise ratio is a relative ratio comparing signal and noise power rather than an absolute power level expressed in dBm."},{"t":"Third-order intercept point","c":false,"fb":"[outside] Third-order intercept point is a dBm figure of merit for nonlinear intermodulation distortion at high signal levels, not low-level sensitivity."},{"t":"Minimum discernible signal","c":true,"fb":"Minimum discernible signal (MDS) is expressed in dBm and represents the input level nearly equal to the average noise floor."}]},{"cat":"06","type":"mcq","stem":"What term describes the baseline level of internally generated noise inside a radio receiver?","sub":"noise-floor","options":[{"t":"Minimum discernible signal","c":false,"fb":"Minimum discernible signal is the external input signal level near the noise baseline, not the internal noise itself."},{"t":"Noise floor","c":true,"fb":"The noise floor is the internally generated noise value of a communication receiver."},{"t":"Overall gain","c":false,"fb":"Overall gain is the receiver's amplification multiplier rather than its internal noise baseline."},{"t":"Signal-to-noise ratio","c":false,"fb":"Signal-to-noise ratio compares signal level to noise rather than naming the internal noise baseline alone."}]},{"cat":"06","type":"mcq","stem":"Which unit expresses absolute power in decibels referenced to one milliwatt when stating MDS?","sub":"dbm-unit","options":[{"t":"dBW","c":false,"fb":"[outside] dBW references absolute power to one watt rather than one milliwatt."},{"t":"dBm","c":true,"fb":"The unit dBm expresses absolute power in decibels referenced to one milliwatt (mW)."},{"t":"dBV","c":false,"fb":"[outside] dBV expresses voltage relative to one volt rather than power relative to one milliwatt."},{"t":"dB","c":false,"fb":"Plain dB expresses a relative power or voltage ratio without a 1 mW absolute reference."}]},{"cat":"06","type":"mcq","stem":"Which signal classification scheme combines a capital letter, a number, and a lowercase subscript letter?","sub":"radio-emission-code-designations","options":[{"t":"ITU Emission Designation","c":false,"fb":"ITU Emission Designation uses a bandwidth prefix and uppercase letter-number-letter groups without lowercase subscripts."},{"t":"Radio emission code designations","c":true,"fb":"Radio emission code designations combine a capital letter, a number, and lowercase subscript letters."},{"t":"Bandwidth designator list","c":false,"fb":"The bandwidth designator list formats bandwidth using three digits and a capital unit letter such as K or M."},{"t":"International Morse code","c":false,"fb":"[outside] International Morse code encodes text characters as dots and dashes rather than signal modulation properties."}]},{"cat":"06","type":"mcq","stem":"Which standards organization established the international emission code format for describing radio transmission modulation and format?","sub":"itu-organization","options":[{"t":"International Telecommunication Union","c":true,"fb":"The International Telecommunication Union (ITU) agreed on the standardized emission designation codes."},{"t":"International Organization for Standardization","c":false,"fb":"[outside] ISO sets general international standards across industries rather than authoring the ITU emission code system."},{"t":"International Electrotechnical Commission","c":false,"fb":"[outside] The IEC sets electrical and electronic technology standards rather than the ITU radio emission codes."},{"t":"Federal Communications Commission","c":false,"fb":"[outside] The FCC regulates US domestic communications rather than serving as the international standards body for ITU codes."}]},{"cat":"06","type":"mcq","stem":"Which standardized coding system uses a bandwidth prefix and symbol groups to describe transmission format and modulation?","sub":"itu-emission-designation","options":[{"t":"Radio emission code designations","c":false,"fb":"Radio emission code designations omit a bandwidth prefix and instead use a capital letter, number, and lowercase subscript."},{"t":"Bandwidth designator list","c":false,"fb":"The bandwidth designator list specifies only the bandwidth prefix format, not the modulation and information symbol groups."},{"t":"ITU Emission Designation","c":true,"fb":"ITU Emission Designation uses a bandwidth prefix (BBBB) followed by symbol groups describing modulation and transmitted information."},{"t":"International Morse code","c":false,"fb":"[outside] International Morse code is a keying alphabet rather than a standardized modulation and bandwidth designation system."}]},{"cat":"06","type":"multi","stem":"Which THREE approaches improve receiver selectivity beyond what a single tuned circuit provides?","sub":"selectivity-filters-improvement","options":[{"t":"Cascading circuits","c":true,"fb":"Cascading multiple tuned circuits narrows and steepens the overall selectivity curve."},{"t":"Lowering quality factor","c":false,"fb":"Lowering Q widens the tuned-circuit bandwidth and reduces selectivity."},{"t":"Crystal filters","c":true,"fb":"Crystal filters are used to achieve steeper selectivity approaching vertical sides."},{"t":"Increasing overall gain","c":false,"fb":"Increasing overall gain improves sensitivity rather than frequency selectivity."},{"t":"Ceramic filters","c":true,"fb":"Ceramic filters provide sharp filtering to improve selectivity beyond simple tuned circuits."}]},{"cat":"06","type":"mcq","stem":"Why do receivers use cascading circuits or crystal and ceramic filters instead of one tuned circuit?","sub":"selectivity-filters-improvement","options":[{"t":"Steeper selectivity approaching vertical sides","c":true,"fb":"Ideal vertical selectivity cannot easily be achieved with a single tuned circuit, so cascading or filters are used."},{"t":"Higher overall gain and sensitivity","c":false,"fb":"Cascading filters improve selectivity steepness rather than serving as the primary source of receiver gain."},{"t":"Lower internal receiver noise floor","c":false,"fb":"Filters shape passband attenuation skirts rather than directly defining the internal noise floor."},{"t":"Wider bandwidth for adjacent signals","c":false,"fb":"Selectivity filters are used to reject adjacent signals, not to pass a wider band of adjacent channels."}]},{"cat":"06","type":"mcq","stem":"An LC-tuned circuit resonates at 1200 kHz with a quality factor of 60; find its bandwidth.","sub":"bandwidth-q-relationship","options":[{"t":"0.05 kHz","c":false,"fb":"This inverts the bandwidth formula by dividing Q by fr instead of computing BW = fr / Q."},{"t":"20 kHz","c":true,"fb":"Using BW = fr / Q gives 1200 kHz / 60 = 20 kHz."},{"t":"200 kHz","c":false,"fb":"This drops a zero in the denominator, calculating 1200 / 6 instead of 1200 / 60."},{"t":"72 MHz","c":false,"fb":"This multiplies fr by Q instead of dividing fr by Q."}]},{"cat":"06","type":"mcq","stem":"How does increasing the quality factor Q affect a tuned circuit's bandwidth and attenuation steepness?","sub":"bandwidth-q-relationship","options":[{"t":"Narrows bandwidth and steepens attenuation","c":true,"fb":"Because BW = fr / Q, increasing Q narrows the bandwidth and steepens adjacent-signal attenuation."},{"t":"Widens bandwidth and steepens attenuation","c":false,"fb":"Bandwidth is inversely proportional to Q, so raising Q narrows rather than widens bandwidth."},{"t":"Narrows bandwidth and flattens attenuation","c":false,"fb":"Increasing Q sharpens the selectivity curve, making attenuation steeper rather than flatter."},{"t":"Widens bandwidth and flattens attenuation","c":false,"fb":"Widening bandwidth and flattening attenuation occur when Q is decreased, not increased."}]},{"cat":"06","type":"mcq","stem":"What occurs when a receiver's tuned-circuit bandwidth becomes narrower than the signal and its sidebands?","sub":"bandwidth-q-relationship","options":[{"t":"Complete rejection of internal noise","c":false,"fb":"Narrowing tuned-circuit bandwidth cannot eliminate the receiver's internally generated noise floor."},{"t":"Higher overall gain and sensitivity","c":false,"fb":"Over-narrowing the passband attenuates signal components rather than increasing amplification gain."},{"t":"Sideband attenuation and information loss","c":true,"fb":"An overly narrow bandwidth attenuates the signal's sidebands, causing loss of transmitted information."},{"t":"Wider spacing between adjacent channels","c":false,"fb":"Receiver filter bandwidth does not change the frequency spacing between transmitted channels."}]},{"cat":"06","type":"scenario","stem":"What is the shape factor of this receiver?","sub":"shape-factor-analysis","context":"A receiver selectivity filter has a 60-dB down bandwidth of 15 kHz and a 6-dB down bandwidth of 6 kHz.","options":[{"t":"2.5","c":true,"fb":"Shape factor equals the 60-dB bandwidth divided by the 6-dB bandwidth: 15 kHz / 6 kHz = 2.5."},{"t":"0.4","c":false,"fb":"This inverts the ratio by dividing the 6-dB bandwidth by the 60-dB bandwidth."},{"t":"9.0","c":false,"fb":"This subtracts the two bandwidths instead of taking their ratio."},{"t":"2.25","c":false,"fb":"This uses 9 kHz / 4 kHz rather than the given 15 kHz and 6 kHz bandwidths."}]},{"cat":"06","type":"mcq","stem":"What is the shape factor of an ideal receiver selectivity curve with perfectly vertical sides?","sub":"shape-factor-analysis","options":[{"t":"1","c":true,"fb":"Vertical sides mean the 60-dB and 6-dB bandwidths are equal, giving a ratio of 1."},{"t":"0","c":false,"fb":"A zero shape factor would require a zero 60-dB bandwidth, which cannot pass a signal."},{"t":"6","c":false,"fb":"6 dB is one of the attenuation reference points, not the ideal shape factor."},{"t":"60","c":false,"fb":"60 dB is the outer attenuation reference point, not the ideal shape factor."}]},{"cat":"06","type":"scenario","stem":"Which receiver has steeper selectivity skirts?","sub":"shape-factor-analysis","context":"Two communication receivers are evaluated for selectivity: Receiver X has a shape factor of 1.8, while Receiver Y has a shape factor of 3.2.","options":[{"t":"Receiver X","c":true,"fb":"A lower shape factor closer to 1 indicates steeper skirts and better selectivity."},{"t":"Receiver Y","c":false,"fb":"A higher shape factor indicates wider, more gradual skirts rather than steeper ones."},{"t":"Both have equal skirts","c":false,"fb":"Different shape factors reflect different skirt steepness between the 6-dB and 60-dB points."},{"t":"Depends on overall gain","c":false,"fb":"Overall gain determines sensitivity, whereas skirt steepness is directly given by shape factor."}]},{"cat":"06","type":"scenario","stem":"What is this input power expressed in dBm?","sub":"mds-dbm-calculation","context":"An antenna input delivers 10^-11 W of signal power across a 50-ohm receiver load.","options":[{"t":"-80 dBm","c":true,"fb":"Using dBm = 10 log(P / 1 mW), 10 log(10^-11 / 10^-3) = 10 log(10^-8) = -80 dBm."},{"t":"-110 dBm","c":false,"fb":"This uses 1 W instead of 1 mW (0.001 W) as the reference power level."},{"t":"-140 dBm","c":false,"fb":"This multiplies by 1 mW instead of dividing by 1 mW inside the logarithm."},{"t":"-8 dBm","c":false,"fb":"This omits the factor of 10 in dBm = 10 log(P / 1 mW)."}]},{"cat":"06","type":"scenario","stem":"What is the minimum discernible signal (MDS) in dBm?","sub":"mds-dbm-calculation","context":"A minimum discernible signal of 5 microvolts arrives across a 50-ohm antenna input impedance.","options":[{"t":"-93.01 dBm","c":true,"fb":"Power is P = (5 x 10^-6)^2 / 50 = 5 x 10^-13 W, so dBm = 10 log(5 x 10^-13 / 10^-3) = -93.01 dBm."},{"t":"-123.01 dBm","c":false,"fb":"This computes dBW relative to 1 W instead of dBm relative to 1 mW."},{"t":"-40.00 dBm","c":false,"fb":"This computes P as V / R instead of V^2 / R before converting to dBm."},{"t":"-76.02 dBm","c":false,"fb":"This omits dividing V^2 by the 50-ohm input impedance when finding power."}]},{"cat":"06","type":"mcq","stem":"In a classic radio emission designation, what does the number placed after the capital letter define?","sub":"classic-emission-structure","options":[{"t":"Transmitted information type","c":true,"fb":"In classic designations, the middle digit identifies the type of transmitted information."},{"t":"Carrier modulation type","c":false,"fb":"The modulation type is defined by the leading capital letter, not the digit."},{"t":"Sideband and pulse specifics","c":false,"fb":"Specific sideband or pulse details are placed in the lowercase subscript letter."},{"t":"Signal bandwidth value","c":false,"fb":"Classic emission designations do not encode bandwidth; ITU designators place bandwidth first."}]},{"cat":"06","type":"mcq","stem":"Where are specific sideband and pulse details indicated within a classic radio emission code?","sub":"classic-emission-structure","options":[{"t":"Lowercase subscript letter","c":true,"fb":"Lowercase subscript letters placed under the number denote specific sideband or pulse formats."},{"t":"Leading capital letter","c":false,"fb":"The leading capital letter defines the main modulation type (A, F, or P)."},{"t":"Middle integer digit","c":false,"fb":"The integer digit defines the transmitted information type rather than sideband or pulse specifics."},{"t":"Four-character prefix code","c":false,"fb":"A four-character prefix belongs to ITU bandwidth designators, not classic emission codes."}]},{"cat":"06","type":"scenario","stem":"Which classic radio emission code classifies this transmission?","sub":"classic-emission-decoding","context":"A signal uses frequency modulation to carry voice telephony over a double-sideband transmission with no carrier.","options":[{"t":"F3_b","c":true,"fb":"F indicates frequency modulation, 3 indicates voice telephony, and subscript b indicates double sideband with no carrier."},{"t":"F3_a","c":false,"fb":"Subscript a denotes single sideband with reduced carrier rather than double sideband with no carrier."},{"t":"F3_j","c":false,"fb":"Subscript j denotes single sideband with no carrier rather than double sideband."},{"t":"A3_b","c":false,"fb":"A denotes amplitude modulation rather than frequency modulation."}]},{"cat":"06","type":"scenario","stem":"What modulation, information type, and specifics does P1_d represent?","sub":"classic-emission-decoding","context":"A detected signal is logged using the classic radio emission code P1_d.","options":[{"t":"Phase modulation, ON/OFF no message, PAM","c":true,"fb":"P is phase modulation, 1 is carrier ON/OFF with no message, and d is carrier pulses with PAM."},{"t":"Phase modulation, ON only no message, PAM","c":false,"fb":"Carrier ON only with no message corresponds to digit 0, whereas digit 1 is carrier ON/OFF."},{"t":"Phase modulation, ON/OFF no message, PWM","c":false,"fb":"Pulse width modulation (PWM) uses subscript e, whereas subscript d indicates PAM."},{"t":"Phase modulation, keyed tone code, PPM","c":false,"fb":"Keyed tone ON/OFF corresponds to digit 2, and PPM corresponds to subscript f."}]},{"cat":"06","type":"scenario","stem":"Which classic radio emission code represents this signal?","sub":"classic-emission-decoding","context":"A transmitter sends amplitude-modulated fax non-moving graphics using single sideband with full carrier.","options":[{"t":"A4_h","c":true,"fb":"A is amplitude modulation, 4 is fax/non-moving graphics, and h is single sideband with full carrier."},{"t":"A4_a","c":false,"fb":"Subscript a specifies single sideband with reduced carrier rather than full carrier."},{"t":"A4_j","c":false,"fb":"Subscript j specifies single sideband with no carrier rather than full carrier."},{"t":"A5_h","c":false,"fb":"Digit 5 represents vestigial sideband (such as commercial TV) rather than fax graphics."}]},{"cat":"06","type":"mcq","stem":"In classic radio emission designations, what does the information type digit 0 indicate?","sub":"classic-emission-decoding","options":[{"t":"Carrier ON only, no message","c":true,"fb":"Digit 0 represents a continuous carrier ON with no message, such as a radio beacon."},{"t":"Carrier ON/OFF, no message","c":false,"fb":"Carrier ON/OFF with no message (such as Morse code or radar) is represented by digit 1."},{"t":"Keyed tone ON/OFF, code","c":false,"fb":"Carrier ON with a keyed ON/OFF tone is represented by digit 2."},{"t":"Telephony, voice or music","c":false,"fb":"Voice or music telephony is represented by digit 3."}]},{"cat":"06","type":"multi","stem":"Which TWO fields in the ITU emission designator format BBBB 123 45 are optional? Select the TWO correct options.","sub":"itu-designator-format","options":[{"t":"Practical details (4)","c":true,"fb":"Position 4 indicates optional practical details of the transmitted information."},{"t":"Multiplexing details (5)","c":true,"fb":"Position 5 indicates optional details about multiplexing."},{"t":"Signal bandwidth (BBBB)","c":false,"fb":"BBBB is a required prefix defining the signal bandwidth."},{"t":"Modulation type (1)","c":false,"fb":"Position 1 is a required capital letter specifying modulation type."},{"t":"Information type (3)","c":false,"fb":"Position 3 is a required capital letter specifying transmitted information type."}]},{"cat":"06","type":"mcq","stem":"In the ITU emission format BBBB 123 45, what does position 2 indicate?","sub":"itu-designator-format","options":[{"t":"Modulating signal type","c":true,"fb":"Position 2 is a number that indicates the nature of the modulating signal."},{"t":"Carrier modulation type","c":false,"fb":"Carrier modulation type is indicated by the capital letter in position 1."},{"t":"Transmitted information type","c":false,"fb":"Transmitted information type is indicated by the capital letter in position 3."},{"t":"Signal multiplexing details","c":false,"fb":"Multiplexing details belong in optional position 5, not position 2."}]},{"cat":"06","type":"mcq","stem":"How is a bandwidth of 4.50 kHz written as an ITU four-character bandwidth designator?","sub":"itu-bandwidth-designator","options":[{"t":"4K50","c":true,"fb":"ITU bandwidth designators use three significant digits with an uppercase unit letter (K for kHz) marking the decimal point."},{"t":"4k50","c":false,"fb":"The ITU bandwidth unit letter must be uppercase K, not lowercase k."},{"t":"450K","c":false,"fb":"Placing K at the end omits a digit and represents 450 kHz rather than 4.50 kHz."},{"t":"K450","c":false,"fb":"Placing K first puts the decimal point before the digits, representing 0.450 kHz."}]},{"cat":"06","type":"mcq","stem":"What numeric bandwidth corresponds to the ITU bandwidth designator 1M25?","sub":"itu-bandwidth-designator","options":[{"t":"1.25 MHz","c":true,"fb":"The capital letter M marks the decimal point in megahertz, so 1M25 equals 1.25 MHz."},{"t":"12.5 MHz","c":false,"fb":"12.5 MHz would place the M after the first two digits as 12M5."},{"t":"125 kHz","c":false,"fb":"M denotes megahertz, and the decimal point sits at the position of the letter M."},{"t":"1.25 kHz","c":false,"fb":"Kilohertz uses the unit letter K (1K25), whereas M denotes megahertz."}]},{"cat":"06","type":"scenario","stem":"What is the three-character ITU emission code for this signal?","sub":"itu-emission-decoding","context":"An amateur radio station transmits human voice telephony over a single analog channel using single-sideband suppressed-carrier modulation.","options":[{"t":"J3E","c":true,"fb":"J denotes single-sideband suppressed carrier, 3 denotes analog single channel, and E denotes human voice telephony."},{"t":"H3E","c":false,"fb":"H indicates single-sideband full carrier rather than suppressed carrier."},{"t":"R3E","c":false,"fb":"R indicates single-sideband with a reduced or variable-level carrier rather than suppressed carrier."},{"t":"J8E","c":false,"fb":"Digit 8 indicates two or more analog channels rather than a single analog channel."}]},{"cat":"06","type":"scenario","stem":"What modulation, modulating signal, and transmitted information type does F8F specify?","sub":"itu-emission-decoding","context":"A broadcast analyzer decodes an incoming transmission as ITU emission code F8F.","options":[{"t":"FM, multi-channel analog, TV/video","c":true,"fb":"F is frequency modulation, 8 is analog two or more channels, and F is video/TV."},{"t":"FM, multi-channel digital, telemetry","c":false,"fb":"Digit 7 designates multi-channel digital signals, and symbol D designates data transmission and telemetry."},{"t":"PM, multi-channel analog, telemetry","c":false,"fb":"Phase modulation uses symbol G, and data transmission and telemetry use information symbol D."},{"t":"PM, multi-channel digital, TV/video","c":false,"fb":"Phase modulation uses symbol G, and multi-channel digital modulating signals use digit 7."}]},{"cat":"06","type":"scenario","stem":"What is the full ITU emission designation for this transmission?","sub":"itu-emission-decoding","context":"A 12.5 kHz phase-modulated signal uses a single modulated digital channel to send telemetry and control data.","options":[{"t":"12K5 G2D","c":true,"fb":"12.5 kHz encodes as 12K5, phase modulation is G, modulated single digital channel is 2, and telemetry is D."},{"t":"12K5 F1D","c":false,"fb":"Symbol F indicates frequency modulation and digit 1 indicates an unmodulated single digital channel."},{"t":"1K25 G1B","c":false,"fb":"1K25 represents 1.25 kHz, digit 1 indicates an unmodulated single digital channel, and symbol B denotes machine telegraphy."},{"t":"1K25 F2B","c":false,"fb":"1K25 represents 1.25 kHz, symbol F denotes frequency modulation, and symbol B denotes machine telegraphy."}]},{"cat":"06","type":"mcq","stem":"In ITU emission designations, which modulating signal digit represents a combination of analog plus digital signals?","sub":"itu-emission-decoding","options":[{"t":"9","c":true,"fb":"Digit 9 denotes a modulating signal combining analog and digital channels."},{"t":"7","c":false,"fb":"Digit 7 denotes a digital modulating signal with two or more channels."},{"t":"8","c":false,"fb":"Digit 8 denotes an analog modulating signal with two or more channels."},{"t":"2","c":false,"fb":"Digit 2 denotes a single digital channel with modulation."}]},{"cat":"06","type":"mcq","stem":"Which ITU modulation symbol indicates a single-sideband full-carrier emission?","sub":"itu-emission-decoding","options":[{"t":"H","c":true,"fb":"Symbol H designates a single-sideband full-carrier emission."},{"t":"J","c":false,"fb":"Symbol J designates a single-sideband suppressed-carrier emission."},{"t":"R","c":false,"fb":"Symbol R designates a single-sideband emission with a reduced or variable-level carrier."},{"t":"B","c":false,"fb":"Symbol B designates general single sideband rather than specifying a full carrier."}]},{"cat":"06","type":"mcq","stem":"What is the bandwidth of a tuned circuit with a 2.4 MHz resonant frequency and a quality factor of 80?","sub":"tuned-circuit-bw-q","options":[{"t":"3 kHz","c":false,"fb":"Converting 2.4 MHz to 240 kHz instead of 2400 kHz understates the bandwidth by a factor of 10."},{"t":"30 kHz","c":true,"fb":"Converting 2.4 MHz to 2400 kHz and dividing by Q = 80 gives BW = 2400 kHz / 80 = 30 kHz."},{"t":"300 kHz","c":false,"fb":"Misplacing the decimal during MHz-to-kHz conversion yields a bandwidth 10 times too wide."},{"t":"192 MHz","c":false,"fb":"Multiplying resonant frequency by Q computes neither bandwidth nor a valid inverse relationship."}]},{"cat":"06","type":"mcq","stem":"A tuned circuit has a 15 kHz bandwidth and a quality factor of 120. What is its resonant frequency?","sub":"tuned-circuit-bw-q","options":[{"t":"125 Hz","c":false,"fb":"Dividing bandwidth by Q inverts the relationship f_r = BW * Q."},{"t":"8 MHz","c":false,"fb":"Dividing Q by bandwidth (120 / 15) produces an invalid ratio instead of f_r."},{"t":"1.8 MHz","c":true,"fb":"Using f_r = BW * Q gives 15 kHz * 120 = 1800 kHz, which converts to 1.8 MHz."},{"t":"18 MHz","c":false,"fb":"Converting 1800 kHz to MHz divides by 1000, not 100."}]},{"cat":"06","type":"mcq","stem":"What is the quality factor of a circuit resonating at 4.5 MHz with a 9 kHz bandwidth?","sub":"tuned-circuit-bw-q","options":[{"t":"0.5","c":false,"fb":"Dividing 4.5 by 9 without converting MHz to kHz leaves mismatched frequency units."},{"t":"40.5","c":false,"fb":"Multiplying f_r by BW applies the wrong operation; Q equals f_r / BW."},{"t":"50","c":false,"fb":"Converting 4.5 MHz to 450 kHz instead of 4500 kHz drops one power of 10."},{"t":"500","c":true,"fb":"Converting 4.5 MHz to 4500 kHz gives Q = 4500 kHz / 9 kHz = 500."}]},{"cat":"06","type":"mcq","stem":"A tuned circuit has -3 dB band-edge frequencies at 995 kHz and 1.015 MHz. What is its bandwidth?","sub":"band-edge-bandwidth","options":[{"t":"20 kHz","c":true,"fb":"Converting 1.015 MHz to 1015 kHz gives BW = 1015 kHz - 995 kHz = 20 kHz."},{"t":"10 kHz","c":false,"fb":"Halving the span between f_2 and f_1 gives the deviation from center frequency, not full bandwidth."},{"t":"200 kHz","c":false,"fb":"Misconverting the 0.02 MHz difference to kHz by multiplying by 10,000 instead of 1,000 inflates the bandwidth tenfold."},{"t":"1005 kHz","c":false,"fb":"Averaging the two edge frequencies finds the approximate center frequency rather than the bandwidth."}]},{"cat":"06","type":"scenario","stem":"What is the quality factor (Q) of this circuit?","sub":"band-edge-bandwidth","context":"A tuned circuit resonates at 3.6 MHz and exhibits -3 dB band-edge frequencies at 3.591 MHz and 3.609 MHz.","options":[{"t":"20","c":false,"fb":"Misplacing the decimal during MHz-to-kHz conversion understates Q by a factor of 10."},{"t":"100","c":false,"fb":"Doubling the 18 kHz bandwidth halves the resulting quality factor."},{"t":"200","c":true,"fb":"The bandwidth is 3.609 - 3.591 = 0.018 MHz (18 kHz), so Q = 3600 kHz / 18 kHz = 200."},{"t":"400","c":false,"fb":"Using only the half-bandwidth (9 kHz) from center to one edge doubles Q incorrectly."}]},{"cat":"06","type":"mcq","stem":"What is the shape factor of a filter with a 10.5 kHz 60-dB bandwidth and a 4200 Hz 6-dB bandwidth?","sub":"shape-factor-calculation","options":[{"t":"0.4","c":false,"fb":"Dividing the 6-dB bandwidth by the 60-dB bandwidth inverts the shape factor formula."},{"t":"2.5","c":true,"fb":"Converting 4200 Hz to 4.2 kHz gives Shape Factor = 10.5 kHz / 4.2 kHz = 2.5."},{"t":"0.0025","c":false,"fb":"Dividing 10.5 kHz directly by 4200 Hz without matching units creates a 1000-fold error."},{"t":"6.3","c":false,"fb":"Subtracting the two bandwidths instead of dividing them does not compute shape factor."}]},{"cat":"06","type":"scenario","stem":"What is the filter's shape factor?","sub":"shape-factor-calculation","context":"An IF filter reaches -6 dB attenuation at 452.5 kHz and 457.5 kHz, and -60 dB attenuation at 449 kHz and 461 kHz.","options":[{"t":"0.42","c":false,"fb":"Dividing BW_6dB (5 kHz) by BW_60dB (12 kHz) inverts the required ratio."},{"t":"1.2","c":false,"fb":"Using half of the 60-dB span (6 kHz) against the full 5 kHz passband halves the shape factor."},{"t":"4.8","c":false,"fb":"Using half of the 6-dB span (2.5 kHz) against the full 12 kHz span doubles the shape factor."},{"t":"2.4","c":true,"fb":"Here BW_6dB = 457.5 - 452.5 = 5 kHz and BW_60dB = 461 - 449 = 12 kHz, giving 12 / 5 = 2.4."}]},{"cat":"06","type":"mcq","stem":"A filter has a shape factor of 1.6 and a 6-dB bandwidth of 5 kHz. What is its 60-dB bandwidth?","sub":"shape-factor-calculation","options":[{"t":"8 kHz","c":true,"fb":"Rearranging yields BW_60dB = SF * BW_6dB = 1.6 * 5 kHz = 8 kHz."},{"t":"3.125 kHz","c":false,"fb":"Dividing 5 kHz by 1.6 applies the inverse operation; BW_60dB must exceed BW_6dB."},{"t":"0.32 kHz","c":false,"fb":"Dividing shape factor by BW_6dB uses an inverted, dimensionally incorrect ratio."},{"t":"6.6 kHz","c":false,"fb":"Adding shape factor to BW_6dB confuses a dimensionless multiplier with an additive offset."}]},{"cat":"06","type":"mcq","stem":"What is the 6-dB bandwidth of a filter whose 60-dB bandwidth is 14.4 kHz and shape factor is 2.4?","sub":"shape-factor-calculation","options":[{"t":"34.56 kHz","c":false,"fb":"Multiplying 14.4 kHz by 2.4 solves in the wrong direction, making BW_6dB wider than BW_60dB."},{"t":"0.17 kHz","c":false,"fb":"Dividing shape factor (2.4) by 14.4 kHz inverts the correct division."},{"t":"6 kHz","c":true,"fb":"Rearranging gives BW_6dB = BW_60dB / SF = 14.4 kHz / 2.4 = 6 kHz."},{"t":"12.0 kHz","c":false,"fb":"Subtracting 2.4 from 14.4 kHz treats the dimensionless shape factor as a frequency offset."}]},{"cat":"06","type":"mcq","stem":"What shape factor represents the ideal selectivity limit with perfectly vertical filter skirts?","sub":"shape-factor-selectivity-comparison","options":[{"t":"0","c":false,"fb":"A zero shape factor would require a zero 60-dB bandwidth, which cannot exist around a nonzero passband."},{"t":"1","c":true,"fb":"With perfectly vertical skirts, BW_60dB equals BW_6dB, so their ratio is exactly 1."},{"t":"10","c":false,"fb":"This confuses the shape factor limit with the ratio between 60 dB and 6 dB attenuation values."},{"t":"60","c":false,"fb":"This confuses the shape factor limit with the 60 dB stopband attenuation threshold."}]},{"cat":"06","type":"scenario","stem":"Which receiver has better selectivity?","sub":"shape-factor-selectivity-comparison","context":"Receiver A has a 60-dB bandwidth of 12 kHz and a 6-dB bandwidth of 6 kHz. Receiver B has a 60-dB bandwidth of 15 kHz and a 6-dB bandwidth of 5 kHz.","options":[{"t":"Receiver A, because its shape factor is 2.0","c":true,"fb":"Receiver A has SF = 12 / 6 = 2.0 versus 15 / 5 = 3.0 for Receiver B; a lower shape factor indicates steeper skirts."},{"t":"Receiver B, because its shape factor is 3.0","c":false,"fb":"A shape factor of 3.0 (15 / 5) reflects wider, less selective skirts rather than better selectivity."},{"t":"Receiver B, because its shape factor is 2.0","c":false,"fb":"Subtracting the 6-dB bandwidth from the 60-dB bandwidth before dividing ((15 - 5) / 5 = 2.0) understates Receiver B's shape factor."},{"t":"Receiver A, because its shape factor is 3.0","c":false,"fb":"Adding the two bandwidths before dividing ((12 + 6) / 6 = 3.0) inflates the shape factor, and a larger shape factor means worse selectivity."}]},{"cat":"06","type":"mcq","stem":"What is the antenna input power when 10 uV appears across a 50 ohm receiver input impedance?","sub":"antenna-input-power","options":[{"t":"200 nW","c":false,"fb":"Computing V / R instead of V^2 / R omits squaring the input voltage."},{"t":"20 pW","c":false,"fb":"Misplacing one power of 10 when squaring 10 uV yields a result 10 times too large."},{"t":"0.2 pW","c":false,"fb":"Misplacing one power of 10 when dividing 10^-10 by 50 understates the power tenfold."},{"t":"2 pW","c":true,"fb":"Using P = V^2 / R gives (10 x 10^-6)^2 / 50 = 10^-10 / 50 = 2 x 10^-12 W = 2 pW."}]},{"cat":"06","type":"mcq","stem":"What input voltage appears across a 50 ohm antenna impedance when 8 pW of power is delivered?","sub":"antenna-input-power","options":[{"t":"400 uV","c":false,"fb":"Multiplying P * R gives V^2 = 400 x 10^-12 V^2; omitting the square root on 400 gives 400 instead of 20."},{"t":"0.4 uV","c":false,"fb":"Dividing P by R instead of multiplying P * R inside the square root misapplies V = sqrt(P * R)."},{"t":"20 uV","c":true,"fb":"Using V = sqrt(P * R) gives sqrt(8 x 10^-12 * 50) = sqrt(400 x 10^-12) = 20 x 10^-6 V = 20 uV."},{"t":"2 uV","c":false,"fb":"Evaluating sqrt(400) as 2 instead of 20 understates the input voltage by a factor of 10."}]},{"cat":"06","type":"mcq","stem":"What is a receiver's input impedance if a 3 mV signal produces 120 nW of input power?","sub":"antenna-input-power","options":[{"t":"25 ohms","c":false,"fb":"Failing to square the coefficient 3 while squaring 10^-3 gives (3 x 10^-6) / (120 x 10^-9) = 25 ohms."},{"t":"75 ohms","c":true,"fb":"Using R = V^2 / P gives (3 x 10^-3)^2 / (120 x 10^-9) = 9000 / 120 = 75 ohms."},{"t":"750 ohms","c":false,"fb":"Misconverting between mV^2 (10^-6) and nW (10^-9) shifts the impedance by a factor of 10."},{"t":"250 ohms","c":false,"fb":"Failing to square the coefficient 3 and misconverting between mV^2 and nW shifts the result by a factor of 10."}]},{"cat":"06","type":"mcq","stem":"What is a 4 nW receiver input signal power expressed in dBm? (Use log10(4) = 0.6021.)","sub":"power-dbm-conversion","options":[{"t":"-53.98 dBm","c":true,"fb":"Dividing 4 x 10^-9 W by 10^-3 W gives 4 x 10^-6; 10 * (0.6021 - 6) = -53.98 dBm."},{"t":"-66.02 dBm","c":false,"fb":"Subtracting 0.6021 from -6 instead of adding it applies the wrong sign to log10(4)."},{"t":"-83.98 dBm","c":false,"fb":"Referencing 1 W instead of 1 mW (10^-3 W) calculates dBW rather than dBm."},{"t":"-96.02 dBm","c":false,"fb":"Referencing 1 W instead of 1 mW and subtracting 0.6021 from -9 combines a dBW reference error with a mantissa sign error."}]},{"cat":"06","type":"mcq","stem":"What is a -90 dBm minimum discernible signal expressed as power in picowatts?","sub":"power-dbm-conversion","options":[{"t":"1000 pW","c":false,"fb":"Evaluating 10^(-90/10) = 10^-9 directly in watts omits the 1 mW (10^-3 W) reference factor."},{"t":"0.001 pW","c":false,"fb":"Applying the 10^-3 mW factor twice gives 10^-15 W (0.001 pW) instead of 10^-12 W."},{"t":"0.1 pW","c":false,"fb":"Miscounting the decimal exponent when converting 10^-12 W to picowatts shifts the value by 10."},{"t":"1 pW","c":true,"fb":"Using P = 1 mW * 10^(-90/10) gives 10^-3 W * 10^-9 = 10^-12 W = 1 pW."}]},{"cat":"06","type":"scenario","stem":"What is this MDS expressed in dBm?","sub":"mds-voltage-dbm-chain","context":"A receiver specifies a minimum discernible signal (MDS) of 2 uV across a 50 ohm antenna input. (Use log10(4) = 0.6021 and log10(8) = 0.9031.)","options":[{"t":"-133.98 dBm","c":false,"fb":"Failing to square the coefficient 2 in V^2 and referencing 1 W instead of 1 mW combines a power error with a dBW shift."},{"t":"-103.98 dBm","c":false,"fb":"Failing to square the coefficient 2 in V^2 yields P = 4 x 10^-14 W, understating the input power."},{"t":"-100.97 dBm","c":true,"fb":"First P = (2 x 10^-6)^2 / 50 = 8 x 10^-14 W; then 10 * log10(8 x 10^-11) = 10 * (0.9031 - 11) = -100.97 dBm."},{"t":"-130.97 dBm","c":false,"fb":"Referencing power to 1 W instead of 1 mW (10^-3 W) computes dBW rather than dBm."}]},{"cat":"06","type":"scenario","stem":"What is the equivalent input voltage?","sub":"mds-voltage-dbm-chain","context":"A 50 ohm receiver has a rated MDS of -93.01 dBm. (Use log10(5) = 0.6990.)","options":[{"t":"25 uV","c":false,"fb":"Stopping at P * R = 25 x 10^-12 without taking the square root of 25 yields 25 instead of 5."},{"t":"5 uV","c":true,"fb":"From -9.301 = 0.6990 - 10, P = 1 mW * 5 x 10^-10 = 5 x 10^-13 W, so V = sqrt(5 x 10^-13 * 50) = 5 uV."},{"t":"0.1 uV","c":false,"fb":"Dividing P by R instead of multiplying P * R inside the square root gives sqrt(10^-14) = 0.1 uV."},{"t":"158 uV","c":false,"fb":"Omitting the 1 mW factor when converting -93.01 dBm leaves P too high by 1000, inflating V by sqrt(1000)."}]},{"cat":"06","type":"mcq","stem":"What signal parameters correspond to the classic radio emission code `F2`?","sub":"classic-emission-decode","options":[{"t":"AM telephony DSB full carrier","c":false,"fb":"That combination describes classic code `A3` (`A` for amplitude modulation and `3` for telephony)."},{"t":"FM keyed tone DSB full carrier","c":true,"fb":"`F` is frequency modulation, `2` is a keyed ON/OFF tone, and no subscript means double sideband, full carrier."},{"t":"AM keyed tone SSB reduced carrier","c":false,"fb":"That combination corresponds to classic code `A2_a` (`A` for amplitude modulation and `_a` for single sideband, reduced carrier)."},{"t":"FM telephony SSB reduced carrier","c":false,"fb":"That combination corresponds to classic code `F3_a` (`3` for telephony and `_a` for single sideband, reduced carrier)."}]},{"cat":"06","type":"scenario","stem":"Which modulation, information, and carrier specifics match this code?","sub":"classic-emission-decode","context":"A transmitter log lists a signal under the classic radio emission code `A3_a`.","options":[{"t":"AM telephony SSB full carrier","c":false,"fb":"Single sideband, full carrier uses subscript `_h`, not `_a`."},{"t":"AM telephony SSB no carrier","c":false,"fb":"Single sideband, no carrier uses subscript `_j`, not `_a`."},{"t":"AM telephony SSB reduced carrier","c":true,"fb":"`A` is amplitude modulation, `3` is telephony, and `_a` is single sideband, reduced carrier."},{"t":"AM telephony DSB full carrier","c":false,"fb":"Double sideband, full carrier omits the subscript (`A3`), whereas `_a` specifies single sideband, reduced carrier."}]},{"cat":"06","type":"scenario","stem":"What modulation, information category, and pulse specifics does this tag represent?","sub":"classic-emission-decode","context":"A radar link is tagged with the classic radio emission code `P9_f`.","options":[{"t":"FM Morse code carrier pulses PPM","c":false,"fb":"That combination corresponds to classic code `F1_f` (`F` for frequency modulation and `1` for Morse code/radar)."},{"t":"FM general carrier pulses PAM","c":false,"fb":"That combination corresponds to classic code `F9_d` (`F` for frequency modulation and `_d` for PAM carrier pulses)."},{"t":"PM Morse code carrier pulses PAM","c":false,"fb":"That combination corresponds to classic code `P1_d` (`1` for carrier ON/OFF Morse code and `_d` for PAM carrier pulses)."},{"t":"PM general carrier pulses PPM","c":true,"fb":"`P` is phase modulation, `9` is general information, and `_f` specifies carrier pulses with pulse position modulation (PPM)."}]},{"cat":"06","type":"mcq","stem":"Encode frequency-modulated non-moving graphics with double sideband, full carrier into a classic emission code.","sub":"classic-emission-encode","options":[{"t":"`F4`","c":true,"fb":"`F` is frequency modulation, `4` is fax/non-moving graphics, and double sideband, full carrier omits the subscript."},{"t":"`F5`","c":false,"fb":"Information type `5` denotes vestigial sideband (commercial TV) rather than non-moving graphics."},{"t":"`A4_b`","c":false,"fb":"`A` denotes amplitude modulation and subscript `_b` denotes double sideband, no carrier."},{"t":"`A5_b`","c":false,"fb":"`A` denotes amplitude modulation, `5` denotes vestigial sideband, and `_b` denotes double sideband, no carrier."}]},{"cat":"06","type":"scenario","stem":"What is the correct classic radio emission code for this signal?","sub":"classic-emission-encode","context":"A signal uses amplitude modulation to send ON/OFF Morse code (no message) with a vestigial sideband.","options":[{"t":"`A2_c`","c":false,"fb":"Keyed tone ON/OFF uses information type `2`, whereas carrier ON/OFF Morse code uses `1`."},{"t":"`A1_c`","c":true,"fb":"`A` is amplitude modulation, `1` is carrier ON/OFF Morse code, and `_c` specifies vestigial sideband."},{"t":"`A1_b`","c":false,"fb":"Subscript `_b` represents double sideband, no carrier, whereas vestigial sideband uses `_c`."},{"t":"`A5`","c":false,"fb":"Using information type `5` omits the ON/OFF Morse code (`1`) and misapplies the vestigial sideband subscript `_c`."}]},{"cat":"06","type":"scenario","stem":"Which classic radio emission code represents this transmission?","sub":"classic-emission-encode","context":"A link transmits voice telephony using phase modulation with pulse width modulation (PWM) carrier pulses only.","options":[{"t":"`P2_d`","c":false,"fb":"Information type `2` denotes a keyed ON/OFF tone and subscript `_d` denotes pulse amplitude modulation (PAM) carrier pulses."},{"t":"`P3_d`","c":false,"fb":"Subscript `_d` denotes pulse amplitude modulation (PAM) carrier pulses rather than PWM."},{"t":"`P2_e`","c":false,"fb":"Information type `2` denotes a keyed ON/OFF tone rather than voice telephony."},{"t":"`P3_e`","c":true,"fb":"`P` is phase modulation, `3` is telephony (voice or music), and `_e` is carrier pulses only with PWM."}]},{"cat":"06","type":"mcq","stem":"What numeric bandwidth with units does the ITU designator `4K80` represent?","sub":"itu-bandwidth-decode","options":[{"t":"`4.8 kHz`","c":true,"fb":"Replacing uppercase `K` with a decimal point and `kHz` gives `4.80 kHz`, or `4.8 kHz`."},{"t":"`480 Hz`","c":false,"fb":"`4K80` uses `K` (kilohertz) at the decimal point (`4.80 kHz`), whereas `480 Hz` encodes as `480H`."},{"t":"`48 kHz`","c":false,"fb":"`K` sits between `4` and `8`, placing the decimal point after `4` rather than after `48`."},{"t":"`4.8 MHz`","c":false,"fb":"`K` denotes kilohertz (`kHz`); megahertz (`MHz`) would use `M` (`4M80`)."}]},{"cat":"06","type":"mcq","stem":"Convert the ITU bandwidth designator `1G25` into a numeric frequency with units.","sub":"itu-bandwidth-decode","options":[{"t":"`125
