ning 300 MHz to 3 GHz, commonly utilized for walkie-talkies and two-way radio communications, is abbreviated as ____.","subtype":"acronym","answer":["UHF"],"caseSensitive":false,"hint":"Ultra-High Frequency.","fb":"The 300 MHz to 3 GHz range is designated as Ultra-High Frequency (UHF)."},{"cat":"02","type":"scenario","stem":"According to the spectrum allocations, which band must the communication system utilize?","context":"A marine communications officer is selecting a frequency band capable of transmitting specialized radio signals to submerged submarines.","options":[{"t":"Medium Frequency (MF) operating between 300 kHz and 3 MHz","c":false,"fb":"Selects the AM radio broadcast band rather than the submarine band."},{"t":"Very Low Frequency (VLF) operating between 3 and 30 kHz","c":true,"fb":"Accurately identifies VLF (3–30 kHz) as the designated band for radio signals to submarines."},{"t":"Extremely High Frequency (EHF) operating between 30 and 300 GHz","c":false,"fb":"Selects the millimeter-wave Bluetooth/GPS band which cannot penetrate deep water."},{"t":"Super High Frequency (SHF) operating between 3 and 30 GHz","c":false,"fb":"Selects the radar/wireless LAN band instead of the submarine band."}]},{"cat":"02","type":"mcq","stem":"In the optical region of the electromagnetic spectrum, what are the wavelength boundaries defined for the visible spectrum?","options":[{"t":"0.7 to 10 μm","c":false,"fb":"Identifies the wavelength range for infrared radiation rather than visible light."},{"t":"0.4 to 0.8 μm","c":true,"fb":"Accurately identifies 0.4 to 0.8 μm (0.4 x 10^-6 m violet to 0.7/0.8 x 10^-6 m red) as the visible spectrum."},{"t":"10 to 100 μm","c":false,"fb":"Extends far beyond the visible range into the thermal infrared spectrum."},{"t":"0.01 to 0.1 μm","c":false,"fb":"Identifies the ultraviolet/X-ray region rather than the visible optical band."}]},{"cat":"03","type":"mcq","stem":"Raw message data is converted into digital signals or waves over a modulator so transmission can be optimized and the signal can reach farther. What process is being performed?","sub":"modulation-purpose","options":[{"t":"Modulation","c":true,"fb":"Modulation converts raw message data into signals or waves to optimize transmission."},{"t":"Carrier signal","c":false,"fb":"A carrier is a steady waveform used in the modulation process, not the process itself."},{"t":"Modulating signal","c":false,"fb":"The modulating signal is the message to be transmitted."},{"t":"Modulated signal","c":false,"fb":"The modulated signal is the output after modulation."}]},{"cat":"03","type":"scenario","stem":"What is the intended result of this modulation process?","sub":"modulation-purpose","context":"A communication system receives raw message data that is not yet suitable for effective transmission. A modulator processes the data before it is sent.","options":[{"t":"Optimize signal transmission","c":true,"fb":"Modulation optimizes transmission and increases signal strength for greater reach."},{"t":"Remove the message data","c":false,"fb":"Modulation prepares the message for transmission rather than removing it."},{"t":"Eliminate the transmission device","c":false,"fb":"Modulation improves suitability for transmission; it does not replace the device."},{"t":"Keep the raw data unchanged","c":false,"fb":"The raw message data is converted during modulation."}]},{"cat":"03","type":"mcq","stem":"Three waveforms are involved in modulation. One is steady in amplitude and frequency before the message alters it. What is this waveform called?","sub":"signal-roles-in-modulation","options":[{"t":"Carrier signal","c":true,"fb":"The carrier is the steady waveform in amplitude and frequency."},{"t":"Modulating signal","c":false,"fb":"The modulating signal contains the message to be transmitted."},{"t":"Modulated signal","c":false,"fb":"The modulated signal is produced after the modulation process."},{"t":"Message signal","c":false,"fb":"The message is the modulating signal, not the steady carrier waveform."}]},{"cat":"03","type":"multi","stem":"A student is labeling signals in a modulation diagram. Which TWO label-role pairings are correct? Select the TWO correct options.","sub":"signal-roles-in-modulation","options":[{"t":"Carrier — steady waveform","c":true,"fb":"The carrier is steady in amplitude and frequency before modulation."},{"t":"Carrier — transmitted message","c":false,"fb":"The message belongs to the modulating signal, not the carrier."},{"t":"Modulating — message signal","c":true,"fb":"The modulating signal is the message that must be transmitted."},{"t":"Modulated — original carrier","c":false,"fb":"The modulated signal is the output after the carrier has been modified."},{"t":"Modulating — final output","c":false,"fb":"The final output is the modulated signal."}]},{"cat":"03","type":"scenario","stem":"What is the waveform leaving the process?","sub":"signal-roles-in-modulation","context":"A message waveform and a steady carrier waveform enter a modulation process. A third waveform leaves the process after the carrier has been changed by the message.","options":[{"t":"Modulated signal","c":true,"fb":"The modulated signal is the output produced after modulation."},{"t":"Carrier signal","c":false,"fb":"The carrier is the waveform acted upon during modulation."},{"t":"Modulating signal","c":false,"fb":"The modulating signal is the message entering the process."},{"t":"Message signal","c":false,"fb":"The message is an input rather than the resulting output."}]},{"cat":"03","type":"mcq","stem":"Human-audible signals used for content such as news, music, and weather occupy what frequency range?","sub":"audio-spectrum-motivation","options":[{"t":"20 Hz–20 kHz","c":true,"fb":"The stated audio spectrum ranges from 20 Hz to 20 kHz."},{"t":"20 Hz–2 kHz","c":false,"fb":"This incorrectly lowers the upper limit of the stated audio spectrum."},{"t":"200 Hz–20 kHz","c":false,"fb":"This incorrectly raises the lower limit from 20 Hz."},{"t":"2 kHz–20 kHz","c":false,"fb":"This omits the lower-frequency portion of the stated audio spectrum."}]},{"cat":"03","type":"scenario","stem":"What AM approach addresses this problem?","sub":"audio-spectrum-motivation","context":"A radio system must transmit a low-frequency audio message wirelessly. Sending the audio signal directly at its original frequency is difficult.","options":[{"t":"Use high-frequency carrier","c":true,"fb":"AM allows a high-frequency carrier to carry the low-frequency audio signal."},{"t":"Use low-frequency carrier","c":false,"fb":"This reverses the stated relationship between carrier and audio frequencies."},{"t":"Remove the audio message","c":false,"fb":"The audio message must still be carried through the communication process."},{"t":"Replace carrier with message","c":false,"fb":"The carrier and modulating message have different roles in modulation."}]},{"cat":"03","type":"mcq","stem":"In amplitude modulation, which property of the radio-frequency carrier is varied in direct proportion to the modulating signal?","sub":"am-definition","options":[{"t":"Carrier amplitude","c":true,"fb":"AM varies the instantaneous amplitude of the RF carrier."},{"t":"Carrier frequency","c":false,"fb":"AM changes carrier amplitude rather than carrier frequency."},{"t":"Message frequency","c":false,"fb":"The modulating signal controls the carrier amplitude; its frequency is not the carrier property being changed."},{"t":"Output frequency","c":false,"fb":"The defining change in AM is the carrier's amplitude."}]},{"cat":"03","type":"scenario","stem":"What corresponding change should occur in the carrier?","sub":"am-definition","context":"An RF carrier is being amplitude-modulated by a message signal. At one instant, the amplitude of the modulating signal increases.","options":[{"t":"Carrier amplitude increases","c":true,"fb":"The carrier amplitude varies directly with the modulating signal amplitude."},{"t":"Carrier amplitude decreases","c":false,"fb":"This reverses the direct proportional relationship."},{"t":"Carrier frequency increases","c":false,"fb":"AM varies carrier amplitude, not carrier frequency."},{"t":"Carrier frequency decreases","c":false,"fb":"The carrier frequency is not the quantity changed by the message amplitude."}]},{"cat":"03","type":"multi","stem":"Which TWO descriptions correctly characterize amplitude modulation? Select the TWO correct options.","sub":"am-definition","options":[{"t":"RF carrier amplitude varies","c":true,"fb":"AM changes the instantaneous amplitude of the RF carrier."},{"t":"Carrier frequency varies","c":false,"fb":"Changing carrier frequency is not the defining operation of AM."},{"t":"Message controls amplitude","c":true,"fb":"Carrier amplitude varies in direct proportion to the modulating signal."},{"t":"Carrier amplitude stays fixed","c":false,"fb":"The carrier amplitude must change during amplitude modulation."},{"t":"Message becomes steady carrier","c":false,"fb":"The message remains the modulating signal rather than becoming the carrier."}]},{"cat":"03","type":"fitb","stem":"At the input stage of the AM system, a microphone acts as a ____ that receives an audio-frequency signal.","sub":"transducer-mixer-chain","subtype":"term","answer":["transducer"],"caseSensitive":false,"fb":"The microphone functions as a transducer that receives the audio-frequency input signal."},{"cat":"03","type":"scenario","stem":"Which sequence correctly identifies the microphone role and the combining block?","sub":"transducer-mixer-chain","context":"A microphone receives an audio-frequency input. The signal then enters a block that combines inputs so the resulting signal reaches a radio frequency acceptable to the transmission device.","options":[{"t":"Transducer → mixer","c":true,"fb":"The microphone acts as a transducer, and the mixer combines the input for RF transmission."},{"t":"Mixer → transducer","c":false,"fb":"This reverses the roles of the microphone and mixer."},{"t":"Carrier → mixer","c":false,"fb":"A carrier is a signal, not the microphone's device role."},{"t":"Mixer → carrier","c":false,"fb":"The microphone is not identified as a mixer, and carrier is not the combining block."}]},{"cat":"03","type":"mcq","stem":"During amplitude modulation, what happens to the carrier frequency while its amplitude changes with the modulating signal?","sub":"carrier-frequency-constant","options":[{"t":"It stays constant","c":true,"fb":"The carrier frequency remains constant during AM."},{"t":"It steadily increases","c":false,"fb":"Carrier frequency does not rise as part of amplitude modulation."},{"t":"It steadily decreases","c":false,"fb":"Carrier frequency does not fall as part of amplitude modulation."},{"t":"It follows amplitude","c":false,"fb":"The amplitude follows the modulating signal while the carrier frequency remains constant."}]},{"cat":"03","type":"scenario","stem":"Which carrier behavior matches AM?","sub":"carrier-frequency-constant","context":"The modulating signal becomes larger in amplitude. The AM carrier responds to this change while remaining in the same modulation process.","options":[{"t":"Amplitude rises; frequency constant","c":true,"fb":"Increasing modulating amplitude increases carrier amplitude while carrier frequency stays constant."},{"t":"Amplitude constant; frequency rises","c":false,"fb":"This swaps the changing and constant carrier properties."},{"t":"Amplitude falls; frequency constant","c":false,"fb":"This reverses the stated amplitude relationship."},{"t":"Amplitude rises; frequency rises","c":false,"fb":"Carrier amplitude can rise, but its frequency remains constant."}]},{"cat":"03","type":"scenario","stem":"Which characteristic does this waveform demonstrate?","sub":"carrier-frequency-constant","context":"An AM waveform shows its positive and negative peaks expanding and contracting with the message signal. The carrier continues oscillating at the same frequency throughout.","options":[{"t":"Constant frequency, varying amplitude","c":true,"fb":"AM keeps carrier frequency constant while its peaks and amplitude follow the modulating signal."},{"t":"Varying frequency, constant amplitude","c":false,"fb":"This reverses the two carrier characteristics in AM."},{"t":"Varying frequency, varying amplitude","c":false,"fb":"The carrier amplitude varies, but its frequency remains constant."},{"t":"Constant frequency, constant amplitude","c":false,"fb":"This ignores the amplitude changes produced by the modulating signal."}]},{"cat":"03","type":"fitb","stem":"The imaginary line connecting the positive and negative peaks of a modulated carrier waveform is called the ____.","sub":"envelope-definition","subtype":"term","answer":["envelope"],"caseSensitive":false,"fb":"The envelope traces the changing positive and negative peaks of the AM carrier waveform."},{"cat":"03","type":"scenario","stem":"What does this imaginary boundary represent?","sub":"envelope-definition","context":"An AM waveform has rapidly oscillating carrier cycles. A smooth imaginary boundary follows the outer positive peaks and the corresponding negative peaks.","options":[{"t":"Envelope","c":true,"fb":"It connects the carrier waveform's positive and negative peaks."},{"t":"Carrier frequency","c":false,"fb":"Carrier frequency describes oscillation rate, not the boundary line."},{"t":"Modulating frequency","c":false,"fb":"The modulating frequency is not the waveform's outer boundary."},{"t":"Sideband","c":false,"fb":"Sidebands are generated frequencies, not an imaginary peak line."}]},{"cat":"03","type":"mcq","stem":"In the simplified AM waveform, what represents the high-frequency carrier waves?","sub":"simplified-waveform-representation","options":[{"t":"Equally spaced vertical lines","c":true,"fb":"The simplified waveform uses equally spaced vertical lines for the carrier."},{"t":"Unequally spaced vertical lines","c":false,"fb":"The carrier lines are shown equally spaced."},{"t":"Equally spaced horizontal lines","c":false,"fb":"The simplified carrier representation uses vertical, not horizontal, lines."},{"t":"Unequally spaced horizontal lines","c":false,"fb":"Neither the orientation nor spacing matches the simplified representation."}]},{"cat":"03","type":"mcq","stem":"A simplified AM drawing uses equally spaced vertical carrier lines. As the modulating signal amplitude changes, what should change in those lines?","sub":"simplified-waveform-representation","options":[{"t":"Their heights","c":true,"fb":"Carrier-line amplitude varies with the modulating signal."},{"t":"Their spacing","c":false,"fb":"The lines remain equally spaced; their height changes."},{"t":"Their direction","c":false,"fb":"The representation remains vertical as amplitude varies."},{"t":"Their number","c":false,"fb":"The defining change is line height, not the number of lines."}]},{"cat":"03","type":"fitb","stem":"Voltage or current variations occurring over time are displayed on an ____ screen.","sub":"time-domain","subtype":"term","answer":["oscilloscope"],"caseSensitive":false,"fb":"Time-domain signals show voltage or current variation over time and are displayed on an oscilloscope."},{"cat":"03","type":"mcq","stem":"A display shows how a signal's voltage changes as time passes. Which domain is being used?","sub":"time-domain","options":[{"t":"Time domain","c":true,"fb":"Time-domain signals show voltage or current variation over time."},{"t":"Frequency domain","c":false,"fb":"Frequency domain organizes signal components by frequency."},{"t":"Sideband domain","c":false,"fb":"Sideband is a frequency component, not a domain type."},{"t":"Carrier domain","c":false,"fb":"Carrier refers to a signal, not a display domain."}]},{"cat":"03","type":"mcq","stem":"On a frequency-domain display, what does the horizontal axis represent?","sub":"frequency-domain-axes","options":[{"t":"Frequency","c":true,"fb":"Frequency is plotted on the horizontal axis."},{"t":"Voltage","c":false,"fb":"Voltage may represent magnitude on the vertical axis."},{"t":"Current","c":false,"fb":"Current may represent magnitude on the vertical axis."},{"t":"Power","c":false,"fb":"Power may represent magnitude on the vertical axis."}]},{"cat":"03","type":"mcq","stem":"A spectrum graph places frequency along the horizontal axis. Which quantity can correctly appear on its vertical axis?","sub":"frequency-domain-axes","options":[{"t":"Signal power","c":true,"fb":"Magnitude may be expressed using voltage, current, or power."},{"t":"Signal time","c":false,"fb":"Time is not the stated vertical-axis quantity in the frequency domain."},{"t":"Carrier frequency","c":false,"fb":"Frequency belongs on the horizontal axis."},{"t":"Modulating frequency","c":false,"fb":"Modulating frequency is positioned along the horizontal frequency axis."}]},{"cat":"03","type":"mcq","stem":"An AM waveform is created from signals containing more than one frequency. Which representation is preferred?","sub":"domain-selection-rule","options":[{"t":"Frequency domain","c":true,"fb":"Multiple-frequency AM waveforms are preferably shown in the frequency domain."},{"t":"Time domain","c":false,"fb":"The source prefers frequency domain when multiple frequencies form the waveform."},{"t":"Envelope only","c":false,"fb":"An envelope describes waveform peaks, not the preferred analysis domain."},{"t":"Carrier only","c":false,"fb":"Showing only the carrier omits the multiple-frequency content."}]},{"cat":"03","type":"scenario","stem":"Which display best separates these frequency components?","sub":"domain-selection-rule","context":"A technician wants to show an AM signal containing a carrier plus additional frequency components generated during modulation.","options":[{"t":"Frequency-domain display","c":true,"fb":"Frequency domain separates components according to frequency."},{"t":"Time-domain display","c":false,"fb":"Time domain emphasizes variation with time rather than separate frequencies."},{"t":"Envelope-only display","c":false,"fb":"The envelope does not separately locate frequency components."},{"t":"Carrier-only display","c":false,"fb":"A carrier-only view omits the other generated frequencies."}]},{"cat":"03","type":"mcq","stem":"During modulation, new frequencies appear above and below the carrier frequency. What are these frequencies called?","sub":"sideband-origin","options":[{"t":"Sidebands","c":true,"fb":"Sidebands are the new frequencies generated around the carrier."},{"t":"Envelopes","c":false,"fb":"An envelope is the imaginary boundary joining waveform peaks."},{"t":"Carriers","c":false,"fb":"The carrier is the original signal being modulated."},{"t":"Transducers","c":false,"fb":"A transducer is a device role, not a generated frequency."}]},{"cat":"03","type":"multi","stem":"Which THREE characteristics describe sidebands produced during amplitude modulation? Select the THREE correct options.","sub":"sideband-origin","options":[{"t":"Generated during modulation","c":true,"fb":"Sidebands arise as new frequencies during modulation."},{"t":"Found above carrier","c":true,"fb":"One sideband appears above the carrier frequency."},{"t":"Found below carrier","c":true,"fb":"One sideband appears below the carrier frequency."},{"t":"Replace the carrier","c":false,"fb":"Sidebands accompany the carrier rather than replacing it."},{"t":"Exist only over time","c":false,"fb":"Sidebands are frequency components in the spectrum."}]},{"cat":"03","type":"scenario","stem":"What do the two additional lines represent?","sub":"sideband-origin","context":"A frequency spectrum shows one central carrier line. Two additional lines appear during modulation: one lies above the carrier and one below it.","options":[{"t":"Sidebands","c":true,"fb":"Modulation generates side frequencies above and below the carrier."},{"t":"Envelopes","c":false,"fb":"Envelopes are waveform boundaries in a time-domain representation."},{"t":"Carrier peaks","c":false,"fb":"Peaks are amplitude features, not separate frequency-spectrum lines."},{"t":"Oscilloscope traces","c":false,"fb":"Oscilloscope traces display signals rather than name these frequencies."}]},{"cat":"03","type":"mcq","stem":"Which expression gives the upper sideband frequency?","sub":"sideband-formulas","options":[{"t":"\\(f_c + f_m\\)","c":true,"fb":"The upper sideband is the sum of carrier and modulating frequencies."},{"t":"\\(f_c - f_m\\)","c":false,"fb":"Subtraction gives the lower sideband."},{"t":"\\(f_m - f_c\\)","c":false,"fb":"Reversing the subtraction does not give the stated sideband formula."},{"t":"\\(f_c \\times f_m\\)","c":false,"fb":"Sideband frequency is found by addition or subtraction, not multiplication."}]},{"cat":"03","type":"multi","stem":"Which TWO equations correctly describe AM sideband frequencies? Select the TWO correct options.","sub":"sideband-formulas","options":[{"t":"\\(f_{USB}=f_c+f_m\\)","c":true,"fb":"The upper sideband is the carrier-plus-modulating frequency."},{"t":"\\(f_{LSB}=f_c-f_m\\)","c":true,"fb":"The lower sideband is the carrier-minus-modulating frequency."},{"t":"\\(f_{USB}=f_c-f_m\\)","c":false,"fb":"This incorrectly assigns the lower-sideband operation to USB."},{"t":"\\(f_{LSB}=f_c+f_m\\)","c":false,"fb":"This incorrectly assigns the upper-sideband operation to LSB."},{"t":"\\(f_{LSB}=f_m-f_c\\)","c":false,"fb":"The stated lower-sideband formula subtracts \\(f_m\\) from \\(f_c\\)."}]},{"cat":"03","type":"mcq","stem":"An AM system has \\(f_c=1000\\text{ kHz}\\) and \\(f_m=5\\text{ kHz}\\). What are \\(f_{USB}\\) and \\(f_{LSB}\\), respectively?","sub":"sideband-formulas","options":[{"t":"1005 kHz, 995 kHz","c":true,"fb":"USB is \\(1000+5\\), while LSB is \\(1000-5\\)."},{"t":"995 kHz, 1005 kHz","c":false,"fb":"This swaps the upper and lower sidebands."},{"t":"1005 kHz, 1000 kHz","c":false,"fb":"The lower sideband must subtract the modulating frequency."},{"t":"1000 kHz, 995 kHz","c":false,"fb":"The upper sideband must add the modulating frequency."}]},{"cat":"03","type":"mcq","stem":"Which expression gives the total bandwidth of an AM signal?","sub":"bandwidth-formula","options":[{"t":"fUSB − fLSB","c":true,"fb":"Bandwidth is the difference between the upper and lower sideband frequencies."},{"t":"fUSB + fLSB","c":false,"fb":"Adding the sidebands does not give the occupied bandwidth."},{"t":"fc + fm","c":false,"fb":"This expression gives the upper sideband frequency."},{"t":"fc − fm","c":false,"fb":"This expression gives the lower sideband frequency."}]},{"cat":"03","type":"fitb","stem":"An AM signal has a modulating frequency of 7 kHz. Using BW = 2fm, its total bandwidth in kHz is ____. Enter the number only.","sub":"bandwidth-formula","subtype":"numeric","answer":["14"],"caseSensitive":false,"fb":"Total bandwidth is twice the modulating frequency: 2 × 7 kHz = 14 kHz."},{"cat":"03","type":"scenario","stem":"What is the total bandwidth of the AM signal?","sub":"bandwidth-formula","context":"A frequency-domain AM spectrum shows its lower sideband at 196 kHz and its upper sideband at 204 kHz.","options":[{"t":"4 kHz","c":false,"fb":"This corresponds to the sideband offset, not the total bandwidth."},{"t":"8 kHz","c":true,"fb":"BW = 204 kHz − 196 kHz = 8 kHz."},{"t":"200 kHz","c":false,"fb":"This is the midpoint carrier frequency, not the bandwidth."},{"t":"204 kHz","c":false,"fb":"This is the upper sideband frequency itself."}]},{"cat":"03","type":"mcq","stem":"Which ratio defines the modulation index m?","sub":"modulation-index-definition","options":[{"t":"Vm / Vc","c":true,"fb":"Modulation index is the peak modulating voltage divided by the unmodulated peak carrier voltage."},{"t":"Vc / Vm","c":false,"fb":"This reverses the required voltage ratio."},{"t":"Vm × Vc","c":false,"fb":"The two peak voltages are divided, not multiplied."},{"t":"Vm + Vc","c":false,"fb":"Adding the voltages does not produce modulation index."}]},{"cat":"03","type":"fitb","stem":"A carrier has Vc = 8 V and the modulating signal has Vm = 6.5 V. The modulation index is ____.","sub":"modulation-index-definition","subtype":"numeric","answer":["0.8125"],"caseSensitive":false,"fb":"Using m = Vm/Vc gives 6.5/8 = 0.8125."},{"cat":"03","type":"multi","stem":"Which TWO choices correctly describe the modulation index m? Select the TWO correct options.","sub":"modulation-index-definition","options":[{"t":"Vm / Vc","c":true,"fb":"This is the defining ratio for modulation index."},{"t":"Vc / Vm","c":false,"fb":"This incorrectly reverses the defining ratio."},{"t":"Degree of modulation","c":true,"fb":"Degree of modulation is another name for modulation index."},{"t":"Total bandwidth","c":false,"fb":"Bandwidth describes frequency span, not modulation index."},{"t":"Carrier frequency","c":false,"fb":"Carrier frequency is a frequency value, not the modulation index."}]},{"cat":"03","type":"mcq","stem":"Which amplitude relationship must be maintained to prevent distortion?","sub":"overmodulation-constraint","options":[{"t":"Vm < Vc","c":true,"fb":"The modulating signal amplitude must remain less than the carrier amplitude."},{"t":"Vm = Vc","c":false,"fb":"The stated requirement is strictly less than, not equal to."},{"t":"Vm > Vc","c":false,"fb":"A modulating amplitude above the carrier violates the required condition."},{"t":"Vm = 2Vc","c":false,"fb":"This makes the modulating amplitude greater than the carrier."}]},{"cat":"03","type":"scenario","stem":"What consequence follows from this condition?","sub":"overmodulation-constraint","context":"An AM transmitter has a peak carrier voltage Vc = 6 V. Its peak modulating voltage rises to Vm = 7 V.","options":[{"t":"Distortion occurs","c":true,"fb":"Vm exceeds Vc, violating the required Vm < Vc relationship."},{"t":"No distortion occurs","c":false,"fb":"The required amplitude condition is no longer satisfied."},{"t":"Bandwidth becomes zero","c":false,"fb":"The amplitude violation is associated with distortion, not zero bandwidth."},{"t":"Carrier frequency changes","c":false,"fb":"The stated problem concerns amplitude relationship, not carrier-frequency change."}]},{"cat":"03","type":"mcq","stem":"An AM signal has a modulation index of 0.625. What is its percentage modulation?","sub":"percentage-modulation","options":[{"t":"0.625%","c":false,"fb":"This leaves the fractional index unchanged instead of multiplying by 100."},{"t":"6.25%","c":false,"fb":"This effectively multiplies the index by only 10."},{"t":"62.5%","c":true,"fb":"Percentage modulation is 0.625 × 100 = 62.5%."},{"t":"625%","c":false,"fb":"This incorrectly multiplies the index by 1000."}]},{"cat":"03","type":"fitb","stem":"An AM waveform has Vmax = 4.9 V and Vmin = 1.4 V. Using m = (Vmax − Vmin)/(Vmax + Vmin), calculate the percentage modulation. Answer to one decimal place, without the % sign: ____.","sub":"percentage-modulation","subtype":"numeric","answer":["55.6"],"caseSensitive":false,"fb":"m = (4.9 − 1.4)/(4.9 + 1.4) = 3.5/6.3 ≈ 0.5556, so the percentage modulation is 55.6%."},{"cat":"03","type":"mcq","stem":"Given oscilloscope readings Vmax and Vmin, which expression gives the peak modulating voltage Vm?","sub":"scope-index-derivation","options":[{"t":"(Vmax − Vmin) / 2","c":true,"fb":"Vm is one-half of the difference between the peak and trough readings."},{"t":"(Vmax + Vmin) / 2","c":false,"fb":"The average of the two readings gives the peak carrier voltage Vc."},{"t":"Vmax − Vmin","c":false,"fb":"The difference must be divided by two to obtain Vm."},{"t":"Vmax / Vmin","c":false,"fb":"Dividing the two readings does not give the peak modulating voltage."}]},{"cat":"03","type":"fitb","stem":"The instrument used to obtain Vmax and Vmin readings from an AM waveform for modulation-index calculation is an ____.","sub":"scope-index-derivation","subtype":"term","answer":["oscilloscope"],"caseSensitive":false,"fb":"An oscilloscope displays the AM waveform so its peak and trough values can be measured."},{"cat":"03","type":"scenario","stem":"Using m = (Vmax − Vmin)/(Vmax + Vmin), what is the modulation index to three decimal places?","sub":"scope-index-derivation","context":"An AM waveform displayed on an oscilloscope has Vmax = 10 V and Vmin = 2 V.","options":[{"t":"0.400","c":false,"fb":"This results from comparing derived Vm with Vmax rather than Vc."},{"t":"0.667","c":true,"fb":"m = (10 − 2)/(10 + 2) = 8/12 ≈ 0.667."},{"t":"0.800","c":false,"fb":"This divides the difference by Vmax rather than by the sum."},{"t":"1.500","c":false,"fb":"This reverses the derived Vm/Vc relationship."}]},{"cat":"03","type":"fitb","stem":"A 1000 kHz carrier is amplitude-modulated by a single 5 kHz tone. The upper sideband appears at ____ kHz.","sub":"calc-sidebands-forward","subtype":"value","answer":["1005","1005 kHz"],"caseSensitive":false,"fb":"The upper sideband is the carrier plus the modulating frequency: 1000 + 5 = 1005 kHz."},{"cat":"03","type":"mcq","stem":"An AM signal has sidebands measured at 1015 kHz and 985 kHz. What is the carrier frequency?","sub":"calc-sidebands-inverse","options":[{"t":"30 kHz","c":false,"fb":"This treats the gap between the sidebands as the carrier, but that gap is twice the tone's frequency."},{"t":"2000 kHz","c":false,"fb":"This adds the two sidebands together instead of averaging them."},{"t":"1000 kHz","c":true,"fb":"The carrier sits midway between the sidebands, so it is their average: (1015 + 985)/2 = 1000 kHz."},{"t":"1015 kHz","c":false,"fb":"This assumes the carrier sits on the upper sideband rather than between the two."}]},{"cat":"03","type":"fitb","stem":"An unmodulated carrier peaks at 8 V and the modulating signal peaks at 6 V. The modulation index is ____.","sub":"calc-modulation-index-forward","subtype":"value","answer":["0.75",".75","3/4"],"caseSensitive":false,"fb":"The index is the modulating peak divided by the carrier peak: 6/8 = 0.75."},{"cat":"03","type":"mcq","stem":"An AM envelope reaches a maximum of 6 V and a minimum of 2 V. What are the peak modulating and peak carrier voltages?","sub":"calc-oscilloscope-vm-vc","options":[{"t":"Vm = 4 V, Vc = 8 V","c":false,"fb":"This uses the raw peak-to-trough difference and the raw sum, without halving either of them."},{"t":"Vm = 2 V, Vc = 4 V","c":true,"fb":"Vm is half the difference, (6 − 2)/2 = 2 V, and Vc is the average, (6 + 2)/2 = 4 V."},{"t":"Vm = 4 V, Vc = 2 V","c":false,"fb":"The difference result and the average result have been exchanged here."},{"t":"Vm = 2 V, Vc = 8 V","c":false,"fb":"Only one of the two quantities was halved; the carrier average was left unhalved."}]},{"cat":"03","type":"fitb","stem":"A 1000 kHz carrier is modulated by a 5 kHz tone. The total bandwidth of the resulting AM signal is ____ kHz.","sub":"calc-bandwidth-forward","subtype":"value","answer":["10","10 kHz"],"caseSensitive":false,"fb":"Bandwidth is twice the modulating frequency: 2 × 5 = 10 kHz, which is also the spacing between 1005 kHz and 995 kHz."},{"cat":"03","type":"scenario","stem":"Which voltage value should the technician log for the carrier?","sub":"calc-oscilloscope-vm-vc","context":"A field technician clips an oscilloscope across the output of an AM transmitter. The envelope crest reads 6.2 V and the envelope trough reads 1.8 V. The transmitter log asks for the unmodulated peak carrier voltage, not the modulating voltage.","options":[{"t":"2.2 V","c":false,"fb":"This is the peak modulating voltage, the value the log does not ask for."},{"t":"4.0 V","c":true,"fb":"Peak carrier voltage is the average of crest and trough: (6.2 + 1.8)/2 = 4.0 V."},{"t":"4.4 V","c":false,"fb":"This is the crest-to-trough difference taken before halving it."},{"t":"8.0 V","c":false,"fb":"This is the sum of the two readings, taken without averaging them."}]},{"cat":"03","type":"mcq","stem":"A carrier peaks at 12 V and is to be modulated with an index of 0.5. What peak modulating voltage is required?","sub":"calc-modulation-voltage-inverse","options":[{"t":"24 V","c":false,"fb":"This applies the reciprocal relationship, treating the carrier as the unknown instead of the modulating peak."},{"t":"12.5 V","c":false,"fb":"This adds the index value to the carrier as though it were a voltage."},{"t":"18 V","c":false,"fb":"This scales the carrier by (1 + m), which gives the envelope crest rather than the tone."},{"t":"6 V","c":true,"fb":"The modulating peak is the carrier voltage scaled by the index: 12 × 0.5 = 6 V."}]},{"cat":"03","type":"fitb","stem":"An AM signal is read on an oscilloscope with Vmax = 4.9 V and Vmin = 1.4 V. The modulation index is ____.","sub":"calc-oscilloscope-m-ratio","subtype":"value","answer":["0.5556","0.556","0.56","5/9","0.555","0.5555"],"caseSensitive":false,"fb":"m = (Vmax − Vmin)/(Vmax + Vmin) = (4.9 − 1.4)/(4.9 + 1.4) = 3.5/6.3 = 0.5556, about 55.6%."},{"cat":"03","type":"mcq","stem":"The crest of an AM envelope measures 14 V peak-to-peak on an oscilloscope. What is Vmax?","sub":"calc-oscilloscope-peak-to-peak","options":[{"t":"7 V","c":true,"fb":"The peak value is half the peak-to-peak reading: 14/2 = 7 V."},{"t":"14 V","c":false,"fb":"This uses the peak-to-peak figure directly as a peak value."},{"t":"28 V","c":false,"fb":"This doubles the reading instead of halving it."},{"t":"3.5 V","c":false,"fb":"This halves the reading twice over."}]},{"cat":"03","type":"scenario","stem":"What does this operating condition do to the transmitted waveform?","sub":"calc-overmodulation-detection","context":"A technician measures a transmitter's modulator output at 9 V peak while the carrier input peaks at 8 V. The transmitter is then keyed on for a live broadcast.","options":[{"t":"The index is 1.00 and the envelope sits just at the distortion limit.","c":false,"fb":"This assumes the index can never rise past 1.0, so an over-driven modulator is rounded down to the limit."},{"t":"The index is 1.125 and the envelope flattens and distorts.","c":true,"fb":"The tone peaks above the carrier, so the index is 9/8 = 1.125, which exceeds 1.0 and causes overmodulation distortion."},{"t":"The index is 0.89 and the envelope stays undistorted.","c":false,"fb":"This divides the carrier by the tone (8/9 = 0.89), reversing the ratio."},{"t":"The index is 0.125 and the signal is under-modulated.","c":false,"fb":"This mistakes the fractional difference for the index."}]},{"cat":"03","type":"fitb","stem":"A modulating signal peaks at 4.5 V and produces a modulation index of 0.75. The unmodulated carrier peak voltage is ____ V.","sub":"calc-carrier-voltage-inverse","subtype":"value","answer":["6","6.0","6 V"],"caseSensitive":false,"fb":"Vc = Vm/m = 4.5/0.75 = 6 V."},{"cat":"03","type":"mcq","stem":"An AM signal carries sidebands at 604 kHz and 596 kHz. What is the modulating frequency?","sub":"calc-sidebands-inverse","options":[{"t":"600 kHz","c":false,"fb":"This is the carrier, the midpoint of the sidebands, rather than the tone."},{"t":"8 kHz","c":false,"fb":"This takes the whole spacing between the sidebands as the tone."},{"t":"4 kHz","c":true,"fb":"The tone is half the sideband spacing: (604 − 596)/2 = 4 kHz."},{"t":"604 kHz","c":false,"fb":"This reads the tone off the upper sideband itself."}]},{"cat":"03","type":"fitb","stem":"A 12 V carrier is modulated by a 9 V tone. The percentage of modulation is ____ %.","sub":"calc-modulation-index-forward","subtype":"value","answer":["75","75%","75 percent"],"caseSensitive":false,"fb":"m = 9/12 = 0.75, and the percentage is 0.75 × 100 = 75%."},{"cat":"03","type":"mcq","stem":"An AM broadcast channel is allocated 20 kHz of total bandwidth. What is the highest modulating frequency it can carry?","sub":"calc-bandwidth-inverse","options":[{"t":"20 kHz","c":false,"fb":"This treats the whole channel width as a single modulating tone."},{"t":"10 kHz","c":true,"fb":"The channel splits into two sidebands, so the tone can reach half the width: 20/2 = 10 kHz."},{"t":"5 kHz","c":false,"fb":"This halves the channel width twice over, leaving only a quarter of it."},{"t":"40 kHz","c":false,"fb":"This doubles the channel width instead of dividing it."}]},{"cat":"03","type":"scenario","stem":"What minimum filter bandwidth should the engineer specify?","sub":"calc-bandwidth-forward","context":"A bench test feeds a single 3 kHz tone into an AM modulator. The radio-frequency output passes through a bandpass filter, and the engineer must size that filter so nothing produced by the modulation is cut off.","options":[{"t":"3 kHz","c":false,"fb":"This assumes the modulation creates only one new frequency, so a single sideband is overlooked."},{"t":"9 kHz","c":false,"fb":"This counts the carrier as a third band and adds it to the two sidebands."},{"t":"6 kHz","c":true,"fb":"Two sidebands sit 3 kHz either side of the carrier, so the signal spans 2 × 3 = 6 kHz."},{"t":"1.5 kHz","c":false,"fb":"This halves the tone, as if the sidebands were pulled closer in than the carrier spacing."}]},{"cat":"03","type":"fitb","stem":"A 1 MHz carrier is amplitude-modulated by a 5 kHz tone. The lower sideband is at ____ kHz.","sub":"calc-sidebands-forward","subtype":"value","answer":["995","995 kHz"],"caseSensitive":false,"fb":"The lower sideband is the carrier minus the tone: 1000 − 5 = 995 kHz."},{"cat":"03","type":"mcq","stem":"A 5 V peak carrier is modulated by a 5.5 V peak tone. What is the modulation index, and what does it indicate?","sub":"calc-overmodulation-detection","options":[{"t":"0.91; the envelope stays undistorted","c":false,"fb":"This divides the carrier by the tone, reversing the ratio."},{"t":"1.00; modulation is exactly at the limit","c":false,"fb":"This assumes the peaks are equal, or that the index settles at 1.0 whenever the tone is large."},{"t":"1.10; the envelope becomes distorted","c":true,"fb":"The tone exceeds the carrier, giving 5.5/5 = 1.10, past 1.0, which distorts the envelope."},{"t":"0.10; the signal is under-modulated","c":false,"fb":"This takes the difference between the two peaks as the index."}]},{"cat":"03","type":"fitb","stem":"A carrier peaks at 6 V and is modulated with an index of 0.75. The peak modulating voltage is ____ V.","sub":"calc-modulation-voltage-inverse","subtype":"value","answer":["4.5","4.50","4.5 V"],"caseSensitive":false,"fb":"Vm = m × Vc = 0.75 × 6 = 4.5 V."},{"cat":"03","type":"mcq","stem":"A 10 V peak carrier is modulated with an index of 0.5. What are the maximum and minimum envelope voltages?","sub":"calc-oscilloscope-inverse-envelope","options":[{"t":"10.5 V and 9.5 V","c":false,"fb":"This adds and subtracts the index as though it were a voltage, instead of scaling the carrier."},{"t":"15 V and 5 V","c":true,"fb":"Vmax = Vc(1 + m) = 10 × 1.5 = 15 V, and Vmin = Vc(1 − m) = 10 × 0.5 = 5 V."},{"t":"15 V and 10 V","c":false,"fb":"The trough was left at the unmodulated carrier level while only the crest was scaled."},{"t":"20 V and 0 V","c":false,"fb":"This treats the index as doubling the carrier and collapsing the trough entirely."}]},{"cat":"03","type":"scenario","stem":"At what voltage does the envelope reach its bottom?","sub":"calc-oscilloscope-inverse-envelope","context":"A transmitter runs an unmodulated carrier that peaks at 8 V, driven at a modulation index of 0.25. Before approving the driver stage, the engineer needs to know how far down the envelope dips at its lowest point.","options":[{"t":"7.75 V","c":false,"fb":"This subtracts the index value from the carrier as if it were a voltage (8 − 0.25)."},{"t":"10 V","c":false,"fb":"This is the top of the envelope, found with the wrong sign on the index."},{"t":"2 V","c":false,"fb":"This uses the index times the carrier alone, dropping the carrier term."},{"t":"6 V","c":true,"fb":"Vmin = Vc(1 − m) = 8 × 0.75 = 6 V."}]},{"cat":"03","type":"mcq","stem":"A modulating signal peaks at 8 V and the modulation index must be 0.5. What carrier peak voltage does this require?","sub":"calc-carrier-voltage-inverse","options":[{"t":"4 V","c":false,"fb":"This scales the tone by the index instead of treating the carrier as the unknown."},{"t":"5.33 V","c":false,"fb":"This divides the tone by (1 + m) rather than by the index alone."},{"t":"8.5 V","c":false,"fb":"This adds the index value to the tone as though it were a voltage."},{"t":"16 V","c":true,"fb":"The carrier equals the tone divided by the index: 8/0.5 = 16 V."}]},{"cat":"03","type":"mcq","stem":"A voice channel provides 16 kHz of bandwidth. Which modulating frequency would need more spectrum than the channel can carry?","sub":"calc-bandwidth-inverse","options":[{"t":"9 kHz","c":true,"fb":"A modulated signal spreads on both sides of the carrier, so this tone needs 18 kHz and spills outside the channel."},{"t":"3 kHz","c":false,"fb":"This compares the tone one-for-one with the channel width, overlooking the spread above and below the carrier."},{"t":"6 kHz","c":false,"fb":"This compares the tone one-for-one with the channel width, overlooking the spread above and below the carrier."},{"t":"4 kHz","c":false,"fb":"This compares the tone one-for-one with the channel width, overlooking the spread above and below the carrier."}]},{"cat":"03","type":"mcq","stem":"An AM envelope's crest spans 12 V peak-to-peak, while its trough spans 4 V peak-to-peak. What is Vmax?","sub":"calc-oscilloscope-peak-to-peak","options":[{"t":"12 V","c":false,"fb":"This keeps the peak-to-peak crest reading without halving it."},{"t":"24 V","c":false,"fb":"This doubles the crest reading instead of halving it."},{"t":"6 V","c":true,"fb":"Vmax is half the crest's peak-to-peak value: 12/2 = 6 V."},{"t":"2 V","c":false,"fb":"This halves the trough reading rather than the crest reading."}]},{"cat":"03","type":"mcq","stem":"An AM waveform has a maximum of 9 V and a minimum of 3 V. What is the modulation index?","sub":"calc-oscilloscope-m-ratio","options":[{"t":"0.33","c":false,"fb":"This divides the trough by the crest instead of using their difference and sum."},{"t":"0.50","c":true,"fb":"m = (Vmax − Vmin)/(Vmax + Vmin) = (9 − 3)/(9 + 3) = 6/12 = 0.50."},{"t":"2.00","c":false,"fb":"This inverts the ratio by dividing the crest by the trough."},{"t":"0.25","c":false,"fb":"This halves the numerator but leaves the denominator at full value, mixing two different formulas."}]},{"cat":"04","type":"mcq","stem":"Which carrier quantity is varied to carry the message in frequency modulation?","sub":"fm-definition","options":[{"t":"Instantaneous frequency","c":true,"fb":"FM carries the message by varying the carrier’s instantaneous frequency."},{"t":"Carrier amplitude","c":false,"fb":"The carrier amplitude remains constant in FM."},{"t":"Message amplitude","c":false,"fb":"The message amplitude controls the carrier’s frequency variation; it is not the carrier quantity being varied."},{"t":"Carrier center frequency","c":false,"fb":"The instantaneous frequency varies around the center frequency."}]},{"cat":"04","type":"scenario","stem":"Which modulation process matches this output?","sub":"fm-definition","context":"A sine-wave message enters a modulator. The output carrier maintains a constant amplitude, while its instantaneous frequency follows the message’s amplitude variation.","options":[{"t":"Amplitude modulation","c":false,"fb":"AM varies the carrier amplitude, which remains constant here."},{"t":"Phase modulation","c":false,"fb":"PM directly varies carrier phase according to message amplitude."},{"t":"Frequency-shift keying","c":false,"fb":"FSK uses two binary levels and two carrier frequencies, rather than this continuous sine-wave message."},{"t":"Frequency modulation","c":true,"fb":"Constant carrier amplitude with message-controlled instantaneous frequency identifies FM."}]},{"cat":"04","type":"mcq","stem":"Under the direct FM relationship, how does carrier frequency respond when the modulating signal’s amplitude increases?","sub":"fm-amplitude-frequency-relationship","options":[{"t":"It increases","c":true,"fb":"The direct relationship makes carrier frequency increase as modulating amplitude increases."},{"t":"It decreases","c":false,"fb":"This reverses the specified direct relationship."},{"t":"It remains fixed","c":false,"fb":"FM changes carrier frequency as the modulating amplitude varies."},{"t":"It becomes zero","c":false,"fb":"Increasing message amplitude shifts carrier frequency; it does not eliminate the carrier."}]},{"cat":"04","type":"mcq","stem":"With the reverse FM relationship implemented, where does carrier frequency move when the modulating signal decreases?","sub":"fm-amplitude-frequency-relationship","options":[{"t":"Below the center frequency","c":false,"fb":"In the reverse relationship, a decreasing signal raises carrier frequency."},{"t":"Exactly at center frequency","c":false,"fb":"The decreasing signal produces a shift away from center."},{"t":"Above the center frequency","c":true,"fb":"The reverse relationship raises carrier frequency above center when the modulating signal decreases."},{"t":"Down to zero frequency","c":false,"fb":"The relationship changes the direction of the shift; it does not stop carrier oscillation."}]},{"cat":"04","type":"scenario","stem":"What is the new one-sided peak frequency shift?","sub":"fm-amplitude-frequency-relationship","context":"An FM system produces a one-sided peak frequency shift of 10 kHz for a message peak amplitude of 1 V. The message peak amplitude increases to 2 V, with the same proportional relationship.","options":[{"t":"5 kHz","c":false,"fb":"Halving the shift incorrectly treats amplitude and shift as inversely proportional."},{"t":"10 kHz","c":false,"fb":"An unchanged shift ignores the doubled message amplitude."},{"t":"40 kHz","c":false,"fb":"This doubles the amplitude effect twice, confusing peak shift with total span."},{"t":"20 kHz","c":true,"fb":"Doubling message amplitude doubles the proportional one-sided frequency shift."}]},{"cat":"04","type":"mcq","stem":"What term names the change in carrier frequency caused by the modulating signal?","sub":"frequency-deviation-definition","options":[{"t":"Modulating frequency","c":false,"fb":"This is the message signal’s frequency, rather than the carrier’s frequency change."},{"t":"Frequency deviation","c":true,"fb":"Frequency deviation measures the carrier frequency change caused by modulation."},{"t":"Sideband spacing","c":false,"fb":"Sideband spacing is the separation between neighboring spectral components."},{"t":"Phase shift","c":false,"fb":"A phase shift describes a change in phase rather than frequency deviation."}]},{"cat":"04","type":"mcq","stem":"An FM modulating signal ranges from −4 V to +4 V; at which amplitude magnitude is carrier frequency deviation greatest?","sub":"frequency-deviation-definition","options":[{"t":"0 V","c":false,"fb":"Zero message amplitude is not the maximum amplitude."},{"t":"2 V","c":false,"fb":"This is below the signal’s maximum amplitude magnitude."},{"t":"4 V","c":true,"fb":"Maximum frequency deviation occurs at maximum modulating-signal amplitude."},{"t":"1 V","c":false,"fb":"A smaller amplitude magnitude produces less deviation than the peak."}]},{"cat":"04","type":"fitb","stem":"For a 150 MHz carrier with a one-sided peak frequency shift of 40 kHz, the maximum instantaneous carrier frequency is ____ in MHz, to two decimal places.","sub":"deviation-calculation","subtype":"term","answer":["150.04"],"caseSensitive":false,"fb":"Convert 40 kHz to 0.04 MHz, then add it to 150 MHz."},{"cat":"04","type":"mcq","stem":"An FM carrier reaches 150.04 MHz and 149.96 MHz; which pair gives its center frequency and ± deviation?","sub":"deviation-calculation","options":[{"t":"150 MHz; ±40 kHz","c":true,"fb":"The midpoint is 150 MHz, and half the 80 kHz span is 40 kHz."},{"t":"150 MHz; ±80 kHz","c":false,"fb":"This incorrectly uses the total span as the one-sided deviation."},{"t":"150.04 MHz; ±40 kHz","c":false,"fb":"The upper extreme is not the center frequency."},{"t":"149.96 MHz; ±80 kHz","c":false,"fb":"This uses the lower extreme as center and the total span as peak deviation."}]},{"cat":"04","type":"scenario","stem":"What is its total frequency deviation, defined as maximum minus minimum?","sub":"deviation-calculation","context":"A carrier has a center frequency of 100 MHz and a one-sided peak deviation of ±25 kHz. Its maximum and minimum frequencies lie equally above and below center.","options":[{"t":"25 kHz","c":false,"fb":"This is the one-sided peak deviation, not the total span."},{"t":"0.05 kHz","c":false,"fb":"The total is 0.05 MHz, which equals 50 kHz."},{"t":"100 kHz","c":false,"fb":"This multiplies the one-sided deviation by four instead of two."},{"t":"50 kHz","c":true,"fb":"The total span is 25 kHz above center plus 25 kHz below center."}]},{"cat":"04","type":"mcq","stem":"A 0.8 MHz carrier has a one-sided peak shift of 20 kHz; what is its minimum instantaneous frequency in kHz?","sub":"deviation-calculation","options":[{"t":"820 kHz","c":false,"fb":"Adding the shift gives the maximum frequency."},{"t":"780 kHz","c":true,"fb":"Convert 0.8 MHz to 800 kHz, then subtract 20 kHz."},{"t":"798 kHz","c":false,"fb":"This incorrectly converts the 20 kHz shift to 2 kHz."},{"t":"800 kHz","c":false,"fb":"This is the center frequency before subtracting the shift."}]},{"cat":"04","type":"mcq","stem":"In the binary FSK mapping where binary 1 raises carrier frequency, what frequency corresponds to binary 0?","sub":"fsk-mechanism","options":[{"t":"A higher frequency","c":false,"fb":"The higher frequency corresponds to binary 1."},{"t":"Below the center frequency","c":false,"fb":"This mapping places binary 0 at center, rather than below center."},{"t":"The center frequency","c":true,"fb":"Binary 0 leaves the carrier at its center frequency."},{"t":"Zero carrier frequency","c":false,"fb":"A zero binary level does not remove the carrier."}]},{"cat":"04","type":"scenario","stem":"Which sequence describes the carrier waveform?","sub":"fsk-mechanism","context":"An FSK input sends the bits 0, 1, 1, 0. Binary 0 uses the center frequency, and binary 1 uses a higher frequency. Compare the waveform spacing across the four equal bit intervals.","options":[{"t":"Stretched, compressed, compressed, stretched","c":true,"fb":"Center-frequency intervals stretch relative to the higher-frequency intervals, which compress."},{"t":"Compressed, stretched, stretched, compressed","c":false,"fb":"This reverses the waveform behavior assigned to 0 and 1."},{"t":"Stretched, compressed, stretched, compressed","c":false,"fb":"This incorrectly alternates frequency even when two consecutive bits are both 1."},{"t":"Stretched, stretched, compressed, compressed","c":false,"fb":"This delays the frequency changes by one bit interval."}]},{"cat":"04","type":"multi","stem":"An FSK carrier has a center frequency of 150 MHz. Binary 0 retains center frequency, while the binary 1 signal’s amplitude produces an upward shift of 40 kHz. Which TWO carrier frequencies occur? Select the TWO correct options.","sub":"fsk-mechanism","options":[{"t":"150.000 MHz","c":true,"fb":"Binary 0 uses the center frequency of 150 MHz."},{"t":"149.960 MHz","c":false,"fb":"This assumes binary 0 shifts below center, contrary to the specified mapping."},{"t":"150.080 MHz","c":false,"fb":"This doubles the stated upward shift."},{"t":"150.040 MHz","c":true,"fb":"Binary 1 adds 0.040 MHz to the center frequency."},{"t":"0.000 MHz","c":false,"fb":"Binary 0 retains the carrier; it does not make its frequency zero."}]},{"cat":"04","type":"mcq","stem":"In phase modulation, which carrier property varies according to the message signal’s amplitude variation?","sub":"pm-definition","options":[{"t":"Carrier amplitude","c":false,"fb":"Varying carrier amplitude identifies amplitude modulation."},{"t":"Carrier center frequency","c":false,"fb":"PM is defined by phase variation, rather than changing the center frequency."},{"t":"Sideband-pair spacing","c":false,"fb":"Sideband spacing depends on modulating frequency, not this definition of PM."},{"t":"Carrier phase","c":true,"fb":"PM varies carrier phase according to message amplitude variation."}]},{"cat":"04","type":"mcq","stem":"A continuous sine-wave message controls the carrier’s phase according to its amplitude variation; which modulation process is being used?","sub":"pm-definition","options":[{"t":"Frequency modulation","c":false,"fb":"FM directly controls instantaneous carrier frequency through the message."},{"t":"Phase modulation","c":true,"fb":"Message-amplitude-controlled carrier phase identifies PM."},{"t":"Amplitude modulation","c":false,"fb":"AM varies carrier amplitude rather than carrier phase."},{"t":"Frequency-shift keying","c":false,"fb":"FSK uses binary levels to select carrier frequencies."}]},{"cat":"04","type":"mcq","stem":"What phase-shift behavior describes the PM interval from the modulating signal’s positive peak to its second zero deviation?","sub":"fm-pm-lag-lead","options":[{"t":"Leading phase shift","c":false,"fb":"Leading occurs from the second zero deviation to the next positive peak."},{"t":"Unchanged carrier phase","c":false,"fb":"This interval contains a lagging phase shift."},{"t":"Lagging phase shift","c":true,"fb":"PM lags or stretches from the positive peak to the second zero deviation."},{"t":"Binary phase shift","c":false,"fb":"This interval describes continuous PM behavior, rather than binary keying transitions."}]},{"cat":"04","type":"scenario","stem":"Which PM behavior belongs to the interval Z to N?","sub":"fm-pm-lag-lead","context":"A comparison shows FM compressing with the positive modulating signal. On the PM timeline, P marks a positive peak, Z marks the second zero deviation, and N marks the next positive peak.","options":[{"t":"Leading and compressing","c":true,"fb":"PM leads or compresses from the second zero deviation to the next positive peak."},{"t":"Lagging and stretching","c":false,"fb":"This describes the preceding interval from P to Z."},{"t":"Leading and stretching","c":false,"fb":"Leading is paired with compression, rather than stretching."},{"t":"Lagging and compressing","c":false,"fb":"Lagging is paired with stretching and occurs in the preceding interval."}]},{"cat":"04","type":"mcq","stem":"A PM timeline labels positive peak → second zero deviation as “leading” and second zero deviation → next positive peak as “lagging”; which edit corrects it?","sub":"fm-pm-lag-lead","options":[{"t":"Keep the two labels","c":false,"fb":"Both labels are assigned to the wrong intervals."},{"t":"Label both intervals leading","c":false,"fb":"The first interval is lagging."},{"t":"Label both intervals lagging","c":false,"fb":"The second interval is leading."},{"t":"Swap the two labels","c":true,"fb":"The first interval must be lagging and the second leading."}]},{"cat":"04","type":"mcq","stem":"For binary 0 at 0 V, what output does the binary PSK modulator retain?","sub":"psk-mechanism","options":[{"t":"A higher-frequency carrier","c":false,"fb":"A higher frequency is associated with the specified FSK mapping, not PSK binary 0."},{"t":"The unchanged carrier","c":true,"fb":"Binary 0 at 0 V leaves the carrier unchanged."},{"t":"A lower-frequency carrier","c":false,"fb":"PSK uses phase changes rather than lowering carrier frequency."},{"t":"A zero-amplitude carrier","c":false,"fb":"Zero input voltage does not mean the output carrier disappears."}]},{"cat":"04","type":"mcq","stem":"A binary PSK input changes from 1 to 0 while the carrier waveform is negative; what happens at that transition?","sub":"psk-mechanism","options":[{"t":"Frequency rises above center","c":false,"fb":"PSK changes phase, rather than raising carrier frequency."},{"t":"Amplitude falls to zero","c":false,"fb":"The binary transition causes a phase shift, not removal of carrier amplitude."},{"t":"Phase shifts by 180°","c":true,"fb":"Both transition directions cause a 180° shift, regardless of waveform polarity."},{"t":"Phase does not change","c":false,"fb":"A 1-to-0 transition produces a phase shift just as a 0-to-1 transition does."}]},{"cat":"04","type":"fitb","stem":"Each 0-to-1 or 1-to-0 transition in binary phase-shift keying produces a phase shift of ____ degrees.","sub":"psk-mechanism","subtype":"term","answer":["180"],"caseSensitive":false,"fb":"Each change between the two binary levels produces a 180° carrier phase shift."},{"cat":"04","type":"scenario","stem":"How many 180° phase shifts occur?","sub":"psk-mechanism","context":"A binary PSK stream begins at 0 and sends 0, 0, 1, 1, 0, 1, 0. Count only transitions between adjacent bits within this stream.","options":[{"t":"3 shifts","c":false,"fb":"This counts the three binary 1 bits rather than the level transitions."},{"t":"4 shifts","c":true,"fb":"Transitions occur between bits 2–3, 4–5, 5–6, and 6–7."},{"t":"5 shifts","c":false,"fb":"This incorrectly counts the initial binary level as an additional transition."},{"t":"7 shifts","c":false,"fb":"Repeated bits do not produce a phase shift at every bit interval."}]},{"cat":"04","type":"mcq","stem":"What accounts for the wider frequency spectrum of sine-wave-modulated FM and PM compared with AM?","sub":"sideband-generation","options":[{"t":"Multiple sideband pairs","c":true,"fb":"FM and PM produce multiple sideband pairs, extending their spectra."},{"t":"Constant carrier amplitude","c":false,"fb":"Constant amplitude does not itself explain the wider spectrum."},{"t":"Unchanged carrier frequency","c":false,"fb":"This does not account for the additional sideband pairs."},{"t":"Binary phase transitions","c":false,"fb":"The comparison concerns sine-wave modulation, rather than binary transitions."}]},{"cat":"04","type":"multi","stem":"A 1 MHz carrier is modulated by a constant-frequency 2 kHz sine wave. Which TWO frequencies form the first sideband pair, one modulating-frequency step from the carrier? Select the TWO correct options.","sub":"sideband-generation","options":[{"t":"1000 kHz","c":false,"fb":"This is the carrier frequency, not a sideband."},{"t":"998 kHz","c":true,"fb":"The first lower sideband lies 2 kHz below the 1000 kHz carrier."},{"t":"1004 kHz","c":false,"fb":"This is two modulating-frequency steps above the carrier."},{"t":"999 kHz","c":false,"fb":"This uses a 1 kHz spacing instead of the specified 2 kHz."},{"t":"1002 kHz","c":true,"fb":"The first upper sideband lies 2 kHz above the carrier."}]},{"cat":"04","type":"mcq","stem":"What determines the frequency separation between adjacent FM sidebands on the same side of the carrier?","sub":"sideband-generation","options":[{"t":"Carrier frequency","c":false,"fb":"Carrier frequency locates the spectrum’s center rather than setting adjacent spacing."},{"t":"Peak frequency deviation","c":false,"fb":"Peak deviation enters the modulation index; adjacent spacing equals the modulating frequency."},{"t":"Modulation index","c":false,"fb":"The modulation index is unitless and controls relative amplitudes, rather than frequency spacing."},{"t":"Modulating frequency","c":true,"fb":"Adjacent sidebands are separated by one modulating-frequency interval."}]},{"cat":"04","type":"fitb","stem":"For a 1 MHz carrier modulated by a 1 kHz sine wave, the third upper sideband frequency is ____ kHz.","sub":"sideband-frequency-calculation","subtype":"term","answer":["1003"],"caseSensitive":false,"fb":"Convert the carrier to 1000 kHz, then calculate 1000 + 3 × 1 = 1003 kHz."},{"cat":"04","type":"mcq","stem":"A 2 MHz carrier has its third upper sideband at 2.012 MHz; what is the modulating frequency in kHz?","sub":"sideband-frequency-calculation","options":[{"t":"4 kHz","c":true,"fb":"The 12 kHz offset equals three modulating-frequency steps, so divide by three."},{"t":"12 kHz","c":false,"fb":"This treats the third sideband’s full offset as one modulating-frequency step."},{"t":"6 kHz","c":false,"fb":"This divides the offset by two, as though the sideband were second-order."},{"t":"0.004 kHz","c":false,"fb":"The result is 0.004 MHz, which must be converted to 4 kHz."}]},{"cat":"04","type":"multi","stem":"For a 1 MHz carrier and a 2 kHz modulating frequency, which TWO frequencies belong to the second sideband pair? Select the TWO correct options.","sub":"sideband-frequency-calculation","options":[{"t":"996 kHz","c":true,"fb":"The second lower sideband is 1000 − 2 × 2 = 996 kHz."},{"t":"998 kHz","c":false,"fb":"This is the first lower sideband, only one modulation step below center."},{"t":"1000 kHz","c":false,"fb":"This is the carrier frequency."},{"t":"1004 kHz","c":true,"fb":"The second upper sideband is 1000 + 2 × 2 = 1004 kHz."},{"t":"1002 kHz","c":false,"fb":"This is the first upper sideband, only one modulation step above center."}]},{"cat":"04","type":"mcq","stem":"A carrier is at 0.8 MHz, its modulating frequency is 5 kHz, and a sideband is at 0.785 MHz; which sideband is it?","sub":"sideband-frequency-calculation","options":[{"t":"First lower sideband","c":false,"fb":"The first lower sideband would be 5 kHz below center, at 0.795 MHz."},{"t":"Third lower sideband","c":true,"fb":"The component is 15 kHz below center, equal to three 5 kHz steps."},{"t":"Second lower sideband","c":false,"fb":"The second lower sideband would be 10 kHz below center, at 0.790 MHz."},{"t":"Third upper sideband","c":false,"fb":"An upper sideband must lie above the carrier, at 0.815 MHz for the third order."}]},{"cat":"04","type":"mcq","stem":"How is the FM modulation index expressed after dividing peak frequency deviation by modulating frequency?","sub":"modulation-index","options":[{"t":"Frequency in hertz","c":false,"fb":"The matching frequency units cancel in the ratio."},{"t":"Frequency in megahertz","c":false,"fb":"The ratio does not retain either frequency unit."},{"t":"Phase in degrees","c":false,"fb":"The modulation index is not a phase-angle measurement."},{"t":"A unitless ratio","c":true,"fb":"Dividing two frequencies expressed in matching units produces a unitless value."}]},{"cat":"04","type":"fitb","stem":"For a one-sided peak frequency deviation of ±14 kHz and a modulating frequency of 3.5 kHz, the FM modulation index is ____.","sub":"modulation-index","subtype":"term","answer":["4"],"caseSensitive":false,"fb":"Use the one-sided peak magnitude: m_f = 14 ÷ 3.5 = 4."},{"cat":"04","type":"mcq","stem":"An FM signal has m_f = 2 and f_m = 3.5 kHz; what is the magnitude of its one-sided peak frequency deviation?","sub":"modulation-index","options":[{"t":"1.75 kHz","c":false,"fb":"This divides the modulating frequency by the index instead of multiplying."},{"t":"14 kHz","c":false,"fb":"This gives twice the one-sided peak deviation, confusing it with the total span."},{"t":"0.007 kHz","c":false,"fb":"The result is 0.007 MHz, which equals 7 kHz."},{"t":"7 kHz","c":true,"fb":"Rearrange m_f = f_d/f_m to obtain f_d = 2 × 3.5 = 7 kHz."}]},{"cat":"04","type":"multi","stem":"Which TWO quantities are directly divided to calculate the FM modulation index using m_f = f_d/f_m? Select the TWO correct options.","sub":"modulation-index","options":[{"t":"Carrier frequency","c":false,"fb":"Carrier frequency does not appear in this ratio."},{"t":"Peak frequency deviation","c":true,"fb":"The one-sided peak frequency deviation is the numerator."},{"t":"Carrier amplitude","c":false,"fb":"Carrier amplitude is not one of the frequencies in the ratio."},{"t":"Modulating frequency","c":true,"fb":"The modulating frequency is the denominator."},{"t":"Sideband-pair number","c":false,"fb":"Sideband order is used in sideband-frequency calculations, not this ratio."}]},{"cat":"04","type":"fitb","stem":"The complex mathematical functions used to solve the FM signal equation for sideband number and amplitudes are called ____ functions.","sub":"bessel-fm-equation","subtype":"term","answer":["Bessel"],"caseSensitive":false,"fb":"Bessel functions provide the mathematical solution used to determine FM sideband number and amplitudes."},{"cat":"04","type":"mcq","stem":"Solving `V_FM = V_c sin[2πf_c t + m_f sin(2πf_m t)]` with Bessel functions determines which properties of the FM sidebands?","sub":"bessel-fm-equation","options":[{"t":"Number and relative amplitudes","c":true,"fb":"The Bessel-function solution determines the number and amplitudes of FM sidebands."},{"t":"Spacing and center frequency","c":false,"fb":"Sideband spacing and center are set by modulating and carrier frequencies."},{"t":"Maximum and minimum frequencies","c":false,"fb":"Carrier-frequency extremes are calculated from center frequency and peak frequency shift."},{"t":"Modulating amplitude and frequency","c":false,"fb":"These describe the message signal, rather than the sideband properties obtained from the solution."}]},{"cat":"04","type":"mcq","stem":"A Bessel table gives a carrier relative amplitude of −0.40; what phase shift does the negative sign indicate?","sub":"bessel-table-reading","options":[{"t":"0° phase shift","c":false,"fb":"A negative amplitude indicates a phase reversal rather than no shift."},{"t":"90° phase shift","c":false,"fb":"The negative sign denotes a half-cycle reversal, not a quarter-cycle shift."},{"t":"180° phase shift","c":true,"fb":"A negative carrier or sideband amplitude indicates a 180° phase shift."},{"t":"360° phase shift","c":false,"fb":"A full-cycle shift returns to the original phase rather than reversing it."}]},{"cat":"04","type":"mcq","stem":"A Bessel table contains this row of relative amplitudes: `m_f = 2.0 | Carrier = 0.22 | 1st pair = 0.58 | 2nd pair = 0.35 | 3rd pair = 0.13` For m_f = 2.0, which value belongs to the second sideband pair?","sub":"bessel-table-reading","options":[{"t":"0.22","c":false,"fb":"This is the carrier’s relative amplitude."},{"t":"0.58","c":false,"fb":"This belongs to the first sideband pair."},{"t":"0.13","c":false,"fb":"This belongs to the third sideband pair."},{"t":"0.35","c":true,"fb":"The second-pair column gives a relative amplitude of 0.35."}]},{"cat":"04","type":"mcq","stem":"An FM signal has a one-sided peak frequency deviation of ±10 kHz and a modulating frequency of 2.5 kHz. Bessel table entries for `m_f : carrier relative amplitude` are: `0.25 : 0.98 | 2.5 : −0.05 | 4.0 : −0.40 | 8.0 : 0.17` After calculating m_f, which carrier relative amplitude should be selected?","sub":"bessel-table-reading","options":[{"t":"0.98","c":false,"fb":"This uses the inverted ratio 2.5 ÷ 10 = 0.25."},{"t":"−0.40","c":true,"fb":"The one-sided ratio is 10 ÷ 2.5 = 4, so select the 4.0 row."},{"t":"−0.05","c":false,"fb":"This incorrectly uses the modulating frequency’s numerical value as the modulation index."},{"t":"0.17","c":false,"fb":"This uses the total 20 kHz span, incorrectly producing m_f = 8."}]},{"cat":"05","type":"mcq","stem":"An electronic signal made up of many random frequencies at many amplitudes is added to an information signal while it is transmitted or processed. What is this signal called?","sub":"noise-definition","options":[{"t":"Noise","c":true,"fb":"Noise is a random-frequency, random-amplitude signal added during transmission or processing."},{"t":"Interference","c":false,"fb":"Interference comes from other information signals, not from random frequencies and amplitudes."},{"t":"Distortion","c":false,"fb":"Distortion alters the waveform of the signal. It is not an added random signal."},{"t":"Attenuation","c":false,"fb":"[outside] Attenuation is loss of signal strength. It is not an added random signal."}]},{"cat":"05","type":"mcq","stem":"Noise is often confused with interference. What makes noise different from interference?","sub":"noise-definition","options":[{"t":"Random frequencies, not another information signal","c":true,"fb":"Noise is random in frequency and amplitude. Interference is unwanted added information signals."},{"t":"Another information signal on the same channel","c":false,"fb":"This describes interference, not noise."},{"t":"A single steady frequency from the transmitter","c":false,"fb":"Noise has many random frequencies, not one steady frequency."},{"t":"A waveform change caused by the channel","c":false,"fb":"This describes distortion, not noise."}]},{"cat":"05","type":"mcq","stem":"Digital signals convey bits using binary pulses. Why does digital signaling need a much higher noise level than analog before it is affected?","sub":"noise-digital-vs-analog","options":[{"t":"Both binary pulses must be confused","c":true,"fb":"Noise must be high enough for the two pulses to be mistaken for each other."},{"t":"Digital signals contain no noise","c":false,"fb":"Noise affects both analog and digital signals."},{"t":"Digital signals always use more power","c":false,"fb":"The tolerance comes from the binary pulses, not from power."},{"t":"Digital signals avoid external noise","c":false,"fb":"Digital signals are exposed to the same noise sources."}]},{"cat":"05","type":"mcq","stem":"Noise that comes from sources humans cannot control falls into which of the two noise classifications?","sub":"noise-classification","options":[{"t":"External noise","c":true,"fb":"External noise comes from sources outside human control, such as industrial, atmospheric and space sources."},{"t":"Internal noise","c":false,"fb":"Internal noise comes from components inside the receiver."},{"t":"Interference","c":false,"fb":"Interference is other information signals. It is not a noise classification."},{"t":"Distortion","c":false,"fb":"Distortion is a waveform alteration. It is not an external-noise classification."}]},{"cat":"05","type":"multi","stem":"Which THREE of these five are sources of external noise? Select the three correct options.","sub":"external-noise-sources","options":[{"t":"Industrial","c":true,"fb":"Manufacturing equipment is an external noise source."},{"t":"Thermal","c":false,"fb":"Thermal noise comes from conductors in the receiver, so it is internal."},{"t":"Atmospheric","c":true,"fb":"Natural electrical disturbances such as lightning are external."},{"t":"Semiconductor","c":false,"fb":"Semiconductor noise comes from diodes and transistors, so it is internal."},{"t":"Extraterrestrial","c":true,"fb":"Solar and cosmic noise from space are external."}]},{"cat":"05","type":"mcq","stem":"Ignition systems, generators and electric motors switch high voltages or currents. What does this switching create that produces industrial noise?","sub":"industrial-noise","options":[{"t":"Transients","c":true,"fb":"Switching high voltages or currents creates transients, which are momentary bursts of energy."},{"t":"Harmonics","c":false,"fb":"Harmonics are not the momentary bursts of energy the source ties to switching. They are linked to circuit nonlinearity (intermodulation distortion)."},{"t":"Static","c":false,"fb":"Static is atmospheric noise from lightning."},{"t":"Thermal agitation","c":false,"fb":"Thermal agitation is heat-driven electron motion, which is internal noise."}]},{"cat":"05","type":"mcq","stem":"Lightning produces natural electrical disturbances in the Earth's atmosphere. These show up as amplitude variations added to a signal. Which noise is this, also called static?","sub":"atmospheric-noise","options":[{"t":"Atmospheric noise","c":true,"fb":"Atmospheric noise is natural electrical disturbance, usually from lightning, and is also called static."},{"t":"Industrial noise","c":false,"fb":"Industrial noise comes from man-made equipment, not natural events."},{"t":"Solar noise","c":false,"fb":"Solar noise comes from the sun, not from the Earth's atmosphere."},{"t":"Thermal noise","c":false,"fb":"Thermal noise comes from electron motion in conductors, which is internal."}]},{"cat":"05","type":"mcq","stem":"Atmospheric noise has its greatest impact on signals with frequencies below which value?","sub":"atmospheric-noise","options":[{"t":"30 MHz","c":true,"fb":"Atmospheric noise mostly affects signals below 30 MHz."},{"t":"3 MHz","c":false,"fb":"This value is too low by a factor of ten."},{"t":"300 MHz","c":false,"fb":"This value is too high by a factor of ten."},{"t":"30 GHz","c":false,"fb":"This is far above the 30 MHz threshold."}]},{"cat":"05","type":"mcq","stem":"The sun radiates a wide range of signals in a broad noise spectrum. It has a repeatable 11-year cycle, and at the peak many frequencies become unusable. What is this noise called?","sub":"solar-noise","options":[{"t":"Solar noise","c":true,"fb":"Solar noise comes from the sun and follows a repeatable 11-year cycle."},{"t":"Cosmic noise","c":false,"fb":"Cosmic noise comes from stars outside the solar system."},{"t":"Atmospheric noise","c":false,"fb":"Atmospheric noise comes from lightning in the Earth's atmosphere."},{"t":"Industrial noise","c":false,"fb":"Industrial noise comes from man-made equipment."}]},{"cat":"05","type":"mcq","stem":"Stars outside the solar system generate noise that is less impactful than the sun's because of distance. What is this noise called?","sub":"cosmic-noise","options":[{"t":"Cosmic noise","c":true,"fb":"Cosmic noise is generated by stars outside the solar system."},{"t":"Solar noise","c":false,"fb":"Solar noise comes from the sun, which is much closer."},{"t":"Atmospheric noise","c":false,"fb":"Atmospheric noise is from Earth's atmosphere, not from stars."},{"t":"Industrial noise","c":false,"fb":"Industrial noise is man-made equipment noise."}]},{"cat":"05","type":"mcq","stem":"A receiver contains resistors, diodes and transistors. Their low-level noise can still interfere with weak signals. What kind of noise is this?","sub":"internal-noise-sources","options":[{"t":"Internal noise","c":true,"fb":"Noise from receiver components such as resistors, diodes and transistors is internal."},{"t":"External noise","c":false,"fb":"External noise comes from sources outside the receiver that humans cannot control."},{"t":"Industrial noise","c":false,"fb":"Industrial noise comes from manufacturing equipment, which is external."},{"t":"Extraterrestrial noise","c":false,"fb":"Extraterrestrial noise comes from space, which is external."}]},{"cat":"05","type":"mcq","stem":"Which of these is NOT a common internal noise?","sub":"internal-noise-types","options":[{"t":"Atmospheric noise","c":true,"fb":"Atmospheric noise is external, from natural electrical disturbances."},{"t":"Thermal noise","c":false,"fb":"Thermal noise is a common internal noise."},{"t":"Semiconductor noise","c":false,"fb":"Semiconductor noise is a common internal noise."},{"t":"Intermodulation distortion","c":false,"fb":"The handout classifies intermodulation distortion as internal noise."}]},{"cat":"05","type":"mcq","stem":"Heat causes free electrons in a conductor to move randomly, which is thermal agitation. Which noise does this produce?","sub":"thermal-noise","options":[{"t":"Thermal noise","c":true,"fb":"Thermal agitation of free electrons in a conductor produces thermal noise."},{"t":"Shot noise","c":false,"fb":"Shot noise comes from random carrier paths in semiconductors."},{"t":"Flicker noise","c":false,"fb":"Flicker noise comes from resistance variations in semiconductor material."},{"t":"Transit-time noise","c":false,"fb":"Transit-time noise depends on carrier transit time versus signal period."}]},{"cat":"05","type":"scenario","stem":"Which noise is this?","sub":"thermal-noise","context":"A resistor in a receiver is at room temperature. Its free electrons move randomly because of heat. This movement starts a current flow that produces a small voltage across the resistor.","options":[{"t":"Thermal noise","c":true,"fb":"Heat-driven random electron motion in a conductor is thermal noise."},{"t":"Atmospheric noise","c":false,"fb":"Atmospheric noise is natural disturbance such as lightning, which is external."},{"t":"Intermodulation distortion","c":false,"fb":"Intermodulation distortion comes from circuit nonlinearity, not heat."},{"t":"Industrial noise","c":false,"fb":"Industrial noise comes from external man-made equipment."}]},{"cat":"05","type":"mcq","stem":"Noise is believed to contain all frequencies at random amplitudes. It occupies an infinite bandwidth. What is it called?","sub":"white-noise","options":[{"t":"White noise","c":true,"fb":"White noise is thermal noise believed to contain all frequencies, so it has infinite bandwidth."},{"t":"Pink noise","c":false,"fb":"Pink noise is filtered or band-limited noise, so it does not have infinite bandwidth."},{"t":"Shot noise","c":false,"fb":"Shot noise comes from random carrier paths, not from all frequencies."},{"t":"Flicker noise","c":false,"fb":"Flicker noise is inversely proportional to frequency."}]},{"cat":"05","type":"mcq","stem":"Thermal agitation is also known by which colored noise name?","sub":"white-noise","options":[{"t":"White noise","c":true,"fb":"Thermal agitation is also called white noise and Johnson noise."},{"t":"Pink noise","c":false,"fb":"Pink noise is only filtered or band-limited noise."},{"t":"Blue noise","c":false,"fb":"[outside] Not an alternate name for thermal agitation."},{"t":"Brown noise","c":false,"fb":"[outside] Not an alternate name for thermal agitation."}]},{"cat":"05","type":"mcq","stem":"Noise that has been filtered or is band-limited is called what?","sub":"pink-noise","options":[{"t":"Pink noise","c":true,"fb":"Filtered or band-limited noise is called pink noise."},{"t":"White noise","c":false,"fb":"White noise is unfiltered and occupies an infinite bandwidth."},{"t":"Johnson noise","c":false,"fb":"Johnson noise is another name for thermal noise, which is white noise."},{"t":"Flicker noise","c":false,"fb":"Flicker noise comes from resistance variations in semiconductor material."}]},{"cat":"05","type":"mcq","stem":"Thermal agitation has a second name, besides white noise, that honors the person who discovered it. What is this name?","sub":"johnson-noise","options":[{"t":"Johnson noise","c":true,"fb":"Thermal agitation is also called Johnson noise, after its discoverer."},{"t":"Shot noise","c":false,"fb":"Shot noise comes from random carrier paths in semiconductors."},{"t":"Pink noise","c":false,"fb":"Pink noise is filtered or band-limited noise."},{"t":"Flicker noise","c":false,"fb":"Flicker noise is excess noise from semiconductor resistance variations."}]},{"cat":"05","type":"mcq","stem":"In which year did John Bertrand Johnson discover thermal noise?","sub":"johnson-noise","options":[{"t":"1928","c":true,"fb":"Johnson discovered thermal agitation in 1928."},{"t":"1908","c":false,"fb":"This is too early."},{"t":"1938","c":false,"fb":"This is a decade too late."},{"t":"1948","c":false,"fb":"This is two decades too late."}]},{"cat":"05","type":"mcq","stem":"Which internal noise comes from diodes and transistors?","sub":"semiconductor-noise-types","options":[{"t":"Semiconductor noise","c":true,"fb":"Semiconductor noise comes from diodes and transistors."},{"t":"Thermal noise","c":false,"fb":"Thermal noise comes from free electrons in a conductor."},{"t":"Intermodulation distortion","c":false,"fb":"Intermodulation distortion comes from circuit nonlinearity."},{"t":"Industrial noise","c":false,"fb":"Industrial noise is external, from manufacturing equipment."}]},{"cat":"05","type":"mcq","stem":"Current flow in a semiconductor is not direct and linear, so carriers take random paths from source to destination. Which noise does this produce?","sub":"shot-noise","options":[{"t":"Shot noise","c":true,"fb":"Random carrier paths from source to destination produce shot noise."},{"t":"Flicker noise","c":false,"fb":"Flicker noise comes from minute random resistance variations."},{"t":"Transit-time noise","c":false,"fb":"Transit-time noise appears when transit time equals the signal period."},{"t":"Thermal noise","c":false,"fb":"Thermal noise comes from heat-driven electron motion."}]},{"cat":"05","type":"mcq","stem":"A carrier takes some time to move from input to output of a device. When that time equals the period of the signal frequency, which noise is created?","sub":"transit-time-noise","options":[{"t":"Transit-time noise","c":true,"fb":"Transit-time noise appears when transit time equals the signal period."},{"t":"Shot noise","c":false,"fb":"Shot noise comes from random carrier paths."},{"t":"Flicker noise","c":false,"fb":"Flicker noise comes from resistance variations."},{"t":"Thermal noise","c":false,"fb":"Thermal noise comes f
