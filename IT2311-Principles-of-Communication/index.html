function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'fitb') {
    return { type: q.type, stem: q.stem, answer: q.answer,
             caseSensitive: q.caseSensitive || false, hint: q.hint || '',
             fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  return base;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked  = shuffle(pool).slice(0, finalCount);
  return picked.map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(shuffle(pool).slice(0, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

// ----- focus toggle + topic chips -----
function renderTopicGrid() {
  const grid = $('topicGrid');
  grid.innerHTML = '';
  // Objectives with zero questions are hidden until you write them.
  CATEGORIES.filter(cat => (CAT_COUNTS[cat.key] || 0) > 0).forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'topic-chip';
    chip.dataset.key = cat.key;
    if (state.focusedCats.includes(cat.key)) chip.classList.add('on');
    chip.innerHTML = `
      <div class="topic-chip-check"></div>
      <div class="topic-chip-label">${cat.label}</div>
      <div class="topic-chip-count">${CAT_COUNTS[cat.key]}</div>
    `;
    chip.addEventListener('click', () => {
      const i = state.focusedCats.indexOf(cat.key);
      if (i >= 0) state.focusedCats.splice(i, 1);
      else state.focusedCats.push(cat.key);
      chip.classList.toggle('on');
      updateSetupSummary();
    });
    grid.appendChild(chip);
  });
}

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note
  $('poolAvailable').textContent = available;

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}

$('startBtn').addEventListener('click', () => {
  state.questions = buildActiveQuiz();
  state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []);
  state.checked   = state.questions.map(() => false);
  state.current   = 0;
  state.timeUp    = false;
  state.timeUsedMs = 0;

  $('view-setup').classList.add('hidden');
  $('view-quiz').classList.remove('hidden');
  $('view-quiz').classList.add('fade-in');

  // Test-mode notice
  $('testNotice').classList.toggle('hidden', !state.timerEnabled);

  }

  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in">';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${q.context}</div></div>`;
  }
  html += `<div class="qstem">${q.stem}</div>`;

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${q.hint}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${q.fb}</div>`;
    }
    html += `</div>`;
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          cls += ' is-missed';
          marker = '\u25CB';
          tagsHtml = '<span class="opt-tag miss">Correct answer</span>';
          showFeedback = true;
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${opt.t}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${opt.fb}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('Abandon this quiz and return to setup? Your progress will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 24px; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    <div class="btn-row">
      <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
      <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    state.questions = buildActiveQuiz();
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []);
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
</body>
</html>
