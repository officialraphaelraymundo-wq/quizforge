/* --- palette test overrides --- */
.masthead,.divider-double{border-color:var(--accent)}
.display{font-weight:600}.display em{font-weight:600}
.qstem{font-size:1.6875rem;font-weight:500}
.progress-info .qcount{font-weight:500}
.opt-feedback{font-size:1rem}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
.opt.selected{border-color:var(--purple-lt)}
.opt.selected .opt-marker{background:var(--purple-lt);border-color:var(--purple-lt);color:#fff}
.qtype-tag{background:var(--purple);color:var(--ink)}
.section-label::before{content:"\2660";width:auto;height:auto;background:none;color:var(--accent);font-size:0.875rem;line-height:1}
.tabs{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 14px;margin-bottom:18px;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button[data-v]{font-family:var(--body);font-size:0.875rem;padding:6px 14px;background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--rule-strong);border-radius:99px;cursor:pointer}
.tabs button[data-v].on{border-color:var(--accent);color:var(--accent)}

/* ---- v2: research-based refinements ---- */
/* Readability: thin display face is kept for headings only; explanations use the sturdier body face (WCAG 1.4.3 note on thin fonts) */
.opt-feedback{font-family:var(--body);font-style:normal;font-size:0.9688rem;line-height:1.55;color:var(--ink-soft)}
.opt-text{font-size:1.0312rem}
.qstem{font-weight:600}
/* Small labels: raise the tiny mono sizes */
.qverdict-text{font-size:0.7812rem}
.opt-tag{font-size:0.7188rem;padding:2px 8px}
.jump-dot{width:40px;height:40px;font-size:0.8125rem}
.question-jumper{gap:8px}
.qtype-tag{font-size:0.75rem}
.progress-info{font-size:0.7812rem}
/* Contrast fixes: dark text on light markers */
.opt.is-wrong .opt-marker,.opt.is-wrong .opt-tag.you{color:var(--bg)}
.opt.selected .opt-marker{background:var(--purple-lt);color:var(--bg)}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
/* Not colour alone (WCAG 1.4.1): shape + symbol + border style for each result */
.opt.is-correct{border-width:2px;border-style:solid}
.opt.is-wrong{border-style:dashed}
.opt.is-missed{border-style:dotted;border-width:2px}
.opt.is-correct .opt-marker,.opt.is-wrong .opt-marker,.opt.is-missed .opt-marker{font-size:0}
.opt.is-correct .opt-marker::after{content:"\2713";font-size:0.875rem}
.opt.is-wrong .opt-marker::after{content:"\2717";font-size:0.875rem}
.opt.is-missed .opt-marker::after{content:"!";font-size:0.875rem}
/* Learning: after Check, the right answer is the loudest thing; wrong picks stay visible but calmer */
.opt.is-correct{box-shadow:0 0 0 1px var(--correct),0 0 20px rgba(127,196,154,.30)}
.opt.is-wrong{box-shadow:none;background:rgba(224,112,127,.08)}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed){opacity:1}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed) .opt-text{color:var(--ink-mute)}
/* Touch targets (WCAG 2.5.8 min 24px; Material 48dp with 8dp gaps) */
.btn{min-height:48px}
.count-card,.topic-chip,.time-chip{min-height:48px}
.options{gap:12px}
.toggle{width:52px;height:30px}
.toggle::after{width:22px;height:22px}
.toggle.on::after{transform:translateX(22px)}
.opt-toggle-row{min-height:56px}
:focus-visible{outline:3px solid var(--purple-lt);outline-offset:3px}
@media (max-width:600px){
  .nav-row{position:sticky;bottom:0;z-index:4;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
  .nav-right{width:100%}
  .nav-right .btn.primary,.nav-right .btn:not(.ghost){flex:1}
  .qcard{padding:26px 18px}
  .qverdict{margin:-26px -18px 22px}
  .qstem{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3: restrained playing-card theme ---- */
.qcard{position:relative;border-radius:12px;padding-bottom:58px;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,169,110,.28);border-radius:8px;pointer-events:none}

/* ============================================================
   QuizForge shared theme — load in BOTH hub and quiz templates
   Dark is default; light "paper" mode follows the phone setting.
   ============================================================ */
:root{
  --bg:#0F0E13; --bg-2:#1C1A22; --bg-deep:#25222E; --bg-raise:#2E2A3A;
  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#C9A96E; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;
  --gold:#A98BE0; --gold-bg:#211A33; --gold-edge:#3F3163;   /* "partial / missed" = lavender */
  --bg-glow:rgba(91,63,140,.30); --bg-glow-2:rgba(91,63,140,.14); --spade-alpha:.09;
  --frame:rgba(201,169,110,.30);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --radius-card:12px; --radius-ctl:8px;
  --display:"Cormorant Garamond",Garamond,"Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --tok-type:#A98BE0;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;
    --ink:#1C1A22; --ink-soft:#45414F; --ink-mute:#66626F;
    --rule:#DDD6C8; --rule-strong:#C4BAA6;
    --accent:#80612A; --accent-deep:#5A441D; --accent-soft:#F1E8D6;
    --purple:#5B3F8C; --purple-lt:#6546A3; --on-purple:#FBF9F4;
    --correct:#23704A; --correct-bg:#E2F0E6; --correct-edge:#A9CFB7;
    --wrong:#A8324A; --wrong-bg:#F8E3E7; --wrong-edge:#E0AAB5;
    --gold:#6546A3; --gold-bg:#ECE5F6; --gold-edge:#C6B6E6;
    --bg-glow:rgba(91,63,140,.12); --bg-glow-2:rgba(201,169,110,.12); --spade-alpha:.06;
    --frame:rgba(128,97,42,.35);
    --shadow:0 1px 0 rgba(28,26,34,.05),0 8px 24px -14px rgba(28,26,34,.25);
    --tok-type:#6546A3;
    color-scheme:light;
  }
}

  --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;

/* ============================================================
   QuizForge shared theme — "Reading Room" variant — load in BOTH hub and quiz templates

:root{

  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#B39A6B; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;

}

/* ================= Reading Room overrides ================= */
body{background-image:radial-gradient(900px 600px at 6% -10%,var(--lamp),transparent 62%),radial-gradient(900px 600px at 105% 115%,var(--bg-glow-2),transparent 60%)}
.display{font-weight:500}
.display em{font-style:italic;color:var(--accent)}
.eyebrow{font-family:var(--type);font-size:0.875rem;letter-spacing:0;text-transform:none;color:var(--accent)}
.divider-double{border-color:var(--rule-strong)}
.section-label{font-family:var(--display);font-size:1.375rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.section-label::before{content:none}
/* masthead: course code as a call number */
.codex{font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:0;border:0;background:none;color:var(--ink-soft);padding:0}
.codex::after{content:" \2660";font-size:0.5625rem;color:var(--ink-mute);opacity:.7}
.stamp{font-family:var(--type);font-size:0.7812rem;letter-spacing:.04em;border:1px solid var(--rule-strong);padding:2px 8px;color:var(--ink-mute)}
.crumb{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8125rem}
/* length choices as small catalog cards */
.count-card{border-radius:4px;background-color:var(--page);background-image:linear-gradient(var(--purple),var(--purple)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--ruled) 21px 22px);background-size:100% 2px,100% 100%;background-position:0 0,0 0;background-repeat:no-repeat}
.count-card.active{background-color:var(--bg-deep);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.count-num{font-weight:500}
.count-label{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.ot-title{font-family:var(--display);font-size:1.25rem;font-weight:500}
.ot-sub{font-family:var(--type);font-size:0.8125rem;letter-spacing:0;text-transform:none}
.setup-summary .ss-item .ss-key,.meta-item .meta-key{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.7812rem}
.meta-row{border-left-color:var(--purple)}
/* progress: a purple ribbon */
.progress-bar{height:6px;background:var(--rule);border-radius:0}
.progress-fill{background:var(--purple-lt);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%)}
.progress-info{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.jump-dot{font-family:var(--type);border-radius:3px}
.jump-dot.current::after{content:none}
/* the question card is a book page */
.qcard{border-radius:3px;background-color:var(--page);background-image:linear-gradient(90deg,var(--page-edge),transparent 22px);padding-right:58px;padding-bottom:50px;overflow:visible}
.qcard::before{content:"\2660";inset:auto;top:-1px;right:24px;width:15px;height:58px;border:0;border-radius:0;background:var(--purple);color:var(--bg);font-size:0.5rem;line-height:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);z-index:2}
.qverdict{border-radius:0;margin:-32px -58px 26px -30px;padding-right:58px}
.folio{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--display);font-style:italic;font-size:0.9375rem;color:var(--ink-mute)}
.qtype-tag{font-family:var(--type);font-size:0.7812rem;letter-spacing:0;text-transform:none;background:none;color:var(--accent);padding:0;border:0}
.qstem{font-family:var(--display);font-weight:500;font-size:1.6875rem;line-height:1.28}
.opt{border-radius:4px}
.opt-text{font-family:var(--body)}
.opt-marker{font-family:var(--type);border-radius:3px}
/* explanations read like margin notes */
.opt-feedback{position:relative;margin-top:10px;padding:2px 0 2px 14px;border-left:2px solid var(--rule-strong);background:none}
.opt-feedback::before{content:"Note \2014 ";font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute)}
.opt.is-correct .opt-feedback{border-left-color:var(--correct)}
.opt.is-wrong .opt-feedback{border-left-color:var(--wrong)}
.opt.is-missed .opt-feedback{border-left-color:var(--gold)}
.opt-tag{font-family:var(--type);letter-spacing:0;text-transform:none;border-radius:2px}
.qverdict-text{font-family:var(--body);letter-spacing:0;text-transform:none}
.btn{border-radius:4px}
/* results: library date stamp */
.score-dial .fill{stroke:var(--purple-lt)}
.verdict-eyebrow{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem;color:var(--accent)}
.verdict{font-family:var(--display);font-weight:500}
.date-stamp{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:6px 14px;border:2px solid var(--purple-lt);outline:1px solid var(--purple-lt);outline-offset:2px;border-radius:3px;font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-lt);transform:rotate(-4deg);opacity:.9}
.date-stamp b{font-size:0.75rem}
@media (max-width:600px){
  .qcard{padding:24px 44px 44px 18px}
  .qcard::before{right:14px;width:13px;height:48px}
  .qverdict{margin:-24px -44px 22px -18px;padding-right:44px}
  .qstem{font-size:1.4375rem}
  .section-label{font-size:1.1875rem}
}

/* ================= quiet whimsy ================= */
/* pencil notes in the verdict banner */
.qverdict{position:relative}
.qverdict{flex-wrap:wrap}
.qverdict::after{position:static;margin-left:auto;max-width:48%;text-align:right;line-height:1.05;transform:rotate(-3deg);font-family:"Caveat","Segoe Print",cursive;font-weight:500;font-size:1.1875rem;opacity:.85;pointer-events:none}
.qverdict.correct::after{content:"nicely done";color:var(--correct)}
.qverdict.wrong::after{content:"happens to the best of us";color:var(--wrong)}
/* the ribbon sways once when you get one right */
@keyframes ribbon-sway{0%{transform:rotate(0)}25%{transform:rotate(5deg)}55%{transform:rotate(-3deg)}80%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
.qcard::before{transform-origin:50% 0}
.qcard:has(.qverdict.correct)::before{animation:ribbon-sway 1.4s ease-out 1}
/* dog-eared page corner that folds a little more on hover */
.qcard::after{content:"";position:absolute;left:-1px;bottom:-1px;width:16px;height:16px;background:linear-gradient(45deg,var(--bg) 50%,var(--bg-raise) 50%);box-shadow:1px -1px 2px rgba(0,0,0,.18);transition:width .25s,height .25s}
.qcard:hover::after{width:24px;height:24px}
/* results: stamp + due slip */
.stamp-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.stamp-row .date-stamp{margin-top:0}
.due-slip{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:10px;padding:8px 14px 10px;background-color:var(--page);background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--ruled) 17px 18px);border:1px solid var(--rule-strong);border-top:3px solid var(--purple);font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute);transform:rotate(1.5deg)}
.due-slip b{font-size:1rem;color:var(--ink)}
.due-slip em{grid-column:1/-1;font-style:normal;font-family:"Caveat",cursive;font-size:1.0625rem;color:var(--ink-soft)}
@media (max-width:600px){.qverdict::after{font-size:1.0625rem;max-width:44%}}
@media (max-width:380px){.qverdict::after{display:none}}
@media (prefers-reduced-motion:reduce){.qcard:has(.qverdict.correct)::before{animation:none}.qcard::after{transition:none}}

/* ---- intuitiveness pass ---- */
.nav-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.quiet{background:none;border:none;color:var(--ink-mute);font-size:0.875rem;padding:8px 10px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn.quiet:hover,.btn.quiet:focus-visible{color:var(--wrong)}
/* jump dots: a mark as well as a colour, so status reads without colour vision */
.jump-dot.checked-correct::after,.jump-dot.checked-wrong::after,.jump-dot.checked-partial::after{position:absolute;top:1px;right:3px;font-size:0.625rem;line-height:1;color:var(--bg);font-family:var(--body);font-weight:600}
.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}
.jump-dot.checked-partial::after,.jump-dot.checked-partial.current::after{content:"\00BD"}
@media (max-width:600px){.nav-left{width:100%;justify-content:space-between}}


/* ================= live engine additions ================= */

.qcard,#view-results,.display{overflow-wrap:anywhere}

.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}

ransmits pulses","c":false,"fb":"[M3] This focuses on sonar hardware while overlooking that transmitting pulses violates the requirement."}]},{"cat":"01","type":"mcq","stem":"Which statement correctly describes active sonar?","options":[{"t":"It carries information through an optical fiber.","c":false,"fb":"[M1] This confuses an underwater sensing method with a light-based communication channel."},{"t":"It only listens for naturally occurring underwater sounds.","c":false,"fb":"[M2] This assigns the defining listening-only behavior of the contrasting sonar mode."},{"t":"It uses reflected echoes to determine underwater distance and movement direction.","c":true,"fb":"Active sonar sends a signal and evaluates the returning echo."},{"t":"It requires simultaneous two-way voice communication.","c":false,"fb":"[M3] This confuses sonar behavior with a communication-direction category."}]},{"cat":"01","type":"mcq","stem":"A receiver stage must produce an increased version of a weak input signal. Which component is required?","options":[{"t":"Mixer","c":false,"fb":"[M3] This selects a component because it processes signals, but its defining operation is combining them."},{"t":"Amplifier","c":true,"fb":"An amplifier increases the version of the signal applied to its input."},{"t":"Oscillator","c":false,"fb":"[M1] This assumes the needed signal should be generated rather than increased from an existing input."},{"t":"Tuned circuit","c":false,"fb":"[M2] This confuses responsiveness to a frequency with increasing signal level."}]},{"cat":"01","type":"mcq","stem":"Which behavior is NOT the defining function of an amplifier?","options":[{"t":"Accepting an input signal","c":false,"fb":"An amplifier works from an applied input signal."},{"t":"Producing an increased version","c":false,"fb":"Increasing the input version is its defining receiver function."},{"t":"Raising the signal supplied to a later stage","c":false,"fb":"This is consistent with producing an increased signal version."},{"t":"Generating a repeated waveform without input","c":true,"fb":"That behavior defines a different receiver component, not an amplifier."}]},{"cat":"01","type":"mcq","stem":"Which receiver component can produce a continuous, repeated, alternating waveform without an input?","options":[{"t":"Oscillator","c":true,"fb":"This is the defining behavior of an oscillator."},{"t":"Amplifier","c":false,"fb":"[M2] This assumes increasing an existing signal is the same as generating a waveform."},{"t":"Filter","c":false,"fb":"[M3] This treats frequency-dependent signal processing as waveform generation."},{"t":"Mixer","c":false,"fb":"[M1] A mixer operates on two or more supplied signals rather than producing the stated waveform independently."}]},{"cat":"01","type":"multi","stem":"Which TWO statements correctly describe the operation and characteristics of an electronic oscillator? Select the TWO correct statements.","options":[{"t":"It produces a repeated alternating waveform.","c":true,"fb":"Repetition and alternation characterize its output."},{"t":"It must receive two signals before operating.","c":false,"fb":"[M1] This imports the input requirement of a combining component."},{"t":"It can produce its waveform without an input.","c":true,"fb":"Independent waveform production is part of the definition."},{"t":"Its only role is to attenuate unwanted frequencies.","c":false,"fb":"[M3] This assigns frequency-removal behavior to waveform generation."},{"t":"It merely enlarges a weak applied signal.","c":false,"fb":"[M2] This substitutes input amplification for independent generation."}]},{"cat":"01","type":"mcq","stem":"What is the defining operation of a mixer?","options":[{"t":"Producing a waveform without input","c":false,"fb":"[M2] This ignores that mixing begins with multiple supplied signals."},{"t":"Combining two or more electronic signals","c":true,"fb":"A mixer combines multiple signals into one or two outputs."},{"t":"Increasing only the input amplitude","c":false,"fb":"[M1] This reduces the operation to signal enlargement instead of combination."},{"t":"Attenuating every frequency equally","c":false,"fb":"[M3] This treats mixing as a frequency-removal operation."}]},{"cat":"01","type":"scenario","stem":"Which component performs this operation?","context":"Two electronic signals enter one receiver stage. The stage produces a new combined output for later processing.","options":[{"t":"Filter","c":false,"fb":"[M3] The presence of signal processing does not mean frequencies are being selectively attenuated."},{"t":"Amplifier","c":false,"fb":"[M1] Increasing one signal does not account for the combination of two inputs."},{"t":"Tuned circuit","c":false,"fb":"[M2] Frequency responsiveness does not explain the two-input combination."},{"t":"Mixer","c":true,"fb":"A mixer accepts two or more signals and produces combined output signals."}]},{"cat":"01","type":"mcq","stem":"Which pair of components is combined to form a tuned or resonant circuit?","options":[{"t":"Resistor and transistor","c":false,"fb":"[M2] This substitutes unrelated parts and omits both elements in the stated resonant combination."},{"t":"Amplifier and filter","c":false,"fb":"[M1] This combines receiver functions rather than the required circuit elements."},{"t":"Inductor and capacitor","c":true,"fb":"A tuned circuit combines an inductor and capacitor."},{"t":"Oscillator and mixer","c":false,"fb":"[M3] These are receiver components, but they do not constitute the stated resonant pair."}]},{"cat":"01","type":"mcq","stem":"What behavior results from combining an inductor and capacitor as a tuned circuit?","options":[{"t":"The circuit becomes responsive to a frequency.","c":true,"fb":"Frequency responsiveness is the stated purpose of the resonant combination."},{"t":"The circuit creates binary characters.","c":false,"fb":"[M3] This assigns a coding function to a frequency-responsive circuit."},{"t":"The circuit combines two message signals.","c":false,"fb":"[M1] This ,"fb":"A filter is characterized by frequency selection, not by combining multiple inputs."}]},{"cat":"01","type":"mcq","stem":"A television broadcaster sends programming to a television set, but the set cannot send information back through that connection. What mode is used?","options":[{"t":"Full duplex","c":false,"fb":"[M2] This assumes simultaneous return transmission exists even though the receiver cannot reply."},{"t":"Simplex","c":true,"fb":"Simplex carries information in one direction only."},{"t":"Half-duplex","c":false,"fb":"[M2] Taking turns still requires both directions, which this connection lacks."},{"t":"Analog","c":false,"fb":"[M3] This classifies the signal form instead of its allowed direction."}]},{"cat":"01","type":"mcq","stem":"Which statement distinguishes duplex communication from simplex communication?","options":[{"t":"Duplex always uses a digital signal.","c":false,"fb":"[M3] This confuses transmission direction with analog or digital signal form."},{"t":"Duplex requires only one physical device.","c":false,"fb":"[M3] Direction is not determined by simply counting devices."},{"t":"Duplex permits information in both directions.","c":true,"fb":"Two-way transmission is the common property of duplex modes."},{"t":"Duplex permits transmission in only one direction.","c":false,"fb":"[M1] This assigns the defining limitation of simplex to duplex."}]},{"cat":"01","type":"mcq","stem":"A ground-based television station transmits programming to a satellite over a one-way connection. What is this connection?","options":[{"t":"Simplex uplink","c":true,"fb":"The signal travels one way from the ground toward the satellite."},{"t":"Simplex downlink","c":false,"fb":"[M2] This reverses the direction relative to the satellite."},{"t":"Full-duplex link","c":false,"fb":"[M1] This assumes the connection supports a simultaneous return signal."},{"t":"Half-duplex link","c":false,"fb":"[M3] This treats a one-way connection as though its direction alternated."}]},{"cat":"01","type":"mcq","stem":"A satellite sends television programming to a home antenna, and the home antenna does not reply through that connection. How should the link be classified?","options":[{"t":"Half-duplex uplink","c":false,"fb":"[M2] Both the satellite-relative direction and capability are misclassified."},{"t":"Full-duplex downlink","c":false,"fb":"[M1] The receiving endpoint cannot transmit back through the connection."},{"t":"Simplex uplink","c":false,"fb":"[M2] This reverses the direction of travel from satellite to ground."},{"t":"Simplex downlink","c":true,"fb":"It is a one-way transmission from the satellite to a ground receiver."}]},{"cat":"01","type":"mcq","stem":"Two people on a telephone can talk and listen simultaneously. Which mode does this demonstrate?","options":[{"t":"Simplex","c":false,"fb":"[M2] This ignores that information can travel in both directions."},{"t":"Full duplex","c":true,"fb":"Full duplex permits simultaneous transmission and reception."},{"t":"Half-duplex","c":false,"fb":"[M3] Half-duplex requires the parties to take turns."},{"t":"Downlink","c":false,"fb":"[M1] This substitutes a one-way satellite-direction term for a duplex mode."}]},{"cat":"01","type":"multi","stem":"Which TWO statements correctly describe half-duplex communication? Select the TWO correct statements.","options":[{"t":"It supports communication in both directions.","c":true,"fb":"Half-duplex is a form of two-way communication."},{"t":"Both parties transmit simultaneously.","c":false,"fb":"[M3] This assigns full-duplex timing to half-duplex operation."},{"t":"The direction alternates.","c":true,"fb":"Transmitting and receiving occur by taking turns."},{"t":"The receiver can never send information back.","c":false,"fb":"[M2] This reduces half-duplex to one-way simplex communication."},{"t":"Every two-way link must operate this way.","c":false,"fb":"[M1] This overlooks the simultaneous alternative provided by full duplex."}]},{"cat":"01","type":"mcq","stem":"Which property defines an analog signal?","options":[{"t":"It varies only between binary 0 and 1.","c":false,"fb":"[M2] This substitutes discrete binary levels for continuous variation."},{"t":"It is always a single-frequency sine wave.","c":false,"fb":"[M1] A sine wave is one example, not the only analog signal."},{"t":"It is a continuously varying voltage or current.","c":true,"fb":"Continuous variation is the defining characteristic given in the handout."},{"t":"It must represent letters using ASCII.","c":false,"fb":"[M3] This assigns a digital character-coding requirement to analog signals."}]},{"cat":"01","type":"multi","stem":"Which THREE examples represent analog signals? Select the THREE correct statements.","options":[{"t":"Voice voltage","c":true,"fb":"Voice voltage varies according to sound information."},{"t":"Television signal","c":true,"fb":"A television signal is listed as a typical analog signal."},{"t":"Sine-wave tone","c":true,"fb":"A sine wave is a single-frequency analog signal."},{"t":"Serial binary code","c":false,"fb":"[M2] This uses discrete binary increments rather than continuous variation."},{"t":"Morse-code marks","c":false,"fb":"[M1] The handout categorizes Morse code as a digital-signal example."}]},{"cat":"01","type":"mcq","stem":"A light sensor produces a voltage that follows gradual changes in light level. Why is the output analog?","options":[{"t":"It is sent only through free space.","c":false,"fb":"[M3] The transmission medium does not determine whether the signal varies continuously."},{"t":"It uses seven units between words.","c":false,"fb":"[M1] This imports a Morse timing rule unrelated to sensor variation."},{"t":"It contains only fixed binary steps.","c":false,"fb":"[M2] Fixed discrete steps would contradict the described gradual variation."},{"t":"It varies continuously with the detected light.","c":true,"fb":"A sensor can produce an analog signal that follows a physical variation."}]},{"cat":"01","type":"mcq","stem":"How does a digital signal vary in electronic communication?","options":[{"t":"Continuously at every possible value","c":false,"fb":"[M2] This assigns the defining behavior of an analog signal."},{"t":"In discrete increments","c":true,"fb":"Digital signals change through separate levels or increments."},{"t":"Only as a single-frequency sine wave","c":false,"fb":"[M1] This mistakes an analog waveform example for the definition of digital signaling."},{"t":"Only when carried by optical fiber","c":false,"fb":"[M3] Signal form is not restricted to one communication medium."}]},{"cat":"01","type":"multi","stem":"Which THREE are listed as digital-signal examples? Select the THREE correct statements.","options":[{"t":"Telegraph or Morse code","c":true,"fb":"Morse signaling is identified as digital."},{"t":"Continuous-wave code","c":true,"fb":"CW code is included among the handout's digital examples."},{"t":"Serial binary code","c":true,"fb":"Serial binary signaling changes using discrete values."},{"t":"Voice voltage","c":false,"fb":"[M2] Voice voltage follows continuous sound variation."},{"t":"Television signal","c":false,"fb":"[M1] The handout lists television signals with typical analog signals."}]},{"cat":"01","type":"mcq","stem":"How does continuous-wave code represent Morse information?","options":[{"t":"By switching a sine-wave carrier on and off for short or long durations","c":true,"fb":"Short and long carrier durations represent dots and dashes."},{"t":"By varying voice voltage continuously","c":false,"fb":"[M3] This substitutes analog voice behavior for keyed radio telegraphy."},{"t":"By keeping the carrier permanently on","c":false,"fb":"[M1] This ignores the off periods required to separate keyed marks."},{"t":"By using only the carrier's direction of travel","c":false,"fb":"[M2] Direction does not encode the short and long Morse marks."}]},{"cat":"01","type":"mcq","stem":"When converting the Morse letter R, dot-dash-dot, into a CW signal, what should represent the dash?","options":[{"t":"A short sine-wave duration","c":false,"fb":"[M2] This reverses the duration assigned to the long Morse mark."},{"t":"A long sine-wave duration","c":true,"fb":"In CW signaling, a long carrier-on duration represents a dash."},{"t":"A permanently absent carrier","c":false,"fb":"[M1] An off interval separates marks but does not represent the dash itself."},{"t":"A continuously varying voice voltage","c":false,"fb":"[M3] This replaces keyed carrier duration with analog voice variation."}]},{"cat":"01","type":"mcq","stem":"Which action is NOT part of continuous-wave (CW) code transmission?","options":[{"t":"Obtain the character's Morse-code value.","c":false,"fb":"The Morse pattern must be known before its carrier durations can be produced."},{"t":"Use a short sine-wave duration for a dot.","c":false,"fb":"A short duration is the specified representation of a dot."},{"t":"Use a long sine-wave duration for a dash.","c":false,"fb":"A long duration is the specified representation of a dash."},{"t":"Convert each mark into a continuously varying voice voltage.","c":true,"fb":"CW conversion uses keyed carrier durations rather than analog voice variation."}]},{"cat":"01","type":"mcq","stem":"What is ASCII?","options":[{"t":"An underwater echo technique","c":false,"fb":"[M1] This confuses character representation with sonar behavior."},{"t":"A receiver frequency-selection circuit","c":false,"fb":"[M1] This assigns a hardware function to a digital communication code."},{"t":"A commonly used digital communication code","c":true,"fb":"ASCII is identified as the American Standard Code for Information Interchange."},{"t":"A continuously varying voice signal","c":false,"fb":"[M3] This substitutes analog information for coded digital characters."}]},{"cat":"01","type":"mcq","stem":"In binary serial signal encoding, where is a binary 1 placed?","options":[{"t":"At the specified height or amplitude","c":true,"fb":"A 1 is represented at the given amplitude level."},{"t":"At the starting voltage only","c":false,"fb":"[M2] This reverses the stated placement of binary 1 and binary 0."},{"t":"In a seven-unit blank interval","c":false,"fb":"[M1] This imports a Morse word-spacing rule into binary level representation."},{"t":"As a long sine-wave carrier duration","c":false,"fb":"[M3] This confuses binary voltage levels with CW keying durations."}]},{"cat":"01","type":"scenario","stem":"Which description is correct?","context":"A computer converts a character to its ASCII binary value and sends the bits one after another through a wire.","options":[{"t":"ASCII cannot pass through an electrical conductor.","c":false,"fb":"[M1] This treats ASCII as though it were restricted to a different physical medium."},{"t":"The character must first become a continuous voice voltage.","c":false,"fb":"[M3] This assumes digital character data requires analog voice conversion."},{"t":"Every 0 must be placed at the specified high amplitude.","c":false,"fb":"[M2] This reverses the level assigned to 0 in the stated representation."},{"t":"The binary code is being transferred serially.","c":true,"fb":"Sending the bits one after another is serial transfer."}]},{"cat":"01","type":"mcq","stem":"Which sequence correctly gives the five blocks of a communication system?","options":[{"t":"Source, Channel, Transmitter, Destination, Receiver","c":false,"fb":"This places the channel before the device that prepares the message for transmission."},{"t":"Transmitter, Source, Receiver, Channel, Destination","c":false,"fb":"This starts processing before identifying where the message originates."},{"t":"Information Source, Transmitter, Channel, Receiver, Destination","c":true,"fb":"This is the five-stage order specified in the handout."},{"t":"Information Source, Receiver, Channel, Transmitter, Destination","c":false,"fb":"This reverses the transmitting and receiving stages around the channel."}]},{"cat":"01","type":"mcq","stem":"Which input device and conversion are correctly matched?","options":[{"t":"Microphone: sound to electronic audio signal","c":true,"fb":"A microphone converts voice sound into an electronic audio signal."},{"t":"Camera: pressure to serial binary code","c":false,"fb":"A camera responds to light information rather than pressure."},{"t":"Keyboard: light scene to video signal","c":false,"fb":"A keyboard enters messages that can be converted to binary codes."},{"t":"Light transducer: audio signal to sound","c":false,"fb":"The stated input transducer converts a physical light quantity into an electronic signal."}]},{"cat":"01","type":"mcq","stem":"Which channel-description pairing is correct?","options":[{"t":"Electrical conductor: carries all messages on a light wave","c":false,"fb":"Light-wave carriage identifies optical media rather than a metal conductor."},{"t":"Optical medium: may use fiber-optic cable or a light pipe","c":true,"fb":"Fiber-optic cable and light pipe are the optical-media examples given."},{"t":"Free space: requires a pair of metal wires","c":false,"fb":"Free-space communication is wireless rather than wire-bound."},{"t":"Water: used only for television broadcasting","c":false,"fb":"Water is identified as the medium in special systems such as sonar."}]},{"cat":"01","type":"mcq","stem":"A Morse-code message contains a dot, a dash, a gap within one letter, a gap between letters, and a gap between words. Which timing sequence is correct?","options":[{"t":"1, 3, 1, 3, 7 units","c":true,"fb":"These values follow the dot, dash, intra-letter, inter-letter, and inter-word timing rules."},{"t":"1, 2, 3, 5, 7 units","c":false,"fb":"This treats Morse timing as an increasing sequence rather than using its defined intervals."},{"t":"3, 1, 3, 1, 7 units","c":false,"fb":"This reverses the timings of dots and dashes and of the two shorter spacing types."},{"t":"1, 3, 3, 1, 7 units","c":false,"fb":"This exchanges the one-unit intra-letter gap with the three-unit inter-letter gap."}]},{"cat":"01","type":"multi","stem":"Which FIVE electronic communication milestones correctly pair the year, event, and inventor or organization? Select the FIVE correct statements.","options":[{"t":"1837: telegraph, Samuel Morse","c":true,"fb":"The table associates Morse's telegraph invention with 1837."},{"t":"1876: telephone, Alexander Graham Bell","c":true,"fb":"The telephone milestone is associated with Bell and 1876."},{"t":"1887: radio-wave discovery, Heinrich Hertz","c":true,"fb":"Hertz's radio-wave discovery is listed for 1887."},{"t":"1901: transatlantic radio contact, Guglielmo Marconi","c":true,"fb":"Marconi's first transatlantic radio contact is listed for 1901."},{"t":"1906: amplitude modulation, Reginald Fessenden","c":true,"fb":"Fessenden's amplitude-modulation milestone is listed for 1906."},{"t":"1920: first radio broadcast, Bell Laboratories","c":false,"fb":"This combines the broadcast year with an organization associated with a later hardware milestone."},{"t":"1923: television demonstration, Tim Berners-Lee","c":false,"fb":"This places a later Internet figure into the early television milestone."},{"t":"2007: first LTE networks, Apple iPhone","c":false,"fb":"This merges the iPhone milestone with the later LTE network milestone."},{"t":"2019: beginning of 5G service, United States","c":false,"fb":"This replaces the country identified in the handout for the 2019 milestone."}]},{"cat":"01","type":"mcq","stem":"In communication systems, what does the term \"information\" or \"intelligence signal\" refer to?","options":[{"t":"The message represented in the form of an electronic signal","c":true,"fb":"In electronic systems, the message is called information or an intelligence signal and takes the form of an electronic signal."},{"t":"The physical electronic channel used to carry a signal","c":false,"fb":"The physical medium is the communication channel, not the intelligence signal."},{"t":"The electronic circuit stages that amplify incoming signals","c":false,"fb":"These circuits process a transmitted signal rather than constitute the original message."},{"t":"The final destination device that receives a signal","c":false,"fb":"The final recipient is the destination, while the intelligence signal is the electronic form of the message."}]},{"cat":"01","type":"mcq","stem":"Which form of communication relies on body language rather than spoken words or electronic devices?","options":[{"t":"Nonverbal communication","c":true,"fb":"The handout identifies body language as an example of nonverbal communication."},{"t":"Verbal communication","c":false,"fb":"Verbal communication involves spoken or written language rather than body language."},{"t":"Electronic communication","c":false,"fb":"Electronic communication involves electronic devices, transmitters, and receivers."},{"t":"Print communication","c":false,"fb":"Print communication involves printed text rather than physical body language."}]},{"cat":"01","type":"scenario","stem":"Which option correctly identifies Ana's original voice message and Ben's role in the block diagram?","context":"Ana speaks a voice message into a communication system. Ben receives the recovered message and understands what Ana said.","options":[{"t":"Ana's original message is at the Information Source, while Ben represents the Destination.","c":true,"fb":"The Information Source is where the message originates, while the Destination receives and processes the message to understand it."},{"t":"Ana's original message is at the Destination, while Ben represents the Information Source.","c":false,"fb":"This reverses the starting and final blocks of the communication system."},{"t":"Ana's original message is the Channel, while Ben represents the Transmitter.","c":false,"fb":"The channel carries the signal, and the transmitter converts the message into a suitable electronic form."},{"t":"Ana and Ben both represent the Receiver because both are involved in communication.","c":false,"fb":"Ana is associated with the message's origin, while Ben is the final recipient who understands it."}]},{"cat":"01","type":"scenario","stem":"What is the primary role of the Transmitter block in this system?","context":"A podcaster records an episode in a studio. The podcaster speaks ideas into a recording microphone connected to a transmitter.","options":[{"t":"It originates the podcaster's thoughts and ideas.","c":false,"fb":"Originating the message is the function of the Information Source."},{"t":"It converts the original voice message into an electronic form suitable for transmission.","c":true,"fb":"The first step of transmission is converting the message into an electronic form suitable for transmission."},{"t":"It acts as the physical medium that carries the signal through free space.","c":false,"fb":"The medium carrying the signal is the communication channel."},{"t":"It serves as the final destination that comprehends the recorded audio.","c":false,"fb":"Receiving and understanding the message is the role of the Destination block."}]},{"cat":"01","type":"mcq","stem":"Who is associated with the discovery of radio waves in 1887?","options":[{"t":"Heinrich Hertz","c":true,"fb":"Heinrich Hertz is identified with the discovery of radio waves in 1887."},{"t":"Guglielmo Marconi","c":false,"fb":"Marconi is associated with the first transatlantic radio contact in 1901."},{"t":"Reginald Fessenden","c":false,"fb":"Fessenden is associated with the invention of amplitude modulation in 1906."},{"t":"Samuel Morse","c":false,"fb":"Morse is associated with the invention of the telegraph in 1837."}]},{"cat":"01","type":"mcq","stem":"Which organization is associated with the first radio broadcast in 1920?","options":[{"t":"KDKA Pittsburgh","c":true,"fb":"The handout identifies KDKA Pittsburgh with the first radio broadcast in 1920."},{"t":"Bell Laboratories","c":false,"fb":"Bell Laboratories is associated with the invention of the transistor in 1948."},{"t":"BlackBerry","c":false,"fb":"BlackBerry is listed among the companies associated with the first smartphones during 1996–2001."},{"t":"Apple","c":false,"fb":"Apple is associated with the development of the iPhone in 2007."}]},{"cat":"01","type":"mcq","stem":"What communication milestone is associated with Vladimir Zworykin in 1923?","options":[{"t":"The invention and demonstration of the television","c":true,"fb":"Vladimir Zworykin is associated with the invention and demonstration of television in 1923."},{"t":"The discovery of radio waves","c":false,"fb":"Heinrich Hertz is associated with the discovery of radio waves in 1887."},{"t":"The invention of amplitude modulation","c":false,"fb":"Reginald Fessenden is associated with amplitude modulation in 1906."},{"t":"The first use of walkie-talkies","c":false,"fb":"The first use of two-way radios or walkie-talkies is associated with the United States in 1939."}]},{"cat":"01","type":"mcq","stem":"Which organization invented the transistor in 1948?","options":[{"t":"Bell Laboratories","c":true,"fb":"The handout associates Bell Laboratories with the invention of the transistor in 1948."},{"t":"KDKA Pittsburgh","c":false,"fb":"KDKA Pittsburgh is associated with the first radio broadcast in 1920."},{"t":"Apple","c":false,"fb":"Apple is associated with the development of the iPhone in 2007."},{"t":"Nokia","c":false,"fb":"Nokia is listed among the companies associated with the first smartphones during 1996–2001."}]},{"cat":"01","type":"mcq","stem":"Who are associated with the invention of the integrated circuit during 1958–1969?","options":[{"t":"Jack Kilby and Robert Noyce","c":true,"fb":"The handout identifies Jack Kilby and Robert Noyce as the inventors associated with the integrated circuit."},{"t":"Heinrich Hertz and Guglielmo Marconi","c":false,"fb":"Hertz is associated with radio waves, while Marconi is associated with the first transatlantic radio contact."},{"t":"Samuel Morse and Alexander Graham Bell","c":false,"fb":"Morse is associated with the telegraph, while Bell is associated with the telephone."},{"t":"Vladimir Zworykin and Reginald Fessenden","c":false,"fb":"Zworykin is associated with television, while Fessenden is associated with amplitude modulation."}]},{"cat":"01","type":"mcq","stem":"Who is credited with the development and first use of the Internet during the period 1982–1990?","options":[{"t":"Tim Berners-Lee","c":true,"fb":"Historical milestones associate Tim Berners-Lee with the development and first use of the Internet during 1982–1990."},{"t":"Alexander Graham Bell","c":false,"fb":"Bell is associated with the invention of the telephone in 1876."},{"t":"Vladimir Zworykin","c":false,"fb":"Zworykin is associated with the invention and demonstration of television in 1923."},{"t":"Jack Kilby","c":false,"fb":"Kilby is associated with the invention of the integrated circuit together with Robert Noyce."}]},{"cat":"01","type":"scenario","stem":"Which electronic communication milestone is being described?","context":"A technology retrospective highlights a 2007 milestone in the United States that transformed modern mobile communication and smartphone design.","options":[{"t":"The development of Apple's iPhone","c":true,"fb":"Historical milestones identify the development of Apple's iPhone as a 2007 milestone in the United States."},{"t":"The first use of two-way radios","c":false,"fb":"Two-way radios are listed as a 1939 milestone in the United States."},{"t":"The deployment of the Global Positioning System","c":false,"fb":"GPS deployment is listed as a 1995 milestone in the United States."},{"t":"The first wireless local area networks","c":false,"fb":"The first wireless LANs are listed as a 1997 milestone in the United States."}]},{"cat":"01","type":"mcq","stem":"Which country is historically associated with the 2019 launch of 5G cellular service in electronic communication milestones?","options":[{"t":"Uruguay","c":true,"fb":"Historical milestones identify Uruguay as the location associated with the beginning of 5G cellular service in 2019."},{"t":"United States","c":false,"fb":"The United States is associated with milestones such as the 1975 personal computer, 1995 GPS, and 2007 iPhone."},{"t":"Worldwide","c":false,"fb":"Worldwide scope is associated with the 1996–2001 first smartphones and 2009 4G LTE networks."},{"t":"KDKA Pittsburgh","c":false,"fb":"KDKA Pittsburgh is the station associated with the 1920 first radio broadcast."}]},{"cat":"01","type":"scenario","stem":"How is this overall communication system classified?","context":"An operator sends directional control signals to an airborne drone. At the same time, a camera mounted on the drone transmits live video back to the operator.","options":[{"t":"Simplex transmission, because the operator sends control signals in one direction.","c":false,"fb":"While the forward control link alone is simple, video transmitted back to the operator makes the overall system a duplex transmission."},{"t":"Duplex transmission, because the camera transmits video back to the operator.","c":true,"fb":"The handout states that duplex transmission occurs if the drone's camera transmits video back to the operator."},{"t":"Simplex downlink, because only one-way programming from a satellite is involved.","c":false,"fb":"A simplex downlink describes one-way transmission from a satellite to a home antenna."},{"t":"Single-frequency analog tone, because signals only travel through free space.","c":false,"fb":"A single-frequency tone describes a sine wave, not a two-way directional communication link."}]},{"cat":"01","type":"mcq","stem":"Which communication systems typically operate in half-duplex mode?","options":[{"t":"Television broadcasting and remote control","c":false,"fb":"Television broadcasting and remote control are examples of one-way simplex communication."},{"t":"Military, fire, aircraft, and marine radio transmissions","c":true,"fb":"The handout explicitly states that most military, fire, aircraft, and marine radio transmissions utilize half-duplex communications."},{"t":"People communicating simultaneously on a telephone","c":false,"fb":"A telephone conversation where people talk and listen simultaneously is a full-duplex system."},{"t":"Simplex satellite downlinks to home antennas","c":false,"fb":"Satellite downlinks are one-way simplex transmissions where the receiver does not transmit back."}]},{"cat":"01","type":"mcq","stem":"Which electronic communication milestone occurred in the United States in 1939?","options":[{"t":"The invention of the transistor","c":false,"fb":"The invention of the transistor is associated with Bell Laboratories in 1948."},{"t":"The invention and demonstration of the television","c":false,"fb":"Television invention and demonstration is associated with Vladimir Zworykin in 1923."},{"t":"The first use of two-way radios (walkie-talkies)","c":true,"fb":"Historical milestones list the first use of two-way radios (walkie-talkies) in the United States in 1939."},{"t":"The first wireless local area networks (LANs)","c":false,"fb":"The first wireless LANs are listed as a 1997 milestone in the United States."}]},{"cat":"01","type":"mcq","stem":"Which computing and electronic communication milestone was introduced in the United States in 1975?","options":[{"t":"The first personal computers","c":true,"fb":"Historical milestones identify the United States with the first personal computers in 1975."},{"t":"The development and the first use of the Internet","c":false,"fb":"The development and first use of the Internet is listed for 1982–1990 with Tim Berners-Lee."},{"t":"The invention of the integrated circuit","c":false,"fb":"The integrated circuit was invented during 1958–1969 by Jack Kilby and Robert Noyce."},{"t":"The development of Apple's iPhone","c":false,"fb":"The development of Apple's iPhone is listed under the United States in 2007."}]},{"cat":"01","type":"mcq","stem":"Which milestone was deployed in the United States in 1995?","options":[{"t":"The first transatlantic radio contact made","c":false,"fb":"The first transatlantic radio contact was made by Guglielmo Marconi in 1901."},{"t":"The deployment of Global Positioning System (GPS)","c":true,"fb":"Historical milestones associate the deployment of GPS with the United States in 1995."},{"t":"The beginning of 5G cellular service","c":false,"fb":"The beginning of 5G cellular service occurred in Uruguay in 2019."},{"t":"The first fourth-generation LTE cellular networks","c":false,"fb":"The first 4G LTE cellular networks are listed as a worldwide milestone in 2009."}]},{"cat":"01","type":"mcq","stem":"Which mobile device milestone emerged worldwide during the period 1996–2001?","options":[{"t":"The invention of amplitude modulation","c":false,"fb":"Amplitude modulation was invented by Reginald Fessenden in 1906."},{"t":"The rise of social media","c":false,"fb":"The rise of social media is associated with the United States during 2004–2006."},{"t":"The first smartphones by BlackBerry, Nokia, and Palm","c":true,"fb":"Historical milestones identify 1996–2001 and Worldwide for the first smartphones by BlackBerry, Nokia, and Palm."},{"t":"The first fourth-generation LTE cellular networks","c":false,"fb":"The first 4G LTE cellular networks are listed as a worldwide milestone in 2009."}]},{"cat":"01","type":"mcq","stem":"Which local networking milestone was introduced in the United States in 1997?","options":[{"t":"The first wireless local area networks (LANs)","c":true,"fb":"Historical milestones list the first wireless local area networks (LANs) in the United States in 1997."},{"t":"The invention of the telegraph","c":false,"fb":"Samuel Morse invented the telegraph in 1837 and patented it in 1844."},{"t":"The first use of two-way radios (walkie-talkies)","c":false,"fb":"Two-way radios are listed as a 1939 milestone in the United States."},{"t":"The first radio broadcast","c":false,"fb":"The first radio broadcast was transmitted by KDKA Pittsburgh in 1920."}]},{"cat":"01","type":"mcq","stem":"Which major digital communication milestone emerged in the United States during the period 2004–2006?","options":[{"t":"The development and the first use of the Internet","c":false,"fb":"The development and first use of the Internet occurred during 1982–1990."},{"t":"The rise of social media","c":true,"fb":"Historical milestones designate the 2004–2006 period as the milestone for the rise of social media in the United States."},{"t":"The discovery of radio waves","c":false,"fb":"Heinrich Hertz discovered radio waves in 1887."},{"t":"The beginning of 5G cellular service","c":false,"fb":"The beginning of 5G cellular service occurred in Uruguay in 2019."}]},{"cat":"01","type":"mcq","stem":"Which cellular network standard was rolled out worldwide in 2009?","options":[{"t":"The first fourth-generation LTE cellular networks","c":true,"fb":"Historical milestones list 2009 and Worldwide for the first fourth-generation LTE cellular networks."},{"t":"The beginning of 5G cellular service","c":false,"fb":"The beginning of 5G cellular service occurred in Uruguay in 2019."},{"t":"The development of Apple's iPhone","c":false,"fb":"The development of Apple's iPhone is listed as a 2007 milestone in the United States."},{"t":"The invention of the telephone","c":false,"fb":"Alexander Graham Bell invented the telephone in 1876."}]},{"cat":"02","type":"mcq","stem":"In electronic communication systems, how is a signal formally defined?","options":[{"t":"An electromagnetic or electrical current representing information carried from a source to a destination","c":true,"fb":"Accurately identifies the foundational definition of an electronic communication signal."},{"t":"A constant DC voltage level maintained across a transmission line to suppress noise","c":false,"fb":"Assumes signals are unvarying reference voltages rather than information-bearing dynamic currents."},{"t":"The physical copper medium through which data packets propagate between network nodes","c":false,"fb":"Confuses the physical transmission medium/channel with the propagating signal itself."},{"t":"A purely acoustic compression wave radiating directly through atmospheric channels","c":false,"fb":"Confuses electronic/electromagnetic signals with acoustic sound pressure waves."}]},{"cat":"02","type":"mcq","stem":"Which statement correctly describes the mathematical properties and units of circuit gain?","options":[{"t":"Voltage gain is expressed in decibels per meter, while power gain is expressed in Watts","c":false,"fb":"Incorrectly assigns dimensional units to standard linear gain ratios."},{"t":"Gain represents amplification where output amplitude is greater than input, and voltage gain is unitless","c":true,"fb":"Accurately states that gain represents amplification (A > 1) and is a unitless ratio."},{"t":"Gain is strictly present only when the ratio of output to input is less than 1","c":false,"fb":"Confuses circuit amplification gain with circuit attenuation."},{"t":"Linear voltage gain is expressed in units of Amperes","c":false,"fb":"Confuses the unitless voltage/power gain factor A with current gain units specified in Amperes."}]},{"cat":"02","type":"multi","stem":"Which statements correctly characterize gain and attenuation in communication circuits? Select the TWO correct statements regarding gain and attenuation.","options":[{"t":"An electronic circuit exhibits attenuation when its output signal is lower in amplitude than its input signal","c":true,"fb":"Accurately reflects the core condition of signal attenuation (Vout < Vin)."},{"t":"A circuit stage that provides signal amplification has a linear gain factor less than 1.0","c":false,"fb":"Assumes amplification corresponds to a gain factor below unity instead of above unity."},{"t":"Both gain and attenuation can be mathematically represented by the letter A","c":true,"fb":"Accurately identifies that the letter A denotes the input/output ratio for both gain and attenuation."},{"t":"Attenuation increases signal amplitude to compensate for noise introduced by physical channels","c":false,"fb":"Mistakenly attributes the function of an amplifier to an attenuator."},{"t":"Current gain is a dimensionless quantity that has no physical unit of measurement","c":false,"fb":"Overlooks the handout specification that current gain is expressed in Amperes."}]},{"cat":"02","type":"fitb","stem":"A circuit has an input voltage of 5 mV and an output voltage of 150 mV. The calculated voltage gain (Av) of the circuit is ____.","subtype":"value","answer":["30","30.0"],"caseSensitive":false,"hint":"Voltage gain is the ratio of output voltage to input voltage (Av = Vout / Vin).","fb":"Dividing Vout (150 mV) by Vin (5 mV) gives a voltage gain of 30."},{"cat":"02","type":"scenario","stem":"What is the magnitude of the input voltage (Vin) supplied to the preamplifier?","context":"An RF preamplifier circuit in a communication receiver is designed with a known voltage gain of 230. During a test bench measurement, an oscilloscope measures the output voltage (Vout) at exactly 0.7 V.","options":[{"t":"161.0 V","c":false,"fb":"Multiplies output voltage by gain (Vout * Av) instead of dividing."},{"t":"328.57 mV","c":false,"fb":"Inverts the formula to divide gain by output voltage (Av / Vout)."},{"t":"3.04 mV","c":true,"fb":"Correctly applies Vin = Vout / Av = 0.7 V / 230 ≈ 0.00304 V = 3.04 mV."},{"t":"0.0304 mV","c":false,"fb":"Introduces a power-of-ten metric prefix calculation error."}]},{"cat":"02","type":"mcq","stem":"An amplifier receives a small sensor signal of 140 μV and produces an amplified output of 65 mV. What is the calculated voltage gain (Av)?","options":[{"t":"464.29","c":true,"fb":"Correctly divides 65 x 10^-3 V by 140 x 10^-6 V to obtain 464.29."},{"t":"0.464","c":false,"fb":"Fails to convert microvolts and millivolts to base Volts, causing a 10^3 scaling error."},{"t":"2.15","c":false,"fb":"Inverts the ratio by dividing input voltage by output voltage (Vin / Vout)."},{"t":"9100.0","c":false,"fb":"Multiplies the two voltage magnitudes together instead of computing their ratio."}]},{"cat":"02","type":"mcq","stem":"Which formula correctly expresses the linear power gain (Ap) of an amplifier stage?","options":[{"t":"Ap = Pin / Pout","c":false,"fb":"Inverts the input and output terms in the transfer ratio."},{"t":"Ap = Pout / Pin","c":true,"fb":"Accurately identifies power gain as output power divided by input power."},{"t":"Ap = 10 * (Pout - Pin)","c":false,"fb":"Confuses linear ratio gain with arithmetic power difference."},{"t":"Ap = (Pout * Pin) / 2","c":false,"fb":"Uses an arbitrary product formula rather than an output-to-input ratio."}]},{"cat":"02","type":"fitb","stem":"An intermediate power amplifier receives an input power of 25 mW and delivers an output power of 500 mW to the antenna feed. The linear power gain (Ap) of this stage is ____.","subtype":"value","answer":["20","20.0"],"caseSensitive":false,"hint":"Compute the ratio of power output to power input (Ap = Pout / Pin).","fb":"Dividing Pout (500 mW) by Pin (25 mW) yields a power gain of 20."},{"cat":"02","type":"scenario","stem":"What is the total power delivered at the output of the third stage (Pout)?","context":"A transmitter power amplification chain consists of three cascaded amplifier stages with individual power gains of A1 = 5, A2 = 3, and A3 = 16. An input signal with a power level of Pin = 40 mW (0.040 W) is applied to the input of the first stage.","options":[{"t":"0.96 W","c":false,"fb":"Uses an incorrect total gain calculation (AT = 24) by adding stage gains instead of multiplying."},{"t":"9.6 W","c":true,"fb":"Correctly computes total gain AT = 5 * 3 * 16 = 240, then Pout = 240 * 0.040 W = 9.6 W."},{"t":"240.0 W","c":false,"fb":"Reports the total unitless gain factor rather than multiplying by the input power."},{"t":"1.67 W","c":false,"fb":"Divides total gain by input power instead of multiplying."}]},{"cat":"02","type":"mcq","stem":"How is the overall total gain (AT) calculated when multiple amplifier stages are connected in cascade?","options":[{"t":"By taking the arithmetic mean of all individual circuit gains","c":false,"fb":"Assumes stages average their amplification rather than compounding."},{"t":"By adding the individual linear gain factors (A1 + A2 + A3)","c":false,"fb":"Conflates decibel addition rules with linear gain factor multiplication."},{"t":"By multiplying the individual stage gains together (A1 * A2 * A3)","c":true,"fb":"Correctly identifies that overall linear cascaded gain is the product of individual gains."},{"t":"By taking the reciprocal sum of the individual gain stages","c":false,"fb":"Applies the parallel resistor formula to cascaded series stages."}]},{"cat":"02","type":"scenario","stem":"What is the final output voltage (Vout) emerging from the cascaded chain?","context":"A multistage signal conditioning path has three cascaded loss stages with individual attenuation factors of A1 = 0.2, A2 = 0.9, and A3 = 0.06. A signal with an amplitude of Vin = 3 V is applied to the input.","options":[{"t":"32.4 mV","c":true,"fb":"Correctly computes AT = 0.2 * 0.9 * 0.06 = 0.0108, then Vout = 0.0108 * 3 V = 0.0324 V = 32.4 mV."},{"t":"3.48 V","c":false,"fb":"Adds the attenuation factors (1.16) and multiplies by input voltage."},{"t":"277.7 V","c":false,"fb":"Divides the input voltage by the total attenuation factor instead of multiplying."},{"t":"324.0 mV","c":false,"fb":"Introduces a factor-of-ten decimal placement error during millivolt conversion."}]},{"cat":"02","type":"fitb","stem":"Three cascaded amplifier stages have individual voltage gains of 5, 3, and 4. The overall voltage gain (AT) of the cascaded system is ____.","subtype":"value","answer":["60","60.0"],"caseSensitive":false,"hint":"Total gain is found by multiplying individual stage gains: AT = A1 * A2 * A3.","fb":"Multiplying the individual gains (5 * 3 * 4) yields an overall system gain of 60."},{"cat":"02","type":"multi","stem":"Which statements correctly describe cascaded circuits and components? Select the TWO correct statements regarding cascaded processing stages.","options":[{"t":"In a cascaded system, the output of each preceding stage serves as the input to the following stage","c":true,"fb":"Accurately describes the sequential signal connection of cascaded circuit stages."},{"t":"The total gain of cascaded linear amplifiers is determined by summing their individual gains","c":false,"fb":"Incorrectly applies addition instead of multiplication to linear gain stages."},{"t":"The overall attenuation factor of cascaded lossy components is the product of their individual attenuation factors","c":true,"fb":"Correctly identifies that cascaded attenuations multiply together (AT = A1 * A2 * A3)."},{"t":"Cascading three attenuators with factors less than 1 results in a total system gain greater than 1","c":false,"fb":"Believes compounding losses can spontaneously create signal amplification."},{"t":"The total output voltage is calculated by dividing the input voltage by the product of stage gains","c":false,"fb":"Inverts the relationship between total gain and input voltage."}]},{"cat":"02","type":"mcq","stem":"For a resistive voltage divider composed of series resistors R1 and R2 (where output is taken across R2), what is the formula for the circuit attenuation factor A?","options":[{"t":"A = (R1 + R2) / R2","c":false,"fb":"Inverts the voltage divider transfer ratio."},{"t":"A = R2 / (R1 + R2)","c":true,"fb":"Accurately identifies the standard resistive divider attenuation ratio."},{"t":"A = R1 / R2","c":false,"fb":"Omits the total series resistance from the denominator."},{"t":"A = (R1 * R2) / (R1 + R2)","c":false,"fb":"Confuses voltage attenuation with parallel equivalent resistance."}]},{"cat":"02","type":"fitb","stem":"A voltage divider attenuator has resistor values of R1 = 200 Ω and R2 = 100 Ω. The attenuation factor (A) of this circuit, rounded to four decimal places, is ____.","subtype":"value","answer":["0.3333","0.333","1/3"],"caseSensitive":false,"hint":"Attenuation factor is A = R2 / (R1 + R2).","fb":"Dividing R2 (100) by R1 + R2 (300) yields an attenuation factor of 0.3333."},{"cat":"02","type":"mcq","stem":"To completely offset an attenuation stage having an attenuation factor A1 and restore overall circuit gain to unity (AT = 1), what gain A2 must the compensating amplifier possess?","options":[{"t":"A2 = 1 - A1","c":false,"fb":"Treats gain-loss cancellation as additive subtraction rather than multiplicative inverse."},{"t":"A2 = 1 / A1","c":true,"fb":"Correctly identifies that compensating amplifier gain must be the reciprocal of attenuation."},{"t":"A2 = A1^2","c":false,"fb":"Applies a power function instead of the reciprocal relationship."},{"t":"A2 = -A1","c":false,"fb":"Confuses linear gain compensation with arithmetic negation."}]},{"cat":"02","type":"scenario","stem":"What value of gain (A2) must be selected for the amplifier?","context":"A communication front-end contains a passive attenuator with resistors R1 = 750 Ω and R2 = 250 Ω, yielding an attenuation factor of A1 = 0.25. An engineer needs to place an amplifier stage (A2) immediately following the attenuator so that the final output voltage equals the original input voltage (Vout = Vin).","options":[{"t":"0.75","c":false,"fb":"Subtracts the attenuation factor from 1 (1 - 0.25) instead of taking the reciprocal."},{"t":"2.50","c":false,"fb":"Multiplies attenuation by 10 rather than calculating 1 / A1."},{"t":"4","c":true,"fb":"Correctly computes the reciprocal gain A2 = 1 / A1 = 1 / 0.25 = 4."},{"t":"1.25","c":false,"fb":"Adds the attenuation factor to 1 (1 + 0.25) rather than taking the reciprocal."}]},{"cat":"02","type":"mcq","stem":"What is the primary operational advantage of converting large gain and attenuation ratios into decibels (dB) in communication engineering?","options":[{"t":"It allows nonlinear semiconductor distortion to be completely eliminated from the circuit","c":false,"fb":"Mistakenly attributes physical circuit linearization to a mathematical unit conversion."},{"t":"It compresses huge numerical values reaching into the millions into smaller, manageable numbers that reflect human auditory response","c":true,"fb":"Accurately states that decibels compress large numbers logarithmically and model human ear response."},{"t":"It converts alternating current signals directly into direct current voltage levels","c":false,"fb":"Confuses decibel representation with power rectification."},{"t":"It increases the physical bandwidth and speed of light propagation in free space","c":false,"fb":"Confuses mathematical unit representation with physical medium propagation properties."}]},{"cat":"02","type":"mcq","stem":"Which mathematical formula is used to calculate the voltage gain or attenuation of a circuit in decibels?","options":[{"t":"dB = 10 log(Vout / Vin)","c":false,"fb":"Uses the multiplier for power (10) instead of the voltage multiplier (20)."},{"t":"dB = 20 log(Vout / Vin)","c":true,"fb":"Accurately identifies dB = 20 log(Vout / Vin) as the voltage decibel formula."},{"t":"dB = 20 ln(Vout * Vin)","c":false,"fb":"Uses natural logarithm and product of voltages instead of base-10 log of the ratio."},{"t":"dB = 2 log(Vin / Vout)","c":false,"fb":"Uses an incorrect scalar multiplier and inverts the ratio."}]},{"cat":"02","type":"scenario","stem":"What is the voltage gain of the amplifier expressed in decibels?","context":"A sensitive instrumentation amplifier receives an input signal of Vin = 4 mV (0.004 V) and produces an amplified output of Vout = 7 V.","options":[{"t":"32.43 dB","c":false,"fb":"Applies the power formula (dB = 10 log(Vout / Vin)) instead of the voltage formula (20 log)."},{"t":"64.86 dB","c":true,"fb":"Correctly computes ratio 7 / 0.004 = 1750, log(1750) ≈ 3.243, and 20 * 3.243 = 64.86 dB."},{"t":"48.86 dB","c":false,"fb":"Miscalculates the voltage ratio prior to taking the logarithm."},{"t":"-64.86 dB","c":false,"fb":"Applies a negative sign to an amplifying circuit that has a gain greater than 1."}]},{"cat":"02","type":"fitb","stem":"An amplifier increases an input signal of 1 V to an output of 100 V. The voltage gain expressed in decibels is ____ dB.","subtype":"value","answer":["40","40.0"],"caseSensitive":false,"hint":"Use dB = 20 log(Vout / Vin).","fb":"The ratio is 100 / 1 = 100; log(100) = 2; multiplying by 20 gives 40 dB."},{"cat":"02","type":"mcq","stem":"Which formula correctly expresses power gain or attenuation in decibels?","options":[{"t":"dB = 20 log(Pout / Pin)","c":false,"fb":"Uses the voltage/current multiplier (20) instead of the power multiplier (10)."},{"t":"dB = 10 log(Pin / Pout)","c":false,"fb":"Inverts the ratio by placing input power over output power."},{"t":"dB = 10 log(Pout / Pin)","c":true,"fb":"Accurately identifies dB = 10 log(Pout / Pin) as the power decibel formula."},{"t":"dB = 10 * (Pout / Pin)","c":false,"fb":"Omits the base-10 logarithm operation."}]},{"cat":"02","type":"scenario","stem":"What is the gain/attenuation of the filter expressed in decibels?","context":"A bandpass filter inserted into an antenna transmission line receives an input power of Pin = 60 mW and delivers an output power of Pout = 3 mW due to insertion loss.","options":[{"t":"-13.01 dB","c":true,"fb":"Correctly computes ratio 3 / 60 = 0.05, log(0.05) ≈ -1.301, and 10 * (-1.301) = -13.01 dB."},{"t":"-26.02 dB","c":false,"fb":"Uses the voltage multiplier of 20 instead of 10 for power (20 log(0.05))."},{"t":"+13.01 dB","c":false,"fb":"Disregards the negative sign produced when the ratio is less than 1."},{"t":"-1.30 dB","c":false,"fb":"Forgets to multiply the logarithm result by 10."}]},{"cat":"02","type":"fitb","stem":"A power amplifier receives an input power of 10 mW and outputs 1000 mW. The power gain of this amplifier in decibels is ____ dB.","subtype":"value","answer":["20","20.0"],"caseSensitive":false,"hint":"Apply the power decibel formula: dB = 10 log(Pout / Pin).","fb":"The power ratio is 1000 / 10 = 100; log(100) = 2; multiplying by 10 yields 20 dB."},{"cat":"02","type":"mcq","stem":"In decibel analysis, what does a negative decibel (-dB) value signify about a circuit stage?","options":[{"t":"The circuit is oscillating and generating excessive harmonic distortion","c":false,"fb":"Associates negative decibels with instability rather than attenuation."},{"t":"The stage exhibits attenuation or circuit loss where the gain is less than 1","c":true,"fb":"Accurately identifies that negative dB corresponds to attenuation or a gain factor below unity."},{"t":"The stage has amplified the signal with a 180° phase inversion","c":false,"fb":"Confuses a negative decibel magnitude with AC phase angle inversion."},{"t":"The circuit has achieved infinite voltage gain","c":false,"fb":"Misunderstands the physical meaning of negative logarithmic values."}]},{"cat":"02","type":"multi","stem":"Which statements accurately describe decibel polarity? Select the TWO correct statements regarding decibel sign conventions.","options":[{"t":"A circuit that amplifies a signal produces a positive decibel value","c":true,"fb":"Accurately states that gain greater than 1 results in positive dB."},{"t":"A circuit with an output amplitude lower than its input produces a negative decibel value","c":true,"fb":"Accurately states that attenuation/loss produces negative dB."},{"t":"A negative decibel value indicates that the output power is greater than the input power","c":false,"fb":"Claims negative dB represents amplification rather than loss."},{"t":"A positive decibel value indicates that the circuit has a linear gain factor between 0 and 1","c":false,"fb":"Confuses the linear gain range of attenuation with positive decibels."},{"t":"A decibel calculation of 0 dB indicates that the circuit is completely attenuating the signal to 0 Volts","c":false,"fb":"Mistakenly assumes 0 dB means zero output rather than unity gain (Vout = Vin)."}]},{"cat":"02","type":"fitb","stem":"In electronic communication, the rate of repetitive wave oscillations measured in cycles per second (cps) is defined as the unit named ____, named after a pioneer in electromagnetics.","subtype":"term","answer":["hertz","Hz"],"caseSensitive":false,"hint":"1 cps = 1 Hz, named after Heinrich Hertz.","fb":"Frequency in cycles per second is expressed in hertz (Hz) in honor of Heinrich Hertz."},{"cat":"02","type":"mcq","stem":"If a periodic alternating current completes 330 cycles in one second, what is its frequency expressed in standard units?","options":[{"t":"330 Hz","c":true,"fb":"Accurately applies the equivalence 1 cps = 1 Hz, yielding 330 Hz."},{"t":"3.3 kHz","c":false,"fb":"Introduces an incorrect metric scaling factor of 10."},{"t":"330 MHz","c":false,"fb":"Confuses base hertz with megahertz (10^6)."},{"t":"33 cps/s","c":false,"fb":"Creates a non-standard squared-time unit."}]},{"cat":"02","type":"mcq","stem":"Which of the following correctly pairs an SI metric prefix with its exact power of 10 multiplier used in frequency scaling?","options":[{"t":"Kilo (k) = 10^2","c":false,"fb":"Uses 10^2 (hundred) instead of 10^3 (thousand)."},{"t":"Mega (M) = 10^6","c":true,"fb":"Correctly identifies Mega (M) as representing 10^6 (1,000,000)."},{"t":"Giga (G) = 10^12","c":false,"fb":"Confuses Giga (10^9) with Tera (10^12)."},{"t":"Tera (T) = 10^9","c":false,"fb":"Confuses Tera (10^12) with Giga (10^9)."}]},{"cat":"02","type":"multi","stem":"Which frequency expressions correctly apply metric prefixes? Select the TWO correct frequency simplifications using standard SI prefixes.","options":[{"t":"8,000,000 Hz can be simplified as 8 MHz","c":true,"fb":"Correctly identifies that 8 * 10^6 Hz = 8 MHz."},{"t":"18,500,000,000 Hz can be simplified as 18.5 GHz","c":true,"fb":"Correctly identifies that 18.5 * 10^9 Hz = 18.5 GHz."},{"t":"3,000,000 Hz can be simplified as 30 kHz","c":false,"fb":"Uses an incorrect scale factor (10^5) instead of Mega (10^6)."},{"t":"450,000 Hz can be simplified as 4.5 MHz","c":false,"fb":"Scales by 10^5 instead of 10^6, misrepresenting the frequency by a factor of 10."},{"t":"12,000,000,000,000 Hz can be simplified as 12 GHz","c":false,"fb":"Confuses Tera (10^12) with Giga (10^9)."}]},{"cat":"02","type":"fitb","stem":"Electromagnetic waves propagate through free space at the speed of light (c), which equals exactly ____ m/s.","subtype":"value","answer":["300000000","3 x 10^8","3x10^8","3*10^8","300000000 m/s"],"caseSensitive":false,"hint":"Enter the full numeric value in meters per second without commas (e.g. 300000000 or 3 x 10^8).","fb":"The speed of light in free space is 300,000,000 m/s (3 * 10^8 m/s)."},{"cat":"02","type":"mcq","stem":"What is the mathematical relationship between the frequency (f) and wavelength (λ) of an electromagnetic wave?","options":[{"t":"λ = f / c","c":false,"fb":"Inverts the numerator and denominator in the wave equation."},{"t":"λ = c * f","c":false,"fb":"Multiplies speed of light by frequency instead of dividing."},{"t":"λ = c / f","c":true,"fb":"Correctly identifies that wavelength equals the speed of light divided by frequency."},{"t":"λ = (c + f) / 2","c":false,"fb":"Uses an arithmetic average instead of an inverse proportional ratio."}]},{"cat":"02","type":"fitb","stem":"A radio signal operates at a frequency of 3 MHz. Using the formula λ (m) = 300 / f (in MHz), the wavelength of this signal is ____ meters.","subtype":"value","answer":["100","100.0","100 m"],"caseSensitive":false,"hint":"Divide 300 by the frequency in MHz: λ = 300 / 3.","fb":"Dividing 300 by 3 MHz gives a wavelength of 100 meters."},{"cat":"02","type":"scenario","stem":"What is the physical wavelength (λ) of the radiated electromagnetic wave in free space?","context":"An RF broadcast engineer is tuning a VHF transmitter operating at a carrier frequency of 150 MHz.","options":[{"t":"0.5 meters","c":false,"fb":"Inverts the formula by dividing 150 MHz by 300 (f / 300)."},{"t":"2.0 meters","c":true,"fb":"Correctly applies λ = 300 / 150 MHz = 2.0 meters."},{"t":"45.0 meters","c":false,"fb":"Multiplies 300 by 150 and misplaces the decimal."},{"t":"20.0 meters","c":false,"fb":"Introduces a factor-of-ten scaling error during division."}]},{"cat":"02","type":"multi","stem":"Which statements correctly characterize wavelength and wave propagation? Select the TWO correct statements regarding wavelength and wave physical characteristics.","options":[{"t":"Wavelength is the distance occupied by one full cycle of a wave, measured between corresponding peaks of electric or magnetic fields","c":true,"fb":"Accurately reflects the physical definition of wavelength."},{"t":"As the frequency of an electromagnetic wave increases, its wavelength increases proportionally","c":false,"fb":"Assumes frequency and wavelength are directly proportional rather than inversely proportional."},{"t":"One meter is equivalent to 39.37 inches","c":true,"fb":"Accurately identifies the metric-to-imperial conversion factor specified in the text."},{"t":"Wavelength in electronic communication is represented by the Greek letter delta (Δ)","c":false,"fb":"Identifies delta instead of the Greek letter lambda (λ)."},{"t":"The wavelength of a signal propagating in free space is completely independent of the speed of light","c":false,"fb":"Ignores the fundamental governing role of the propagation velocity c."}]},{"cat":"02","type":"mcq","stem":"Which of the following is excluded from the definition of the electromagnetic spectrum?","options":[{"t":"Signals carried directly through physical cables","c":true,"fb":"Correctly identifies that signals confined to cables are excluded from the free-space EM spectrum definition."},{"t":"Invisible electromagnetic radiation such as infrared and ultraviolet light","c":false,"fb":"Incorrectly believes invisible light waves are excluded from the EM spectrum."},{"t":"High-frequency radar signals radiating into open space","c":false,"fb":"Believes radiated radar waves are excluded from the EM spectrum."},{"t":"Visible light frequencies illuminating the environment","c":false,"fb":"Believes visible light is excluded from the EM spectrum."}]},{"cat":"02","type":"mcq","stem":"Which frequency band and application pair correctly matches standard electromagnetic spectrum allocations?","options":[{"t":"Extremely Low Frequency (ELF): 30–300 GHz — Radar transmitters","c":false,"fb":"Confuses ELF (30–300 Hz) with EHF/SHF microwave bands."},{"t":"Very High Frequency (VHF): 30–300 MHz — FM radio and TV broadcasting","c":true,"fb":"Accurately pairs VHF (30–300 MHz) with FM radio and TV broadcasting."},{"t":"Ultra-High Frequency (UHF): 3–30 kHz — Submarine communications","c":false,"fb":"Confuses UHF (300 MHz–3 GHz) with VLF (3–30 kHz)."},{"t":"High Frequency (HF): 30–300 Hz — Alternating current power grids","c":false,"fb":"Confuses HF (3–300 MHz) with ELF (30–300 Hz)."}]},{"cat":"02","type":"multi","stem":"Which frequency band ranges and applications are accurately paired? Select the TWO correct spectrum band allocations.","options":[{"t":"Ultra-High Frequency (UHF) covers 300 MHz to 3 GHz and is used in walkie-talkies and two-way radios","c":true,"fb":"Accurately matches UHF parameters and applications."},{"t":"Super High Frequency (SHF) covers 3 to 30 GHz and is used for radar transmitters and wireless LANs","c":true,"fb":"Accurately matches SHF parameters and applications."},{"t":"Voice Frequency (VF) covers 30 to 300 kHz and is used for earthquake monitoring","c":false,"fb":"Confuses Voice Frequency (300–3000 Hz) with Low Frequency (30–300 kHz)."},{"t":"Medium Frequency (MF) covers 30 to 300 GHz and is used for GPS satellite navigation","c":false,"fb":"Confuses Medium Frequency (300 kHz–3 MHz) with Extremely High Frequency (30–300 GHz)."},{"t":"Very Low Frequency (VLF) covers 300 MHz to 3 GHz and is used for television broadcasting","c":false,"fb":"Confuses VLF (3–30 kHz) with UHF/VHF broadcast bands."}]},{"cat":"02","type":"fitb","stem":"The spectrum segment span
