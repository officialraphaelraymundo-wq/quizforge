MHz`","c":false,"fb":"`125 MHz` equals `0.125 GHz`, whereas `1G25` places the decimal point after `1` to give `1.25 GHz`."},{"t":"`1.25 GHz`","c":true,"fb":"Replacing uppercase `G` with a decimal point and `GHz` yields `1.25 GHz`."},{"t":"`12.5 GHz`","c":false,"fb":"`12.5 GHz` places the decimal after the second digit (`12G5`), not after `1`."},{"t":"`1.25 MHz`","c":false,"fb":"`G` denotes gigahertz (`GHz`), whereas megahertz (`MHz`) uses `M` (`1M25`)."}]},{"cat":"06","type":"mcq","stem":"Encode a `7.5 kHz` bandwidth into the 4-character ITU bandwidth designator.","sub":"itu-bandwidth-encode","options":[{"t":"`75K0`","c":false,"fb":"`75K0` places the decimal point after `75`, representing `75.0 kHz`."},{"t":"`7M50`","c":false,"fb":"`M` denotes megahertz (`MHz`), so `7M50` represents `7.50 MHz`."},{"t":"`7K50`","c":true,"fb":"Three significant digits (`7`, `5`, `0`) with uppercase `K` at the decimal point produce `7K50`."},{"t":"`75M0`","c":false,"fb":"`75M0` represents `75.0 MHz`, shifting both the decimal point and the unit prefix."}]},{"cat":"06","type":"mcq","stem":"Express a `650 Hz` signal bandwidth as a 4-character ITU bandwidth designator.","sub":"itu-bandwidth-encode","options":[{"t":"`650K`","c":false,"fb":"`K` denotes kilohertz (`kHz`), so `650K` represents `650 kHz`."},{"t":"`650H`","c":true,"fb":"Three digits (`650`) followed by uppercase `H` at the decimal point represent `650 Hz`."},{"t":"`65K0`","c":false,"fb":"`65K0` represents `65.0 kHz`, shifting both the decimal point and the unit prefix."},{"t":"`65H0`","c":false,"fb":"`65H0` places the decimal point before `0`, representing `65.0 Hz`."}]},{"cat":"06","type":"mcq","stem":"What transmission parameters are represented by the ITU emission designation `J3E`?","sub":"itu-emission-decode","options":[{"t":"SSB reduced carrier analog multi-channel telephony","c":false,"fb":"That description corresponds to `R8E` (`R` for reduced/variable carrier and `8` for two or more analog channels)."},{"t":"SSB reduced carrier analog single-channel data","c":false,"fb":"That description corresponds to `R3D` (`R` for reduced/variable carrier and `D` for data transmission)."},{"t":"SSB suppressed carrier analog multi-channel data","c":false,"fb":"That description corresponds to `J8D` (`8` for two or more analog channels and `D` for data transmission)."},{"t":"SSB suppressed carrier analog single-channel telephony","c":true,"fb":"`J` is single sideband suppressed carrier, `3` is analog single channel, and `E` is telephony."}]},{"cat":"06","type":"scenario","stem":"Which bandwidth and transmission parameters match this designation?","sub":"itu-emission-decode","context":"A two-way voice channel is labeled with the ITU emission designation `16K0 F3E`.","options":[{"t":"16 kHz FM analog single-channel telephony","c":true,"fb":"`16K0` is `16 kHz`, `F` is frequency modulation, `3` is analog single channel, and `E` is telephony."},{"t":"1.6 kHz PM analog single-channel telephony","c":false,"fb":"That parameter set corresponds to `1K60 G3E` (`1K60` for `1.6 kHz` and `G` for phase modulation)."},{"t":"1.6 kHz FM digital single-channel telephony","c":false,"fb":"That parameter set corresponds to `1K60 F1E` or `1K60 F2E` (`1K60` for `1.6 kHz` and `1`/`2` for digital single channel)."},{"t":"16 kHz PM digital single-channel telephony","c":false,"fb":"That parameter set corresponds to `16K0 G1E` or `16K0 G2E` (`G` for phase modulation and `1`/`2` for digital single channel)."}]},{"cat":"06","type":"scenario","stem":"Decode its bandwidth, modulation, modulating signal, and transmitted information.","sub":"itu-emission-decode","context":"A telemetry link operates with the ITU emission designation `500K K1D`.","options":[{"t":"500 kHz PWM modulated single-channel digital data","c":false,"fb":"That parameter set corresponds to `500K L2D` (`L` for PWM and `2` for modulated single-channel digital)."},{"t":"500 kHz PAM unmodulated single-channel digital data","c":true,"fb":"`500K` is `500 kHz`, `K` i er."},{"t":"`2K07 R3D`","c":false,"fb":"`2K07` represents `2.07 kHz` and `D` in Position 3 denotes data/telemetry."},{"t":"`2K70 J3D`","c":false,"fb":"`J` specifies single sideband with a suppressed carrier and `D` in Position 3 denotes data/telemetry."},{"t":"`2K70 R3E`","c":true,"fb":"`2K70` is `2.7 kHz`, `R` is SSB with reduced/variable carrier, `3` is analog single channel, and `E` is telephony."}]},{"cat":"06","type":"scenario","stem":"What is the corresponding ITU `BBBB 123` emission designation?","sub":"itu-emission-encode","context":"A `1.5 MHz` pulse position modulation (PPM) signal carries multi-channel digital machine telegraphy.","options":[{"t":"`1M50 M7B`","c":true,"fb":"`1M50` is `1.5 MHz`, `M` is PPM, `7` is two or more digital channels, and `B` is machine telegraphy."},{"t":"`1M50 L2B`","c":false,"fb":"`L` denotes pulse width modulation (PWM) and `2` denotes a single modulated digital channel."},{"t":"`1M50 L7A`","c":false,"fb":"`L` denotes pulse width modulation (PWM) and `A` denotes human telegraphy."},{"t":"`1M50 M2A`","c":false,"fb":"`2` denotes a single modulated digital channel and `A` denotes human telegraphy."}]},{"cat":"06","type":"scenario","stem":"Encode this transmission in ITU `BBBB 123` format.","sub":"itu-emission-encode","context":"A `200 Hz` transmission consists of an unmodulated carrier with no modulating signal and no transmitted information.","options":[{"t":"`20H0 P0N`","c":false,"fb":"`20H0` represents `20.0 Hz` and `P` denotes a series of pulses with no modulation."},{"t":"`20H0 N0A`","c":false,"fb":"`20H0` represents `20.0 Hz` and `A` in Position 3 denotes human telegraphy."},{"t":"`200H N0N`","c":true,"fb":"`200H` is `200 Hz`, `N` is an unmodulated carrier, `0` is no modulating signal, and `N` is no information."},{"t":"`200H P0A`","c":false,"fb":"`P` denotes a series of pulses with no modulation and `A` in Position 3 denotes human telegraphy."}]}]};

// Every question declares its own `cat` key in the pack. Anything
// with a missing/unknown key becomes 'other' (excluded from exam
// simulation, still reachable in normal practice mode).
BANK.forEach(q => {
  if (!q.cat || !CATEGORIES.some(c => c.key === q.cat)) q.cat = 'other';
});

// ── Sub-topic (variant) groups ──────────────────────────────────
// Questions that carry the same `sub` key inside the same category
// are VARIANTS OF ONE CONCEPT — three different ways of asking about
// the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

// How many questions exam mode WANTS in total (weights × multiplier).

  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);

  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = pool.filter(q => q.cat === c.key).length;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Java syntax highlighting for the code box.
// Tokenises the RAW source and escapes each token as it wraps it. Never run
// a highlighter over already-escaped HTML -- it tears &quot; and &lt; apart.
// Comments and strings come first in the alternation, so a keyword sitting
// inside a string or a comment is not coloured.
const JAVA_KEYWORDS = /^(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|record|sealed|permits|yield)$/;
const JAVA_TOKEN_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function highlightJava(src) {
  let out = '', last = 0, m;
  JAVA_TOKEN_RE.lastIndex = 0;
  while ((m = JAVA_TOKEN_RE.exec(src)) !== null) {
    if (m.index > last) out += escapeHtml(src.slice(last, m.index));
    const txt = m[0];
    let cls = null;
    if (m[1]) cls = 'tok-comment';
    else if (m[2]) cls = 'tok-string';
    else if (m[3]) cls = 'tok-annot';
    else if (m[4]) cls = 'tok-num';
    else if (m[5]) {
      if (JAVA_KEYWORDS.test(m[5])) cls = 'tok-kw';
      else if (/^[A-Z]/.test(m[5])) cls = 'tok-type';
    }
    out += cls ? `<span class="${cls}">${escapeHtml(txt)}</span>` : escapeHtml(txt);
    last = m.index + txt.length;
  }
  if (last < src.length) out += escapeHtml(src.slice(last));
  return out;
}

// Highlight only what we can actually parse. Anything not tagged java --
// pseudocode, plain text -- falls through to the plain escaped path.
function renderCodeBody(code, lang) {
  const src = String(code).replace(/^\r?\n+/, '').replace(/\r?\n\s*$/, '');
  return (lang && String(lang).toLowerCase() === 'java') ? highlightJava(src) : escapeHtml(src);
}

function formatInline(s) {
  if (!s) return '';
  const parts = String(s).split(/(`[^`]+`)/g);
  return parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  const blocks = [];
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const isDiagram = lang && ['text', 'diagram', 'ascii', 'tree'].includes(lang.toLowerCase());
    const badge = isDiagram ? 'DIAGRAM' : ((lang ? lang.toUpperCase() + ' ' : '') + 'CODE');
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    const placeholder = `___BLOCK_${blocks.length}___`;
    blocks.push(`<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(code, lang || 'java')}</code></pre></div>`);
    return placeholder;
  });

  // 2. Format inline code & escape remaining text
  const parts = text.split(/(`[^`]+`)/g);
  text = parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');

  // 3. Restore fenced code blocks
  blocks.forEach((block, i) => {
    text = text.replace(`___BLOCK_${i}___`, block);
  });

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'parsons') { return { type:q.type, stem:q.stem, lines:q.lines, origIdx:q.origIdx, cat:q.cat }; }
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

// Flags: a question flagged during a quiz leaves later quizzes on this browser.
// Packs have no question IDs, so a flag is keyed on a hash of the stem.
const FLAG_KEY = 'quizforge_flags_' + ((PACK.meta && (PACK.meta.packId || PACK.meta.subject)) || 'quiz');
let flags = {};
try {
  const saved = JSON.parse(localStorage.getItem(FLAG_KEY) || '{}');
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) flags = saved;

function flagId(q) {
  let h = 5381;
  for (let i = 0; i < q.stem.length; i++) h = (h * 33 + q.stem.charCodeAt(i)) >>> 0;
  return 'q' + h.toString(36);
}
function isFlagged(q) { return Object.prototype.hasOwnProperty.call(flags, flagId(q)); }

// Flags are stored as {id: stem}. To leave the browser a flag also needs to say
// where it sits, so the pack supplies the lesson (cat) and type by matching ids.
function flaggedList() {
  return Object.entries(flags).map(([id, stem]) => {
    const q = BANK.find(b => flagId(b) === id);
    return { stem: String(stem), cat: q && q.cat ? q.cat : '', type: q ? q.type : '' };
  });
}
function flaggedText() {
  const pack = (PACK.meta && (PACK.meta.packId || PACK.meta.subject)) || 'quiz';

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i })).filter(q => !isFlagged(q));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i })).filter(q => !isFlagged(q));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

}

function pSeq(q){ return q.lines.filter(function(l){return !l.distractor;}).map(function(l){return String(l.code).trim();}); }
function pEnsure(i){
  state.pBank = state.pBank || {}; state.pInit = state.pInit || {};
  if(!state.pInit[i]){
    var ids = state.questions[i].lines.map(function(_,k){return k;});
    for(var a=ids.length-1;a>0;a--){var b=Math.random()*(a+1)|0;var t=ids[a];ids[a]=ids[b];ids[b]=t;}

}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'parsons') { return pScore(q, selectedIdxs); }
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

    if (state.focusedCats.includes(cat.key)) chip.classList.add('on');
    chip.innerHTML = `
      <div class="topic-chip-check"></div>
      <div class="topic-chip-label">${cat.label}</div>
      <div class="topic-chip-count">${CAT_COUNTS[cat.key]}</div>
    `;
    chip.addEventListener('click', () => {
      const i = state.focusedCats.indexOf(cat.key);
      if (i >= 0) state.focusedCats.splice(i, 1);
      else state.focusedCats.push(cat.key);
      chip.classList.toggle('on');
      updateSetupSummary();
    });
    grid.appendChild(chip);
  });
}

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'At the end, when you finish';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'No questions available' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `${available} questions available across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'At the end, when you finish';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Right after you press Check';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? availableQuestions().filter(q => state.focusedCats.includes(q.cat)) : availableQuestions();
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'No questions available';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}
updateSetupSummary();

  state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });
  { const cur = jumper.querySelector('.current'); if (cur) jumper.scrollLeft = cur.offsetLeft - jumper.clientWidth / 2 + cur.offsetWidth / 2; }

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (q.type === 'parsons') { tagLabel = 'Arrange the code'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in"><span class="folio" aria-hidden="true">— ' + (state.current + 1) + ' —</span>';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  html += `<span class="qnum-inline">${state.current + 1} of ${state.questions.length}</span>`;
  html += `<div class="qstem">${formatContent(q.stem)}</div>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${formatContent(q.context)}</div></div>`;
  }
  if (q.code) {
    const isDiagram = q.codeLang && ['text', 'diagram', 'ascii', 'tree'].includes(q.codeLang.toLowerCase());
    const badge = q.codeEyebrow || (isDiagram ? 'DIAGRAM' : (q.codeLang ? q.codeLang.toUpperCase() + ' CODE' : 'CODE SNIPPET'));
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    html += `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(q.code, q.codeLang)}</code></pre></div>`;
  }

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${formatInline(q.hint)}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${formatInline(q.fb)}</div>`;
    }
    html += `</div>`;
  } else if (q.type === 'parsons') {
    html += parsonsHTML(q, state.current, isChecked, r);
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          if (isMulti) {
            cls += ' is-missed';
            marker = '\u25CB';
            tagsHtml = '<span class="opt-tag miss">Missed choice</span>';
            showFeedback = true;
          } else {
            cls += ' is-correct';
            marker = '\u2713';
            tagsHtml = '<span class="opt-tag ans">Correct answer</span>';
            showFeedback = true;
          }
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${formatInline(opt.t)}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${formatInline((opt.fb || '').replace(/^\s*\[outside\]\s*/, ''))}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;
  syncFlagBtn();

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (q.type === 'parsons') {
    if (!isChecked) wireParsons(state.current);
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('End this quiz and go back to setup? Your answers will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.querySelectorAll('a[href="../index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const quiz = $('view-quiz');
    if (quiz && !quiz.classList.contains('hidden')) {
      if (!confirm('Leave this quiz and return to the Reviewer Hub? Your current progress will be lost.')) {
        e.preventDefault();
      } else {
        stopTimer();
      }
    }
  });
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Library date stamp; a due slip suggests a re-read when the score is under 90%.
  const fmtDay = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
  const today = new Date();
  const due = new Date(today.getTime() + 3 * 24 * 60 * 60 * 1000);
  const dueSlip = pct < 90
    ? `<div class="due-slip"><span>Date due</span><b>${fmtDay(due).replace(/ \d{4}$/, '')}</b></div>`
    : '';
  const stampHtml = `<div class="stamp-row"><div class="date-stamp" aria-label="Well read, ${fmtDay(today)}"><span>Well read</span><b aria-hidden="true">&#9824;</b><span>${fmtDay(today)}</span></div>${dueSlip}</div>`;

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  // Flags live in this browser only; this row is how they leave it at the end.
  const flagCount = Object.keys(flags).length;
  const flagHtml = flagCount
    ? `<div class="crumb" id="resultsFlagNote" style="margin: 12px 0;"><span>${flagCount} ${flagCount === 1 ? 'question' : 'questions'} flagged</span> <button class="btn quiet" id="resultsFlagCopy">Copy list</button></div>`
    : '';

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 1.5rem; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
        ${stampHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    ${flagHtml}

    <div class="btn-row">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="../index.html" class="btn ghost">← Back to Index</a>
        <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
        <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      </div>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  const resultsFlagCopy = $('resultsFlagCopy');
  if (resultsFlagCopy) resultsFlagCopy.addEventListener('click', () => copyFlagged(resultsFlagCopy));

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        flagged: flaggedList(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    const questions = buildActiveQuiz();
    if (questions.length === 0) {
      view.classList.add('hidden');
      $('view-setup').classList.remove('hidden');
      updateSetupSummary();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    state.questions = questions;
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
<script>
(function(){var b=document.querySelector('.theme-preview');if(!b)return;var root=document.documentElement;
try{var saved=localStorage.getItem('qf-theme');if(saved==='light'||saved==='dark')root.dataset.theme=saved}catch(e){}
function cur(){var t=root.dataset.theme;if(t)return t;return matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
function label(){var next=cur()==='light'?'dark':'light';b.textContent=next==='light'?'Light mode':'Dark mode';b.setAttribute('aria-label','Switch to '+next+' mode')}
b.onclick=function(){var next=cur()==='light'?'dark':'light';root.dataset.theme=next;try{localStorage.setItem('qf-theme',next)}catch(e){}label()};label();})();
</script>
</body>
</html>
