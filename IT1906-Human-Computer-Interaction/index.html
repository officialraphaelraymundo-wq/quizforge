"The universal usability interface","c":false,"fb":"Misconception M2-natural-equals-passive: Pokémon GO is cited under natural interaction, not universal usability."},{"t":"The reversible error-free interface","c":false,"fb":"Misconception M3-game-exclusive: Pokémon GO illustrates natural daily interaction rather than error reversal mechanisms."},{"t":"The consistent cross-system interface","c":false,"fb":"Misconception M1-arbitrary-symbolic-preference: Pokémon GO is cited as an example of natural interaction, not cross-system consistency."}]},{"cat":"02","type":"mcq","stem":"How do HCI guidelines differ from HCI principles?","options":[{"t":"Guidelines are broader and more general than principles.","c":false,"fb":"Role reversal: breadth and generality describe the other half of the pair, not the specific advisory sets."},{"t":"Principles and guidelines are two names for the same kind of advice.","c":false,"fb":"They are distinct levels of advice, one general and one specific; they are not synonyms."},{"t":"Guidelines are specific advisory sets on how something should be done or what it should be.","c":true,"fb":"Correct: guidelines turn the broad principles into concrete, specific advice."},{"t":"Guidelines state high-level goals, while principles give concrete steps.","c":false,"fb":"Same reversal as choice a: concreteness belongs to the advisories, not to the high-level statements."}]},{"cat":"02","type":"fitb","stem":"A team documents the advisory \"show data-entry errors right next to the field.\" Written as a specific how-to statement, this is an HCI ____ rather than a principle.","subtype":"term","answer":["guideline","guidelines"],"caseSensitive":false,"fb":"Specific how-to advisories are guidelines; principles are the broad statements they concretize."},{"cat":"02","type":"mcq","stem":"Why are HCI guidelines often hard to put into practice, even though they are easy to understand?","options":[{"t":"They cover numerous aspects and can conflict with each other, requiring prioritization.","c":true,"fb":"Correct: the difficulty lies in the number of aspects and in resolving conflicting guidelines."},{"t":"They are formulated for theoretical research rather than practical implementation.","c":false,"fb":"The stated difficulty is about volume and conflicts, not about the intended audience."},{"t":"They apply strictly to graphical systems and cannot adapt to other interfaces.","c":false,"fb":"Guidelines are not restricted to graphical systems; the issue is resolving competing advisories."},{"t":"They are written too vaguely to provide actionable technical details to designers.","c":false,"fb":"If anything there are too many; the problem is prioritizing among them, not a lack of detail."}]},{"cat":"02","type":"multi","stem":"Which statements describe the classification of HCI guidelines? Select the TWO correct statements.","options":[{"t":"It is recommended information that directs HCI design and development.","c":true,"fb":"Correct: that is exactly what a guidelines classification is."},{"t":"It gives step-by-step instructions for incorporating each guideline.","c":false,"fb":"Classifications direct design and development, but lack specific incorporation instructions."},{"t":"It is limited to mobile application design.","c":false,"fb":"Classification covers HCI design across settings, not just mobile."},{"t":"It maps guidelines to the higher-level principles behind them.","c":false,"fb":"Guidelines in general can be understood through higher-level principles, but classification itself does not map them."},{"t":"It replaces the need to understand HCI principles.","c":false,"fb":"It points to higher-level principles rather than replacing them."},{"t":"It divides the guidelines into criteria and category.","c":true,"fb":"Correct: HCI guidelines can be divided into criteria and category."}]},{"cat":"02","type":"mcq","stem":"In the context of HCI guidelines, what did Jennifer Tidwell compile?","options":[{"t":"A list of government regulations for web accessibility","c":false,"fb":"Accessibility guidance comes from W3C's WCAG, not from Tidwell's compilation."},{"t":"The first set of rules for command-line interfaces","c":false,"fb":"Her compilation concerns interface design patterns, not command-line conventions."},{"t":"A testing procedure for measuring user satisfaction","c":false,"fb":"Measuring satisfaction is evaluation work, not a patterns compilation."},{"t":"A collection of user interface design patterns used as guidelines","c":true,"fb":"Correct: Tidwell's compilation of UI design patterns serves as a set of guidelines."}]},{"cat":"02","type":"multi","stem":"Which of the following are recognized criteria used to classify HCI guidelines? Select the THREE correct statements.","options":[{"t":"General HCI Design","c":true,"fb":"Correct: one of the recognized criteria used to classify HCI guidelines."},{"t":"Network Configuration","c":false,"fb":"Plausible technical term, but not a recognized classification criterion for HCI guidelines."},{"t":"Interface Style/Modality","c":true,"fb":"Correct: one of the recognized criteria used to classify HCI guidelines."},{"t":"Payment Method","c":false,"fb":"Plausible for e-commerce, but not a recognized classification criterion for HCI guidelines."},{"t":"Color Psychology","c":false,"fb":"Relevant to visual design, but not a recognized classification criterion for HCI guidelines."},{"t":"Task/Operational Context","c":true,"fb":"Correct: one of the recognized criteria used to classify HCI guidelines."}]},{"cat":"02","type":"scenario","stem":"Under which HCI guideline criterion does this design guideline fall?","context":"A team is building a ticketing kiosk for a train station and decides that all text and buttons must be usable by visually challenged passengers.","options":[{"t":"Task/Operational Context","c":false,"fb":"That criterion covers the conditions the task is performed under, such as noise or lighting; this guideline is about who the users are."},{"t":"User Type","c":true,"fb":"Correct: the guideline is driven by who the users are — their vision — which is exactly this criterion."},{"t":"Interface Style/Modality","c":false,"fb":"The choice of input or output style is not what drives this guideline; the passengers' abilities are."},{"t":"Platform/System Setup","c":false,"fb":"The kiosk is the setting, but the guideline is classified by whose needs drive it, not by the machine it runs on."}]},{"cat":"02","type":"mcq","stem":"A team is organizing design constraints by HCI guideline criteria. Which constraint belongs under Task/Operational Context?","options":[{"t":"The application must accommodate elderly users with reduced vision","c":false,"fb":"That describes user characteristics, which belongs under the User Type criterion."},{"t":"The application must provide speech synthesis and spoken feedback","c":false,"fb":"Interaction style falls under the Interface Style/Modality criterion."},{"t":"The application must run efficiently on low-powered barcode scanners","c":false,"fb":"Hardware specifications belong under the Platform/System Setup criterion."},{"t":"The application must remain legible and clear under noisy factory conditions","c":true,"fb":"Correct: environmental noise and lighting belong under Task/Operational Context."}]},{"cat":"02","type":"scenario","stem":"Guidelines for designing for this device fall under which HCI guideline criterion?","context":"A portable MP3 player has a small screen, limited buttons, and a slow processor compared with desktop hardware.","options":[{"t":"Platform/System Setup","c":true,"fb":"Correct: the device's hardware limits are what the design must work within."},{"t":"Interface Style/Modality","c":false,"fb":"The screen and buttons describe the device, not a choice of interaction style such as voice or touch."},{"t":"Task/Operational Context","c":false,"fb":"The constraint is the hardware itself, not the surroundings or conditions of the task."},{"t":"User Type","c":false,"fb":"No user group is named; the limits come from the device."}]},{"cat":"02","type":"mcq","stem":"A team designing a car dashboard assistant categorizes its design decisions by HCI guideline criteria. Which decision belongs under Interface Style/Modality?","options":[{"t":"The driver's age range","c":false,"fb":"Who the users are belongs under User Type, not under a style of interaction."},{"t":"The dashboard's screen dimensions","c":false,"fb":"Screen size is a device limit, which is a Platform/System Setup matter."},{"t":"Voice commands versus touch input","c":true,"fb":"Correct: choosing between voice and touch is a choice of interaction style/modality."},{"t":"The brand of the dashboard system","c":false,"fb":"The maker of the system is a Vendor/Organization matter, not a style of interaction."}]},{"cat":"02","type":"multi","stem":"Which of the following are web page layout guidelines from the U.S. HHS list? Select the THREE correct statements.","options":[{"t":"Use animation to draw attention to every menu","c":false,"fb":"Drawing attention with animation is not among the HHS layout guidelines."},{"t":"Avoid cluttered displays","c":true,"fb":"Correct: one of the HHS layout guidelines."},{"t":"Limit each page to a single fixed screen size","c":false,"fb":"The guidelines address page and line lengths, not a fixed one-screen limit."},{"t":"Align items on a page","c":true,"fb":"Correct: one of the HHS layout guidelines."},{"t":"Place important items at top center","c":true,"fb":"Correct: one of the HHS layout guidelines."},{"t":"Use red text for error messages","c":false,"fb":"Color-coding errors is not part of the HHS layout list."}]},{"cat":"02","type":"scenario","stem":"Which HHS web layout guideline does this violate?","context":"A news site's designer places the main navigation bar and the day's top story at the bottom-right corner of the home page, leaving the top of the page to a decorative banner.","options":[{"t":"Set appropriate page lengths","c":false,"fb":"Page length concerns how long the page runs, not where its key elements sit."},{"t":"Optimize display density","c":false,"fb":"Density concerns how much content fills the space, not its position."},{"t":"Place important items at top center","c":true,"fb":"Correct: the navigation and top story are important items, and they belong at top center."},{"t":"Choose appropriate line lengths","c":false,"fb":"Line length concerns text lines, not element placement."}]},{"cat":"02","type":"mcq","stem":"According to the HHS layout guidelines, when should frames be used?","options":[{"t":"Whenever the page needs more advertising space","c":false,"fb":"Frames are not a space-filling device in the guidelines."},{"t":"When functions must remain accessible as the user moves through the page","c":true,"fb":"Correct: that is the stated condition for using frames."},{"t":"When the design needs to look more modern","c":false,"fb":"Appearance is not the stated reason for frames."},{"t":"When the page must load faster on slow connections","c":false,"fb":"Load speed is not the rationale given for frames."}]},{"cat":"02","type":"fitb","stem":"An interface that interacts with electronic devices through buttons, text boxes, menus, forms, icons, and visual indicators is known as a ____.","subtype":"term","answer":["GUI","graphical user interface","Graphical User Interface (GUI)"],"caseSensitive":false,"fb":"GUI stands for graphical user interface — an interface built on visual elements like buttons, menus, forms, and icons."},{"cat":"02","type":"mcq","stem":"In highly interactive systems, GUI input designs for raw information and commands are crafted mainly to improve what?","options":[{"t":"The visual appeal of the interface","c":false,"fb":"Attractiveness is not the stated goal of input design here."},{"t":"The storage space the data requires","c":false,"fb":"Input design does not change how much space the data needs."},{"t":"The number of features the system offers","c":false,"fb":"Input design shapes how data is entered, not how many features exist."},{"t":"The time and accuracy of data entry","c":true,"fb":"Correct: better input design makes entering information and commands faster and more accurate."}]},{"cat":"02","type":"multi","stem":"Which of the following are among the eight data entry guidelines? Select the THREE correct statements.","options":[{"t":"Minimal input action","c":true,"fb":"Correct: one of the eight data entry guidelines."},{"t":"Compress all fields onto one screen","c":false,"fb":"Field compression is not one of the eight; form and dialog box design is, but not as a one-screen rule."},{"t":"Consistency of data-entry actions","c":true,"fb":"Correct: one of the eight data entry guidelines."},{"t":"Encrypt every entered value","c":false,"fb":"Security handling is not among the eight data entry guidelines."},{"t":"Do not place semantically opposing entry or selection options close together","c":true,"fb":"Correct: one of the eight data entry guidelines."},{"t":"Require biometric confirmation for each input","c":false,"fb":"Biometric confirmation is not among the eight data entry guidelines."}]},{"cat":"02","type":"mcq","stem":"What does the data entry guideline \"consistency of data-entry actions\" call for?","options":[{"t":"Reducing the total number of input fields across every user form","c":false,"fb":"That is a concern of minimal input action, not of consistency."},{"t":"Performing the same kind of action the same way across the system","c":true,"fb":"Correct: the same entry or command action should work the same way everywhere in the system."},{"t":"Matching visual styling and color themes across all application windows","c":false,"fb":"Visual styling alone is not what consistency of actions requires."},{"t":"Following external platform conventions without coordinating internal screens","c":false,"fb":"Outside conventions are not enough; the system's own actions must agree with each other."}]},{"cat":"02","type":"scenario","stem":"Which data entry guideline does this design violate?","context":"In a delivery-tracking mobile app, marking a package as delivered is done with a swipe in the depot module, with a long-press in the driver module, and with a button in the warehouse module.","options":[{"t":"Consistency of data-entry actions","c":true,"fb":"Correct: one action is done three different ways, so the same task does not work the same way across modules."},{"t":"Minimal input action","c":false,"fb":"Each method takes a single action; the problem is that they differ, not that any takes too many steps."},{"t":"Compatibility of data entry with data display","c":false,"fb":"Nothing here concerns matching displayed data; the modules simply disagree on how the same action is performed."},{"t":"None, if each module follows the platform's standard gestures","c":false,"fb":"Outside conventions are not enough; the system's own actions must also agree with each other."}]},{"cat":"02","type":"mcq","stem":"A web app's date fields work differently on its signup page and its billing page. Which change best satisfies the consistency guideline for data entry?","options":[{"t":"Redesign both pages with the same color scheme","c":false,"fb":"Matching colors addresses styling, not how the data-entry actions work."},{"t":"Add help text explaining that the two pages differ","c":false,"fb":"Explaining an inconsistency does not remove it."},{"t":"Keep the difference but shorten the billing page","c":false,"fb":"Shortening a page does not make the entry actions agree."},{"t":"Make both pages accept dates with the same picker and format","c":true,"fb":"Correct: the same entry action now works the same way on both pages."}]},{"cat":"02","type":"scenario","stem":"Which data entry guideline does this form violate?","context":"An event-registration form makes users type the full name of their province from a long list, even though the same choices could be offered as a selectable list.","options":[{"t":"Design of forms and dialog boxes","c":false,"fb":"The issue is not how the form is laid out but how much typing each entry demands."},{"t":"Clear and effective labeling","c":false,"fb":"The fields could be perfectly labeled and the problem would remain."},{"t":"Minimal input action","c":true,"fb":"Correct: selecting from a list takes far fewer input actions than typing full names."},{"t":"Consistency of data-entry actions","c":false,"fb":"Other forms could match this one exactly and the typing burden would still be there."}]},{"cat":"02","type":"mcq","stem":"What does the data entry guideline \"minimal memory load\" require?","options":[{"t":"The system should not force users to remember information from one step to the next","c":true,"fb":"Correct: users should not have to carry information in their heads between fields, screens, or steps."},{"t":"The system should keep the total number of fields as low as possible","c":false,"fb":"Field count is a matter of input action and form design; memory load is about what users must keep in mind."},{"t":"The system should display entered data in the same format it was entered","c":false,"fb":"Entry and display matching is its own separate guideline; memory load concerns remembering, not formatting."},{"t":"Users should type as little as possible when entering data","c":false,"fb":"That is about input effort, not about what users must hold in memory between steps."}]},{"cat":"02","type":"scenario","stem":"Which data entry guideline does this checkout violate?","context":"An online checkout asks users to look up and memorize a four-digit store code from their membership email, then type it three screens later with no way to view it in between.","options":[{"t":"Minimal input action","c":false,"fb":"The typing itself is brief; the burden is having to hold the code in memory across screens."},{"t":"Clear and effective labeling","c":false,"fb":"Labels present information; they do not supply a value the user must recall from earlier."},{"t":"Consistency of data-entry actions","c":false,"fb":"The checkout could be perfectly consistent and still force the memorization."},{"t":"Minimal memory load","c":true,"fb":"Correct: users must carry information across steps instead of having it provided when needed."}]},{"cat":"02","type":"mcq","stem":"A banking app asks users to enter a payee's account details. Which change best satisfies the minimal memory load guideline?","options":[{"t":"Enlarging the input field so users can enter account numbers with arbitrary spacing","c":false,"fb":"A longer field changes typing format, not remembering."},{"t":"Providing a list of saved payees so users do not have to recall account numbers","c":true,"fb":"Correct: the app supplies the details, so nothing must be held in memory or read from elsewhere."},{"t":"Repositioning the account number field to the upper left corner of the entry screen","c":false,"fb":"Position affects visual scanning, not memory demands."},{"t":"Requiring users to re-enter their credentials on a separate confirmation screen","c":false,"fb":"Repeating the entry does not remove the need to recall the details in the first place."}]},{"cat":"02","type":"scenario","stem":"Which data entry guideline does this design violate?","context":"In a warehouse's desktop system, clerks enter received stock as a number of boxes, while the inventory panel beside the entry form shows every count in individual units.","options":[{"t":"Minimal input action","c":false,"fb":"The number of entry steps is unchanged; the trouble is that the entered values and the displayed values are in different units."},{"t":"Clear and effective labeling","c":false,"fb":"Both sides could be clearly labeled and the entered boxes would still not match the displayed units."},{"t":"Compatibility of data entry with data display","c":true,"fb":"Correct: staff enter one unit of measure while the display reports another, so what is entered and what is shown do not agree."},{"t":"Do not place semantically opposing options close together","c":false,"fb":"No opposing entry or selection options are involved here."}]},{"cat":"02","type":"mcq","stem":"A records office is reviewing its system. Which setup satisfies the guideline on compatibility of data entry with data display?","options":[{"t":"Staff enter dates as MM/DD/YYYY, while the output reports display them as DD-MM-YYYY","c":false,"fb":"This treats entry and display as independent, but the formats disagree with each other."},{"t":"Staff enter dates as MM/DD/YYYY, and the output reports display them in that same format","c":true,"fb":"Correct: what is displayed agrees with how the data was entered."},{"t":"Staff must re-enter patient addresses that are already visible on the header panel","c":false,"fb":"Entry demanding what the display already shows is the opposite of the two agreeing."},{"t":"Staff type detailed patient notes, but the display omits them and shows only a checkmark","c":false,"fb":"The display discards what was entered instead of showing it, so the two stay out of step."}]},{"cat":"02","type":"scenario","stem":"Which data entry guideline does this design violate?","context":"A web form ends with two adjacent buttons of identical size and color: \"Submit Order\" and \"Clear All Fields.\" Users trying to confirm their order sometimes wipe the form instead.","options":[{"t":"Match and place the sequence of fields in natural scanning directions","c":false,"fb":"Scanning direction concerns the order of fields and options, not the pairing of opposites."},{"t":"Do not place semantically opposing entry or selection options close together","c":true,"fb":"Correct: confirming and erasing are opposing actions, and placing them side by side with identical styling invites the wrong click."},{"t":"Maintain compatibility of data entry with data display representations","c":false,"fb":"Nothing here concerns mismatch between entered and displayed data."},{"t":"Ensure clear and effective labeling of buttons and data-entry fields","c":false,"fb":"The button labels may be clear; the danger comes from placing opposites side by side."}]},{"cat":"02","type":"mcq","stem":"A form's fields are read left to right and top to bottom. Which design follows the guideline on matching the sequence to scanning and hand-movement directions?","options":[{"t":"Placing the primary submit action directly above the initial entry fields","c":false,"fb":"A submit button at the top fights the top-to-bottom path the guideline describes."},{"t":"Arranging input fields in reverse order from the bottom of the page upward","c":false,"fb":"That reverses the reading direction rather than following it."},{"t":"Scattering logically connected input fields across opposite screen corners","c":false,"fb":"Scattering related fields forces the eye to jump around instead of moving naturally."},{"t":"Arranging input fields in natural reading order ending with the action button","c":true,"fb":"Correct: the field order follows the natural scan and ends where the hand expects to act."}]},{"cat":"02","type":"fitb","stem":"The web accessibility guidelines WCAG are published by the ____.","subtype":"organization","answer":["W3C","World Wide Web Consortium","World Wide Web Consortium (W3C)"],"caseSensitive":false,"fb":"The W3C (World Wide Web Consortium) publishes WCAG; version 2.1 was released in 2018."},{"cat":"02","type":"scenario","stem":"For students who are deaf, which WCAG 2.1 principle does this violate?","context":"A lecture site posts weekly audio recordings with no transcripts and no captions.","options":[{"t":"Understandable","c":false,"fb":"The recordings can be clear and well organized; the barrier is that the students cannot access the audio content at all."},{"t":"Perceivable","c":true,"fb":"Correct: deaf students cannot perceive audio-only content, which is what this principle requires."},{"t":"Robust","c":false,"fb":"The issue is not how the audio is parsed by assistive technology but that its information exists in one sensory form only."},{"t":"Operable","c":false,"fb":"Playback controls may work fine; the content itself cannot be perceived."}]},{"cat":"02","type":"mcq","stem":"A banking site must fix its transfer error message, which currently gives no help at all. Which addition best satisfies the Understandable principle?","options":[{"t":"Displaying the notification text in an enlarged, high-contrast font","c":false,"fb":"Bigger text addresses perceiving the message, not understanding the failure — those are different principles."},{"t":"Adding programmatic tags for compatibility with screen-reading tools","c":false,"fb":"Assistive-technology compatibility is the Robust principle's concern."},{"t":"Providing a clear explanation of what failed and how to resolve it","c":true,"fb":"Correct: Understandable means content and error feedback help users comprehend and correct problems."},{"t":"Replacing the existing numeric code with a shorter technical identifier","c":false,"fb":"A shorter code is still a code; it does not explain the failure or the fix."}]},{"cat":"02","type":"scenario","stem":"Which WCAG 2.1 principle does this site violate?","context":"On a shopping site, every menu and button can be reached with a mouse, but the Tab key skips past the checkout buttons, so keyboard users cannot place an order.","options":[{"t":"Operable","c":true,"fb":"Correct: all functionality must be operable, including by keyboard."},{"t":"Understandable","c":false,"fb":"The labels and instructions are clear; acting on them is what fails."},{"t":"Perceivable","c":false,"fb":"The buttons are visible; they simply cannot be reached by keyboard."},{"t":"Robust","c":false,"fb":"The failure is in reaching the controls, not in how assistive technology reads them."}]},{"cat":"02","type":"scenario","stem":"Which WCAG 2.1 principle does this component violate?","context":"A course website uses a custom-built dropdown that renders as an unnamed graphic, so screen readers announce only \"image\" and cannot convey the choices inside.","options":[{"t":"Operable","c":false,"fb":"A user who can see the list can act on it; the failure is that assistive technology cannot interpret the component."},{"t":"Understandable","c":false,"fb":"The choices may be plainly worded once seen; the problem is that assistive technology cannot make sense of the component at all."},{"t":"Perceivable","c":false,"fb":"Sighted users perceive the dropdown fine; the barrier is specific to how the component is built for assistive technology."},{"t":"Robust","c":true,"fb":"Correct: content must be robust enough to be reliably interpreted by assistive technologies such as screen readers."}]},{"cat":"02","type":"multi","stem":"Which of the following are among Jennifer Tidwell's five mobile design guidelines? Select the FOUR correct statements.","options":[{"t":"Fast status information","c":true,"fb":"Correct: one of the five mobile guidelines."},{"t":"Intense task focus","c":true,"fb":"Correct: one of the five mobile guidelines."},{"t":"Large hit targets","c":true,"fb":"Correct: one of the five mobile guidelines."},{"t":"Desktop parity for every feature","c":false,"fb":"Carrying every desktop feature over contradicts the mobile guidelines' push for focus and economy."},{"t":"Minimize typing and control on mixed input","c":true,"fb":"Correct: one of the five mobile guidelines."},{"t":"Rotate the interface for every screen","c":false,"fb":"Rotating screens is not one of the five mobile guidelines."}]},{"cat":"02","type":"scenario","stem":"Which mobile design guideline does this app violate?","context":"A transit app packs its ticket, schedule, and account buttons into a tight row of 5-pixel targets at the bottom of the screen; riders complain they keep hitting the wrong button.","options":[{"t":"Efficient use of screen space","c":false,"fb":"Squeezing the buttons together saves space, but the complaints are about missing them, not about wasted space."},{"t":"Fast status information","c":false,"fb":"Nothing in the complaint concerns how quickly status is shown."},{"t":"Large hit targets","c":true,"fb":"Correct: touch targets this small cause exactly the mistaps the target-size rule exists to prevent."},{"t":"Minimize typing and control on mixed input","c":false,"fb":"No typing is involved; the trouble is the size of the touch targets."}]},{"cat":"02","type":"scenario","stem":"Which mobile design guideline does this app most directly violate?","context":"A bank ports its desktop dashboard to its phone app unchanged: six columns of charts, a ticker, and fourteen menus all appear on the small screen at once.","options":[{"t":"Large hit targets","c":false,"fb":"Target size is not the issue raised by a crowded, unfocused screen."},{"t":"Intense task focus","c":true,"fb":"Correct: the phone app must concentrate on the task at hand rather than mirror the desktop's everything-at-once layout."},{"t":"Fast status information","c":false,"fb":"The complaint concerns focus and overload, not the speed of status updates."},{"t":"Minimize typing and control on mixed input","c":false,"fb":"Typing and mixed controls are not what the six-column dashboard illustrates."}]},{"cat":"03","type":"mcq","stem":"A user looks at a screen and the retina absorbs the light patterns coming from it. Which part of the human problem-solving model is this?","options":[{"t":"Perception","c":false,"fb":"no meaning has been extracted yet; light is only being sensed (M1)"},{"t":"Memory","c":false,"fb":"nothing is being stored; the eye is only receiving stimulus (M2)"},{"t":"Sensation","c":true,"fb":"sensing external information through a sensory modality is sensation"},{"t":"Decision/Executor","c":false,"fb":"no plan is being formed or acted on here (M3)"}]},{"cat":"03","type":"mcq","stem":"In the human problem-solving model, which part interprets external information and extracts its basic meanings?","options":[{"t":"Sensation","c":false,"fb":"sensation only receives the information; it does not interpret it (M4)"},{"t":"Perception","c":true,"fb":"perception is defined as interpreting and extracting basic meanings"},{"t":"Decision/Executor","c":false,"fb":"that part formulates a plan and commands action, not interpretation (M3)"},{"t":"Memory","c":false,"fb":"memory stores information; it does not extract meaning from it (M2)"}]},{"cat":"03","type":"scenario","stem":"Which part of the human problem-solving model does retrieving the saved path illustrate?","context":"A student opens a file dialog and retrieves a saved folder path from recollection before navigating to it.","options":[{"t":"Memory","c":true,"fb":"recalling stored procedures, rules, relations, and schemas is memory at work"},{"t":"Perception","c":false,"fb":"nothing external is being interpreted here; stored information is being recalled (M2)"},{"t":"Sensation","c":false,"fb":"no new external stimulus is being sensed in this step (M1)"},{"t":"Decision/Executor","c":false,"fb":"the retrieval itself is not yet formulating or executing a plan (M3)"}]},{"cat":"03","type":"scenario","stem":"Which part of the human problem-solving model is acting when the finger taps the button?","context":"After reviewing the information in memory, a rider commits to a route and commands their finger to tap \"Confirm booking\" on a ride app.","options":[{"t":"Perception","c":false,"fb":"no interpretation of new information is occurring at this point (M2)"},{"t":"Sensation","c":false,"fb":"the tap is output action, not sensing of external input (M1)"},{"t":"Memory","c":false,"fb":"the plan is already retrieved; memory is not commanding the motor system (M3)"},{"t":"Decision/Executor","c":true,"fb":"deciding based on memory and commanding the motor system to act is the Decision/Executor"}]},{"cat":"03","type":"scenario","stem":"Which gulf does this flaw create?","context":"A user wants to recover a deleted draft in a mobile note app, but the app provides no undo command, no trash folder, and no supported way at all to perform a recovery.","options":[{"t":"Gulf of Evaluation","c":false,"fb":"nothing is being displayed misinterprevably here; the action itself is unsupported (M2)"},{"t":"Both gulfs equally","c":false,"fb":"the described fault is specifically about unsupported intentions"},{"t":"Gulf of Execution","c":true,"fb":"her intention cannot be carried out because the system does not allow or support it"},{"t":"Neither gulf","c":false,"fb":"a mismatch between intention and system support is precisely one of the gulfs (M1)"}]},{"cat":"03","type":"scenario","stem":"Which gulf does this flaw create?","context":"A user clicks \"Save\" in a web editor. The icon flickers for a moment but no message, status change, or confirmation appears, so the user cannot tell whether the save succeeded.","options":[{"t":"Gulf of Execution","c":false,"fb":"the user managed to act; the trouble is interpreting the system's state afterward (M2)"},{"t":"Gulf of Evaluation","c":true,"fb":"the system gives no representation the user can perceive and interpret against her expectation that saving confirms itself"},{"t":"Neither gulf","c":false,"fb":"missing interpretable feedback is a textbook evaluation gap"},{"t":"A memory overload","c":false,"fb":"nothing here involves the user's memory load (M1)"}]},{"cat":"03","type":"fitb","stem":"The model by Card, Moran, and Newell that predicts skilled user behavior is the ____ model.","subtype":"model","answer":["GOMS"],"caseSensitive":false,"fb":"GOMS (Goals, Operators, Methods, Selection rules) is a human information processing model predicting skilled user behavior."},{"cat":"03","type":"mcq","stem":"In GOMS, what does the term \"Goal\" refer to?","options":[{"t":"A personal rule for picking between procedures","c":false,"fb":"that describes a selection rule, not a goal (M3)"},{"t":"A task the user wants to accomplish","c":true,"fb":"goals are defined as the tasks a user wants to accomplish"},{"t":"A basic motor or perceptual action","c":false,"fb":"that is an operator, not a goal (M1)"},{"t":"A sequence of procedures","c":false,"fb":"that is a method, not a goal (M2)"}]},{"cat":"03","type":"mcq","stem":"In GOMS, clicking the right mouse button during a delete task is best classified as which component?","options":[{"t":"Method","c":false,"fb":"a method is the full sequence of procedures, not one action (M2)"},{"t":"Selection Rule","c":false,"fb":"no choice between methods is being made here (M3)"},{"t":"Goal","c":false,"fb":"the goal is the outcome wanted, not a single click (M1)"},{"t":"Operator","c":true,"fb":"operators are the basic perceptual, cognitive, or motor actions used to accomplish goals"}]},{"cat":"03","type":"mcq","stem":"A user deletes a file by right-clicking it, choosing \"Delete,\" then confirming the dialog. In GOMS, this whole sequence is which component?","options":[{"t":"Method","c":true,"fb":"a method is a sequence of procedures that can accomplish a goal"},{"t":"Goal","c":false,"fb":"the goal is deleting the file, not the steps taken (M1)"},{"t":"Selection Rule","c":false,"fb":"no method choice is being described, only the chosen method itself (M3)"},{"t":"Operator","c":false,"fb":"each individual click is an operator; the whole sequence is a method (M2)"}]},{"cat":"03","type":"mcq","stem":"A typist, keeping both hands on the keyboard, presses the Del key instead of reaching for the mouse to delete a file. In GOMS, the reason behind this choice is which component?","options":[{"t":"Method","c":false,"fb":"the shortcut method itself is not what is described; the choosing is (M2)"},{"t":"Operator","c":false,"fb":"the keypress is the operator; the reason for choosing it is not (M1)"},{"t":"Selection Rule","c":true,"fb":"selection rules are the personal rules users follow to select a method"},{"t":"Goal","c":false,"fb":"the goal (delete the file) is the same either way (M4)"}]},{"cat":"03","type":"mcq","stem":"Why must visual interface design adhere to the characteristics of the human visual system?","options":[{"t":"Hearing is unreliable in most environments","c":false,"fb":"aural relevance does not explain visual design constraints"},{"t":"Over 40% of the human brain processes visual info","c":true,"fb":"visual modality is the most important medium and dominates brain processing"},{"t":"Touch is slower than vision for all users","c":false,"fb":"haptic speed is not the basis given for visual design constraints"},{"t":"Visual signals are cheaper to produce than aural ones","c":false,"fb":"cost is not part of the handout's reasoning"}]},{"cat":"03","type":"mcq","stem":"Which term means the observable area a person can see through the eyes?","options":[{"t":"Visual acuity","c":false,"fb":"acuity is the resolution the eye perceives from a fixed distance, not an area (M3)"},{"t":"Display FOV","c":false,"fb":"display FOV is the area subtended by the display, not the eye's full observable area (M1)"},{"t":"Field of view","c":true,"fb":"FOV is the observable area seen through the eyes"},{"t":"Viewing distance","c":false,"fb":"viewing distance is a distance, not an area (M2)"}]},{"cat":"03","type":"mcq","stem":"In a museum kiosk, the measured gap from a visitor's eyes to the display surface is 60 cm. Which parameter does this 60 cm represent?","options":[{"t":"Viewing distance","c":true,"fb":"viewing distance is defined as the distance from the eyes to the display surface"},{"t":"Field of view","c":false,"fb":"FOV is an observable area, not a distance (M2)"},{"t":"Display resolution","c":false,"fb":"resolution is a pixel count, unrelated to this measurement (M4)"},{"t":"Display FOV","c":false,"fb":"display FOV is an area subtended by the display, not the eye-to-screen gap (M1)"}]},{"cat":"03","type":"fitb","stem":"The resolution perceived by the human eye from a fixed distance is called visual ____.","subtype":"term","answer":["acuity"],"caseSensitive":false,"fb":"Visual acuity is the resolution perceived by the eye from a fixed distance, distinct from the display's own pixel resolution."},{"cat":"03","type":"mcq","stem":"Which term refers to the number of pixels in the horizontal and vertical directions for a fixed area?","options":[{"t":"Pixel","c":false,"fb":"a pixel is a single small rectangular area, not a count over an area (M3)"},{"t":"Visual acuity","c":false,"fb":"acuity describes the eye's perception, not the display's pixel count (M4)"},{"t":"Display FOV","c":false,"fb":"display FOV is an area subtended from a viewing distance, not a pixel count (M1)"},{"t":"Display resolution","c":true,"fb":"resolution is defined as the horizontal and vertical pixel count for a fixed area"}]},{"cat":"03","type":"scenario","stem":"Which visual quality attribute is too low here?","context":"On a dashboard, a \"Pause\" button and a \"Stop\" button sit side by side. A tester reports she cannot reliably tell them apart because their difference in shade is too slight.","options":[{"t":"Brightness","c":false,"fb":"brightness is absolute light emitted or perceived; the problem is a relative difference between two objects (M1)"},{"t":"Contrast","c":true,"fb":"contrast is the relative difference in brightness or color between two objects"},{"t":"Display resolution","c":false,"fb":"pixel count is not the issue described"},{"t":"Color wavelength","c":false,"fb":"the fault is the relation between two objects, not wavelength response alone (M2)"}]},{"cat":"03","type":"mcq","stem":"Which statement correctly describes brightness?","options":[{"t":"It is the relative difference between two objects","c":false,"fb":"that defines contrast, not brightness (M2)"},{"t":"It is the number of wavelengths a display can produce","c":false,"fb":"wavelength mixture defines color, not brightness (M1)"},{"t":"It is the amount of light emitted or perceived","c":true,"fb":"brightness is the amount of light emitted by an object or perceived by the eye"},{"t":"It is the resolution perceived from a fixed distance","c":false,"fb":"that defines visual acuity, not brightness (M1)"}]},{"cat":"03","type":"mcq","stem":"The handout's recommended range for aural signals is which of the following?","options":[{"t":"50 to 5000 Hz","c":true,"fb":"aural signal frequencies should stay between 50 and 5000 Hz, commonly used as intermittent alarms"},{"t":"20 to 20000 Hz","c":false,"fb":"that is the full human hearing range, not the recommended design band"},{"t":"500 to 50000 Hz","c":false,"fb":"this range starts too high and far exceeds the recommendation"},{"t":"5 to 500 Hz","c":false,"fb":"this band cuts off well below the recommended upper limit"}]},{"cat":"03","type":"fitb","stem":"The aural parameter also known as volume, referring to the amount of sound energy, is ____.","subtype":"term","answer":["Intensity","intensity"],"caseSensitive":false,"fb":"Intensity is the amount of sound energy and is commonly called volume."},{"cat":"03","type":"scenario","stem":"Which aural input method is the software using?","context":"A doctor dictates notes, and the clinic software transcribes the exact spoken words into a text field, converting the audio to machine-readable text without acting on any intent.","options":[{"t":"Natural Language Understanding","c":false,"fb":"NLU would interpret the meaning of the sentences; here only words are converted to text (M1)"},{"t":"Haptic input","c":false,"fb":"haptic pertains to touch, not speech"},{"t":"Phase detection","c":false,"fb":"phase is an aural display parameter, not an input method (M1)"},{"t":"Speech Recognition","c":true,"fb":"identifying spoken words/phrases and converting them to machine-readable format is speech recognition"}]},{"cat":"03","type":"scenario","stem":"Which capability does the kiosk demonstrate?","context":"A patient says to a health kiosk, \"Schedule my check-up for next week because my knee hurts,\" and the kiosk grasps the meaning of the full sentence and books the right appointment, even though it was spoken in everyday phrasing with no command keywords.","options":[{"t":"Speech Recognition","c":false,"fb":"speech recognition would only transcribe the words to text; the kiosk understood the intent behind the whole sentence (M2)"},{"t":"Natural Language Understanding","c":true,"fb":"NLU is the AI branch that understands sentences in text or speech without formal programming syntax"},{"t":"Haptic feedback","c":false,"fb":"haptic pertains to touch, not understanding language (M2)"},{"t":"Intermittent alarms","c":false,"fb":"alarms are aural feedback output, not language understanding (M2)"}]},{"cat":"03","type":"mcq","stem":"A game controller vibrates and pushes back against the player's grip while they handle a virtual object. Which modality is at work?","options":[{"t":"Haptic","c":true,"fb":"haptic technology uses touch through vibrations, motion, or force to interact with computers"},{"t":"Aural","c":false,"fb":"no sound signal is involved in the feedback described"},{"t":"Visual","c":false,"fb":"nothing about light or display parameters applies here"},{"t":"Speech Recognition","c":false,"fb":"no spoken language input or output is present"}]},{"cat":"03","type":"mcq","stem":"For a multimodal interface to be effective, its representations must be which of the following?","options":[{"t":"Redundant and alternative","c":false,"fb":"those are representation types, not the effectiveness requirement"},{"t":"Auditory and visual only","c":false,"fb":"multimodal interaction is not limited to two specific modalities"},{"t":"Synchronized and consistent","c":true,"fb":"the handout states multimodal interfaces must be properly synchronized and consistent"},{"t":"Complementary and haptic","c":false,"fb":"complementary is one representation type, not the general requirement"}]},{"cat":"03","type":"mcq","stem":"A payment app shows a green \"Payment sent\" badge and simultaneously plays a voice confirmation of the same outcome, so the user is certain it succeeded. Which multimodal representation is this?","options":[{"t":"Complementary","c":false,"fb":"the modalities carry the same message rather than different roles (M1)"},{"t":"Redundant","c":true,"fb":"redundant representation uses different methods to guarantee definitive accomplishment"},{"t":"Alternative","c":false,"fb":"no choice between input methods is offered to the user (M3)"},{"t":"Phase","c":false,"fb":"phase is an aural display parameter, not a multimodal representation (M1)"}]},{"cat":"03","type":"mcq","stem":"A driver speaks a destination command while the screen simultaneously displays the route map; voice handles input while graphics handle output guidance. Which multimodal representation is this?","options":[{"t":"Complementary","c":true,"fb":"the modalities adopt different roles that complement each other toward one objective"},{"t":"Redundant","c":false,"fb":"they are not repeating the same message; each does a different job (M1)"},{"t":"Synchronized","c":false,"fb":"synchronization is a general requirement, not one of the three representation types (M2)"},{"t":"Alternative","c":false,"fb":"the user is not choosing between ways to interact (M3)"}]},{"cat":"03","type":"mcq","stem":"A smart TV lets viewers change the channel either by speaking the channel name aloud to its microphone or by pressing the number buttons on the remote — whichever the viewer prefers at the moment. Which multimodal representation is this?","options":[{"t":"Redundant","c":false,"fb":"the two methods are not fired together to guarantee success; the user picks one each time (M1)"},{"t":"Complementary","c":false,"fb":"the two modalities are not playing different simultaneous roles toward one step (M2)"},{"t":"Alternative","c":true,"fb":"alternative representation gives users more options for how to interact with the system"},{"t":"Synchronized","c":false,"fb":"synchronization is a general effectiveness requirement, not one of the three representation types (M2)"}]},{"cat":"03","type":"fitb","stem":"The discipline focused on creating products and interfaces that are comfortable and efficient based on the physical mechanics of the human body is ____.","subtype":"term","answer":["ergonomics"],"caseSensitive":false,"fb":"Ergonomics, also known as motor capabilities, designs for comfort and efficiency based on human body mechanics."},{"cat":"03","type":"mcq","stem":"Fitts' Law predicts which of the following?","options":[{"t":"Reading comprehension as a function of text size","c":false,"fb":"Fitts' Law concerns movement to targets, not reading"},{"t":"Error rates for continuous drawing motions","c":false,"fb":"the law applies to rapid pointing, not continuous motion (M1)"},{"t":"Time to move rapidly to a target based on distance and target size","c":true,"fb":"that is exactly what Fitts' Law predicts, originating in assembly-line work"},{"t":"Memory retention for repeated interface actions","c":false,"fb":"Fitts' Law is a movement model, not a memory model (M2)"}]},{"cat":"03","type":"scenario","stem":"Based on Fitts' Law, why does the rival app feel faster?","context":"A photo editor places its most-used tool menu at the extreme top-left of a large desktop monitor, requiring a long mouse trip from the canvas, while a rival app opens the same menu at the cursor via right-click.","options":[{"t":"It eliminates continuous motion during selection","c":false,"fb":"Fitts' Law was never about continuous motion (M1)"},{"t":"It minimizes mouse travel distance to the target","c":true,"fb":"shorter travel to a right-click pop-up menu reduces selection time, the law's key GUI implication"},{"t":"It increases the resolution of the display","c":false,"fb":"display resolution does not change pointer travel time (M2)"},{"t":"It reduces the user's short-term memory load","c":false,"fb":"memory load is a human-factors concern, not Fitts' Law (M3)"}]},{"cat":"03","type":"mcq","stem":"Which body parts make the most predominant form of computer input?","options":[{"t":"Feet and legs","c":false,"fb":"foot input exists but is not the predominant form"},{"t":"Eyes and tongue","c":false,"fb":"gaze input exists but is not predominant"},{"t":"Voice and head","c":false,"fb":"voice is a growing input method but not the predominant one"},{"t":"Arms, hands, and fingers","c":true,"fb":"the predominant input comes from movements of arms, hands, and fingers for keyboard and mouse"}]}]};

// Every question declares its own `cat` key in the pack. Anything
// with a missing/unknown key becomes 'other' (excluded from exam
// simulation, still reachable in normal practice mode).
BANK.forEach(q => {
  if (!q.cat || !CATEGORIES.some(c => c.key === q.cat)) q.cat = 'other';
});

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

/* ── Exam-blueprint helpers (engine code — no edits needed) ──────── */
// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatInline(s) {
  if (!s) return '';
  return String(s).replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const badge = (lang ? lang.toUpperCase() + ' ' : '') + 'CODE';
    return `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${escapeHtml(code.trim())}</code></pre></div>`;
  });

  // 2. Inline code backticks `code`
  text = text.replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked  = shuffle(pool).slice(0, finalCount);
  return picked.map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(shuffle(pool).slice(0, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note
  $('poolAvailable').textContent = available;

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}
