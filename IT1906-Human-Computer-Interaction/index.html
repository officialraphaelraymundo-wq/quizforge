 only."},{"t":"It includes both the displayed software and the input hardware","c":true,"fb":"Both software and external hardware can form the user interface."},{"t":"It is only the abstract task model","c":false,"fb":"M3 — This confuses interface components with interaction."}]},{"cat":"01","type":"fitb","stem":"The abstract model by which humans interact with a computing device to complete a given task is called _____.","sub":"interaction-definition","subtype":"term","answer":["interaction"],"caseSensitive":false,"fb":"Interaction is the abstract model through which a person works with a computing device to complete a task."},{"cat":"01","type":"scenario","stem":"Which term describes what the team is modeling?","sub":"interaction-definition","context":"A web team models the abstract sequence through which a person works with a computing device to complete a task.","options":[{"t":"Interface","c":false,"fb":"M1 — This confuses the abstract human-device model with the boundary between independent systems."},{"t":"Hardware","c":false,"fb":"M2 — This reduces interaction to physical devices."},{"t":"Task","c":false,"fb":"M3 — This confuses the job being completed with the model used to complete it."},{"t":"Interaction","c":true,"fb":"Interaction is the abstract model used by humans to work with a computing device toward a task."}]},{"cat":"01","type":"fitb","stem":"The boundary where two independent systems meet and act on or communicate with each other is an _____.","sub":"interface-definition","subtype":"term","answer":["interface"],"caseSensitive":false,"fb":"An interface is the boundary where two independent systems meet and communicate or act on each other."},{"cat":"01","type":"scenario","stem":"What is this boundary called?","sub":"interface-definition","context":"Two independent systems meet at a defined boundary through which they communicate with each other.","options":[{"t":"Interaction","c":false,"fb":"M1 — This confuses the system boundary with the abstract model of human-device interaction."},{"t":"Interface","c":true,"fb":"An interface is the boundary at which two independent systems meet and communicate."},{"t":"Task","c":false,"fb":"M3 — This confuses the boundary with the job a user seeks to accomplish."},{"t":"Display","c":false,"fb":"M2 — This incorrectly limits an interface to something shown on a screen."}]},{"cat":"01","type":"mcq","stem":"What is a stated result of usable and efficient interaction with computing devices?","sub":"usable-interaction-productivity","options":[{"t":"Higher productivity","c":true,"fb":"Usable and efficient interaction translates to higher productivity in industry."},{"t":"Greater processing power","c":false,"fb":"M1 — This confuses human interaction benefits with raw computer performance."},{"t":"More entertainment only","c":false,"fb":"M2 — This incorrectly limits the value of usable interaction to entertainment."},{"t":"No change when functionality works","c":false,"fb":"M3 — This assumes usability has no effect once functions are available."}]},{"cat":"01","type":"scenario","stem":"Which HCI benefit should this support?","sub":"usable-interaction-productivity","context":"Employees can operate a company's computing system quickly and efficiently because its interaction is easy to use.","options":[{"t":"Higher productivity","c":true,"fb":"Usable and efficient interaction supports productivity in industry."},{"t":"Faster hardware computation by itself","c":false,"fb":"M1 — This attributes the benefit to computing power instead of interaction usability."},{"t":"Entertainment as the only outcome","c":false,"fb":"M2 — This restricts usable interaction to entertainment rather than work."},{"t":"No practical benefit once features exist","c":false,"fb":"M3 — This assumes usability cannot improve outcomes when functionality is already present."}]},{"cat":"01","type":"mcq","stem":"What can happen when a system has a poor interface?","sub":"poor-interface-consequence","options":[{"t":"Users may struggle to benefit even from a simple program","c":true,"fb":"A poor interface can make even simple systems difficult for users to benefit from."},{"t":"Simple programs remain easy regardless of interface quality","c":false,"fb":"M1 — This assumes simple functionality makes interface quality irrelevant."},{"t":"Attractive graphics automatically remove the problem","c":false,"fb":"M2 — This assumes appearance alone compensates for poor interaction."},{"t":"Adding more functions automatically solves the problem","c":false,"fb":"M3 — This assumes additional functionality corrects an interface problem."}]},{"cat":"01","type":"scenario","stem":"Which HCI point does this illustrate?","sub":"poor-interface-consequence","context":"A program performs only a few simple functions, but its controls are so poorly arranged that users struggle to obtain any benefit from it.","options":[{"t":"Simple systems do not require interface design","c":false,"fb":"M1 — This assumes simplicity makes a good interface unnecessary."},{"t":"More features are needed before users can benefit","c":false,"fb":"M3 — This misidentifies the problem as insufficient functionality."},{"t":"A poor interface can obstruct even a simple program","c":true,"fb":"Interface quality can determine whether users can benefit from even basic functionality."},{"t":"Visual attractiveness alone would guarantee usability","c":false,"fb":"M2 — This assumes appearance by itself removes interface difficulties."}]},{"cat":"01","type":"mcq","stem":"Which statement best reflects the commercial importance of interface aesthetics?","sub":"aesthetics-commercial-success","options":[{"t":"Functionality alone determines commercial success","c":false,"fb":"M1 — This ignores the commercial importance assigned to interface appeal."},{"t":"Aesthetic appeal matters together with usability","c":true,"fb":"Attractive design in addition to usability is described as a critical commercial requirement."},{"t":"Attractive design can replace usability completely","c":false,"fb":"M2 — This treats appearance as a substitute rather than an additional requirement."},{"t":"Commercial appeal requires radically superior functionality","c":false,"fb":"M3 — This misreads the example, where functionality can be nearly equal to competitors."}]},{"cat":"01","type":"scenario","stem":"Which HCI idea does this situation illustrate?","sub":"aesthetics-commercial-success","context":"Two competing technology products have nearly equal functionality. One has a distinct, attractive interface while still meeting usability needs and develops a loyal customer base.","options":[{"t":"Attractive interfaces can support commercial success when combined with usability","c":true,"fb":"The source presents aesthetic appeal alongside usability as commercially important."},{"t":"Attractive appearance makes usability unnecessary","c":false,"fb":"M2 — This treats aesthetics as a replacement for usability."},{"t":"Commercial success proves one product has far greater functionality","c":false,"fb":"M3 — This assumes the example depends on major functional superiority."},{"t":"Functionality alone explains the customer's preference","c":false,"fb":"M1 — This ignores the role of interface appeal in commercial success."}]},{"cat":"01","type":"mcq","stem":"Which is listed as a noticeable impact of HCI?","sub":"hci-notable-impacts","options":[{"t":"The spreadsheet interface helped make business computing successful","c":true,"fb":"The spreadsheet interface is specifically listed as an HCI impact on business computing."},{"t":"A word-processing interface created business computing success","c":false,"fb":"M1 — This substitutes another office-software interface for the listed spreadsheet impact."},{"t":"A search-engine interface made the Internet phenomenon possible","c":false,"fb":"M2 — This substitutes a search-engine interface for the listed Web-browser interface."},{"t":"Mobile devices are unrelated to HCI's noticeable impacts","c":false,"fb":"M3 — This incorrectly excludes widespread smartphone and mobile-device use."}]},{"cat":"01","type":"multi","stem":"Which THREE are listed as noticeable impacts of HCI? Select the THREE correct items.","sub":"hci-notable-impacts","options":[{"t":"Widespread use of smartphones and other mobile devices","c":true,"fb":"Mobile-device use is included among the listed impacts."},{"t":"The Web-browser interface enabling the Internet phenomenon","c":true,"fb":"The Web-browser interface is specifically linked to the Internet phenomenon."},{"t":"Search-engine interfaces replacing the need for Web browsers","c":false,"fb":"M2 — This substitutes a search-engine claim for the listed browser-interface impact."},{"t":"Body-based and action-oriented interfaces used for computer games","c":true,"fb":"These game interfaces are included among the listed impacts."},{"t":"Body-based interfaces being unrelated to HCI","c":false,"fb":"M4 — This incorrectly excludes an impact explicitly associated with computer gaming."}]},{"cat":"01","type":"scenario","stem":"Which listed HCI impact most directly matches this development?","sub":"hci-notable-impacts","context":"People gain widespread access to information on the Internet through software designed specifically for viewing and navigating Web content.","options":[{"t":"The spreadsheet interface making business computing successful","c":false,"fb":"M1 — This confuses the Internet-related impact with the business-computing example."},{"t":"Widespread smartphone use","c":false,"fb":"M3 — This substitutes the mobile-device impact for the Web-interface impact."},{"t":"Body-based interfaces used for computer games","c":false,"fb":"M4 — This confuses Internet access with action-oriented gaming interfaces."},{"t":"The Web-browser interface enabling the Internet phenomenon","c":true,"fb":"The Web-browser interface is identified as essential to the Internet phenomenon."}]},{"cat":"01","type":"mcq","stem":"Which HCI principle is commonly called user-centered design and serves as the primary principle?","sub":"know-the-user-principle","options":[{"t":"Understand the Task","c":false,"fb":"This confuses target-user design with analyzing task sequences and subtasks."},{"t":"Strive for Consistency","c":false,"fb":"This confuses target-user design with maintaining familiar interaction and interface methods."},{"t":"Know the User","c":true,"fb":"This principle centers the interaction and interface on the needs and capabilities of the target users."},{"t":"Reduce Memory Load","c":false,"fb":"This confuses target-user design with reducing the amount users must remember."}]},{"cat":"01","type":"scenario","stem":"Which HCI principle is being applied?","sub":"know-the-user-principle","context":"A payroll system is being designed for older employees with little computing experience. The designers simplify navigation and choose interaction methods based on those employees' capabilities.","options":[{"t":"Universal usability","c":false,"fb":"This confuses design for a specific target group with design intended for a wide range of users."},{"t":"Know the User","c":true,"fb":"The design is being adapted to the identified needs and capabilities of its target users."},{"t":"Natural Interaction and Interface","c":false,"fb":"This confuses target-user adaptation with reflecting actions and processes from daily life."},{"t":"Strive for Consistency","c":false,"fb":"This confuses user-centered adaptation with keeping interaction methods familiar and consistent."}]},{"cat":"01","type":"multi","stem":"Which TWO design choices follow the Know the User principle? Select the TWO correct items.","sub":"know-the-user-principle","options":[{"t":"Adapt interaction modes to the target users' capabilities.","c":true,"fb":"The principle requires interaction choices to suit the capabilities of the intended users."},{"t":"Use the same interaction method regardless of the target users.","c":false,"fb":"This reflects the misconception that target-user capabilities can be ignored."},{"t":"Design the interface around identified target-user needs.","c":true,"fb":"User-centered design uses target-user needs to guide the interface solution."},{"t":"Design one interface primarily to serve the widest possible range.","c":false,"fb":"This confuses target-specific design with universal usability."},{"t":"Base the interface only on the sequence of system subtasks.","c":false,"fb":"This confuses user-centered design with task analysis."}]},{"cat":"01","type":"multi","stem":"Which TWO are listed as basic user information collected before analyzing user preferences and capabilities? Select the TWO correct items.","sub":"user-profile-information","options":[{"t":"Skill level","c":false,"fb":"This confuses a resulting assessment with one of the listed basic profile inputs."},{"t":"Age","c":true,"fb":"Age is one of the basic pieces of user information collected and analyzed."},{"t":"Preferred interface style","c":false,"fb":"This confuses a possible preference being determined with the basic information used to determine it."},{"t":"Mental capability","c":false,"fb":"This confuses an assessed capability with one of the listed basic profile inputs."},{"t":"Computing experience","c":true,"fb":"Computing experience is explicitly included among the basic information collected."}]},{"cat":"01","type":"mcq","stem":"A design team records users' gender, age, education level, and computing experience. What is this information used to help determine?","sub":"user-profile-information","options":[{"t":"System outputs and inputs","c":false,"fb":"This confuses user-profile analysis with system interaction structure."},{"t":"Task sequences and subtasks","c":false,"fb":"This confuses user profiling with task analysis."},{"t":"Cross-application consistency","c":false,"fb":"This confuses user profiling with consistency between interaction and interface methods."},{"t":"User preferences and capabilities","c":true,"fb":"The profile information helps reveal preferences, tendencies, capabilities, and skill levels that guide design."}]},{"cat":"01","type":"fitb","stem":"The concept that attempts to cater to a wide range of users rather than specific target users is ____.","sub":"universal-usability","subtype":"term","answer":["universal usability"],"caseSensitive":false,"fb":"Universal usability aims to support a wide range of users and promotes humane interfaces."},{"cat":"01","type":"mcq","stem":"A public information kiosk is designed from the beginning to serve a wide range of different users rather than one specific target group. Which concept best matches this goal?","sub":"universal-usability","options":[{"t":"Know the User","c":false,"fb":"This confuses broad user coverage with design centered on a specific target group."},{"t":"Understand the Task","c":false,"fb":"This confuses broad user coverage with analyzing task sequences and subtasks."},{"t":"Universal usability","c":true,"fb":"Universal usability attempts to accommodate a wide range of users rather than specific users."},{"t":"Natural Interaction and Interface","c":false,"fb":"This confuses broad user coverage with reflecting real-life actions and processes."}]},{"cat":"01","type":"mcq","stem":"Which statement about universal usability is accurate?","sub":"universal-usability","options":[{"t":"It focuses on one specific target group so its requirements remain limited.","c":false,"fb":"This confuses universal usability with target-specific user-centered design."},{"t":"It promotes humane interfaces, but broad requirements make one universal interface difficult to implement.","c":true,"fb":"Serving a wide range of users creates extensive requirements, especially in advanced multicultural societies."},{"t":"It is mainly intended for experienced users who can adapt to complex interfaces.","c":false,"fb":"This reflects the misconception that humane interfaces are meant only for expert users."},{"t":"It is generally simple because a wide range of users have nearly identical requirements.","c":false,"fb":"This reflects the misconception that broad user requirements are easy to satisfy in one interface."}]},{"cat":"01","type":"fitb","stem":"The job to be accomplished by the user with an interactive system is called a ____.","sub":"task-definition","subtype":"term","answer":["task"],"caseSensitive":false,"fb":"A task is the job the user seeks to accomplish with the interactive system."},{"cat":"01","type":"mcq","stem":"A user is trying to log into a website. In HCI, what does the task refer to?","sub":"task-definition","options":[{"t":"The job of gaining access through the interactive system","c":true,"fb":"A task is the job the user is trying to accomplish."},{"t":"The abstract model describing how the user and device act","c":false,"fb":"This confuses the user's job with the interaction model used to complete it."},{"t":"The boundary where the user and system communicate","c":false,"fb":"This confuses the task with the interface boundary."},{"t":"The user's age and computing experience","c":false,"fb":"This confuses the task with information used to profile users."}]},{"cat":"01","type":"mcq","stem":"Which activity most directly belongs to Understanding the Task?","sub":"understand-the-task-principle","options":[{"t":"Choosing an attractive interface style","c":false,"fb":"This reflects the misconception that task understanding is mainly visual styling."},{"t":"Collecting only the user's age and education","c":false,"fb":"This confuses task analysis with target-user profiling."},{"t":"Keeping controls visually identical everywhere","c":false,"fb":"This confuses task analysis with consistency."},{"t":"Identifying sequences and the structure of subtasks","c":true,"fb":"Understanding the Task includes sequence identification and the structure of subtasks at an abstract level."}]},{"cat":"01","type":"mcq","stem":"A team studying corporate system access breaks the work into ordered subtasks and examines how users navigate them. Which principle is being applied?","sub":"understand-the-task-principle","options":[{"t":"Know the User","c":false,"fb":"This confuses task structure with profiling the characteristics of target users."},{"t":"Understand the Task","c":true,"fb":"The team is examining interaction structure, sequence, and subtasks within the larger application."},{"t":"Remind Users","c":false,"fb":"This confuses task modeling with refreshing the user's memory through reminders."},{"t":"Strive for Consistency","c":false,"fb":"This confuses task modeling with maintaining familiar interaction and interface methods."}]},{"cat":"01","type":"mcq","stem":"What is the expected effect of keeping a user's memory load light?","sub":"light-memory-load-efficiency","options":[{"t":"Lower efficiency with fewer errors","c":false,"fb":"This reflects the misconception that lighter memory demands reduce task efficiency."},{"t":"Higher efficiency with more errors","c":false,"fb":"This overlooks the stated relationship between light memory load and less erroneous behavior."},{"t":"Higher efficiency with fewer errors","c":true,"fb":"Light memory load supports more efficient performance and less erroneous behavior."},{"t":"No change in efficiency or errors","c":false,"fb":"This reflects the misconception that memory load is unrelated to task performance and errors."}]},{"cat":"01","type":"mcq","stem":"A mobile app is being simplified so users need to remember less information while completing a task. Which result best matches the HCI principle?","sub":"light-memory-load-efficiency","options":[{"t":"Users should perform more efficiently and make fewer errors.","c":true,"fb":"Light memory demands support efficient performance and less erroneous behavior."},{"t":"Users should perform more slowly but remember more details.","c":false,"fb":"This reflects the misconception that heavier memory demands improve task performance."},{"t":"Only short-term performance can improve; long-term load is irrelevant.","c":false,"fb":"This reflects the misconception that only short-term memory load matters."},{"t":"Error rates should remain unrelated to the amount remembered.","c":false,"fb":"This reflects the misconception that memory load has no relationship to errors."}]},{"cat":"01","type":"mcq","stem":"About how many pieces of specific information can human short-term memory hold with respect to completing a task?","sub":"short-term-memory-capacity","options":[{"t":"One to three","c":false,"fb":"This underestimates the short-term memory range given for task completion."},{"t":"Ten to fourteen","c":false,"fb":"This overestimates the short-term memory range given for task completion."},{"t":"Fifteen to nineteen","c":false,"fb":"This substantially overestimates the stated short-term memory capacity."},{"t":"Five to nine","c":true,"fb":"The stated capacity is about five to nine pieces of specific information."}]},{"cat":"01","type":"mcq","stem":"A kiosk designer is reviewing how much information users may need to hold in short-term memory while navigating a menu. Which range matches the stated human capacity?","sub":"short-term-memory-capacity","options":[{"t":"About two to four items","c":false,"fb":"This underestimates the stated short-term memory range."},{"t":"About five to nine items","c":true,"fb":"This matches the stated short-term memory capacity for information related to completing a task."},{"t":"About ten to fifteen items","c":false,"fb":"This overestimates the stated short-term memory range."},{"t":"An unlimited number of items","c":false,"fb":"This reflects the misconception that short-term memory has no meaningful capacity limit for the task."}]},{"cat":"01","type":"mcq","stem":"Striving for consistency is specifically described as a way to relieve which type of memory load?","sub":"consistency-long-term-memory","options":[{"t":"Long-term memory load","c":true,"fb":"Consistency reduces the amount users must remember over the long term."},{"t":"Short-term memory load only","c":false,"fb":"This confuses the memory benefit of consistency with the principle focused on short-term memory demands."},{"t":"Both types equally in this statement","c":false,"fb":"This overlooks that consistency is specifically tied to relieving long-term memory load."},{"t":"Neither type of memory load","c":false,"fb":"This reflects the misconception that consistency has no memory-related purpose."}]},{"cat":"01","type":"scenario","stem":"Which redesign best applies Strive for Consistency?","sub":"consistency-long-term-memory","context":"Two applications in the same software suite perform the same common subtask in noticeably different ways. Users must repeatedly remember which method belongs to which application.","options":[{"t":"Add frequent reminders explaining both different methods.","c":false,"fb":"This confuses consistency with refreshing memory through reminders."},{"t":"Reduce the number of menu items in each application.","c":false,"fb":"This confuses consistency with reducing short-term memory demands."},{"t":"Make the interaction and interface methods more consistent.","c":true,"fb":"Consistency across interaction models and interface implementation relieves long-term memory demands."},{"t":"Replace the controls with actions copied from daily life.","c":false,"fb":"This confuses consistency with natural interaction."}]},{"cat":"01","type":"mcq","stem":"What is likely when the same subtask is handled differently at another time or interaction step?","sub":"inconsistency-and-satisfaction","options":[{"t":"Greater familiarity and preference","c":false,"fb":"This reflects the misconception that changing methods for the same subtask increases familiarity."},{"t":"More confusion and inaccurate responses","c":true,"fb":"Inconsistency can confuse users and produce inaccurate or inappropriate responses."},{"t":"Automatic reduction of long-term memory load","c":false,"fb":"This reverses the relationship between consistency and long-term memory demands."},{"t":"Higher satisfaction from learning new methods","c":false,"fb":"This reflects the misconception that inconsistency itself raises satisfaction."}]},{"cat":"01","type":"mcq","stem":"A game keeps its interface look and common controls familiar throughout the application. Which result is supported by the consistency principle?","sub":"inconsistency-and-satisfaction","options":[{"t":"Users should become less comfortable with the system.","c":false,"fb":"This reflects the misconception that familiarity reduces user comfort."},{"t":"Users should need a different method for each subtask.","c":false,"fb":"This reflects the misconception that varying methods improves consistency."},{"t":"User satisfaction should be unrelated to familiarity.","c":false,"fb":"This ignores the stated link between consistency, familiarity, satisfaction, and preference."},{"t":"Users should show greater satisfaction and preference.","c":true,"fb":"Consistency and familiarity can increase satisfaction and preference while using the system."}]},{"cat":"01","type":"mcq","stem":"What is the main purpose of providing constant reminders about important information or actions?","sub":"remind-users-principle","options":[{"t":"To model the sequence of subtasks","c":false,"fb":"This confuses memory reminders with understanding task structure."},{"t":"To make every interaction method identical","c":false,"fb":"This confuses reminders with consistency."},{"t":"To refresh the user's memory","c":true,"fb":"Reminders help refresh memory about important information or actions that need attention."},{"t":"To eliminate the need to know the target users","c":false,"fb":"This confuses memory support with target-user analysis."}]},{"cat":"01","type":"mcq","stem":"A computer periodically notifies a user that a system update still needs to be performed. Which principle does this illustrate?","sub":"remind-users-principle","options":[{"t":"Remind Users","c":true,"fb":"The notification refreshes the user's memory about an action that still needs to be performed."},{"t":"Prevent Errors/Reversal of Action","c":false,"fb":"This confuses a memory-refreshing reminder with confirmation or reversal used to prevent errors."},{"t":"Strive for Consistency","c":false,"fb":"This confuses a reminder with maintaining familiar interface and interaction methods."},{"t":"Understand the Task","c":false,"fb":"This confuses a reminder with analyzing the structure and sequence of a task."}]},{"cat":"01","type":"fitb","stem":"An event in which the output of a system is used as an input back into the system as part of a chain of events is called ____.","sub":"feedback-definition","subtype":"term","answer":["feedback"],"caseSensitive":false,"fb":"Feedback occurs when system output is fed back into the system as input within a continuing chain of events."},{"cat":"01","type":"mcq","stem":"An online payment system confirms safe receipt of a credit card number, and the resulting output is fed back into the ongoing system process. Which concept is illustrated?","sub":"feedback-definition","options":[{"t":"Interface","c":false,"fb":"This confuses the output-input chain with the boundary where independent systems meet."},{"t":"Interaction","c":false,"fb":"This confuses the output-input chain with the abstract model used to complete a task."},{"t":"Consistency","c":false,"fb":"This confuses the output-input chain with maintaining familiar interaction methods."},{"t":"Feedback","c":true,"fb":"The system's output becomes input again as part of the continuing chain of events."}]},{"cat":"01","type":"mcq","stem":"What is the main design goal of Prevent Errors/Reversal of Action?","sub":"prevent-errors-principle","options":[{"t":"Require users to remember more information before acting.","c":false,"fb":"This reflects the misconception that forcing more recall helps prevent errors."},{"t":"Avoid confusion and overwork while helping users complete tasks without error.","c":true,"fb":"The principle calls for interaction and interface design that supports error-free task completion without unnecessary confusion or effort."},{"t":"Give users regular reminders regardless of the action.","c":false,"fb":"This confuses preventing errors with refreshing memory through reminders."},{"t":"Correct mistakes only after the task has been completed.","c":false,"fb":"This treats after-the-fact correction as the entire purpose of error prevention."}]},{"cat":"01","type":"mcq","stem":"A file manager immediately performs a major destructive action with no confirmation and gives the user no easy way to reverse it. Which HCI principle is most directly being violated?","sub":"prevent-errors-principle","options":[{"t":"Remind Users","c":false,"fb":"This confuses memory reminders with safeguards surrounding user actions."},{"t":"Know the User","c":false,"fb":"This confuses error safeguards with adapting the design to target-user characteristics."},{"t":"Prevent Errors/Reversal of Action","c":true,"fb":"Confirmation and easy reversal are used to reduce confusion and help users recover from actions."},{"t":"Natural Interaction and Interface","c":false,"fb":"This confuses error safeguards with reflecting real-life actions and processes."}]},{"cat":"01","type":"multi","stem":"Which THREE techniques are used to prevent errors or support reversal of action? Select the THREE correct items.","sub":"error-prevention-techniques","options":[{"t":"Confirm significant user actions through pop-up menus.","c":true,"fb":"Confirming an action can help prevent unintended operations."},{"t":"Require full manual input instead of offering selections.","c":false,"fb":"This reflects the misconception that forcing recall and manual input reduces errors."},{"t":"Present relevant information and offer selections when possible.","c":true,"fb":"Limiting information and offering selections reduces unnecessary recall and manual specification."},{"t":"Remove reversal controls after an action is performed.","c":false,"fb":"This reflects the misconception that removing reversal options makes interaction safer."},{"t":"Allow an easy reversal of action such as Undo.","c":true,"fb":"Easy reversal lets users comfortably recover from an action."}]},{"cat":"01","type":"scenario","stem":"Which redesign best applies the error-prevention techniques?","sub":"error-prevention-techniques","context":"A desktop application starts a large process immediately after one click. Users sometimes trigger it accidentally and cannot easily reverse the action.","options":[{"t":"Add a reminder every hour that the process exists.","c":false,"fb":"This confuses refreshing memory with confirming and reversing significant actions."},{"t":"Confirm the action before starting and provide an easy reversal.","c":true,"fb":"Confirmation and easy reversal are both techniques used to reduce accidental actions and support recovery."},{"t":"Require users to type the complete command from memory.","c":false,"fb":"This reflects the misconception that more manual recall reduces errors."},{"t":"Change the activation method each time the process is available.","c":false,"fb":"This introduces inconsistency rather than preventing accidental actions."}]},{"cat":"01","type":"mcq","stem":"What characterizes Natural Interaction and Interface?","sub":"natural-interaction-principle","options":[{"t":"Using only visually realistic graphics","c":false,"fb":"This confuses natural interaction with visual realism instead of real-life actions and processes."},{"t":"Reproducing every real-life action perfectly","c":false,"fb":"This reflects the misconception that natural interaction must duplicate reality exactly."},{"t":"Avoiding real-life interaction because it is complex","c":false,"fb":"This reflects the misconception that translating real-life actions is impossible rather than merely complicated."},{"t":"Reflecting actions and processes from daily life","c":true,"fb":"Natural interaction brings actions and processes familiar from daily life into interaction with computers."}]},{"cat":"01","type":"mcq","stem":"A game lets a player make physical movements that are reflected directly in how the game is controlled. Which principle does this most closely illustrate?","sub":"natural-interaction-principle","options":[{"t":"Natural Interaction and Interface","c":true,"fb":"The interaction reflects actions from real life, similar to the natural interfaces described for games such as Wii."},{"t":"Remind Users","c":false,"fb":"This confuses real-life action-based interaction with refreshing the user's memory."},{"t":"Strive for Consistency","c":false,"fb":"This confuses natural actions with maintaining familiar interface and interaction methods."},{"t":"Understand the Task","c":false,"fb":"This confuses real-life action-based interaction with modeling task sequences and subtasks."}]},{"cat":"01","type":"multi","stem":"Which THREE are among the seven HCI principles taught in this lesson? Select the THREE correct items.","sub":"hci-principles-set","options":[{"t":"Universal usability","c":false,"fb":"This is discussed as a contrasting concept to Know the User, not as one of the seven named principles."},{"t":"Know the User","c":true,"fb":"Know the User is the primary principle in the seven-principle set."},{"t":"Remind Users","c":true,"fb":"Remind Users is one of the seven named principles."},{"t":"Feedback","c":false,"fb":"Feedback is associated with Remind Users but is not listed as a separate principle."},{"t":"Natural Interaction and Interface","c":true,"fb":"Natural Interaction and Interface is the last of the seven named principles."}]},{"cat":"01","type":"mcq","stem":"Which group contains only named HCI principles from the seven-principle set?","sub":"hci-principles-set","options":[{"t":"Know the User, Feedback, Remind Users","c":false,"fb":"This reflects the misconception that feedback is an independent named principle."},{"t":"Universal usability, Reduce Memory Load, Strive for Consistency","c":false,"fb":"This reflects the misconception that universal usability is one of the seven named principles."},{"t":"Know the User, Understand the Task, Remind Users","c":true,"fb":"All three belong to the seven HCI principles taught in the lesson."},{"t":"User experience, Prevent Errors/Reversal of Action, Natural Interaction and Interface","c":false,"fb":"This reflects the misconception that user experience is one of the seven named principles."}]},{"cat":"04","type":"mcq","stem":"Which design stage focuses on identifying the sequential relationships between system elements and assessing the feasibility of given requirements?","sub":"design-process-stages","options":[{"t":"Interface Selection and Consolidation","c":false,"fb":"M1: This stage chooses software components, interaction techniques, and hardware specs."},{"t":"Scenario and Task Modeling","c":true,"fb":"Identifies application task structure and sequential relationships to model system use."},{"t":"Requirement Analysis","c":false,"fb":"M2: This stage conducts initial research to set development goals from the user perspective."},{"t":"User Analysis","c":false,"fb":"M3: This stage reinforces requirements and prioritizes usability standards."}]},{"cat":"04","type":"scenario","stem":"Which phase of the overall design process is the team currently performing?","sub":"design-process-stages","context":"A design team has completed initial research and is now prioritizing user experience standards. They compare their findings against the initial specifications to uncover supplementary user interface requirements.","options":[{"t":"Requirement Analysis","c":false,"fb":"M2: Initial requirements analysis precedes this stage and defines baseline development goals."},{"t":"User Analysis","c":true,"fb":"Reinforces original requirements analysis, prioritizes UX standards, and identifies supplementary UI requirements."},{"t":"Interface Selection and Consolidation","c":false,"fb":"M1: Interface selection packages physical components and widgets rather than analyzing user standards."},{"t":"Scenario and Task Modeling","c":false,"fb":"M3: Task modeling determines application sequential structure and user task flow."}]},{"cat":"04","type":"mcq","stem":"A team needs to select specific widgets, interaction techniques, and display hardware, while adjusting for budget and time constraints. Which stage executes this work?","sub":"design-process-stages","options":[{"t":"Scenario and Task Modeling","c":false,"fb":"M2: Task modeling structures the sequential flow of tasks before component selection."},{"t":"Interface Selection and Consolidation","c":true,"fb":"Selects software interface components, interaction techniques, and hardware specifications into a practical package."},{"t":"User Analysis","c":false,"fb":"M3: User analysis sets usability priorities and supplementary requirements, not widget packaging."},{"t":"Requirement Analysis","c":false,"fb":"M1: Requirement analysis establishes development goals from the user perspective prior to design packaging."}]},{"cat":"04","type":"mcq","stem":"What is the primary objective of requirement analysis in the design process?","sub":"requirement-analysis-goal","options":[{"t":"Establishing development goals from the perspective of target users","c":true,"fb":"Sets system development goals by assessing user needs, characteristics, and context."},{"t":"Generating functional prototype code for user interface widgets","c":false,"fb":"M2: Code implementation and widget generation happen in later implementation phases."},{"t":"Selecting display monitors and peripheral interaction hardware","c":false,"fb":"M1: Hardware and component selection occurs during interface selection and consolidation."},{"t":"Packaging interface components within strict operational budgets","c":false,"fb":"M1: Reconciling components with budget constraints belongs to interface consolidation."}]},{"cat":"04","type":"mcq","stem":"To establish effective development goals during requirement analysis, which aspects must designers evaluate?","sub":"requirement-analysis-goal","options":[{"t":"Source code architecture, compilation speed, and memory buffers","c":false,"fb":"M1: These are technical implementation details rather than user-centered requirements."},{"t":"User characteristics, usage context, and competitive systems","c":true,"fb":"Requirement analysis examines user needs, usage context, preceding systems, and competitive systems."},{"t":"Visual graphic branding, final color palettes, and typography","c":false,"fb":"M2: Visual styling and aesthetic design occur after structural modeling."},{"t":"Final prototype widgets, earcon frequencies, and sound schemes","c":false,"fb":"M2: Sound design and widget components are chosen during interface selection."}]},{"cat":"04","type":"fitb","stem":"During scenario and task modeling, designers use the process of ____ to create a rough visual profile of the interface.","sub":"storyboarding","subtype":"term","answer":["storyboarding"],"caseSensitive":false,"fb":"Storyboarding allows designers to produce a rough visual profile to evaluate system appropriateness and feasibility."},{"cat":"04","type":"mcq","stem":"What is the main role of storyboarding within the scenario and task modeling phase?","sub":"storyboarding","options":[{"t":"Building an interactive software prototype to test system execution speed","c":false,"fb":"M1: Functional prototyping and code execution occur much later than task modeling."},{"t":"Creating a rough visual profile of the interface to assess system appropriateness","c":true,"fb":"Storyboarding allows designers to create a rough visual profile to assess appropriateness and feasibility."},{"t":"Selecting hardware platforms and sensor specifications for deployment","c":false,"fb":"M2: Selecting hardware platforms and sensors occurs during interface selection and consolidation."},{"t":"Evaluating competitive systems to establish initial development goals","c":false,"fb":"M2: Analyzing preceding and competitive systems belongs to requirement analysis."}]},{"cat":"04","type":"mcq","stem":"Why must selected software components, interaction techniques, and hardware specifications be consolidated into a practical package?","sub":"interface-consolidation","options":[{"t":"Operating platforms may lack specific component support, requiring adjustments for budget, time, and personnel","c":true,"fb":"Consolidation ensures individual components work within platform limits and project constraints."},{"t":"Selected components work universally across platforms, but requires repeating the user analysis stage","c":false,"fb":"M1: Components cannot run universally across platforms without adaptation."},{"t":"Packaging components eliminates all hardware differences, preventing the need for project budget adjustments","c":false,"fb":"M1: Packaging components addresses platform availability and resource limits, not automated error elimination."},{"t":"Interface consolidation must be completed before scenario and task modeling can identify user subtasks","c":false,"fb":"M2: Scenario and task modeling precedes interface selection and consolidation."}]},{"cat":"04","type":"scenario","stem":"Which activity must the team undertake during interface selection and consolidation?","sub":"interface-consolidation","context":"An engineering team plans to deploy facial recognition and 3D gesture tracking in a retail mobile application. However, their testing reveals that targeted budget-tier customer devices lack the required sensors, and project deadlines prevent custom sensor distribution.","options":[{"t":"Restart the requirement analysis stage from scratch to redefine the core user goals","c":false,"fb":"M2: User goals remain valid; the team needs component adjustments, not a project restart."},{"t":"Make design adjustments to package feasible components within platform and time constraints","c":true,"fb":"Designers must consolidate feasible components considering platform limitations, budget, and time."},{"t":"Require target users to purchase external sensor hardware before using the application","c":false,"fb":"M1: Consolidation adapts the interface to the target platform rather than imposing peripheral requirements on users."},{"t":"Retain the unsupported gestures and bypass platform checks during deployment","c":false,"fb":"M1: Deploying unsupported interaction techniques results in nonfunctional interface components."}]},{"cat":"04","type":"mcq","stem":"Which hardware platform is characterized by stationary operation and is most suitable for office-related, time-consuming, or crucial multitasking operations?","sub":"platform-task-matching","options":[{"t":"Kiosks / Installations","c":false,"fb":"M2: Kiosks handle public, limited-interaction selection and monitoring tasks."},{"t":"Tablet / Pads","c":false,"fb":"M1: Tablets are mobile devices geared toward short tasks requiring larger viewports."},{"t":"Desktop","c":true,"fb":"Desktop platforms provide stationary setups suited for documentation, research, and multitasking."},{"t":"TV / Consoles","c":false,"fb":"M2: Consoles are stationary platforms focused on TV-centric, privacy-sensitive, limited interaction."}]},{"cat":"04","type":"scenario","stem":"Which hardware platform best matches these operational requirements?","sub":"platform-task-matching","context":"A field sales representative travels between client sites daily to conduct short product presentations and review interactive territory route maps, requiring a mobile device with a relatively larger screen than a phone.","options":[{"t":"Embedded","c":false,"fb":"M3: Embedded platforms handle on-the-spot computation like printers and copiers."},{"t":"Desktop","c":false,"fb":"M1: Desktops are stationary systems for intensive office documentation."},{"t":"Tablet / Pads","c":true,"fb":"Mobile platforms designed for simple, short tasks requiring a relatively larger screen (e.g., sales pitches)."},{"t":"TV / Consoles","c":false,"fb":"M2: TV/consoles are stationary platforms designed for TV-centric entertainment."}]},{"cat":"04","type":"multi","stem":"Which of the following hardware platforms operate strictly in a stationary mode? Select the TWO correct items.","sub":"platform-mode-classification","options":[{"t":"Desktop","c":true,"fb":"Desktops operate in a stationary office/desk environment."},{"t":"Smartphones / Handheld","c":false,"fb":"Smartphones operate in a mobile mode."},{"t":"Virtual Reality","c":true,"fb":"Virtual reality setups (e.g., VizBox, Virtual Dome) operate in a stationary mode."},{"t":"Tablet / Pads","c":false,"fb":"Tablets operate in a mobile mode."},{"t":"Free Form","c":false,"fb":"Free form platforms can operate in both stationary and mobile modes."}]},{"cat":"04","type":"scenario","stem":"How is this hardware platform categorized?","sub":"platform-task-matching","context":"A defense engineering unit is designing a customized tactical helmet for field commanders that integrates specialized command-and-control sensors and heads-up displays, supporting both stationary base operations and mobile field deployments.","options":[{"t":"Embedded","c":false,"fb":"M3: Embedded systems are dedicated devices performing on-the-spot computation (e.g., printers)."},{"t":"Kiosks / Installations","c":false,"fb":"M2: Kiosks are stationary public installations for limited selection tasks."},{"t":"Free Form","c":true,"fb":"Special-purpose hardware with customized configurations operating in stationary and mobile modes."},{"t":"Desktop","c":false,"fb":"M1: Desktops are stationary consumer/office platforms, not customized military wearable configurations."}]},{"cat":"04","type":"mcq","stem":"Which hardware platform operates in BOTH stationary and mobile modes?","sub":"platform-mode-classification","options":[{"t":"Kiosks / Installations","c":false,"fb":"M1: Kiosks operate strictly in a stationary mode."},{"t":"TV / Consoles","c":false,"fb":"M1: Consoles operate strictly in a stationary mode."},{"t":"Embedded","c":true,"fb":"Embedded platforms operate in both stationary and mobile modes for on-the-spot computation."},{"t":"Desktop","c":false,"fb":"M2: Desktops operate exclusively in a stationary mode."}]},{"cat":"04","type":"mcq","stem":"What is the primary purpose of software interface components within an interactive system?","sub":"software-components-definition","options":[{"t":"Executing backend business logic calculations and database storage routines","c":false,"fb":"M1: Interface components mediate user interaction, while backend logic processes and stores data."},{"t":"Breaking the complexity of a software by providing an easy interaction to the user","c":true,"fb":"Software interface components are means to break software complexity through easy interaction."},{"t":"Providing physical hardware housing and electronic circuitry for the computer","c":false,"fb":"M2: Physical housing and circuitry are hardware engineering elements, not software interface components."},{"t":"Standardizing the visual marketing brand identity and corporate color palette","c":false,"fb":"M1: Brand styling is a marketing concern, whereas UI components exist to facilitate user interaction."}]},{"cat":"04","type":"fitb","stem":"The acronym ____ represents the fundamental graphical user interface elements: windows, icons, menus, and pointer.","sub":"wimp","subtype":"term","answer":["WIMP"],"caseSensitive":false,"fb":"WIMP stands for Windows, Icons, Menus, and Pointer, which drove widespread computer technology adoption."},{"cat":"04","type":"mcq","stem":"Software interface components are sometimes alternatively referred to as which of the following?","sub":"software-components-definition","options":[{"t":"User interface components","c":true,"fb":"Software interface components are sometimes referred to as user interface components."},{"t":"Hardware interaction platforms","c":false,"fb":"M2: Hardware interaction platforms refer to physical devices (desktop, mobile, tablet), not software UI components."},{"t":"Application task structures","c":false,"fb":"M1: Task structures represent sequential activity relationships modeled during scenario design."},{"t":"System requirements benchmarks","c":false,"fb":"M1: Requirements benchmarks belong to requirement analysis, not the naming of UI components."}]},{"cat":"04","type":"mcq","stem":"Which set of elements forms the foundational WIMP interface paradigm?","sub":"wimp","options":[{"t":"Widgets, Icons, Menus, and Pointer","c":false,"fb":"M1: W represents Windows, not Widgets."},{"t":"Windows, Icons, Menus, and Pointer","c":true,"fb":"WIMP stands precisely for Windows, Icons, Menus, and Pointer."},{"t":"Windows, Interfaces, Menus, and Mouse","c":false,"fb":"M1: I represents Icons and P represents Pointer; M represents Menus, not Mouse."},{"t":"Wireframes, Icons, Menus, and Pointer","c":false,"fb":"M1: W represents Windows, not Wireframes."}]},{"cat":"04","type":"mcq","stem":"How do modern desktop operating systems and small-screen mobile devices typically differ in handling windows?","sub":"windows-layers","options":[{"t":"Desktops support overlapping windows, whereas small mobile displays use nonoverlapping windows","c":true,"fb":"Modern desktop computers allow overlapping windows; small displays use nonoverlapping windows."},{"t":"Mobile displays rely on overlapping windows, whereas desktops restrict apps to nonoverlapping panes","c":false,"fb":"M1: Reverses the platforms; small screens use nonoverlapping views to fit display constraints."},{"t":"Both desktops and mobile devices require overlapping windows to interface multiple subtasks simultaneously","c":false,"fb":"M1: Mobile devices avoid overlapping windows due to limited display size."},{"t":"Mobile devices allow flipping between applications, whereas desktops are restricted to running a single subtask","c":false,"fb":"M2: Desktops routinely run multiple applications and subtasks simultaneously."}]},{"cat":"04","type":"scenario","stem":"Which interface mechanism allows several subtasks of a single application to be handled simultaneously?","sub":"windows-layers","context":"A developer is building a complex desktop application where a user must monitor a live data feed while simultaneously editing a record and checking system logs.","options":[{"t":"Interfacing subtasks through multiple windows or layers","c":true,"fb":"Several subtasks can be needed simultaneously and interfaced through multiple windows or layers."},{"t":"Replacing visual windows with sequential audio earcon alerts","c":false,"fb":"M2: Earcons provide brief auditory cues for events, not visual working areas for subtasks."},{"t":"Forcing all subtask interactions into a single text box","c":false,"fb":"M1: Text boxes capture alphanumeric text input, not concurrent visual application processes."},{"t":"Collapsing all application processes into a static toolbar icon","c":false,"fb":"M1: Icons represent applications compactly but do not provide simultaneous working areas."}]},{"cat":"04","type":"fitb","stem":"In aural modality, an ____ serves as an auditory icon for people with special needs, emitting a brief distinctive sound to represent a specific event.","sub":"icon-variants","subtype":"term","answer":["earcon"],"caseSensitive":false,"fb":"An earcon is a brief distinctive sound representing a specific event or conveying information."},{"cat":"04","type":"mcq","stem":"Which icon variant, introduced in the Windows Metro-style interface, dynamically changes its visual appearance to display relevant, updated information?","sub":"icon-variants","options":[{"t":"Earcon","c":false,"fb":"M1: An earcon is an auditory sound cue for events, not a visual dynamic graphic."},{"t":"Tile","c":true,"fb":"A Metro-style icon that updates its appearance dynamically with useful information."},{"t":"Toolbar","c":false,"fb":"M2: A toolbar is a collection of static buttons or icons for command execution."},{"t":"Scrollbar","c":false,"fb":"M2: A scrollbar navigates through lengthy content rather than dynamically displaying info."}]},{"cat":"04","type":"mcq","stem":"A system emits a short sound cue when a file transfer fails and plays a custom audio chime during system startup. What are these audio cues called?","sub":"icon-variants","options":[{"t":"Pictograms","c":false,"fb":"M1: Pictograms are visual graphical images, not sound effects."},{"t":"Earcons","c":true,"fb":"Earcons are brief distinctive sounds representing events or conveying system status."},{"t":"Image maps","c":false,"fb":"M1: Image maps are 2D graphical arrays used for spatial visual selection."},{"t":"Text boxes","c":false,"fb":"M1: Text boxes are visual GUI input components for typing alphanumeric characters."}]},{"cat":"04","type":"mcq","stem":"After activating a menu, what intermediate subtask must a user perform before they can select a specific menu item?","sub":"menus-subtasks","options":[{"t":"Scanning the items","c":true,"fb":"Menu item selection involves activating the menu, scanning the items, and selecting an item."},{"t":"Executing a direct manipulation drag gesture","c":false,"fb":"M1: Dragging is a pointer manipulation gesture, not a subtask within menu item selection."},{"t":"Entering shortcut parameters into a text box","c":false,"fb":"M1: Parameter entry belongs to alphanumeric input controls, not standard menu item selection."},{"t":"Toggling the window between overlapping and tiled display","c":false,"fb":"M1: Toggling window layouts manages display area, not the process of selecting a menu item."}]},{"cat":"04","type":"mcq","stem":"Which list correctly outlines the three sequential subtasks involved in selecting an item from a menu?","sub":"menus-subtasks","options":[{"t":"Selecting an item, scanning the layout, and closing the menu","c":false,"fb":"M2: Selection is the final subtask and cannot occur before scanning the items."},{"t":"Activating the menu, scanning the items, and selecting an item","c":true,"fb":"The standard three subtasks are activating the menu, scanning items, and selecting an item."},{"t":"Activating the menu, typing an alphanumeric command, and clicking save","c":false,"fb":"M1: Typing commands and saving are text/file operations, not the subtasks of selecting a menu item."},{"t":"Scanning the application window, dragging the cursor, and pressing enter","c":false,"fb":"M1: General cursor movement and keyboard entry do not define the specific subtasks of menu selection."}]},{"cat":"04","type":"mcq","stem":"Which menu style is best suited for presenting a top-level, main categorical menu?","sub":"menu-style-usage","options":[{"t":"Pop-up","c":false,"fb":"M2: Pop-up menus are object-specific and context-specific."},{"t":"Pull-down","c":true,"fb":"Pull-down menus are used for top-level (main) categorical menus."},{"t":"Aural","c":false,"fb":"M4: Aural menus are used for telemarketing and users with disabilities."},{"t":"Scroll","c":false,"fb":"M3: Scroll menus are specifically used for long menus containing many items."}]},{"cat":"04","type":"scenario","stem":"Which menu style is appropriate for this context?","sub":"menu-style-usage","context":"A software developer is designing a diagramming tool where right-clicking an individual visual object must immediately reveal options specific only to that selected object.","options":[{"t":"Pop-up","c":true,"fb":"Pop-up menus are object-specific and context-specific."},{"t":"Pull-down","c":false,"fb":"M2: Pull-down menus provide main top-level categorical options across the application."},{"t":"Aural menu","c":false,"fb":"M4: Aural menus are voice/audio menus used in telemarketing and accessibility settings."},{"t":"Tabs","c":false,"fb":"M3: Tabs provide categorical navigation using a file-folder metaphor."}]},{"cat":"04","type":"multi","stem":"Which of the following actions are recognized forms of direct manipulation through pointer interaction? Select the THREE correct items.","sub":"direct-pointer-interaction","options":[{"t":"Drag and drop","c":true,"fb":"Drag and drop is an established form of direct manipulation."},{"t":"Copy and paste","c":true,"fb":"Copy and paste represents direct manipulation via virtual touch."},{"t":"Rubber banding","c":true,"fb":"Rubber banding (selection bounding) is a classic direct manipulation technique."},{"t":"Compiling source code","c":false,"fb":"Compiling code is a batch build process, not pointer direct manipulation."},{"t":"Terminal shell piping","c":false,"fb":"Shell piping is a command-line interface mechanism."}]},{"cat":"04","type":"mcq","stem":"How did the introduction of the mouse fundamentally alter human-computer interaction compared to earlier keyboard command interfaces?","sub":"direct-pointer-interaction","options":[{"t":"It required users to type command-line syntax through a virtual onscreen keyboard","c":false,"fb":"M1: The mouse introduced direct visual manipulation, moving away from command syntax."},{"t":"It allowed users to apply a direct metaphoric \"touch\" to target objects","c":true,"fb":"The mouse replaced typing text commands with a direct metaphoric touch."},{"t":"It replaced graphical visual abstractions with physical touch sensors on display monitors","c":false,"fb":"M2: The mouse provided a metaphoric virtual touch, not physical touchscreen hardware."},{"t":"It restricted user navigation to sequentially tabbing through alphanumeric text fields","c":false,"fb":"M1: Sequential field tabbing is a keyboard navigation method, not pointer-based direct touch."}]},{"cat":"04","type":"mcq","stem":"Which menu type employs a file-folder metaphor to organize categorical navigation?","sub":"menu-style-usage","options":[{"t":"Hot keys","c":false,"fb":"M4: Hot keys provide keyboard shortcut sequences for expert users."},{"t":"Tabs","c":true,"fb":"Tabs utilize a file-folder metaphor for organizing categorical menus."},{"t":"Toolbar","c":false,"fb":"M2: Toolbars organize small groups of functional and operational icons."},{"t":"Scroll me : High-fidelity visual styling happens after wireframe layouts are approved."},{"t":"In the final deployment phase, to evaluate user satisfaction benchmarks on the live production build","c":false,"fb":"M2: Live user evaluation takes place after implementation, not during initial wireframing."}]},{"cat":"04","type":"scenario","stem":"Why is wireframing the appropriate technique for this task?","sub":"wireframing","context":"A designer needs to map where content and navigation buttons will sit on an e-commerce checkout screen. The project manager requests rapid structural revisions and client sign-off before any graphic branding, color schemes, or high-fidelity prototypes are produced.","options":[{"t":"It produces high-fidelity interactive animations that simulate the final checkout transaction","c":false,"fb":"M1: Wireframing uses basic shapes to plan structure, not high-fidelity visual simulations."},{"t":"It uses basic shapes to block out elements simply, enabling quick iteration and early approval","c":true,"fb":"Wireframing leverages simplicity with basic shapes to facilitate rapid iteration and approval."},{"t":"It automatically generates production frontend source code directly from structural layouts","c":false,"fb":"M1: Wireframes serve as layout guides for communication, not automated code generators."},{"t":"It conducts automated user testing to validate backend database transaction security","c":false,"fb":"M2: Wireframing establishes page layout hierarchy before functional prototypes and databases exist."}]},{"cat":"04","type":"multi","stem":"Which of the following are recognized wireframing tools? Select the THREE correct items.","sub":"wireframing","options":[{"t":"Fluid UI","c":true,"fb":"Fluid UI is a recognized wireframing tool."},{"t":"Sketch","c":true,"fb":"Sketch is a recognized design and wireframing tool."},{"t":"Adobe XD","c":true,"fb":"Adobe XD is a recognized wireframing and prototyping tool."},{"t":"VizBox","c":false,"fb":"VizBox is an example of a virtual reality platform, not a wireframing tool."},{"t":"Virtual Dome","c":false,"fb":"Virtual Dome is an example of a virtual reality platform, not a wireframing tool."}]},{"cat":"04","type":"mcq","stem":"What foundational design principle gives wireframing its effectiveness during early interface development?","sub":"wireframing","options":[{"t":"Comprehensive visual polish using final color palettes and detailed graphics","c":false,"fb":"M1: Adding visual polish too early slows down iteration and distracts from structural hierarchy."},{"t":"Simplicity achieved by blocking out elements with basic shapes","c":true,"fb":"The power of wireframing lies in simplicity, blocking out elements with basic shapes for rapid iteration."},{"t":"Fully functional interactive widgets that execute live database transactions","c":false,"fb":"M1: Live data transactions belong to functional prototypes and production systems."},{"t":"Pixel-perfect typographic styling that strictly mirrors final print branding","c":false,"fb":"M1: Precise typography is finalized during detailed visual design, not early wireframing."}]}]};

// Every question declares its own `cat` key in the pack. Anything
// with a missing/unknown key becomes 'other' (excluded from exam
// simulation, still reachable in normal practice mode).
BANK.forEach(q => {
  if (!q.cat || !CATEGORIES.some(c => c.key === q.cat)) q.cat = 'other';
});

// ── Sub-topic (variant) groups ──────────────────────────────────
// Questions that carry the same `sub` key inside the same category
// are VARIANTS OF ONE CONCEPT — three different ways of asking about
// the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Java syntax highlighting for the code box.
// Tokenises the RAW source and escapes each token as it wraps it. Never run
// a highlighter over already-escaped HTML -- it tears &quot; and &lt; apart.
// Comments and strings come first in the alternation, so a keyword sitting
// inside a string or a comment is not coloured.
const JAVA_KEYWORDS = /^(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|record|sealed|permits|yield)$/;
const JAVA_TOKEN_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function highlightJava(src) {
  let out = '', last = 0, m;
  JAVA_TOKEN_RE.lastIndex = 0;
  while ((m = JAVA_TOKEN_RE.exec(src)) !== null) {
    if (m.index > last) out += escapeHtml(src.slice(last, m.index));
    const txt = m[0];
    let cls = null;
    if (m[1]) cls = 'tok-comment';
    else if (m[2]) cls = 'tok-string';
    else if (m[3]) cls = 'tok-annot';
    else if (m[4]) cls = 'tok-num';
    else if (m[5]) {
      if (JAVA_KEYWORDS.test(m[5])) cls = 'tok-kw';
      else if (/^[A-Z]/.test(m[5])) cls = 'tok-type';
    }
    out += cls ? `<span class="${cls}">${escapeHtml(txt)}</span>` : escapeHtml(txt);
    last = m.index + txt.length;
  }
  if (last < src.length) out += escapeHtml(src.slice(last));
  return out;
}

// Highlight only what we can actually parse. Anything not tagged java --
// pseudocode, plain text -- falls through to the plain escaped path.
function renderCodeBody(code, lang) {
  const src = String(code).trim();
  return (lang && String(lang).toLowerCase() === 'java') ? highlightJava(src) : escapeHtml(src);
}

function formatInline(s) {
  if (!s) return '';
  return String(s).replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const badge = (lang ? lang.toUpperCase() + ' ' : '') + 'CODE';
    return `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${renderCodeBody(code, lang || 'java')}</code></pre></div>`;
  });

  // 2. Inline code backticks `code`
  text = text.replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

function updateSetupSummary() {

  if (state.examMode) {
    const plan   = examPlan();

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? BANK.filter(q => state.focusedCats.includes(q.cat)) : BANK;
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}
