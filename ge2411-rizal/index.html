g the four factors behind the Rizal Law? Select the TWO factors.","sub":"four-factors-national-identity","options":[{"t":"Counteracting Colonial Mentality","c":true,"fb":"Overcoming mental subordination from centuries of foreign rule was a core aim."},{"t":"Response to Contemporary Issues","c":true,"fb":"Deriving historical guidance to address 1950s challenges was an explicit objective."},{"t":"Adoption of Universal Spanish Literacy","c":false,"fb":"Language assimilation was never among the four foundational factors."},{"t":"Enforcement of Religious Orthodoxy","c":false,"fb":"The law countered religious censorship rather than establishing dogma."},{"t":"Integration into Regional Treaties","c":false,"fb":"Foreign diplomatic alignments did not motivate this educational reform."}]},{"cat":"01-1","type":"multi","stem":"Which THREE colonial powers ruled the Philippines and influenced the mindset targeted by the law? Select the THREE colonial powers.","sub":"four-factors-national-identity","options":[{"t":"Spanish colonial rule","c":true,"fb":"Three centuries of Spanish colonization deeply affected cultural self-esteem."},{"t":"American colonial rule","c":true,"fb":"Decades of American governance reinforced widespread cultural dependency."},{"t":"Japanese occupation rule","c":true,"fb":"The wartime occupation contributed further trauma and psychological instability."},{"t":"British colonial rule","c":false,"fb":"The brief 1762 occupation of Manila is not listed among the major eras in the text."},{"t":"Portuguese imperial rule","c":false,"fb":"Portugal never colonized or administered the Philippine archipelago."}]},{"cat":"01-2","type":"mcq","stem":"In which year was the Suez Canal completed in Egypt?","sub":"suez-canal-opening-year","options":[{"t":"1869","c":true,"fb":"The Suez Canal officially opened for international navigation in 1869."},{"t":"1872","c":false,"fb":"Associates with the year of the Cavite Mutiny and GomBurZa execution."},{"t":"1821","c":false,"fb":"Corresponds to the year Mexico achieved independence from Spain."},{"t":"1896","c":false,"fb":"Marks the outbreak of the revolution and Rizal's execution."}]},{"cat":"01-2","type":"mcq","stem":"When did the inauguration of the Suez Canal dramatically shorten travel time between Europe and the Philippines?","sub":"suez-canal-opening-year","options":[{"t":"In 1869","c":true,"fb":"The Suez Canal opened in 1869, drastically reducing the travel time from Europe to Manila."},{"t":"In 1872","c":false,"fb":"The year 1872 is marked by the Cavite Mutiny and the GomBurZa execution."},{"t":"In 1821","c":false,"fb":"Marks the year Mexican independence severed the traditional Manila-Acapulco route."},{"t":"In 1887","c":false,"fb":"Marks the year Noli Me Tangere was published in Berlin."}]},{"cat":"01-2","type":"mcq","stem":"Which two bodies of water does the Suez Canal connect?","sub":"suez-canal-waterway-connection","options":[{"t":"The Mediterranean Sea and the Red Sea","c":true,"fb":"The canal links the Mediterranean and Red seas to bypass Africa."},{"t":"The Atlantic Ocean and the Pacific Ocean","c":false,"fb":"Describes the Panama Canal rather than the Egyptian waterway."},{"t":"The Baltic Sea and the North Sea","c":false,"fb":"Describes the Kiel Canal in northern Europe."},{"t":"The Black Sea and the Aegean Sea","c":false,"fb":"Describes the Turkish Straits linking the Black and Aegean seas."}]},{"cat":"01-2","type":"scenario","stem":"Which two bodies of water did this vessel traverse through the canal?","sub":"suez-canal-waterway-connection","context":"In 1870, a commercial steamship transports passengers directly from Barcelona to Manila through Egypt without rounding the African continent.","options":[{"t":"The Mediterranean Sea and the Red Sea","c":true,"fb":"The artificial canal directly connects the Mediterranean and Red seas."},{"t":"The Caribbean Sea and the Pacific Ocean","c":false,"fb":"Describes the transit passage of the Central American Panama Canal."},{"t":"The Baltic Sea and the English Channel","c":false,"fb":"These northern European waters do not lead directly into Asia."},{"t":"The Arabian Sea and the Persian Gulf","c":false,"fb":"The Persian Gulf does not provide a direct corridor into Europe."}]},{"cat":"01-2","type":"mcq","stem":"How did the completion of the Suez Canal alter maritime transit between Europe and Asia?","sub":"suez-canal-travel-impact","options":[{"t":"It eliminated the need to navigate around Africa.","c":true,"fb":"Ships sailed directly through Egypt rather than circling the Cape of Good Hope."},{"t":"It required vessels to sail through the Arctic Circle.","c":false,"fb":"The waterway is located in tropical Egypt, nowhere near polar routes."},{"t":"It restricted all oceanic navigation strictly to steamships.","c":false,"fb":"Sailing vessels initially used the waterway alongside early commercial steamers."},{"t":"It forced all Asian trade through Acapulco harbors.","c":false,"fb":"The canal bypassed trans-Pacific American routes entirely."}]},{"cat":"01-2","type":"mcq","stem":"Which long-standing trans-Pacific shipping route was rendered obsolete by the Suez Canal?","sub":"suez-canal-travel-impact","options":[{"t":"The Manila-Acapulco galleon route","c":true,"fb":"Direct Mediterranean transit made the older trans-Pacific route commercially unviable."},{"t":"The Cape Town to Lisbon spice route","c":false,"fb":"The Cape route was bypassed rather than being a trans-Pacific galleon line."},{"t":"The Transatlantic triangular slave route","c":false,"fb":"Describes the Atlantic commerce between Europe, Africa, and the Americas."},{"t":"The Arctic Northeast navigation passage","c":false,"fb":"Polar routes were never part of regular Spanish colonial trade."}]},{"cat":"01-2","type":"multi","stem":"Which TWO developments occurred in the Philippines following the opening of the Suez Canal? Select the TWO correct outcomes.","sub":"suez-canal-four-results","options":[{"t":"The Philippines became closer to Europe.","c":true,"fb":"Travel time between Spain and Manila decreased from months to weeks."},{"t":"An increased volume of European travelers arrived.","c":true,"fb":"Direct navigation encouraged many foreign merchants and travelers to visit."},{"t":"The Manila-Acapulco galleon trade expanded dramatically.","c":false,"fb":"The galleon route was rendered completely obsolete by new transit routes."},{"t":"Spain completely abolished all colonial export duties.","c":false,"fb":"Colonial taxation persisted and increased despite improved trade links."},{"t":"The Philippine archipelago gained self-governing dominion status.","c":false,"fb":"Political administration remained strictly subordinate to Madrid."}]},{"cat":"01-2","type":"multi","stem":"Which TWO intellectual and social developments followed the opening of the Suez Canal? Select the TWO social outcomes.","sub":"suez-canal-four-results","options":[{"t":"An exodus of liberal European ideas to the islands","c":true,"fb":"Modern concepts of democracy, human rights, and liberty entered the colony."},{"t":"An increased number of Filipinos studying abroad","c":true,"fb":"Wealthier families took advantage of faster sea routes to educate sons in Europe."},{"t":"Total prohibition against foreign travel for colonials","c":false,"fb":"Faster travel links facilitated overseas journeys rather than prohibiting them."},{"t":"Mandatory closure of all provincial higher learning academies","c":false,"fb":"Educational institutions expanded rather than being shut down."},{"t":"Universal conversion of native elites to Protestantism","c":false,"fb":"Filipino students remained Catholic while engaging with modern secular thought."}]},{"cat":"01-2","type":"mcq","stem":"What defines agricultural products classified as cash crops?","sub":"cash-crops-definition","options":[{"t":"Crops grown primarily for sale and commercial profit","c":true,"fb":"Cash crops are cultivated for large-scale domestic and international market revenue."},{"t":"Crops grown exclusively for immediate family subsistence","c":false,"fb":"Confuses commercial cash crops with small-scale peasant subsistence farming."},{"t":"Wild plants harvested without systematic cultivation","c":false,"fb":"Cash crops required organized large plantations and systematic agricultural labor."},{"t":"Food reserved solely for domestic livestock feeding","c":false,"fb":"Cash crops targeted human commercial consumption across global markets."}]},{"cat":"01-2","type":"mcq","stem":"In 19th-century colonial agriculture, cash crops were cultivated primarily for:","sub":"cash-crops-definition","options":[{"t":"Large-scale commercial sale and export profit","c":true,"fb":"Cash crops were grown as lucrative commodities for domestic and global markets."},{"t":"Immediate consumption by isolated rural farm households","c":false,"fb":"Subsistence farming focuses on personal consumption rather than market profits."},{"t":"Scientific testing in royal botanical conservatories","c":false,"fb":"Plantations served commercial export markets, not experimental greenhouses."},{"t":"Religious offerings during annual monastic festivals","c":false,"fb":"Harvests were traded with European and American merchant corporations."}]},{"cat":"01-2","type":"mcq","stem":"Which of the following was a major cash crop cultivated in the Philippines for Western export?","sub":"cash-crops-cultivated-types","options":[{"t":"Sugarcane crop","c":true,"fb":"Sugarcane was one of the premier export crops grown on large Luzon estates."},{"t":"Wheat grain","c":false,"fb":"Wheat is a temperate cereal crop not cultivated as a tropical Philippine export."},{"t":"Barley grain","c":false,"fb":"Barley was not grown as a commercial crop in the archipelago's climate."},{"t":"Rye grain","c":false,"fb":"Rye is a northern European grain unsuitable for tropical plantation agriculture."}]},{"cat":"01-2","type":"multi","stem":"Which THREE agricultural products were cultivated as major Philippine cash crops? Select the THREE cultivated cash crops.","sub":"cash-crops-cultivated-types","options":[{"t":"Sugarcane cultivated for export","c":true,"fb":"Sugar became one of the most lucrative export crops of 19th-century plantations."},{"t":"Abaca cultivated for rope making","c":true,"fb":"Manila hemp was in tremendous demand among Western maritime commercial fleets."},{"t":"Tobacco cultivated for export","c":true,"fb":"Tobacco generated vast revenue through extensive commercial agricultural estates."},{"t":"Wheat cultivated for local bread","c":false,"fb":"Wheat was not a major cash crop cultivated in tropical Philippine agriculture."},{"t":"Barley cultivated for brewing","c":false,"fb":"Barley cultivation was not suited to the local climate and was never an export staple."}]},{"cat":"01-2","type":"mcq","stem":"In which year did Mexico gain independence from Spain, hastening the end of the galleon trade?","sub":"mexico-independence-1821","options":[{"t":"1821","c":true,"fb":"Mexico achieved independence from Spain in 1821, severing the Acapulco trade link."},{"t":"1869","c":false,"fb":"Corresponds to the opening of the Suez Canal in Egypt."},{"t":"1872","c":false,"fb":"Marks the year of the Cavite Mutiny and the execution of GomBurZa."},{"t":"1898","c":false,"fb":"Marks the end of Spanish colonial rule in the Philippines."}]},{"cat":"01-2","type":"mcq","stem":"Which 1821 geopolitical event severed the American terminus of the Manila galleons?","sub":"mexico-independence-1821","options":[{"t":"The independence of Mexico from Spain","c":true,"fb":"Mexican independence severed the American terminus of the trans-Pacific galleons."},{"t":"The outbreak of the American Civil War","c":false,"fb":"The American conflict occurred four decades later in the 1860s."},{"t":"The signing of the Treaty of Paris","c":false,"fb":"The Spanish-American treaty occurred at the end of the century in 1898."},{"t":"The French invasion of the Netherlands","c":false,"fb":"European continental conflicts did not directly terminate the Acapulco galleons."}]},{"cat":"01-2","type":"mcq","stem":"What economic role was performed by an inquilino in 19th-century agrarian estates?","sub":"inquilinos-tenant-role","options":[{"t":"A tenant farmer leasing land and subleasing to workers","c":true,"fb":"Inquilinos leased large tracts from estate owners and subleased parcels to laborers."},{"t":"An appointed tax collector for the colonial treasury","c":false,"fb":"Local tax collection was administered by the cabeza de barangay, not inquilinos."},{"t":"An ordained native priest managing a local parish","c":false,"fb":"Confuses agricultural tenancy contracts with ecclesiastical parish appointments."},{"t":"A military officer commanding municipal garrisons","c":false,"fb":"Military garrisons were led by Spanish officers, not agrarian tenant farmers."}]},{"cat":"01-2","type":"mcq","stem":"What specific term designated tenant farmers who leased large hacienda lands from religious orders and subleased them to local cultivators?","sub":"inquilinos-tenant-role","options":[{"t":"Inquilinos","c":true,"fb":"Inquilinos leased estate lands from friar orders and subleased parcels to working subtenants."},{"t":"Peninsulares","c":false,"fb":"Peninsulares were Spaniards born in the Iberian peninsula holding senior colonial offices."},{"t":"Ilustrados","c":false,"fb":"Ilustrados were university-educated Filipino reformists, not agrarian estate tenant managers."},{"t":"Gobernadorcillos","c":false,"fb":"Gobernadorcillos served as native municipal town mayors, not farm leasing agents."}]},{"cat":"01-2","type":"mcq","stem":"Which religious order was prominently associated with large agricultural estates in Luzon?","sub":"friar-estates-land-takeover","options":[{"t":"The Dominicans","c":true,"fb":"The Dominican Order possessed extensive arable haciendas, including the Calamba estate."},{"t":"The Jesuits","c":false,"fb":"The Jesuits were expelled in 1768 and did not control these Luzon cash-crop estates."},{"t":"The Franciscans","c":false,"fb":"Franciscans were mendicants who traditionally avoided owning extensive landed estates."},{"t":"The Benedictines","c":false,"fb":"Benedictine monks were not among the major friar estate holders named in the text."}]},{"cat":"01-2","type":"mcq","stem":"Extensive agricultural haciendas in 19th-century Luzon were intensively acquired and controlled by:","sub":"friar-estates-land-takeover","options":[{"t":"Catholic religious orders such as Dominicans and Augustinians","c":true,"fb":"Friar corporations acquired vast arable tracts through various means in Luzon."},{"t":"Foreign British and American shipping syndicates","c":false,"fb":"Foreign merchant firms purchased exported crops but did not own monastic haciendas."},{"t":"Indio peasant co-operatives in rural provinces","c":false,"fb":"Native peasant farmers lacked capital and were tenant laborers on friar lands."},{"t":"The Royal Spanish Navy administrative staff","c":false,"fb":"The naval admiralty had no ownership or administration over interior farm estates."}]},{"cat":"01-2","type":"mcq","stem":"Which ethnic group experienced significant upward social mobility as agricultural landowners?","sub":"rise-of-chinese-mestizos","options":[{"t":"Chinese-Filipino mestizos","c":true,"fb":"Mixed Chinese-Filipino families acquired substantial wealth and agricultural estates."},{"t":"Peninsular military officers","c":false,"fb":"Peninsulares already occupied the highest colonial echelon and were not a new rising class."},{"t":"Impoverished rural indios","c":false,"fb":"Native peasant indios remained trapped in debt and exploitative tenancy."},{"t":"Dutch maritime merchants","c":false,"fb":"Dutch traders did not settle as permanent agrarian landowning classes in Luzon."}]},{"cat":"01-2","type":"mcq","stem":"How did wealthy Chinese-Filipino mestizo families utilize their accumulated cash-crop capital?","sub":"rise-of-chinese-mestizos","options":[{"t":"By sending their children to study overseas","c":true,"fb":"Affluent landowners financed advanced European higher education for their sons."},{"t":"By purchasing aristocratic estates across mainland Spain","c":false,"fb":"Wealth was invested in local landholdings and European education, not Spanish titles."},{"t":"By establishing sovereign private armies in provinces","c":false,"fb":"Private military units were strictly prohibited by Spanish colonial authorities."},{"t":"By financing Protestant missionary missions in Asia","c":false,"fb":"Mestizo families remained culturally Catholic within Spanish colonial society."}]},{"cat":"01-2","type":"scenario","stem":"Which upwardly mobile socioeconomic group in colonial society is illustrated here?","sub":"rise-of-chinese-mestizos","context":"In 19th-century Laguna, an entrepreneurial family acquires significant landed estates, controls river and road transport of export crops to Manila, and amasses wealth that funds foreign university education for their sons.","options":[{"t":"Chinese-Filipino mestizos","c":true,"fb":"Chinese-Filipino mestizos amassed agrarian wealth and funded overseas European studies."},{"t":"Peninsular colonial magistrates","c":false,"fb":"Peninsulares held state posts by appointment rather than private agrarian enterprise."},{"t":"Impoverished rural indios","c":false,"fb":"Indios were subjected to forced labor and remained impoverished under tenancy."},{"t":"Foreign British merchant syndicates","c":false,"fb":"Foreign merchant firms purchased exports but did not constitute this local class."}]},{"cat":"01-2","type":"multi","stem":"Which TWO public works infrastructure projects were expanded by the Spanish government? Select the TWO transport projects.","sub":"infrastructure-investments","options":[{"t":"Roads built to hasten crop transport from provinces to Manila","c":true,"fb":"Highways were paved to accelerate agricultural hauling to export docks."},{"t":"Railroads connecting rural provinces to urban centers","c":true,"fb":"Rail networks facilitated internal commerce and personal mobility across Luzon."},{"t":"Commercial international airports in provincial capitals","c":false,"fb":"Aviation technology did not exist during the nineteenth-century colonial era."},{"t":"Deep subway tunnels under the walled city of Manila","c":false,"fb":"Underground urban rail systems were never constructed in colonial Manila."},{"t":"Transcontinental telegraph lines directly to South America","c":false,"fb":"Communication links connected to Europe and Asia, not across the South Pacific."}]},{"cat":"01-2","type":"multi","stem":"Which TWO infrastructure developments directly improved agricultural transport in 19th-century Luzon? Select the TWO infrastructure works.","sub":"infrastructure-investments","options":[{"t":"Ports constructed to enable aquatic transport of crops","c":true,"fb":"Maritime docks were modernized to load bulk agricultural exports onto cargo ships."},{"t":"Railroad construction giving rural areas access to cities","c":true,"fb":"Trains allowed provincial farmers to reach expanding urban commercial markets."},{"t":"Hydroelectric power dams across mountain river basins","c":false,"fb":"Modern hydroelectric technology was developed decades later in the twentieth century."},{"t":"Interstate paved highways across all southern islands","c":false,"fb":"Road improvements were concentrated primarily on agricultural routes toward Manila."},{"t":"Nuclear-powered desalinization plants along coasts","c":false,"fb":"Nuclear technology did not exist in the nineteenth century."}]},{"cat":"01-2","type":"mcq","stem":"Which Spanish governor-general appointed in 1869 was known for liberal and progressive governance?","sub":"governor-general-de-la-torre","options":[{"t":"Carlos Maria de la Torre","c":true,"fb":"De la Torre championed democratic values, free speech, and inclusive civil administration."},{"t":"Rafael Izquierdo","c":false,"fb":"Izquierdo was an authoritarian ruler who governed with an Iron Fist."},{"t":"Narciso Claveria","c":false,"fb":"Claveria was famous for the 1849 surname decree decades earlier."},{"t":"Valeriano Weyler","c":false,"fb":"Weyler was known for harsh military pacification campaigns in the late 1880s."}]},{"cat":"01-2","type":"mcq","stem":"In 1869, which colonial administrator introduced democratic principles and earned the fond respect of Filipinos?","sub":"governor-general-de-la-torre","options":[{"t":"Governor-General Carlos Maria de la Torre","c":true,"fb":"De la Torre's inclusive approach earned him widespread popularity among Filipinos."},{"t":"Governor-General Rafael Izquierdo","c":false,"fb":"Izquierdo was widely feared and resented for rescinding reforms."},{"t":"Archbishop Gregorio Meliton Martinez","c":false,"fb":"Martinez was the Catholic Archbishop of Manila, not the civil governor-general."},{"t":"Sergeant Fernando La Madrid","c":false,"fb":"La Madrid was the military sergeant who led the Cavite Mutiny."}]},{"cat":"01-2","type":"scenario","stem":"Which colonial leader supported these progressive measures?","sub":"governor-general-de-la-torre","context":"In 1870, an educational reform committee proposes secularizing secondary schools and assigning qualified native secular priests to vacant provincial parishes.","options":[{"t":"Governor-General Carlos Maria de la Torre","c":true,"fb":"De la Torre supported secular education and native priest appointments to parishes."},{"t":"Governor-General Rafael Izquierdo","c":false,"fb":"Izquierdo opposed secularization and reversed progressive administrative reforms."},{"t":"Archbishop Gregorio Meliton Martinez","c":false,"fb":"Martinez was the metropolitan prelate, not the civil head of colonial government."},{"t":"Sergeant Fernando La Madrid","c":false,"fb":"La Madrid was an artillery sergeant who led the Cavite arsenal mutineers."}]},{"cat":"01-2","type":"multi","stem":"Which TWO reforms were officially implemented by Governor-General Carlos Maria de la Torre? Select the TWO reforms.","sub":"de-la-torre-reforms","options":[{"t":"Increased freedom of speech for citizens","c":true,"fb":"He relaxed censorship and permitted open public political discussion."},{"t":"Abolishment of flogging as a legal punishment","c":true,"fb":"He banned judicial flogging to uphold human dignity and civil decency."},{"t":"Total abolition of all commercial agricultural taxes","c":false,"fb":"Fiscal revenues were maintained while corporal and political abuses were curbed."},{"t":"Immediate expulsion of all Spanish religious orders","c":false,"fb":"He curtailed friar political power without expelling orders from the colony."},{"t":"Dissolution of the colonial civil guard detachments","c":false,"fb":"Civil police bodies remained active under official government command."}]},{"cat":"01-2","type":"multi","stem":"Which TWO religious and educational policies were championed by Governor-General de la Torre? Select the TWO ecclesiastical and educational reforms.","sub":"de-la-torre-reforms","options":[{"t":"Allowing secular priests to be assigned to vacant parishes","c":true,"fb":"De la Torre promoted qualified secular priests to curb friar abuse."},{"t":"Instituting educational reforms and secularizing schools","c":true,"fb":"He actively supported modernizing and secularizing educational institutions."},{"t":"Handing all university administrative chairs to friar orders","c":false,"fb":"His administration aimed to reduce monastic monopolies in higher education."},{"t":"Banning the study of Spanish language across all schools","c":false,"fb":"De la Torre promoted broader access to literacy and European thought."},{"t":"Forbidding native clergy from ministering to local parishes","c":false,"fb":"He actively championed native secular priests in parish appointments."}]},{"cat":"01-2","type":"mcq","stem":"Which Spanish governor-general was known for his authoritarian \"Iron Fist\" rule that rescinded liberal policies in 1871?","sub":"governor-general-izquierdo-iron-fist","options":[{"t":"Rafael Izquierdo","c":true,"fb":"Rafael Izquierdo instituted the repressive \"Iron Fist\" administration beginning in 1871."},{"t":"Carlos Maria de la Torre","c":false,"fb":"De la Torre was the progressive predecessor whose liberal reforms Izquierdo revoked."},{"t":"Camilo de Polavieja","c":false,"fb":"Polavieja oversaw colonial military courts and Rizal's execution in 1896."},{"t":"Fernando Primo de Rivera","c":false,"fb":"Primo de Rivera served as governor-general during the 1897 Biak-na-Bato negotiations."}]},{"cat":"01-2","type":"mcq","stem":"Which authoritarian governor-general succeeded De la Torre in 1871 and revoked his liberal decrees?","sub":"governor-general-izquierdo-iron-fist","options":[{"t":"Rafael Izquierdo","c":true,"fb":"Izquierdo took office in 1871 and swiftly rescinded progressive colonial policies."},{"t":"Carlos Maria de la Torre","c":false,"fb":"De la Torre was the progressive predecessor whom Izquierdo replaced."},{"t":"Camilo de Polavieja","c":false,"fb":"Polavieja was the governor-general during Rizal's trial and execution in 1896."},{"t":"Ramon Blanco","c":false,"fb":"Blanco was the governor-general at the outbreak of the 1896 Revolution."}]},{"cat":"01-2","type":"mcq","stem":"On what exact date did the Cavite Mutiny break out?","sub":"cavite-mutiny-details","options":[{"t":"January 20, 1872","c":true,"fb":"The uprising erupted at the Cavite arsenal on the evening of January 20, 1872."},{"t":"February 17, 1872","c":false,"fb":"Corresponds to the execution date of GomBurZa at Bagumbayan field."},{"t":"June 19, 1861","c":false,"fb":"Corresponds to the birth date of José Rizal in Calamba."},{"t":"August 23, 1896","c":false,"fb":"Marks the Cry of Pugad Lawin at the onset of the Philippine Revolution."}]},{"cat":"01-2","type":"mcq","stem":"Who commanded the contingent of approximately 200 mutineers during the 1872 Cavite arsenal uprising?","sub":"cavite-mutiny-details","options":[{"t":"Sergeant La Madrid","c":true,"fb":"Sergeant La Madrid commanded the approximately 200 mutineers at the arsenal fort."},{"t":"Father José Burgos","c":false,"fb":"Fr. Burgos was a secular priest falsely accused of conspiracy, not the military leader."},{"t":"Carlos Maria de la Torre","c":false,"fb":"De la Torre was the former governor-general, not an insurgent commander."},{"t":"Manuel Xerez-Burgos","c":false,"fb":"Xerez-Burgos was a civilian nephew who assisted Rizal with Ateneo enrollment."}]},{"cat":"01-2","type":"mcq","stem":"On what date were Fathers Gómez, Burgos, and Zamora executed by garrote?","sub":"gomburza-execution","options":[{"t":"February 17, 1872","c":true,"fb":"The three secular priests were publicly garroted at Bagumbayan on February 17, 1872."},{"t":"January 20, 1872","c":false,"fb":"Marks the eruption of the arsenal mutiny in Cavite, not the execution."},{"t":"June 12, 1898","c":false,"fb":"Commemorates the declaration of Philippine independence in Kawit, Cavite."},{"t":"December 30, 1896","c":false,"fb":"Marks the execution of Dr. José Rizal at Bagumbayan field."}]},{"cat":"01-2","type":"mcq","stem":"By what method of capital punishment were Fathers Mariano Gómez, José Burgos, and Jacinto Zamora executed in February 1872?","sub":"gomburza-execution","options":[{"t":"Public strangulation by the garrote","c":true,"fb":"GomBurZa were executed at Bagumbayan through the mechanical garrote."},{"t":"Firing squad execution by infantry troops","c":false,"fb":"Execution by firing squad was applied later to Dr. José Rizal in 1896."},{"t":"Decapitation on the municipal plaza scaffold","c":false,"fb":"Decapitation by sword or guillotine was not utilized for the priests."},{"t":"Hanging by the neck from naval dock gallows","c":false,"fb":"The Spanish judicial apparatus sentenced them to the garrote vil."}]},{"cat":"01-2","type":"mcq","stem":"What was the primary social background of leaders in the Propaganda Movement?","sub":"propaganda-movement-ilustrados","options":[{"t":"Educated young Filipino expatriates known as ilustrados","c":true,"fb":"The movement was led by intellectuals studying and writing in European capitals."},{"t":"Conservative Spanish friars managing provincial haciendas","c":false,"fb":"Friar corporations were the primary target of Propaganda Movement critiques."},{"t":"High-ranking military officers of the Spanish colonial army","c":false,"fb":"The military hierarchy enforced colonial rule and censored reformist publications."},{"t":"Landless rural laborers working on sugar plantations","c":false,"fb":"Rural laborers lacked the financial resources to organize campaigns abroad."}]},{"cat":"01-2","type":"multi","stem":"Which TWO political demands were formally championed by the Propaganda Movement? Select the TWO political goals.","sub":"propaganda-movement-ilustrados","options":[{"t":"Representation of the Philippines in the Spanish Cortes","c":true,"fb":"Expatriates sought parliamentary deputies to voice Filipino grievances in Madrid."},{"t":"Legalization of equality between Spaniards and Filipinos","c":true,"fb":"Reformers demanded equal legal rights, dignity, and protections for all colonials."},{"t":"Immediate armed overthrow of the Spanish monarchy","c":false,"fb":"The movement initially pursued peaceful reform and assimilation rather than war."},{"t":"Establishment of an independent indigenous sultanate in Luzon","c":false,"fb":"Reformers advocated modern constitutional representation within a Spanish framework."},{"t":"Banning of all trade ties with foreign merchant nations","c":false,"fb":"Ilustrados actively supported global trade and unrestricted intellectual exchange."}]},{"cat":"02","type":"mcq","stem":"On what exact date was José Rizal born in Calamba, Laguna?","sub":"birth-date-and-place","options":[{"t":"June 19, 1861","c":true,"fb":"José Rizal was born on June 19, 1861, in Calamba, Laguna."},{"t":"June 12, 1861","c":false,"fb":"Confuses his birth date with Philippine Independence Day."},{"t":"June 19, 1862","c":false,"fb":"Inaccurate year; his birth occurred in 1861."},{"t":"December 30, 1861","c":false,"fb":"Confuses his birthday with his December execution date."}]},{"cat":"02","type":"mcq","stem":"In which calendar year was José Protacio Rizal born to Francisco Mercado and Teodora Alonzo?","sub":"birth-date-and-place","options":[{"t":"In 1861","c":true,"fb":"Rizal was born on June 19, 1861, in the town of Calamba, Laguna."},{"t":"In 1863","c":false,"fb":"Year of the Manila earthquake that destroyed the cathedral, not Rizal's birth."},{"t":"In 1869","c":false,"fb":"Year the Suez Canal opened and Governor De la Torre arrived."},{"t":"In 1872","c":false,"fb":"Year of the Cavite Mutiny and the execution of the GomBurZa priests."}]},{"cat":"02","type":"mcq","stem":"Which two Catholic saints inspired the first and middle given names of Rizal?","sub":"namesake-saints","options":[{"t":"Saint Jose and Saint Protacio","c":true,"fb":"June 19 commemorates the feast days of Saint Jose and Saint Protacio."},{"t":"Saint Juan and Saint Pedro","c":false,"fb":"Confuses his calendar patron saints with Saint John and Saint Peter."},{"t":"Saint Francisco and Saint Antonio","c":false,"fb":"Mistakes his father's namesake for his calendar birth patrons."},{"t":"Saint Ignacio and Saint Domingo","c":false,"fb":"Names founders of religious orders rather than his feast-day patrons."}]},{"cat":"02","type":"multi","stem":"Which TWO saints' feast days on June 19 inspired Rizal's given baptismal names? Select the TWO Catholic saints.","sub":"namesake-saints","options":[{"t":"Saint Jose","c":true,"fb":"Saint Jose was one of the two calendar saints commemorated on June 19."},{"t":"Saint Protacio","c":true,"fb":"Saint Protacio was the second patron saint celebrated on his birth date."},{"t":"Saint Lorenzo","c":false,"fb":"Saint Lorenzo Ruiz was canonized in modern times and is not his calendar patron."},{"t":"Saint Agustin","c":false,"fb":"Saint Augustine's feast occurs in late August, not on June 19."},{"t":"Saint Miguel","c":false,"fb":"Saint Michael the Archangel is celebrated in September."}]},{"cat":"02","type":"mcq","stem":"What occupations were held by Rizal's father, Francisco Mercado?","sub":"father-don-francisco","options":[{"t":"Farmer and businessman","c":true,"fb":"Don Francisco was a tenant farmer and businessman who provided for his family."},{"t":"Provincial colonial magistrate","c":false,"fb":"Judicial magistracies were reserved for Spanish legal officials."},{"t":"Naval artillery commander","c":false,"fb":"Military commissions were held by regular Spanish officers, not local farmers."},{"t":"Secular parish priest","c":false,"fb":"Francisco Mercado was a married layman and businessman, not a cleric."}]},{"cat":"02","type":"multi","stem":"Which TWO occupations were carried out by Rizal's father, Francisco Mercado? Select the TWO occupations.","sub":"father-don-francisco","options":[{"t":"Commercial farmer","c":true,"fb":"He successfully cultivated leased lands in Calamba to support his family."},{"t":"Local businessman","c":true,"fb":"He engaged in business ventures to finance his children's education."},{"t":"University professor","c":false,"fb":"Higher university chairs were held by Spanish ecclesiastical academics."},{"t":"Imperial tax commissioner","c":false,"fb":"Imperial fiscal commissions were reserved for royal Spanish peninsulares."},{"t":"Military naval engineer","c":false,"fb":"Francisco Mercado worked in agriculture and commerce, not naval engineering."}]},{"cat":"02","type":"mcq","stem":"Which traumatic injustice suffered by his mother served as a major catalyst for Rizal's criticism of colonial rule?","sub":"mother-teodora-alonzo-injustices","options":[{"t":"Unjust imprisonment by Spanish authorities twice","c":true,"fb":"Witnessing his mother's arbitrary detention fueled his lifelong struggle against colonial injustice."},{"t":"Immediate permanent exile to the Mariana Islands","c":false,"fb":"Doña Teodora was detained locally in Laguna rather than exiled abroad."},{"t":"Total confiscation of all her family heirloom jewelry","c":false,"fb":"Her imprisonment was the primary trauma, not personal jewelry seizure."},{"t":"Public corporal punishment in the municipal plaza","c":false,"fb":"She was detained without trial rather than subjected to corporal flogging."}]},{"cat":"02","type":"mcq","stem":"How many times was Rizal's mother, Teodora Alonzo, unjustly imprisoned under Spanish colonial administration?","sub":"mother-teodora-alonzo-injustices","options":[{"t":"She was imprisoned unjustly twice.","c":true,"fb":"Doña Teodora suffered arbitrary detention twice during Spanish colonial rule."},{"t":"She was imprisoned unjustly once.","c":false,"fb":"Understates her persecution; she endured imprisonment on two separate occasions."},{"t":"She was imprisoned unjustly three times.","c":false,"fb":"Overstates the number of distinct imprisonments recorded in the text."},{"t":"She was imprisoned unjustly four times.","c":false,"fb":"Her unjust arrests were pivotal formative events in Rizal's childhood, occurring twice."}]},{"cat":"02","type":"scenario","stem":"How did this family ordeal fundamentally affect young José?","sub":"mother-teodora-alonzo-injustices","context":"In 1871, Doña Teodora Alonzo is arrested on malicious false charges and forced to walk miles to the provincial jail in Santa Cruz, Laguna.","options":[{"t":"It served as a catalyst for his criticism of Spanish governance.","c":true,"fb":"The trauma awakened his deep outrage against arbitrary colonial abuses."},{"t":"It led him to abandon formal studies and enlist in the army.","c":false,"fb":"The injustice spurred him to excel in academics rather than join the military."},{"t":"It persuaded him to become an ordained Catholic friar in Manila.","c":false,"fb":"His intellectual development was secular and highly critical of friar abuses."},{"t":"It convinced his family to immigrate permanently to Great Britain.","c":false,"fb":"The family remained rooted in Calamba while supporting José's studie // the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

/* ── Exam-blueprint helpers (engine code — no edits needed) ──────── */
// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatInline(s) {
  if (!s) return '';
  return String(s).replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const badge = (lang ? lang.toUpperCase() + ' ' : '') + 'CODE';
    return `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${escapeHtml(code.trim())}</code></pre></div>`;
  });

  // 2. Inline code backticks `code`
  text = text.replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);

  return text;
}

};

const $ = id => document.getElementById(id);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

  });
}

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? BANK.filter(q => state.focusedCats.includes(q.cat)) : BANK;
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in">';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${formatContent(q.context)}</div></div>`;
  }
  html += `<div class="qstem">${formatContent(q.stem)}</div>`;
  if (q.code) {
    const badge = q.codeEyebrow || (q.codeLang ? q.codeLang.toUpperCase() + ' CODE' : 'CODE SNIPPET');
    html += `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${escapeHtml(q.code.trim())}</code></pre></div>`;
  }

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${formatInline(q.hint)}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${formatInline(q.fb)}</div>`;
    }
    html += `</div>`;
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          cls += ' is-missed';
          marker = '\u25CB';
          tagsHtml = '<span class="opt-tag miss">Correct answer</span>';
          showFeedback = true;
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${formatInline(opt.t)}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${formatInline(opt.fb)}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('Abandon this quiz and return to setup? Your progress will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.querySelectorAll('a[href="../index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const quiz = $('view-quiz');
    if (quiz && !quiz.classList.contains('hidden')) {
      if (!confirm('Leave this quiz and return to the Reviewer Hub? Your current progress will be lost.')) {
        e.preventDefault();
      } else {
        stopTimer();
      }
    }
  });
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 24px; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    <div class="btn-row">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="../index.html" class="btn ghost">← Back to Index</a>
        <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
        <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      </div>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    state.questions = buildActiveQuiz();
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []);
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
</body>
</html>
