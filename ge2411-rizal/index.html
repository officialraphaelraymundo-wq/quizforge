ope","options":[{"t":"Immediate independence from Spain through armed resistance","c":false,"fb":"Immediate separation and armed resistance were outside the stated reformist program."},{"t":"Peaceful reform while maintaining loyalty to the Spanish Crown","c":true,"fb":"Reformists sought political and social change through peaceful means while remaining loyal to the Spanish Crown."},{"t":"Complete withdrawal from political advocacy","c":false,"fb":"Reformists actively advocated changes rather than abandoning political engagement."},{"t":"Greater colonial control without changes in Filipino rights","c":false,"fb":"The movement sought reforms addressing inequality and colonial abuses."}]},{"cat":"03-1","type":"mcq","stem":"Which publication served as the official voice of the Propaganda Movement?","sub":"lasol-official-organ","options":[{"t":"Noli Me Tangere","c":false,"fb":"Noli Me Tangere was Rizal's novel, not the movement's official publication."},{"t":"La Solidaridad","c":true,"fb":"La Solidaridad was the official publication and primary platform of the Propaganda Movement."},{"t":"El Filibusterismo","c":false,"fb":"El Filibusterismo was Rizal's second novel, not the movement's newspaper."},{"t":"The Indolence of the Filipino","c":false,"fb":"This was an essay by Rizal that appeared in La Solidaridad, not the publication itself."}]},{"cat":"03-1","type":"multi","stem":"Which TWO statements correctly describe the operation of La Solidaridad? Select the TWO correct statements.","sub":"lasol-format-language","options":[{"t":"It was published bi-weekly.","c":true,"fb":"La Solidaridad appeared on a bi-weekly publication schedule."},{"t":"It was written mainly in Spanish.","c":true,"fb":"Spanish was used to reach reformists and Spanish policymakers."},{"t":"It was published only when reformists returned to the Philippines.","c":false,"fb":"Its publication was based in Spain and followed a regular schedule despite financial struggles."},{"t":"It was written mainly for readers unable to understand Spanish.","c":false,"fb":"Its Spanish language actually limited access among many Filipinos."},{"t":"It functioned primarily as a military instruction manual.","c":false,"fb":"Its content centered on reform advocacy and criticism of colonial abuses."}]},{"cat":"03-1","type":"fitb","stem":"The language used in La Solidaridad was ____.","sub":"lasol-format-language","subtype":"term","answer":["Spanish"],"caseSensitive":false,"fb":"La Solidaridad was written in Spanish so it could address reformists and Spanish policymakers."},{"cat":"03-1","type":"scenario","stem":"Which figure best matches this role?","sub":"jaena-first-editor","context":"A reform newspaper needs an editor who is also a skilled public speaker and can use satire to criticize abuses by Spanish clergy and government officials.","options":[{"t":"Marcelo H. del Pilar","c":false,"fb":"Del Pilar was the second editor and was known for persuasive writing and efforts to unify reformists."},{"t":"Jose Rizal","c":false,"fb":"Rizal contributed important essays and commentaries but was not directly involved in the newspaper's administration."},{"t":"Graciano Lopez Jaena","c":true,"fb":"Lopez Jaena was the first editor, a skilled orator, and known for satirical criticism of the clergy and government."},{"t":"Mariano Ponce","c":false,"fb":"Ponce helped organize content and manage logistics and finances rather than serving as the first editor."}]},{"cat":"03-1","type":"multi","stem":"Which THREE sources or methods helped finance La Solidaridad? Select the THREE correct statements.","sub":"lasol-funding","options":[{"t":"Donations from Filipino expatriates and reformists","c":true,"fb":"Reformists and expatriates provided important financial support."},{"t":"Monetary support from wealthy members of the principalia","c":true,"fb":"Wealthy principalia donors helped sustain the newspaper."},{"t":"Fundraising, solicitations, and voluntary contributions","c":true,"fb":"These methods were organized to keep the publication operating."},{"t":"Guaranteed funding from the Spanish colonial government","c":false,"fb":"The paper depended on supporters rather than guaranteed colonial-government funding."},{"t":"Profits from a permanent military organization","c":false,"fb":"No military organization is identified as a source of its publication funds."}]},{"cat":"03-1","type":"mcq","stem":"Why did finances remain a recurring problem for La Solidaridad?","sub":"lasol-funding","options":[{"t":"Publication costs were high while contributors had limited resources.","c":true,"fb":"High publication costs and limited contributor resources produced persistent financial difficulty."},{"t":"Spanish policymakers prohibited reformists from accepting any donations.","c":false,"fb":"The source describes donations and fundraising rather than a ban on accepting them."},{"t":"Principalia donors refused to provide any financial assistance.","c":false,"fb":"Wealthy members of the principalia were among those who helped sustain the paper."},{"t":"The newspaper relied only on income from military essays.","c":false,"fb":"Its funding came from supporters, fundraising, and voluntary contributions."}]},{"cat":"03-1","type":"mcq","stem":"Which goal was consistent with the reformists' loyalty to the Spanish Crown?","sub":"reform-loyalty-scope","options":[{"t":"Immediate political separation from Spain","c":false,"fb":"The reform program sought changes within Spanish rule rather than immediate independence."},{"t":"Peaceful reform while seeking equality and justice","c":true,"fb":"Reformists pursued peaceful changes while maintaining loyalty to the Spanish Crown."},{"t":"Removal of all Spanish officials through armed action","c":false,"fb":"Armed removal of Spanish officials was outside the stated reformist approach."},{"t":"Creation of an independent government before reforms","c":false,"fb":"The stated objectives focused on reforms rather than establishing immediate independence."}]},{"cat":"03-1","type":"multi","stem":"Which THREE were goals of La Solidaridad? Select the THREE correct statements.","sub":"lasol-goals","options":[{"t":"Filipino representation in the Spanish Cortes","c":true,"fb":"Representation would allow Filipino grievances to be raised within the Spanish government."},{"t":"Secularization of Filipino parishes","c":true,"fb":"Reformists wanted parish control transferred from Spanish friars to secular Filipino priests."},{"t":"Equal rights for Filipinos and Spaniards","c":true,"fb":"Equality in education, justice, and civil liberties was one of the stated reforms."},{"t":"Immediate independence from Spain","c":false,"fb":"The reformists sought peaceful changes while maintaining loyalty to the Spanish Crown."},{"t":"Armed removal of Spanish authorities","c":false,"fb":"Armed action was not part of La Solidaridad's stated reform program."}]},{"cat":"03-1","type":"mcq","stem":"A reform proposal calls for Filipino grievances to be raised directly within Spain's national legislature. Which goal does this match?","sub":"lasol-goals","options":[{"t":"Secularization of parishes","c":false,"fb":"Secularization dealt with transferring parish control to secular Filipino priests."},{"t":"Equal rights","c":false,"fb":"Equal rights concerned treatment in areas such as education, justice, and civil liberties."},{"t":"Representation in the Spanish Cortes","c":true,"fb":"Representation would give Filipinos a means to present grievances within the Spanish government."},{"t":"Freedom of speech and press","c":false,"fb":"This goal concerned the ability to express concerns without fear of retribution."}]},{"cat":"03-1","type":"mcq","stem":"Which proposed change best represents the secularization goal of La Solidaridad?","sub":"lasol-goals","options":[{"t":"Transfer parish control from Spanish friars to secular Filipino priests","c":true,"fb":"This transfer was the specific reform demanded under secularization."},{"t":"Give Spanish friars seats in the Spanish Cortes","c":false,"fb":"Representation in the Cortes concerned Filipino political grievances, not increased friar representation."},{"t":"Place Filipino newspapers under parish supervision","c":false,"fb":"This would not advance the stated goal of freedom of expression or secularization."},{"t":"Transfer secular Filipino priests to Spanish-controlled offices","c":false,"fb":"Secularization concerned control of Filipino parishes, not reassignment to colonial offices."}]},{"cat":"03-1","type":"mcq","stem":"Which description correctly identifies Graciano Lopez Jaena's role in La Solidaridad?","sub":"jaena-first-editor","options":[{"t":"Second editor and lawyer known for persuasive writing","c":false,"fb":"This description belongs to another leading reformist associated with the publication."},{"t":"First editor and orator known for satirical criticism","c":true,"fb":"Lopez Jaena was the first editor, a skilled orator, and a writer of satirical critiques."},{"t":"Contributor who managed finances and used three pen names","c":false,"fb":"This describes a contributor involved in content organization and publication logistics."},{"t":"Contributor who focused on military reforms under a pen name","c":false,"fb":"Military reform was the specialization of another contributor."}]},{"cat":"03-1","type":"mcq","stem":"Which description correctly identifies Marcelo H. del Pilar's role in La Solidaridad?","sub":"delpilar-second-editor","options":[{"t":"First editor known mainly for satirical attacks","c":false,"fb":"The first-editor role and satirical reputation belonged to Lopez Jaena."},{"t":"Second editor, lawyer, and persuasive writer","c":true,"fb":"Del Pilar was the second editor, a lawyer, and was known for persuasive writing."},{"t":"Non-administrative contributor known mainly for major essays","c":false,"fb":"This describes Rizal's relationship to the publication rather than Del Pilar's editorial role."},{"t":"Financial organizer who wrote under three pen names","c":false,"fb":"Publication logistics and three pen names are associated with Mariano Ponce."}]},{"cat":"03-1","type":"mcq","stem":"Which editor sequence is correct for La Solidaridad?","sub":"delpilar-second-editor","options":[{"t":"Marcelo H. del Pilar first, Graciano Lopez Jaena second","c":false,"fb":"This reverses the stated editorial order."},{"t":"Jose Rizal first, Marcelo H. del Pilar second","c":false,"fb":"Rizal contributed writings but was not identified as an editor or administrator."},{"t":"Graciano Lopez Jaena first, Marcelo H. del Pilar second","c":true,"fb":"Lopez Jaena served as the first editor and Del Pilar succeeded him as the second."},{"t":"Graciano Lopez Jaena first, Jose Rizal second","c":false,"fb":"Rizal's role was that of a contributor rather than an editor."}]},{"cat":"03-1","type":"mcq","stem":"Which description best states Jose Rizal's role in La Solidaridad?","sub":"rizal-contributor-role","options":[{"t":"First editor of the newspaper","c":false,"fb":"The first editor was another prominent reformist."},{"t":"Essay contributor outside its administration","c":true,"fb":"Rizal was not directly involved in administration but contributed pivotal essays and commentaries."},{"t":"Manager of publication finances","c":false,"fb":"Financial and logistical duties were handled by another contributor."},{"t":"Second editor of the newspaper","c":false,"fb":"The second editor held a formal leadership role in the publication."}]},{"cat":"03-1","type":"mcq","stem":"A student claims that Rizal helped administer La Solidaridad because his writings appeared in it. Which correction is accurate?","sub":"rizal-contributor-role","options":[{"t":"Rizal administered the paper but did not contribute essays.","c":false,"fb":"This reverses the distinction between his writing role and administrative involvement."},{"t":"Rizal became an editor after contributing his first essay.","c":false,"fb":"Contributing articles did not make him an editor of the publication."},{"t":"Rizal handled logistics while other reformists supplied the writings.","c":false,"fb":"Publication logistics were associated with another contributor."},{"t":"Rizal contributed important essays and commentaries without joining its administration.","c":true,"fb":"His influence came through pivotal writings rather than an administrative position."}]},{"cat":"03-1","type":"mcq","stem":"What responsibility did Mariano Ponce perform besides writing for La Solidaridad?","sub":"lasol-contributors","options":[{"t":"Organized content and managed logistics and finances","c":true,"fb":"Ponce helped organize content and handled logistics and finances despite continuing funding problems."},{"t":"Promoted a professional Filipino military force","c":false,"fb":"Military reform was the specialty of another contributor."},{"t":"Focused mainly on labor rights and cultural preservation","c":false,"fb":"Those concerns were associated with another writer."},{"t":"Concentrated on exposing Spanish corruption under \"Jomapa\"","c":false,"fb":"That pen name and focus belonged to another contributor."}]},{"cat":"03-1","type":"mcq","stem":"Which contributor wrote under the pen name \"Taga-Ilog\" and focused on military reforms?","sub":"lasol-contributors","options":[{"t":"Pedro Paterno","c":false,"fb":"Paterno's contributions centered on cultural development and reform."},{"t":"Jose Maria Panganiban","c":false,"fb":"Panganiban used a different pen name and criticized abuses and corruption."},{"t":"Antonio Luna","c":true,"fb":"Luna used \"Taga-Ilog\" and wrote about military reforms and a professional Filipino military force."},{"t":"Mariano Ponce","c":false,"fb":"Ponce used several other pen names and also handled organizational work."}]},{"cat":"03-1","type":"multi","stem":"Which THREE descriptions of La Solidaridad contributors are accurate? Select the THREE correct statements.","sub":"lasol-contributors","options":[{"t":"Mariano Ponce used \"Naning,\" \"Kalipulako,\" and \"Tikbalang.\"","c":true,"fb":"All three were pen names used by Ponce."},{"t":"Jose Maria Panganiban used \"Jomapa\" and criticized Spanish abuses and corruption.","c":true,"fb":"Panganiban wrote under \"Jomapa\" and focused on abuses and corruption."},{"t":"Pedro Paterno wrote mainly about creating a professional Filipino military.","c":false,"fb":"Paterno's writings focused on a different area of reform."},{"t":"Isabelo de los Reyes advocated labor rights and cultural preservation.","c":true,"fb":"These were important themes in De los Reyes's contributions."},{"t":"Antonio Luna used \"Tikbalang\" for essays on cultural development.","c":false,"fb":"Both the pen name and subject are associated with other contributors."}]},{"cat":"03-1","type":"mcq","stem":"How did Marcelo H. del Pilar's preferred strategy differ from Rizal's?","sub":"rizal-delpilar-conflict","options":[{"t":"Del Pilar favored a more confrontational and politically assertive approach.","c":true,"fb":"Del Pilar supported direct political engagement with Spanish authorities."},{"t":"Del Pilar emphasized education while Rizal favored political confrontation.","c":false,"fb":"This reverses their contrasting approaches."},{"t":"Del Pilar rejected political engagement and concentrated only on cultural writing.","c":false,"fb":"His strategy involved active engagement with political authorities."},{"t":"Del Pilar supported immediate armed revolution while Rizal supported Spanish rule.","c":false,"fb":"Their dispute concerned differing reform strategies, not this contrast."}]},{"cat":"03-1","type":"mcq","stem":"What followed the leadership vote between Jose Rizal and Marcelo H. del Pilar?","sub":"rizal-delpilar-conflict","options":[{"t":"Rizal assumed editorial leadership of La Solidaridad.","c":false,"fb":"Rizal did not take over the publication's administration after the vote."},{"t":"Del Pilar gained greater support, and Rizal later distanced himself from La Solidaridad.","c":true,"fb":"Del Pilar received greater support among reformists in Spain, while Rizal withdrew to focus on his writings and efforts in the Philippines."},{"t":"Both leaders adopted a single strategy for directing the movement.","c":false,"fb":"Their differing approaches continued to create division within the movement."},{"t":"Del Pilar withdrew from the movement and left its direction to Rizal.","c":false,"fb":"This reverses the outcome of the leadership dispute."}]},{"cat":"03-1","type":"mcq","stem":"What was a central concern of \"The Philippines a Century Hence\"?","sub":"century-hence-essay","options":[{"t":"Proving that Filipinos were naturally productive despite taxation","c":false,"fb":"Questions about alleged Filipino indolence belonged to another essay."},{"t":"Calling for a professional Filipino military as the main reform","c":false,"fb":"Military reform was associated with another contributor's writings."},{"t":"Predicting the country's future and warning that reforms were needed to prevent violent revolution","c":true,"fb":"Rizal examined the future under continued Spanish rule and stressed the need for reform."},{"t":"Explaining labor rights as the main source of colonial conflict","c":false,"fb":"Labor rights were emphasized by another contributor."}]},{"cat":"03-1","type":"mcq","stem":"Which Rizal essay called for education and self-awareness while examining the Philippines' future under Spanish rule?","sub":"century-hence-essay","options":[{"t":"\"The Philippines a Century Hence\"","c":true,"fb":"The essay analyzed societal stagnation, considered the country's future, and promoted education and self-awareness."},{"t":"\"The Indolence of the Filipino\"","c":false,"fb":"That essay focused on the causes behind accusations of Filipino laziness."},{"t":"Antonio Luna's military reform essays","c":false,"fb":"Those writings addressed military organization rather than the country's long-term future."},{"t":"Pedro Paterno's cultural reform essays","c":false,"fb":"Paterno promoted cultural development but did not write the work described."}]},{"cat":"03-1","type":"mcq","stem":"What main claim did Rizal reject in \"The Indolence of the Filipino\"?","sub":"indolence-essay","options":[{"t":"Filipinos needed greater access to education.","c":false,"fb":"Education was part of the broader reform discussion rather than the stereotype challenged in this essay."},{"t":"Filipinos were inherently lazy.","c":true,"fb":"Rizal rejected the idea that indolence was an innate Filipino trait."},{"t":"Spanish officials ignored reformist political demands.","c":false,"fb":"That issue concerned the political limitations of the reform movement."},{"t":"Filipino parishes required secularization.","c":false,"fb":"Secularization was one of La Solidaridad's reform objectives."}]},{"cat":"03-1","type":"mcq","stem":"Which conditions did Rizal identify as causes that discouraged Filipino productivity and innovation?","sub":"indolence-essay","options":[{"t":"Freedom of speech, representation, and education","c":false,"fb":"These were reform aspirations rather than causes of reduced productivity."},{"t":"Cultural preservation, nationalism, and political debate","c":false,"fb":"These themes were not presented as causes of supposed indolence."},{"t":"Publication costs, leadership elections, and Spanish-language writing","c":false,"fb":"These concerned La Solidaridad's operations and internal problems."},{"t":"Forced labor, heavy taxation, and limited opportunities","c":true,"fb":"Rizal argued that oppressive colonial conditions such as these stifled Filipino potential."}]},{"cat":"03-1","type":"multi","stem":"Which THREE were successes of La Solidaridad? Select the THREE correct statements.","sub":"lasol-successes","options":[{"t":"It provided a regular platform for reformist advocacy.","c":true,"fb":"Its bi-weekly publication gave reformists a consistent way to express grievances and aspirations."},{"t":"It helped unite Filipino intellectuals and expatriates.","c":true,"fb":"It fostered solidarity among reform-minded Filipinos."},{"t":"It secured acceptance of the reformists' major demands from Spain.","c":false,"fb":"Political results remained limited despite sustained advocacy."},{"t":"It increased international awareness of Spanish abuses.","c":true,"fb":"The publication exposed colonial abuses to audiences including liberal-minded Europeans."},{"t":"It eliminated the movement's financial problems.","c":false,"fb":"Funding difficulties remained a persistent obstacle."}]},{"cat":"03-1","type":"mcq","stem":"How did La Solidaridad serve as a catalyst for Filipino nationalism?","sub":"lasol-successes","options":[{"t":"By replacing reform advocacy with plans for immediate armed revolt","c":false,"fb":"The publication remained committed to reformist advocacy."},{"t":"By restricting discussion to publication finances","c":false,"fb":"Its articles addressed much broader political and social concerns."},{"t":"By emphasizing reforms, representation, and the development of national identity","c":true,"fb":"These themes helped awaken and strengthen Filipino nationalism."},{"t":"By reducing communication between reformists in Spain and Filipinos at home","c":false,"fb":"The publication instead helped connect reform-minded Filipinos across locations."}]},{"cat":"03-1","type":"mcq","stem":"Which achievement reflects La Solidaridad's role as a bridge between reformists in Spain and Filipinos in the Philippines?","sub":"lasol-successes","options":[{"t":"It provided an advocacy platform that reached audiences in both places.","c":true,"fb":"Its publications carried reformist grievances and aspirations to readers in Spain and the Philippines."},{"t":"It ended disagreement among all leaders of the Propaganda Movement.","c":false,"fb":"Internal leadership disputes continued despite the publication's unifying role."},{"t":"It made Spanish the language understood by the majority of Filipinos.","c":false,"fb":"Its use of Spanish actually restricted access among many Filipinos."},{"t":"It caused the Spanish government to implement all requested reforms.","c":false,"fb":"Government response remained one of the movement's major limitations."}]},{"cat":"03-1","type":"multi","stem":"Which THREE conditions limited La Solidaridad's effectiveness? Select the THREE correct statements.","sub":"lasol-limitations","options":[{"t":"Unstable funding disrupted its operations.","c":true,"fb":"Persistent financial difficulties caused interruptions and restricted outreach."},{"t":"Spanish-language publication excluded many Filipinos.","c":true,"fb":"The language made the newspaper primarily accessible to the educated elite."},{"t":"International awareness exposed colonial abuses to European liberals.","c":false,"fb":"This was one of the publication's achievements."},{"t":"Internal leadership disputes weakened movement unity.","c":true,"fb":"Conflicts such as the Rizal-Del Pilar dispute harmed solidarity and effectiveness."},{"t":"Regular publication gave reformists a platform for advocacy.","c":false,"fb":"Providing an advocacy platform was a success rather than a limitation."}]},{"cat":"03-1","type":"mcq","stem":"Why was La Solidaridad considered elite-centric?","sub":"lasol-limitations","options":[{"t":"It accepted donations mainly from wealthy Filipinos.","c":false,"fb":"Wealthy donors helped support the paper, but funding sources were not the main reason for this limitation."},{"t":"It discussed only the concerns of publication editors.","c":false,"fb":"The newspaper included contributions from numerous reformists."},{"t":"It circulated exclusively among Spanish government officials.","c":false,"fb":"Its readership also included Filipino reformists in Spain and the Philippines."},{"t":"It was written in Spanish, which much of the broader Filipino population could not understand.","c":true,"fb":"The language barrier limited its reach largely to educated, Spanish-speaking Filipinos."}]},{"cat":"03-1","type":"mcq","stem":"Why did La Solidaridad have limited political impact despite its sustained advocacy?","sub":"lasol-limitations","options":[{"t":"Its writers stopped calling for political and social reforms.","c":false,"fb":"Reform advocacy remained central to the publication."},{"t":"The Spanish government largely ignored the reformists' demands.","c":true,"fb":"Spanish authorities generally failed to act on the reforms being requested."},{"t":"Its contributors refused to communicate with reformists in Spain.","c":false,"fb":"La Solidaridad actively connected reformists rather than avoiding communication."},{"t":"The publication abandoned peaceful reform in favor of armed action.","c":false,"fb":"Its stated reform objectives continued to rely on peaceful means."}]},{"cat":"03-2","type":"mcq","stem":"Which description best identifies La Liga Filipina?","sub":"liga-definition-nature","options":[{"t":"An overseas newspaper for Filipino reformers","c":false,"fb":"La Liga Filipina was an organization, not a publication."},{"t":"A revolutionary society seeking armed independence","c":false,"fb":"Armed struggle characterized the later Katipunan."},{"t":"A socio-civic group for direct Filipino reform work","c":true,"fb":"It involved Filipinos directly in reform, unity, mutual protection, and civic improvement."},{"t":"A European association limited to Filipino writers","c":false,"fb":"Its intended reach crossed social classes and regions within the Philippines."}]},{"cat":"03-2","type":"mcq","stem":"A town chapter wants to follow La Liga Filipina's civic vision. Which plan fits best?","sub":"liga-definition-nature","options":[{"t":"Organize mutual aid and community improvement across social groups","c":true,"fb":"The Liga sought cooperation, mutual protection, and civic improvement among Filipinos."},{"t":"Build an armed force to overthrow colonial rule","c":false,"fb":"The Liga pursued peaceful reform rather than armed struggle."},{"t":"Limit reform work to Filipino writers living abroad","c":false,"fb":"The Liga emphasized direct participation within the Philippines."},{"t":"Wait for colonial officials to direct local projects","c":false,"fb":"It was conceived as a grassroots movement for collective civic action."}]},{"cat":"03-2","type":"mcq","stem":"What primarily distinguished La Liga Filipina from the Propaganda Movement?","sub":"propaganda-vs-liga","options":[{"t":"The Liga operated abroad while the Propaganda Movement organized locally.","c":false,"fb":"This reverses where the two movements primarily operated."},{"t":"The Propaganda Movement worked abroad while the Liga organized Filipinos locally.","c":true,"fb":"The Liga brought reform activity directly to Filipinos in the Philippines."},{"t":"The Liga used armed struggle while the Propaganda Movement supported peaceful reform.","c":false,"fb":"The Liga itself was dedicated to peaceful advocacy."},{"t":"Both movements limited participation to Filipinos living in Europe.","c":false,"fb":"The Liga sought participation across classes and regions in the Philippines."}]},{"cat":"03-2","type":"mcq","stem":"Which organizing choice most clearly follows La Liga Filipina rather than the Propaganda Movement?","sub":"propaganda-vs-liga","options":[{"t":"Publish reform essays mainly from Europe","c":false,"fb":"Overseas advocacy was associated primarily with the Propaganda Movement."},{"t":"Keep advocacy among expatriate intellectuals","c":false,"fb":"The Liga sought broader participation within the Philippines."},{"t":"Prepare secret units for armed struggle","c":false,"fb":"Armed revolution belonged to the later radical movement."},{"t":"Build local chapters across classes and regions","c":true,"fb":"The Liga aimed to organize Filipinos directly across social and regional divisions."}]},{"cat":"03-2","type":"mcq","stem":"After moving his relatives to safety, where did Rizal begin his 1892 trip back to Manila?","sub":"rizal-return-departure","options":[{"t":"Spain","c":false,"fb":"Rizal had previously spent years in Europe, but this journey did not begin in Spain."},{"t":"France","c":false,"fb":"France was not identified as his departure point for this return."},{"t":"Hong Kong","c":true,"fb":"Rizal departed from Hong Kong after relocating his relatives there."},{"t":"Dapitan","c":false,"fb":"Dapitan became his place of exile after his arrest."}]},{"cat":"03-2","type":"fitb","stem":"Rizal returned to Manila on June 26, ____.","sub":"rizal-return-departure","subtype":"year","answer":["1892"],"caseSensitive":false,"fb":"Rizal arrived in Manila on June 26, 1892, after departing from Hong Kong."},{"cat":"03-2","type":"mcq","stem":"How was Rizal received when he arrived in Manila?","sub":"return-reception-surveillance","options":[{"t":"Filipinos admired him while Spanish officials watched him suspiciously.","c":true,"fb":"Filipinos welcomed him as a hero, but colonial authorities placed him under close surveillance."},{"t":"Filipinos opposed him while Spanish officials welcomed his activities.","c":false,"fb":"This reverses the reactions of the public and colonial authorities."},{"t":"Both Filipinos and Spanish officials treated his arrival with indifference.","c":false,"fb":"His arrival produced admiration among Filipinos and concern among officials."},{"t":"Both groups admired him without placing restrictions on his activities.","c":false,"fb":"Spanish officials viewed his motives with suspicion and hostility."}]},{"cat":"03-2","type":"scenario","stem":"Which feature of Rizal's return does this situation illustrate?","sub":"return-reception-surveillance","context":"A correspondent sees Filipinos acclaim Rizal as a hero. At the same time, Spanish officers record his meetings and movements because they fear unrest.","options":[{"t":"Public hostility accompanied official approval","c":false,"fb":"The public and official reactions are reversed in this description."},{"t":"Public admiration existed alongside official surveillance","c":true,"fb":"Rizal was admired by Filipinos while being closely monitored by Spanish authorities."},{"t":"Popular indifference ended official suspicion","c":false,"fb":"Neither public indifference nor the end of official suspicion matches the situation."},{"t":"Official neutrality allowed unrestricted organizing","c":false,"fb":"Officials remained suspicious and kept Rizal under close watch."}]},{"cat":"03-2","type":"fitb","stem":"La Liga Filipina was founded at Doroteo Ongjungco's house in ____, Manila.","sub":"liga-founding-meeting","subtype":"term","answer":["Tondo"],"caseSensitive":false,"fb":"Rizal convened the founding meeting at Doroteo Ongjungco's house in Tondo, Manila."},{"cat":"03-2","type":"mcq","stem":"At the July 3, 1892 founding meeting, what did Rizal present?","sub":"liga-founding-meeting","options":[{"t":"A plan for an armed uprising","c":false,"fb":"The Liga advocated reform without resorting to violence."},{"t":"The constitution of La Liga Filipina","c":true,"fb":"The constitution outlined the Liga's goals and organizational structure."},{"t":"A new issue of La Solidaridad","c":false,"fb":"The meeting established a civic organization rather than releasing a newspaper issue."},{"t":"A petition demanding immediate separation","c":false,"fb":"The Liga sought peaceful reforms under Spanish rule."}]},{"cat":"03-2","type":"multi","stem":"Which THREE were core aims of La Liga Filipina? Select the THREE correct statements.","sub":"liga-aims","options":[{"t":"Unite Filipinos for mutual protection","c":true,"fb":"Unity and assistance in times of need formed one of the Liga's central aims."},{"t":"Prepare fighters for an armed revolution","c":false,"fb":"The Liga promoted peaceful advocacy rather than violent rebellion."},{"t":"Promote education, agriculture, and commerce","c":true,"fb":"These activities were intended to support community development."},{"t":"Restrict reform work to overseas propaganda","c":false,"fb":"The Liga sought direct participation within the Philippines."},{"t":"Seek reforms through peaceful advocacy","c":true,"fb":"The Liga pursued reform under Spanish rule without resorting to violence."}]},{"cat":"03-2","type":"mcq","stem":"A Liga chapter opens classes and supports farmers and merchants. Which core aim is it carrying out?","sub":"liga-aims","options":[{"t":"Peaceful reform advocacy","c":false,"fb":"This aim concerned the nonviolent method used to pursue political reform."},{"t":"Unity and mutual protection","c":false,"fb":"This aim focused on Filipinos supporting one another in times of need."},{"t":"Education and development","c":true,"fb":"Education, agriculture, and commerce were promoted to uplift Filipino communities."},{"t":"Armed national liberation","c":false,"fb":"Armed liberation was not part of the Liga's stated program."}]},{"cat":"03-2","type":"mcq","stem":"Which action falls outside La Liga Filipina's stated program?","sub":"liga-aims","options":[{"t":"Coordinating mutual protection","c":false,"fb":"Mutual protection was one of the Liga's core aims."},{"t":"Supporting education programs","c":false,"fb":"Education formed part of its plan for community development."},{"t":"Promoting agriculture and commerce","c":false,"fb":"Both activities were intended to uplift Filipino communities."},{"t":"Organizing violent rebellion","c":true,"fb":"The Liga pursued peaceful reform and did not advocate violence."}]},{"cat":"03-2","type":"mcq","stem":"Who served as La Liga Filipina's first president?","sub":"liga-officers-roles","options":[{"t":"Ambrosio Salvador","c":true,"fb":"Ambrosio Salvador held the Liga's first presidency."},{"t":"Doroteo Ongjungco","c":false,"fb":"Ongjungco hosted the inaugural meeting."},{"t":"Deodato Arellano","c":false,"fb":"Arellano later held a leadership position in the Katipunan."},{"t":"Andres Bonifacio","c":false,"fb":"Bonifacio was a Liga member who later founded the Katipunan."}]},{"cat":"03-2","type":"scenario","stem":"Which pair of labels is accurate?","sub":"liga-officers-roles","context":"Students are labeling a reenactment of the July 3 meeting. One label must identify the homeowner who hosted it; another must identify the Liga's first president.","options":[{"t":"Ambrosio Salvador—host; Doroteo Ongjungco—president","c":false,"fb":"This reverses the two men's roles."},{"t":"Deodato Arellano—host; Andres Bonifacio—president","c":false,"fb":"Neither man held the assigned Liga role."},{"t":"Doroteo Ongjungco—host; Ambrosio Salvador—president","c":true,"fb":"Ongjungco provided the meeting place, while Salvador served as the first president."},{"t":"Andres Bonifacio—host; Deodato Arellano—president","c":false,"fb":"Their later Katipunan connections do not match these Liga roles."}]},{"cat":"03-2","type":"mcq","stem":"Which member of La Liga Filipina later founded the Katipunan?","sub":"bonifacio-mabini-members","options":[{"t":"Ambrosio Salvador","c":false,"fb":"Salvador served as the Liga's first president."},{"t":"Apolinario Mabini","c":false,"fb":"Mabini became known as the “Brains of the Revolution.”"},{"t":"Andres Bonifacio","c":true,"fb":"Bonifacio later founded the revolutionary Katipunan."},{"t":"Doroteo Ongjungco","c":false,"fb":"Ongjungco hosted the Liga's inaugural meeting."}]},{"cat":"03-2","type":"multi","stem":"Which TWO statements correctly describe Andres Bonifacio and Apolinario Mabini? Select the TWO correct statements.","sub":"bonifacio-mabini-members","options":[{"t":"Bonifacio served as the Liga's first president.","c":false,"fb":"Bonifacio was a member, but he did not hold that Liga office."},{"t":"Mabini was known as the “Brains of the Revolution.”","c":true,"fb":"Mabini earned this title and later played an important role in the independence movement."},{"t":"Mabini hosted the Liga's inaugural meeting.","c":false,"fb":"The meeting took place at another member's house."},{"t":"Bonifacio later founded the Katipunan.","c":true,"fb":"He helped carry former Liga ideals into a revolutionary organization."},{"t":"Both led La Liga Filipina in armed rebellion.","c":false,"fb":"The Liga itself pursued peaceful reform rather than armed struggle."}]},{"cat":"03-2","type":"mcq","stem":"What position did Deodato Arellano later hold?","sub":"deodato-arellano-role","options":[{"t":"First president of La Liga Filipina","c":false,"fb":"That office was held by another Liga member."},{"t":"First president of the Katipunan","c":true,"fb":"Arellano was a key Liga member who later became the Katipunan's first president."},{"t":"Host of the Liga's founding meeting","c":false,"fb":"The inaugural meeting was held at another member's house."},{"t":"Founder of the Cuerpo de Compromisarios","c":false,"fb":"The source identifies Arellano with the Katipunan rather than this conservative group."}]},{"cat":"03-2","type":"mcq","stem":"Which pairing correctly distinguishes the first presidents of La Liga Filipina and the Katipunan?","sub":"deodato-arellano-role","options":[{"t":"Doroteo Ongjungco—Liga; Andres Bonifacio—Katipunan","c":false,"fb":"Ongjungco was the meeting host, while Bonifacio was the Katipunan's founder."},{"t":"Deodato Arellano—Liga; Ambrosio Salvador—Katipunan","c":false,"fb":"These two presidential roles are reversed."},{"t":"Andres Bonifacio—Liga; Doroteo Ongjungco—Katipunan","c":false,"fb":"Neither man held the first presidency assigned here."},{"t":"Ambrosio Salvador—Liga; Deodato Arellano—Katipunan","c":true,"fb":"Salvador led the Liga first, while Arellano later became the Katipunan's first president."}]},{"cat":"03-2","type":"mcq","stem":"On what date was Rizal arrested after founding La Liga Filipina?","sub":"rizal-arrest-details","options":[{"t":"July 6, 1892","c":true,"fb":"Rizal was arrested on July 6, only a few days after the inaugural meeting."},{"t":"June 26, 1892","c":false,"fb":"This was the date of his return to Manila."},{"t":"July 3, 1892","c":false,"fb":"This was the date La Liga Filipina was founded."},{"t":"July 6, 1896","c":false,"fb":"The arrest followed the Liga's establishment in 1892."}]},{"cat":"03-2","type":"mcq","stem":"What accusations accompanied Rizal's July 1892 arrest?","sub":"rizal-arrest-details","options":[{"t":"Directing an armed Katipunan campaign","c":false,"fb":"The Katipunan formed after Rizal's arrest."},{"t":"Organizing the Cuerpo de Compromisarios","c":false,"fb":"This group emerged only after the Liga dissolved."},{"t":"Sedition and allegedly instigating rebellion","c":true,"fb":"Authorities used these accusations against Rizal because of his writings and activities."},{"t":"Performing medical work during his exile","c":false,"fb":"His medical work occurred later in Dapitan and was not cited as an arrest charge."}]},{"cat":"03-2","type":"multi","stem":"Which THREE concerns led Spanish officials to arrest Rizal? Select the THREE correct statements.","sub":"arrest-reasons","options":[{"t":"His novels were viewed as attacks on colonial authority.","c":true,"fb":"Noli Me Tangere and El Filibusterismo were treated as subversive writings."},{"t":"La Liga Filipina could unite Filipinos in reform.","c":true,"fb":"Authorities feared that an organized reform movement would threaten colonial stability."},{"t":"His medical work in Dapitan challenged colonial officials.","c":false,"fb":"This work occurred during the exile that followed his arrest."},{"t":"His influence encouraged nationalist sentiment.","c":true,"fb":"Officials considered his popularity among local reformists dangerous."},{"t":"His relatives had been relocated to Hong Kong.","c":false,"fb":"This was a family safety measure, not a stated reason for his arrest."}]},{"cat":"03-2","type":"mcq","stem":"Why did authorities view the formation of La Liga Filipina as threatening?","sub":"arrest-reasons","options":[{"t":"It aimed to restore only localized resistance","c":false,"fb":"The Liga represented movement toward broader national organization."},{"t":"It could unite Filipinos in organized reform","c":true,"fb":"Officials feared that collective Filipino action would threaten colonial stability."},{"t":"It operated solely among Filipino writers in Europe","c":false,"fb":"The Liga organized people directly within the Philippines."},{"t":"It immediately launched an armed revolt","c":false,"fb":"The Liga advocated peaceful reform rather than violent uprising."}]},{"cat":"03-2","type":"mcq","stem":"Spanish officials cited Noli Me Tangere and El Filibusterismo when acting against Rizal. What concern did this reflect?","sub":"arrest-reasons","options":[{"t":"His family relocation","c":false,"fb":"Moving his relatives concerned their safety before his return."},{"t":"His medical practice","c":false,"fb":"His medical work took place later during his exile."},{"t":"His agricultural projects","c":false,"fb":"These activities also belonged to his later work in Dapitan."},{"t":"His subversive writings","c":true,"fb":"Authorities viewed the novels as attacks on the colonial government and the Catholic Church."}]},{"cat":"03-2","type":"fitb","stem":"Rizal was deported to the Mindanao town of ____ for four years of exile.","sub":"dapitan-exile","subtype":"term","answer":["Dapitan"],"caseSensitive":false,"fb":"After his arrest, Rizal spent four years in exile in Dapitan, Mindanao."},{"cat":"03-2","type":"mcq","stem":"Which set of activities occupied Rizal during his four-year exile in Dapitan?","sub":"dapitan-exile","options":[{"t":"Community projects, education, and medical work","c":true,"fb":"Rizal used his exile to serve the community through these activities."},{"t":"Armed drills, weapons supply, and recruitment","c":false,"fb":"His activities in Dapitan were civic, educational, and medical rather than military."},{"t":"Overseas journalism, diplomacy, and commerce","c":false,"fb":"These were not the activities identified with his Dapitan exile."},{"t":"Colonial policing, taxation, and court service","c":false,"fb":"Rizal did not serve in these colonial government roles during exile."}]},{"cat":"03-2","type":"multi","stem":"Which TWO statements describe the split after Rizal's arrest? Select the TWO correct statements.","sub":"liga-dissolution-split","options":[{"t":"Bonifacio and other radicals formed the Katipunan.","c":true,"fb":"They adopted a revolutionary path based on armed struggle."},{"t":"The Katipunan retained peaceful reform as its sole method.","c":false,"fb":"It pursued a more radical method than the Liga."},{"t":"Conservative members established the Cuerpo de Compromisarios.","c":true,"fb":"This organization represented the more conservative former Liga members."},{"t":"La Liga continued unchanged under Rizal in Manila.","c":false,"fb":"Rizal's arrest effectively dismantled the organization."},{"t":"The Cuerpo led the shift toward armed revolution.","c":false,"fb":"The revolutionary path was taken by the radical faction."}]},{"cat":"03-2","type":"mcq","stem":"What event directly led to La Liga Filipina's dissolution and the split among its members?","sub":"liga-dissolution-split","options":[{"t":"Rizal's return from Hong Kong","c":false,"fb":"His return allowed him to establish the organization."},{"t":"The July 3 founding meeting","c":false,"fb":"This event began the Liga rather than dissolving it."},{"t":"Rizal's arrest on July 6","c":true,"fb":"His arrest dismantled the Liga and pushed former members toward separate paths."},{"t":"The completion of Rizal's exile","c":false,"fb":"The Liga had already dissolved before his four-year exile ended."}]},{"cat":"03-2","type":"mcq","stem":"What broader historical shift did La Liga Filipina represent?","sub":"historical-significance","options":[{"t":"From peaceful reform to immediate military rule","c":false,"fb":"The Liga itself remained committed to peaceful reform."},{"t":"From localized resistance to organized national effort","c":true,"fb":"It united reform-minded Filipinos around a broader national program."},{"t":"From Filipino unity to regional isolation","c":false,"fb":"The Liga attempted to overcome divisions across classes and regions."},{"t":"From domestic action to overseas-only advocacy","c":false,"fb":"Its work shifted organized reform activity directly into the Philippines."}]},{"cat":"03-2","type":"mcq","stem":"A historian traces the Philippine Revolution's intellectual preparation to a short-lived group that promoted education, social justice, and national unity. What was that group's key contribution?","sub":"historical-significance","options":[{"t":"Winning independence through its own army","c":false,"fb":"The organization did not wage a successful war for independence."},{"t":"Replacing all Spanish colonial institutions","c":false,"fb":"Its brief existence did not produce a new national government."},{"t":"Ending Spanish rule through a single uprising","c":false,"fb":"The organization pursued peaceful reform and was soon dissolved."},{"t":"Laying ideological groundwork for the Revolution","c":true,"fb":"Its principles of education, justice, and unity influenced the later revolutionary movement."}]},{"cat":"04-1","type":"fitb","stem":"José Rizal served his four-year colonial exile from 1892 to 1896 in the remote southern town of ____ in Mindanao.","sub":"dapitan-exile-setting","subtype":"term","answer":["Dapitan"],"caseSensitive":false,"fb":"Dapitan was the remote town in Mindanao where Rizal lived in exile from 1892 to 1896."},{"cat":"04-1","type":"mcq","stem":"How many years did José Rizal spend in exile in Dapitan before his departure in 1896?","sub":"dapitan-exile-setting","options":[{"t":"Four years","c":true,"fb":"Rizal was exiled to Dapitan from 1892 to 1896, lasting exactly four years."},{"t":"Two years","c":false,"fb":"Confuses his total exile duration with shorter intervals of his European stays."},{"t":"Six years","c":false,"fb":"Overestimates the duration of his four-year confinement in Mindanao."},{"t":"Eight years","c":false,"fb":"Overstates the timeline; Rizal's exile concluded when he departed in 1896."}]},{"cat":"04-1","type":"fitb","stem":"During his exile in Dapitan, Rizal purchased a piece of property in ____ using his lottery earnings.","sub":"talisay-lottery-estate","subtype":"term","answer":["Talisay"],"caseSensitive":false,"fb":"Talisay was the coastal land in Dapitan where Rizal built his home, school, and hospital using his lottery winnings."},{"cat":"04-1","type":"mcq","stem":"How did José Rizal obtain the funds required to purchase his land in Talisay?","sub":"talisay-lottery-estate","options":[{"t":"Winning a lottery","c":true,"fb":"Rizal purchased the land in Talisay with his earnings from winning a lottery."},{"t":"Selling published novels","c":false,"fb":"Confuses his land purchase funding with literary royalties from his European books."},{"t":"Receiving family stipends","c":false,"fb":"Rizal bought the property using lottery winnings rather than family remittances."},{"t":"Collecting municipal wages","c":false,"fb":"Spanish colonial authorities did not grant Rizal a municipal salary during exile."}]},{"cat":"04-1","type":"multi","stem":"Which three fields of natural study formed an active part of José Rizal's daily research routine in Dapitan? Select the THREE correct options.","sub":"dapitan-daily-routine","options":[{"t":"Botany","c":true,"fb":"Rizal regularly studied local plant life and botanical specimens in Dapitan."},{"t":"Zoology","c":true,"fb":"Rizal investigated regional animal life and discovered several new species."},{"t":"Ethnology","c":true,"fb":"Rizal conducted ethnological studies to better understand the local population."},{"t":"Astronomy","c":false,"fb":"Celestial observation was not among Rizal's routine natural studies in Dapitan."},{"t":"Geology","c":false,"fb":"Mineral and rock studies were not part of his documented daily routine in Dapitan."}]},{"cat":"04-1","type":"mcq","stem":"Which core vocational activity was an integral component of José Rizal's daily routine during his exile in Dapitan?","sub":"dapitan-daily-routine","options":[{"t":"Medical practice","c":true,"fb":"Rizal routinely treated patients, offering both clinical consultations and surgeries."},{"t":"Military drilling","c":false,"fb":"Rizal was a civilian exile and strictly disassociated from military drills."},{"t":"Legal advocacy","c":false,"fb":"Rizal's formal training and daily practice centered on medicine and education, not law."},{"t":"Political campaigning","c":false,"fb":"Public political agitation was prohibited and not part of his daily Dapitan routine."}]},{"cat":"04-1","type":"mcq","stem":"What medical condition led George Taufer to travel to Dapitan with Josephine Bracken to consult José Rizal?","sub":"bracken-relationship","options":[{"t":"Blindness","c":true,"fb":"George Taufer journeyed to Dapitan specifically seeking treatment for his blindness."},{"t":"Tuberculosis","c":false,"fb":"Confuses Taufer's condition with the illness that later claimed Josephine Bracken's life."},{"t":"Malaria","c":false,"fb":"Taufer did not travel to the remote southern town for tropical fever treatments."},{"t":"Cholera","c":false,"fb":"Cholera was an acute infectious disease, not a chronic sensory condition requiring specialized surgery."}]},{"cat":"04-1","type":"scenario","stem":"Why did José Rizal and Josephine Bracken live as common-law spouses rather than marrying in church?","sub":"bracken-relationship","context":"An Irish woman arrived in Dapitan accompanying her blind adoptive father for ophthalmic care. While residing in the town, she and José Rizal developed a romantic relationship and sought to solemnize their union.","options":[{"t":"Friars refused Catholic rites","c":true,"fb":"Spanish friars resisted their relationship and refused to permit a Catholic wedding."},{"t":"George Taufer opposed the match","c":false,"fb":"Taufer's personal objections were not the institutional impediment preventing a church ceremony."},{"t":"Civil registries were unavailable","c":false,"fb":"Civil registration was not the issue; the Spanish clergy denied them church rites."},{"t":"Colonial laws forbade foreigners","c":false,"fb":"Spanish colonial law did not ban foreign unions; the clerical hierarchy refused the sacrament."}]},{"cat":"04-1","type":"mcq","stem":"What was the nationality of Josephine Bracken when she arrived in Dapitan with her adoptive father?","sub":"bracken-relationship","options":[{"t":"Irish","c":true,"fb":"Josephine Bracken was an Irish woman who traveled to Dapitan with George Taufer."},{"t":"British","c":false,"fb":"Confuses her ancestral heritage with the colonial administration of Hong Kong where she lived."},{"t":"American","c":false,"fb":"Bracken was of Irish nationality, not American."},{"t":"Spanish","c":false,"fb":"Bracken was Irish and had no Spanish familial background."}]},{"cat":"04-1","type":"mcq","stem":"According to the accounts of Chief Inspector Moreno, when were José Rizal and Josephine Bracken married under Catholic rites?","sub":"bracken-marriage-aftermath","options":[{"t":"Hours before Rizal's death","c":true,"fb":"Chief Inspector Moreno reported that their Catholic wedding took place hours before his execution."},{"t":"Before leaving Dapitan","c":false,"fb":"Friars in Dapitan refused to allow them to marry under Catholic rites during his exile."},{"t":"En route aboard ship to Cuba","c":false,"fb":"Rizal was held under custody while traveling and did not marry aboard the vessel."},{"t":"Upon arriving in Hong Kong","c":false,"fb":"Bracken remarried in Hong Kong later, whereas their wedding took place hours before his death."}]},{"cat":"04-1","type":"mcq","stem":"What disease caused the death of Josephine Bracken in Hong Kong at 25 years of age?","sub":"bracken-marriage-aftermath","options":[{"t":"Tuberculosis","c":true,"fb":"Bracken returned to Hong Kong and later died of tuberculosis at age 25."},{"t":"Yellow fever","c":false,"fb":"Yellow fever was prevalent in the Caribbean, not her cause of death in Hong Kong."},{"t":"Pneumonia","c":false,"fb":"Targets confusion with acute respiratory illnesses rather than tuberculosis."},{"t":"Typhoid","c":false,"fb":"Targets confusion with waterborne bacterial fevers common during the period."}]},{"cat":"04-1","type":"multi","stem":"Which three academic subjects did José Rizal teach to the young boys at his school in Dapitan? Select the THREE correct options.","sub":"dapitan-school","options":[{"t":"Spanish","c":true,"fb":"Spanish was taught as a primary language subject in his Dapitan school."},{"t":"Mathematics","c":true,"fb":"Mathematics was included to provide students with essential quantitative skills."},{"t":"Science","c":true,"fb":"Science formed a key pillar of Rizal's empirical and practical curriculum."},{"t":"Latin","c":false,"fb":"Classical Latin was typical of monastic schools, not Rizal's practical Dapitan academy."},{"t":"Philosophy","c":false,"fb":"Advanced scholastic philosophy was not taught to the young boys in his elementary school."}]},{"cat":"04-1","type":"mcq","stem":"Alongside intellectual instruction and physical training, which activity did Rizal integrate into his school's hands-on approach?","sub":"dapitan-school","options":[{"t":"Manual labor","c":true,"fb":"Rizal incorporated manual labor and arts alongside intellectual instruction."},{"t":"Military tactics","c":false,"fb":"Rizal did not train young boys in combat maneuvers or militant drills."},{"t":"Theological dogma","c":false,"fb":"Rizal emphasized moral values and practical arts rather than clerical dogmatism."},{"t":"Foreign diplomacy","c":false,"fb":"Advanced diplomatic statecraft was not part of the primary school curriculum in Talisay."}]},{"cat":"04-1","type":"mcq","stem":"Which medical specialization enabled José Rizal to successfully treat blind patients in Dapitan?","sub":"dapitan-medicine","options":[{"t":"Ophthalmology","c":true,"fb":"Rizal utilized his ophthalmic surgical training to restore sight to blind patients."},{"t":"Dermatology","c":false,"fb":"Dermatology focuses on cutaneous diseases rather than corrective eye surgeries."},{"t":"Orthopedics","c":false,"fb":"Orthopedics treats musculoskeletal trauma, not visual restoration."},{"t":"Neurology","c":false,"fb":"Neurology addresses nervous system pathology rather than ophthalmic eye operations."}]},{"cat":"04-1","type":"scenario","stem":"On what financial basis did José Rizal administer medical treatments and surgical care to impoverished patients?","sub":"dapitan-medicine","context":"During his exile in Dapitan, José Rizal operated a busy clinical practice treating local residents suffering from cataracts, eye trauma, and general sickness.","options":[{"t":"Free of charge","c":true,"fb":"Rizal provided free medical services to poor and underprivileged patients."},{"t":"On barter of farm produce","c":false,"fb":"While rural bartering was common, his documented policy for the poor was free service."},{"t":"Through colonial vouchers","c":false,"fb":"The Spanish government provided no healthcare subsidies or medical vouchers."},{"t":"At fixed installment rates","c":false,"fb":"Rizal did not place impoverished patients on commercial debt or payment installments."}]},{"cat":"04-1","type":"multi","stem":"Which two civic works did José Rizal undertake to improve public community planning and hygiene in Dapitan? Select the TWO correct options.","sub":"dapitan-agri-community-works","options":[{"t":"Designed a public plaza","c":true,"fb":"Rizal designed a public plaza to organize and beautify the town center."},{"t":"Improved town sanitation","c":true,"fb":"Rizal upgraded the town's sanitation system to improve community hygiene."},{"t":"Built a telegraph depot","c":false,"fb":"Telecommunication networks were not part of Rizal's infrastructure projects in Dapitan."},{"t":"Paved regional highways","c":false,"fb":"Regional road paving was outside the scope of his local municipal improvements."},{"t":"Constructed a deep seaport","c":false,"fb":"Rizal did not build deep-water commercial maritime harbor facilities in Dapitan."}]},{"cat":"04-1","type":"mcq","stem":"What aquatic resource management practice did José Rizal advocate among local fishermen in Dapitan?","sub":"dapitan-agri-community-works","options":[{"t":"Sustainable fishing","c":true,"fb":"Rizal promoted sustainable fishing practices to protect local marine livelihoods."},{"t":"Commercial trawling","c":false,"fb":"Large-scale commercial trawling contradicts resource conservation practices."},{"t":"Explosive blast netting","c":false,"fb":"Destructive harvesting techniques ran contrary to Rizal's progressive community goals."},{"t":"Deep-sea whaling","c":false,"fb":"Whaling was not an artisanal or local fishery technique practiced in Dapitan."}]},{"cat":"04-1","type":"mcq","stem":"How did José Rizal directly assist local agricultural producers in boosting crop yields in Dapitan?","sub":"dapitan-agri-community-works","options":[{"t":"Modern farming techniques","c":true,"fb":"Rizal introduced modern farming techniques, improved irrigation, and better planting methods."},{"t":"Chemical fertilizer spraying","c":false,"fb":"Confuses nineteenth-century agricultural methods with modern synthetic agrochemicals."},{"t":"Mechanized tractor plowing","c":false,"fb":"Industrial motor-driven machinery was not introduced by Rizal during his exile."},{"t":"Commercial crop monopoly","c":false,"fb":"Rizal supported local farmers rather than establishing restrictive cash-crop monopolies."}]},{"cat":"04-1","type":"mcq","stem":"To whom did José Rizal send his scientific findings during his exile in Dapitan?","sub":"dapitan-scientific-research","options":[{"t":"European scholars","c":true,"fb":"Rizal sent his scientific discoveries to scholars across Europe, demonstrating his international intellectual connections."},{"t":"American universities","c":false,"fb":"Rizal maintained his international research network primarily with European scholars."},{"t":"Asian academies","c":false,"fb":"Rizal did not conduct regular scholarly exchanges with East Asian academic societies."},{"t":"British colonial officials","c":false,"fb":"Rizal corresponded with European scientific researchers rather than British colonial authorities."}]},{"cat":"04-1","type":"mcq","stem":"Along with biology and anthropology, which scientific field did José Rizal actively investigate while exiled in Dapitan?","sub":"dapitan-scientific-research","options":[{"t":"Archaeology","c":true,"fb":"Rizal conducted extensive studies in biology, anthropology, and archaeology in Dapitan."},{"t":"Meteorology","c":false,"fb":"Atmospheric science was not among his primary research fields in Dapitan."},{"t":"Paleontology","c":false,"fb":"Confuses the study of ancient human artifacts with prehistoric fossil remains."},{"t":"Oceanography","c":false,"fb":"Rizal studied coastal biology and fishing, but physical oceanography was not a listed focus."}]},{"cat":"04-1","type":"mcq","stem":"Under what official capacity did Governor-General Ramon Blanco permit José Rizal to travel to Cuba in 1896 to end his exile?","sub":"cuba-deal-and-charges","options":[{"t":"Military army doctor","c":true,"fb":"Blanco permitted Rizal to serve as a medical doctor for the Spanish army in Cuba."},{"t":"Diplomatic peace envoy","c":false,"fb":"Rizal volunteered for medical service, not a diplomatic post."},{"t":"Independent botanical researcher","c":false,"fb":"His botanical research took place in Dapitan, not as part of the Cuba agreement."},{"t":"Colonial educational inspector","c":false,"fb":"The official agreement was strictly for medical service in the army."}]},{"cat":"04-1","type":"multi","stem":"Which three formal criminal charges were filed by Spanish authorities against José Rizal following the outbreak of the 1896 Revolution? Select the three correct options.","sub":"cuba-deal-and-charges","options":[{"t":"Sedition","c":true,"fb":"Sedition was one of the three official charges."},{"t":"Rebellion","c":true,"fb":"Rebellion was one of the three primary charges."},{"t":"Conspiracy","c":true,"fb":"Conspiracy was the third formal charge."},{"t":"Desertion","c":false,"fb":"Rizal was never enlisted as an active soldier in the Spanish armed forces."},{"t":"Espionage","c":false,"fb":"Authorities accused him of fomenting uprising, not foreign espionage."}]},{"cat":"04-1","type":"mcq","stem":"Which major historical event occurred shortly after José Rizal left the Philippines on his way to Cuba in 1896?","sub":"cuba-deal-and-charges","options":[{"t":"Outbreak of the Philippine Revolution","c":true,"fb":"Shortly after Rizal left the Philippines, the Katipunan launched the Philippine Revolution."},{"t":"Execution of Father Jose Burgos","c":false,"fb":"The Gomburza execution occurred earlier in 1872."},{"t":"Founding of the Katipunan society","c":false,"fb":"The Katipunan was established earlier during Rizal's exile in Dapitan."},{"t":"Arrival of American naval forces","c":false,"fb":"American forces arrived in 1898, well after Rizal's departure."}]},{"cat":"04-1","type":"mcq","stem":"Why did José Rizal reject the Katipunan's proposal to rescue him from his exile in Dapitan?","sub":"katipunan-rescue-offer","options":[{"t":"He favored peaceful reform over arms","c":true,"fb":"Rizal firmly believed in achieving reform through peaceful means rather than through armed conflict."},{"t":"He feared harsher colonial taxation","c":false,"fb":"His decision was based on philosophical opposition to armed conflict, not tax policy."},{"t":"He doubted Katipunan transport vessels","c":false,"fb":"His objection was an ideological commitment to peaceful reform, not naval logistics."},{"t":"He preferred unconditional Spanish pardon","c":false,"fb":"Rizal did not refuse rescue out of an expectation of a royal pardon."}]},{"cat":"04-1","type":"scenario","stem":"Which emissary was sent by the Katipunan to present this proposal to José Rizal?","sub":"katipunan-rescue-offer","context":"In 1896, Andrés Bonifacio and the Katipunan devised a plan to rescue José Rizal from exile and recruit him into the revolutionary movement. An envoy was sent to Dapitan to inform Rizal of the rescue plan and offer him an escape in exchange for his support.","options":[{"t":"Dr. Pio Valenzuela","c":true,"fb":"Bonifacio sent Dr. Pio Valenzuela to present the rescue plan to Rizal."},{"t":"Chief Inspector Moreno","c":false,"fb":"Moreno was a police official who documented Rizal's marriage hours before execution."},{"t":"Lt. Luis Taviel de Andrade","c":false,"fb":"Taviel de Andrade was the military officer who served as Rizal's defense counsel."},{"t":"Governor Ramon Blanco","c":false,"fb":"Blanco was the Spanish Governor-General who granted Rizal permission to travel to Cuba."}]},{"cat":"04-1","type":"mcq","stem":"Despite José Rizal's explicit refusal to endorse the Katipunan's armed uprising, how did Spanish authorities view him?","sub":"katipunan-rescue-offer","options":[{"t":"As an enduring security threat","c":true,"fb":"His refusal to join the armed uprising did not stop authorities from perceiving him as a threat."},{"t":"As a cooperative colonial ally","c":false,"fb":"Authorities continued to treat him as a subversive agitator rather than an ally."},{"t":"As an indifferent political neutral","c":false,"fb":"Spain viewed him as the intellectual instigator of unrest rather than a neutral bystander."},{"t":"As an officially pardoned subject","c":false,"fb":"Spanish authorities arrested and tried him instead of granting amnesty."}]},{"cat":"04-1","type":"mcq","stem":"Who served as José Rizal's legal counsel during his trial before the Spanish military court?","sub":"trial-proceedings","options":[{"t":"Lt. Luis Taviel de Andrade","c":true,"fb":"Lt. Luis Taviel de Andrade served as Rizal's defense counsel."},{"t":"Governor-General Ramon Blanco","c":false,"fb":"Blanco was the Governor-General who originally authorized Rizal's deployment to Cuba."},{"t":"Chief Inspector Moreno","c":false,"fb":"Moreno was the police inspector who provided an account of Rizal's marriage."},{"t":"Dr. Pio Valenzuela","c":false,"fb":"Valenzuela was the Katipunan leader sent to visit Rizal in Dapitan."}]},{"cat":"04-1","type":"multi","stem":"Which two forms of circumstantial evidence formed the basis of the prosecution's case against José Rizal during his trial? Select the two correct options.","sub":"trial-proceedings","options":[{"t":"Writings criticizing the Spanish government","c":true,"fb":"The prosecution cited his writings critical of Spanish governance."},{"t":"Association with known revolutionaries","c":true,"fb":"His connections with known revolutionary figures were used as evidence."},{"t":"Direct orders commanding rebel troops","c":false,"fb":"The military court lacked any evidence of operational troop leadership."},{"t":"Smuggled firearms found in luggage","c":false,"fb":"Rizal was never caught smuggling contraband weapons."},{"t":"Written confession acknowledging conspiracy","c":false,"fb":"Rizal consistently maintained that he did not support the armed revolt."}]},{"cat":"04-1","type":"mcq","stem":"Which procedural condition severely handicapped José Rizal's defense during his court-martial?","sub":"trial-proceedings","options":[{"t":"Insufficient time to prepare defense","c":true,"fb":"Rizal was not granted adequate time to prepare a proper legal defense."},{"t":"Complete absence of legal counsel","c":false,"fb":"He was assigned Lt. Taviel de Andrade, though counsel had limited ability to contest charges."},{"t":"Lack of any formal charges","c":false,"fb":"Authorities formally charged him with sedition, rebellion, and conspiracy."},{"t":"Total denial of written correspondence","c":false,"fb":"The fatal procedural defect identified was the lack of adequate preparation time."}]},{"cat":"04-1","type":"mcq","stem":"What deliberate physical action did José Rizal take as the firing squad discharged their rifles at Bagumbayan?","sub":"execution-details","options":[{"t":"Turned to fall facing the sky","c":true,"fb":"Rizal turned his body as the shots struck so that he fell facing the sky."},{"t":"Dropped immediately onto both knees","c":false,"fb":"Rizal remained standing until shot and twisted his body upward."},{"t":"Bowed his head toward spectators","c":false,"fb":"Accounts emphasize his insistence on facing upward, not bowing down."},{"t":"Raised his chained hands upward","c":false,"fb":"His signature final physical act was turning his body to face the sky."}]},{"cat":"04-1","type":"mcq","stem":"Which standard execution protocol did José Rizal refuse immediately prior to facing the firing squad?","sub":"execution-details","options":[{"t":"Wearing a blindfold","c":true,"fb":"Rizal refused to be blindfolded and insisted on facing his executioners."},{"t":"Walking to the field","c":false,"fb":"Rizal walked with dignity and composure to the execution grounds."},{"t":"Hearing the final verdict","c":false,"fb":"The sentence had already been read to him during trial proceedings."},{"t":"Surrendering his personal belongings","c":false,"fb":"Rizal willingly passed his personal effects to his family beforehand."}]},{"cat":"04-1","type":"fitb","stem":"José Rizal was executed by firing squad on December 30, 1896, at the field of ____, which is known today as Luneta Park.","sub":"execution-details","subtype":"term","answer":["Bagumbayan"],"caseSensitive":false,"fb":"José Rizal was executed by firing squad at Bagumbayan (now Luneta Park) on December 30, 1896."},{"cat":"04-1","type":"mcq","stem":"How did José Rizal's execution at Bagumbayan impact the broader Filipino population?","sub":"execution-nationalist-impact","options":[{"t":"Strengthened nationalist revolutionary commitment","c":true,"fb":"His martyrdom ignited nationalism and drew more Filipinos into the revolution."},{"t":"Dissolved public interest in independence","c":false,"fb":"The execution intensified rather than discouraged nationalist fervor."},{"t":"Reconciled reformists with colonial authorities","c":false,"fb":"Rizal's death destroyed faith in Spanish administration and spurred resistance."},{"t":"Halted armed resistance across provinces","c":false,"fb":"Revolutionary recruitment accelerated significantly following his death."}]},{"cat":"04-1","type":"mcq","stem":"What direct outcome followed José Rizal's martyrdom at Bagumbayan?","sub":"execution-nationalist-impact","options":[{"t":"Increased recruitment into the revolution","c":true,"fb":"His martyrdom inspired more Filipinos to join the revolutionary movement."},{"t":"Immediate disbandment of Katipunan chapters","c":false,"fb":"The revolutionary movement grew rather than disbanded after his martyrdom."},{"t":"Broad acceptance of colonial governance","c":false,"fb":"Rather than accepting colonial rule, Filipinos mobilized more intensely against it."},{"t":"Complete abandonment of separatist goals","c":false,"fb":"Nationalist sentiment deepened across the population after his execution."}]},{"cat":"04-1","type":"mcq","stem":"Inside which household object did José Rizal conceal the manuscript of his final farewell poem on the eve of his execution?","sub":"ultimo-adios-concealment","options":[{"t":"An alcohol lamp","c":true,"fb":"Rizal hid the manuscript inside an alcohol lamp (cocinilla)."},{"t":"A hollowed wooden crucifix","c":false,"fb":"The poem was hidden inside an alcohol cooking lamp, not a crucifix."},{"t":"The lining of leather boots","c":false,"fb":"The paper was not placed inside footwear."},{"t":"A double-bottomed writing desk","c":false,"fb":"Rizal concealed the document inside an alcohol lamp given to his sister."}]},{"cat":"04-1","type":"fitb","stem":"On the eve of his execution, José Rizal entrusted the alcohol lamp concealing his final poem to his sister ____.","sub":"ultimo-adios-concealment","subtype":"term","answer":["Trinidad"],"caseSensitive":false,"fb":"Rizal gave the alcohol lamp containing Mi Último Adiós to his sister Trinidad during their final meeting."},{"cat":"04-1","type":"mcq","stem":"Which theme in \"Mi Último Adiós\" reflects a message of selflessness, sacrifice, and devotion to one's homeland that extends beyond its specific historical context?","sub":"ultimo-adios-themes","options":[{"t":"Universal Message","c":true,"fb":"The Universal Message theme highlights selflessness and devotion that transcend historical borders."},{"t":"Armed Retribution","c":false,"fb":"The poem expresses selfless devotion rather than a call for armed vengeance."},{"t":"Secular Education","c":false,"fb":"Education is not listed among the four core analytical themes of the poem."},{"t":"Political Assimilation","c":false,"fb":"The poem embraces sacrifice for independence, not assimilation into Spain."}]},{"cat":"04-1","type":"multi","stem":"Which three themes are explicitly identified in the analysis of José Rizal's poem \"Mi Último Adiós\"? Select the three correct options.","sub":"ultimo-adios-themes","options":[{"t":"Patriotism","c":true,"fb":"Patriotism is one of the four explicit themes of the poem."},{"t":"Hope and Faith","c":true,"fb":"Hope and Faith represents his confidence in eventual Philippine independence."},{"t":"Martyrdom","c":true,"fb":"Martyrdom reflects his acceptance of death as part of the struggle for liberty."},{"t":"Armed Retaliation","c":false,"fb":"The poem centers on noble self-sacrifice rather than violent retribution."},{"t":"Colonial Assimilation","c":false,"fb":"Assimilation into the Spanish empire is not a theme of his farewell verses."}]},{"cat":"04-1","type":"mcq","stem":"How is the theme of \"Martyrdom\" specifically expressed in the analysis of \"Mi Último Adiós\"?","sub":"ultimo-adios-themes","options":[{"t":"Courageously accepting execution for national liberty","c":true,"fb":"Martyrdom is defined as accepting his execution bravely as part of the struggle for freedom."},{"t":"Demanding violent retribution against colonial friars","c":false,"fb":"The poem does not call for armed retaliation against the friars."},{"t":"Expressing despair over inevitable Spanish dominance","c":false,"fb":"Rizal expressed unwavering hope and faith rather than defeatist despair."},{"t":"Urging revolutionaries to abandon peaceful negotiation","c":false,"fb":"The poem is a personal testament of sacrifice, not an order to abandon diplomacy."}]},{"cat":"04-2","type":"mcq","stem":"How did Rizal chiefly influence the Philippine Revolution without fighting in it?","sub":"rizal-indirect-role","options":[{"t":"Through battlefield command and tactics","c":false,"fb":"Rizal did not directly participate in the fighting; his influence came through his ideas and writings."},{"t":"Through militant organization and uprisings","c":false,"fb":"This confuses Rizal’s intellectual influence with Bonifacio’s leadership of the Katipunan."},{"t":"Through alliances and military maneuvering","c":false,"fb":"Military tactics and political alliances characterized Aguinaldo’s approach."},{"t":"Through ideas, writings, and martyrdom","c":true,"fb":"Rizal’s ideas, writings, and death inspired the revolutionaries."}]},{"cat":"04-2","type":"scenario","stem":"Which corrected label describes how Rizal actually influenced the Revolution?","sub":"rizal-indirect-role","options":[{"t":"He led armed Katipunan uprisings","c":false,"fb":"Bonifacio founded the Katipunan; Rizal influenced its members through his writings."},{"t":"He inspired revolutionaries through his writings and death","c":true,"fb":"His writings and martyrdom influenced revolutionaries despite his absence from the fighting."},{"t":"He commanded military forces and alliances","c":false,"fb":"This assigns Aguinaldo’s methods to Rizal, whose contribution centered on ideas and writings."},{"t":"He had no influence on the Revolution","c":false,"fb":"Direct combat was not required for his ideas and martyrdom to inspire revolutionary action."}],"context":"A classroom exhibit mistakenly labels Rizal as a battlefield commander who fought in the Philippine Revolution. The label needs to be corrected."},{"cat":"04-2","type":"mcq","stem":"Which proposed program best applies Rizal’s preference for peaceful reform?","sub":"reform-through-peaceful-means","options":[{"t":"Organize armed groups for immediate uprisings","c":false,"fb":"Immediate armed uprising reflects the Katipunan’s militant approach."},{"t":"Develop military tactics and political alliances","c":false,"fb":"These methods characterize Aguinaldo’s approach to independence."},{"t":"Support education, discussion, and civic participation","c":true,"fb":"These activities apply Rizal’s emphasis on education, intellectual engagement, and civic participation."},{"t":"Pursue violent vengeance against colonial authorities","c":false,"fb":"Violent vengeance reflects Simoun’s response, rather than Rizal’s peaceful reform program."}]},{"cat":"04-2","type":"multi","stem":"Which three methods belong to Rizal’s peaceful reform program? Select the THREE correct options.","sub":"reform-through-peaceful-means","options":[{"t":"Education","c":true,"fb":"Education was a central means of pursuing reform and preparing Filipinos for national progress."},{"t":"Violent revolt","c":false,"fb":"Rizal’s peaceful reform program offered an alternative to violent revolt."},{"t":"Civic participation","c":true,"fb":"Rizal encouraged civic participation as a means of pursuing reform."},{"t":"Military tactics","c":false,"fb":"Military tactics belong to the armed approach associated with Aguinaldo."},{"t":"Intellectual engagement","c":true,"fb":"Rizal advocated intellectual engagement as a peaceful means of seeking change."}]},{"cat":"04-2","type":"mcq","stem":"Which founder–password pairing correctly links the Katipunan with Rizal?","sub":"katipunan-rizal-link","options":[{"t":"Rizal — Bonifacio","c":false,"fb":"This reverses the roles: Bonifacio founded the organization, and “Rizal” was one of its passwords."},{"t":"Aguinaldo — Simoun","c":false,"fb":"Aguinaldo’s revolutionary leadership and Simoun’s fictional role do not form the founder–password pairing."},{"t":"Bonifacio — Rizal","c":true,"fb":"Bonifacio founded the Katipunan, which used “Rizal” as one of its passwords."},{"t":"Mabini — Ibarra","c":false,"fb":"The founder was Bonifacio, and the password completing this pairing is “Rizal.”"}]},{"cat":"04-2","type":"mcq","stem":"A student argues that the Katipunan’s use of Rizal’s novels proves he supported its violent rebellion. Which correction best explains the link?","sub":"katipunan-rizal-link","options":[{"t":"Inspired members without endorsing violent revolt","c":true,"fb":"Rizal’s novels became rallying points for the Katipunan, while he personally favored peaceful reform."},{"t":"Made him the Katipunan’s militant leader","c":false,"fb":"Bonifacio founded the Katipunan; literary influence did not make Rizal its founder."},{"t":"Proved his battlefield command of the uprising","c":false,"fb":"Rizal’s influence came through his writings, rather than direct participation in the fighting."},{"t":"Showed the Katipunan rejected armed revolt","c":false,"fb":"Bonifacio’s Katipunan adopted a militant stance and called for an uprising."}]},{"cat":"04-2","type":"mcq","stem":"Which character–approach pairing belongs to Noli Me Tangere?","sub":"noli-me-tangere-reform","options":[{"t":"Ibarra — peaceful reform","c":true,"fb":"Ibarra expresses a desire for reform through peaceful, intellectual means."},{"t":"Ibarra — violent vengeance","c":false,"fb":"Violent vengeance characterizes Simoun’s approach in El Filibusterismo."},{"t":"Simoun — peaceful reform","c":false,"fb":"Ibarra voices Noli’s peaceful desire for reform; Simoun pursues violent vengeance in the sequel."},{"t":"Simoun — violent vengeance","c":false,"fb":"This pairing belongs to El Filibusterismo, while Noli presents Ibarra’s peaceful reform."}]},{"cat":"04-2","type":"mcq","stem":"A student describes Ibarra in Noli Me Tangere as pursuing violent vengeance against colonial abuses. Which replacement corrects this portrayal?","sub":"noli-me-tangere-reform","options":[{"t":"Violent vengeance against colonial authorities","c":false,"fb":"This repeats the error by assigning Simoun’s violent approach to Ibarra."},{"t":"Immediate uprising through militant organization","c":false,"fb":"This describes Bonifacio’s militant approach through the Katipunan."},{"t":"Armed resistance through military strategy","c":false,"fb":"Military strategy characterizes Aguinaldo’s approach, rather than Ibarra’s peaceful reform."},{"t":"Peaceful reform through intellectual engagement","c":true,"fb":"Ibarra expresses Rizal’s desire to change oppressive conditions through peaceful, intellectual means."}]},{"cat":"04-2","type":"fitb","stem":"Noli Me Tangere, which exposed clergy abuses and colonial inequities, was published in ____.","sub":"noli-me-tangere-reform","subtype":"year","answer":["1887"],"caseSensitive":false,"fb":"Noli Me Tangere appeared in 1887 and presented Ibarra’s peaceful, intellectual approach to reform."},{"cat":"04-2","type":"mcq","stem":"What approach does Simoun pursue in El Filibusterismo?","sub":"el-filibusterismo-radical-turn","options":[{"t":"Peaceful intellectual reform","c":false,"fb":"Peaceful, intellectual reform characterizes Ibarra’s earlier approach in Noli Me Tangere."},{"t":"Building constitutional government","c":false,"fb":"Constitutional government was a focus of Mabini’s political work."},{"t":"Vengeance through violence","c":true,"fb":"Simoun seeks vengeance through violence, contrasting with Ibarra’s peaceful desire for reform."},{"t":"Gradual educational transformation","c":false,"fb":"Gradual transformation through education describes Rizal’s reformist hopes, rather than Simoun’s violent response."}]},{"cat":"04-2","type":"mcq","stem":"A reader treats Simoun’s violence as proof that Rizal personally endorsed armed rebellion. Which interpretation corrects this inference?","sub":"el-filibusterismo-radical-turn","options":[{"t":"Reflects frustration with the slow pace of reform","c":true,"fb":"Simoun’s violent response expresses frustration with slow reform; depicting that response does not establis
