h Rizal’s personal endorsement of rebellion."},{"t":"Confirms Rizal’s personal military leadership","c":false,"fb":"Rizal did not directly fight in the revolution; Simoun’s fictional actions do not establish military leadership."},{"t":"Preserves Ibarra’s peaceful methods unchanged","c":false,"fb":"Simoun’s violent vengeance marks a clear contrast with Ibarra’s peaceful reform."},{"t":"Makes education Simoun’s primary reform tool","c":false,"fb":"Simoun pursues vengeance through violence, while education characterizes Rizal’s peaceful reform program."}]},{"cat":"04-2","type":"fitb","stem":"El Filibusterismo, the radical sequel featuring Simoun’s violent vengeance, was published in ____.","sub":"el-filibusterismo-radical-turn","subtype":"year","answer":["1891"],"caseSensitive":false,"fb":"El Filibusterismo appeared in 1891; its more radical tone reflects frustration with the slow pace of reform."},{"cat":"04-2","type":"mcq","stem":"What did Rizal’s 1896 execution become a symbol of?","sub":"execution-as-catalyst","options":[{"t":"Rizal’s battlefield command","c":false,"fb":"Rizal did not directly fight; his execution symbolized unjust Spanish treatment of Filipinos."},{"t":"Spanish colonial injustice","c":true,"fb":"His execution became a powerful symbol of injustice under Spanish rule."},{"t":"Spanish acceptance of reform","c":false,"fb":"His execution intensified anger at Spanish rule rather than demonstrating acceptance of reform."},{"t":"Katipunan’s turn toward nonviolence","c":false,"fb":"His martyrdom strengthened revolutionary resolve and galvanized the masses into action."}]},{"cat":"04-2","type":"mcq","stem":"A student concludes that Rizal’s execution ended his influence on the revolutionary movement. Which effect corrects that conclusion?","sub":"execution-as-catalyst","options":[{"t":"Made Rizal a battlefield commander","c":false,"fb":"His death strengthened his influence as a martyr, rather than establishing a role in battlefield leadership."},{"t":"Convinced Spain to grant immediate reforms","c":false,"fb":"The execution fueled opposition to Spanish rule; its revolutionary effect was to rally Filipinos."},{"t":"Weakened Filipinos’ resolve to seek freedom","c":false,"fb":"His martyrdom solidified Filipinos’ resolve to fight for freedom."},{"t":"Galvanized Filipinos to fight for freedom","c":true,"fb":"Bonifacio and other leaders regarded Rizal as a martyr whose death rallied Filipinos into action."}]},{"cat":"04-2","type":"scenario","stem":"Which route to national freedom does this initiative reflect?","sub":"nationalism-identity-and-rights","options":[{"t":"Education that develops identity and rights","c":true,"fb":"Rizal regarded education as the key to self-improvement, national awareness, and independence."},{"t":"Revolt that depends on military victories","c":false,"fb":"The initiative develops awareness through education, rather than pursuing freedom through armed victories."},{"t":"Alliances that substitute for civic awareness","c":false,"fb":"Political alliances characterize Aguinaldo’s methods, while this initiative centers on education and awareness."},{"t":"Vengeance that relies on violent retaliation","c":false,"fb":"Violent vengeance describes Simoun’s response, rather than the educational route illustrated here."}],"context":"A classroom initiative helps Filipinos understand their identity and their rights as a people. It aims to prepare them to improve themselves and seek independence."},{"cat":"04-2","type":"mcq","stem":"A student dismisses education as irrelevant to Rizal’s effort to free Filipinos from Spanish rule. Which correction best explains its role?","sub":"nationalism-identity-and-rights","options":[{"t":"Replaces civic awareness with battlefield strategy","c":false,"fb":"Rizal emphasized intellectual awakening and education; military strategy characterizes Aguinaldo’s approach."},{"t":"Builds awareness of Filipino identity and rights","c":true,"fb":"Rizal’s nationalism involved awareness of identity and rights, with education as the key to breaking free."},{"t":"Prepares citizens primarily for violent vengeance","c":false,"fb":"Violent vengeance describes Simoun’s response; Rizal connected education with self-improvement and independence."},{"t":"Makes foreign political alliances more essential than schooling","c":false,"fb":"Alliances characterize Aguinaldo’s methods, while education remained central to Rizal’s nationalist vision."}]},{"cat":"04-2","type":"mcq","stem":"A thinker argues that Filipinos may govern themselves because people deserve equality and human rights; which influence from Rizal’s European education underlies this reasoning?","sub":"enlightenment-foundations","options":[{"t":"Military strategy","c":false,"fb":"Military strategy characterizes Aguinaldo’s approach, rather than the intellectual principles supporting this argument."},{"t":"Colonial oppression","c":false,"fb":"Colonial oppression was the condition Rizal criticized; the argument draws on Enlightenment principles."},{"t":"Violent vengeance","c":false,"fb":"Violent vengeance describes Simoun’s response, rather than principles of equality and human rights."},{"t":"Enlightenment ideals","c":true,"fb":"Rizal’s European education exposed him to Enlightenment ideals that shaped his belief in Filipino self-government."}]},{"cat":"04-2","type":"multi","stem":"Which three Enlightenment ideals shaped Rizal’s belief in Filipinos’ right to govern themselves? Select the THREE correct options.","sub":"enlightenment-foundations","options":[{"t":"Human rights","c":true,"fb":"Human rights were among the Enlightenment ideals Rizal encountered through his European education."},{"t":"Military tactics","c":false,"fb":"Military tactics are methods of armed struggle, rather than the Enlightenment ideals shaping Rizal’s argument."},{"t":"Violent vengeance","c":false,"fb":"Violent vengeance characterizes Simoun’s response, rather than the Enlightenment foundations of Rizal’s nationalism."},{"t":"Reason","c":true,"fb":"The Enlightenment emphasized reason, which helped shape Rizal’s intellectual nationalism."},{"t":"Equality","c":true,"fb":"Equality was an Enlightenment ideal that informed Rizal’s vision of a free and just Philippines."}]},{"cat":"04-2","type":"mcq","stem":"Which phrase best defines Filipinismo?","sub":"filipinismo","options":[{"t":"Identity distinct from Spanish rule","c":true,"fb":"Filipinismo describes a Filipino identity separate from Spanish colonialism."},{"t":"Identity based on Spanish customs","c":false,"fb":"Filipinismo emphasized Filipino culture rather than Spanish ways."},{"t":"Regional loyalty without common goals","c":false,"fb":"Filipinismo sought a shared national identity across diversity."},{"t":"Military alliance against foreign powers","c":false,"fb":"Filipinismo concerns identity and culture, not military alliances."}]},{"cat":"04-2","type":"mcq","stem":"A community wants to advance decolonization and self-determination through Rizal’s approach. Which action best fits?","sub":"filipinismo","options":[{"t":"Expand schools and higher education","c":true,"fb":"Education was central to social change, decolonization, and self-determination."},{"t":"Adopt Spanish customs as national identity","c":false,"fb":"Filipinismo emphasized Filipino culture instead of Spanish imitation."},{"t":"Restrict education to colonial elites","c":false,"fb":"Rizal viewed an educated populace as essential to national progress."},{"t":"Replace learning with immediate violence","c":false,"fb":"The handout identifies education as the route to constructive change."}]},{"cat":"04-2","type":"fitb","stem":"The term for a Filipino national identity distinct from Spanish colonialism is ____.","sub":"filipinismo","subtype":"term","answer":["Filipinismo"],"caseSensitive":false,"fb":"Filipinismo emphasized pride in Filipino culture and an educated populace as paths toward decolonization and self-determination."},{"cat":"04-2","type":"mcq","stem":"How could unity emerge among Filipinos with different languages, customs, and traditions?","sub":"unity-through-dialogue","options":[{"t":"Mutual respect and dialogue","c":true,"fb":"Rizal linked unity with mutual respect, dialogue, and understanding."},{"t":"Immediate armed resistance","c":false,"fb":"Revolution was not presented as the basis of national unity."},{"t":"Spanish cultural imitation","c":false,"fb":"Unity required shared Filipino identity, not adoption of Spanish culture."},{"t":"Separate regional governments","c":false,"fb":"Separate governments would weaken common national goals."}]},{"cat":"04-2","type":"multi","stem":"Which actions reflect Rizal’s proposed route toward national unity? Select the TWO correct options.","sub":"unity-through-dialogue","options":[{"t":"Use mutual respect in discussions","c":true,"fb":"Mutual respect was necessary among diverse Filipinos."},{"t":"Pursue common goals cooperatively","c":true,"fb":"Cooperation for the common good supported unity."},{"t":"Make violence the basis of unity","c":false,"fb":"Rizal associated unity with dialogue rather than violence."},{"t":"Force one culture across regions","c":false,"fb":"His approach recognized different languages, customs, and traditions."},{"t":"Treat dialogue as unnecessary","c":false,"fb":"Dialogue was one of the stated tools for achieving unity."}]},{"cat":"04-2","type":"mcq","stem":"What change appeared in Rizal’s position during his final years?","sub":"final-years-shift","options":[{"t":"Criticized Spanish government more openly","c":true,"fb":"Rizal became increasingly vocal about the government’s failures."},{"t":"Abandoned education as a solution","c":false,"fb":"Education remained part of his core belief in national progress."},{"t":"Endorsed violent rebellion outright","c":false,"fb":"The handout says he acknowledged stronger action might be needed, not that he endorsed rebellion."},{"t":"Stopped demanding Filipino equality","c":false,"fb":"He became more outspoken about Filipino rights and equality."}]},{"cat":"04-2","type":"mcq","stem":"The Spanish government repeatedly failed to grant needed reforms. Which conclusion matches Rizal’s later position?","sub":"final-years-shift","options":[{"t":"Something stronger might be needed","c":true,"fb":"Rizal eventually acknowledged that peaceful reform might not be sufficient."},{"t":"Armed rebellion became his official program","c":false,"fb":"The handout does not say he endorsed violent rebellion."},{"t":"Peaceful reform had already succeeded","c":false,"fb":"His criticism grew because reforms were not being granted."},{"t":"Education no longer mattered to him","c":false,"fb":"Education and unity remained central to his nationalism."}]},{"cat":"04-2","type":"mcq","stem":"What did Rizal’s example show about true nationalism?","sub":"true-nationalism-constructive","options":[{"t":"Building a just, equal society","c":true,"fb":"True nationalism involved creating a better future valuing justice and equality."},{"t":"Removing foreign rulers alone","c":false,"fb":"Nationalism also required building a humane society after oppression."},{"t":"Seeking revenge against oppressors","c":false,"fb":"Revenge alone did not express Rizal’s constructive nationalism."},{"t":"Rejecting equality for stability","c":false,"fb":"Equality was one of the values central to his vision."}]},{"cat":"04-2","type":"multi","stem":"Which values belong to Rizal’s constructive vision of nationalism? Select the THREE correct options.","sub":"true-nationalism-constructive","options":[{"t":"Justice","c":true,"fb":"Justice was one of the values he wanted the future society to uphold."},{"t":"Equality","c":true,"fb":"Equality was central to the society Rizal envisioned."},{"t":"Human dignity","c":true,"fb":"Human dignity was part of his constructive nationalism."},{"t":"Spanish colonial hierarchy","c":false,"fb":"Colonial hierarchy conflicts with equality and self-determination."},{"t":"Revenge as sole purpose","c":false,"fb":"True nationalism was more than reaction against oppression."}]},{"cat":"04-2","type":"mcq","stem":"What method did Bonifacio consider necessary to achieve freedom?","sub":"rizal-vs-bonifacio","options":[{"t":"Armed resistance for freedom","c":true,"fb":"Bonifacio believed armed resistance was the only way to freedom."},{"t":"Gradual reform through education","c":false,"fb":"This describes Rizal’s initial reformist approach."},{"t":"Alliance-based military maneuvering","c":false,"fb":"This is associated with Aguinaldo’s pragmatic strategy."},{"t":"Constitutional government first","c":false,"fb":"This emphasis is associated with Mabini’s political vision."}]},{"cat":"04-2","type":"mcq","stem":"Which comparison correctly matches the approaches of Andrés Bonifacio and José Rizal to achieving freedom?","sub":"rizal-vs-bonifacio","options":[{"t":"Bonifacio: armed; Rizal: peaceful","c":true,"fb":"Bonifacio favored armed resistance, while Rizal advocated peaceful reform."},{"t":"Bonifacio: peaceful; Rizal: armed","c":false,"fb":"The approaches are reversed in this option."},{"t":"Both: gradual reform only","c":false,"fb":"Bonifacio supported an immediate militant uprising."},{"t":"Both: Spanish rule preserved","c":false,"fb":"Both leaders sought freedom from Spanish rule."}]},{"cat":"04-2","type":"mcq","stem":"How did José Rizal view the Katipunan despite his refusal to endorse armed rebellion?","sub":"rizal-vs-bonifacio","options":[{"t":"As a necessary movement","c":true,"fb":"Rizal saw the Katipunan as a necessary movement even though he did not personally support violent rebellion."},{"t":"As a foreign-funded conspiracy","c":false,"fb":"Rizal recognized the Katipunan as a domestic movement born out of colonial frustration."},{"t":"As an illegitimate bandit group","c":false,"fb":"Rizal did not dismiss the Katipunan as bandits; he viewed it as a necessary movement."},{"t":"As a purely religious organization","c":false,"fb":"The Katipunan was a revolutionary movement seeking independence through armed resistance."}]},{"cat":"04-2","type":"mcq","stem":"Which methods characterized Aguinaldo’s pursuit of independence?","sub":"rizal-vs-aguinaldo","options":[{"t":"Military strategy, alliances, maneuvering","c":true,"fb":"Aguinaldo used military tactics, alliances, and political maneuvering."},{"t":"Education, dialogue, peaceful reform","c":false,"fb":"These methods describe Rizal’s preferred gradual transformation."},{"t":"Religious leadership, charity, schools","c":false,"fb":"These activities are not the methods identified for Aguinaldo."},{"t":"Isolation, nonparticipation, neutrality","c":false,"fb":"Aguinaldo actively pursued the armed struggle for independence."}]},{"cat":"04-2","type":"mcq","stem":"Which contrast best explains Rizal’s and Aguinaldo’s different revolutionary approaches?","sub":"rizal-vs-aguinaldo","options":[{"t":"Aguinaldo: urgent revolution; Rizal: gradual reform","c":true,"fb":"Aguinaldo viewed revolution as urgent, while Rizal hoped for gradual transformation through reform."},{"t":"Aguinaldo: gradual reform; Rizal: urgent revolution","c":false,"fb":"This reverses their approaches."},{"t":"Both: identical methods and timelines","c":false,"fb":"They shared independence as a goal but differed significantly in method."},{"t":"Both: rejected independence as a goal","c":false,"fb":"Both leaders sought Philippine independence."}]},{"cat":"04-2","type":"fitb","stem":"The revolutionary leader who focused on military strategy and later became the first president of the Philippine Republic was ____.","sub":"rizal-vs-aguinaldo","subtype":"term","answer":["Aguinaldo","Emilio Aguinaldo"],"caseSensitive":false,"fb":"Emilio Aguinaldo led armed struggle through military tactics and alliances, eventually becoming the first president of the Philippine Republic."},{"cat":"04-2","type":"fitb","stem":"The leader known as the “Brains of the Revolution,” who shared Rizal’s intellectual ideals but supported armed resistance, was ____.","sub":"rizal-vs-mabini","subtype":"term","answer":["Mabini","Apolinario Mabini"],"caseSensitive":false,"fb":"Mabini shared Rizal’s reformist and intellectual ideals but sided with armed resistance and immediate political action."},{"cat":"04-2","type":"mcq","stem":"What type of government did Mabini seek to establish?","sub":"rizal-vs-mabini","options":[{"t":"Constitutional democratic government","c":true,"fb":"Mabini sought a constitutional government based on democratic principles."},{"t":"Spanish colonial administration","c":false,"fb":"Mabini sought independence and Filipino rights."},{"t":"Permanent military dictatorship","c":false,"fb":"The handout emphasizes constitutional and democratic principles."},{"t":"Regional kingdoms without unity","c":false,"fb":"Mabini envisioned a government for a free Philippines."}]},{"cat":"04-2","type":"mcq","stem":"In what major way did Apolinario Mabini’s revolutionary stance differ from José Rizal’s?","sub":"rizal-vs-mabini","options":[{"t":"Mabini believed armed resistance was necessary","c":true,"fb":"While Mabini shared Rizal's intellectual ideals, he aligned with armed resistance and immediate political action."},{"t":"Mabini rejected the need for education","c":false,"fb":"Mabini's writings, like Rizal's, emphasized the importance of education and civic participation."},{"t":"Mabini opposed establishing a constitutional order","c":false,"fb":"Mabini specifically focused on creating a constitutional government based on democratic principles."},{"t":"Mabini favored preserving Spanish rule","c":false,"fb":"Mabini sought independence for a free Philippines."}]},{"cat":"05","type":"mcq","stem":"The Latin title Noli Me Tangere means what in English?","sub":"noli-title-meaning","options":[{"t":"Touch Me Not","c":true,"fb":"Noli Me Tangere is Latin for \"Touch Me Not\"."},{"t":"Forget Me Not","c":false,"fb":"This is a look-alike flower phrase; \"Noli Me Tangere\" does not mean this."},{"t":"Leave Me Alone","c":false,"fb":"This is a loose paraphrase of the mood, not the translation of the Latin title."},{"t":"Pity My Land","c":false,"fb":"This reads the title as a patriotic plea; it is not the translation."}]},{"cat":"05","type":"mcq","stem":"\"Touch Me Not\" is the English meaning of Rizal's novel title. In which language is the original title written?","sub":"noli-title-meaning","options":[{"t":"Latin","c":true,"fb":"Noli Me Tangere is Latin for \"Touch Me Not\"."},{"t":"Spanish","c":false,"fb":"Spain ruled the Philippines, but the title is not Spanish."},{"t":"Tagalog","c":false,"fb":"The original title is Latin, not Tagalog."},{"t":"German","c":false,"fb":"The book was printed in Berlin, but the title is not German."}]},{"cat":"05","type":"fitb","stem":"Rizal's Noli Me Tangere was first published in the year ____.","sub":"noli-publication","subtype":"term","answer":["1887"],"caseSensitive":false,"fb":"The novel was first published in 1887 in Berlin, Germany."},{"cat":"05","type":"mcq","stem":"In 1887, Rizal's novel was first published in which city?","sub":"noli-publication","options":[{"t":"Berlin","c":true,"fb":"The first publication in 1887 was in Berlin, Germany."},{"t":"Madrid","c":false,"fb":"The novel was first published in Berlin, not Madrid."},{"t":"Manila","c":false,"fb":"The novel was banned in the Philippines, not first published in Manila."},{"t":"Paris","c":false,"fb":"Rizal lived in Europe, but the novel was not first published in Paris."}]},{"cat":"05","type":"mcq","stem":"Noli Me Tangere, written by Dr. José Rizal, was first published in which country?","sub":"noli-publication","options":[{"t":"Germany","c":true,"fb":"The novel was first published in Berlin, Germany."},{"t":"Spain","c":false,"fb":"Spain ruled the Philippines, but the novel was not first published there."},{"t":"Philippines","c":false,"fb":"The Spanish government banned the novel in the Philippines."},{"t":"France","c":false,"fb":"Rizal lived in Europe, but the novel was not first published in France."}]},{"cat":"05","type":"fitb","stem":"The novel consists of ____ chapters (including the omitted chapter) and an epilogue.","sub":"noli-structure","subtype":"term","answer":["64","sixty-four","sixty four"],"caseSensitive":false,"fb":"Noli Me Tangere has 64 chapters, counting the omitted chapter, plus an epilogue."},{"cat":"05","type":"mcq","stem":"Budget constraints during printing led to the omission of one chapter counted among the 64. That chapter was about which characters?","sub":"noli-structure","options":[{"t":"Elías and Salome","c":true,"fb":"The chapter about Elías and Salome was omitted due to budget constraints."},{"t":"Sisa and Crispín","c":false,"fb":"Their story is told in the novel; it was not the omitted chapter."},{"t":"Ibarra and María Clara","c":false,"fb":"The central love story was kept in the printed novel."},{"t":"Dámaso and Salvi","c":false,"fb":"The two friars appear throughout the printed novel; their chapter was not omitted."}]},{"cat":"05","type":"scenario","stem":"What was the result for the book?","sub":"noli-structure","context":"While Noli Me Tangere was being printed in Berlin, Rizal faced financial difficulties and could not afford to print every part of the book.","options":[{"t":"Publication delayed; a chapter was omitted","c":true,"fb":"The financial difficulties delayed publication, and some parts were omitted due to budget constraints."},{"t":"Publication on time; the epilogue was cut","c":false,"fb":"The difficulties delayed publication, and the epilogue is part of the novel."},{"t":"Printing moved to Madrid; no parts were cut","c":false,"fb":"The book stayed in Berlin and parts were omitted."},{"t":"The book was banned in Berlin; no parts were cut","c":false,"fb":"The ban came from the Spanish government in the Philippines, not from the printing difficulty."}]},{"cat":"05","type":"mcq","stem":"Rizal wrote Noli Me Tangere mainly to do what?","sub":"noli-purpose-and-ban","options":[{"t":"Provoke awareness, inspire reform","c":true,"fb":"Rizal wrote it to provoke awareness and inspire reforms among Filipinos."},{"t":"Entertain readers with romance","c":false,"fb":"The love story is part of the novel, but it is not the main purpose."},{"t":"Defend the friars' work","c":false,"fb":"The novel exposes the abuses of the friars; it does not defend them."},{"t":"Call for immediate armed revolt","c":false,"fb":"The novel aims at awareness and reform, not a direct call to arms."}]},{"cat":"05","type":"mcq","stem":"The novel was so controversial that the Spanish government did what to it?","sub":"noli-purpose-and-ban","options":[{"t":"Banned it in the Philippines","c":true,"fb":"The Spanish government banned the novel in the Philippines."},{"t":"Required it in all schools","c":false,"fb":"A book that exposes colonial abuses was not made required reading."},{"t":"Printed it at government cost","c":false,"fb":"Rizal himself faced printing costs in Berlin."},{"t":"Rewrote its final epilogue","c":false,"fb":"The government banned the book; it did not rewrite it."}]},{"cat":"05","type":"mcq","stem":"The novel played a crucial role in awakening what among Filipinos?","sub":"noli-significance","options":[{"t":"Nationalism","c":true,"fb":"The novel played a crucial role in awakening Filipino nationalism."},{"t":"Loyalty to Spain","c":false,"fb":"The novel exposes Spanish abuses and does not build loyalty to Spain."},{"t":"Church authority","c":false,"fb":"The novel criticizes the friars' abuse of power."},{"t":"Trade unionism","c":false,"fb":"The handout ties the novel to nationalism, not to labor organizing."}]},{"cat":"05","type":"mcq","stem":"A novel that exposes injustice, corruption and oppression under the Spanish government and the friars is best described as what?","sub":"noli-significance","options":[{"t":"Social and political commentary","c":true,"fb":"The novel is a social and political commentary on Spanish colonial rule."},{"t":"Romantic travel memoir","c":false,"fb":"It has a love story, but its focus is colonial injustice, not travel."},{"t":"Spanish court chronicle","c":false,"fb":"It criticizes the colonial government and does not record its glory."},{"t":"Religious devotional text","c":false,"fb":"It condemns the friars' religious hypocrisy; it is not a devotional work."}]},{"cat":"05","type":"mcq","stem":"Each Noli character symbolically stands for a specific sector of Philippine society. Which term names this device?","sub":"characters-as-allegory","options":[{"t":"Allegory","c":true,"fb":"Each character serves as an allegory for a sector of society under Spanish rule."},{"t":"Autobiography","c":false,"fb":"The characters are symbols, not a record of Rizal's own life."},{"t":"Documentary record","c":false,"fb":"The novel is fictional but realistic; its characters are symbolic figures."},{"t":"Epic poem","c":false,"fb":"The work is a novel, and the device is symbolic representation, not verse."}]},{"cat":"05","type":"mcq","stem":"Rizal used each character as an allegory of a sector of society. What did he use these characters to critique?","sub":"characters-as-allegory","options":[{"t":"Colonial oppression and religious abuses","c":true,"fb":"The characters critique colonial oppression, religious abuses, and social injustices."},{"t":"Filipino cultural traditions","c":false,"fb":"The characters critique colonial abuses, not Filipino culture."},{"t":"Spanish fashion and manners","c":false,"fb":"Only characters such as Doña Victorina mock imitation; the critique targets oppression."},{"t":"Trade and tariff policy","c":false,"fb":"The novel targets injustice and abuse, not trade policy."}]},{"cat":"05","type":"mcq","stem":"Which character is an educated Filipino who returns from Europe hoping to reform his country?","sub":"ibarra","options":[{"t":"Ibarra","c":true,"fb":"Juan Crisóstomo Ibarra is the main character who returns from Europe with hopes of reform."},{"t":"Elías","c":false,"fb":"Elías is a fugitive who aids Ibarra and has not returned from Europe."},{"t":"Basilio","c":false,"fb":"Basilio is a sacristan who later becomes a scholar; he is not the returnee."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the reform-minded teniente mayor of San Diego, not the returnee."}]},{"cat":"05","type":"mcq","stem":"Ibarra represents the Filipino intellectuals who initially believed in peaceful reform. What are they called?","sub":"ibarra","options":[{"t":"Ilustrados","c":true,"fb":"Ibarra represents the ilustrados, Filipino intellectuals who believed in peaceful reform."},{"t":"Principalia","c":false,"fb":"The principalia is the Filipino elite, represented by Kapitan Tiago."},{"t":"Sacristans","c":false,"fb":"Sacristans are church helpers like Basilio and Crispín."},{"t":"Indios","c":false,"fb":"This is a general colonial label, not the term for the intellectuals."}]},{"cat":"05","type":"multi","stem":"Exactly three statements describe Ibarra early in the novel. Select all three.","sub":"ibarra","options":[{"t":"Studied in Europe for seven years","c":true,"fb":"Ibarra returns home after seven years of study in Europe."},{"t":"Hopes to reform through education","c":true,"fb":"He is eager to help his countrymen through education and reform."},{"t":"Represents the ilustrados","c":true,"fb":"He symbolizes the educated, reform-minded Filipino intellectuals."},{"t":"Believes true change needs bloodshed","c":false,"fb":"This is Elías's belief, not Ibarra's early view."},{"t":"Is already the vengeful Simoun","c":false,"fb":"He becomes the vengeful Simoun only later, after his idealism is crushed by Spanish abuses."}]},{"cat":"05","type":"fitb","stem":"Ibarra's idealism is crushed by Spanish abuses, and he becomes the vengeful ____ in El Filibusterismo.","sub":"simoun","subtype":"term","answer":["Simoun"],"caseSensitive":false,"fb":"Ibarra's transformation into the vengeful Simoun follows the destruction of his idealism by Spanish abuses."},{"cat":"05","type":"mcq","stem":"In El Filibusterismo, the vengeful Simoun is the transformed form of which Noli character?","sub":"simoun","options":[{"t":"Ibarra","c":true,"fb":"Ibarra, whose idealism is crushed by Spanish abuses, becomes Simoun."},{"t":"Elías","c":false,"fb":"Elías is the fugitive who aids Ibarra; he does not become Simoun."},{"t":"Basilio","c":false,"fb":"Basilio is a medical student whose ideals Simoun's ideology challenges."},{"t":"Kapitan Tiago","c":false,"fb":"Kapitan Tiago is the elite figure whose later downfall shows the cost of blind loyalty."}]},{"cat":"05","type":"mcq","stem":"Which character represents the idealized but oppressed Filipina woman?","sub":"maria-clara","options":[{"t":"María Clara","c":true,"fb":"María Clara, known for beauty and virtue, represents the idealized but oppressed Filipina."},{"t":"Sisa","c":false,"fb":"Sisa represents the suffering Filipino mother."},{"t":"Pía Alba","c":false,"fb":"Pía Alba represents the powerless women in colonial society."},{"t":"Doña Victorina","c":false,"fb":"Doña Victorina represents colonial mentality."}]},{"cat":"05","type":"mcq","stem":"María Clara's character was inspired by Rizal's childhood sweetheart. Who was she?","sub":"maria-clara","options":[{"t":"Leonor Rivera","c":true,"fb":"Leonor Rivera, Rizal's childhood sweetheart, inspired María Clara."},{"t":"Pía Alba","c":false,"fb":"Pía Alba is María Clara's mother within the novel, not Rizal's sweetheart."},{"t":"Doña Victorina","c":false,"fb":"She is a character who imitates Spaniards, not Rizal's sweetheart."},{"t":"Sisa","c":false,"fb":"Sisa is a fictional mother, not Rizal's sweetheart."}]},{"cat":"05","type":"scenario","stem":"What does María Clara then do?","sub":"maria-clara","context":"Ibarra has escaped from prison and disappeared into the unknown. María Clara believes her beloved to be dead and loses all hope.","options":[{"t":"Enters a convent","c":true,"fb":"Believing Ibarra dead, María Clara enters a convent, reflecting her limited options as a woman."},{"t":"Marries Linares","c":false,"fb":"Doña Victorina wants this match, but María Clara does not marry him."},{"t":"Flees to Europe","c":false,"fb":"She stays under the control of the church, not abroad."},{"t":"Searches the forests","c":false,"fb":"She believes Ibarra is dead and resigns herself to a life of suffering."}]},{"cat":"05","type":"mcq","stem":"Padre Dámaso, who abuses his power, belongs to which religious order?","sub":"padre-damaso","options":[{"t":"Franciscan","c":true,"fb":"Padre Dámaso is a Franciscan friar."},{"t":"Dominican","c":false,"fb":"The Dominican in the cast is Padre Sibyla."},{"t":"Augustinian","c":false,"fb":"The handout names Augustinians among the powerful orders, but Dámaso is not one."},{"t":"Jesuit","c":false,"fb":"Dámaso is Franciscan, not Jesuit."}]},{"cat":"05","type":"scenario","stem":"Who is María Clara's biological father?","sub":"padre-damaso","context":"Padre Salvi tells María Clara a devastating secret about her parentage. He forces her to hand over letters that supposedly prove Ibarra's guilt, in exchange for keeping that secret.","options":[{"t":"Padre Dámaso","c":true,"fb":"Padre Dámaso is revealed as María Clara's biological father."},{"t":"Kapitan Tiago","c":false,"fb":"He is her presumed father and the husband of her mother, Pía Alba, but not her biological father."},{"t":"Padre Salvi","c":false,"fb":"Salvi reveals the secret; he is not the father."},{"t":"Don Rafael Ibarra","c":false,"fb":"He is Ibarra's father, not María Clara's."}]},{"cat":"05","type":"multi","stem":"Exactly two of these characters are Franciscan friars. Select both.","sub":"padre-damaso","options":[{"t":"Padre Dámaso","c":true,"fb":"Padre Dámaso is a Franciscan friar."},{"t":"Padre Sibyla","c":false,"fb":"Padre Sibyla is a Dominican priest."},{"t":"Padre Salvi","c":true,"fb":"Padre Salvi is a cunning Franciscan friar."},{"t":"Kapitan Tiago","c":false,"fb":"Kapitan Tiago is a wealthy Filipino layman, not a friar."},{"t":"Lieutenant Guevara","c":false,"fb":"Guevara is a Spanish officer, not a friar."}]},{"cat":"05","type":"mcq","stem":"Which character is a fugitive who aids Ibarra and embodies the revolutionary spirit of the masses?","sub":"elias","options":[{"t":"Elías","c":true,"fb":"Elías is the fugitive who aids Ibarra and represents the working-class revolutionaries."},{"t":"Basilio","c":false,"fb":"Basilio represents the resilience of Filipino youth."},{"t":"Tasyo","c":false,"fb":"Tasyo is a philosopher dismissed as a madman."},{"t":"Don Filipo","c":false,"fb":"Don Filipo represents reform-minded educated Filipinos."}]},{"cat":"05","type":"mcq","stem":"Unlike Ibarra, Elías believes that real change requires what?","sub":"elias","options":[{"t":"Radical change","c":true,"fb":"Elías believes in radical change rather than reform."},{"t":"Peaceful reform","c":false,"fb":"This is Ibarra's early belief, not Elías's."},{"t":"Patient obedience","c":false,"fb":"Elías is a fugitive who understands that change may need drastic action."},{"t":"Foreign rescue","c":false,"fb":"The handout does not give this as his view."}]},{"cat":"05","type":"mcq","stem":"Rizal's first meeting with Andres Bonifacio was at the foundation of which organization?","sub":"elias-not-bonifacio","options":[{"t":"La Liga Filipina","c":true,"fb":"Rizal first met Bonifacio at the foundation of La Liga Filipina."},{"t":"Katipunan","c":false,"fb":"The handout names La Liga Filipina for this meeting, not this group."},{"t":"La Solidaridad","c":false,"fb":"The handout does not name this group for the meeting."},{"t":"Propaganda Movement","c":false,"fb":"The handout does not name this group for the meeting."}]},{"cat":"05","type":"mcq","stem":"Why was Elías not inspired by Andres Bonifacio, contrary to popular belief?","sub":"elias-not-bonifacio","options":[{"t":"They met years after publication","c":true,"fb":"Rizal first met Bonifacio years after the novel was published."},{"t":"Rizal did not meet Bonifacio","c":false,"fb":"Rizal did meet him, at the foundation of La Liga Filipina."},{"t":"Bonifacio was a Spanish friar","c":false,"fb":"Bonifacio was not a friar."},{"t":"Bonifacio rejected the novel","c":false,"fb":"The handout does not say this; the reason is timing."}]},{"cat":"05","type":"mcq","stem":"Which character is cunning and manipulative, lusts after María Clara, and orchestrates Ibarra's downfall?","sub":"padre-salvi","options":[{"t":"Padre Salvi","c":true,"fb":"Padre Salvi is the cunning Franciscan friar who orchestrates Ibarra's downfall."},{"t":"Padre Dámaso","c":false,"fb":"Dámaso is brash and arrogant, unlike the secretive Salvi."},{"t":"Padre Sibyla","c":false,"fb":"Sibyla is a calculating Dominican who uses diplomacy."},{"t":"Alférez","c":false,"fb":"The Alférez is Salvi's rival and commands the Guardia Civil."}]},{"cat":"05","type":"multi","stem":"Exactly three statements describe Padre Salvi. Select all three.","sub":"padre-salvi","options":[{"t":"Cunning and manipulative friar","c":true,"fb":"Salvi is described as cunning and manipulative."},{"t":"Lusts after María Clara","c":true,"fb":"Salvi lusts after María Clara."},{"t":"Orchestrates Ibarra's downfall","c":true,"fb":"Salvi plots and orchestrates Ibarra's downfall."},{"t":"Brash, openly insults Ibarra","c":false,"fb":"This describes Dámaso; Salvi is secretive and strategic."},{"t":"Dominican priest in high office","c":false,"fb":"This describes Sibyla; Salvi is Franciscan."}]},{"cat":"05","type":"mcq","stem":"Which wealthy, influential Filipino blindly follows the Spanish authorities and the church?","sub":"kapitan-tiago","options":[{"t":"Don Rafael Ibarra","c":false,"fb":"Don Rafael is wealthy too, but he opposed the friars' abuses instead of obeying them."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is a progressive teniente mayor whose reform ideas the friars ignore; he is not a loyal follower."},{"t":"Kapitan Tiago","c":true,"fb":"Kapitan Tiago (Don Santiago de los Santos) is the wealthy Filipino who blindly follows Spanish authorities and the church."},{"t":"Pilosopo Tasyo","c":false,"fb":"Tasyo is a philosopher dismissed as mad for challenging colonial rule; he does not obey it."}]},{"cat":"05","type":"mcq","stem":"Kapitan Tiago (Don Santiago de los Santos) valued social status over patriotism. Which Filipino elite group does he represent?","sub":"kapitan-tiago","options":[{"t":"Principalia","c":true,"fb":"Kapitan Tiago represents the Filipino elite, the principalia, who put status above patriotism."},{"t":"Ilustrados","c":false,"fb":"The ilustrados are the educated reformists represented by Ibarra, not the status-seeking elite."},{"t":"Working-class revolutionaries","c":false,"fb":"This is Elías's representation; Kapitan Tiago is wealthy and loyal to Spain."},{"t":"Principled landowners","c":false,"fb":"This is Don Rafael Ibarra's representation; Kapitan Tiago did not resist Spanish injustice."}]},{"cat":"05","type":"mcq","stem":"Kapitan Tiago stays subservient to Spanish rule despite his wealth. What does his later downfall in El Filibusterismo show?","sub":"kapitan-tiago","options":[{"t":"Rewards of cooperating with friars","c":false,"fb":"His downfall shows the opposite; cooperation did not protect him."},{"t":"Failure of armed resistance","c":false,"fb":"He never took up arms; his fall follows from his loyalty, not rebellion."},{"t":"Danger of European education","c":false,"fb":"Education is not the point; his loyalty to the colonizers is."},{"t":"Consequences of blind loyalty to colonizers","c":true,"fb":"His fall shows the consequences of blind loyalty to the colonizers."}]},{"cat":"05","type":"mcq","stem":"Which poor mother goes insane after losing her sons, Basilio and Crispín?","sub":"sisa","options":[{"t":"Pía Alba","c":false,"fb":"Pía Alba is María Clara's biological mother, who dies shortly after childbirth; she is not Basilio and Crispín's mother."},{"t":"Sisa","c":true,"fb":"Sisa is the poor mother who goes insane after losing Basilio and Crispín."},{"t":"Doña Consolación","c":false,"fb":"Doña Consolación is the Alférez's wife who abuses Sisa; she is not Basilio and Crispín's mother."},{"t":"María Clara","c":false,"fb":"María Clara is Ibarra's love interest who ends in a convent; she is not their mother."}]},{"cat":"05","type":"mcq","stem":"Sisa represents the suffering Filipino mother under Spanish oppression. What does her descent into madness mirror?","sub":"sisa","options":[{"t":"Country's condition under colonial rule","c":true,"fb":"Her descent into madness mirrors the country's condition under colonial rule."},{"t":"Ibarra's grief over his father","c":false,"fb":"Ibarra's grief is a separate storyline; it is not what Sisa's madness mirrors."},{"t":"Decline of the friars' power","c":false,"fb":"The friars' control stays firm in the story; Sisa's madness does not signal their decline."},{"t":"Rizal's financial struggles in Berlin","c":false,"fb":"Those struggles concern the novel's printing, not Sisa's symbolism."}]},{"cat":"05","type":"mcq","stem":"Which character, Crispín's older brother, escapes and later becomes a scholar?","sub":"basilio","options":[{"t":"Elías","c":false,"fb":"Elías is the fugitive who aids Ibarra; he is not Crispín's brother."},{"t":"Crisóstomo Ibarra","c":false,"fb":"Ibarra returns from Europe already educated; he is not Crispín's brother."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the teniente mayor of San Diego, not a youth who escapes."},{"t":"Basilio","c":true,"fb":"Basilio survives, escapes, and later pursues education."}]},{"cat":"05","type":"mcq","stem":"Basilio survives and pursues education, unlike his brother. What does he represent?","sub":"basilio","options":[{"t":"Innocent, powerless Filipino youth","c":false,"fb":"This describes Crispín, who is killed; Basilio survives."},{"t":"Resilience of the Filipino youth","c":true,"fb":"Basilio represents the resilience of the Filipino youth under oppression."},{"t":"Educated, reformist ilustrados","c":false,"fb":"This is Ibarra's representation; Basilio is a poor youth, not a reformist intellectual."},{"t":"Revolutionary spirit of the masses","c":false,"fb":"This is Elías's representation; Basilio embodies hope through education."}]},{"cat":"05","type":"mcq","stem":"Which young sacristan is falsely accused of theft and killed by church authorities?","sub":"crispin","options":[{"t":"Basilio","c":false,"fb":"Basilio is his brother, who escapes and survives."},{"t":"Don Rafael Ibarra","c":false,"fb":"Don Rafael was falsely accused too, but he is a landowner who died in prison."},{"t":"Crispín","c":true,"fb":"Crispín is the sacristan falsely accused of stealing church money and killed."},{"t":"Elías","c":false,"fb":"Elías is a fugitive who sacrifices himself to protect Ibarra; he is not a sacristan."}]},{"cat":"05","type":"scenario","stem":"Crispín's death is a turning point in whose descent into madness?","sub":"crispin","context":"One night in San Diego, the sacristan Crispín is falsely accused of stealing church money. Padre Salvi's men beat him to death.","options":[{"t":"María Clara","c":false,"fb":"María Clara's fate is the convent, not madness."},{"t":"Basilio","c":false,"fb":"Basilio survives; he is not the one driven mad."},{"t":"Sisa","c":true,"fb":"Crispín's death is a turning point in his mother Sisa's descent into madness."},{"t":"Doña Consolación","c":false,"fb":"Doña Consolación abuses Sisa; she is not the one driven mad."}]},{"cat":"05","type":"mcq","stem":"Which old man is seen as a madman by the ignorant but a sage by the wise?","sub":"pilosopo-tasyo","options":[{"t":"Pilosopo Tasyo","c":true,"fb":"Don Anastacio (Pilosopo Tasyo) is the philosopher seen as mad by the ignorant and wise by the wise."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the deputy mayor whose reform ideas are ignored; he is not called a madman."},{"t":"Don Rafael Ibarra","c":false,"fb":"Don Rafael is Ibarra's father and a respected landowner who dies in prison."},{"t":"Don Tiburcio","c":false,"fb":"Don Tiburcio only pretends to be an expert; he is a fake doctor, not a sage."}]},{"cat":"05","type":"scenario","stem":"What does Tasyo advise Ibarra?","sub":"pilosopo-tasyo","context":"Determined to honor his father's legacy, Ibarra plans to build a school in San Diego. Seeking guidance, he visits Tasyo, the philosopher, an old man known for his wisdom and intelligence.","options":[{"t":"Abandon the school and leave town","c":false,"fb":"Tasyo urges caution, not surrender; Ibarra goes on with the school."},{"t":"Take up arms against the friars","c":false,"fb":"This is closer to Elías's view that change needs bloodshed, not Tasyo's counsel."},{"t":"Ask the Governor-General to intervene","c":false,"fb":"Tasyo gives no such instruction; he warns about the friars' power."},{"t":"Be cautious, since friars resist challenge","c":true,"fb":"Tasyo warns Ibarra that the powerful friars will not tolerate any challenge to their authority."}]},{"cat":"05","type":"fitb","stem":"Rizal modeled Pilosopo Tasyo after his own mentor, ____.","sub":"pilosopo-tasyo","subtype":"term","answer":["Paciano","Paciano Rizal"],"caseSensitive":false,"fb":"Pilosopo Tasyo was modeled after Rizal's own mentor, Paciano."},{"cat":"05","type":"mcq","stem":"Which native woman despises her Filipino heritage and exaggerates Spanish mannerisms to gain social status?","sub":"dona-victorina","options":[{"t":"María Clara","c":false,"fb":"María Clara is the idealized, oppressed Filipina; she does not imitate Spaniards."},{"t":"Doña Victorina","c":true,"fb":"Doña Victorina rejects her heritage and desperately tries to appear Spanish."},{"t":"Kapitan Tiago's wife","c":false,"fb":"Pía Alba is a powerless woman who dies early; she does not imitate Spaniards."},{"t":"Basilio's mother","c":false,"fb":"Sisa is a poor mother driven mad; she does not reject her heritage."}]},{"cat":"05","type":"mcq","stem":"Doña Victorina's exaggerated Spanish behavior mocks Filipinos who imitated Spaniards to gain what?","sub":"dona-victorina","options":[{"t":"Church lands","c":false,"fb":"Land is not the aim; the imitation is about how others see her rank."},{"t":"Government posts","c":false,"fb":"Posts are not the stated aim of the imitation."},{"t":"Legal protection","c":false,"fb":"Nothing ties the imitation to legal protection."},{"t":"Social status","c":true,"fb":"Her behavior mocks Filipinos who adopted Spanish mannerisms to gain social status."}]},{"cat":"05","type":"mcq","stem":"Which Spanish husband of Doña Victorina is a fake doctor who pretends to be an expert?","sub":"don-tiburcio","options":[{"t":"Linares","c":false,"fb":"Linares is the young Spaniard Doña Victorina wants María Clara to marry, not her husband."},{"t":"Lieutenant Guevara","c":false,"fb":"Guevara is a noble, just officer; he is not her husband or a fake doctor."},{"t":"Don Tiburcio","c":true,"fb":"Don Tiburcio de Espadaña is Doña Victorina's Spanish husband and a fake doctor."},{"t":"Kapitan Tiago","c":false,"fb":"Kapitan Tiago is a wealthy Filipino who follows Spain; he is not Spanish or a doctor."}]},{"cat":"05","type":"mcq","stem":"Don Tiburcio, a fake doctor, still holds higher status than educated Filipinos. What does Rizal satirize through him?","sub":"don-tiburcio","options":[{"t":"Filipinos aping Spanish mannerisms","c":false,"fb":"This is Doña Victorina's representation, not her husband's."},{"t":"Opportunists climbing through marriage","c":false,"fb":"This is Linares's representation."},{"t":"Friars manipulating religion for gain","c":false,"fb":"This describes Dámaso and Salvi, not an unqualified official."},{"t":"Unqualified Spaniards in official posts","c":true,"fb":"Rizal satirizes Spanish officials who held positions without qualifications."}]},{"cat":"05","type":"fitb","stem":"Doña Victorina wants María Clara to marry a young Spaniard named ____.","sub":"linares","subtype":"term","answer":["Linares"],"caseSensitive":false,"fb":"Linares is the young Spaniard Doña Victorina wants María Clara to marry."},{"cat":"05","type":"mcq","stem":"Linares lacks real achievements and relies on connections. His character highlights what as a way to climb the social ladder?","sub":"linares","options":[{"t":"Marriage","c":true,"fb":"Linares represents opportunistic colonial elites who sought power through marriage, a way to climb the social ladder."},{"t":"Military rank","c":false,"fb":"Military rank belongs to the Alférez, not to Linares."},{"t":"Church office","c":false,"fb":"Church office belongs to the friars, not to Linares."},{"t":"Land grants","c":false,"fb":"Linares relies on connections, not on land."}]},{"cat":"05","type":"fitb","stem":"The noble and just Spanish officer who told Ibarra the tragedy behind Don Rafael's death is Lieutenant ____.","sub":"lieutenant-guevara","subtype":"term","answer":["Guevara"],"caseSensitive":false,"fb":"Lieutenant Guevara told Ibarra the truth about the death of his father, Don Rafael."},{"cat":"05","type":"scenario","stem":"What does Lieutenant Guevara represent?","sub":"lieutenant-guevara","context":"At a grand dinner in Manila, Padre Dámaso insults Ibarra and belittles his late father, Don Rafael. After the banquet, Lieutenant Guevara, a well-meaning Spanish officer, secretly tells Ibarra the truth about his father's tragic fate.","options":[{"t":"Abusive military officials under Spain","c":false,"fb":"This is the Alférez's representation; Guevara is noble and just."},{"t":"Rare good Spaniards in government","c":true,"fb":"Guevara represents the rare good Spaniards who saw the injustices but had little power."},{"t":"Incompetent but privileged Spaniards","c":false,"fb":"This is Don Tiburcio's representation."},{"t":"Politically astute Spanish clergy","c":false,"fb":"This is Padre Sibyla's representation; Guevara is an officer, not a priest."}]},{"cat":"05","type":"mcq","stem":"Which character is subtle and strategic, keeping control through diplomacy rather than brute force?","sub":"padre-sibyla","options":[{"t":"Padre Sibyla","c":true,"fb":"Padre Sibyla is more calculating than the other friars and relies on diplomacy."},{"t":"Padre Dámaso","c":false,"fb":"Dámaso is brash and arrogant, the opposite of subtle."},{"t":"Padre Salvi","c":false,"fb":"Salvi is secretive but brutal in his methods of control, not diplomatic."},{"t":"Alférez","c":false,"fb":"The Alférez embodies the brutality of military rule, not diplomacy."}]},{"cat":"05","type":"mcq","stem":"Padre Sibyla holds a high position in the church. Which religious order does he belong to?","sub":"padre-sibyla","options":[{"t":"Franciscan","c":false,"fb":"Dámaso and Salvi are Franciscan; Sibyla is the one who is not."},{"t":"Augustinian","c":false,"fb":"The Augustinians are named as a major order, but Sibyla is not one."},{"t":"Dominican","c":true,"fb":"Padre Sibyla is a Dominican priest."},{"t":"Jesuit","c":false,"fb":"Sibyla is not Jesuit; the friar orders named for the period are Dominican, Franciscan, and Augustinian."}]},{"cat":"05","type":"mcq","stem":"Which military commander in San Diego is constantly at odds with the friars and rivals Padre Salvi?","sub":"alferez","options":[{"t":"Lieutenant Guevara","c":false,"fb":"Guevara is a noble, just officer who tells Ibarra about his father; he does not command San Diego's force."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the deputy mayor, a civil official, not a military commander."},{"t":"Padre Dámaso","c":false,"fb":"Dámaso is a friar, so he is on the church side of the rivalry."},{"t":"Alférez","c":true,"fb":"The Alférez (Alguacil Mayor) commands San Diego's Guardia Civil and rivals Padre Salvi."}]},{"cat":"05","type":"mcq","stem":"The Alférez (Alguacil Mayor) embodies the brutality of Spanish military rule. Which force does he command in San Diego?","sub":"alferez","options":[{"t":"Friars' private militia","c":false,"fb":"He is a state officer in conflict with the friars, not a church militia commander."},{"t":"Guardia Civil","c":true,"fb":"He commands the Guardia Civil, the civil guards of San Diego."},{"t":"Spanish navy","c":false,"fb":"Nothing places him at sea; his post is in San Diego."},{"t":"Town council guards","c":false,"fb":"His force answers to the state, not to a town council."}]},{"cat":"05","type":"mcq","stem":"Which cruel wife of the Alférez abuses Sisa and is known for hatred towards native Filipinos?","sub":"dona-consolacion","options":[{"t":"Doña Victorina","c":false,"fb":"Doña Victorina's husband is Don Tiburcio, not the Alférez, and she does not abuse Sisa."},{"t":"María Clara","c":false,"fb":"María Clara is Ibarra's love interest, not the Alférez's wife."},{"t":"Doña Consolación","c":true,"fb":"Doña Consolación is the Alférez's cruel, abusive wife who abuses Sisa."},{"t":"Pía Alba","c":false,"fb":"Pía Alba is Kapitan Tiago's wife and dies shortly after childbirth."}]},{"cat":"05","type":"mcq","stem":"Doña Consolación abuses her power over other Filipinos, particularly Sisa. What does she represent?","sub":"dona-consolacion","options":[{"t":"Effects of internalized racism","c":true,"fb":"A Filipina who despises her own race, she represents colonial mentality's effects and internalized racism."},{"t":"Mockery of Filipinos copying Spaniards","c":false,"fb":"This is Doña Victorina's representation; Consolación's mark is abuse of power and racism."},{"t":"Brutal Spanish military rule","c":false,"fb":"This is her husband the Alférez's representation."},{"t":"Powerless women of colonial society","c":false,"fb":"This is Pía Alba's representation; Consolación is the abuser, not the victim."}]},{"cat":"05","type":"mcq","stem":"Which educated San Diego official, known for progressive and liberal ideals, has his ideas ignored by the friars?","sub":"don-filipo","options":[{"t":"Crisóstomo Ibarra","c":false,"fb":"Ibarra is a returning reformist, not an official of San Diego."},{"t":"Don Filipo","c":true,"fb":"Don Filipo's progressive ideas are ignored, which shows the friars' grip on politics."},{"t":"Pilosopo Tasyo","c":false,"fb":"Tasyo is a philosopher ridiculed by the masses; he holds no office."},{"t":"Kapitan Tiago","c":false,"fb":"Kapitan Tiago obeys the authorities; he is not a progressive."}]},{"cat":"05","type":"mcq","stem":"Don Filipo represents educated, reform-minded Filipinos. What office does he hold in San Diego?","sub":"don-filipo","options":[{"t":"Alguacil mayor","c":false,"fb":"This is the Alférez's alternate title, not Don Filipo's office."},{"t":"Governor-General","c":false,"fb":"The Governor-General supports Ibarra's plans; Don Filipo is a local official."},{"t":"Guardia Civil chief","c":false,"fb":"He is a civil official, not a military commander."},{"t":"Teniente mayor","c":true,"fb":"Don Filipo is the teniente mayor (deputy mayor) of San Diego."}]},{"cat":"05","type":"multi","stem":"Select the two friars who belong to the Franciscan order.","sub":"padre-sibyla","options":[{"t":"Padre Dámaso","c":true,"fb":"Dámaso is a Franciscan friar."},{"t":"Padre Sibyla","c":false,"fb":"Sibyla is Dominican, not Franciscan."},{"t":"Kapitan Tiago","c":false,"fb":"Kapitan Tiago is a wealthy layman, not a friar."},{"t":"Padre Salvi","c":true,"fb":"Salvi is a Franciscan friar."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is a civil official, not a friar."}]},{"cat":"05","type":"multi","stem":"Select the two characters tied to the Alférez by rivalry or marriage.","sub":"alferez","options":[{"t":"Lieutenant Guevara","c":false,"fb":"Guevara is a separate, noble officer with no such tie to the Alférez."},{"t":"Padre Salvi","c":true,"fb":"His rivalry with Salvi shows the power struggle between church and state."},{"t":"Linares","c":false,"fb":"Linares is a young Spaniard tied to Doña Victorina's plans, not to the Alférez."},{"t":"Doña Consolación","c":true,"fb":"She is the Alférez's wife and controls him, exposing his weak character."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the deputy mayor; he has no rivalry or marriage tie with the Alférez."}]},{"cat":"05","type":"multi","stem":"Select the two characters who represent educated, reform-minded Filipinos.","sub":"don-filipo","options":[{"t":"Kapitan Tiago","c":false,"fb":"He represents the status-seeking elite loyal to Spain."},{"t":"Don Filipo","c":true,"fb":"Don Filipo represents educated, reform-minded Filipinos."},{"t":"Don Tiburcio","c":false,"fb":"He is a fake Spanish doctor, not a Filipino reformer."},{"t":"Crisóstomo Ibarra","c":true,"fb":"Ibarra represents the educated, reformist ilustrados."},{"t":"Linares","c":false,"fb":"He is a Spaniard who seeks status through marriage."}]},{"cat":"05","type":"mcq","stem":"Crisóstomo Ibarra's father, a respected and kind landowner who dies in prison, is","sub":"don-rafael-ibarra","options":[{"t":"Don Rafael Ibarra","c":true,"fb":"He is the principled landowner who opposed the friars' abuses and died in prison."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the teniente mayor of San Diego whose progressive ideas are ignored; he is not Ibarra's father."},{"t":"Kapitan Tiago","c":false,"fb":"Kapitan Tiago is the wealthy man who blindly follows the Spanish authorities and the church, and he is María Clara's guardian."},{"t":"Lieutenant Guevara","c":false,"fb":"Guevara is the Spanish officer who told Ibarra about his father's fate; he is not the father."}]},{"cat":"05","type":"fitb","stem":"Don Rafael Ibarra died in prison after the friars wrongfully accused him of ____, an offense against church teaching.","sub":"don-rafael-ibarra","subtype":"term","answer":["heresy"],"caseSensitive":false,"fb":"Heresy is the charge that appears in every wording of the accusation against Don Rafael Ibarra. The other charge paired with it differs by section (murder, subversion, treason)."},{"cat":"05","type":"mcq","stem":"Don Rafael Ibarra opposed the friars' abuses, unlike other wealthy Filipinos who cooperated with Spain. Whom does he represent?","sub":"don-rafael-ibarra","options":[{"t":"Principled Filipino landowners victimized by injustice","c":true,"fb":"He stands for principled landowners who fell victim to Spanish injustice."},{"t":"The Filipino elite who valued status over patriotism","c":false,"fb":"This is Kapitan Tiago's representation (the principalia), the opposite of Don Rafael's stance."},{"t":"Intellectuals dismissed as crazy for challenging colonial rule","c":false,"fb":"This is Pilosopo Tasyo's representation, not the landowner's."},{"t":"Opportunists who sought power through marriage","c":false,"fb":"This is Linares's representation; Don Rafael did not cooperate with the Spanish."}]},{"cat":"05","type":"mcq","stem":"María Clara's biological mother, the wife of Kapitan Tiago, died shortly after childbirth. Who is she?","sub":"pia-alba","options":[{"t":"Pía Alba","c":true,"fb":"She was Kapitan Tiago's wife and María Clara's biological mother, and she died shortly after childbirth."},{"t":"Sisa","c":false,"fb":"Sisa is the poor mother of Basilio and Crispín, who goes insane; she is not María Clara's mother."},{"t":"Doña Consolación","c":false,"fb":"She is the Alférez's abusive wife, not María Clara's mother."},{"t":"Doña Victorina","c":false,"fb":"She is the wife of the fake doctor Don Tiburcio, not Kapitan Tiago's wife."}]},{"cat":"05","type":"multi","stem":"Select the three statements that are true of Pía Alba.","sub":"pia-alba","options":[{"t":"Was Kapitan Tiago's wife","c":true,"fb":"She was married to Kapitan Tiago."},{"t":"Was secretly impregnated by Dámaso","c":true,"fb":"Padre Dámaso secretly fathered María Clara with her, showing friar abuse of women."},{"t":"Died shortly after childbirth","c":true,"fb":"Her early death left María Clara to be raised under the church's influence."},{"t":"Went mad after losing her sons","c":false,"fb":"This describes Sisa, who lost Basilio and Crispín."},{"t":"Died in prison, wrongly accused","c":false,"fb":"This describes Don Rafael Ibarra, not Pía Alba."}]},{"cat":"05","type":"mcq","stem":"Which character keeps control through diplomacy rather than brute force?","sub":"friar-styles-compared","options":[{"t":"Padre Sibyla","c":true,"fb":"Sibyla is subtle and strategic, maintaining control through diplomacy."},{"t":"Padre Dámaso","c":false,"fb":"Dámaso is brash and arrogant and insults people openly."},{"t":"Padre Salvi","c":false,"fb":"Salvi is secretive and strategic, using hidden, indirect, brutal methods rather than diplomacy."},{"t":"Alférez","c":false,"fb":"The Alférez embodies the brutality of military rule, which is the opposite of diplomacy."}]},{"cat":"05","type":"fitb","stem":"Padre Dámaso is brash, while Padre ____ is secretive and strategic and orchestrates the attack on Ibarra.","sub":"friar-styles-compared","subtype":"term","answer":["Salvi"],"caseSensitive":false,"fb":"Unlike the brash Dámaso, Padre Salvi is secretive and strategic. His orchestrated attack on Ibarra and the murder of Crispín show his indirect but brutal methods of control."},{"cat":"05","type":"mcq","stem":"A friar, intoxicated by his own arrogance, openly humiliates Ibarra at a feast and insults his father's memory. Which style of control is this?","sub":"friar-styles-compared","options":[{"t":"Dámaso's brash arrogance","c":true,"fb":"Openly insulting people out of arrogance is Dámaso's brash style."},{"t":"Salvi's secret scheming","c":false,"fb":"Salvi works through hidden plots and orchestrated attacks, not open insults."},{"t":"Sibyla's quiet diplomacy","c":false,"fb":"Sibyla is subtle and avoids open confrontation."},{"t":"Tiago's blind obedience","c":false,"fb":"Kapitan Tiago is a Filipino who follows authority; he is not a friar who controls others."}]},{"cat":"05","type":"mcq","stem":"Which native woman, married to a fake Spanish doctor, blindly imitates Spaniards to gain social status?","sub":"colonial-mentality-compared","options":[{"t":"Doña Victorina","c":true,"fb":"Her exaggerated imitation of Spanish ways mocks Filipinos who adopted Spanish mannerisms for status."},{"t":"Doña Consolación","c":false,"fb":"She is married to the Alférez, and her defining trait is abusing her power over other Filipinos."},{"t":"María Clara","c":false,"fb":"María Clara represents the idealized but oppressed Filipina, not colonial mentality."},{"t":"Sisa","c":false,"fb":"Sisa is a poor mother and a victim of abuse, not someone imitating Spaniards."}]},{"cat":"05","type":"mcq","stem":"Both women show colonial mentality. Which behavior marks Doña Consolación but not Doña Victorina?","sub":"colonial-mentality-compared","options":[{"t":"Abusing her power over other Filipinos","c":true,"fb":"Consolación abuses her power, particularly over Sisa, while acting like a Spanish woman."},{"t":"Imitating Spaniards to gain social status","c":false,"fb":"This is Victorina's motive."},{"t":"Despising her own Filipino heritage","c":false,"fb":"Both women despise their own race, so it does not separate them."},{"t":"Wanting María Clara to marry Linares","c":false,"fb":"This is Victorina's scheme, not Consolación's."}]},{"cat":"05","type":"mcq","stem":"Which character believes that true change will require bloodshed?","sub":"ibarra-vs-elias","options":[{"t":"Elías","c":true,"fb":"Elías believes true change will require bloodshed, in contrast to Ibarra's peaceful reform."},{"t":"Ibarra","c":false,"fb":"Ibarra initially believes in reform through peaceful means."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is a progressive official whose peaceful reforms are ignored."},{"t":"Pilosopo Tasyo","c":false,"fb":"Tasyo warns Ibarra to be cautious and does not call for bloodshed."}]},{"cat":"05","type":"scenario","stem":"What does Elías secretly do despite their difference?","sub":"ibarra-vs-elias","context":"During a boat ride on the Pasig River, Elías warns Ibarra about the growing resentment of the Filipino masses. Ibarra, who saved Elías from a crocodile attack, still hopes to reform the country by peaceful means. Elías believes true change will need bloodshed, so the two differ in their views.","options":[{"t":"Pledges to protect Ibarra","c":true,"fb":"Though they differ, Elías secretly pledges to protect Ibarra from his enemies."},{"t":"Reports Ibarra's plans to Padre Salvi","c":false,"fb":"Elías never betrays Ibarra; Salvi is Ibarra's enemy."},{"t":"Takes over Ibarra's school project","c":false,"fb":"Elías does not take over the school project; he protects Ibarra."},{"t":"Abandons Ibarra after the crocodile attack","c":false,"fb":"Elías stays loyal and later saves Ibarra's life."}]},{"cat":"05","type":"multi","stem":"Select the three actions Elías takes to help Ibarra.","sub":"ibarra-vs-elias","options":[{"t":"Saves him from the falling scaffold","c":true,"fb":"Elías intervenes at the cornerstone-laying ceremony and saves Ibarra's life."},{"t":"Helps him escape from prison","c":true,"fb":"With Elías's help, Ibarra escapes and the two flee to Laguna."},{"t":"Draws the guards away from him","c":true,"fb":"Elías sacrifices himself, leading the soldiers away so Ibarra can flee."},{"t":"Hands Ibarra's letters to Salvi","c":false,"fb":"María Clara gave up the letters under Salvi's pressure; Elías did not."},{"t":"Stages the bandits' uprising","c":false,"fb":"The friars secretly manipulated the bandits; Elías did not stage the revolt."}]},{"cat":"05","type":"mcq","stem":"Though competing for power, the 19th-century government and church worked together, using ____ as a tool for political and economic control.","sub":"historical-context","options":[{"t":"Religion","c":true,"fb":"The government and the church used religion as a tool of political and economic control."},{"t":"Education","c":false,"fb":"Education was the tool of reform that the friars feared, not their tool of control."},{"t":"Taxation","c":false,"fb":"Taxation was one of the injustices, not the shared tool of control."},{"t":"Forced labor","c":false,"fb":"Forced labor was one of the injustices, not the shared tool of control."}]},{"cat":"05","type":"mcq","stem":"Padre Sibyla holds a high position in the church. Which friar order does he belong to?","sub":"historical-context","options":[{"t":"Dominican","c":true,"fb":"Sibyla is a Dominican priest."},{"t":"Franciscan","c":false,"fb":"Dámaso and Salvi are the Franciscan friars; this is the common order swap."},{"t":"Augustinian","c":false,"fb":"The Augustinians are named among the powerful orders, but Sibyla is not one."},{"t":"Jesuit","c":false,"fb":"The Jesuits are not his order; Sibyla is a Dominican."}]},{"cat":"05","type":"mcq","stem":"Besides influencing government decisions, the Dominican, Franciscan, and Augustinian friars controlled vast amounts of","sub":"historical-context","options":[{"t":"Land","c":true,"fb":"These orders controlled vast amounts of land."},{"t":"Military forces","c":false,"fb":"Military forces are not what the orders are described as controlling; the stated holding is land."},{"t":"Printing presses","c":false,"fb":"Printing presses are not named; the stated holding is land."},{"t":"Foreign colonies","c":false,"fb":"Foreign colonies are not named; the stated holding is land."}]},{"cat":"05","type":"mcq","stem":"Forced labor in which Filipinos had to work on public projects without pay is called","sub":"polo-y-servicio","options":[{"t":"Polo y servicio","c":true,"fb":"Polo y servicio was forced unpaid labor on public projects."},{"t":"Excessive taxation","c":false,"fb":"Taxation burdened the poor with payments; it was not forced unpaid work."},{"t":"Arbitrary imprisonment","c":false,"fb":"This was jailing opponents without cause, a different injustice."},{"t":"Persecution of critics","c":false,"fb":"This targeted people who opposed the government or church, a different injustice."}]},{"cat":"05","type":"mcq","stem":"Which situation is an example of polo y servicio?","sub":"polo-y-servicio","options":[{"t":"Men forced to build roads unpaid","c":true,"fb":"Polo y servicio was forced labor on public projects without pay."},{"t":"The poor taxed while officials profit","c":false,"fb":"This is excessive taxation, a separate injustice."},{"t":"A critic jailed without a fair trial","c":false,"fb":"This is arbitrary imprisonment, a separate injustice."},{"t":"A landowner charged with heresy","c":false,"fb":"This is the persecution of an opponent (Don Rafael's case), not forced labor."}]},{"cat":"05","type":"multi","stem":"Select the three common injustices Rizal responded to.","sub":"common-injustices","options":[{"t":"Forced labor on public projects","c":true,"fb":"Forced labor (polo y servicio) was a common injustice."},{"t":"Excessive taxation of the poor","c":true,"fb":"Taxes burdened the poor while enriching officials and friars."},{"t":"Arbitrary imprisonment of opponents","c":true,"fb":"Opponents of the government or church were jailed and persecuted arbitrarily."},{"t":"Paid labor on public works","c":false,"fb":"The labor was forced and unpaid, not paid."},{"t":"Lenient treatment of church critics","c":false,"fb":"Critics of the church were persecuted, not treated leniently."}]},{"cat":"05","type":"mcq","stem":"Excessive taxation burdened the poor while enriching whom?","sub":"common-injustices","options":[{"t":"Spanish officials and friars","c":true,"fb":"The burden fell on the poor while Spanish officials and friars were enriched."},{"t":"Filipino landowners","c":false,"fb":"Landowners are not named as the ones enriched; officials and friars are."},{"t":"Civil guards and soldiers","c":false,"fb":"Civil guards and soldiers are not named as the ones enriched; officials and friars are."},{"t":"Kapitan Tiago and the elite","c":false,"fb":"Kapitan Tiago and the Filipino elite are not named as the ones enriched; officials and friars are."}]},{"cat":"05","type":"mcq","stem":"An innocent man punished simply for having influence and wealth exemplifies which theme?","sub":"theme-social-injustice","options":[{"t":"Social injustice and oppression","c":true,"fb":"Don Rafael Ibarra's persecution is a prime example of social injustice and colonial oppression."},{"t":"Education as a tool for reform","c":false,"fb":"This theme is symbolized by Ibarra's school project."},{"t":"Love and sacrifice","c":false,"fb":"This theme concerns the romance of Ibarra and María Clara."},{"t":"The role of women","c":false,"fb":"This theme concerns María Clara and gender inequality."}]},{"cat":"05","type":"mcq","stem":"Which event best illustrates social injustice and colonial oppression?","sub":"theme-social-injustice","options":[{"t":"An innocent landowner jailed for his influence","c":true,"fb":"Don Rafael Ibarra was punished only for his wealth and influence."},{"t":"Townspeople backing Ibarra's planned school","c":false,"fb":"This shows support for the education theme, not oppression."},{"t":"María Clara stopping Ibarra from using a knife","c":false,"fb":"This is part of the love and sacrifice theme."},{"t":"Elías warning Ibarra of the masses' resentment","c":false,"fb":"This belongs to the revolution and nationalism theme."}]},{"cat":"05","type":"mcq","stem":"Which theme condemns clergy who use religion not for spiritual guidance but as a tool of control?","sub":"theme-religious-hypocrisy","options":[{"t":"Religious hypocrisy","c":true,"fb":"Dámaso and Salvi use religion to control the masses and justify evil acts."},{"t":"Role of women and gender inequality","c":false,"fb":"This theme concerns María Clara's traditional role."},{"t":"Education as a tool for reform","c":false,"fb":"This theme concerns Ibarra's school project."},{"t":"Revolution and nationalism","c":false,"fb":"This theme concerns Elías and the call for drastic action."}]},{"cat":"05","type":"mcq","stem":"Which example shows religious hypocrisy?","sub":"theme-religious-hypocrisy","options":[{"t":"Salvi using his post to harm others","c":true,"fb":"Padre Salvi abuses his position to manipulate and harm others, using religion as a tool of control."},{"t":"Guevara telling Ibarra the truth quietly","c":false,"fb":"Guevara is a well-meaning officer, not a hypocritical clergyman."},{"t":"Tasyo warning Ibarra to be cautious","c":false,"fb":"Tasyo is a philosopher giving honest advice."},{"t":"Elías drawing the guards away from Ibarra","c":false,"fb":"Elías is a fugitive acting out of loyalty, not a clergyman misusing religion."}]},{"cat":"05","type":"mcq","stem":"Ibarra's school project symbolizes Rizal's belief that ____ is the key to national progress.","sub":"theme-education-reform","options":[{"t":"Education","c":true,"fb":"The school symbolizes the belief that education is the key to national progress."},{"t":"Armed revolution","c":false,"fb":"Armed change is Elías's belief, not what the school symbolizes."},{"t":"Inherited wealth","c":false,"fb":"Wealth did not protect Don Rafael, and it is not the school's message."},{"t":"Church guidance","c":false,"fb":"The friars opposed the school, so it does not symbolize church guidance."}]},{"cat":"05","type":"mcq","stem":"Which outcome does Ibarra's school project most directly pursue?","sub":"theme-education-reform","options":[{"t":"Freeing people from ignorance and oppression","c":true,"fb":"Knowledge can empower people to break free from ignorance and oppression."},{"t":"Raising taxes for public works projects","c":false,"fb":"The school has nothing to do with taxation."},{"t":"Replacing the friars as town leaders","c":false,"fb":"The school aims to empower people through knowledge, not to replace leaders."},{"t":"Training townspeople to fight the Guardia Civil","c":false,"fb":"Violent action is Elías's view; Ibarra pursues peaceful reform."}]},{"cat":"05","type":"mcq","stem":"María Clara represents which traditional role of women?","sub":"theme-women-gender","options":[{"t":"Submissive, bound by family and religion","c":true,"fb":"She represents the submissive woman bound by family and religious expectations."},{"t":"Independent leader of reform movements","c":false,"fb":"María Clara has little autonomy over her future."},{"t":"Revolutionary fighter beside the men","c":false,"fb":"Revolution is Elías's role in the novel."},{"t":"Outspoken intellectual challenging the friars","c":false,"fb":"Tasyo is the intellectual; María Clara is modest and obedient."}]},{"cat":"05","type":"mcq","stem":"María Clara ends up a prisoner in a convent. What does her fate highlight?","sub":"theme-women-gender","options":[{"t":"Women's limited options in colonial times","c":true,"fb":"Her fate as a convent prisoner highlights the limited options women had."},{"t":"Women's freedom to choose their futures","c":false,"fb":"The convent was forced on her, which is the opposite of free choice."},{"t":"Church support for women's education","c":false,"fb":"The convent signals loss of options, not education."},{"t":"Her success at escaping Padre Salvi","c":false,"fb":"She resigns herself to a life of suffering under Salvi's control."}]},{"cat":"05","type":"scenario","stem":"What does the destruction of their romance reflect?","sub":"theme-love-sacrifice","context":"María Clara gives up the letters that supposedly prove Ibarra's guilt, which leads to his arrest. Ibarra escapes and then disappears into the unknown as a fugitive. Believing her beloved to be dead, María Clara loses all hope and enters a convent.","options":[{"t":"Sacrifices people make under oppression","c":true,"fb":"The romance reflects the sacrifices individuals make in the face of oppression."},{"t":"A rivalry between church and state","c":false,"fb":"That rivalry is shown by the Alférez and Salvi, not the couple's fate."},{"t":"The cost of Ibarra's great wealth","c":false,"fb":"Wealth is part of Don Rafael's persecution, not the cause of this romance's end."},{"t":"Rizal's praise of obedient women","c":false,"fb":"The novel shows the harm of women's limited options; it does not praise them."}]},{"cat":"05","type":"mcq","stem":"In the theme of love and sacrifice, what ultimately destroys the Ibarra and María Clara romance?","sub":"theme-love-sacrifice","options":[{"t":"Societal forces beyond their control","c":true,"fb":"Their relationship is destroyed by societal forces beyond their control."},{"t":"A quarrel over Ibarra's school","c":false,"fb":"No such quarrel destroys the romance."},{"t":"María Clara's fading affection","c":false,"fb":"María Clara gave up the letters while heartbroken and abandoned; her love did not fade."},{"t":"Ibarra's departure for Europe","c":false,"fb":"He studied in Europe for seven years before the romance resumed; that did not end it."}]},{"cat":"05","type":"mcq","stem":"Which character embodies the spirit of revolution in the novel?","sub":"theme-revolution-nationalism","options":[{"t":"Ibarra","c":false,"fb":"Ibarra initially believes in reform through peaceful means, which is the contrast to the revolutionary spirit."},{"t":"Pilosopo Tasyo","c":false,"fb":"Tasyo is the dismissed intellectual who urges caution; he does not embody revolution."},{"t":"Elías","c":true,"fb":"Elías embodies the spirit of revolution and, unlike Ibarra, understands that real change may require drastic action."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is the reform-minded teniente mayor whose peaceful reforms are ignored, not a revolutionary."}]},{"cat":"05","type":"mcq","stem":"The novel's final words from Elías express which attitude?","sub":"theme-revolution-nationalism","options":[{"t":"Hope for the Philippines' future","c":true,"fb":"Elías's final words express hope for the future of the Philippines."},{"t":"A call for vengeance on friars","c":false,"fb":"His revolutionary outlook does not turn his last words into a call for vengeance."},{"t":"Regret over helping Ibarra","c":false,"fb":"Elías stays loyal to Ibarra to the end, so his last words are not regret."},{"t":"Despair over the country's fate","c":false,"fb":"Despair is the opposite of the hope his final words express."}]},{"cat":"05","type":"mcq","stem":"Ibarra returns home after studying in Europe for how long?","sub":"plot-return-and-dinner","options":[{"t":"Three years","c":false,"fb":"Too short; he studied abroad far longer than three years."},{"t":"Seven years","c":true,"fb":"Ibarra returns after seven years of studying in Europe."},{"t":"Ten years","c":false,"fb":"Too long; the period abroad is seven years, not a full decade."},{"t":"Five years","c":false,"fb":"Too short; the period abroad is seven years."}]},{"cat":"05","type":"mcq","stem":"At the grand Manila dinner in honor of Ibarra's return, who openly insults him and belittles his late father?","sub":"plot-return-and-dinner","options":[{"t":"Padre Salvi","c":false,"fb":"Salvi is secretive and strategic; the open insult comes from the brash Dámaso."},{"t":"Padre Sibyla","c":false,"fb":"Sibyla is subtle and calculating, not openly insulting."},{"t":"Alférez","c":false,"fb":"The Alférez commands the Guardia Civil in San Diego and is not the one who insults Ibarra at the dinner."},{"t":"Padre Dámaso","c":true,"fb":"The arrogant Dámaso openly insults Ibarra and belittles Don Rafael at the dinner."}]},{"cat":"05","type":"mcq","stem":"What was done with Don Rafael's body after he died in jail?","sub":"plot-don-rafael-fate","options":[{"t":"Buried beside the church","c":false,"fb":"His body was not given a proper burial; it was desecrated."},{"t":"Burned in San Diego's plaza","c":false,"fb":"The body was not burned; it was thrown into the lake."},{"t":"Thrown into the lake","c":true,"fb":"Don Rafael's body was desecrated and thrown into the lake on Padre Dámaso's orders."},{"t":"Returned to his family","c":false,"fb":"Ibarra learned the truth from Guevara because the body was never returned for a proper burial."}]},{"cat":"05","type":"fitb","stem":"Lieutenant ____ is the well-meaning Spanish officer who secretly tells Ibarra the tragic truth about Don Rafael's death.","sub":"plot-don-rafael-fate","subtype":"term","answer":["Guevara"],"caseSensitive":false,"fb":"Lieutenant Guevara, a noble and just Spanish officer, tells Ibarra after the banquet that his father was falsely accused, died in jail and was thrown into the lake."},{"cat":"05","type":"mcq","stem":"Crispín is beaten to death after being falsely accused of what?","sub":"plot-crispin-death","options":[{"t":"Stealing church money","c":true,"fb":"Crispín is falsely accused of stealing church money and beaten to death by Padre Salvi's men."},{"t":"Insulting a visiting friar","c":false,"fb":"Crispín's accusation is theft, not insulting a friar."},{"t":"Hiding a wanted fugitive","c":false,"fb":"Hiding a fugitive is not the accusation; the charge is stealing church money."},{"t":"Neglecting sacristan duties","c":false,"fb":"He is a sacristan, but the false accusation is theft, not neglect of duty."}]},{"cat":"05","type":"scenario","stem":"Whose men carried out the beating?","sub":"plot-crispin-death","context":"One night in San Diego, a young sacristan is falsely accused of stealing church money and is brutally beaten to death. His older brother escapes but is left traumatized.","options":[{"t":"Alférez's","c":false,"fb":"The Alférez heads the civil guards, but the beating was done by men serving a friar."},{"t":"Padre Salvi's","c":true,"fb":"Padre Salvi's men beat Crispín to death."},{"t":"Padre Dámaso's","c":false,"fb":"Dámaso is the open insulter of Ibarra; the beating is attributed to Salvi's men."},{"t":"Lieutenant Guevara's","c":false,"fb":"Guevara is the just Spanish officer who tells Ibarra about Don Rafael; he is not involved in the beating."}]},{"cat":"05","type":"mcq","stem":"In which town does Ibarra set out to build a school to honor his father's legacy?","sub":"plot-school-and-tasyo","options":[{"t":"Manila","c":false,"fb":"Manila is where the welcome dinner is held, not where the school is built."},{"t":"Berlin","c":false,"fb":"Berlin is where the novel was printed, not the setting of the school."},{"t":"San Diego","c":true,"fb":"Ibarra sets out to build the school in San Diego."},{"t":"Madrid","c":false,"fb":"Ibarra studied in Europe, but the school is built in San Diego, his home town."}]},{"cat":"05","type":"mcq","stem":"Ibarra visits Tasyo for guidance about the school. What advice does Tasyo give?","sub":"
