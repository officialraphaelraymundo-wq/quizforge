plot-school-and-tasyo","options":[{"t":"Move quickly before friars object","c":false,"fb":"Tasyo warns the opposite; haste would ignore the friars' power."},{"t":"Ask the friars to lead it","c":false,"fb":"Tasyo does not suggest handing the project to the friars who oppose challenges to their authority."},{"t":"Abandon the school for revolt","c":false,"fb":"Calling for drastic action fits Elías, not Tasyo."},{"t":"Be cautious of the friars","c":true,"fb":"Tasyo advises caution because the powerful friars will not tolerate any challenge to their authority."}]},{"cat":"05","type":"mcq","stem":"Ibarra saves Elías from a crocodile attack during a boat ride on which river?","sub":"plot-pasig-crocodile","options":[{"t":"Pasig River","c":true,"fb":"The boat ride, where Ibarra meets Elías and saves him from the crocodile, takes place on the Pasig River."},{"t":"Marikina River","c":false,"fb":"A different river; the boat ride is on the Pasig."},{"t":"Pampanga River","c":false,"fb":"Not the river of the boat ride; the encounter is on the Pasig."},{"t":"Agno River","c":false,"fb":"Not the river of the boat ride; the encounter is on the Pasig."}]},{"cat":"05","type":"mcq","stem":"A crocodile attacks during the Pasig boat ride. Who saves whom?","sub":"plot-pasig-crocodile","options":[{"t":"Elías saves María Clara","c":false,"fb":"The rescue runs from Ibarra to Elías; María Clara is not the one saved."},{"t":"Elías saves Ibarra","c":false,"fb":"This swaps the roles; Elías saves Ibarra later, at the cornerstone ceremony, not from the crocodile."},{"t":"Ibarra saves Elías","c":true,"fb":"Ibarra saves Elías from the crocodile, after which Elías warns him of the masses' growing resentment."},{"t":"Ibarra saves Basilio","c":false,"fb":"The person Ibarra saves from the crocodile is Elías, not Basilio."}]},{"cat":"05","type":"mcq","stem":"At the cornerstone-laying ceremony, what is rigged to crush Ibarra?","sub":"plot-cornerstone-attempt","options":[{"t":"A poisoned drink","c":false,"fb":"No poison is involved; the plot uses a loosened scaffold."},{"t":"A loosened scaffold","c":true,"fb":"An assassin loosens a heavy scaffold meant to crush Ibarra."},{"t":"A rigged boat","c":false,"fb":"The boat belongs to the Pasig scene with the crocodile, not the ceremony."},{"t":"A fallen bell tower","c":false,"fb":"No bell tower is involved; the weapon is a scaffold."}]},{"cat":"05","type":"scenario","stem":"Who orchestrates the plot, and who saves Ibarra?","sub":"plot-cornerstone-attempt","context":"As Ibarra's school nears completion, a heavy scaffold is loosened to crush him during the cornerstone-laying ceremony. A man who secretly pledged to protect him intervenes at the last moment.","options":[{"t":"Salvi plots; Elías saves him","c":true,"fb":"Padre Salvi orchestrates the attempt, and Elías intervenes at the last moment."},{"t":"Dámaso plots; Elías saves him","c":false,"fb":"The scheming here is Salvi's; Dámaso is the open insulter."},{"t":"Salvi plots; Basilio saves him","c":false,"fb":"Basilio is a traumatized boy at this point; Elías saves Ibarra."},{"t":"Alférez plots; Elías saves him","c":false,"fb":"The Alférez is not the orchestrator; the plot is attributed to Salvi."}]},{"cat":"05","type":"mcq","stem":"At the San Diego feast, who stops Ibarra from killing Padre Dámaso with a knife?","sub":"plot-feast-knife","options":[{"t":"Elías","c":false,"fb":"Elías saves Ibarra at the cornerstone ceremony; at the feast it is María Clara who stops him."},{"t":"Lieutenant Guevara","c":false,"fb":"Guevara only tells Ibarra about his father; he does not stop the attack."},{"t":"Kapitan Tiago","c":false,"fb":"Tiago blindly follows the Spanish authorities and does not intervene."},{"t":"María Clara","c":true,"fb":"Her desperate pleas for mercy bring Ibarra back to his senses."}]},{"cat":"05","type":"mcq","stem":"Ibarra seizes a knife against Dámaso, then throws it away. What does this incident give his enemies?","sub":"plot-feast-knife","options":[{"t":"Proof of his father's heresy","c":false,"fb":"The incident proves nothing about Don Rafael; it concerns Ibarra's own act."},{"t":"The perfect excuse to destroy him","c":true,"fb":"The incident gives his enemies the perfect excuse to destroy him completely."},{"t":"Grounds to arrest María Clara","c":false,"fb":"She is the one who stops him; she is not the target of the excuse."},{"t":"A reason to expel Elías","c":false,"fb":"The consequence falls on Ibarra, not on Elías."}]},{"cat":"05","type":"mcq","stem":"Bandits manipulated by the friars stage an uprising. Who is falsely accused of leading it?","sub":"plot-uprising-and-betrayal","options":[{"t":"Elías","c":false,"fb":"Elías stays loyal and helps Ibarra escape; he is not the one blamed."},{"t":"Basilio","c":false,"fb":"Basilio is a traumatized youth in hiding, not the accused leader."},{"t":"Ibarra","c":true,"fb":"The friars frame Ibarra as the leader of the revolt."},{"t":"Don Filipo","c":false,"fb":"Don Filipo is a reform-minded official with ignored ideas, not the one framed."}]},{"cat":"05","type":"mcq","stem":"Salvi reveals María Clara's parentage and demands letters. What does she get in exchange?","sub":"plot-uprising-and-betrayal","options":[{"t":"Ibarra's immediate freedom","c":false,"fb":"Her betrayal leads to Ibarra's arrest, not his freedom."},{"t":"Her father's pardon","c":false,"fb":"No pardon is offered; the deal concerns her secret."},{"t":"A place in a convent","c":false,"fb":"The convent comes later, after she believes Ibarra dead."},{"t":"Her parentage kept secret","c":true,"fb":"Salvi forces her to give up the letters in exchange for keeping her true parentage a secret."}]},{"cat":"05","type":"multi","stem":"Exactly three of these events are part of how Ibarra comes to be arrested. Select the three correct options.","sub":"plot-uprising-and-betrayal","options":[{"t":"Friar-manipulated bandits stage an uprising","c":true,"fb":"The bandits' uprising, secretly manipulated by the friars, starts the chain of events."},{"t":"Elías accuses Ibarra of treason","c":false,"fb":"Elías remains loyal to Ibarra and never accuses him."},{"t":"Ibarra is falsely accused of leading it","c":true,"fb":"He is falsely accused of leading the revolt."},{"t":"Dámaso collects the letters from her","c":false,"fb":"Padre Salvi, not Dámaso, forces María Clara to give up the letters."},{"t":"María Clara's betrayal leads to his arrest","c":true,"fb":"Heartbroken, she betrays Ibarra, leading to his arrest."}]},{"cat":"05","type":"mcq","stem":"Elías learns Ibarra's great-grandfather was a Spanish official who did what?","sub":"plot-great-grandfather","options":[{"t":"Persecuted Sisa's family","c":false,"fb":"Sisa's family is not linked to the great-grandfather's wrongdoing."},{"t":"Ruined Elías's family","c":true,"fb":"The great-grandfather was a Spanish official who ruined Elías's own family generations ago."},{"t":"Imprisoned Don Rafael","c":false,"fb":"This mixes up generations; Don Rafael's jailing is the friars' doing."},{"t":"Betrayed Kapitan Tiago","c":false,"fb":"Tiago is not part of this secret."}]},{"cat":"05","type":"scenario","stem":"How does Elías ultimately respond to this discovery?","sub":"plot-great-grandfather","context":"Elías discovers that Ibarra's great-grandfather was a Spanish official who ruined his own family generations ago. At first he despises Ibarra.","options":[{"t":"Stays loyal, believing Ibarra is different","c":true,"fb":"Elías remains loyal, believing Ibarra is different from his ancestors."},{"t":"Abandons Ibarra and leaves San Diego","c":false,"fb":"He does not abandon Ibarra; he later helps him escape."},{"t":"Betrays Ibarra to Padre Salvi","c":false,"fb":"Elías never betrays Ibarra; that betrayal is not part of his role."},{"t":"Demands that Ibarra lead a revolt","c":false,"fb":"Elías believes in radical change but does not force it on Ibarra because of the secret."}]},{"cat":"05","type":"fitb","stem":"With Elías's help, Ibarra escapes prison, and the two fugitives flee into the forests of ____.","sub":"plot-escape-laguna","subtype":"term","answer":["Laguna"],"caseSensitive":false,"fb":"The two fugitives flee into the forests of Laguna, where Elías draws the soldiers away and is fatally shot."},{"cat":"05","type":"mcq","stem":"Pursued by Spanish soldiers in the forest, what does Elías do for Ibarra?","sub":"plot-escape-laguna","options":[{"t":"Surrenders in his place","c":false,"fb":"Elías does not surrender; he leads the soldiers away and is shot."},{"t":"Shields him from a crocodile","c":false,"fb":"The crocodile belongs to the earlier Pasig scene."},{"t":"Draws the soldiers away","c":true,"fb":"Elías sacrifices himself, leading the Spanish soldiers away so Ibarra can flee."},{"t":"Guides him to Basilio","c":false,"fb":"Elías meets Basilio alone, after Ibarra has fled."}]},{"cat":"05","type":"mcq","stem":"Finding Basilio mourning Sisa, what does the dying Elías urge him to do?","sub":"plot-ending","options":[{"t":"Avenge Sisa with bloodshed","c":false,"fb":"Elías urges study and remembrance, not revenge."},{"t":"Study and grow wise","c":true,"fb":"He urges Basilio to study, grow wise, and remember the injustices done to their people."},{"t":"Seek shelter in a convent","c":false,"fb":"The convent is María Clara's fate, not Basilio's."},{"t":"Serve the friars faithfully","c":false,"fb":"This is the opposite of Elías's message."}]},{"cat":"05","type":"fitb","stem":"The dying Elías stumbles into a clearing and entrusts a message and a hidden treasure to ____, who is mourning his mother Sisa.","sub":"plot-ending","subtype":"term","answer":["Basilio"],"caseSensitive":false,"fb":"Basilio, who escaped after his brother Crispín's death, is mourning Sisa when Elías entrusts him with a message and treasure."},{"cat":"05","type":"mcq","stem":"Believing Ibarra to be dead, María Clara loses all hope and goes where?","sub":"plot-ending","options":[{"t":"Back to Kapitan Tiago","c":false,"fb":"She does not return to a normal home life; she resigns herself to suffering elsewhere."},{"t":"To Europe with Linares","c":false,"fb":"Linares is the Spaniard Doña Victorina wants her to marry; she does not leave with him."},{"t":"Into the Laguna forests","c":false,"fb":"The forests are where Ibarra and Elías flee, not María Clara."},{"t":"Into a convent","c":true,"fb":"She enters a convent, resigned to a life of suffering under Padre Salvi's control."}]},{"cat":"05","type":"multi","stem":"Exactly three of these are among the issues Rizal wrote about that still shape the Philippines today. Select the three correct options.","sub":"relevance-overview","options":[{"t":"Forced labor (polo y servicio)","c":false,"fb":"Polo y servicio is a colonial-era abuse listed as historical context, not one of the continuing issues."},{"t":"Corruption","c":true,"fb":"Corruption is one of the issues the novel raised that continue to shape the Philippines."},{"t":"Inequality","c":true,"fb":"Inequality is among the issues that continue to shape the Philippines."},{"t":"The role of education","c":true,"fb":"The role of education is among the continuing issues."},{"t":"Spanish colonial rule","c":false,"fb":"Colonial rule is the historical setting, not one of the continuing issues."}]},{"cat":"05","type":"mcq","stem":"The issues raised by the novel still shape the Philippines how long after its publication?","sub":"relevance-overview","options":[{"t":"About ten years","c":false,"fb":"Far too short; the novel remains relevant well beyond a decade."},{"t":"Around fifty years","c":false,"fb":"Too short; the span is more than a century."},{"t":"More than a century","c":true,"fb":"More than a century later, its issues continue to shape the Philippines."},{"t":"More than two centuries","c":false,"fb":"Too long; the novel was published in 1887."}]},{"cat":"05","type":"mcq","stem":"Ibarra's persecution for seeking change parallels the situation of which present-day group?","sub":"relevance-parallels","options":[{"t":"Harassed activists and critics","c":true,"fb":"Activists, journalists and critics often face harassment, imprisonment or death, like Ibarra."},{"t":"Corrupt government officials","c":false,"fb":"Officials parallel the persecutors, not Ibarra."},{"t":"Underfunded public schools","c":false,"fb":"Schools parallel Ibarra's school project, not his persecution."},{"t":"Abusive religious leaders","c":false,"fb":"These parallel Dámaso and Salvi, not Ibarra."}]},{"cat":"05","type":"mcq","stem":"The friars opposed Ibarra's school. Which present-day concern does that parallel?","sub":"relevance-parallels","options":[{"t":"Women's struggle for equal rights","c":false,"fb":"This parallels María Clara, not the school."},{"t":"The cycle of poverty","c":false,"fb":"This parallels Sisa's family, not the friars' opposition to the school."},{"t":"Education manipulated by those in power","c":true,"fb":"Education is still manipulated by those in power, as the friars sought to control it."},{"t":"Harassment of critics","c":false,"fb":"This parallels Ibarra's persecution, not the school."}]},{"cat":"05","type":"multi","stem":"Exactly three of these pairings of a character with a present-day parallel are correct. Select the three correct options.","sub":"relevance-parallels","options":[{"t":"María Clara: women's equal rights","c":true,"fb":"María Clara links to women's struggle for equal rights."},{"t":"Ibarra: the cycle of poverty","c":false,"fb":"Poverty links to Sisa's family; Ibarra links to harassed activists."},{"t":"Sisa's family: the cycle of poverty","c":true,"fb":"Sisa's family links to the cycle of poverty."},{"t":"María Clara: harassed critics","c":false,"fb":"Harassed critics link to Ibarra; María Clara links to women's rights."},{"t":"Ibarra: harassed activists","c":true,"fb":"Ibarra's persecution links to harassed activists and critics."}]},{"cat":"06","type":"mcq","stem":"Which wealthy returning jeweler secretly plots a violent revolution to overthrow Spanish rule?","sub":"simoun","options":[{"t":"Simoun","c":true,"fb":"Simoun is the jeweler who plots the violent revolution."},{"t":"Basilio","c":false,"fb":"Basilio is the medical student who initially rejects the revolution."},{"t":"Isagani","c":false,"fb":"Isagani is the idealist who rejects violent methods."},{"t":"Kabesang Tales","c":false,"fb":"Kabesang Tales is a bandit, not the jeweler plotter."}]},{"cat":"06","type":"mcq","stem":"Simoun is the transformed identity of which character?","sub":"simoun","options":[{"t":"Crisóstomo Ibarra","c":true,"fb":"Simoun is Crisóstomo Ibarra returned under a new identity."},{"t":"Marcelo del Pilar","c":false,"fb":"Del Pilar is a Propaganda Movement reformist, not Simoun."},{"t":"José Rizal","c":false,"fb":"Rizal is the author, not the novel's protagonist."},{"t":"Placido Penitente","c":false,"fb":"Penitente is a disillusioned student, not Simoun."}]},{"cat":"06","type":"mcq","stem":"How did Ibarra return after his apparent death?","sub":"simoun","options":[{"t":"He faked his death","c":true,"fb":"The novel says Ibarra faked his death and returned as Simoun."},{"t":"He was secretly pardoned","c":false,"fb":"No pardon is stated; his return is a faked death."},{"t":"Friars rescued him","c":false,"fb":"No rescue is stated; the friars are his enemies."},{"t":"A double took his place","c":false,"fb":"No double is involved; Ibarra himself returns."}]},{"cat":"06","type":"mcq","stem":"Which medical student first rejects Simoun's revolution and joins it only later?","sub":"basilio","options":[{"t":"Basilio","c":true,"fb":"Basilio rejects the revolution at first, then joins after Juli's death."},{"t":"Isagani","c":false,"fb":"Isagani never joins Simoun's violent plot."},{"t":"Placido Penitente","c":false,"fb":"Penitente is a disillusioned student tired of the corrupt educational system."},{"t":"Macaraig","c":false,"fb":"Macaraig is a rich student leader pushing for reform."}]},{"cat":"06","type":"mcq","stem":"In the woods of San Diego, whose grave does Basilio visit?","sub":"basilio","options":[{"t":"His mother Sisa","c":true,"fb":"Basilio visits the grave of his mother, Sisa, in San Diego."},{"t":"His fiancée Juli","c":false,"fb":"Juli is alive at that point; he visits his mother's grave."},{"t":"Kabesang Tales","c":false,"fb":"Basilio does not visit Tales' grave; he visits Sisa's."},{"t":"Padre Florentino","c":false,"fb":"The grave in the woods of San Diego is Sisa's."}]},{"cat":"06","type":"mcq","stem":"What tragedy finally makes Basilio join Simoun's movement?","sub":"basilio","options":[{"t":"Juli's suicide","c":true,"fb":"Juli's death fuels Basilio's anger and he finally joins."},{"t":"María Clara's death","c":false,"fb":"María Clara's death devastates Simoun, not Basilio's decision."},{"t":"His mother's death","c":false,"fb":"Sisa's death is earlier backstory, not the turning point."},{"t":"His own imprisonment","c":false,"fb":"Imprisonment alone does not make him join the movement."}]},{"cat":"06","type":"mcq","stem":"Which idealist student is in love with Paulita Gómez?","sub":"isagani","options":[{"t":"Isagani","c":true,"fb":"Isagani is the passionate idealist in love with Paulita Gómez."},{"t":"Basilio","c":false,"fb":"Basilio's love interest is Juli, not Paulita."},{"t":"Sandoval","c":false,"fb":"Sandoval is a Spanish student sympathizer, not Paulita's admirer."},{"t":"Macaraig","c":false,"fb":"Macaraig is a student leader, not the one in love with Paulita."}]},{"cat":"06","type":"mcq","stem":"Who foils Simoun's bomb by throwing the lamp into the river?","sub":"isagani","options":[{"t":"Isagani","c":true,"fb":"Isagani learns of the plan and throws the lamp into the river."},{"t":"Basilio","c":false,"fb":"Basilio joins the movement but does not throw the lamp."},{"t":"Padre Florentino","c":false,"fb":"Florentino shelters Simoun later; he does not foil the bomb."},{"t":"Kabesang Tales","c":false,"fb":"Tales leads the attack on the city, not the lamp rescue."}]},{"cat":"06","type":"mcq","stem":"Isagani rejects which approach to bringing about change?","sub":"isagani","options":[{"t":"Violent revolution","c":true,"fb":"Isagani rejects the violent methods of the revolution."},{"t":"Peaceful reform","c":false,"fb":"Isagani favors reformist, nonviolent ideals."},{"t":"Education reform","c":false,"fb":"Isagani supports the students' push for education reform."},{"t":"Spanish Cortes lobbying","c":false,"fb":"Lobbying the Cortes is the Propaganda Movement's aim; Isagani's rejection is of violent methods only."}]},{"cat":"06","type":"mcq","stem":"Which former farmer turns bandit after his land is usurped?","sub":"kabesang-tales","options":[{"t":"Kabesang Tales","c":true,"fb":"Tales becomes a bandit after suffering land usurpation."},{"t":"Tandang Selo","c":false,"fb":"Selo is Tales' father, who becomes mute, not the bandit leader."},{"t":"Basilio","c":false,"fb":"Basilio is a medical student, not a farmer turned bandit."},{"t":"Isagani","c":false,"fb":"Isagani is a student reformist, not a bandit."}]},{"cat":"06","type":"mcq","stem":"What is Kabesang Tales' real name?","sub":"kabesang-tales","options":[{"t":"Telesforo Juan de Dios","c":true,"fb":"Kabesang Tales was born Telesforo Juan de Dios."},{"t":"Juan Crisóstomo Ibarra","c":false,"fb":"That is Simoun's real name, not Tales'."},{"t":"Mariano Gómez","c":false,"fb":"Gómez is one of the executed GomBurZa priests."},{"t":"Jacinto Zamora","c":false,"fb":"Zamora is another of the executed priests."}]},{"cat":"06","type":"mcq","stem":"Whose death makes Simoun cancel the attack on the city?","sub":"kabesang-tales","options":[{"t":"María Clara","c":true,"fb":"After María Clara's death, Simoun cancels Tales' attack."},{"t":"Juli","c":false,"fb":"Juli's death angers Basilio; it does not cancel the attack."},{"t":"Sisa","c":false,"fb":"Sisa's death is earlier backstory, not the cancellation cause."},{"t":"Tandang Selo","c":false,"fb":"Selo's death does not stop the planned attack."}]},{"cat":"06","type":"mcq","stem":"Which retired priest shelters Simo g of Filipino soldiers and workers led to the execution of three Filipino priests?","sub":"cavite-mutiny","options":[{"t":"Cavite Mutiny","c":true,"fb":"the Cavite Mutiny was the failed uprising that led to the execution of three Filipino priests."},{"t":"The Propaganda Movement","c":false,"fb":"the Propaganda Movement was a peaceful reform movement, not an uprising."},{"t":"Rizal's persecution after Noli Me Tangere","c":false,"fb":"the persecution followed the publication of Noli Me Tangere; it was not an uprising of soldiers and workers."},{"t":"The publication of Noli Me Tangere","c":false,"fb":"a publication is not an uprising; the uprising that led to the priests' execution is the mutiny."}]},{"cat":"06","type":"mcq","stem":"In what year did the Cavite Mutiny take place?","sub":"cavite-mutiny","options":[{"t":"1872","c":true,"fb":"the Cavite Mutiny is dated 1872."},{"t":"1887","c":false,"fb":"1887 is the publication year of Noli Me Tangere."},{"t":"1891","c":false,"fb":"1891 is the publication year of El Filibusterismo."},{"t":"1896","c":false,"fb":"the mutiny is dated 1872, not 1896."}]},{"cat":"06","type":"mcq","stem":"Which peaceful reform movement sought representation for Filipinos in the Spanish Cortes?","sub":"propaganda-movement","options":[{"t":"Propaganda Movement","c":true,"fb":"the Propaganda Movement peacefully sought representation in the Spanish Cortes."},{"t":"Cavite Mutiny","c":false,"fb":"the Cavite Mutiny was a failed armed uprising in 1872."},{"t":"Simoun's revolution","c":false,"fb":"Simoun's revolution is the violent plot inside the novel."},{"t":"Spanish academy bid","c":false,"fb":"the academy bid is the students' request, rejected by the friars."}]},{"cat":"06","type":"mcq","stem":"Besides representation in the Spanish Cortes, what did the Propaganda Movement seek?","sub":"propaganda-movement","options":[{"t":"An end to friar abuses","c":true,"fb":"it also sought an end to friar abuses."},{"t":"Armed independence","c":false,"fb":"the movement was peaceful, not armed."},{"t":"Closure of UST","c":false,"fb":"the students wanted access to education, not closure."},{"t":"Exile of all friars","c":false,"fb":"exile of all friars is not a stated goal of the movement."}]},{"cat":"06","type":"mcq","stem":"What fate befell Rizal after Noli Me Tangere appeared in 1887?","sub":"rizal-persecution","options":[{"t":"Persecution","c":true,"fb":"after the 1887 publication, Rizal faced intense persecution and was labeled subversive."},{"t":"A government post","c":false,"fb":"he was labeled subversive and unwelcome, not given a post."},{"t":"Immediate execution","c":false,"fb":"he faced persecution after 1887, not execution."},{"t":"A celebrated return","c":false,"fb":"he was unwelcome in the Philippines, not celebrated."}]},{"cat":"06","type":"mcq","stem":"What English title is El Filibusterismo known by?","sub":"el-filibusterismo","options":[{"t":"The Reign of Greed","c":true,"fb":"the novel's English title is The Reign of Greed"},{"t":"The Reign of Terror","c":false,"fb":"that phrase is not the title; the printed English title is The Reign of Greed"},{"t":"Touch Me Not","c":false,"fb":"that is the English meaning of Noli Me Tangere, the first novel"},{"t":"The Subversive","c":false,"fb":"subversive is the direct English translation of filibusterismo, but it is not the novel's English title"}]},{"cat":"06","type":"mcq","stem":"On what exact date was El Filibusterismo finally published?","sub":"el-filibusterismo","options":[{"t":"September 18, 1891","c":true,"fb":"with Valentin Ventura's financial help it was finally published on September 18, 1891"},{"t":"March 3, 1887","c":false,"fb":"1887 is the publication year of Noli Me Tangere"},{"t":"June 15, 1872","c":false,"fb":"1872 is the year of the Cavite Mutiny"},{"t":"August 30, 1890","c":false,"fb":"one year early; the printed year is 1891"}]},{"cat":"06","type":"mcq","stem":"El Filibusterismo is the sequel to which earlier novel?","sub":"el-filibusterismo","options":[{"t":"Noli Me Tangere","c":true,"fb":"the sequel continues the story thirteen years after Noli Me Tangere"},{"t":"El Grito de la Integridad","c":false,"fb":"that is the newspaper Ben Zayb writes for, not a novel"},{"t":"Junto al Pasig","c":false,"fb":"that is the satirical student play staged at the Quiapo Fair"},{"t":"The Reign of Greed","c":false,"fb":"that is El Filibusterismo's own English title, not the earlier novel"}]},{"cat":"06","type":"mcq","stem":"What does the title Noli Me Tangere mean in English?","sub":"noli-me-tangere","options":[{"t":"Touch Me Not","c":true,"fb":"the Latin title means Touch Me Not"},{"t":"The Reign of Greed","c":false,"fb":"that is the English title of the sequel, El Filibusterismo"},{"t":"The Reign of Terror","c":false,"fb":"that phrase is not the title's meaning; the printed meaning is Touch Me Not"},{"t":"Beside the Pasig River","c":false,"fb":"that is the meaning of Junto al Pasig"}]},{"cat":"06","type":"mcq","stem":"In what year was Noli Me Tangere published?","sub":"noli-me-tangere","options":[{"t":"1887","c":true,"fb":"Noli Me Tangere was published in 1887; Rizal was persecuted after it"},{"t":"1891","c":false,"fb":"1891 is the publication year of the sequel, El Filibusterismo"},{"t":"1872","c":false,"fb":"1872 is the year of the Cavite Mutiny"},{"t":"1890","c":false,"fb":"the printed year is 1887"}]},{"cat":"06","type":"mcq","stem":"How is Noli Me Tangere's approach described in contrast to its sequel?","sub":"noli-me-tangere","options":[{"t":"Reformist and idealistic","c":true,"fb":"Noli Me Tangere presents a reformist and idealistic approach"},{"t":"Dark and radical","c":false,"fb":"that describes El Filibusterismo, the darker sequel"},{"t":"Violent and pessimistic","c":false,"fb":"that is the sequel's tone, not the first novel's"},{"t":"Satirical and comic","c":false,"fb":"that fits the student play Junto al Pasig"}]},{"cat":"06","type":"mcq","stem":"In which city was El Filibusterismo printed and published?","sub":"ghent","options":[{"t":"Ghent","c":true,"fb":"printing in Ghent, Belgium was cheaper, so the novel was published there"},{"t":"Biarritz","c":false,"fb":"Biarritz is the French city where the manuscript was completed"},{"t":"Paris","c":false,"fb":"the novel was published in Ghent, not Paris"},{"t":"Manila","c":false,"fb":"Rizal was unwelcome in the Philippines; the novel was published in Belgium"}]},{"cat":"06","type":"mcq","stem":"In which city did Rizal complete the El Filibusterismo manuscript?","sub":"biarritz","options":[{"t":"Biarritz","c":true,"fb":"while in Biarritz, France, Rizal completed the manuscript"},{"t":"Ghent","c":false,"fb":"he moved to Ghent afterwards, where printing was cheaper"},{"t":"Manila","c":false,"fb":"he was writing during his travels in Europe, not in Manila"},{"t":"Brussels","c":false,"fb":"not the named city; the manuscript was finished in Biarritz"}]},{"cat":"06","type":"mcq","stem":"Aboard which steamer does the novel begin?","sub":"tabo","options":[{"t":"Tabo","c":true,"fb":"the story opens aboard the steamer Tabo"},{"t":"Pasig","c":false,"fb":"the Pasig is the river in the play's title, not the steamer"},{"t":"Santa Clara","c":false,"fb":"that is the convent where María Clara died"},{"t":"San Diego","c":false,"fb":"that is the town whose woods hold Sisa's grave"}]},{"cat":"06","type":"mcq","stem":"Basilio visits his mother's grave in the woods of which town?","sub":"san-diego","options":[{"t":"San Diego","c":true,"fb":"the grave visit takes place in the woods of San Diego"},{"t":"Quiapo","c":false,"fb":"the Quiapo Fair is where Simoun showcased jewelry, not the grave site"},{"t":"Santa Clara","c":false,"fb":"that is the convent where María Clara died"},{"t":"Ghent","c":false,"fb":"that is the city in Belgium where the novel was printed"}]},{"cat":"06","type":"mcq","stem":"Who is Basilio's mother?","sub":"sisa","options":[{"t":"Sisa","c":true,"fb":"Sisa is Basilio's mother"},{"t":"María Clara","c":false,"fb":"she is Simoun's former fiancée who died in Santa Clara"},{"t":"Juli","c":false,"fb":"Juli is Basilio's fiancée, not his mother"},{"t":"Hermana Bali","c":false,"fb":"she is the gossiping woman who advised Juli"}]},{"cat":"06","type":"mcq","stem":"At which fair does Simoun showcase expensive jewelry to win the wealthy's favor?","sub":"quiapo-fair","options":[{"t":"Quiapo Fair","c":true,"fb":"at the Quiapo Fair he displays expensive jewelry to gain the elites' trust"},{"t":"Manila","c":false,"fb":"Manila is the city; the fair itself is the Quiapo Fair"},{"t":"The wedding reception","c":false,"fb":"the wedding is where the lamp bomb was meant to explode"},{"t":"Junto al Pasig","c":false,"fb":"that is the satirical play staged during the fair"}]},{"cat":"06","type":"mcq","stem":"What is the English meaning of the title Junto al Pasig?","sub":"junto-al-pasig","options":[{"t":"Beside the Pasig River","c":true,"fb":"Junto al Pasig means Beside the Pasig River"},{"t":"Touch Me Not","c":false,"fb":"that is the meaning of Noli Me Tangere"},{"t":"The Reign of Greed","c":false,"fb":"that is the English title of El Filibusterismo"},{"t":"At the River's Mouth","c":false,"fb":"the printed meaning is Beside the Pasig River"}]},{"cat":"06","type":"mcq","stem":"In which convent was María Clara confined and did she die?","sub":"santa-clara-convent","options":[{"t":"Santa Clara","c":true,"fb":"María Clara was confined to and died in the convent of Santa Clara"},{"t":"San Diego","c":false,"fb":"that is the town of Sisa's grave"},{"t":"Quiapo","c":false,"fb":"that is the fair district, not a convent"},{"t":"Ghent","c":false,"fb":"that is the printing city, not a convent"}]},{"cat":"06","type":"mcq","stem":"Who was Simoun's former fiancée?","sub":"maria-clara","options":[{"t":"María Clara","c":true,"fb":"María Clara is Ibarra/Simoun's former fiancée"},{"t":"Paulita Gómez","c":false,"fb":"Paulita is Isagani's love who married Juanito Peláez"},{"t":"Juli","c":false,"fb":"Juli is Basilio's fiancée"},{"t":"Hermana Penchang","c":false,"fb":"she is the devout woman who took Juli as a servant"}]},{"cat":"06","type":"mcq","stem":"Whose death devastates Simoun and makes him cancel the attack on the city?","sub":"maria-clara","options":[{"t":"María Clara","c":true,"fb":"on learning of her death in Santa Clara, Simoun cancels Kabesang Tales' attack"},{"t":"Sisa","c":false,"fb":"Sisa's death is backstory; her grave is in San Diego"},{"t":"Juli","c":false,"fb":"Juli's suicide fuels Basilio's anger, not Simoun's grief"},{"t":"Tandang Selo","c":false,"fb":"he is Kabesang Tales' father, killed by his own grandson"}]},{"cat":"06","type":"mcq","stem":"Simoun hides his bomb inside which object?","sub":"simouns-lamp","options":[{"t":"Simoun's lamp","c":true,"fb":"the bomb is hidden inside a lamp"},{"t":"A jewelry box","c":false,"fb":"the jewelry at the Quiapo Fair is a cover for his influence, not the bomb"},{"t":"A wedding gift","c":false,"fb":"the lamp is set to explode at the wedding, but the bomb is inside the lamp itself"},{"t":"A treasure chest","c":false,"fb":"the treasure is thrown into the sea at the end, not rigged with a bomb"}]},{"cat":"06","type":"mcq","stem":"What was the lamp's explosion at the wedding meant to trigger?","sub":"simouns-lamp","options":[{"t":"A nationwide uprising","c":true,"fb":"the blast was meant to kill officials and friars and trigger a nationwide uprising"},{"t":"A duel with Isagani","c":false,"fb":"Isagani foils the plan by throwing the lamp into the river"},{"t":"Basilio's arrest","c":false,"fb":"Basilio was arrested over the posters, unrelated to the lamp"},{"t":"A fire at the fair","c":false,"fb":"the fair is where Simoun showcased jewelry, not the bomb's target"}]},{"cat":"06","type":"mcq","stem":"What institution did the students propose that the friars rejected?","sub":"spanish-language-academy","options":[{"t":"A Spanish language academy","c":true,"fb":"the students proposed a Spanish language academy; the friars rejected the request"},{"t":"A military academy","c":false,"fb":"not the proposal; the students sought a language academy"},{"t":"A medical school","c":false,"fb":"Basilio was already a medical student; the proposal was an academy"},{"t":"A public library","c":false,"fb":"not the rejected proposal; it was the Spanish language academy"}]},{"cat":"06","type":"mcq","stem":"Which university symbolizes friar control over education in the novel?","sub":"university-of-santo-tomas","options":[{"t":"University of Santo Tomas","c":true,"fb":"UST, where Padre Sibyla is vice-rector, symbolizes friar control of education"},{"t":"University of Paris","c":false,"fb":"not named in the novel; the university is Santo Tomas"},{"t":"A Spanish language academy","c":false,"fb":"that is the academy the students proposed but were denied"},{"t":"The Spanish Cortes","c":false,"fb":"that is the parliament, not a university"}]},{"cat":"06","type":"mcq","stem":"For which newspaper does Ben Zayb write?","sub":"el-grito-de-la-integridad","options":[{"t":"El Grito de la Integridad","c":true,"fb":"Ben Zayb writes for El Grito de la Integridad; his pen name anagrams his surname Ybáñez"},{"t":"Junto al Pasig","c":false,"fb":"that is the student play, not a newspaper"},{"t":"The Spanish Cortes","c":false,"fb":"that is the parliament, not a newspaper"},{"t":"The Reign of Greed","c":false,"fb":"that is the English title of the novel, not a newspaper"}]},{"cat":"06","type":"mcq","stem":"In which parliament did the Propaganda Movement seek Filipino representation?","sub":"spanish-cortes","options":[{"t":"The Spanish Cortes","c":true,"fb":"the movement sought representation in the Spanish Cortes, the parliament"},{"t":"The governor-general's office","c":false,"fb":"the governor-general is manipulated by the friars, but representation was sought in the Cortes"},{"t":"The University of Santo Tomas","c":false,"fb":"that is education, not political representation"},{"t":"The Spanish language academy","c":false,"fb":"that was the students' education proposal, not the parliament"}]},{"cat":"06","type":"mcq","stem":"Around which city did anti-government posters mysteriously appear, leading to student arrests?","sub":"manila","options":[{"t":"Manila","c":true,"fb":"posters appeared around Manila and students such as Basilio and Isagani were arrested"},{"t":"San Diego","c":false,"fb":"that is the town of Sisa's grave"},{"t":"Ghent","c":false,"fb":"that is the Belgian printing city"},{"t":"Biarritz","c":false,"fb":"that is the French city where the manuscript was finished"}]},{"cat":"06","type":"mcq","stem":"What term names the educated Filipino elite, including José Rizal?","sub":"ilustrados","options":[{"t":"Ilustrados","c":true,"fb":"the ilustrados were the educated Filipino elite, among them Rizal, del Pilar, and López Jaena"},{"t":"Indios","c":false,"fb":"indios is the term the hierarchy used for native Filipinos"},{"t":"Mestizos","c":false,"fb":"mestizos were favored by the hierarchy, not the term for the educated elite"},{"t":"OFWs","c":false,"fb":"OFWs are today's overseas workers, not Rizal's elite"}]},{"cat":"06","type":"mcq","stem":"In the novel's colonial hierarchy, what term was used for native Filipinos?","sub":"indios","options":[{"t":"Indios","c":true,"fb":"the rigid hierarchy marginalized native Filipinos, the indios"},{"t":"Ilustrados","c":false,"fb":"that term names the educated elite"},{"t":"Mestizos","c":false,"fb":"mestizos were favored alongside Spaniards"},{"t":"Bandits","c":false,"fb":"bandit is what Kabesang Tales turned into, not the hierarchy's term"}]},{"cat":"06","type":"mcq","stem":"Under colonial mentality today, working abroad as which workers is seen as the only way to achieve success?","sub":"ofws","options":[{"t":"OFWs","c":true,"fb":"working abroad as overseas Filipino workers (OFWs) is perceived as the only path to success"},{"t":"Teachers","c":false,"fb":"not the group named; the perception singles out OFWs"},{"t":"Farmers","c":false,"fb":"not the group named; the perception singles out OFWs"},{"t":"Soldiers","c":false,"fb":"not the group named; the perception singles out OFWs"}]},{"cat":"06","type":"multi","stem":"Which TWO of the following are primary characters of El Filibusterismo? Select the TWO correct options.","sub":"character-categories","options":[{"t":"Simoun","c":true,"fb":"Simoun, the transformed Crisóstomo Ibarra, is a primary character"},{"t":"Basilio","c":true,"fb":"the medical student Basilio is a primary character"},{"t":"Don Custodio","c":false,"fb":"Don Custodio is a secondary character, the self-important official"},{"t":"Juli","c":false,"fb":"Juli is a secondary character, Basilio's fiancée"},{"t":"Ben Zayb","c":false,"fb":"Ben Zayb is a secondary character, the Spanish journalist"}]},{"cat":"06","type":"mcq","stem":"Which of the following is listed among the novel's secondary characters rather than its primary characters?","sub":"character-categories","options":[{"t":"Don Custodio","c":true,"fb":"Don Custodio appears in the secondary characters list, not among the six primary characters."},{"t":"Simoun","c":false,"fb":"Simoun is the first of the primary characters."},{"t":"Basilio","c":false,"fb":"Basilio is the second of the primary characters."},{"t":"Isagani","c":false,"fb":"Isagani is the third of the primary characters."}]},{"cat":"06","type":"multi","stem":"Which TWO of the following are among the six major themes of El Filibusterismo? Select the TWO correct options.","sub":"major-themes","options":[{"t":"Colonialism and oppression","c":true,"fb":"It is the first of the six themes: exploitation, corruption and abuse against native Filipinos."},{"t":"Romantic love as destiny","c":false,"fb":"Love drives subplots such as Isagani and Paulita, but it is not one of the six major themes."},{"t":"Nationalism and struggle for freedom","c":true,"fb":"It is the second theme; the novel takes a more radical stance on revolution than Noli Me Tangere."},{"t":"The glorification of banditry","c":false,"fb":"Tales' banditry is shown as a tragic symptom of internal conflict, not glorified."},{"t":"The inevitability of violent revolution","c":false,"fb":"The novel warns against violence; reform is said to come through enlightenment."}]},{"cat":"06","type":"mcq","stem":"Which of the following is one of the novel's six major themes?","sub":"major-themes","options":[{"t":"Education and enlightenment","c":true,"fb":"education and enlightenment is the fifth of the six major themes."},{"t":"A treasure-hunting adventure","c":false,"fb":"no such theme is listed among the six."},{"t":"A royal coronation","c":false,"fb":"no such theme is listed among the six."},{"t":"An epic sea voyage","c":false,"fb":"no such theme is listed among the six."}]},{"cat":"06","type":"mcq","stem":"Whom does the novel blame for the exploitation of native Filipinos?","sub":"theme-colonialism-oppression","options":[{"t":"the native Filipino farmers and bandits","c":false,"fb":"Farmers like Kabesang Tales are victims of land usurpation, not the exploiters."},{"t":"the Chinese merchants and foreign traders","c":false,"fb":"Quiroga collaborates for gain, but he is one actor, not the whole of the blame."},{"t":"the Spanish government, clergy and elites","c":true,"fb":"Exploitation, corruption and abuse are committed by the Spanish government, clergy and elites."},{"t":"the ilustrados and student reformers","c":false,"fb":"The ilustrados push for reform; the blame falls on the colonial power structure."}]},{"cat":"06","type":"mcq","stem":"Which pair of corrupt friars symbolizes the moral decay of the religious sector?","sub":"theme-colonialism-oppression","options":[{"t":"Padre Florentino and Padre Fernández","c":false,"fb":"Both are sympathetic, open-minded priests, not corrupt ones."},{"t":"Padre Sibyla and Don Custodio","c":false,"fb":"Custodio is a lay official, not a friar; the corrupt pair named are Salvi and Camorra."},{"t":"Padre Salvi and Padre Camorra","c":true,"fb":"These corrupt friars symbolize clerical moral ,"fb":"The revolutionary plot fails due to a lack of unity among Filipinos."}]},{"cat":"06","type":"mcq","stem":"Which students symbolize the intellectual movement pushing for peaceful progress?","sub":"theme-nationalism-freedom","options":[{"t":"Basilio, Juli and Selo","c":false,"fb":"Juli and Selo are not students; the trio named are Isagani, Sandoval and Macaraig."},{"t":"Paulita, Juanito and Quiroga","c":false,"fb":"These are elite or merchant figures, not student reformers."},{"t":"Isagani, Sandoval and Macaraig","c":true,"fb":"These students advocating education reform symbolize peaceful progress."},{"t":"Penitente, Sibyla and Ben Zayb","c":false,"fb":"Sibyla and Ben Zayb suppress or distort reform; Penitente is disillusioned."}]},{"cat":"06","type":"mcq","stem":"Which groups did the rigid colonial social hierarchy favor?","sub":"theme-social-hierarchy","options":[{"t":"indios and farmers","c":false,"fb":"Indios were marginalized by the hierarchy, not favored."},{"t":"Chinese merchants only","c":false,"fb":"Quiroga seeks Spanish favor, but the favored classes are Spaniards and mestizos."},{"t":"Spaniards and mestizos","c":true,"fb":"The hierarchy favored Spaniards and mestizos while marginalizing native Filipinos."},{"t":"ilustrados and students","c":false,"fb":"The ilustrados sought representation but were not the favored class."}]},{"cat":"06","type":"mcq","stem":"What does the elite's expensive jewelry and extravagant lifestyle symbolize?","sub":"theme-social-hierarchy","options":[{"t":"cultural refinement","c":false,"fb":"The display is read as greed and status, not refinement."},{"t":"religious devotion","c":false,"fb":"Devotion belongs to figures like Hermana Penchang, not the elite's display."},{"t":"greed and superficiality","c":true,"fb":"Jewelry and lifestyle symbolize the greed and superficiality of those in power."},{"t":"national patriotism","c":false,"fb":"The elite's display serves power and status, not patriotism."}]},{"cat":"06","type":"mcq"," // ── Sub-topic (variant) groups ──────────────────────────────────
// Questions that carry the same `sub` key inside the same category
// are VARIANTS OF ONE CONCEPT — three different ways of asking about
// the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  const pool = availableQuestions();
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = pool.filter(q => q.cat === c.key).length;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Java syntax highlighting for the code box.
// Tokenises the RAW source and escapes each token as it wraps it. Never run
// a highlighter over already-escaped HTML -- it tears &quot; and &lt; apart.
// Comments and strings come first in the alternation, so a keyword sitting
// inside a string or a comment is not coloured.
const JAVA_KEYWORDS = /^(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|record|sealed|permits|yield)$/;
const JAVA_TOKEN_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function highlightJava(src) {
  let out = '', last = 0, m;
  JAVA_TOKEN_RE.lastIndex = 0;
  while ((m = JAVA_TOKEN_RE.exec(src)) !== null) {
    if (m.index > last) out += escapeHtml(src.slice(last, m.index));
    const txt = m[0];
    let cls = null;
    if (m[1]) cls = 'tok-comment';
    else if (m[2]) cls = 'tok-string';
    else if (m[3]) cls = 'tok-annot';
    else if (m[4]) cls = 'tok-num';
    else if (m[5]) {
      if (JAVA_KEYWORDS.test(m[5])) cls = 'tok-kw';
      else if (/^[A-Z]/.test(m[5])) cls = 'tok-type';
    }
    out += cls ? `<span class="${cls}">${escapeHtml(txt)}</span>` : escapeHtml(txt);
    last = m.index + txt.length;
  }
  if (last < src.length) out += escapeHtml(src.slice(last));
  return out;
}

// Highlight only what we can actually parse. Anything not tagged java --
// pseudocode, plain text -- falls through to the plain escaped path.
function renderCodeBody(code, lang) {
  const src = String(code).replace(/^\r?\n+/, '').replace(/\r?\n\s*$/, '');
  return (lang && String(lang).toLowerCase() === 'java') ? highlightJava(src) : escapeHtml(src);
}

function formatInline(s) {
  if (!s) return '';
  const parts = String(s).split(/(`[^`]+`)/g);
  return parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  const blocks = [];
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const isDiagram = lang && ['text', 'diagram', 'ascii', 'tree'].includes(lang.toLowerCase());
    const badge = isDiagram ? 'DIAGRAM' : ((lang ? lang.toUpperCase() + ' ' : '') + 'CODE');
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    const placeholder = `___BLOCK_${blocks.length}___`;
    blocks.push(`<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(code, lang || 'java')}</code></pre></div>`);
    return placeholder;
  });

  // 2. Format inline code & escape remaining text
  const parts = text.split(/(`[^`]+`)/g);
  text = parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');

  // 3. Restore fenced code blocks
  blocks.forEach((block, i) => {
    text = text.replace(`___BLOCK_${i}___`, block);
  });

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  const pool = availableQuestions();
  if (!state.focusEnabled || state.focusedCats.length === 0) return pool.length;
  return pool.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'parsons') { return { type:q.type, stem:q.stem, lines:q.lines, origIdx:q.origIdx, cat:q.cat }; }
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

// Flags: a question flagged during a quiz leaves later quizzes on this browser.
// Packs have no question IDs, so a flag is keyed on a hash of the stem.
const FLAG_KEY = 'quizforge_flags_' + ((PACK.meta && (PACK.meta.packId || PACK.meta.subject)) || 'quiz');
let flags = {};
try {
  const saved = JSON.parse(localStorage.getItem(FLAG_KEY) || '{}');
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) flags = saved;
} catch (e) { /* storage unavailable or invalid */ }

function flagId(q) {
  let h = 5381;
  for (let i = 0; i < q.stem.length; i++) h = (h * 33 + q.stem.charCodeAt(i)) >>> 0;
  return 'q' + h.toString(36);
}
function isFlagged(q) { return Object.prototype.hasOwnProperty.call(flags, flagId(q)); }
function availableQuestions() { return BANK.filter(q => !isFlagged(q)); }
function saveFlags() {
  try { localStorage.setItem(FLAG_KEY, JSON.stringify(flags)); } catch (e) { /* storage unavailable */ }
  renderFlagNote();
  updateSetupSummary();
}
function renderFlagNote() {
  const n = Object.keys(flags).length;
  $('flagNote').classList.toggle('hidden', n === 0);
  $('flagCount').textContent = n + (n === 1 ? ' question' : ' questions') + ' flagged and hidden';
}
function syncFlagBtn() {
  const q = state.questions[state.current];
  if (q) $('flagBtn').textContent = isFlagged(q) ? 'Flagged: undo' : 'Flag question';
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i })).filter(q => !isFlagged(q));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i })).filter(q => !isFlagged(q));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}


/* ── Parsons (arrange the code) — additive, offline, no library ─────── */
function pSeq(q){ return q.lines.filter(function(l){return !l.distractor;}).map(function(l){return String(l.code).trim();}); }
function pEnsure(i){
  state.pBank = state.pBank || {}; state.pInit = state.pInit || {};
  if(!state.pInit[i]){
    var ids = state.questions[i].lines.map(function(_,k){return k;});
    for(var a=ids.length-1;a>0;a--){var b=Math.random()*(a+1)|0;var t=ids[a];ids[a]=ids[b];ids[b]=t;}
    state.pBank[i]=ids;

function pScore(q, ans){

  var marks=ans.map(function(k,pos){ var l=q.lines[k]; return !!(l && !l.distractor && pos<need && (String(l.code).trim()===seq[pos] || (l.swap && want[pos].swap===l.swap))); });
  var right=marks.filter(Boolean).length, filled=ans.length>0;
  var status = !filled ? 'skipped' : (right===need && ans.length===need) ? 'correct' : right===0 ? 'wrong' : 'partial';
  return { score: need?right/need:0, status:status, marks:marks, right:right, need:need };
}

function pDown(e,i){

function pMoveClone(x,y){ pDrag.clone.style.left=(x-pDrag.offX)+'px'; pDrag.clone.style.top=(y-pDrag.offY)+'px'; }

  if(!pDrag)return;

    var dx=e.clientX-pDrag.startX, dy=e.clientY-pDrag.startY;
    if(dx*dx+dy*dy < 36) return;

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'parsons') { return pScore(q, selectedIdxs); }
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

$('timerToggle').addEventListener('click', () => {
  if (state.examMode) return;            // locked during exam simulation
  state.timerEnabled = !state.timerEnabled;
  $('timerToggle').classList.toggle('on', state.timerEnabled);
  $('timerToggle').setAttribute('aria-checked', state.timerEnabled);
  $('timePicker').classList.toggle('hidden', !state.timerEnabled);
  updateSetupSummary();
});
$('timerToggle').addEventListener('keydown', e => {

});

document.querySelectorAll('.time-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    state.timerMinutes = parseInt(chip.dataset.min, 10);
    updateSetupSummary();
  });
});

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'At the end, when you finish';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'No questions available' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `${available} questions available across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'At the end, when you finish';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Right after you press Check';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? availableQuestions().filter(q => state.focusedCats.includes(q.cat)) : availableQuestions();
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'No questions available';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}
updateSetupSummary();

// ----- start the quiz -----
$('flagBtn').addEventListener('click', () => {
  const q = state.questions[state.current];
  if (isFlagged(q)) delete flags[flagId(q)]; else flags[flagId(q)] = q.stem;
  saveFlags();

});
$('flagRestore').addEventListener('click', () => { flags = {}; saveFlags(); });
$('flagCopy').addEventListener('click', () => {

renderFlagNote();

$('startBtn').addEventListener('click', () => {
  state.questions = buildActiveQuiz();
  if (state.questions.length === 0) { window.alert('Every question in this selection is flagged. Restore them to continue.'); return; }
  state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
  state.checked   = state.questions.map(() => false);
  state.current   = 0;
  state.timeUp    = false;
  state.timeUsedMs = 0;

  $('view-setup').classList.add('hidden');
  $('view-quiz').classList.remove('hidden');
  $('view-quiz').classList.add('fade-in');

  // Test-mode notice
  $('testNotice').classList.toggle('hidden', !state.timerEnabled);

  // Start timer if needed
