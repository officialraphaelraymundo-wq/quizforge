/* --- palette test overrides --- */
.masthead,.divider-double{border-color:var(--accent)}
.display{font-weight:600}.display em{font-weight:600}
.qstem{font-size:1.6875rem;font-weight:500}
.progress-info .qcount{font-weight:500}
.opt-feedback{font-size:1rem}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
.opt.selected{border-color:var(--purple-lt)}
.opt.selected .opt-marker{background:var(--purple-lt);border-color:var(--purple-lt);color:#fff}
.qtype-tag{background:var(--purple);color:var(--ink)}
.section-label::before{content:"\2660";width:auto;height:auto;background:none;color:var(--accent);font-size:0.875rem;line-height:1}
.tabs{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 14px;margin-bottom:18px;background:linear-gradient(var(--bg) 70%,transparent)}
.tabs button[data-v]{font-family:var(--body);font-size:0.875rem;padding:6px 14px;background:var(--bg-2);color:var(--ink-soft);border:1px solid var(--rule-strong);border-radius:99px;cursor:pointer}
.tabs button[data-v].on{border-color:var(--accent);color:var(--accent)}

/* ---- v2: research-based refinements ---- */
/* Readability: thin display face is kept for headings only; explanations use the sturdier body face (WCAG 1.4.3 note on thin fonts) */
.opt-feedback{font-family:var(--body);font-style:normal;font-size:0.9688rem;line-height:1.55;color:var(--ink-soft)}
.opt-text{font-size:1.0312rem}
.qstem{font-weight:600}
/* Small labels: raise the tiny mono sizes */
.qverdict-text{font-size:0.7812rem}
.opt-tag{font-size:0.7188rem;padding:2px 8px}
.jump-dot{width:40px;height:40px;font-size:0.8125rem}
.question-jumper{gap:8px}
.qtype-tag{font-size:0.75rem}
.progress-info{font-size:0.7812rem}
/* Contrast fixes: dark text on light markers */
.opt.is-wrong .opt-marker,.opt.is-wrong .opt-tag.you{color:var(--bg)}
.opt.selected .opt-marker{background:var(--purple-lt);color:var(--bg)}
.opt:hover:not(.locked){border-color:var(--purple-lt)}
/* Not colour alone (WCAG 1.4.1): shape + symbol + border style for each result */
.opt.is-correct{border-width:2px;border-style:solid}
.opt.is-wrong{border-style:dashed}
.opt.is-missed{border-style:dotted;border-width:2px}
.opt.is-correct .opt-marker,.opt.is-wrong .opt-marker,.opt.is-missed .opt-marker{font-size:0}
.opt.is-correct .opt-marker::after{content:"\2713";font-size:0.875rem}
.opt.is-wrong .opt-marker::after{content:"\2717";font-size:0.875rem}
.opt.is-missed .opt-marker::after{content:"!";font-size:0.875rem}
/* Learning: after Check, the right answer is the loudest thing; wrong picks stay visible but calmer */
.opt.is-correct{box-shadow:0 0 0 1px var(--correct),0 0 20px rgba(127,196,154,.30)}
.opt.is-wrong{box-shadow:none;background:rgba(224,112,127,.08)}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed){opacity:1}
.opt.locked:not(.is-correct):not(.is-wrong):not(.is-missed) .opt-text{color:var(--ink-mute)}
/* Touch targets (WCAG 2.5.8 min 24px; Material 48dp with 8dp gaps) */
.btn{min-height:48px}
.count-card,.topic-chip,.time-chip{min-height:48px}
.options{gap:12px}
.toggle{width:52px;height:30px}
.toggle::after{width:22px;height:22px}
.toggle.on::after{transform:translateX(22px)}
.opt-toggle-row{min-height:56px}
:focus-visible{outline:3px solid var(--purple-lt);outline-offset:3px}
@media (max-width:600px){
  .nav-row{position:sticky;bottom:0;z-index:4;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 28%)}
  .nav-right{width:100%}
  .nav-right .btn.primary,.nav-right .btn:not(.ghost){flex:1}
  .qcard{padding:26px 18px}
  .qverdict{margin:-26px -18px 22px}
  .qstem{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3: restrained playing-card theme ---- */
.qcard{position:relative;border-radius:12px;padding-bottom:58px;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:6px;border:1px solid rgba(201,169,110,.28);border-radius:8px;pointer-events:none}

/* ============================================================
   QuizForge shared theme — load in BOTH hub and quiz templates
   Dark is default; light "paper" mode follows the phone setting.
   ============================================================ */
:root{
  --bg:#0F0E13; --bg-2:#1C1A22; --bg-deep:#25222E; --bg-raise:#2E2A3A;
  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#C9A96E; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;
  --gold:#A98BE0; --gold-bg:#211A33; --gold-edge:#3F3163;   /* "partial / missed" = lavender */
  --bg-glow:rgba(91,63,140,.30); --bg-glow-2:rgba(91,63,140,.14); --spade-alpha:.09;
  --frame:rgba(201,169,110,.30);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --radius-card:12px; --radius-ctl:8px;
  --display:"Cormorant Garamond",Garamond,"Palatino Linotype",Georgia,serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --tok-type:#A98BE0;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;
    --ink:#1C1A22; --ink-soft:#45414F; --ink-mute:#66626F;
    --rule:#DDD6C8; --rule-strong:#C4BAA6;
    --accent:#80612A; --accent-deep:#5A441D; --accent-soft:#F1E8D6;
    --purple:#5B3F8C; --purple-lt:#6546A3; --on-purple:#FBF9F4;
    --correct:#23704A; --correct-bg:#E2F0E6; --correct-edge:#A9CFB7;
    --wrong:#A8324A; --wrong-bg:#F8E3E7; --wrong-edge:#E0AAB5;
    --gold:#6546A3; --gold-bg:#ECE5F6; --gold-edge:#C6B6E6;
    --bg-glow:rgba(91,63,140,.12); --bg-glow-2:rgba(201,169,110,.12); --spade-alpha:.06;
    --frame:rgba(128,97,42,.35);
    --shadow:0 1px 0 rgba(28,26,34,.05),0 8px 24px -14px rgba(28,26,34,.25);
    --tok-type:#6546A3;
    color-scheme:light;
  }
}

  --bg:#F4F1EA; --bg-2:#FBF9F4; --bg-deep:#ECE7DC; --bg-raise:#E4DDCF;

/* ============================================================
   QuizForge shared theme — "Reading Room" variant — load in BOTH hub and quiz templates

:root{

  --ink:#F4F1EA; --ink-soft:#B9B6C0; --ink-mute:#8B8895;
  --rule:#2A2733; --rule-strong:#3F3A4D;
  --accent:#B39A6B; --accent-deep:#6B5530; --accent-soft:#2A2115;
  --purple:#5B3F8C; --purple-lt:#8A6BC4; --on-purple:#F4F1EA;
  --correct:#7FC49A; --correct-bg:#14261D; --correct-edge:#2C4A3A;
  --wrong:#E0707F; --wrong-bg:#2B151B; --wrong-edge:#4A2530;

}

/* ================= Reading Room overrides ================= */
body{background-image:radial-gradient(900px 600px at 6% -10%,var(--lamp),transparent 62%),radial-gradient(900px 600px at 105% 115%,var(--bg-glow-2),transparent 60%)}
.display{font-weight:500}
.display em{font-style:italic;color:var(--accent)}
.eyebrow{font-family:var(--type);font-size:0.875rem;letter-spacing:0;text-transform:none;color:var(--accent)}
.divider-double{border-color:var(--rule-strong)}
.section-label{font-family:var(--display);font-size:1.375rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink)}
.section-label::before{content:none}
/* masthead: course code as a call number */
.codex{font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:0;border:0;background:none;color:var(--ink-soft);padding:0}
.codex::after{content:" \2660";font-size:0.5625rem;color:var(--ink-mute);opacity:.7}
.stamp{font-family:var(--type);font-size:0.7812rem;letter-spacing:.04em;border:1px solid var(--rule-strong);padding:2px 8px;color:var(--ink-mute)}
.crumb{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8125rem}
/* length choices as small catalog cards */
.count-card{border-radius:4px;background-color:var(--page);background-image:linear-gradient(var(--purple),var(--purple)),repeating-linear-gradient(to bottom,transparent 0 21px,var(--ruled) 21px 22px);background-size:100% 2px,100% 100%;background-position:0 0,0 0;background-repeat:no-repeat}
.count-card.active{background-color:var(--bg-deep);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.count-num{font-weight:500}
.count-label{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.ot-title{font-family:var(--display);font-size:1.25rem;font-weight:500}
.ot-sub{font-family:var(--type);font-size:0.8125rem;letter-spacing:0;text-transform:none}
.setup-summary .ss-item .ss-key,.meta-item .meta-key{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.7812rem}
.meta-row{border-left-color:var(--purple)}
/* progress: a purple ribbon */
.progress-bar{height:6px;background:var(--rule);border-radius:0}
.progress-fill{background:var(--purple-lt);clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%)}
.progress-info{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem}
.jump-dot{font-family:var(--type);border-radius:3px}
.jump-dot.current::after{content:none}
/* the question card is a book page */
.qcard{border-radius:3px;background-color:var(--page);background-image:linear-gradient(90deg,var(--page-edge),transparent 22px);padding-right:58px;padding-bottom:50px;overflow:visible}
.qcard::before{content:"\2660";inset:auto;top:-1px;right:24px;width:15px;height:58px;border:0;border-radius:0;background:var(--purple);color:var(--bg);font-size:0.5rem;line-height:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);z-index:2}
.qverdict{border-radius:0;margin:-32px -58px 26px -30px;padding-right:58px}
.folio{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-family:var(--display);font-style:italic;font-size:0.9375rem;color:var(--ink-mute)}
.qtype-tag{font-family:var(--type);font-size:0.7812rem;letter-spacing:0;text-transform:none;background:none;color:var(--accent);padding:0;border:0}
.qstem{font-family:var(--display);font-weight:500;font-size:1.6875rem;line-height:1.28}
.opt{border-radius:4px}
.opt-text{font-family:var(--body)}
.opt-marker{font-family:var(--type);border-radius:3px}
/* explanations read like margin notes */
.opt-feedback{position:relative;margin-top:10px;padding:2px 0 2px 14px;border-left:2px solid var(--rule-strong);background:none}
.opt-feedback::before{content:"Note \2014 ";font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute)}
.opt.is-correct .opt-feedback{border-left-color:var(--correct)}
.opt.is-wrong .opt-feedback{border-left-color:var(--wrong)}
.opt.is-missed .opt-feedback{border-left-color:var(--gold)}
.opt-tag{font-family:var(--type);letter-spacing:0;text-transform:none;border-radius:2px}
.qverdict-text{font-family:var(--body);letter-spacing:0;text-transform:none}
.btn{border-radius:4px}
/* results: library date stamp */
.score-dial .fill{stroke:var(--purple-lt)}
.verdict-eyebrow{font-family:var(--type);letter-spacing:0;text-transform:none;font-size:0.8438rem;color:var(--accent)}
.verdict{font-family:var(--display);font-weight:500}
.date-stamp{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:6px 14px;border:2px solid var(--purple-lt);outline:1px solid var(--purple-lt);outline-offset:2px;border-radius:3px;font-family:var(--type);font-weight:700;font-size:0.875rem;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-lt);transform:rotate(-4deg);opacity:.9}
.date-stamp b{font-size:0.75rem}
@media (max-width:600px){
  .qcard{padding:24px 44px 44px 18px}
  .qcard::before{right:14px;width:13px;height:48px}
  .qverdict{margin:-24px -44px 22px -18px;padding-right:44px}
  .qstem{font-size:1.4375rem}
  .section-label{font-size:1.1875rem}
}

/* ================= quiet whimsy ================= */
/* pencil notes in the verdict banner */
.qverdict{position:relative}
.qverdict{flex-wrap:wrap}
.qverdict::after{position:static;margin-left:auto;max-width:48%;text-align:right;line-height:1.05;transform:rotate(-3deg);font-family:"Caveat","Segoe Print",cursive;font-weight:500;font-size:1.1875rem;opacity:.85;pointer-events:none}
.qverdict.correct::after{content:"nicely done";color:var(--correct)}
.qverdict.wrong::after{content:"happens to the best of us";color:var(--wrong)}
/* the ribbon sways once when you get one right */
@keyframes ribbon-sway{0%{transform:rotate(0)}25%{transform:rotate(5deg)}55%{transform:rotate(-3deg)}80%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
.qcard::before{transform-origin:50% 0}
.qcard:has(.qverdict.correct)::before{animation:ribbon-sway 1.4s ease-out 1}
/* dog-eared page corner that folds a little more on hover */
.qcard::after{content:"";position:absolute;left:-1px;bottom:-1px;width:16px;height:16px;background:linear-gradient(45deg,var(--bg) 50%,var(--bg-raise) 50%);box-shadow:1px -1px 2px rgba(0,0,0,.18);transition:width .25s,height .25s}
.qcard:hover::after{width:24px;height:24px}
/* results: stamp + due slip */
.stamp-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:18px}
.stamp-row .date-stamp{margin-top:0}
.due-slip{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:10px;padding:8px 14px 10px;background-color:var(--page);background-image:repeating-linear-gradient(to bottom,transparent 0 17px,var(--ruled) 17px 18px);border:1px solid var(--rule-strong);border-top:3px solid var(--purple);font-family:var(--type);font-size:0.7812rem;color:var(--ink-mute);transform:rotate(1.5deg)}
.due-slip b{font-size:1rem;color:var(--ink)}
.due-slip em{grid-column:1/-1;font-style:normal;font-family:"Caveat",cursive;font-size:1.0625rem;color:var(--ink-soft)}
@media (max-width:600px){.qverdict::after{font-size:1.0625rem;max-width:44%}}
@media (max-width:380px){.qverdict::after{display:none}}
@media (prefers-reduced-motion:reduce){.qcard:has(.qverdict.correct)::before{animation:none}.qcard::after{transition:none}}

/* ---- intuitiveness pass ---- */
.nav-left{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.quiet{background:none;border:none;color:var(--ink-mute);font-size:0.875rem;padding:8px 10px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn.quiet:hover,.btn.quiet:focus-visible{color:var(--wrong)}
/* jump dots: a mark as well as a colour, so status reads without colour vision */
.jump-dot.checked-correct::after,.jump-dot.checked-wrong::after,.jump-dot.checked-partial::after{position:absolute;top:1px;right:3px;font-size:0.625rem;line-height:1;color:var(--bg);font-family:var(--body);font-weight:600}
.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}
.jump-dot.checked-partial::after,.jump-dot.checked-partial.current::after{content:"\00BD"}
@media (max-width:600px){.nav-left{width:100%;justify-content:space-between}}


/* ================= live engine additions ================= */

.qcard,#view-results,.display{overflow-wrap:anywhere}

.jump-dot.checked-correct::after,.jump-dot.checked-correct.current::after{content:"\2713"}
.jump-dot.checked-wrong::after,.jump-dot.checked-wrong.current::after{content:"\00D7"}

ions":[{"t":"The Board of National Education","c":true,"fb":"The Board of National Education was mandated to prepare primers and textbooks."},{"t":"The Supreme Court of the Philippines","c":false,"fb":"The judiciary interprets laws rather than developing school textbooks."},{"t":"The Philippine Military Academy","c":false,"fb":"Military academies train officers and do not produce national school readers."},{"t":"The National Economic Council","c":false,"fb":"Economic planning agencies had no statutory authority over educational primers."}]},{"cat":"01-1","type":"multi","stem":"Which TWO editions of Rizal's novels are mandated as basic texts in collegiate courses? Select the TWO permitted collegiate texts.","sub":"collegiate-basic-texts","options":[{"t":"Original or unexpurgated editions","c":true,"fb":"Colleges are required to use unexpurgated copies of Noli and El Fili."},{"t":"English translations of the novels","c":true,"fb":"The statute explicitly permits using English translations as collegiate basic texts."},{"t":"Heavily abridged comic book adaptations","c":false,"fb":"Illustrated comic versions do not satisfy the basic collegiate text requirement."},{"t":"Fictional stage plays written by modern authors","c":false,"fb":"The law requires Rizal's original novels or translations, not theater scripts."},{"t":"Foreign cinematic screenplays based on the plots","c":false,"fb":"Movie screenplays cannot substitute for the mandated literary novel texts."}]},{"cat":"01-1","type":"multi","stem":"Which TWO text formats of Noli Me Tangere and El Filibusterismo satisfy collegiate requirements? Select the TWO approved text formats.","sub":"collegiate-basic-texts","options":[{"t":"Unexpurgated editions of the novels","c":true,"fb":"Unexpurgated versions preserve the complete text as authored by Rizal."},{"t":"Official English translations of the works","c":true,"fb":"English translations are specifically authorized by law for college courses."},{"t":"Unverified online student study summaries","c":false,"fb":"Informal study guides do not meet the statutory collegiate text mandate."},{"t":"Condensations with all political chapters removed","c":false,"fb":"Censored or expurgated editions are not authorized as basic collegiate texts."},{"t":"Children's storybook editions with simplified plots","c":false,"fb":"Elementary storybooks fail to fulfill the statutory collegiate requirements."}]},{"cat":"01-1","type":"mcq","stem":"How many key factors served as the fuel for the creation of the Rizal Law?","sub":"four-factors-national-identity","options":[{"t":"Four key factors","c":true,"fb":"Four key factors fueled the law: nationalism and patriotism, educational reform, counteracting colonial mentality, and response to contemporary issues."},{"t":"Two key factors","c":false,"fb":"Understates the multifaceted social and educational rationale for the statute."},{"t":"Six key factors","c":false,"fb":"Exceeds the four factors that fueled the creation of the law."},{"t":"Eight key factors","c":false,"fb":"Doubles the actual number of factors behind the law."}]},{"cat":"01-1","type":"multi","stem":"Which TWO of these are explicitly listed among the four factors behind the Rizal Law? Select the TWO factors.","sub":"four-factors-national-identity","options":[{"t":"Promotion of Nationalism and Patriotism","c":true,"fb":"Fostering patriotic identity and pride among citizens was a designated factor."},{"t":"Educational Reform","c":true,"fb":"Reforming school curricula to build civic awareness was a primary pillar."},{"t":"Expansion of Armed Forces","c":false,"fb":"Military enlargement was unrelated to educational legislation on Rizal."},{"t":"Promotion of Foreign Commerce","c":false,"fb":"International trade policy formed no part of the law's rationale."},{"t":"Privatization of Public Schools","c":false,"fb":"The measure mandated curriculum changes across both public and private systems."}]},{"cat":"01-1","type":"multi","stem":"Which TWO of these are explicitly listed among the four factors behind the Rizal Law? Select the TWO factors.","sub":"four-factors-national-identity","options":[{"t":"Counteracting Colonial Mentality","c":true,"fb":"Overcoming mental subordination from centuries of foreign rule was a core aim."},{"t":"Response to Contemporary Issues","c":true,"fb":"Deriving historical guidance to address 1950s challenges was an explicit objective."},{"t":"Adoption of Universal Spanish Literacy","c":false,"fb":"Language assimilation was never among the four foundational factors."},{"t":"Enforcement of Religious Orthodoxy","c":false,"fb":"The law countered religious censorship rather than establishing dogma."},{"t":"Integration into Regional Treaties","c":false,"fb":"Foreign diplomatic alignments did not motivate this educational reform."}]},{"cat":"01-1","type":"multi","stem":"Which THREE colonial powers ruled the Philippines and influenced the mindset targeted by the law? Select the THREE colonial powers.","sub":"four-factors-national-identity","options":[{"t":"Spanish colonial rule","c":true,"fb":"Three centuries of Spanish colonization deeply affected cultural self-esteem."},{"t":"American colonial rule","c":true,"fb":"Decades of American governance reinforced widespread cultural dependency."},{"t":"Japanese occupation rule","c":true,"fb":"The wartime occupation contributed further trauma and psychological instability."},{"t":"British colonial rule","c":false,"fb":"The brief 1762 occupation of Manila is not listed among the major eras in the text."},{"t":"Portuguese imperial rule","c":false,"fb":"Portugal never colonized or administered the Philippine archipelago."}]},{"cat":"01-2","type":"mcq","stem":"In which year was the Suez Canal completed in Egypt?","sub":"suez-canal-opening-year","options":[{"t":"1869","c":true,"fb":"The Suez Canal officially opened for international navigation in 1869."},{"t":"1872","c":false,"fb":"Associates with the year of the Cavite Mutiny and GomBurZa execution."},{"t":"1821","c":false,"fb":"Corresponds to the year Mexico achieved independence from Spain."},{"t":"1896","c":false,"fb":"Marks the outbreak of the revolution and Rizal's execution."}]},{"cat":"01-2","type":"mcq","stem":"When did the inauguration of the Suez Canal dramatically shorten travel time between Europe and the Philippines?","sub":"suez-canal-opening-year","options":[{"t":"In 1869","c":true,"fb":"The Suez Canal opened in 1869, drastically reducing the travel time from Europe to Manila."},{"t":"In 1872","c":false,"fb":"The year 1872 is marked by the Cavite Mutiny and the GomBurZa execution."},{"t":"In 1821","c":false,"fb":"Marks the year Mexican independence severed the traditional Manila-Acapulco route."},{"t":"In 1887","c":false,"fb":"Marks the year Noli Me Tangere was published in Berlin."}]},{"cat":"01-2","type":"mcq","stem":"Which two bodies of water does the Suez Canal connect?","sub":"suez-canal-waterway-connection","options":[{"t":"The Mediterranean Sea and the Red Sea","c":true,"fb":"The canal links the Mediterranean and Red seas to bypass Africa."},{"t":"The Atlantic Ocean and the Pacific Ocean","c":false,"fb":"Describes the Panama Canal rather than the Egyptian waterway."},{"t":"The Baltic Sea and the North Sea","c":false,"fb":"Describes the Kiel Canal in northern Europe."},{"t":"The Black Sea and the Aegean Sea","c":false,"fb":"Describes the Turkish Straits linking the Black and Aegean seas."}]},{"cat":"01-2","type":"scenario","stem":"Which two bodies of water did this vessel traverse through the canal?","sub":"suez-canal-waterway-connection","context":"In 1870, a commercial steamship transports passengers directly from Barcelona to Manila through Egypt without rounding the African continent.","options":[{"t":"The Mediterranean Sea and the Red Sea","c":true,"fb":"The artificial canal directly connects the Mediterranean and Red seas."},{"t":"The Caribbean Sea and the Pacific Ocean","c":false,"fb":"Describes the transit passage of the Central American Panama Canal."},{"t":"The Baltic Sea and the English Channel","c":false,"fb":"These northern European waters do not lead directly into Asia."},{"t":"The Arabian Sea and the Persian Gulf","c":false,"fb":"The Persian Gulf does not provide a direct corridor into Europe."}]},{"cat":"01-2","type":"mcq","stem":"How did the completion of the Suez Canal alter maritime transit between Europe and Asia?","sub":"suez-canal-travel-impact","options":[{"t":"It eliminated the need to navigate around Africa.","c":true,"fb":"Ships sailed directly through Egypt rather than circling the Cape of Good Hope."},{"t":"It required vessels to sail through the Arctic Circle.","c":false,"fb":"The waterway is located in tropical Egypt, nowhere near polar routes."},{"t":"It restricted all oceanic navigation strictly to steamships.","c":false,"fb":"Sailing vessels initially used the waterway alongside early commercial steamers."},{"t":"It forced all Asian trade through Acapulco harbors.","c":false,"fb":"The canal bypassed trans-Pacific American routes entirely."}]},{"cat":"01-2","type":"mcq","stem":"Which long-standing trans-Pacific shipping route was rendered obsolete by the Suez Canal?","sub":"suez-canal-travel-impact","options":[{"t":"The Manila-Acapulco galleon route","c":true,"fb":"Direct Mediterranean transit made the older trans-Pacific route commercially unviable."},{"t":"The Cape Town to Lisbon spice route","c":false,"fb":"The Cape route was bypassed rather than being a trans-Pacific galleon line."},{"t":"The Transatlantic triangular slave route","c":false,"fb":"Describes the Atlantic commerce between Europe, Africa, and the Americas."},{"t":"The Arctic Northeast navigation passage","c":false,"fb":"Polar routes were never part of regular Spanish colonial trade."}]},{"cat":"01-2","type":"multi","stem":"Which TWO developments occurred in the Philippines following the opening of the Suez Canal? Select the TWO correct outcomes.","sub":"suez-canal-four-results","options":[{"t":"The Philippines became closer to Europe.","c":true,"fb":"Travel time between Spain and Manila decreased from months to weeks."},{"t":"An increased volume of European travelers arrived.","c":true,"fb":"Direct navigation encouraged many foreign merchants and travelers to visit."},{"t":"The Manila-Acapulco galleon trade expanded dramatically.","c":false,"fb":"The galleon route was rendered completely obsolete by new transit routes."},{"t":"Spain completely abolished all colonial export duties.","c":false,"fb":"Colonial taxation persisted and increased despite improved trade links."},{"t":"The Philippine archipelago gained self-governing dominion status.","c":false,"fb":"Political administration remained strictly subordinate to Madrid."}]},{"cat":"01-2","type":"multi","stem":"Which TWO intellectual and social developments followed the opening of the Suez Canal? Select the TWO social outcomes.","sub":"suez-canal-four-results","options":[{"t":"An exodus of liberal European ideas to the islands","c":true,"fb":"Modern concepts of democracy, human rights, and liberty entered the colony."},{"t":"An increased number of Filipinos studying abroad","c":true,"fb":"Wealthier families took advantage of faster sea routes to educate sons in Europe."},{"t":"Total prohibition against foreign travel for colonials","c":false,"fb":"Faster travel links facilitated overseas journeys rather than prohibiting them."},{"t":"Mandatory closure of all provincial higher learning academies","c":false,"fb":"Educational institutions expanded rather than being shut down."},{"t":"Universal conversion of native elites to Protestantism","c":false,"fb":"Filipino students remained Catholic while engaging with modern secular thought."}]},{"cat":"01-2","type":"mcq","stem":"What defines agricultural products classified as cash crops?","sub":"cash-crops-definition","options":[{"t":"Crops grown primarily for sale and commercial profit","c":true,"fb":"Cash crops are cultivated for large-scale domestic and international market revenue."},{"t":"Crops grown exclusively for immediate family subsistence","c":false,"fb":"Confuses commercial cash crops with small-scale peasant subsistence farming."},{"t":"Wild plants harvested without systematic cultivation","c":false,"fb":"Cash crops required organized large plantations and systematic agricultural labor."},{"t":"Food reserved solely for domestic livestock feeding","c":false,"fb":"Cash crops targeted human commercial consumption across global markets."}]},{"cat":"01-2","type":"mcq","stem":"In 19th-century colonial agriculture, cash crops were cultivated primarily for:","sub":"cash-crops-definition","options":[{"t":"Large-scale commercial sale and export profit","c":true,"fb":"Cash crops were grown as lucrative commodities for domestic and global markets."},{"t":"Immediate consumption by isolated rural farm households","c":false,"fb":"Subsistence farming focuses on personal consumption rather than market profits."},{"t":"Scientific testing in royal botanical conservatories","c":false,"fb":"Plantations served commercial export markets, not experimental greenhouses."},{"t":"Religious offerings during annual monastic festivals","c":false,"fb":"Harvests were traded with European and American merchant corporations."}]},{"cat":"01-2","type":"mcq","stem":"Which of the following was a major cash crop cultivated in the Philippines for Western export?","sub":"cash-crops-cultivated-types","options":[{"t":"Sugarcane crop","c":true,"fb":"Sugarcane was one of the premier export crops grown on large Luzon estates."},{"t":"Wheat grain","c":false,"fb":"Wheat is a temperate cereal crop not cultivated as a tropical Philippine export."},{"t":"Barley grain","c":false,"fb":"Barley was not grown as a commercial crop in the archipelago's climate."},{"t":"Rye grain","c":false,"fb":"Rye is a northern European grain unsuitable for tropical plantation agriculture."}]},{"cat":"01-2","type":"multi","stem":"Which THREE agricultural products were cultivated as major Philippine cash crops? Select the THREE cultivated cash crops.","sub":"cash-crops-cultivated-types","options":[{"t":"Sugarcane cultivated for export","c":true,"fb":"Sugar became one of the most lucrative export crops of 19th-century plantations."},{"t":"Abaca cultivated for rope making","c":true,"fb":"Manila hemp was in tremendous demand among Western maritime commercial fleets."},{"t":"Tobacco cultivated for export","c":true,"fb":"Tobacco generated vast revenue through extensive commercial agricultural estates."},{"t":"Wheat cultivated for local bread","c":false,"fb":"Wheat was not a major cash crop cultivated in tropical Philippine agriculture."},{"t":"Barley cultivated for brewing","c":false,"fb":"Barley cultivation was not suited to the local climate and was never an export staple."}]},{"cat":"01-2","type":"mcq","stem":"In which year did Mexico gain independence from Spain, hastening the end of the galleon trade?","sub":"mexico-independence-1821","options":[{"t":"1821","c":true,"fb":"Mexico achieved independence from Spain in 1821, severing the Acapulco trade link."},{"t":"1869","c":false,"fb":"Corresponds to the opening of the Suez Canal in Egypt."},{"t":"1872","c":false,"fb":"Marks the year of the Cavite Mutiny and the execution of GomBurZa."},{"t":"1898","c":false,"fb":"Marks the end of Spanish colonial rule in the Philippines."}]},{"cat":"01-2","type":"mcq","stem":"Which 1821 geopolitical event severed the American terminus of the Manila galleons?","sub":"mexico-independence-1821","options":[{"t":"The independence of Mexico from Spain","c":true,"fb":"Mexican independence severed the American terminus of the trans-Pacific galleons."},{"t":"The outbreak of the American Civil War","c":false,"fb":"The American conflict occurred four decades later in the 1860s."},{"t":"The signing of the Treaty of Paris","c":false,"fb":"The Spanish-American treaty occurred at the end of the century in 1898."},{"t":"The French invasion of the Netherlands","c":false,"fb":"European continental conflicts did not directly terminate the Acapulco galleons."}]},{"cat":"01-2","type":"mcq","stem":"What economic role was performed by an inquilino in 19th-century agrarian estates?","sub":"inquilinos-tenant-role","options":[{"t":"A tenant farmer leasing land and subleasing to workers","c":true,"fb":"Inquilinos leased large tracts from estate owners and subleased parcels to laborers."},{"t":"An appointed tax collector for the colonial treasury","c":false,"fb":"Local tax collection was administered by the cabeza de barangay, not inquilinos."},{"t":"An ordained native priest managing a local parish","c":false,"fb":"Confuses agricultural tenancy contracts with ecclesiastical parish appointments."},{"t":"A military officer commanding municipal garrisons","c":false,"fb":"Military garrisons were led by Spanish officers, not agrarian tenant farmers."}]},{"cat":"01-2","type":"mcq","stem":"What specific term designated tenant farmers who leased large hacienda lands from religious orders and subleased them to local cultivators?","sub":"inquilinos-tenant-role","options":[{"t":"Inquilinos","c":true,"fb":"Inquilinos leased estate lands from friar orders and subleased parcels to working subtenants."},{"t":"Peninsulares","c":false,"fb":"Peninsulares were Spaniards born in the Iberian peninsula holding senior colonial offices."},{"t":"Ilustrados","c":false,"fb":"Ilustrados were university-educated Filipino reformists, not agrarian estate tenant managers."},{"t":"Gobernadorcillos","c":false,"fb":"Gobernadorcillos served as native municipal town mayors, not farm leasing agents."}]},{"cat":"01-2","type":"mcq","stem":"Which religious order was prominently associated with large agricultural estates in Luzon?","sub":"friar-estates-land-takeover","options":[{"t":"The Dominicans","c":true,"fb":"The Dominican Order possessed extensive arable haciendas, including the Calamba estate."},{"t":"The Jesuits","c":false,"fb":"The Jesuits were expelled in 1768 and did not control these Luzon cash-crop estates."},{"t":"The Franciscans","c":false,"fb":"Franciscans were mendicants who traditionally avoided owning extensive landed estates."},{"t":"The Benedictines","c":false,"fb":"Benedictine monks were not among the major friar estate holders named in the text."}]},{"cat":"01-2","type":"mcq","stem":"Extensive agricultural haciendas in 19th-century Luzon were intensively acquired and controlled by:","sub":"friar-estates-land-takeover","options":[{"t":"Catholic religious orders such as Dominicans and Augustinians","c":true,"fb":"Friar corporations acquired vast arable tracts through various means in Luzon."},{"t":"Foreign British and American shipping syndicates","c":false,"fb":"Foreign merchant firms purchased exported crops but did not own monastic haciendas."},{"t":"Indio peasant co-operatives in rural provinces","c":false,"fb":"Native peasant farmers lacked capital and were tenant laborers on friar lands."},{"t":"The Royal Spanish Navy administrative staff","c":false,"fb":"The naval admiralty had no ownership or administration over interior farm estates."}]},{"cat":"01-2","type":"mcq","stem":"Which ethnic group experienced significant upward social mobility as agricultural landowners?","sub":"rise-of-chinese-mestizos","options":[{"t":"Chinese-Filipino mestizos","c":true,"fb":"Mixed Chinese-Filipino families acquired substantial wealth and agricultural estates."},{"t":"Peninsular military officers","c":false,"fb":"Peninsulares already occupied the highest colonial echelon and were not a new rising class."},{"t":"Impoverished rural indios","c":false,"fb":"Native peasant indios remained trapped in debt and exploitative tenancy."},{"t":"Dutch maritime merchants","c":false,"fb":"Dutch traders did not settle as permanent agrarian landowning classes in Luzon."}]},{"cat":"01-2","type":"mcq","stem":"How did wealthy Chinese-Filipino mestizo families utilize their accumulated cash-crop capital?","sub":"rise-of-chinese-mestizos","options":[{"t":"By sending their children to study overseas","c":true,"fb":"Affluent landowners financed advanced European higher education for their sons."},{"t":"By purchasing aristocratic estates across mainland Spain","c":false,"fb":"Wealth was invested in local landholdings and European education, not Spanish titles."},{"t":"By establishing sovereign private armies in provinces","c":false,"fb":"Private military units were strictly prohibited by Spanish colonial authorities."},{"t":"By financing Protestant missionary missions in Asia","c":false,"fb":"Mestizo families remained culturally Catholic within Spanish colonial society."}]},{"cat":"01-2","type":"scenario","stem":"Which upwardly mobile socioeconomic group in colonial society is illustrated here?","sub":"rise-of-chinese-mestizos","context":"In 19th-century Laguna, an entrepreneurial family acquires significant landed estates, controls river and road transport of export crops to Manila, and amasses wealth that funds foreign university education for their sons.","options":[{"t":"Chinese-Filipino mestizos","c":true,"fb":"Chinese-Filipino mestizos amassed agrarian wealth and funded overseas European studies."},{"t":"Peninsular colonial magistrates","c":false,"fb":"Peninsulares held state posts by appointment rather than private agrarian enterprise."},{"t":"Impoverished rural indios","c":false,"fb":"Indios were subjected to forced labor and remained impoverished under tenancy."},{"t":"Foreign British merchant syndicates","c":false,"fb":"Foreign merchant firms purchased exports but did not constitute this local class."}]},{"cat":"01-2","type":"multi","stem":"Which TWO public works infrastructure projects were expanded by the Spanish government? Select the TWO transport projects.","sub":"infrastructure-investments","options":[{"t":"Roads built to hasten crop transport from provinces to Manila","c":true,"fb":"Highways were paved to accelerate agricultural hauling to export docks."},{"t":"Railroads connecting rural provinces to urban centers","c":true,"fb":"Rail networks facilitated internal commerce and personal mobility across Luzon."},{"t":"Commercial international airports in provincial capitals","c":false,"fb":"Aviation technology did not exist during the nineteenth-century colonial era."},{"t":"Deep subway tunnels under the walled city of Manila","c":false,"fb":"Underground urban rail systems were never constructed in colonial Manila."},{"t":"Transcontinental telegraph lines directly to South America","c":false,"fb":"Communication links connected to Europe and Asia, not across the South Pacific."}]},{"cat":"01-2","type":"multi","stem":"Which TWO infrastructure developments directly improved agricultural transport in 19th-century Luzon? Select the TWO infrastructure works.","sub":"infrastructure-investments","options":[{"t":"Ports constructed to enable aquatic transport of crops","c":true,"fb":"Maritime docks were modernized to load bulk agricultural exports onto cargo ships."},{"t":"Railroad construction giving rural areas access to cities","c":true,"fb":"Trains allowed provincial farmers to reach expanding urban commercial markets."},{"t":"Hydroelectric power dams across mountain river basins","c":false,"fb":"Modern hydroelectric technology was developed decades later in the twentieth century."},{"t":"Interstate paved highways across all southern islands","c":false,"fb":"Road improvements were concentrated primarily on agricultural routes toward Manila."},{"t":"Nuclear-powered desalinization plants along coasts","c":false,"fb":"Nuclear technology did not exist in the nineteenth century."}]},{"cat":"01-2","type":"mcq","stem":"Which Spanish governor-general appointed in 1869 was known for liberal and progressive governance?","sub":"governor-general-de-la-torre","options":[{"t":"Carlos Maria de la Torre","c":true,"fb":"De la Torre championed democratic values, free speech, and inclusive civil administration."},{"t":"Rafael Izquierdo","c":false,"fb":"Izquierdo was an authoritarian ruler who governed with an Iron Fist."},{"t":"Narciso Claveria","c":false,"fb":"Claveria was famous for the 1849 surname decree decades earlier."},{"t":"Valeriano Weyler","c":false,"fb":"Weyler was known for harsh military pacification campaigns in the late 1880s."}]},{"cat":"01-2","type":"mcq","stem":"In 1869, which colonial administrator introduced democratic principles and earned the fond respect of Filipinos?","sub":"governor-general-de-la-torre","options":[{"t":"Governor-General Carlos Maria de la Torre","c":true,"fb":"De la Torre's inclusive approach earned him widespread popularity among Filipinos."},{"t":"Governor-General Rafael Izquierdo","c":false,"fb":"Izquierdo was widely feared and resented for rescinding reforms."},{"t":"Archbishop Gregorio Meliton Martinez","c":false,"fb":"Martinez was the Catholic Archbishop of Manila, not the civil governor-general."},{"t":"Sergeant Fernando La Madrid","c":false,"fb":"La Madrid was the military sergeant who led the Cavite Mutiny."}]},{"cat":"01-2","type":"scenario","stem":"Which colonial leader supported these progressive measures?","sub":"governor-general-de-la-torre","context":"In 1870, an educational reform committee proposes secularizing secondary schools and assigning qualified native secular priests to vacant provincial parishes.","options":[{"t":"Governor-General Carlos Maria de la Torre","c":true,"fb":"De la Torre supported secular education and native priest appointments to parishes."},{"t":"Governor-General Rafael Izquierdo","c":false,"fb":"Izquierdo opposed secularization and reversed progressive administrative reforms."},{"t":"Archbishop Gregorio Meliton Martinez","c":false,"fb":"Martinez was the metropolitan prelate, not the civil head of colonial government."},{"t":"Sergeant Fernando La Madrid","c":false,"fb":"La Madrid was an artillery sergeant who led the Cavite arsenal mutineers."}]},{"cat":"01-2","type":"multi","stem":"Which TWO reforms were officially implemented by Governor-General Carlos Maria de la Torre? Select the TWO reforms.","sub":"de-la-torre-reforms","options":[{"t":"Increased freedom of speech for citizens","c":true,"fb":"He relaxed censorship and permitted open public political discussion."},{"t":"Abolishment of flogging as a legal punishment","c":true,"fb":"He banned judicial flogging to uphold human dignity and civil decency."},{"t":"Total abolition of all commercial agricultural taxes","c":false,"fb":"Fiscal revenues were maintained while corporal and political abuses were curbed."},{"t":"Immediate expulsion of all Spanish religious orders","c":false,"fb":"He curtailed friar political power without expelling orders from the colony."},{"t":"Dissolution of the colonial civil guard detachments","c":false,"fb":"Civil police bodies remained active under official government command."}]},{"cat":"01-2","type":"multi","stem":"Which TWO religious and educational policies were championed by Governor-General de la Torre? Select the TWO ecclesiastical and educational reforms.","sub":"de-la-torre-reforms","options":[{"t":"Allowing secular priests to be assigned to vacant parishes","c":true,"fb":"De la Torre promoted qualified secular priests to curb friar abuse."},{"t":"Instituting educational reforms and secularizing schools","c":true,"fb":"He actively supported modernizing and secularizing educational institutions."},{"t":"Handing all university administrative chairs to friar orders","c":false,"fb":"His administration aimed to reduce monastic monopolies in higher education."},{"t":"Banning the study of Spanish language across all schools","c":false,"fb":"De la Torre promoted broader access to literacy and European thought."},{"t":"Forbidding native clergy from ministering to local parishes","c":false,"fb":"He actively championed native secular priests in parish appointments."}]},{"cat":"01-2","type":"mcq","stem":"Which Spanish governor-general was known for his authoritarian \"Iron Fist\" rule that rescinded liberal policies in 1871?","sub":"governor-general-izquierdo-iron-fist","options":[{"t":"Rafael Izquierdo","c":true,"fb":"Rafael Izquierdo instituted the repressive \"Iron Fist\" administration beginning in 1871."},{"t":"Carlos Maria de la Torre","c":false,"fb":"De la Torre was the progressive predecessor whose liberal reforms Izquierdo revoked."},{"t":"Camilo de Polavieja","c":false,"fb":"Polavieja oversaw colonial military courts and Rizal's execution in 1896."},{"t":"Fernando Primo de Rivera","c":false,"fb":"Primo de Rivera served as governor-general during the 1897 Biak-na-Bato negotiations."}]},{"cat":"01-2","type":"mcq","stem":"Which authoritarian governor-general succeeded De la Torre in 1871 and revoked his liberal decrees?","sub":"governor-general-izquierdo-iron-fist","options":[{"t":"Rafael Izquierdo","c":true,"fb":"Izquierdo took office in 1871 and swiftly rescinded progressive colonial policies."},{"t":"Carlos Maria de la Torre","c":false,"fb":"De la Torre was the progressive predecessor whom Izquierdo replaced."},{"t":"Camilo de Polavieja","c":false,"fb":"Polavieja was the governor-general during Rizal's trial and execution in 1896."},{"t":"Ramon Blanco","c":false,"fb":"Blanco was the governor-general at the outbreak of the 1896 Revolution."}]},{"cat":"01-2","type":"mcq","stem":"On what exact date did the Cavite Mutiny break out?","sub":"cavite-mutiny-details","options":[{"t":"January 20, 1872","c":true,"fb":"The uprising erupted at the Cavite arsenal on the evening of January 20, 1872."},{"t":"February 17, 1872","c":false,"fb":"Corresponds to the execution date of GomBurZa at Bagumbayan field."},{"t":"June 19, 1861","c":false,"fb":"Corresponds to the birth date of José Rizal in Calamba."},{"t":"August 23, 1896","c":false,"fb":"Marks the Cry of Pugad Lawin at the onset of the Philippine Revolution."}]},{"cat":"01-2","type":"mcq","stem":"Who commanded the contingent of approximately 200 mutineers during the 1872 Cavite arsenal uprising?","sub":"cavite-mutiny-details","options":[{"t":"Sergeant La Madrid","c":true,"fb":"Sergeant La Madrid commanded the approximately 200 mutineers at the arsenal fort."},{"t":"Father José Burgos","c":false,"fb":"Fr. Burgos was a secular priest falsely accused of conspiracy, not the military leader."},{"t":"Carlos Maria de la Torre","c":false,"fb":"De la Torre was the former governor-general, not an insurgent commander."},{"t":"Manuel Xerez-Burgos","c":false,"fb":"Xerez-Burgos was a civilian nephew who assisted Rizal with Ateneo enrollment."}]},{"cat":"01-2","type":"mcq","stem":"On what date were Fathers Gómez, Burgos, and Zamora executed by garrote?","sub":"gomburza-execution","options":[{"t":"February 17, 1872","c":true,"fb":"The three secular priests were publicly garroted at Bagumbayan on February 17, 1872."},{"t":"January 20, 1872","c":false,"fb":"Marks the eruption of the arsenal mutiny in Cavite, not the execution."},{"t":"June 12, 1898","c":false,"fb":"Commemorates the declaration of Philippine independence in Kawit, Cavite."},{"t":"December 30, 1896","c":false,"fb":"Marks the execution of Dr. José Rizal at Bagumbayan field."}]},{"cat":"01-2","type":"mcq","stem":"By what method of capital punishment were Fathers Mariano Gómez, José Burgos, and Jacinto Zamora executed in February 1872?","sub":"gomburza-execution","options":[{"t":"Public strangulation by the garrote","c":true,"fb":"GomBurZa were executed at Bagumbayan through the mechanical garrote."},{"t":"Firing squad execution by infantry troops","c":false,"fb":"Execution by firing squad was applied later to Dr. José Rizal in 1896."},{"t":"Decapitation on the municipal plaza scaffold","c":false,"fb":"Decapitation by sword or guillotine was not utilized for the priests."},{"t":"Hanging by the neck from naval dock gallows","c":false,"fb":"The Spanish judicial apparatus sentenced them to the garrote vil."}]},{"cat":"01-2","type":"mcq","stem":"What was the primary social background of leaders in the Propaganda Movement?","sub":"propaganda-movement-ilustrados","options":[{"t":"Educated young Filipino expatriates known as ilustrados","c":true,"fb":"The movement was led by intellectuals studying and writing in European capitals."},{"t":"Conservative Spanish friars managing provincial haciendas","c":false,"fb":"Friar corporations were the primary target of Propaganda Movement critiques."},{"t":"High-ranking military officers of the Spanish colonial army","c":false,"fb":"The military hierarchy enforced colonial rule and censored reformist publications."},{"t":"Landless rural laborers working on sugar plantations","c":false,"fb":"Rural laborers lacked the financial resources to organize campaigns abroad."}]},{"cat":"01-2","type":"multi","stem":"Which TWO political demands were formally championed by the Propaganda Movement? Select the TWO political goals.","sub":"propaganda-movement-ilustrados","options":[{"t":"Representation of the Philippines in the Spanish Cortes","c":true,"fb":"Expatriates sought parliamentary deputies to voice Filipino grievances in Madrid."},{"t":"Legalization of equality between Spaniards and Filipinos","c":true,"fb":"Reformers demanded equal legal rights, dignity, and protections for all colonials."},{"t":"Immediate armed overthrow of the Spanish monarchy","c":false,"fb":"The movement initially pursued peaceful reform and assimilation rather than war."},{"t":"Establishment of an independent indigenous sultanate in Luzon","c":false,"fb":"Reformers advocated modern constitutional representation within a Spanish framework."},{"t":"Banning of all trade ties with foreign merchant nations","c":false,"fb":"Ilustrados actively supported global trade and unrestricted intellectual exchange."}]},{"cat":"02","type":"mcq","stem":"On what exact date was José Rizal born in Calamba, Laguna?","sub":"birth-date-and-place","options":[{"t":"June 19, 1861","c":true,"fb":"José Rizal was born on June 19, 1861, in Calamba, Laguna."},{"t":"June 12, 1861","c":false,"fb":"Confuses his birth date with Philippine Independence Day."},{"t":"June 19, 1862","c":false,"fb":"Inaccurate year; his birth occurred in 1861."},{"t":"December 30, 1861","c":false,"fb":"Confuses his birthday with his December execution date."}]},{"cat":"02","type":"mcq","stem":"In which calendar year was José Protacio Rizal born to Francisco Mercado and Teodora Alonzo?","sub":"birth-date-and-place","options":[{"t":"In 1861","c":true,"fb":"Rizal was born on June 19, 1861, in the town of Calamba, Laguna."},{"t":"In 1863","c":false,"fb":"Year of the Manila earthquake that destroyed the cathedral, not Rizal's birth."},{"t":"In 1869","c":false,"fb":"Year the Suez Canal opened and Governor De la Torre arrived."},{"t":"In 1872","c":false,"fb":"Year of the Cavite Mutiny and the execution of the GomBurZa priests."}]},{"cat":"02","type":"mcq","stem":"Which two Catholic saints inspired the first and middle given names of Rizal?","sub":"namesake-saints","options":[{"t":"Saint Jose and Saint Protacio","c":true,"fb":"June 19 commemorates the feast days of Saint Jose and Saint Protacio."},{"t":"Saint Juan and Saint Pedro","c":false,"fb":"Confuses his calendar patron saints with Saint John and Saint Peter."},{"t":"Saint Francisco and Saint Antonio","c":false,"fb":"Mistakes his father's namesake for his calendar birth patrons."},{"t":"Saint Ignacio and Saint Domingo","c":false,"fb":"Names founders of religious orders rather than his feast-day patrons."}]},{"cat":"02","type":"multi","stem":"Which TWO saints' feast days on June 19 inspired Rizal's given baptismal names? Select the TWO Catholic saints.","sub":"namesake-saints","options":[{"t":"Saint Jose","c":true,"fb":"Saint Jose was one of the two calendar saints commemorated on June 19."},{"t":"Saint Protacio","c":true,"fb":"Saint Protacio was the second patron saint celebrated on his birth date."},{"t":"Saint Lorenzo","c":false,"fb":"Saint Lorenzo Ruiz was canonized in modern times and is not his calendar patron."},{"t":"Saint Agustin","c":false,"fb":"Saint Augustine's feast occurs in late August, not on June 19."},{"t":"Saint Miguel","c":false,"fb":"Saint Michael the Archangel is celebrated in September."}]},{"cat":"02","type":"mcq","stem":"What occupations were held by Rizal's father, Francisco Mercado?","sub":"father-don-francisco","options":[{"t":"Farmer and businessman","c":true,"fb":"Don Francisco was a tenant farmer and businessman who provided for his family."},{"t":"Provincial colonial magistrate","c":false,"fb":"Judicial magistracies were reserved for Spanish legal officials."},{"t":"Naval artillery commander","c":false,"fb":"Military commissions were held by regular Spanish officers, not local farmers."},{"t":"Secular parish priest","c":false,"fb":"Francisco Mercado was a married layman and businessman, not a cleric."}]},{"cat":"02","type":"multi","stem":"Which TWO occupations were carried out by Rizal's father, Francisco Mercado? Select the TWO occupations.","sub":"father-don-francisco","options":[{"t":"Commercial farmer","c":true,"fb":"He successfully cultivated leased lands in Calamba to support his family."},{"t":"Local businessman","c":true,"fb":"He engaged in business ventures to finance his children's education."},{"t":"University professor","c":false,"fb":"Higher university chairs were held by Spanish ecclesiastical academics."},{"t":"Imperial tax commissioner","c":false,"fb":"Imperial fiscal commissions were reserved for royal Spanish peninsulares."},{"t":"Military naval engineer","c":false,"fb":"Francisco Mercado worked in agriculture and commerce, not naval engineering."}]},{"cat":"02","type":"mcq","stem":"Which traumatic injustice suffered by his mother served as a major catalyst for Rizal's criticism of colonial rule?","sub":"mother-teodora-alonzo-injustices","options":[{"t":"Unjust imprisonment by Spanish authorities twice","c":true,"fb":"Witnessing his mother's arbitrary detention fueled his lifelong struggle against colonial injustice."},{"t":"Immediate permanent exile to the Mariana Islands","c":false,"fb":"Doña Teodora was detained locally in Laguna rather than exiled abroad."},{"t":"Total confiscation of all her family heirloom jewelry","c":false,"fb":"Her imprisonment was the primary trauma, not personal jewelry seizure."},{"t":"Public corporal punishment in the municipal plaza","c":false,"fb":"She was detained without trial rather than subjected to corporal flogging."}]},{"cat":"02","type":"mcq","stem":"How many times was Rizal's mother, Teodora Alonzo, unjustly imprisoned under Spanish colonial administration?","sub":"mother-teodora-alonzo-injustices","options":[{"t":"She was imprisoned unjustly twice.","c":true,"fb":"Doña Teodora suffered arbitrary detention twice during Spanish colonial rule."},{"t":"She was imprisoned unjustly once.","c":false,"fb":"Understates her persecution; she endured imprisonment on two separate occasions."},{"t":"She was imprisoned unjustly three times.","c":false,"fb":"Overstates the number of distinct imprisonments recorded in the text."},{"t":"She was imprisoned unjustly four times.","c":false,"fb":"Her unjust arrests were pivotal formative events in Rizal's childhood, occurring twice."}]},{"cat":"02","type":"scenario","stem":"How did this family ordeal fundamentally affect young José?","sub":"mother-teodora-alonzo-injustices","context":"In 1871, Doña Teodora Alonzo is arrested on malicious false charges and forced to walk miles to the provincial jail in Santa Cruz, Laguna.","options":[{"t":"It served as a catalyst for his criticism of Spanish governance.","c":true,"fb":"The trauma awakened his deep outrage against arbitrary colonial abuses."},{"t":"It led him to abandon formal studies and enlist in the army.","c":false,"fb":"The injustice spurred him to excel in academics rather than join the military."},{"t":"It persuaded him to become an ordained Catholic friar in Manila.","c":false,"fb":"His intellectual development was secular and highly critical of friar abuses."},{"t":"It convinced his family to immigrate permanently to Great Britain.","c":false,"fb":"The family remained rooted in Calamba while supporting José's studies."}]},{"cat":"02","type":"mcq","stem":"Which family member served as young Rizal's only brother, primary mentor, and guide toward nationalist reform?","sub":"brother-paciano-mentor","options":[{"t":"Paciano Rizal","c":true,"fb":"Paciano was his only brother, mentor, and an active nationalist revolutionary."},{"t":"Francisco Mercado","c":false,"fb":"Francisco Mercado was his father, while Paciano was his only brother and mentor."},{"t":"Manuel Xerez-Burgos","c":false,"fb":"Manuel Xerez-Burgos was a family friend who assisted with Ateneo admission."},{"t":"Maximo Viola","c":false,"fb":"Maximo Viola was a medical colleague who helped fund Noli Me Tangere in Berlin."}]},{"cat":"02","type":"mcq","stem":"Who introduced young José to the liberal and reformist ideas circulating in Manila?","sub":"brother-paciano-mentor","options":[{"t":"His elder brother Paciano","c":true,"fb":"Paciano introduced him to reformist thought and supported his mission abroad."},{"t":"Maestro Justiniano Aquino Cruz","c":false,"fb":"Maestro Cruz taught basic elementary lessons in Biñan, not liberal politics."},{"t":"Dr. Louis de Wecker","c":false,"fb":"Dr. de Wecker was his clinical ophthalmology mentor in Paris years later."},{"t":"Dr. Otto Becker","c":false,"fb":"Dr. Becker trained Rizal in ophthalmic surgery at Heidelberg University."}]},{"cat":"02","type":"multi","stem":"Which TWO statements correctly describe Paciano Rizal's role in José's life? Select the TWO brotherly roles.","sub":"brother-paciano-mentor","options":[{"t":"He was José's only brother and lifelong mentor.","c":true,"fb":"Paciano guided his education and was his sole male sibling."},{"t":"He introduced José to liberal reformist ideas.","c":true,"fb":"Paciano's connections with reformists shaped José's nationalist consciousness."},{"t":"He sailed alongside José aboard the steamer Salvadora.","c":false,"fb":"Paciano remained in the Philippines to manage family agricultural affairs."},{"t":"He served as the Archbishop of Manila during the mutiny.","c":false,"fb":"Gregorio Meliton Martinez was the Archbishop of Manila, not Paciano."},{"t":"He composed the novel Noli Me Tangere in Berlin.","c":false,"fb":"José Rizal wrote and published Noli Me Tangere himself."}]},{"cat":"02","type":"multi","stem":"Which TWO sisters carried out these specific historical actions regarding Rizal? Select the TWO sisters.","sub":"sisters-roles-narcisa-trinidad","options":[{"t":"Narcisa located his burial remains after his execution.","c":true,"fb":"Narcisa searched Bagumbayan and located his unmarked grave site."},{"t":"Trinidad received his final poem hidden inside a lamp.","c":true,"fb":"Trinidad received Mi Ultimo Adios concealed within an alcohol lamp."},{"t":"Maria died at age three as his earliest grief.","c":false,"fb":"Concepcion was the sibling whose early death at age three grieved Rizal."},{"t":"Lucia remained unmarried and joined the Katipunan ranks.","c":false,"fb":"Josefa was the unmarried sister who actively joined the Katipunan."},{"t":"Saturnina delivered his secret thesis to Madrid professors.","c":false,"fb":"Rizal failed to present his medical thesis orally in Madrid."}]},{"cat":"02","type":"multi","stem":"Which TWO sibling descriptions accurately match Rizal's family circle? Select the TWO sibling descriptions.","sub":"sisters-roles-narcisa-trinidad","options":[{"t":"Saturnina was the eldest sister who acted as a second mother.","c":true,"fb":"Saturnina, known as Neneng, was the firstborn and helped care for young José."},{"t":"Concepcion died at age three as his earliest encounter with grief.","c":true,"fb":"The early death of little Concha brought José his first profound sorrow."},{"t":"Josefa married an English railway engineer in London.","c":false,"fb":"Leonor Rivera married Charles Henry Kipping, not sister Josefa."},{"t":"Soledad served as the personal physician to the Governor-General.","c":false,"fb":"Soledad was the youngest sister, not a colonial medical official."},{"t":"Olympia was the only sibling who joined the Dominican convent.","c":false,"fb":"None of Rizal's sisters joined monastic religious orders."}]},{"cat":"02","type":"mcq","stem":"What early literacy milestone did young José achieve by age five under his mother's tutelage?","sub":"early-education-mother-tutelage","options":[{"t":"Reading and writing proficiently","c":true,"fb":"His mother taught him the alphabet at three and reading and writing by five."},{"t":"Composing Latin philosophical dissertations","c":false,"fb":"Classical Latin mastery was acquired later during his studies at Ateneo."},{"t":"Performing advanced ophthalmic surgery","c":false,"fb":"Medical surgical training was undertaken as a graduate in Paris and Germany."},{"t":"Translating German historical monographs","c":false,"fb":"German language study took place during his European travels in the 1880s."}]},{"cat":"02","type":"mcq","stem":"At what age did young Rizal begin learning the alphabet at home from Doña Teodora?","sub":"early-education-mother-tutelage","options":[{"t":"At the age of three","c":true,"fb":"Doña Teodora began teaching young José the alphabet when he was three."},{"t":"At the age of seven","c":false,"fb":"At age seven, he was sent to elementary school in Biñan under Maestro Cruz."},{"t":"At the age of eleven","c":false,"fb":"At age eleven, he enrolled in high school at Ateneo Municipal de Manila."},{"t":"At the age of fifteen","c":false,"fb":"By age fifteen, he was already an accomplished student composing poetry at Ateneo."}]},{"cat":"02","type":"mcq","stem":"Who served as Rizal's private school teacher when he was sent to Biñan at age seven?","sub":"binan-schooling-maestro-cruz","options":[{"t":"Maestro Justiniano Aquino Cruz","c":true,"fb":"Rizal studied in Biñan under Maestro Justiniano Aquino Cruz at age seven."},{"t":"Fr. Francisco de Paula Sanchez","c":false,"fb":"Fr. Sanchez was his beloved Jesuit professor at Ateneo Municipal."},{"t":"Dr. Louis de Wecker","c":false,"fb":"Dr. de Wecker was his Parisian ophthalmology surgical mentor."},{"t":"Dr. Otto Becker","c":false,"fb":"Dr. Becker directed the Heidelberg University Eye Hospital where Rizal trained."}]},{"cat":"02","type":"mcq","stem":"To which neighboring town was seven-year-old José sent to attend private elementary school under Maestro Cruz?","sub":"binan-schooling-maestro-cruz","options":[{"t":"Biñan, Laguna","c":true,"fb":"Young José traveled to Biñan, Laguna, for his early elementary schooling."},{"t":"Intramuros, Manila","c":false,"fb":"Intramuros was the site of his later secondary education at Ateneo Municipal."},{"t":"Bacoor, Cavite","c":false,"fb":"Bacoor was the parish jurisdiction associated with Father Mariano Gómez."},{"t":"Vigan, Ilocos Sur","c":false,"fb":"Vigan was the northern hometown associated with Father Jose Burgos."}]},{"cat":"02","type":"mcq","stem":"Why was José advised by his relatives to enroll at Ateneo Municipal under the surname \"Rizal\"?","sub":"ateneo-surname-choice","options":[{"t":"Paciano's ties with Father Burgos put the household under suspicion.","c":true,"fb":"Paciano's association with the executed priest drew dangerous colonial surveillance."},{"t":"The Jesuit fathers required all prospective students to use Spanish names.","c":false,"fb":"The family chose the surname for security, not due to Jesuit admission policy."},{"t":"Spanish courts legally stripped Don Francisco of his ancestral lands.","c":false,"fb":"Land disputes escalated much later during the Calamba hacienda litigation."},{"t":"His mother's will mandated discarding the ancestral Mercado title.","c":false,"fb":"The advice was given by family members to protect José from political retaliation."}]},{"cat":"02","type":"mcq","stem":"What political circumstance prompted the Mercado family to register young José as \"Rizal\" at Ateneo?","sub":"ateneo-surname-choice","options":[{"t":"Paciano's close association with the executed Father Jose Burgos","c":true,"fb":"Paciano was linked to Father Burgos, putting the family name under suspicion."},{"t":"A royal decree ordering all students to change surnames","c":false,"fb":"The surname change was a protective family decision, not a royal mandate."},{"t":"The total confiscation of all Mercado family bank accounts","c":false,"fb":"The family maintained financial stability and funded his Manila studies."},{"t":"His expulsion from Colegio de San Juan de Letran","c":false,"fb":"Rizal passed Letran exams but chose Ateneo due to delays from his mother's arrest."}]},{"cat":"02","type":"multi","stem":"Which TWO hurdles almost caused Ateneo Municipal to reject young Rizal's admission? Select the TWO admission obstacles.","sub":"ateneo-admission-hurdles","options":[{"t":"He was considered too young and physically small.","c":true,"fb":"Administrators initially doubted his physical readiness for academic rigor."},{"t":"He lacked a required certificate of Manila residency.","c":true,"fb":"Ateneo prioritized local residents, and Rizal lacked proper municipal certification."},{"t":"He failed the entrance examinations at Ateneo.","c":false,"fb":"Rizal easily possessed the requisite intellectual competence for admission."},{"t":"He refused to attend mandatory Jesuit morning chapel.","c":false,"fb":"Rizal embraced religious devotion and was active in campus sodalities."},{"t":"His family was unable to pay the matriculation fee.","c":false,"fb":"His principalía family possessed ample financial resources for schooling."}]},{"cat":"02","type":"scenario","stem":"Whose timely personal intervention secured his official acceptance?","sub":"ateneo-admission-hurdles","context":"In June 1872, an 11-year-old boy from Laguna arrives late for admission at the Jesuit-run Ateneo Municipal and lacks a Manila residency certificate.","options":[{"t":"Manuel Xerez-Burgos","c":true,"fb":"Manuel Xerez-Burgos, nephew of Father Jose Burgos, helped him gain admittance."},{"t":"Maestro Justiniano Aquino Cruz","c":false,"fb":"Maestro Cruz was his elementary school teacher in Biñan, not in Manila."},{"t":"Governor-General Rafael Izquierdo","c":false,"fb":"The authoritarian governor-general was repressing nationalists, not aiding students."},{"t":"Maximo Viola","c":false,"fb":"Viola was a medical classmate who financed Noli Me Tangere in Berlin years later."}]},{"cat":"02","type":"mcq","stem":"Through whose personal intercession was young José finally accepted into Ateneo Municipal?","sub":"ateneo-admission-hurdles","options":[{"t":"Manuel Xerez-Burgos, nephew of Father Burgos","c":true,"fb":"Manuel Xerez-Burgos interceded with administrators to overcome residency hurdles."},{"t":"Governor-General Carlos Maria de la Torre","c":false,"fb":"De la Torre had completed his term and left the colony by 1872."},{"t":"The provincial mayor of Calamba, Laguna","c":false,"fb":"Municipal town officials had no influence over private Jesuit school admissions."},{"t":"The superior general of the Dominican Order","c":false,"fb":"Ateneo was run by Jesuits, not by the Dominican religious order."}]},{"cat":"02","type":"mcq","stem":"Which Jesuit instructor did Rizal credit most for his intellectual and literary growth at Ateneo?","sub":"ateneo-mentor-fr-sanchez","options":[{"t":"Father Francisco de Paula Sanchez","c":true,"fb":"Rizal warmly credited Father Sanchez for inspiring his poetic and intellectual development."},{"t":"Father Pedro Casanas of Calamba","c":false,"fb":"Father Casanas was his baptismal godfather in Calamba, not an Ateneo professor."},{"t":"Father Mariano Gómez of Bacoor","c":false,"fb":"Father Gómez was the senior secular priest executed after the Cavite Mutiny."},{"t":"Father Rufino Collantes of Laguna","c":false,"fb":"Father Collantes was the parish priest who baptized Rizal in Calamba."}]},{"cat":"02","type":"mcq","stem":"Who was the inspiring Jesuit professor whom Rizal warmly credited for developing his poetic talent at Ateneo?","sub":"ateneo-mentor-fr-sanchez","options":[{"t":"Father Francisco de Paula Sanchez","c":true,"fb":"Father Sanchez nurtured his literary talents and encouraged his poetic compositions."},{"t":"Father Jose Apolonio Burgos of Vigan","c":false,"fb":"Father Burgos was a secular priest executed in 1872, not an Ateneo teacher."},{"t":"Father Jacinto Zamora of Pandacan","c":false,"fb":"Father Zamora was one of the GomBurZa martyrs, not his Jesuit instructor."},{"t":"Father Mariano Gómez of Bacoor Parish","c":false,"fb":"Father Gómez was the senior secular priest executed after the Cavite Mutiny."}]},{"cat":"02","type":"mcq","stem":"With what academic distinction did Rizal graduate Bachelor of Arts from Ateneo in 1877?","sub":"ateneo-graduation-sobresaliente","options":[{"t":"Sobresaliente distinction","c":true,"fb":"Rizal completed his Bachelor of Arts at Ateneo with outstanding sobresaliente honors."},{"t":"Magna cum laude honors","c":false,"fb":"Ateneo used the traditional Spanish evaluation system, awarding sobresaliente."},{"t":"Pass without distinction","c":false,"fb":"Rizal was consistently recognized as one of Ateneo's brightest scholars."},{"t":"Bene merito recognition","c":false,"fb":"He attained the highest mark of excellence rather than merely commendable standing."}]},{"cat":"02","type":"mcq","stem":"Which Spanish academic rating did José Rizal earn across his subjects upon completing his Bachelor of Arts at Ateneo?","sub":"ateneo-graduation-sobresaliente","options":[{"t":"Sobresaliente (Excellent)","c":true,"fb":"Rizal earned the highest possible mark, sobresaliente, in his Ateneo studies."},{"t":"Aprovechado (Very Good)","c":false,"fb":"Confuses the top honors tier with the lower commendable standing."},{"t":"Mediano (Fair standing)","c":false,"fb":"Rizal's scholastic performance far exceeded standard passing marks."},{"t":"Aprobado (Passing mark)","c":false,"fb":"Represents the minimum passing grade rather than top academic distinction."}]},{"cat":"02","type":"mcq","stem":"What motive prompted Rizal to shift to the Faculty of Medicine at UST in 1878?","sub":"ust-medical-shift-and-poem","options":[{"t":"A desire to treat his mother's deteriorating eyesight","c":true,"fb":"Doña Teodora was going blind, inspiring José to specialize in eye surgery."},{"t":"A statutory decree requiring all poets to practice medicine","c":false,"fb":"No colonial mandate compelled humanities graduates to pursue medical study."},{"t":"An explicit condition for claiming his family's inheritance","c":false,"fb":"His career path was a personal choice driven by devotion to his mother."},{"t":"A scholarship requirement from Universidad Central de Madrid","c":false,"fb":"He enrolled at UST independently before deciding to continue studies in Madrid."}]},{"cat":"02","type":"mcq","stem":"Which famous poem by Rizal won first prize in a literary contest while he was studying at UST?","sub":"ust-medical-shift-and-poem","options":[{"t":"A La Juventud Filipina","c":true,"fb":"His patriotic poem urged Filipino youth to use their genius for the nation."},{"t":"Mi Primera Inspiración","c":false,"fb":"Mi Primera Inspiración was written earlier during his studies at Ateneo Municipal."},{"t":"Recuerdo A Mi Pueblo","c":false,"fb":"Recuerdo A Mi Pueblo was an Ateneo poem honoring his hometown of Calamba."},{"t":"Mi Ultimo Adios","c":false,"fb":"Mi Ultimo Adios was penned in Fort Santiago on the eve of his execution."}]},{"cat":"02","type":"multi","stem":"Which TWO challenges did Rizal experience while studying medicine at UST? Select the TWO university difficulties.","sub":"ust-medical-shift-and-poem","options":[{"t":"Discrimination from Spanish professors looking down on Filipinos","c":true,"fb":"Racial prejudice from faculty created an oppressive academic atmosphere for natives."},{"t":"Outdated and rigid teaching methods in classrooms","c":true,"fb":"Scholastic pedagogical approaches frustrated his desire for modern empirical science."},{"t":"Complete lack of library access across the campus","c":false,"fb":"UST maintained extensive historical collections, though pedagogy remained rigid."},{"t":"Mandatory military drill on overseas naval warships","c":false,"fb":"University students were not conscripted into regular overseas naval operations."},{"t":"Total prohibition against writing Spanish poetry","c":false,"fb":"Rizal entered and won official university literary poetry competitions."}]},{"cat":"02","type":"mcq","stem":"Aboard which Spanish vessel did Rizal secretly depart for Spain in May 1882?","sub":"secret-departure-salvadora","options":[{"t":"The steamer Salvadora","c":true,"fb":"Rizal boarded the steamer Salvadora in Manila bound for Singapore and Spain."},{"t":"The steamer San Jose","c":false,"fb":"Names an imaginary ship rather than the actual commercial vessel."},{"t":"The steamer Reina Cristina","c":false,"fb":"The Reina Cristina was a naval warship, not his commercial transport."},{"t":"The steamer Isla de Cuba","c":false,"fb":"Names an alternate vessel rather than his actual passenger steamer."}]},{"cat":"02","type":"mcq","stem":"Why did José and Paciano keep his May 1882 voyage to Spain strictly secret?","sub":"secret-departure-salvadora","options":[{"t":"To avoid surveillance by colonial authorities and his mother's objections","c":true,"fb":"They feared Spanish police interference and knew Doña Teodora would oppose it."},{"t":"To evade arrest warrants for publishing Noli Me Tangere","c":false,"fb":"Noli Me Tangere was written and published years later in Europe."},{"t":"To conceal his enrollment in a foreign naval academy","c":false,"fb":"Rizal traveled to pursue university medicine and letters, not military training."},{"t":"To avoid paying passenger tariffs at Manila harbor customs","c":false,"fb":"His departure was kept secret for political and familial reasons, not tariffs."}]},{"cat":"02","type":"mcq","stem":"Which two academic licentiate degrees did Rizal simultaneously complete in Madrid?","sub":"madrid-dual-licentiates","options":[{"t":"Licentiate in Medicine and Licentiate in Philosophy and Letters","c":true,"fb":"Rizal completed dual licentiates at Universidad Central de Madrid in both fields."},{"t":"Licentiate in Civil Law and Licentiate in Naval Architecture","c":false,"fb":"Rizal never studied jurisprudence or maritime engineering in Madrid."},{"t":"Licentiate in Agricultural Chemistry and Licentiate in Theology","c":false,"fb":"His studies concentrated on medicine and humanities rather than theology."},{"t":"Licentiate in Mechanical Engineering and Licentiate in Music","c":false,"fb":"His professional degrees were awarded in clinical medicine and liberal arts."}]},{"cat":"02","type":"mcq","stem":"Which statement correctly describes the requirement for practicing medicine in Spain during Rizal's era?","sub":"madrid-dual-licentiates","options":[{"t":"A doctoral degree was not required to practice medicine.","c":true,"fb":"A doctorate could be obtained, but it was not needed to practice medicine."},{"t":"Physicians were required to serve five years in the imperial navy.","c":false,"fb":"Doctors were under no legal obligation to complete mandatory naval tours."},{"t":"Only ordained Catholic priests were permitted to treat patients.","c":false,"fb":"Medicine was a secular professional discipline open to certified laymen."},{"t":"Medical degrees from Madrid were invalid across European nations.","c":false,"fb":"Spanish university licentiates were respected across international medical circles."}]},{"cat":"02","type":"mcq","stem":"Under which renowned French ophthalmologist did Rizal train as an assistant in Paris in 1885?","sub":"ophthalmology-mentors-europe","options":[{"t":"Dr. Louis de Wecker","c":true,"fb":"Rizal worked four months under Dr. Louis de Wecker mastering ophthalmic surgical procedures."},{"t":"Dr. Otto Becker","c":false,"fb":"Dr. Becker was his subsequent surgical mentor in Heidelberg, Germany."},{"t":"Dr. Ferdinand Blumentritt","c":false,"fb":"Blumentritt was an Austrian professor of geography and his lifelong confidant."},{"t":"Dr. Maximo Viola","c":false,"fb":"Viola was a Filipino physician friend who financed the printing of Noli."}]},{"cat":"02","type":"scenario","stem":"Whose clinical surgical practice provided this specialized practical training?","sub":"ophthalmology-mentors-europe","context":"In late 1885, Rizal lives in Paris seeking clinical experience in eye surgery before residency programs exist. He works four months as a personal clinical assistant.","options":[{"t":"Dr. Louis de Wecker","c":true,"fb":"Dr. de Wecker provided intensive clinical mentorship in modern surgical techniques."},{"t":"Dr. Otto Becker","c":false,"fb":"Rizal trained under Dr. Becker later in 1886 after moving to Germany."},{"t":"Dr. Ferdinand Blumentritt","c":false,"fb":"Blumentritt was an Austrian ethnographer and close personal epistolary friend."},{"t":"Dr. Charles Henry Kipping","c":false,"fb":"Kipping was an English engineer who married Rizal's muse Leonor Rivera."}]},{"cat":"03-1","type":"mcq","stem":"What best describes the Propaganda Movement?","sub":"propaganda-movement-definition","options":[{"t":"A late-19th-century campaign for peaceful political and social reforms under Spanish rule","c":true,"fb":"The movement used peaceful advocacy to seek political and social reforms."},{"t":"A campaign to replace Spanish rule immediately through armed revolt","c":false,"fb":"The movement emphasized reform through peaceful means rather than armed revolt."},{"t":"A program focused mainly on expanding Spanish religious control in the Philippines","c":false,"fb":"The movement criticized abuses and sought reforms rather than stronger religious control."},{"t":"A movement organized mainly to promote trade between Spain and the Philippines","c":false,"fb":"Its central concerns were political and social reform, not commercial expansion."}]},{"cat":"03-1","type":"mcq","stem":"Who formed the main intellectual base of the Propaganda Movement?","sub":"propaganda-movement-definition","options":[{"t":"Spanish friars and colonial soldiers","c":false,"fb":"These groups were not identified as the intellectual base of the reform movement."},{"t":"Filipino intellectuals and expatriates known as ilustrados","c":true,"fb":"Filipino intellectuals and expatriates, or ilustrados, led the reform effort."},{"t":"Provincial governors and Spanish merchants","c":false,"fb":"The movement was driven by Filipino reform-minded intellectuals and expatriates."},{"t":"Parish clergy and colonial tax collectors","c":false,"fb":"These were not the groups identified as leading the movement."}]},{"cat":"03-1","type":"mcq","stem":"What role did La Solidaridad serve in the Propaganda Movement?","sub":"lasol-official-organ","options":[{"t":"It served as the movement's official publication.","c":true,"fb":"La Solidaridad was the official publication and primary platform of the Propaganda Movement."},{"t":"It served as the colonial government's administrative bulletin.","c":false,"fb":"The newspaper represented Filipino reformists rather than the Spanish colonial government."},{"t":"It served mainly as a journal for military organization.","c":false,"fb":"Its main purpose was peaceful reform advocacy, not military organization."},{"t":"It served mainly as a record of parish appointments.","c":false,"fb":"Its coverage focused on political and social reforms rather than parish records."}]},{"cat":"03-1","type":"fitb","stem":"La Solidaridad was established in the city of ____.","sub":"lasol-founding","subtype":"term","answer":["Barcelona"],"caseSensitive":false,"fb":"La Solidaridad was established in Barcelona, Spain, on February 15, 1889."},{"cat":"03-1","type":"fitb","stem":"La Solidaridad was established in the year ____.","sub":"lasol-founding","subtype":"year","answer":["1889"],"caseSensitive":false,"fb":"La Solidaridad was established on February 15, 1889."},{"cat":"03-1","type":"mcq","stem":"Which approach best reflects the reformists' political position?","sub":"reform-loyalty-sc
