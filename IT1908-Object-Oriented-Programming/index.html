with invoking or calling it."},{"t":"It converts source code expressions into bytecode during runtime execution.","c":false,"fb":"Confuses source code declarations with the compilation process."}]},{"cat":"01","type":"multi","stem":"Which two statements correctly describe the required elements of a concrete Java method declaration such as `void save() {}`? Select the TWO correct statements.","options":[{"t":"The method is invalid because it omits an explicit access modifier.","c":false,"fb":"M2: Access modifiers are optional; omitting them defaults to package-private."},{"t":"The empty parentheses `()` satisfy the requirement for a parameter list.","c":true,"fb":"A parameter list is mandatory in a method declaration, but it can be empty."},{"t":"The method is invalid because a concrete method must contain at least one statement.","c":false,"fb":"M1: A method body is required, but an empty block `{}` is syntactically valid."},{"t":"The keyword `void` satisfies the mandatory return type requirement.","c":true,"fb":"Every method declaration must specify a return type, and `void` indicates no value is returned."},{"t":"The method requires an optional specifier such as `final` or `static` to compile.","c":false,"fb":"M4: Specifiers modify method behavior and are completely optional."}]},{"cat":"01","type":"scenario","stem":"What occurs when this class is compiled?","context":"A student writes the following method inside a banking utility class to process account fees:","options":[{"t":"It compiles successfully because access modifier, parameter list, and body are present.","c":false,"fb":"M3: Every method declaration strictly requires a return type."},{"t":"A compilation error occurs because the method declaration lacks a return type.","c":true,"fb":"Unlike constructors, standard method declarations must specify a return type or `void`."},{"t":"A compilation error occurs because the method body must return a boolean status.","c":false,"fb":"Methods can be void, but `void` must be explicitly declared."},{"t":"It compiles successfully because the parameter list defines the incoming variable type.","c":false,"fb":"Parameter types do not substitute for the method's declared return type."}],"code":"public deductFee(double amount) {\n    System.out.println(\"Fee deducted: \" + amount);\n}","codeLang":"java","codeEyebrow":"JAVA METHOD"},{"cat":"01","type":"fitb","stem":"In a concrete game loop method declaration such as `void render() {}`, the curly braces `{}` constitute the ____, which is a required element even when it contains no statements.","subtype":"element","answer":["method body"],"caseSensitive":false,"fb":"The method body enclosed in braces is a required element of any concrete method declaration."},{"cat":"01","type":"scenario","stem":"What is the compilation result for this declaration?","context":"A developer attempts to declare a numeric helper method in a calculation module:","options":[{"t":"It compiles cleanly because `int` and `static` can appear in any order before the name.","c":false,"fb":"M1: The return type must immediately precede the method name, after all modifiers."},{"t":"A compilation error occurs because the return type appears before the optional specifier.","c":true,"fb":"The return type `int` must come after specifiers like `static` and immediately before `calculateTotal`."},{"t":"A compilation error occurs because `static` methods cannot accept more than one parameter.","c":false,"fb":"Static methods can have any number of parameters."},{"t":"It compiles cleanly because `public` is correctly placed at the beginning of the header.","c":false,"fb":"M1: Even with `public` first, placing `int` before `static` is a syntax error."}],"code":"public int static calculateTotal(int base, int tax) {\n    return base + tax;\n}","codeLang":"java","codeEyebrow":"JAVA METHOD"},{"cat":"01","type":"mcq","stem":"Which method header follows the canonical Java ordering rules for modifiers, specifiers, and return types?","options":[{"t":"`void public playTrack(String title)`","c":false,"fb":"M1: The return type `void` cannot precede the access modifier `public`."},{"t":"`public final void playTrack(String title)`","c":true,"fb":"Follows the canonical order: access modifier (`public`), specifier (`final`), return type (`void`), and method name."},{"t":"`final playTrack void(String title)`","c":false,"fb":"M2: The method name cannot precede the return type."},{"t":"`public playTrack final void(String title)`","c":false,"fb":"M2: The method name is misplaced before specifiers and return type."}]},{"cat":"01","type":"scenario","stem":"What is the compiler's response to this method declaration?","context":"A student writes the following method header in an inventory system:","options":[{"t":"It compiles because `int` represents the primary output and `void` allows empty exits.","c":false,"fb":"M1: Java methods permit exactly one return type."},{"t":"A compilation error occurs because a method cannot declare more than one return type.","c":true,"fb":"Declaring both `int` and `void` violates the single return type constraint."},{"t":"It compiles because the `final` specifier resolves ambiguous return types.","c":false,"fb":"The `final` specifier affects method overriding, not return type validation."},{"t":"A compilation error occurs because `final` cannot be applied to methods taking parameters.","c":false,"fb":"`final` methods can take parameters without restriction."}],"code":"public final int void checkStock(int itemId) {\n    /* method body */\n}","codeLang":"java","codeEyebrow":"JAVA DECLARATION"},{"cat":"01","type":"mcq","stem":"When a method's return type is declared as `void`, what constraint is placed on its implementation?","options":[{"t":"The method must omit the `return` keyword entirely under all circumstances.","c":false,"fb":"A `void` method may use an empty `return;` statement for early exit."},{"t":"The method cannot return any value to the calling statement.","c":true,"fb":"`void` indicates that the method executes actions without returning data."},{"t":"The method automatically returns an integer status code of zero upon completion.","c":false,"fb":"M3: `void` methods return no value, not even default numeric zero."},{"t":"The method must return `null` if an explicit `return` statement is written.","c":false,"fb":"M2: Returning `null` produces a compilation error in a `void` method."}]},{"cat":"01","type":"mcq","stem":"According to standard Java method naming conventions, which identifier is properly formatted?","options":[{"t":"`PrintReport`","c":false,"fb":"Violates convention by starting with an uppercase letter (PascalCase is for classes)."},{"t":"`calculateAverageScore`","c":true,"fb":"Follows lowerCamelCase starting with a lowercase verb (`calculate`)."},{"t":"`average_score_compute`","c":false,"fb":"Violates convention by using snake_case instead of lowerCamelCase."},{"t":"`Run_Quickly`","c":false,"fb":"Violates convention by using uppercase letters and underscores."}]},{"cat":"01","type":"scenario","stem":"How should a caller in another class invoke this method without creating an instance?","context":"Consider the following class definition:","options":[{"t":"`GeometryHelper.getCircleArea(5.0);`","c":true,"fb":"Static methods belong to the class and are called directly using `ClassName.methodName()`."},{"t":"`new GeometryHelper.getCircleArea(5.0);`","c":false,"fb":"M1: Static methods do not require instantiation with `new`."},{"t":"`getCircleArea.GeometryHelper(5.0);`","c":false,"fb":"Incorrect invocation syntax; the class name must precede the method name."},{"t":"`GeometryHelper->getCircleArea(5.0);`","c":false,"fb":"Java uses dot notation (`.`), not arrow syntax (`->`), for member access."}],"code":"public class GeometryHelper {\n    public static double getCircleArea(double radius) {\n        return 3.14159 * radius * radius;\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"01","type":"multi","stem":"Which two statements are correct regarding the method declared below with the `static` specifier? Select the TWO correct statements.","options":[{"t":"The method belongs to the declaring class rather than to any specific object instance.","c":true,"fb":"The `static` keyword marks the method as a class-level member."},{"t":"Callers must instantiate an object of the class before invoking this method.","c":false,"fb":"M1: Static methods can be invoked directly via the class name."},{"t":"The method cannot modify its parameters or return a new String value.","c":false,"fb":"M2: `static` does not enforce immutability on returned data."},{"t":"The method can be called directly using the class name followed by the dot operator.","c":true,"fb":"Calling syntax for static methods uses `ClassName.methodName(arguments)`."},{"t":"The method is automatically hidden and cannot be called from other classes.","c":false,"fb":"M4: Visibility is governed by the access modifier (`public`), not `static`."}],"code":"public static String trimWhitespace(String text) {\n    // method implementation\n}","codeLang":"java","codeEyebrow":"JAVA METHOD"},{"cat":"01","type":"fitb","stem":"To declare a temperature conversion method that can be invoked directly as `Temperature.celsiusToFahrenheit(100)` without creating an object, the method header must include the ____ optional specifier.","subtype":"specifier","answer":["static"],"caseSensitive":false,"fb":"The `static` specifier creates a class method callable directly via the class name."},{"cat":"01","type":"scenario","stem":"What happens if a subclass `PremiumAccountService` attempts to override `recordTransaction(String id)`?","context":"A core banking class defines a transaction recording method:","options":[{"t":"The subclass method executes normally and replaces the parent method implementation.","c":false,"fb":"M2: The `final` modifier prevents overriding by any subclass."},{"t":"The compiler issues an error stating that a final method cannot be overridden.","c":true,"fb":"Applying `final` to a method prohibits any derived subclass from overriding it."},{"t":"The code compiles, but the JVM throws a runtime exception when the subclass is loaded.","c":false,"fb":"Overriding a final method is caught at compile time, not runtime."},{"t":"The subclass inherits the method only if it changes the return type to `int`.","c":false,"fb":"Changing the return type does not bypass the final overriding restriction."}],"code":"public class AccountService {\n    public final void recordTransaction(String id) {\n        System.out.println(\"Recorded: \" + id);\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"01","type":"mcq","stem":"Why would a software architect apply the `final` specifier to a security verification method?","options":[{"t":"To prevent child classes from altering the method's critical verification logic.","c":true,"fb":"The `final` specifier ensures that subclasses cannot override or redefine the method."},{"t":"To allow only one thread to invoke the verification method at any given moment.","c":false,"fb":"Confuses `final` with synchronization or thread safety."},{"t":"To restrict callers from invoking the method more than one time during program execution.","c":false,"fb":"M1: `final` does not restrict execution count."},{"t":"To force all derived subclasses to provide their own custom implementation.","c":false,"fb":"Confuses `final` with `abstract` (which forces subclasses to implement it)."}]},{"cat":"01","type":"fitb","stem":"To permanently prohibit subclasses from overriding the tax calculation method `public double computeAuditedTax(double income) { ... }`, the header must include the ____ optional specifier.","subtype":"specifier","answer":["final"],"caseSensitive":false,"fb":"The `final` specifier seals the method so that no subclass can override it."},{"cat":"01","type":"scenario","stem":"What is the compilation result for this method declaration?","context":"A developer defines a base audio synthesizer class with the following method:","options":[{"t":"It compiles successfully because abstract classes can provide default method bodies.","c":false,"fb":"M1: An abstract method cannot contain a method body, even with default code."},{"t":"A compilation error occurs because an abstract method must not specify a body.","c":true,"fb":"Abstract method declarations must terminate with a semicolon and omit `{}`."},{"t":"A compilation error occurs because abstract methods cannot accept primitive parameters.","c":false,"fb":"M4: Abstract methods can declare parameters just like concrete methods."},{"t":"It compiles successfully as long as `generateSignal` is called only by subclasses.","c":false,"fb":"M1: Providing a body block `{}` on an abstract method is an immediate syntax error."}],"code":"public abstract class SoundSource {\n    public abstract void generateSignal(int frequency) {\n        /* synthesize wave */\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"01","type":"multi","stem":"Which two statements correctly describe the syntax of an `abstract` method declaration: `public abstract void exportData(String destination);`? Select the TWO correct statements.","options":[{"t":"The declaration must terminate with a semicolon `;` instead of a curly-brace body `{}`.","c":true,"fb":"Abstract methods specify signatures only and end with a semicolon."},{"t":"The method may include an empty body `{}` if no statements are needed immediately.","c":false,"fb":"M1: Even an empty body `{}` causes a compilation error on an abstract method."},{"t":"The declaration is missing its mandatory implementation block.","c":false,"fb":"Abstract methods are intentionally unimplemented in the declaring class."},{"t":"Concrete subclasses are responsible for providing the executable body for this method.","c":true,"fb":"Subclasses override and implement the abstract method header."},{"t":"The method header must include the `final` specifier to prevent syntax errors.","c":false,"fb":"M2: `abstract` and `final` are mutually exclusive because abstract methods must be overridden."}]},{"cat":"01","type":"fitb","stem":"A method header that specifies what parameters a method accepts but deliberately omits a method body, ending with a semicolon, is declared using the ____ optional specifier.","subtype":"specifier","answer":["abstract"],"caseSensitive":false,"fb":"The `abstract` keyword declares a method without a body."},{"cat":"01","type":"mcq","stem":"How do the valid access control levels differ between top-level class declarations and member-level method declarations?","options":[{"t":"Top-level classes support four access levels, whereas methods only support two.","c":false,"fb":"Reverses the rule; methods support four access levels, top-level classes only two."},{"t":"Top-level classes support only `public` and package-private, while methods support all four.","c":true,"fb":"Outer classes can only be public or package-private; methods can be public, protected, package-private, or private."},{"t":"Both top-level classes and member methods support `public`, `protected`, and `private`.","c":false,"fb":"M1: Top-level classes cannot be declared `protected` or `private`."},{"t":"Member methods can only be declared `public` or `private`.","c":false,"fb":"M2: Member methods also support `protected` and package-private."}]},{"cat":"01","type":"scenario","stem":"What is the result when compiling this top-level class?","context":"A student writes the following class definition inside a file named `Portal.java`:","options":[{"t":"It compiles because `private` restricts class instantiation to the current package.","c":false,"fb":"M1: Top-level classes cannot be private."},{"t":"A compilation error occurs because top-level classes cannot be declared `private`.","c":true,"fb":"Top-level classes can only use `public` or package-private (no modifier)."},{"t":"It compiles because the member method `displayWelcome` is declared `public`.","c":false,"fb":"Member visibility does not validate an illegal top-level class modifier."},{"t":"A compilation error occurs because `displayWelcome` must also be declared `private`.","c":false,"fb":"The error is caused by the top-level class modifier, not the method."}],"code":"private class Portal {\n    public void displayWelcome() {\n        System.out.println(\"Welcome to the Portal\");\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"01","type":"scenario","stem":"What happens when `ReportCard` is compiled?","context":"Consider two classes defined in the same package:","options":[{"t":"It compiles successfully because both classes reside in the exact same package.","c":false,"fb":"M1: `private` members are inaccessible outside their declaring class, even within the same package."},{"t":"A compilation error occurs because `calculateGpa()` has private access in `GradeBook`.","c":true,"fb":"Private members cannot be accessed directly from any other class, including package peers."},{"t":"It compiles, but calling `generateReport()` throws a runtime access security exception.","c":false,"fb":"Member accessibility is verified at compile time."},{"t":"A compilation error occurs because `ReportCard` cannot instantiate `GradeBook`.","c":false,"fb":"`GradeBook` is public and can be instantiated; the error is invoking the private method."}],"code":"public class GradeBook {\n    private void calculateGpa() {\n        System.out.println(\"Calculating GPA...\");\n    }\n}\n\npublic class ReportCard {\n    public void generateReport() {\n        GradeBook book = new GradeBook();\n        book.calculateGpa();\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"01","type":"multi","stem":"Which two statements correctly describe member visibility for `public` and `private` methods in `PatientRecord`? Select the TWO correct statements.","options":[{"t":"Any external class in any package can invoke `printSummary()` on a valid object reference.","c":true,"fb":"Public methods are accessible to all classes everywhere."},{"t":"Classes in the same package can invoke `encryptData()` directly without restrictions.","c":false,"fb":"M1: Private methods are hidden from all other classes, even in the same package."},{"t":"The `encryptData()` method can only be invoked from within the `PatientRecord` class body.","c":true,"fb":"Private access restricts visibility strictly to the declaring class."},{"t":"The `printSummary()` method is restricted to classes inside the same package.","c":false,"fb":"M2: Package-private restricts to the same package; public allows global access."},{"t":"The `PatientRecord` class cannot call its own `encryptData()` method.","c":false,"fb":"M3: A class has full access to all of its own private members."}],"code":"public class PatientRecord {\n    public void printSummary() { }\n    private void encryptData() { }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"01","type":"fitb","stem":"To ensure that an internal balance-updating method inside an `EWallet` class can never be called directly by external classes, its declaration must use the ____ access modifier.","subtype":"modifier","answer":["private"],"caseSensitive":false,"fb":"The `private` modifier restricts member access solely to the declaring class."},{"cat":"01","type":"scenario","stem":"What is the compilation result for `DeliveryTruck`?","context":"A project has two packages: `transport` and `logistics`.","options":[{"t":"Both `serviceEngine()` and `checkTires()` compile without issues.","c":false,"fb":"M1: Package-private `checkTires()` is not accessible outside its package, even to subclasses."},{"t":"`serviceEngine()` compiles, but `checkTires()` causes a compilation error.","c":true,"fb":"`protected` allows subclass access across packages, while package-private restricts access to package `transport`."},{"t":"`checkTires()` compiles, but `serviceEngine()` causes a compilation error.","c":false,"fb":"Reverses the rule; `protected` is accessible to subclasses in other packages."},{"t":"Both method calls fail because external packages cannot access non-public members.","c":false,"fb":"Subclasses can access inherited `protected` members across packages."}],"code":"// In package transport:\npackage transport;\npublic class Vehicle {\n    protected void serviceEngine() { }\n    void checkTires() { }\n}\n\n// In package logistics:\npackage logistics;\nimport transport.Vehicle;\npublic class DeliveryTruck extends Vehicle {\n    public void prepareRun() {\n        serviceEngine();\n        checkTires();\n    }\n}","codeLang":"java","codeEyebrow":"JAVA PACKAGES"},{"cat":"01","type":"mcq","stem":"What access privilege does `protected` grant that package-private (no modifier) does NOT grant?","options":[{"t":"Access from any unrelated class located in an external package.","c":false,"fb":"M2: Only `public` permits access from unrelated classes in other packages."},{"t":"Access from derived subclasses located in a different package.","c":true,"fb":"`protected` extends package visibility specifically to subclasses in outside packages."},{"t":"Access from non-subclass classes located within the same package.","c":false,"fb":"Both protected and package-private permit access within the same package."},{"t":"Access from inner classes declared inside the same source file.","c":false,"fb":"Both modifiers allow access within the declaring class context."}]},{"cat":"01","type":"multi","stem":"Which two statements are correct regarding a method declared with no access modifier (package-private) in `Invoice`? Select the TWO correct statements.","options":[{"t":"The method can be accessed by any class located within the `billing` package.","c":true,"fb":"Package-private members are fully accessible to all classes in the same package."},{"t":"A subclass located in package `accounting` can invoke `applyDiscounts()` directly.","c":false,"fb":"M1: Package-private members cannot be accessed across package boundaries, even by subclasses."},{"t":"The developer must write the keyword `package-private` explicitly before the return type.","c":false,"fb":"M3: Package-private is the default state when no access modifier keyword is written."},{"t":"Any unrelated class in another package can access the method if `Invoice` is public.","c":false,"fb":"Package-private limits access strictly to the same package regardless of class visibility."},{"t":"The method is inaccessible to classes located outside the `billing` package.","c":true,"fb":"Package-private enforces an absolute boundary at the package level."}],"code":"package billing;\npublic class Invoice {\n    void applyDiscounts() { }\n}","codeLang":"java","codeEyebrow":"JAVA DECLARATION"},{"cat":"01","type":"scenario","stem":"Which statement correctly calls this method from another class?","context":"A developer writes a class to track workouts with the following method definition:","options":[{"t":"`Tracker.logRun(int 30);`","c":false,"fb":"M1: Specifying the data type `int` during a method call is a compilation syntax error."},{"t":"`Tracker.logRun(30);`","c":true,"fb":"Method calls pass actual values or variables directly without data type keywords."},{"t":"`Tracker.logRun(minutes = 30);`","c":false,"fb":"Java does not support named-parameter assignment syntax in method invocations."},{"t":"`call Tracker.logRun(30);`","c":false,"fb":"Java does not use a `call` keyword for invoking methods."}],"code":"public class Tracker {\n    public static void logRun(int minutes) {\n        System.out.println(\"Running for \" + minutes + \" mins\");\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"01","type":"mcq","stem":"In Java, how does the parameter list in a method definition differ syntactically from the argument list in a method call?","options":[{"t":"Method definitions specify data types for each parameter, whereas method calls pass values or variable names without data types.","c":true,"fb":"Parameter declarations require explicit data types, while method invocations pass expressions or variables directly without type keywords."},{"t":"Method definitions enclose parameters in brackets `[]`, whereas method calls enclose arguments in parentheses `()`.","c":false,"fb":"Both method declarations and method invocations enclose their parameters and arguments in parentheses `()`."},{"t":"Method definitions allow omitting parameter variable names, whereas method calls require naming each argument.","c":false,"fb":"Method declarations in Java require both a data type and an identifier for each parameter."},{"t":"Method definitions accept literal values, whereas method calls can only accept previously declared variables.","c":false,"fb":"Method definitions declare variable parameters; method calls can pass literals, expressions, or variables."}]},{"cat":"01","type":"scenario","stem":"What error is reported when compiling this code?","context":"A programmer writes the following concrete method inside a smart thermostat class:","options":[{"t":"The code compiles normally because semicolons after parameter lists are ignored by the compiler.","c":false,"fb":"M2: Placing a semicolon after the parameter list terminates the header and breaks the declaration."},{"t":"A compilation error occurs because the semicolon terminates the method declaration, disconnecting its body.","c":true,"fb":"A concrete method header must not end with a semicolon; doing so terminates the declaration without a body."},{"t":"A compilation error occurs because `displayStatus` must be declared with an explicit access modifier.","c":false,"fb":"`public` is already provided as an access modifier."},{"t":"A compilation error occurs because concrete methods cannot have empty parameter parentheses `()`.","c":false,"fb":"Empty parameter lists `()` are completely valid in Java method declarations."}],"code":"public class Thermostat {\n    public void displayStatus(); {\n        System.out.println(\"Thermostat active\");\n    }\n}","codeLang":"java","codeEyebrow":"JAVA METHOD"},{"cat":"01","type":"mcq","stem":"In a concrete Java method declaration, why is placing a semicolon `;` between the parameter list `()` and the opening brace `{` illegal?","options":[{"t":"It indicates that the method returns `void` regardless of the declared return type.","c":false,"fb":"Semicolons do not alter the declared return type."},{"t":"It prematurely terminates the header, disconnecting the subsequent body block.","c":true,"fb":"Concrete methods must connect their parameter list directly to the opening body brace `{}`."},{"t":"It causes the compiler to treat the method as `static`.","c":false,"fb":"Specifiers like `static` are explicit keywords, not triggered by punctuation."},{"t":"It converts the concrete method into a constructor.","c":false,"fb":"Constructors have no return type and share the class name; punctuation does not create them."}]},{"cat":"01","type":"mcq","stem":"In a financial processing class, which method declaration strictly adheres to Java method naming conventions?","options":[{"t":"`public double calculateInterest(double principal)`","c":true,"fb":"Correct. Java method names must start with a lowercase verb (`calculate`) and capitalize subsequent words (`Interest`) in lowerCamelCase."},{"t":"`public double CalculateInterest(double principal)`","c":false,"fb":"Incorrect. Starting with an uppercase letter (PascalCase) is the convention for class names, not method names."},{"t":"`public double calculate_interest(double principal)`","c":false,"fb":"Incorrect. Using underscores (snake_case) violates Java's lowerCamelCase naming convention for methods."},{"t":"`public double interestCalculate(double principal)`","c":false,"fb":"Incorrect. Method names should begin with an action verb describing the behavior, rather than starting with a noun."}]},{"cat":"01","type":"mcq","stem":"Which statement correctly describes Java's standard naming convention for methods?","options":[{"t":"The name must begin with a verb in lowercase, and any subsequent words must begin with a capital letter.","c":true,"fb":"Correct. Java method names follow lowerCamelCase: they must begin with a verb in lowercase (e.g., `run`), followed by capitalized words for multi-word identifiers (e.g., `runFast`)."},{"t":"The name must begin with an uppercase noun, and any subsequent words must be separated by an underscore.","c":false,"fb":"Incorrect. Starting with an uppercase letter is standard for class names (PascalCase), and snake_case is not used for Java methods."},{"t":"The name must be written entirely in uppercase letters to distinguish member methods from local variables.","c":false,"fb":"Incorrect. All-uppercase identifiers with underscores are reserved for constants (`static final`), not method declarations."},{"t":"The name must begin with a lowercase noun denoting the return type, followed by an uppercase action verb.","c":false,"fb":"Incorrect. Java method names should begin with an action verb describing the operation performed, not a return type or noun."}]},{"cat":"01","type":"mcq","stem":"Which method header correctly arranges the required and optional elements according to Java method declaration syntax?","options":[{"t":"`public static int computeTotal(int price, int quantity)`","c":true,"fb":"Correct. Follows canonical Java ordering: access modifier (`public`), optional specifier (`static`), return type (`int`), method name (`computeTotal`), and parameter list (`(int price, int quantity)`)."},{"t":"`public computeTotal int(int price, int quantity)`","c":false,"fb":"Incorrect. The return type must immediately precede the method name, rather than appearing after it."},{"t":"`int public static computeTotal(int price, int quantity)`","c":false,"fb":"Incorrect. Access modifiers and optional specifiers must precede the return type."},{"t":"`public static computeTotal(int price, int quantity) int`","c":false,"fb":"Incorrect. Java does not allow placing the return type after the parameter parentheses."}]},{"cat":"01","type":"fitb","stem":"In Java, a method ____ specifies all the information needed to call a method, including its access level, return type, name, and parameters.","subtype":"term","answer":["declaration"],"caseSensitive":false,"fb":"A method declaration provides the compiler and calling classes with the complete specification (modifiers, return type, identifier, parameter list, exceptions, and body) required to invoke the method."},{"cat":"02","type":"mcq","stem":"Given the class declaration and instantiation statements below, how many total copies of `totalEnrollment` and `studentId` exist in memory after executing this code?","options":[{"t":"Three copies of totalEnrollment and three copies of studentId","c":false,"fb":"M1-PerInstanceCopy: static variables are not duplicated for each object instance."},{"t":"One copy of totalEnrollment and three copies of studentId","c":true,"fb":"Exactly one shared copy of the static field exists for the class, while each object instance maintains its own copy of the instance field."},{"t":"One copy of totalEnrollment and one copy of studentId","c":false,"fb":"M3-HeapIndependence: instance variables are not shared across objects."},{"t":"Zero copies of totalEnrollment and three copies of studentId","c":false,"fb":"M2-StackLocal: static variables are allocated when the class is loaded, not on demand."}],"code":"public class StudentRecord {\n    static int totalEnrollment = 0;\n    int studentId;\n\n    public StudentRecord(int id) {\n        studentId = id;\n        totalEnrollment++;\n    }\n}\nStudentRecord s1 = new StudentRecord(101);\nStudentRecord s2 = new StudentRecord(102);\nStudentRecord s3 = new StudentRecord(103);","codeLang":"java","codeEyebrow":"JAVA CLASS & OBJECTS"},{"cat":"02","type":"fitb","stem":"Regardless of how many times a class is instantiated, the Java compiler ensures that there is exactly ____ copy of a static variable in existence.","subtype":"concept","answer":["1","one","single"],"caseSensitive":false,"fb":"A static variable is a class variable, meaning exactly one copy is created and shared across all instances of the class."},{"cat":"02","type":"scenario","stem":"How does the Java runtime allocate and manage memory for `cashReserve` across these four objects?","context":"A regional bank implements a `BranchAtm` class to track terminal hardware. The developer declares `static double cashReserve = 500000.0;` inside `BranchAtm`. The system later instantiates four distinct ATM objects across the city.","options":[{"t":"Each of the four ATM objects allocates its own independent 500000.0 cashReserve variable on the heap.","c":false,"fb":"M1-PerInstanceCopy: assumes static fields duplicate per object creation."},{"t":"A new cashReserve variable is allocated on the call stack every time an ATM performs a cash withdrawal.","c":false,"fb":"M2-StackLocal: confuses class-level static fields with stack-allocated local variables."},{"t":"All four ATM objects share the exact single cashReserve variable allocated at the class level.","c":true,"fb":"Static fields belong to the class blueprint, ensuring a single shared copy across all instances."},{"t":"No memory is allocated for cashReserve until all four ATM instances complete initialization.","c":false,"fb":"M3-HeapIndependence: static variables are allocated when the class is loaded, independent of instance count."}]},{"cat":"02","type":"mcq","stem":"In Java, given the static field declaration and assignments below, why does subsequent access through `nc1.num` evaluate to `5`?","options":[{"t":"Because num is a single shared class variable, and nc2.num overwrites the value previously stored at that exact memory location.","c":true,"fb":"Static variables have only one copy in memory; reassigning through any instance reference mutates the single shared variable."},{"t":"Because the Java runtime synchronizes separate instance copies whenever a new assignment occurs.","c":false,"fb":"M1-InstanceShadowing: each instance does not have its own copy; there is only one shared variable."},{"t":"Because assigning a value to nc2.num automatically creates an alias pointing nc1 directly to nc2.","c":false,"fb":"Reference aliasing occurs when reference variables are assigned, not when primitive static fields are modified."},{"t":"Because static variables are allocated on the call stack and only preserve the most recent stack frame assignment.","c":false,"fb":"M2-StackLocal: static variables reside in class memory, not on transient stack frames."}],"code":"public static int num = 0;\n// ...\nnc1.num = 6;\nnc2.num = 5;","codeLang":"java","codeEyebrow":"JAVA STATEMENTS"},{"cat":"02","type":"mcq","stem":"What is printed to the console after executing the program below?","options":[{"t":"20","c":false,"fb":"M1-InstanceShadowing: assumes b operates independently on the initial 10 without seeing a's addition (10 * 2 = 20)."},{"t":"15","c":false,"fb":"M3-ClassIsolation: assumes only the first instance mutation persisted in memory."},{"t":"25","c":false,"fb":"Arithmetic misconception: incorrectly adds the values rather than executing cumulative operations."},{"t":"30","c":true,"fb":"Shared variable val starts at 10; a.val += 5 updates it to 15; b.val *= 2 multiplies that same shared variable by 2, yielding 30."}],"code":"public class ReviewQuiz {\n    static int val = 10;\n\n    public static void main(String[] args) {\n        ReviewQuiz a = new ReviewQuiz();\n        ReviewQuiz b = new ReviewQuiz();\n        a.val += 5;\n        b.val *= 2;\n        System.out.println(ReviewQuiz.val);\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"scenario","stem":"What string is returned by the method call `doc2.getWaterMark()`?","context":"A document management system implements the following class definition and execution statements:","options":[{"t":"\"CONFIDENTIAL\"","c":true,"fb":"Because waterMark is static, modifying it through doc1 mutates the single shared variable accessed by doc2.getWaterMark()."},{"t":"\"DRAFT\"","c":false,"fb":"M1-InstanceShadowing: assumes doc2 retains an independent copy of the original declaration value."},{"t":"null","c":false,"fb":"M2-ResetOnInstantiation: static variables are not cleared or reset when accessed across different instances."},{"t":"An empty string","c":false,"fb":"M3-ClassIsolation: doc2 reads the modified static variable rather than an empty string."}],"code":"public class Document {\n    public static String waterMark = \"DRAFT\";\n    public String getWaterMark() {\n        return waterMark;\n    }\n}\n// In driver execution:\nDocument doc1 = new Document();\nDocument doc2 = new Document();\ndoc1.waterMark = \"CONFIDENTIAL\";","codeLang":"java","codeEyebrow":"JAVA CLASS & CODE"},{"cat":"02","type":"multi","stem":"Which TWO statements correctly describe the design purposes and operational rules of static methods in Java? Select the TWO correct statements.","options":[{"t":"They provide utility operations that do not require object instance state.","c":true,"fb":"Static methods eliminate the need for callers to instantiate objects when logic depends only on arguments."},{"t":"They require callers to instantiate an object using new before invocation.","c":false,"fb":"M1-InstantiationRequired: static methods can be called directly using the class name."},{"t":"They provide operations that inspect or manipulate state shared across all instances.","c":true,"fb":"Static methods are designed to manage class-level variables such as global counters or shared rates."},{"t":"They maintain separate runtime execution states for each distinct object reference.","c":false,"fb":"M2-PerObjectStateHandling: static methods execute in a class-level context without instance-specific state."},{"t":"They automatically duplicate all instance variables whenever they execute.","c":false,"fb":"M2-PerObjectStateHandling: static methods do not allocate or duplicate instance variables."}]},{"cat":"02","type":"fitb","stem":"The `static` modifier in a utility method declaration allows callers to invoke the method directly without creating an ____ of the class first.","subtype":"concept","answer":["instance","object"],"caseSensitive":false,"fb":"Static utility methods belong to the class blueprint, eliminating the need for callers to instantiate an object or instance before execution."},{"cat":"02","type":"mcq","stem":"Class `SavingsAccount` defines `public static void setInterestRate(double rate)`. What is the standard, recommended Java syntax to invoke this method from an external driver class?","options":[{"t":"setInterestRate(0.05);","c":false,"fb":"M2-UnqualifiedAccess: external callers cannot invoke static methods without class qualification."},{"t":"new SavingsAccount().setInterestRate(0.05);","c":false,"fb":"M1-InstanceMandate: instantiating an object to call a static method is redundant and discouraged."},{"t":"SavingsAccount->setInterestRate(0.05);","c":false,"fb":"Uses invalid syntax from other languages rather than Java's dot operator."},{"t":"SavingsAccount.setInterestRate(0.05);","c":true,"fb":"The standard convention is placing the class name before the method name with a dot operator."}]},{"cat":"02","type":"scenario","stem":"Which expression correctly retrieves this value according to Java syntax rules?","context":"Inside an instance method of class `GameSession`, a developer needs to retrieve the static variable `maxPlayers` defined in an external class `ServerConfig`.","options":[{"t":"ServerConfig.maxPlayers","c":true,"fb":"External static fields must be accessed using the declaring class name followed by the dot operator."},{"t":"this.maxPlayers","c":false,"fb":"M1-InstanceMandate: keyword this refers to the current GameSession instance, which does not declare maxPlayers."},{"t":"super.maxPlayers","c":false,"fb":"Keyword super refers to parent class members, not unrelated external classes."},{"t":"maxPlayers","c":false,"fb":"M2-UnqualifiedAccess: unqualified field access fails outside the declaring class scope."}]},{"cat":"02","type":"mcq","stem":"Given the statements below, what are the values of `c1.fuelLevel` and `c2.fuelLevel` after execution?","options":[{"t":"c1.fuelLevel is 20, and c2.fuelLevel is 50","c":true,"fb":"Non-static instance fields are independent; modifying c1 does not alter c2's separate copy."},{"t":"c1.fuelLevel is 20, and c2.fuelLevel is 20","c":false,"fb":"M1-SharedInstanceMemory: confuses independent instance variables with shared static variables."},{"t":"c1.fuelLevel is 50, and c2.fuelLevel is 20","c":false,"fb":"Inverts which object reference underwent reassignment."},{"t":"The code does not compile because fuelLevel is not static","c":false,"fb":"M2-StaticRequirement: declaring non-static instance variables is completely valid."}],"code":"public class Car {\n    int fuelLevel = 50;\n}\nCar c1 = new Car();\nCar c2 = new Car();\nc1.fuelLevel = 20;","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"fitb","stem":"A non-static variable declared inside a class but outside any method or block is called a(n) ____ variable, and every instantiated object possesses its own independent copy.","subtype":"term","answer":["instance","instance variable"],"caseSensitive":false,"fb":"Instance variables belong to specific object instances, requiring instantiation before access and maintaining isolated values per object."},{"cat":"02","type":"scenario","stem":"What occurs when attempting to compile and execute this class?","context":"A student writes the following class:","options":[{"t":"It compiles and outputs 0 to the console.","c":false,"fb":"M1-SameClassOmniscience: assumes being in the same class allows direct static-to-instance calls."},{"t":"A compilation error occurs because static main cannot call instance method displayNumber directly.","c":true,"fb":"A static method belongs to the class and cannot invoke a non-static instance method without an object reference."},{"t":"A runtime NullPointerException occurs when main attempts to resolve displayNumber.","c":false,"fb":"Static context violations are caught at compile time, not runtime."},{"t":"It compiles successfully but outputs nothing because displayNumber has a void return type.","c":false,"fb":"The code fails to compile before bytecode is generated."}],"code":"public class NumberClass {\n    public static int num = 0;\n\n    public static void main(String[] args) {\n        displayNumber();\n    }\n\n    public void displayNumber() {\n        System.out.print(num);\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"mcq","stem":"Why does the Java compiler reject code when a static method attempts to directly reference an instance variable of its class?","options":[{"t":"Because static methods execute in a class-level context where no implicit object instance (this) exists to provide the variable's state.","c":true,"fb":"Static methods belong to the class blueprint and have no attached object instance to determine whose instance variable to access."},{"t":"Because instance variables are automatically set to private and hidden from other methods within the same class.","c":false,"fb":"M2-VisibilityModifierBlame: visibility modifiers do not restrict access between members declared within the same class."},{"t":"Because static methods require all accessed variables to be passed explicitly as primitive parameters.","c":false,"fb":"Static methods can freely access static variables and accept object references."},{"t":"Because instance variables are allocated on transient stack frames that deallocate before static methods run.","c":false,"fb":"Instance variables reside on the heap inside instantiated objects, not on temporary stack frames."}]},{"cat":"02","type":"mcq","stem":"According to Java's static vs. instance access rules, which caller-to-target access is illegal and results in a compilation error without creating an object?","options":[{"t":"An instance method accessing another instance variable of the same class","c":false,"fb":"Legal; instance methods execute with an active object reference."},{"t":"An instance method calling a static method of the same class","c":false,"fb":"M3-StaticInstanceSymmetry: legal; instance methods have access to class-level members."},{"t":"A static method directly accessing an instance variable of the class","c":true,"fb":"Illegal; static methods lack an instance context (`this`) to locate instance variables."},{"t":"A static method calling another static method of the same class","c":false,"fb":"Legal; both members exist at the class level."}]},{"cat":"02","type":"multi","stem":"In the non-compiling class below, which TWO independent modifications will allow this program to compile and run successfully? Select the TWO correct statements.","options":[{"t":"Declare the field as static int health = 100;.","c":true,"fb":"Making health a static class variable permits static main to reference it directly."},{"t":"Instantiate Hero inside main and access the field via new Hero().health.","c":true,"fb":"Creating an object provides the required instance context to read health."},{"t":"Add the this keyword by writing System.out.println(this.health);.","c":false,"fb":"M2-ImplicitThisInStatic: keyword this cannot be referenced from within a static method."},{"t":"Change main's return type from void to int.","c":false,"fb":"Altering the return type does not grant access to instance fields and breaks standard main execution."},{"t":"Enclose the print statement inside a try-catch block.","c":false,"fb":"Static context violations are compilation errors, not catchable runtime exceptions."}],"code":"public class Hero {\n    int health = 100;\n\n    public static void main(String[] args) {\n        System.out.println(health);\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"mcq","stem":"In the class below, how does the Java compiler evaluate the expression `balance < minBalance` inside `verifyAccount`?","options":[{"t":"It triggers a compilation error because instance methods cannot access static variables.","c":false,"fb":"M1-StaticInaccessibleToInstance: instance methods have full access to static class fields."},{"t":"It fails compilation unless minBalance is explicitly referenced as this.minBalance.","c":false,"fb":"Static fields belong to the class and do not require this."},{"t":"It compiles but throws a runtime exception because minBalance is stored outside the heap.","c":false,"fb":"Static variables are initialized at class load time and are safely accessible."},{"t":"It compiles successfully because instance methods have full legal access to static class members.","c":true,"fb":"Instance methods can access both instance state and class-level static fields."}],"code":"public class Account {\n    static double minBalance = 50.0;\n    double balance = 200.0;\n\n    public void verifyAccount() {\n        if (balance < minBalance) {\n            System.out.print(\"Low\");\n        } else {\n            System.out.print(\"OK\");\n        }\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"scenario","stem":"Why is `obj1.increment()` legally permitted to read and modify `count`?","context":"Consider the class definition and instantiations below:","options":[{"t":"Because instance methods operate within the class scope and have direct access to static class members.","c":true,"fb":"Java's access rules permit instance methods to freely read and mutate static variables."},{"t":"Because the compiler converts count into a local stack variable during the method call.","c":false,"fb":"M2-LocalShadowConversion: count remains a shared static class variable in memory."},{"t":"Because obj1 duplicates count and stores the new value in its private instance heap table.","c":false,"fb":"Static variables are never duplicated per instance."},{"t":"Because the compiler automatically alters increment into a static method at build time.","c":false,"fb":"increment remains an instance method; the compiler does not alter declared method modifiers."}],"code":"public class StaticVarDemo {\n    static int count = 0;\n\n    public void increment() {\n        count++;\n    }\n}\n// In main:\nStaticVarDemo obj1 = new StaticVarDemo();\nStaticVarDemo obj2 = new StaticVarDemo();\nobj1.increment();","codeLang":"java","codeEyebrow":"JAVA CLASS & CODE"},{"cat":"02","type":"fitb","stem":"When a static method attempts to reference an instance field directly without an object, the Java compiler reports: \"non-static variable cannot be referenced from a ____ context\".","subtype":"diagnostic","answer":["static"],"caseSensitive":false,"fb":"The compiler diagnostic is \"non-static variable [name] cannot be referenced from a static context\"."},{"cat":"02","type":"scenario","stem":"What error does the Java compiler generate when compiling `Circle`?","context":"A developer writes the following geometry calculation class:","options":[{"t":"non-static method getRadius() cannot be referenced from a static context","c":true,"fb":"Static method displayArea cannot invoke instance method getRadius without an instantiated object reference."},{"t":"NullPointerException at runtime","c":false,"fb":"M1-RuntimeNullPointer: static context violations are caught at compile time, not runtime."},{"t":"getRadius() has private access in Circle","c":false,"fb":"M2-VisibilityModifierBlame: getRadius has public access and is declared in the same class."},{"t":"method getRadius() in class Circle cannot be applied to given types","c":false,"fb":"The method signature has no arguments; the error is caused by the static calling context."}],"code":"public class Circle {\n    public double getRadius() {\n        return 5.0;\n    }\n\n    public static void displayArea() {\n        double r = getRadius();\n        System.out.println(Math.PI * r * r);\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"mcq","stem":"In the class below, why does compilation fail on the statement `registerStudent();`?","options":[{"t":"The main method must be marked private to invoke methods declared within the same class.","c":false,"fb":"M2-VisibilityModifierBlame: main must remain public as the program entry point."},{"t":"Method registerStudent requires an explicit integer argument.","c":false,"fb":"registerStudent is declared with an empty parameter list."},{"t":"Non-static method registerStudent cannot be referenced from a static context.","c":true,"fb":"Directly calling an instance method from static main without an object reference violates Java's static context rule."},{"t":"Java classes are prohibited from declaring static and non-static methods together.","c":false,"fb":"Classes regularly combine static and non-static members."}],"code":"public class Registry {\n    public void registerStudent() {\n        System.out.println(\"Registered\");\n    }\n\n    public static void main(String[] args) {\n        registerStudent();\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"multi","stem":"In the class below, the call to `display()` fails to compile. Which THREE independent modifications will successfully allow the code to compile and run? Select the THREE correct statements.","options":[{"t":"Declare both value and display() with the static modifier.","c":true,"fb":"Converting both members to static enables direct invocation from static main."},{"t":"Instantiate DisplayApp inside main and invoke display() on the object via new DisplayApp().display().","c":true,"fb":"Creating an instance provides the object context required to call an instance method."},{"t":"Modify display(DisplayApp app) to accept an instance and invoke it inside main using an instantiated object argument.","c":true,"fb":"Supplying an explicit object parameter allows static contexts to invoke instance members on that reference."},{"t":"Change display() from public to private while leaving it non-static.","c":false,"fb":"M2-AccessModifierRemedy: modifying visibility does not resolve static context mismatches."},{"t":"Cast the method invocation using ((DisplayApp) display()).","c":false,"fb":"M1-CastRemedy: casting syntax cannot bypass missing instance context."}],"code":"public class DisplayApp {\n    int value = 42;\n\n    public void display() {\n        System.out.println(value);\n    }\n\n    public static void main(String[] args) {\n        display();\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"mcq","stem":"A programmer needs to call the instance method `calculateTotal()` from inside static `main` in class `Invoice`. What is the proper way to write this invocation?","options":[{"t":"Invoice inv = new Invoice(); inv.calculateTotal();","c":true,"fb":"Instantiating Invoice creates an object whose instance method can be called via the reference variable."},{"t":"Invoice.calculateTotal();","c":false,"fb":"Non-static instance methods cannot be invoked using the class name."},{"t":"calculateTotal(this);","c":false,"fb":"Keyword this cannot be used inside static main."},{"t":"(static) calculateTotal();","c":false,"fb":"M1-CastRemedy: static is a modifier, not a valid type cast expression."}]},{"cat":"02","type":"scenario","stem":"Which architectural solution allows `runDiagnostics()` to invoke `readProbe()` without causing a compilation error?","context":"A developer designs an embedded monitor class where `readProbe()` is an instance method reading physical hardware pins. The developer needs to invoke `readProbe()` inside a static diagnostic routine `runDiagnostics()`, but must preserve `readProbe()` as an instance method.","options":[{"t":"Remove the static keyword from the program's main method header.","c":false,"fb":"M3-MainSignatureAlteration: removing static from main prevents the JVM from launching the class."},{"t":"Declare the probe reading variable private inside the method body.","c":false,"fb":"M2-AccessModifierRemedy: adjusting variable visibility does not resolve static context restrictions."},{"t":"Pass an instantiated monitor object into runDiagnostics as a method parameter.","c":true,"fb":"Passing an explicit object reference provides the static method with the instance context needed to call readProbe()."},{"t":"Prefix the method call with super.readProbe().","c":false,"fb":"Keyword super is prohibited inside static methods."}]},{"cat":"02","type":"scenario","stem":"Which pair of statements inside `RunSavingsAccount.main` correctly configures the interest rate and deposits funds?","context":"A banking project divides responsibilities across two files: `SavingsAccount` (blueprint class) defines static `interestRate`, private `balance`, static method `setInterestRate(double r)`, and instance method `deposit(double a)`; `RunSavingsAccount` (driver class) contains `public static void main(String[] args)`.","options":[{"t":"SavingsAccount.setInterestRate(0.03); SavingsAccount.deposit(100.0);","c":false,"fb":"deposit is an instance method and cannot be invoked using the class name."},{"t":"SavingsAccount.setInterestRate(0.03); SavingsAccount acc = new SavingsAccount(); acc.deposit(100.0);","c":true,"fb":"Static setInterestRate is called via the class name, while instance method deposit is called on an instantiated object."},{"t":"setInterestRate(0.03); acc.deposit(100.0);","c":false,"fb":"External static methods cannot be invoked without qualifying them with their class name."},{"t":"RunSavingsAccount.setInterestRate(0.03); deposit(100.0);","c":false,"fb":"M2-DriverStateConfusion: setInterestRate belongs to SavingsAccount, not RunSavingsAccount."}]},{"cat":"02","type":"fitb","stem":"In standard object-oriented Java architecture, a class defining data fields and instance behaviors serves as a blueprint, while the separate class containing the `main` method that executes the program is known as the ____ class.","subtype":"term","answer":["driver","driver class"],"caseSensitive":false,"fb":"The driver class contains the main method to run and coordinate objects defined by blueprint classes."},{"cat":"02","type":"mcq","stem":"In the static helper method below, why does this static method compile and execute successfully despite calling the non-static method `getBalance()`?","options":[{"t":"Because static methods automatically convert non-static methods into static methods during compilation.","c":false,"fb":"M2-StaticPromotionConfusion: method modifiers are never automatically altered by the compiler."},{"t":"Because getBalance() is executed on the stack without accessing heap instance data.","c":false,"fb":"Instance methods execute against heap-allocated object state."},{"t":"Because public static helper methods are exempt from Java's static context restrictions.","c":false,"fb":"Static context rules apply equally to all access levels."},{"t":"Because an explicit SavingsAccount instance reference is passed as a parameter to invoke getBalance().","c":true,"fb":"While static methods lack an implicit `this`, they can legally call instance methods on any explicit object reference supplied as an argument."}],"code":"public static void showBalance(SavingsAccount account) {\n    System.out.println(\"Balance: \" + account.getBalance());\n}","codeLang":"java","codeEyebrow":"JAVA METHOD"},{"cat":"02","type":"scenario","stem":"What occurs when `GradeUtils.printSummary(new Student(\"Alice\", 3.8));` is executed?","context":"A developer writes a static utility method in `GradeUtils` (where `getName()` and `getGpa()` are non-static methods in class `Student`):","options":[{"t":"A compilation error occurs because static printSummary cannot invoke instance methods getName and getGpa.","c":false,"fb":"M1-ParameterStaticImmunity: passing an explicit object reference makes invoking its instance methods completely legal."},{"t":"It compiles and outputs \"Alice: 3.8\" because the explicit Student argument provides the required instance context.","c":true,"fb":"The passed parameter supplies the object reference needed to invoke instance methods from a static method."},{"t":"A runtime NullPointerException is thrown because static methods cannot accept object references as arguments.","c":false,"fb":"Static methods accept primitive and reference arguments without issue."},{"t":"A compilation error occurs because GradeUtils does not inherit from Student.","c":false,"fb":"Parameter passing does not require an inheritance relationship."}],"code":"public class GradeUtils {\n    public static void printSummary(Student s) {\n        System.out.println(s.getName() + \": \" + s.getGpa());\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CLASS"},{"cat":"02","type":"mcq","stem":"Why does the Java compiler strictly prohibit using the keywords `this` and `super` inside static methods?","options":[{"t":"Because static methods belong to the class level where no current or parent object instance exists.","c":true,"fb":"`this` and `super` represent instance-level references; because static methods execute without an instance, neither keyword has a valid target."},{"t":"Because static methods can only be declared inside abstract classes.","c":false,"fb":"Static methods can be declared in standard concrete classes, abstract classes, and interfaces."},{"t":"Because this and super can only be used inside private utility methods.","c":false,"fb":"`this` and `super` can be used in any non-static method regardless of its visibility modifier."},{"t":"Because static methods are forbidden from returning values or accepting parameters.","c":false,"fb":"Static methods can accept parameters and return any valid type."}]},{"cat":"03","type":"scenario","context":"A developer tests variable scoping and method invocation using the program below:","stem":"What value is printed to the console when `main` finishes executing?","code":"public class PassByValueDemo {\n    public static void main(String[] args) {\n        int num = 1;\n        newNumber(2);\n        System.out.println(num);\n    }\n\n    public static void newNumber(int num) {\n        num = 3;\n    }\n}","codeLang":"java","codeEyebrow":"JAVA PASS-BY-VALUE MECHANICS","options":[{"t":"3","c":false,"fb":"M1-reference-leak: parameter reassignment inside newNumber only changes the local copy and does not modify num in main."},{"t":"2","c":false,"fb":"M2-argument-overwrite: passing 2 does not reassign the original num variable declared in main."},{"t":"1","c":true,"fb":"Java passes arguments by value, so reassigning the parameter num in newNumber leaves num in main unchanged at 1."},{"t":"0","c":false,"fb":"M3-default-fallthrough: num was explicitly initialized to 1 and is never reset to zero."}]},{"cat":"03","type":"mcq","stem":"In an account management service, a method is defined below. If a caller initializes `double currentBalance = 200.0;` and executes `deductFee(currentBalance);`, what is the value of `currentBalance` immediately following the call?","code":"public void deductFee(double balance) {\n    balance = balance - 15.0;\n}","codeLang":"java","codeEyebrow":"PASS-BY-VALUE PARAMETER REASSIGNMENT","options":[{"t":"200.0","c":true,"fb":"Java uses pass-by-value, meaning currentBalance passes a copy that shields the caller's variable from internal modifications."},{"t":"185.0","c":false,"fb":"M1-reference-leak: deducting 15 inside the method alters only the local balance copy."},{"t":"15.0","c":false,"fb":"M2-argument-overwrite: the fee literal evaluated inside deductFee does not overwrite currentBalance in the caller."},{"t":"0.0","c":false,"fb":"M3-default-fallthrough: failing to return a value does not reset the caller's variable to zero."}]},{"cat":"03","type":"fitb","stem":"Because Java executes method invocations strictly using ____, modifying or reassigning a primitive parameter inside a method has zero effect on the caller's original variable.","subtype":"term","answer":["pass-by-value","pass by value"],"caseSensitive":false,"fb":"Java copies the variable's value into the parameter stack frame, isolating the caller's original variable from internal reassignments."},{"cat":"03","type":"mcq","stem":"Given the method declaration below, what exact method signature does the Java compiler register?","code":"public double computeSalePrice(double origPrice, double discountRate)","codeLang":"java","codeEyebrow":"METHOD SIGNATURE REGISTRATION","options":[{"t":"double computeSalePrice(double, double)","c":false,"fb":"M1-return-type-included: the return type is completely excluded from the method signature."},{"t":"computeSalePrice(double origPrice, double discountRate)","c":false,"fb":"M2-param-names-included: parameter variable names are omitted from the method signature."},{"t":"computeSalePrice(double, double)","c":true,"fb":"A method signature consists strictly of the method name and the sequential parameter types."},{"t":"public double computeSalePrice(double origPrice, double rate)","c":false,"fb":"M3-modifiers-included: access modifiers, return types, and parameter names are excluded from the signature."}]},{"cat":"03","type":"multi","stem":"Which TWO components are strictly excluded from a Java method signature? Select the TWO correct statements.","options":[{"t":"The declared return type","c":true,"fb":"Return types are not part of the method signature."},{"t":"The sequential data types of the parameters","c":false,"fb":"Parameter types form a required part of the method signature."},{"t":"The access modifier preceding the method name","c":true,"fb":"Access modifiers are not part of the method signature."},{"t":"The identifier name of the method","c":false,"fb":"The method name forms an essential part of the method signature."},{"t":"The total number of parameters declared","c":false,"fb":"The count of parameter types defines the parameter list and is part of the signature."}]},{"cat":"03","type":"fitb","stem":"In Java, a method ____ uniquely identifies a method to the compiler and consists strictly of the method name and its ordered parameter types.","subtype":"term","answer":["signature","method signature"],"caseSensitive":false,"fb":"A method signature combines the method name with its sequential parameter types, excluding return types, modifiers, and parameter names."},{"cat":"03","type":"scenario","context":"A developer writes two enrollment methods in a `StudentRegistry` class:","stem":"Why does the compiler reject this class declaration?","code":"public void enroll(int studentId, String courseCode) { }\npublic void enroll(int id, String code) { }","codeLang":"java","codeEyebrow":"DUPLICATE SIGNATURE COMPILATION ERROR","options":[{"t":"The return type void cannot be shared across multiple methods.","c":false,"fb":"M1-return-type-included: void methods can be overloaded if parameter types differ."},{"t":"Parameter identifiers in overloaded methods must begin with different letters.","c":false,"fb":"Parameter variable names have no naming collision rules between separate signatures."},{"t":"Overloaded methods must specify distinct access modifiers.","c":false,"fb":"M3-modifiers-included: access modifiers do not differentiate method overloads."},{"t":"Both methods possess the duplicate method signature enroll(int, String).","c":true,"fb":"Parameter variable names are ignored; identical parameter types in identical order produce duplicate signatures."}]},{"cat":"03","type":"mcq","stem":"Examine these two method declarations inside a math calculation utility. How does the Java compiler process them?","code":"public double calc(int a, double b) {\n    return a + b;\n}\n\npublic double calc(double a, int b) {\n    return a + b;\n}","codeLang":"java","codeEyebrow":"PARAMETER TYPE SEQUENCE OVERLOADING","options":[{"t":"Compiles; different parameter type order creates distinct signatures.","c":true,"fb":"Altering the order of parameter types creates distinct signatures calc(int, double) and calc(double, int)."},{"t":"Compiler error; parameter type order is not a valid overloading axis.","c":false,"fb":"M1-order-irrelevance: sequence of parameter types is an established, valid overloading axis."},{"t":"Compiler error; overloaded methods cannot share double return types.","c":false,"fb":"M3-return-type-dependency: overloaded methods are fully allowed to share identical return types."},{"t":"Compiler error; identical parameter counts require distinct names.","c":false,"fb":"M2-name-variation-required: method overloading explicitly requires methods to share the same name."}]},{"cat":"03","type":"multi","stem":"A graphics class defines the baseline method below. Which TWO method declarations successfully overload `draw` within the same class? Select the TWO correct statements.","code":"public void draw(int x, double y)","codeLang":"java","codeEyebrow":"METHOD OVERLOAD DIFFERENTIATION","options":[{"t":"`public void draw(int x)`","c":true,"fb":"Differing parameter count creates a distinct signature draw(int)."},{"t":"`public void draw(int width, double height)`","c":false,"fb":"Changing parameter names alone leaves the signature unchanged as draw(int, double), causing a compiler error."},{"t":"`public int draw(int x, double y)`","c":false,"fb":"M3-return-type-dependency: differing return type alone does not overload a method and produces a compiler error."},{"t":"`public void draw(String shapeName)`","c":true,"fb":"Differing parameter data type creates a distinct signature draw(String)."},{"t":"`private void draw(int x, double y)`","c":false,"fb":"Changing access modifiers alone does not differentiate method signatures."}]},{"cat":"03","type":"scenario","context":"An e-commerce class defines three overloaded methods:","stem":"Which method does the compiler execute when the statement `due.computeAmountDue(120.0, 3.0);` is called?","code":"double computeAmountDue(double price) {\n    return price * 1.12;\n}\n\ndouble computeAmountDue(double price, double quantity) {\n    return (price * quantity) * 1.12;\n}\n\ndouble computeAmountDue(double price, double quantity, double discount) {\n    return ((price * quantity) - discount) * 1.12;\n}","codeLang":"java","codeEyebrow":"METHOD OVERLOAD DISPATCH","options":[{"t":"`computeAmountDue(double price)`","c":false,"fb":"Supplying two arguments cannot match a method expecting only one parameter."},{"t":"`computeAmountDue(double price, double quantity)`","c":true,"fb":"The compiler matches the two double arguments directly to the two-parameter overload."},{"t":"`computeAmountDue(double price, double quantity, double discount)`","c":false,"fb":"Supplying two arguments cannot match a method requiring three parameters."},{"t":"None; the call causes a compilation error","c":false,"fb":"The call matches the two-parameter method unambiguously, so no error occurs."}]},{"cat":"03","type":"fitb","stem":"Method ____ occurs when multiple methods in the same class share the exact same identifier but declare different parameter lists.","subtype":"term","answer":["overloading","method overloading"],"caseSensitive":false,"fb":"Method overloading enables a class to reuse a method name for different operations distinguished by parameter count, types, or sequence."},{"cat":"03","type":"scenario","context":"A graphics program declares two methods within the same class:","stem":"What is the result when compiling this code?","code":"public void draw(int shapeId) {\n    System.out.println(\"Shape: \" + shapeId);\n}\n\npublic int draw(int shapeId) {\n    return shapeId * 2;\n}","codeLang":"java","codeEyebrow":"RETURN TYPE INDEPENDENCE ERROR","options":[{"t":"Compiles; return types differentiate method overloads.","c":false,"fb":"Return types are not part of the method signature, so differing return types do not overload a method."},{"t":"Compiler error; return types do not overload methods.","c":true,"fb":"Both methods share the identical signature draw(int); differing return types alone produce a duplicate method error."},{"t":"Compiles; throws a runtime error if return is unused.","c":false,"fb":"Overload resolution happens at compile time based on parameter signatures, not at runtime."},{"t":"Compiler error; void methods cannot accept int inputs.","c":false,"fb":"Void methods can accept any valid parameter type, including int."}]},{"cat":"03","type":"mcq","stem":"Consider the two method declarations below in the same class. Why does Java disallow overloading them based solely on different return types?","code":"public void calculateTotal(double subtotal) { }\npublic double calculateTotal(double subtotal) { return subtotal; }","codeLang":"java","codeEyebrow":"CALL SITE RETURN TYPE AMBIGUITY","options":[{"t":"Methods returning double require more parameters than void methods.","c":false,"fb":"Parameter count is independent of whether a method returns a value or is void."},{"t":"The compiler cannot resolve calls when the return value is ignored.","c":true,"fb":"At an unassigned call site, return types provide no information for the compiler to choose between identical parameter signatures."},{"t":"Classes cannot declare void methods alongside value-returning methods.","c":false,"fb":"Classes regularly contain both void and value-returning methods as long as signatures differ."},{"t":"Method return types are required to match incoming parameter types.","c":false,"fb":"Return types and parameter types do not need to match."}]},{"cat":"03","type":"fitb","stem":"Declaring the methods below in the same class produces a ____ error because return types are excluded from the method signature.","code":"public void process(int x) { }\npublic String process(int x) { return \"\"; }","codeLang":"java","codeEyebrow":"DUPLICATE SIGNATURE DIAGNOSTIC","subtype":"diagnostic","hint":"The category of error emitted before execution begins","answer":["compilation","compile-time","compile time","compiler"],"caseSensitive":false,"fb":"The compiler emits a \"method is already defined\" compilation error because both methods have the identical signature process(int)."},{"cat":"03","type":"mcq","stem":"Examine the method declaration and call statement below. What are the values `37.50` and `0.15` classified as in the STI handout?","code":"public double computeSalePrice(double origPrice, double discountRate) {\n    // method body\n}\n\n// Invocation inside main:\ncomputeSalePrice(37.50, 0.15);","codeLang":"java","codeEyebrow":"PARAMETERS VS ARGUMENTS","options":[{"t":"Parameters","c":false,"fb":"Parameters are the placeholder variables declared in the method header (origPrice and discountRate)."},{"t":"Arguments","c":true,"fb":"Arguments are the actual runtime values or expressions supplied when invoking the method (37.50 and 0.15)."},{"t":"Return values","c":false,"fb":"Return values are the outputs produced and sent back by the method."},{"t":"Signatures","c":false,"fb":"A method signature consists of the method name and parameter types, not literal arguments."}]},{"cat":"03","type":"fitb","stem":"The placeholder variables declared in a method header that define the data types a method expects to receive are called formal ____.","subtype":"term","answer":["parameters","parameter"],"caseSensitive":false,"fb":"Formal parameters are the variables defined in the method declaration header."},{"cat":"03","type":"scenario","context":"A developer attempts to add a logging method to a utility class:","stem":"What is the result when compiling the `Printer` class below?","code":"public class Printer {\n    public void print(String msg) { }\n    public static void print(String msg) { }\n}","codeLang":"java","codeEyebrow":"STATIC SPECIFIER OVERLOADING PROHIBITION","options":[{"t":"It compiles because one method is static and the other is an instance method.","c":false,"fb":"The static modifier is excluded from the method signature; both declarations produce a duplicate method error."},{"t":"A compiler error occurs because the static keyword does not change the method signature.","c":true,"fb":"Modifiers like static are excluded from method signatures, so both declarations produce a duplicate signature error."},{"t":"A compiler error occurs because static and instance methods cannot share the same name.","c":false,"fb":"Static and instance methods can legally share the same name as long as their parameter lists are different."},{"t":"It compiles because the static method automatically overrides the instance method.","c":false,"fb":"Method overriding applies across inheritance hierarchies, not between static and instance methods in the same class."}]},{"cat":"03","type":"mcq","stem":"Given the method declaration below, which of the following declarations results in a duplicate method compilation error rather than a valid overload?","code":"public void display(int count) { }","codeLang":"java","codeEyebrow":"PARAMETER NAME COLLISION","options":[{"t":"`public void display(int total) { }`","c":true,"fb":"Changing parameter variable names does not alter the signature display(int), causing a compiler error."},{"t":"`public void display(double count) { }`","c":false,"fb":"Changing the parameter type to double produces a distinct, valid signature display(double)."},{"t":"`public void display(int count, int step) { }`","c":false,"fb":"Adding a second parameter changes the parameter count and creates a valid signature."},{"t":"`public void display(String label) { }`","c":false,"fb":"Changing the parameter type to String creates a distinct, valid signature display(String)."}]},{"cat":"03","type":"fitb","stem":"When Java autoboxes a primitive `int` argument passed to an overloaded method expecting an object, it automatically wraps it into an instance of the ____ class.","subtype":"wrapper","answer":["Integer"],"caseSensitive":true,"fb":"The wrapper class corresponding to primitive int is java.lang.Integer."},{"cat":"03","type":"mcq","stem":"What term defines the automatic conversion performed by the Java compiler between primitive types and their corresponding wrapper classes?","options":[{"t":"Widening conversion","c":false,"fb":"Widening refers to converting a smaller primitive type to a larger primitive type."},{"t":"Unboxing","c":false,"fb":"M2-direction-inversion: unboxing is the reverse conversion from a wrapper object to a primitive."},{"t":"Type casting","c":false,"fb":"Type casting involves explicit syntax such as (int) value."},{"t":"Autoboxing","c":true,"fb":"Autoboxing is the compiler's automatic conversion of primitives into their corresponding wrapper classes."}]},{"cat":"03","type":"scenario","context":"A graphical drawer defines two overloaded methods:","stem":"What is printed when a program executes `new Drawer().draw(10);` with the literal integer `10`?","code":"public class Drawer {\n    public void draw(Integer i) {\n        System.out.print(\"Wrapper\");\n    }\n\n    public void draw(int i) {\n        System.out.print(\"Primitive\");\n    }\n}","codeLang":"java","codeEyebrow":"AUTOBOXING RESOLUTION PRECEDENCE","options":[{"t":"Wrapper","c":false,"fb":"M1-wrapper-priority: autoboxing occurs only when an exact primitive overload is absent."},{"t":"Primitive","c":true,"fb":"Exact primitive match takes precedence over autoboxing, so draw(int) is executed."},{"t":"Compilation error: ambiguous method invocation","c":false,"fb":"M2-ambiguity-fallacy: Java defines unambiguous precedence rules favoring primitive matches."},{"t":"WrapperPrimitive","c":false,"fb":"Overload resolution selects and executes exactly one matching method header."}]},{"cat":"03","type":"mcq","stem":"Given the method declaration below, what happens when a program executes `adjustVolume(5);` using a primitive `int` literal?","code":"public void adjustVolume(Integer level) {\n    System.out.println(\"Volume set to: \" + level);\n}","codeLang":"java","codeEyebrow":"PRIMITIVE TO WRAPPER AUTOBOXING","options":[{"t":"The compiler autoboxes the primitive `5` into an `Integer` object to match the parameter.","c":true,"fb":"When no exact primitive overload exists, Java automatically autoboxes
