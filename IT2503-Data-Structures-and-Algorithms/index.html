traversal","c":false,"fb":"Inorder would begin with the leftmost node, `2`."},{"t":"Preorder traversal","c":false,"fb":"Preorder would finish the left subtree before visiting `15`."},{"t":"Postorder traversal","c":false,"fb":"Postorder would visit the root last."}]},{"cat":"03","type":"fitb","stem":"The data structure used to process a tree level by level in Breadth-First Traversal is a ____.","sub":"traversal-types-bft-dft","subtype":"term","answer":["queue"],"caseSensitive":false,"fb":"A queue preserves the level-by-level processing order used by Breadth-First Traversal."},{"cat":"03","type":"mcq","stem":"Apply L-Root-R to the tree.\n\n```text\n        10\n       /  \\\n      5    15\n     / \\   /\n    2   7 12\n```\n\nWhich sequence is produced?","sub":"inorder-traversal","options":[{"t":"2, 5, 7, 10, 12, 15","c":true,"fb":"Inorder visits the left subtree, root, then right subtree."},{"t":"10, 5, 2, 7, 15, 12","c":false,"fb":"This visits each root before its subtrees, forming preorder."},{"t":"2, 7, 5, 12, 15, 10","c":false,"fb":"This processes each root after its children, forming postorder."},{"t":"10, 5, 15, 2, 7, 12","c":false,"fb":"This visits the tree by levels."}]},{"cat":"03","type":"fitb","stem":"To retrieve the keys of a Binary Search Tree in naturally sorted order, apply ____ traversal.","sub":"inorder-traversal","subtype":"term","answer":["inorder","in-order"],"caseSensitive":false,"fb":"Inorder traversal processes the left subtree, node, and right subtree, yielding sorted BST keys."},{"cat":"03","type":"mcq","stem":"Apply Root-L-R to the tree.\n\n```text\n       8\n      / \\\n     3   10\n      \\\n       6\n```\n\nWhich sequence is produced?","sub":"preorder-postorder-traversal","options":[{"t":"8, 3, 6, 10","c":true,"fb":"Preorder visits the root before the left and right subtrees."},{"t":"3, 6, 8, 10","c":false,"fb":"This follows inorder for the displayed tree."},{"t":"6, 3, 10, 8","c":false,"fb":"This follows postorder for the displayed tree."},{"t":"8, 3, 10, 6","c":false,"fb":"This incorrectly visits `10` before finishing the left branch."}]},{"cat":"03","type":"fitb","stem":"A program must safely delete both child subtrees before deleting their parent; it should use ____ traversal.","sub":"preorder-postorder-traversal","subtype":"term","answer":["postorder","post-order"],"caseSensitive":false,"fb":"Postorder uses L-R-Root, so both children are processed before their parent."},{"cat":"03","type":"scenario","stem":"Which node causes this tree to violate the BST ordering property?","sub":"bst-ordering-property","context":"```text\n          50\n         /  \\\n       30    70\n      /  \\   /\n    20   60 55\n```","options":[{"t":"Node 60","c":true,"fb":"Although `60 > 30`, it lies in `50`’s left subtree and must be less than `50`."},{"t":"Node 20","c":false,"fb":"`20` is less than both ancestors `30` and `50`."},{"t":"Node 55","c":false,"fb":"`55` is greater than `50` and less than its parent `70`."},{"t":"Node 70","c":false,"fb":"`70` is correctly positioned to the right of `50`."}]},{"cat":"03","type":"mcq","stem":"Insert `50, 30, 70, 20, 40, 60` into an empty BST in that order. Where is key `40` inserted?","sub":"bst-ordering-property","options":[{"t":"Right child of 30","c":true,"fb":"`40 < 50` sends it left, then `40 > 30` sends it right."},{"t":"Left child of 30","c":false,"fb":"This incorrectly treats `40` as less than `30`."},{"t":"Left child of 70","c":false,"fb":"The first comparison sends `40` into `50`’s left subtree."},{"t":"Right child of 50","c":false,"fb":"Values greater than `50`, not `40`, enter that subtree."}]},{"cat":"03","type":"mcq","stem":"A BST contains keys `{20, 30, 40, 50, 60, 70, 80}`. Which attempted insertion violates its uniqueness rule?","sub":"bst-uniqueness-no-duplicates","options":[{"t":"Insert key 30","c":true,"fb":"Key `30` already exists, so inserting it creates a duplicate."},{"t":"Insert key 10","c":false,"fb":"Key `10` is new and can be placed by comparison."},{"t":"Insert key 45","c":false,"fb":"Key `45` is unique within the given set."},{"t":"Insert key 90","c":false,"fb":"Key `90` is new and can enter the rightmost branch."}]},{"cat":"03","type":"multi","stem":"A balanced BST is required to preserve its stated key and efficiency properties. Select the TWO valid requirements.","sub":"bst-uniqueness-no-duplicates","options":[{"t":"Every key remains unique","c":true,"fb":"A BST forbids duplicate keys."},{"t":"Duplicate keys enter left","c":false,"fb":"Sending duplicates left still violates strict ordering."},{"t":"Duplicate keys enter right","c":false,"fb":"Sending duplicates right still violates strict ordering."},{"t":"Operations remain O(log n)","c":true,"fb":"Balanced BST search, insertion, and deletion are O(log n)."},{"t":"Every node has two children","c":false,"fb":"BST nodes may have zero, one, or two children."}]},{"cat":"03","type":"scenario","stem":"Using `BF = height(left) − height(right)`, what is the balance factor and classification of node `X`?","sub":"avl-balance-factor","context":"```text\nNode X:\nLeft-subtree height  = 1\nRight-subtree height = 3\n```","options":[{"t":"−2, unbalanced","c":true,"fb":"`1 − 3 = −2`, which lies outside the allowed range."},{"t":"+2, unbalanced","c":false,"fb":"This reverses the left-minus-right sign convention."},{"t":"−1, right-heavy","c":false,"fb":"The height difference is two, not one."},{"t":"+1, left-heavy","c":false,"fb":"The right subtree is taller, and the difference is two."}]},{"cat":"03","type":"mcq","stem":"An AVL node has a left-subtree height of `4` and a right-subtree height of `3`. What is its balance factor?","sub":"avl-balance-factor","options":[{"t":"+1","c":true,"fb":"Left minus right gives `4 − 3 = +1`."},{"t":"−1","c":false,"fb":"This results from reversing the subtraction order."},{"t":"0","c":false,"fb":"The subtree heights are not equal."},{"t":"+2","c":false,"fb":"The heights differ by one, not two."}]},{"cat":"03","type":"mcq","stem":"An insertion occurs in the right subtree of the left child of an unbalanced node. Which correction is required?","sub":"avl-rotation-selection","options":[{"t":"Left, then right rotation","c":true,"fb":"This is an LR imbalance requiring a double rotation."},{"t":"Right, then left rotation","c":false,"fb":"That sequence corrects an RL imbalance."},{"t":"Single right rotation","c":false,"fb":"A single right rotation corrects an LL imbalance."},{"t":"Single left rotation","c":false,"fb":"A single left rotation corrects an RR imbalance."}]},{"cat":"03","type":"mcq","stem":"An RL imbalance has root `10`, right child `30`, and `30`’s left child `20`. After the required rotations, which key becomes the subtree root?","sub":"avl-rotation-selection","options":[{"t":"Key 20","c":true,"fb":"Right rotation at `30` followed by left rotation at `10` promotes `20`."},{"t":"Key 10","c":false,"fb":"The original root does not remain root after rebalancing."},{"t":"Key 30","c":false,"fb":"The right child is rotated downward during the correction."},{"t":"Neither key (rotation fails)","c":false,"fb":"The RL double rotation succeeds with 20 as the root."}]},{"cat":"03","type":"mcq","stem":"A tree requires strict key ordering and unique keys but performs no automatic height balancing. Which type matches these requirements?","sub":"tree-type-comparison","options":[{"t":"Binary Search Tree","c":true,"fb":"A BST adds strict ordering and uniqueness without guaranteed self-balancing."},{"t":"General Binary Tree","c":false,"fb":"A general binary tree has no required key ordering."},{"t":"AVL Tree","c":false,"fb":"An AVL tree also restores height balance after updates."},{"t":"Level-order Tree","c":false,"fb":"Level order is a traversal method, not a tree type."}]},{"cat":"03","type":"mcq","stem":"After every insertion or deletion, a sorted tree restores height balance to preserve consistent O(log n) operations. Which tree type is described?","sub":"tree-type-comparison","options":[{"t":"AVL Tree","c":true,"fb":"An AVL tree is a self-balancing BST."},{"t":"Binary Tree","c":false,"fb":"A general binary tree provides neither strict ordering nor self-balancing."},{"t":"Binary Search Tree","c":false,"fb":"A basic BST is ordered but does not necessarily rebalance itself."},{"t":"Expression Tree","c":false,"fb":"An expression tree represents expressions rather than this balancing rule."}]},{"cat":"04","type":"mcq","stem":"Where does a heap always keep its largest or smallest value?","sub":"heap-definition","options":[{"t":"The root node","c":true,"fb":"The heap's ordering places its extreme value at the root."},{"t":"The leftmost leaf","c":false,"fb":"Being the leftmost leaf does not guarantee the largest or smallest value."},{"t":"The rightmost leaf","c":false,"fb":"The last leaf is used during root removal, but need not contain the extreme value."},{"t":"A root child","c":false,"fb":"A root child need not contain the heap's largest or smallest value."}]},{"cat":"04","type":"scenario","stem":"Which selection rule lets the system choose job A directly?","sub":"heap-definition","context":"A job system receives B (priority 10), A (priority 40), and C (priority 25), in that order. Larger numbers indicate higher priority. A heap keeps the largest priority at its root.","options":[{"t":"Select the smallest priority","c":false,"fb":"This would choose B, whose priority is 10."},{"t":"Select the most recent arrival","c":false,"fb":"This would choose C, which arrived last."},{"t":"Select the root's extreme value","c":true,"fb":"The root exposes priority 40, allowing direct selection of A."},{"t":"Select the earliest arrival","c":false,"fb":"This would choose B, prioritizing arrival order instead of urgency."}]},{"cat":"04","type":"mcq","stem":"Which filling rule must the last level follow in a heap's complete binary tree?","sub":"shape-property-complete-tree","options":[{"t":"Right-to-left, allowing empty gaps","c":false,"fb":"The final level fills left-to-right and cannot skip positions."},{"t":"Left-to-right, without empty gaps","c":true,"fb":"The last level may be incomplete, but occupied positions must start at the left."},{"t":"Right-to-left, without empty gaps","c":false,"fb":"Avoiding gaps is necessary, but the filling direction is reversed."},{"t":"Left-to-right, allowing empty gaps","c":false,"fb":"Correct direction alone is insufficient; skipped positions violate completeness."}]},{"cat":"04","type":"mcq","stem":"A heap has root A, children B (left) and C (right), and only B's left child D; where must the next leaf go to preserve its shape?","sub":"shape-property-complete-tree","options":[{"t":"Left child of C","c":false,"fb":"This skips B's empty right-child position."},{"t":"Right child of C","c":false,"fb":"This skips earlier positions on the same level."},{"t":"Left child of D","c":false,"fb":"Starting a deeper level before filling the current level violates completeness."},{"t":"Right child of B","c":true,"fb":"This is the next vacant position when the last level fills left-to-right."}]},{"cat":"04","type":"mcq","stem":"Which comparison must hold between every max-heap parent and each child, including when their values are equal?","sub":"heap-order-property-max-min","options":[{"t":"parent ≤ child","c":false,"fb":"This is the min-heap comparison; a max-heap parent cannot be smaller."},{"t":"parent > child","c":false,"fb":"Strict inequality incorrectly excludes equal parent and child values."},{"t":"parent ≥ child","c":true,"fb":"A max-heap parent may be greater than or equal to either child."},{"t":"parent < child","c":false,"fb":"This places a larger value below a smaller parent, violating max-heap order."}]},{"cat":"04","type":"mcq","stem":"A complete tree has root 5, children 10 and 15, and node 10 has children 30 and 4; which parent-child pair violates min-heap order?","sub":"heap-order-property-max-min","options":[{"t":"5 → 10","c":false,"fb":"The parent is smaller than the child, so this pair satisfies min-heap order."},{"t":"5 → 15","c":false,"fb":"The comparison 5 ≤ 15 satisfies min-heap order."},{"t":"10 → 30","c":false,"fb":"A larger child is allowed because 10 ≤ 30."},{"t":"10 → 4","c":true,"fb":"The parent exceeds its child; min-heap order requires 10 ≤ 4, which is false."}]},{"cat":"04","type":"multi","stem":"Select the three rules that hold for every heap of the named type.","sub":"heap-order-property-max-min","options":[{"t":"Max-heap parent ≥ child","c":true,"fb":"Every max-heap parent must be at least as large as each child."},{"t":"Min-heap root = largest value","c":false,"fb":"A min-heap guarantees the smallest value at its root, not the largest."},{"t":"Max-heap root = largest value","c":true,"fb":"Applying max-heap order throughout the tree places a largest value at the root."},{"t":"Min-heap parent ≤ child","c":true,"fb":"Every min-heap parent must be no larger than either child."},{"t":"Max-heap requires every parent > child","c":false,"fb":"Equal values are permitted, so strict inequality is not required."}]},{"cat":"04","type":"mcq","stem":"Which application repeatedly extracts the maximum and places it at the array's unfilled end to produce ascending order?","sub":"max-heap-use-cases","options":[{"t":"Top-K tracking","c":false,"fb":"Top-K tracking retains selected stream values without sorting the entire input."},{"t":"Heapsort","c":true,"fb":"Successive maxima fill the array from the end, producing ascending order."},{"t":"Dijkstra's algorithm","c":false,"fb":"Dijkstra's algorithm selects the smallest tentative distance rather than sorting by maximum extraction."},{"t":"Event-driven simulation","c":false,"fb":"Event-driven simulation selects events by timestamp rather than performing this array sort."}]},{"cat":"04","type":"scenario","stem":"In what priority sequence are the requests served?","sub":"max-heap-use-cases","context":"Emergency requests arrive with priorities 10, 30, and 20, in that order. Higher numbers indicate greater urgency. A max-heap repeatedly removes its root until empty.","options":[{"t":"10, 20, 30","c":false,"fb":"This serves the lowest priority first, reversing the required urgency order."},{"t":"10, 30, 20","c":false,"fb":"This follows arrival order rather than selecting the highest remaining priority."},{"t":"20, 30, 10","c":false,"fb":"This follows reverse arrival order; priority 30 must be served before 20."},{"t":"30, 20, 10","c":true,"fb":"Each removal selects the highest remaining numeric priority."}]},{"cat":"04","type":"mcq","stem":"A full size-3 max-heap retains the three smallest stream values, {9, 7, 2}; after a new value 4 replaces its root, which set remains?","sub":"top-k-tracking","options":[{"t":"{9, 7, 4}","c":false,"fb":"This removes the smallest retained value, 2, instead of the root maximum, 9."},{"t":"{9, 4, 2}","c":false,"fb":"This removes 7, but the max-heap root contains 9."},{"t":"{7, 4, 2}","c":true,"fb":"The incoming 4 replaces 9, retaining the three smallest values seen."},{"t":"{9, 7, 2}","c":false,"fb":"Since 4 is smaller than the root, leaving the retained set unchanged is incorrect."}]},{"cat":"04","type":"scenario","stem":"Which records remain after both updates?","sub":"top-k-tracking","context":"An analytics stream retains its three smallest scores using a full size-3 max-heap. The retained records are P = 6, Q = 11, and R = 8. New records arrive in order: S = 9, then T = 5.","options":[{"t":"{P, R, T}","c":true,"fb":"S replaces Q's 11; T then replaces S's 9, leaving scores 6, 8, and 5."},{"t":"{P, S, T}","c":false,"fb":"The second update must remove S's 9, the current maximum, rather than R's 8."},{"t":"{Q, S, T}","c":false,"fb":"Q's 11 must be removed during the first update because S's 9 is smaller."},{"t":"{P, Q, R}","c":false,"fb":"Both incoming scores qualify for replacement, so the original set cannot remain unchanged."}]},{"cat":"04","type":"mcq","stem":"Simulation events arrive with timestamps 12, 4, 9, and 16; if a min-heap selects the earliest timestamp, which event runs next?","sub":"min-heap-use-cases","options":[{"t":"12","c":false,"fb":"This is the first arrival, but its timestamp is later than 4."},{"t":"16","c":false,"fb":"This is the largest timestamp, so it would be selected by a maximum-first policy."},{"t":"9","c":false,"fb":"Although earlier than 12 and 16, this event still occurs after timestamp 4."},{"t":"4","c":true,"fb":"The smallest timestamp identifies the earliest event and occupies the min-heap root."}]},{"cat":"04","type":"multi","stem":"Select the three choices for which a min-heap directly exposes the required smallest key.","sub":"min-heap-use-cases","options":[{"t":"Smallest-distance Dijkstra vertex","c":true,"fb":"A min-heap exposes the vertex with the smallest tentative distance."},{"t":"Highest-numbered emergency priority","c":false,"fb":"Selecting the largest numeric priority requires a max-heap."},{"t":"Shortest-job-first CPU scheduling","c":true,"fb":"A min-heap supports selecting the job with the smallest duration."},{"t":"Earliest-timestamp simulation event","c":true,"fb":"The smallest timestamp identifies the next event."},{"t":"Maximum-first ascending heapsort","c":false,"fb":"Repeated maximum extraction for ascending heapsort uses a max-heap."}]},{"cat":"04","type":"fitb","stem":"Java's ____ class supports a natural-order min-heap and a reverse-order max-heap.","sub":"java-priorityqueue-heaps","subtype":"term","answer":["PriorityQueue"],"caseSensitive":false,"fb":"PriorityQueue uses natural ordering by default; Collections.reverseOrder() configures reverse ordering."},{"cat":"04","type":"fitb","stem":"A default `PriorityQueue<Integer>` named `q` receives 30, 10, and 20; calling `q.____()` removes and returns 10.","sub":"java-priorityqueue-heaps","subtype":"term","answer":["poll"],"caseSensitive":false,"fb":"poll() removes and returns the head, which is the smallest integer in this natural-order queue."},{"cat":"04","type":"scenario","stem":"What value sequence is printed?","sub":"java-priorityqueue-heaps","context":"Inside `main()`, with the required Java imports present:\n```java\nPriorityQueue<Integer> q = new PriorityQueue<>(Collections.reverseOrder());\nq.add(20); q.add(10); q.add(30);\nwhile (!q.isEmpty()) {\n    System.out.print(q.poll() + \" \");\n}\n```","options":[{"t":"20 10 30","c":false,"fb":"This follows insertion order, which does not determine poll() order."},{"t":"30 20 10","c":true,"fb":"Reverse ordering makes the largest remaining value the head at every poll()."},{"t":"10 20 30","c":false,"fb":"This would be the default natural-order output; the reverse-order configuration changes it."},{"t":"30 10 20","c":false,"fb":"After removing 30, the next largest value is 20, not 10."}]},{"cat":"04","type":"fitb","stem":"The heap operation that returns the root without removing it is ____.","sub":"heap-core-operations","subtype":"term","answer":["peek","Peek (Get Root)","get root"],"caseSensitive":false,"fb":"Peek returns the root value while leaving it in the heap."},{"cat":"04","type":"mcq","stem":"A heap's root is 50; the system must discard 50 and accept 42 in a single combined heap operation. Which operation matches?","sub":"heap-core-operations","options":[{"t":"Push","c":false,"fb":"Push adds 42 but does not remove the existing root."},{"t":"Replace","c":true,"fb":"Replace removes the root and inserts the new element in one operation."},{"t":"Peek","c":false,"fb":"Peek returns 50 without removing it or inserting 42."},{"t":"Pop","c":false,"fb":"Pop removes and returns the root but does not insert the new value 42."}]},{"cat":"04","type":"scenario","stem":"Which value initially replaces 50 before heap order is restored?","sub":"heap-core-operations","context":"A max-heap has root 50, with left child 40 and right child 20. Its last leaf contains 15. Extract Root removes and returns 50.","options":[{"t":"40","c":false,"fb":"The larger child may move upward during restoration, but it is not the initial replacement."},{"t":"20","c":false,"fb":"A root child is not chosen for the initial replacement; the last leaf supplies it."},{"t":"15","c":true,"fb":"The last leaf's value replaces the root, and its former leaf position is removed."},{"t":"50","c":false,"fb":"The extracted value has left the heap and cannot serve as its own replacement."}]},{"cat":"04","type":"fitb","stem":"The process of converting an arbitrary array into a valid heap is called ____.","sub":"heapify-definition","subtype":"term","answer":["heapify"],"caseSensitive":false,"fb":"Heapify establishes the required parent–child ordering throughout the affected heap."},{"cat":"04","type":"mcq","stem":"Heapify is repairing a max-heap subtree whose child subtrees are already valid. Which arrangement satisfies heap order at the connecting parent?","sub":"heapify-definition","options":[{"t":"Parent 7; children 9, 4","c":false,"fb":"The left child exceeds the parent; checking only the right child misses this violation."},{"t":"Parent 7; children 4, 9","c":false,"fb":"The right child exceeds the parent; checking only the left child misses this violation."},{"t":"Parent 9; children 4, 7","c":true,"fb":"The parent is greater than both children, completing the affected subtree's max-heap ordering."},{"t":"Parent 4; children 7, 9","c":false,"fb":"This follows min-heap ordering; a max-heap requires the parent to be at least as large as either child."}]},{"cat":"04","type":"mcq","stem":"Which comparison begins Up-Heapify immediately after a new value is appended at the bottom?","sub":"up-heapify-procedure","options":[{"t":"New value versus its sibling","c":false,"fb":"Heap order relates parents to children; siblings are not the comparison target."},{"t":"New value versus its parent","c":true,"fb":"Compare with the immediate parent and swap if their ordering is violated."},{"t":"New value versus its child","c":false,"fb":"Comparing downward confuses Up-Heapify with Down-Heapify."},{"t":"New value versus the root","c":false,"fb":"Up-Heapify checks successive parents; it compares directly with the root only when the root is the current parent."}]},{"cat":"04","type":"scenario","stem":"What should Up-Heapify do next?","sub":"up-heapify-procedure","context":"A min-heap has root 1. A newly appended value 6 initially has parent 9. After swapping with 9, value 6 has parent 3. All other parent–child relationships remain valid.","options":[{"t":"Swap 6 with parent 3","c":false,"fb":"Since 3 is smaller than 6, their min-heap ordering already holds; swapping would break it."},{"t":"Swap 6 back with 9","c":false,"fb":"This would undo the valid swap and place 9 above the smaller value 6."},{"t":"Swap 6 with root 1","c":false,"fb":"This skips the immediate parent and would place a larger value above the smaller root."},{"t":"Stop with 6 below 3","c":true,"fb":"Up-Heapify stops when the current parent–child relationship satisfies heap order."}]},{"cat":"04","type":"fitb","stem":"Appending a max-heap value at the next open bottom position preserves shape; swapping it upward restores the ____ property.","sub":"up-heapify-procedure","subtype":"term","answer":["order","heap order","heap order property"],"caseSensitive":false,"fb":"Appending preserves the complete tree shape, while upward comparisons and swaps restore heap order."},{"cat":"04","type":"scenario","stem":"Which existing values swap with 34, in order, before it stops?","sub":"insert-trace","context":"A max-heap occupies indices 1 through 12. Its level-order array is `[35, 26, 33, 15, 24, 5, 4, 12, 1, 23, 21, 2]`. Insert 34 at index 13, the next open bottom position.","options":[{"t":"5 → 26","c":false,"fb":"After swapping with 5, the next parent is 33; 26 belongs to the other branch."},{"t":"5 → 33","c":true,"fb":"Value 34 exceeds 5 and then 33, but stops below the larger parent 35."},{"t":"33 → 35","c":false,"fb":"This skips the immediate parent 5 and incorrectly swaps with the larger root 35."},{"t":"5 → 35","c":false,"fb":"This skips parent 33; furthermore, 34 must remain below 35."}]},{"cat":"04","type":"mcq","stem":"A max-heap branch becomes `35 → 33 → 5 → 34` after appending 34. What is this root-to-leaf branch after Up-Heapify?","sub":"insert-trace","options":[{"t":"34 → 35 → 33 → 5","c":false,"fb":"Value 34 cannot pass the larger root 35."},{"t":"35 → 33 → 34 → 5","c":false,"fb":"This stops too early; 34 still exceeds its parent 33."},{"t":"35 → 34 → 33 → 5","c":true,"fb":"Value 34 swaps past 5 and 33, then stops below 35."},{"t":"35 → 34 → 5 → 33","c":false,"fb":"This leaves 5 above the larger value 33, violating max-heap order."}]},{"cat":"04","type":"mcq","stem":"After root replacement, a max-heap Down-Heapify step requires a swap. Which child should receive the moved value?","sub":"down-heapify-procedure","options":[{"t":"Choose the left child","c":false,"fb":"The left child is appropriate only when it is the larger child; position alone does not decide."},{"t":"Choose the smaller child","c":false,"fb":"Selecting the smaller child can leave the new parent below the larger child."},{"t":"Choose the right child","c":false,"fb":"The right child is appropriate only when it is the larger child; position alone does not decide."},{"t":"Choose the larger child","c":true,"fb":"Swapping with the larger child puts that child above both the moved value and its sibling."}]},{"cat":"04","type":"scenario","stem":"What is the next Down-Heapify action?","sub":"down-heapify-procedure","context":"After deleting a max-heap root, the last value 12 is moved to the root and its old bottom position is removed. Its children are 18 on the left and 30 on the right. Both child subtrees remain valid.","options":[{"t":"Swap 12 with 30","c":true,"fb":"Value 30 is the larger child, so it must move above 12 and 18."},{"t":"Swap 12 with 18","c":false,"fb":"Choosing the left child leaves 18 above the larger right child 30."},{"t":"Swap 18 with 30","c":false,"fb":"Swapping siblings leaves 12 at the root, still below both children."},{"t":"Keep 12 above both","c":false,"fb":"The root is smaller than its children, so max-heap order still requires repair."}]},{"cat":"04","type":"mcq","stem":"After root replacement in a three-node min-heap, which level-order array `[root, left, right]` does **NOT** require a Down-Heapify swap?","sub":"down-heapify-procedure","options":[{"t":"[12, 6, 8]","c":false,"fb":"Root 12 exceeds both children and must swap with the smaller child 6."},{"t":"[6, 8, 12]","c":true,"fb":"Root 6 is smaller than both children, so heap order already holds and the procedure stops."},{"t":"[8, 12, 6]","c":false,"fb":"Checking only the left child misses the smaller right child 6, which must swap upward."},{"t":"[8, 6, 12]","c":false,"fb":"Checking only the right child misses the smaller left child 6, which must swap upward."}]},{"cat":"04","type":"mcq","stem":"For the max-heap `[50, 40, 20, 30, 10, 8, 15]` in level order, which value initially replaces 50 during removeMax?","sub":"removemax-trace","options":[{"t":"15","c":true,"fb":"The last array value, corresponding to the rightmost bottom leaf, replaces the removed root."},{"t":"40","c":false,"fb":"Value 40 reaches the root during Down-Heapify, not during the initial last-element replacement."},{"t":"20","c":false,"fb":"The root's right child is not the replacement source; the last leaf supplies the replacement."},{"t":"8","c":false,"fb":"Value 8 is the second-last array value; the actual last value is 15."}]},{"cat":"04","type":"scenario","stem":"Which values swap with 15, in order, during Down-Heapify?","sub":"removemax-trace","context":"A max-heap has root 50 and children 40 and 20. Under 40 are children 30 and 10; under 20 are children 8 and 15. removeMax returns 50, moves 15 to the root, and removes its old bottom position.","options":[{"t":"40, 30","c":true,"fb":"Value 15 first swaps with the larger child 40, then with the larger child 30, reaching a leaf."},{"t":"20 only","c":false,"fb":"Value 20 is the smaller initial child; choosing it leaves the larger value 40 below the root."},{"t":"40 only","c":false,"fb":"After the first swap, 15 still has a larger child 30, so another swap is required."},{"t":"40, 10","c":false,"fb":"The second comparison must choose 30, the larger child; choosing 10 also places 10 above 15."}]},{"cat":"04","type":"multi","stem":"Select the two situations that use Up-Heapify to repair order after adding a new value at the bottom.","sub":"heapify-use-instances","options":[{"t":"Appending a priority-queue task","c":true,"fb":"The new task may violate its relationship with its parent and need to move upward."},{"t":"Removing a scheduler's top-priority task","c":false,"fb":"Root removal requires Down-Heapify after moving the last value to the root."},{"t":"Appending a streamed top-K candidate","c":true,"fb":"A candidate added at the bottom may need upward comparisons to restore order."},{"t":"Extracting roots during dataset sorting","c":false,"fb":"Repair after each root extraction uses Down-Heapify."},{"t":"Extracting roots during log merging","c":false,"fb":"Repair following root extraction moves the replacement downward rather than bubbling a new leaf upward."}]},{"cat":"04","type":"mcq","stem":"A multi-file log merge removes a heap root, moves the last entry to the root, and breaks heap order. Which repair fits?","sub":"heapify-use-instances","options":[{"t":"Apply Up-Heapify","c":false,"fb":"Up-Heapify repairs a bottom insertion by comparing upward; this replacement begins at the root."},{"t":"Restore FIFO order","c":false,"fb":"Arrival order does not repair the heap's required parent–child ordering."},{"t":"Apply Down-Heapify","c":true,"fb":"Compare the replacement root with its children and move it downward until heap order holds."},{"t":"Sort every remaining entry","c":false,"fb":"A complete sort does not describe the local root-repair procedure used to continue heap operations."}]},{"cat":"04","type":"mcq","stem":"Which criterion defines dequeue order in a priority queue when waiting elements have distinct priorities?","sub":"priority-queue-adt","options":[{"t":"Earliest arrival time","c":false,"fb":"Arrival order defines FIFO behavior, rather than priority-based dequeueing."},{"t":"Assigned priority level","c":true,"fb":"Elements are selected according to their priority levels."},{"t":"Lowest processing cost","c":false,"fb":"Processing cost can define a particular priority policy, but it is not the general criterion for every priority queue."},{"t":"Largest stored value","c":false,"fb":"The largest value leads a max-heap, but priority queues can also use min-heaps and other priority policies."}]},{"cat":"04","type":"scenario","stem":"Which job prints next?","sub":"priority-queue-adt","context":"A department printer uses department-role priorities. Jobs arrive from an undergraduate, then a graduate student, then a professor, and finally the department chair. All four jobs are waiting when the printer becomes available.","options":[{"t":"Professor's job","c":false,"fb":"Professors rank below the department chair in this printer's priority hierarchy."},{"t":"Undergraduate's job","c":false,"fb":"Arriving first does not override the undergraduate job's lowest role priority."},{"t":"Graduate student's job","c":false,"fb":"Graduate students rank below both professors and the department chair."},{"t":"Department chair's job","c":true,"fb":"The chair has the highest role priority, despite submitting the last job."}]},{"cat":"04","type":"mcq","stem":"For a non-root node at `array[k]` in a 1-based heap, which triple gives its left-child, right-child, and parent indices? Use integer division.","sub":"array-index-formulas","options":[{"t":"2k; 2k+1; (k+1)/2","c":false,"fb":"Adding 1 before division incorrectly rounds an odd node index upward when finding its parent."},{"t":"2k+1; 2k; k/2","c":false,"fb":"The child indices are reversed: the left child occupies 2k and the right child occupies 2k+1."},{"t":"2k; 2k+1; k/2","c":true,"fb":"Doubling gives the left child, adding 1 gives the right child, and integer halving gives the parent."},{"t":"2k; 2k+1; k-1","c":false,"fb":"The preceding array position is not generally the parent; the parent index is k/2."}]},{"cat":"04","type":"fitb","stem":"During Up-Heapify in a 1-based heap, a node at index 7 compares with its parent at index ____.","sub":"array-index-formulas","subtype":"term","answer":["3"],"caseSensitive":false,"fb":"Integer division gives 7/2 = 3 because the fractional part is discarded."},{"cat":"04","type":"multi","stem":"Select the three correct index assignments in a 1-based heap containing indices 1 through 7, considering the node at index 3.","sub":"array-index-formulas","options":[{"t":"Root index: 0","c":false,"fb":"This heap uses 1-based indexing, so the root occupies index 1."},{"t":"Left child: 6","c":true,"fb":"The node's left child is at 2×3 = 6."},{"t":"Parent index: 1","c":true,"fb":"Integer division gives 3/2 = 1."},{"t":"Right child: 7","c":true,"fb":"The node's right child is at 2×3+1 = 7."},{"t":"Left child: 5","c":false,"fb":"Index 5 is the right child of index 2; the left child of index 3 is at index 6."}]}]};

// Every question declares its own `cat` key in the pack. Anything
// with a missing/unknown key becomes 'other' (excluded from exam
// simulation, still reachable in normal practice mode).
BANK.forEach(q => {
  if (!q.cat || !CATEGORIES.some(c => c.key === q.cat)) q.cat = 'other';
});

// ── Sub-topic (variant) groups ──────────────────────────────────
// Questions that carry the same `sub` key inside the same category
// are VARIANTS OF ONE CONCEPT — three different ways of asking about
// the method body, say. The draw takes at most one variant per group
// until every other concept has had a turn, so a 10-question paper
// never asks the same idea twice while other ideas go untested.
// A question with no `sub` is its own group (nothing to dedupe).
BANK.forEach((q, i) => {
  q._grp = q.sub ? `${q.cat}::${String(q.sub)}` : `__solo${i}`;
});

// Distinct concepts in a set of questions — the real ceiling on a
// repeat-free paper.
function conceptCount(qs) {
  return new Set(qs.map(q => q._grp)).size;
}

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

/* ── Exam-blueprint helpers (engine code — no edits needed) ──────── */
// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Java syntax highlighting for the code box.
// Tokenises the RAW source and escapes each token as it wraps it. Never run
// a highlighter over already-escaped HTML -- it tears &quot; and &lt; apart.
// Comments and strings come first in the alternation, so a keyword sitting
// inside a string or a comment is not coloured.
const JAVA_KEYWORDS = /^(?:abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|goto|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|return|short|static|strictfp|super|switch|synchronized|this|throw|throws|transient|try|void|volatile|while|true|false|null|var|record|sealed|permits|yield)$/;
const JAVA_TOKEN_RE = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(@[A-Za-z_]\w*)|\b(\d[\w.]*)\b|\b([A-Za-z_]\w*)\b/g;

function highlightJava(src) {
  let out = '', last = 0, m;
  JAVA_TOKEN_RE.lastIndex = 0;
  while ((m = JAVA_TOKEN_RE.exec(src)) !== null) {
    if (m.index > last) out += escapeHtml(src.slice(last, m.index));
    const txt = m[0];
    let cls = null;
    if (m[1]) cls = 'tok-comment';
    else if (m[2]) cls = 'tok-string';
    else if (m[3]) cls = 'tok-annot';
    else if (m[4]) cls = 'tok-num';
    else if (m[5]) {
      if (JAVA_KEYWORDS.test(m[5])) cls = 'tok-kw';
      else if (/^[A-Z]/.test(m[5])) cls = 'tok-type';
    }
    out += cls ? `<span class="${cls}">${escapeHtml(txt)}</span>` : escapeHtml(txt);
    last = m.index + txt.length;
  }
  if (last < src.length) out += escapeHtml(src.slice(last));
  return out;
}

// Highlight only what we can actually parse. Anything not tagged java --
// pseudocode, plain text -- falls through to the plain escaped path.
function renderCodeBody(code, lang) {
  const src = String(code).replace(/^\r?\n+/, '').replace(/\r?\n\s*$/, '');
  return (lang && String(lang).toLowerCase() === 'java') ? highlightJava(src) : escapeHtml(src);
}

function formatInline(s) {
  if (!s) return '';
  const parts = String(s).split(/(`[^`]+`)/g);
  return parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  const blocks = [];
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const isDiagram = lang && ['text', 'diagram', 'ascii', 'tree'].includes(lang.toLowerCase());
    const badge = isDiagram ? 'DIAGRAM' : ((lang ? lang.toUpperCase() + ' ' : '') + 'CODE');
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    const placeholder = `___BLOCK_${blocks.length}___`;
    blocks.push(`<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(code, lang || 'java')}</code></pre></div>`);
    return placeholder;
  });

  // 2. Format inline code & escape remaining text
  const parts = text.split(/(`[^`]+`)/g);
  text = parts.map(part => {
    if (part.startsWith('`') && part.endsWith('`') && part.length >= 2) {
      return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
    }
    return escapeHtml(part);
  }).join('');

  // 3. Restore fenced code blocks
  blocks.forEach((block, i) => {
    text = text.replace(`___BLOCK_${i}___`, block);
  });

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'parsons') { return { type:q.type, stem:q.stem, lines:q.lines, origIdx:q.origIdx, cat:q.cat }; }
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

// Spread draw: take `n` questions from `pool`, one per sub-topic group
// before any group is used a second time. Groups are visited in a fresh
// random order each pass, so when the paper is longer than the number of
// distinct concepts the extra variants land on random concepts rather
// than always the same ones.
function drawSpread(pool, n) {
  const groups = new Map();
  shuffle(pool).forEach(q => {
    if (!groups.has(q._grp)) groups.set(q._grp, []);
    groups.get(q._grp).push(q);        // variants already in random order
  });
  const buckets = [...groups.values()];
  const picked = [];
  for (let round = 0; picked.length < n; round++) {
    let placed = 0;
    for (const b of shuffle(buckets)) {
      if (picked.length >= n) break;
      if (b.length > round) { picked.push(b[round]); placed++; }
    }
    if (placed === 0) break;           // every variant of every group used
  }
  return picked;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked = drawSpread(pool, finalCount);
  return shuffle(picked).map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(drawSpread(pool, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));

}

function pSeq(q){ return q.lines.filter(function(l){return !l.distractor;}).map(function(l){return String(l.code).trim();}); }
function pEnsure(i){
  state.pBank = state.pBank || {}; state.pInit = state.pInit || {};
  if(!state.pInit[i]){
    var ids = state.questions[i].lines.map(function(_,k){return k;});
    for(var a=ids.length-1;a>0;a--){var b=Math.random()*(a+1)|0;var t=ids[a];ids[a]=ids[b];ids[b]=t;}

function pScore(q, ans){
  var seq=pSeq(q), need=seq.length; ans=ans||[];
  var marks=ans.map(function(k,pos){ var l=q.lines[k]; return !!(l && !l.distractor && pos<need && String(l.code).trim()===seq[pos]); });
  var right=marks.filter(Boolean).length, filled=ans.length>0;
  var status = !filled ? 'skipped' : (right===need && ans.length===need) ? 'correct' : right===0 ? 'wrong' : 'partial';
  return { score: need?right/need:0, status:status, marks:marks, right:right, need:need };
}

function pDown(e,i){

  try{ row.setPointerCapture(e.pointerId); }catch(_){}

function pMoveClone(x,y){ pDrag.clone.style.left=(x-pDrag.offX)+'px'; pDrag.clone.style.top=(y-pDrag.offY)+'px'; }
function pMove(e){
  if(!pDrag)return;
  if(!pDrag.started){
    var dx=e.clientX-pDrag.startX, dy=e.clientY-pDrag.startY;
    if(dx*dx+dy*dy < 36) return;
    var rect=pDrag.row.getBoundingClientRect();
    var clone=pDrag.row.cloneNode(true); clone.classList.add('p-clone'); clone.classList.remove('p-dragging');
    clone.style.width=rect.width+'px'; document.body.appendChild(clone);
    pDrag.clone=clone; pDrag.offX=pDrag.startX-rect.left; pDrag.offY=pDrag.startY-rect.top;
    pDrag.row.classList.add('p-dragging'); pDrag.started=true;

  e.preventDefault(); pMoveClone(e.clientX,e.clientY); pShowInsert(e.clientX,e.clientY);
}
function pTarget(x,y){
  var a=document.getElementById('pAnswer'), b=document.getElementById('pBank');
  var ar=a.getBoundingClientRect(), br=b?b.getBoundingClientRect():null, pad=14, zoneEl;
  if(y>=ar.top-pad && y<=ar.bottom+pad) zoneEl=a;
  else if(br && y>=br.top-pad && y<=br.bottom+pad) zoneEl=b;
  else zoneEl = (!br || y<br.top) ? a : b;
  var rows=[].slice.call(zoneEl.querySelectorAll('.p-row:not(.p-dragging)')), idx=rows.length;
  for(var n=0;n<rows.length;n++){ var rr=rows[n].getBoundingClientRect(); if(y<rr.top+rr.height/2){ idx=n; break; } }

}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'parsons') { return pScore(q, selectedIdxs); }
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

// ----- focus toggle + topic chips -----
function renderTopicGrid() {
  const grid = $('topicGrid');
  grid.innerHTML = '';
  // Objectives with zero questions are hidden until you write them.
  CATEGORIES.filter(cat => (CAT_COUNTS[cat.key] || 0) > 0).forEach(cat => {
    const chip = document.createElement('button');
    chip.className = 'topic-chip';
    chip.dataset.key = cat.key;
    if (state.focusedCats.includes(cat.key)) chip.classList.add('on');
    chip.innerHTML = `
      <div class="topic-chip-check"></div>
      <div class="topic-chip-label">${cat.label}</div>
      <div class="topic-chip-count">${CAT_COUNTS[cat.key]}</div>
    `;
    chip.addEventListener('click', () => {
      const i = state.focusedCats.indexOf(cat.key);
      if (i >= 0) state.focusedCats.splice(i, 1);
      else state.focusedCats.push(cat.key);
      chip.classList.toggle('on');
      updateSetupSummary();
    });
    grid.appendChild(chip);
  });
}

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    $('poolConcepts').textContent = '';
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note — when the pool holds variant groups, say how many
  // distinct concepts that is: past that number the paper has to
  // reuse a concept.
  $('poolAvailable').textContent = available;
  const focusPool = (state.focusEnabled && state.focusedCats.length > 0)
    ? BANK.filter(q => state.focusedCats.includes(q.cat)) : BANK;
  const concepts = conceptCount(focusPool);
  $('poolConcepts').textContent = concepts < available
    ? ` · ${concepts} distinct concepts` : '';

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}
updateSetupSummary();

// ----- start the quiz -----
$('startBtn').addEventListener('click', () => {
  state.questions = buildActiveQuiz();
  state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
  state.checked   = state.questions.map(() => false);

  $('view-quiz').classList.add('fade-in');

  }

  renderQuiz();

});

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (q.type === 'parsons') { tagLabel = 'Arrange the code'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in">';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${formatContent(q.context)}</div></div>`;
  }
  html += `<div class="qstem">${formatContent(q.stem)}</div>`;
  if (q.code) {
    const isDiagram = q.codeLang && ['text', 'diagram', 'ascii', 'tree'].includes(q.codeLang.toLowerCase());
    const badge = q.codeEyebrow || (isDiagram ? 'DIAGRAM' : (q.codeLang ? q.codeLang.toUpperCase() + ' CODE' : 'CODE SNIPPET'));
    const preClass = isDiagram ? 'code-box-pre code-box-diagram' : 'code-box-pre';
    html += `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="${preClass}"><code>${renderCodeBody(q.code, q.codeLang)}</code></pre></div>`;
  }

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${formatInline(q.hint)}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${formatInline(q.fb)}</div>`;
    }
    html += `</div>`;
  } else if (q.type === 'parsons') {
    html += parsonsHTML(q, state.current, isChecked, r);
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          if (isMulti) {
            cls += ' is-missed';
            marker = '\u25CB';
            tagsHtml = '<span class="opt-tag miss">Missed choice</span>';
            showFeedback = true;
          } else {
            cls += ' is-correct';
            marker = '\u2713';
            tagsHtml = '<span class="opt-tag ans">Correct answer</span>';
            showFeedback = true;
          }
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${formatInline(opt.t)}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${formatInline(opt.fb)}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (q.type === 'parsons') {
    if (!isChecked) wireParsons(state.current);
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('Abandon this quiz and return to setup? Your progress will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.querySelectorAll('a[href="../index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const quiz = $('view-quiz');
    if (quiz && !quiz.classList.contains('hidden')) {
      if (!confirm('Leave this quiz and return to the Reviewer Hub? Your current progress will be lost.')) {
        e.preventDefault();
      } else {
        stopTimer();
      }
    }
  });
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 24px; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    <div class="btn-row">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="../index.html" class="btn ghost">← Back to Index</a>
        <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
        <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      </div>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    state.questions = buildActiveQuiz();
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []); state.pBank = {}; state.pInit = {};
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
</body>
</html>
