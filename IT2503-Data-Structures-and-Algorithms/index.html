idth=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A small circle","c":false,"fb":"A small circle is the On-page Connector, used to connect parts continued on the same page."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> An oval or rounded rectangle","c":false,"fb":"An oval/rounded rectangle is the Terminal symbol, marking the start or end of a process."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"12,3 21,12 12,21 3,12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A diamond","c":false,"fb":"A diamond is the Decision symbol, marking branching points in a process."}]},{"cat":"01","type":"mcq","stem":"Which flowchart symbol shape connects two parts of the same flowchart that are continued on the same page (e.g., to avoid crossing lines)?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A small circle","c":true,"fb":"correct — the On-page Connector is drawn as a small circle to connect flow parts on the same page."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"4,4 20,4 20,15 12,22 4,15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A pentagon with its point facing downward","c":false,"fb":"A downward-pointing pentagon is the Off-page Connector, used for flow continuing to separate pages."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M3,4 h18 v12 h-18 z M7,4 v12 M17,4 v12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with vertical double side borders","c":false,"fb":"A rectangle with vertical side borders denotes Predefined Processing (a subroutine)."},{"t":"<svg width=\"20\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M19,4 L5,4 L5,16 L19,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A three-sided open rectangle","c":false,"fb":"An open three-sided rectangle denotes a Comment (annotation)."}]},{"cat":"01","type":"mcq","stem":"A process reads its input directly from a printed form and sends its output to a printed physical report. Which flowchart symbol shape specifically represents this?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M4,4 L20,4 L20,16 C16,14 14,19 12,17 C10,15 8,19 4,16 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with a wavy bottom edge","c":true,"fb":"correct — Document Input/Output is drawn with a wavy curved bottom to represent paper documents."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"7,4 21,4 17,16 3,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A parallelogram","c":false,"fb":"A parallelogram shows general I/O, but the wavy-bottom rectangle specifically denotes document I/O."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M3,4 h18 v12 h-18 z M7,4 v12 M17,4 v12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with vertical double side borders","c":false,"fb":"That shape represents Predefined Processing."},{"t":"<svg width=\"20\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M19,4 L5,4 L5,16 L19,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A three-sided open rectangle","c":false,"fb":"That shape represents Comments/annotations."}]},{"cat":"01","type":"mcq","stem":"A process simply reads a value a user types on a keyboard, with no document involved. Which flowchart symbol shape represents this?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M4,4 L20,4 L20,16 C16,14 14,19 12,17 C10,15 8,19 4,16 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with a wavy bottom edge","c":false,"fb":"The wavy bottom specifically denotes document I/O, not keyboard input."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> An oval or rounded rectangle","c":false,"fb":"An oval represents the Terminal (start/end) symbol."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"7,4 21,4 17,16 3,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A parallelogram","c":true,"fb":"correct — a parallelogram represents any general input/output operation."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A simple rectangle","c":false,"fb":"A simple rectangle represents Computer Processing."}]},{"cat":"01","type":"mcq","stem":"At a specific stage in a flowchart, the program must evaluate whether an account balance is greater than zero and branch to different paths depending on the outcome. Which symbol shape must represent this point?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"12,3 21,12 12,21 3,12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A diamond","c":true,"fb":"correct — a diamond indicates any point where a decision must be made to determine further action."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A simple rectangle","c":false,"fb":"A rectangle shows processing performed by a computer system, not conditional branching."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A small circle","c":false,"fb":"A circle is a connector, not a decision point."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> An oval or rounded rectangle","c":false,"fb":"An oval represents the start or end of a process."}]},{"cat":"01","type":"mcq","stem":"A flowchart references an existing complex calculation routine that is documented and specified elsewhere, rather than expanding its detailed steps here. Which symbol shape designates this?","options":[{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M3,4 h18 v12 h-18 z M7,4 v12 M17,4 v12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with vertical double side borders","c":true,"fb":"correct — Predefined Processing indicates any process not specially defined in the flowchart."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A simple closed single-border rectangle","c":false,"fb":"A simple rectangle denotes standard computer processing defined inline."},{"t":"<svg width=\"20\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M19,4 L5,4 L5,16 L19,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A three-sided open-ended rectangle","c":false,"fb":"A comment is used for explanatory notes, not subroutines."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"7,4 21,4 17,16 3,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A four-sided slanted parallelogram","c":false,"fb":"A parallelogram denotes input/output operations."}]},{"cat":"01","type":"multi","stem":"Select the TWO correct statements about flowchart symbols.","options":[{"t":"Predefined Processing is used for writing explanatory statements to clarify something","c":false,"fb":"That describes Comment; Predefined Processing indicates a routine not specially defined here."},{"t":"Terminal shows the start and end of a set of computer-related processes","c":true,"fb":"correct — the Terminal symbol marks process beginnings and completions."},{"t":"Computer Processing shows any processing performed by a computer system","c":true,"fb":"correct — Computer Processing represents system calculations and actions."},{"t":"Flow line indicates any point where a decision must be made","c":false,"fb":"That describes Decision; a Flow line simply connects symbols in sequence."},{"t":"Comment is used to connect two symbols in a flowchart","c":false,"fb":"That describes a Flow line; Comment is used for clarifying explanatory statements."}]},{"cat":"02","type":"mcq","stem":"Which characteristic defines a linear data structure?","options":[{"t":"Elements are organized sequentially such that traversal typically proceeds in a single direction from start to end.","c":true,"fb":"correctly defines linear data structure sequential order and one-direction traversal"},{"t":"Elements are organized non-sequentially such that traversal can proceed in any arbitrary order.","c":false,"fb":"elements in a linear data structure are positioned in a strict linear order"},{"t":"Elements are positioned without order, requiring traversal to alternate between both ends simultaneously.","c":false,"fb":"traversal typically follows a single direction from start to end"},{"t":"Elements are arranged in unordered collections where traversal cannot follow a defined start or end.","c":false,"fb":"linear data structures organize elements sequentially from start to end"}]},{"cat":"02","type":"mcq","stem":"Why can an array access any element in constant time, regardless of the array's total size?","options":[{"t":"The array sequentially traverses internal pointers from index 0 until reaching the target slot.","c":false,"fb":"(M1) conflates direct array addressing with linked list sequential pointer chasing"},{"t":"The array runs a hash function on the index to locate the correct physical slot.","c":false,"fb":"(M3) assumes associative lookup rather than direct contiguous index arithmetic"},{"t":"Memory addresses are computed directly using the base address and the element index.","c":true,"fb":"direct formula calculation (base + index * size) provides constant-time O(1) access"},{"t":"Memory slots are dynamically scattered across the heap and linked by address tags.","c":false,"fb":"(M2) assumes non-contiguous memory allocation rather than contiguous memory slots"}]},{"cat":"02","type":"fitb","stem":"An integer array begins at base memory address 1000. If each integer occupies 4 bytes, the address of index 3 is calculated directly as 1000 + (3 * 4) = 1012 in ____ time.","subtype":"term","answer":["constant","O(1)","constant time"],"caseSensitive":false,"fb":"Array indexing accesses memory in constant time ($O(1)$) because the address is computed directly from the base address and index without traversing preceding elements."},{"cat":"02","type":"mcq","stem":"Which statement is NOT true regarding how arrays store and access data?","options":[{"t":"Elements are arranged contiguously in memory in a sequential order.","c":false,"fb":"this is a true characteristic of arrays"},{"t":"Accessing element `array[4]` requires reading indices 0 through 3 first.","c":true,"fb":"(M1) correctly identifies the false statement; arrays do not traverse preceding elements because direct indexing provides immediate constant-time access"},{"t":"Elements within the array are identified and retrieved using an array index or key.","c":false,"fb":"this is a true characteristic of array element retrieval"},{"t":"Arrays are well-suited for implementing lookup tables due to predictable element indexing.","c":false,"fb":"this is a true characteristic and standard application of arrays"}]},{"cat":"02","type":"scenario","stem":"How does the system retrieve this element, and what is the resulting time complexity?","context":"An embedded monitoring system stores 50,000 temperature readings taken at 1-second intervals in a single contiguous array `int[] readings`. The system needs to retrieve the reading recorded at second 42,100.","options":[{"t":"It traverses 42,100 node pointers starting from index 0 in linear time.","c":false,"fb":"(M1) assumes array access requires sequential traversal like a linked list"},{"t":"It searches non-contiguous memory blocks across the heap in logarithmic time.","c":false,"fb":"(M2) assumes scattered non-contiguous memory blocks rather than contiguous array slots"},{"t":"It performs an associative key lookup across dynamic buckets in linear time.","c":false,"fb":"(M3) assumes hash table bucket retrieval instead of direct array index calculation"},{"t":"It computes the physical memory address directly from the index 42100 in constant time.","c":true,"fb":"contiguous storage allows direct index calculation in O(1) time regardless of index size"}]},{"cat":"02","type":"multi","stem":"Select the TWO correct statements comparing static arrays and dynamic arrays.","options":[{"t":"Static arrays have a fixed size set at creation and are allocated on the stack.","c":true,"fb":"correctly identifies static array fixed sizing and stack allocation"},{"t":"Dynamic arrays are allocated on the stack because stack memory expands without limit.","c":false,"fb":"(M1) stack memory is limited in size and cannot accommodate dynamic runtime expansion"},{"t":"Dynamic arrays can resize at runtime and have their memory allocated on the heap.","c":true,"fb":"correctly identifies dynamic array flexibility and heap allocation"},{"t":"Static arrays are allocated on the heap to permit runtime resizing whenever necessary.","c":false,"fb":"(M4) static arrays are allocated on the stack, not the heap, and cannot resize"},{"t":"Dynamic arrays require linear time to access elements by index after creation.","c":false,"fb":"(M3) dynamic arrays still offer constant-time read access by index once created"}]},{"cat":"02","type":"scenario","stem":"Which data structure choices and memory allocations match these requirements?","context":"A developer is designing two data stores: Store A holds the names of the 7 days of the week, which never changes. Store B collects visitor usernames throughout the day as an unpredictable number of guests register.","options":[{"t":"Store A uses a dynamic array on the stack; Store B uses a static array on the heap.","c":false,"fb":"(M1) dynamic arrays reside on the heap, and static arrays cannot expand for unpredictable signups"},{"t":"Store A uses a static array on the heap; Store B uses a dynamic array on the stack.","c":false,"fb":"(M4) inverts memory locations; stack handles fixed static arrays while heap handles dynamic structures"},{"t":"Store A uses a static array on the stack; Store B uses a dynamic array on the heap.","c":true,"fb":"static arrays on the stack suit fixed known sizes; dynamic arrays on the heap accommodate unpredictable growth"},{"t":"Store A uses a dynamic array on the heap; Store B uses a static array on the stack.","c":false,"fb":"(M2) using a fixed static stack array for unpredictable registrations risks overflow or truncation"}]},{"cat":"02","type":"mcq","stem":"Which statement is NOT true regarding the runtime characteristics of dynamic arrays?","options":[{"t":"Dynamic arrays can grow or shrink during program execution.","c":false,"fb":"this is a true defining feature of dynamic arrays"},{"t":"Elements in dynamic arrays cannot be accessed in constant time after creation.","c":true,"fb":"(M3) correctly identifies the false statement; elements in dynamic arrays can still be accessed in constant time"},{"t":"Dynamic arrays incur dynamic memory management overhead on the heap.","c":false,"fb":"this is a true performance characteristic of dynamic arrays"},{"t":"Dynamic arrays are preferred when the collection size is unknown in advance.","c":false,"fb":"this is a true appropriate-use case for dynamic arrays"}]},{"cat":"02","type":"fitb","stem":"While a static array has its memory located on the stack, a dynamic array has its memory allocated on the ____ to support flexible resizing during runtime.","subtype":"term","answer":["heap","heap memory"],"caseSensitive":false,"fb":"Dynamic arrays like Java's `ArrayList` allocate memory on the heap, allowing collections to expand or shrink at runtime."},{"cat":"02","type":"mcq","stem":"Given the Java statement below, what is the default value of `scores[0]`, and how is the array's total capacity retrieved?","options":[{"t":"Default value is 0; capacity is retrieved using `scores.length()`.","c":false,"fb":"(M1) `.length` is a property for native arrays, not a method with parentheses"},{"t":"Default value is -1; capacity is retrieved using `scores.size()`.","c":false,"fb":"(M1) `.size()` is used for collection classes like `ArrayList`, and primitive ints default to 0"},{"t":"Default value is null; capacity is retrieved using `scores.length`.","c":false,"fb":"(M3) primitive integer array elements default to 0, not null"},{"t":"Default value is 0; capacity is retrieved using `scores.length`.","c":true,"fb":"integer array slots default to 0 and array capacity is read via the `.length` property"}],"code":"int[] scores = new int[4];","codeLang":"java","codeEyebrow":"JAVA DECLARATION"},{"cat":"02","type":"fitb","stem":"In Java, if an array named `inventory` is created to hold 5 items, the first element is updated using `inventory[0] = 20;`, and its total length is read using the property `inventory.____`.","subtype":"term","answer":["length"],"caseSensitive":true,"fb":"Native Java arrays expose their fixed capacity through the `length` property without parentheses."},{"cat":"02","type":"mcq","stem":"Which Java package and method are used to declare and append elements to a dynamic array?","options":[{"t":"Imported from `java.lang.ArrayList` and appended using `.insert()`.","c":false,"fb":"`ArrayList` is in `java.util`, not `java.lang`, and the append method is `.add()`"},{"t":"Imported from `java.util.ArrayList` and appended using `.add()`.","c":true,"fb":"`java.util.ArrayList` provides dynamic arrays and `.add()` appends elements"},{"t":"Imported from `java.util.Arrays` and appended using `.append()`.","c":false,"fb":"`Arrays` contains static array helper utilities; dynamic arrays use `ArrayList` and `.add()`"},{"t":"Imported from `java.io.ArrayList` and appended using `.push()`.","c":false,"fb":"`ArrayList` is part of `java.util`, not `java.io`, and uses `.add()`"}]},{"cat":"02","type":"mcq","stem":"How does a linked list connect its elements, according to its fundamental structure?","options":[{"t":"Elements are kept in a single fixed block where each item is identified by an index.","c":false,"fb":"(M1) describes array organization rather than a linked list"},{"t":"Elements are organized into a chain of nodes where each node contains data and a reference to the next node.","c":true,"fb":"correctly describes a linked list as a chain of nodes connected by next references"},{"t":"Elements are stored as consecutive entries that link to each other using numerical slot positions.","c":false,"fb":"(M2) linked list nodes connect via explicit object references rather than slot numbers"},{"t":"Elements are stored in contiguous memory locations that automatically point to adjacent memory cells.","c":false,"fb":"(M1) contiguous indexed storage is a property of arrays, not linked list node chains"}]},{"cat":"02","type":"scenario","stem":"Which data structure does this architecture represent?","context":"A program models a sequence of colors where each item is packaged as a node containing a color name and a reference to the following node. The first node (\"Yellow\") points to the second node (\"Orange\"), which points to the third node (\"Red\"), whose next reference is null.","options":[{"t":"A static array, because elements are placed into fixed slots in a row.","c":false,"fb":"(M1) static arrays store elements in fixed indexed slots rather than chained nodes with next references"},{"t":"A linked list, because elements are organized as a chain of nodes linked by pointers.","c":true,"fb":"linked lists consist of chains of nodes where each node contains data and a reference to the next node"},{"t":"A two-dimensional array, because data is ordered across multiple matrix dimensions.","c":false,"fb":"the sequence is a one-dimensional chain of referenced nodes, not a multi-dimensional matrix"},{"t":"A dynamic array, because elements must be indexed sequentially on the stack.","c":false,"fb":"(M2) dynamic arrays are resizable collections accessed by index, not node chains with explicit next links"}]},{"cat":"02","type":"mcq","stem":"How do the node structures of a singly linked list and a doubly linked list differ?","options":[{"t":"A singly linked list node contains data, next, and prev fields, while a doubly linked list node omits prev.","c":false,"fb":"(M1) inverts the structure; doubly linked lists require the prev pointer"},{"t":"A singly linked list node has two fields (data and next), while a doubly linked list node has three fields (data, next, and prev).","c":true,"fb":"singly linked list nodes have data and next; doubly linked list nodes add a prev reference"},{"t":"A singly linked list node has two data fields, while a doubly linked list node has one data field and one pointer.","c":false,"fb":"(M1) both node types carry element data, but doubly linked lists contain two pointer references"},{"t":"A singly linked list node points to both head and tail, while a doubly linked list node points only to next.","c":false,"fb":"(M4) individual nodes do not point to head and tail; doubly linked lists hold next and prev pointers"}]},{"cat":"02","type":"multi","stem":"Select the TWO correct statements regarding traversal in singly and doubly linked lists.","options":[{"t":"A doubly linked list can traverse forward using `.next` and backward using `.prev`.","c":true,"fb":"doubly linked lists support bidirectional traversal using next and prev"},{"t":"A singly linked list can traverse backward from the last node by dereferencing `.next`.","c":false,"fb":"(M4) singly linked list nodes have no backward reference, making backward traversal impossible"},{"t":"A doubly linked list requires its tail node's `.next` to point directly back to the head node.","c":false,"fb":"(M3) a standard doubly linked list terminates with next = null at the tail, not a circular loop"},{"t":"In both singly and doubly linked lists, the last node's `.next` reference typically points to null.","c":true,"fb":"the end of both standard list types is indicated by next pointing to null"},{"t":"A singly linked list enables reverse traversal by inspecting the `head` pointer.","c":false,"fb":"(M4) the head pointer only references the first node and cannot enable reverse traversal"}]},{"cat":"02","type":"scenario","stem":"Which linked list structure should be chosen, and why?","context":"A media player application needs a playlist structure where users can skip to the next track or return to the previous track instantly without re-traversing from the beginning.","options":[{"t":"Singly linked list, because its single `next` reference supports stepping both forward and backward.","c":false,"fb":"(M4) singly linked lists can only traverse forward along the next reference"},{"t":"Singly linked list, because setting `next == null` automatically reverses the traversal direction.","c":false,"fb":"(M4) reaching null marks the end of the list and does not enable backward navigation"},{"t":"Doubly linked list, because each node contains a `prev` reference allowing direct backward navigation.","c":true,"fb":"the prev pointer enables immediate step-back to the preceding node"},{"t":"Doubly linked list, because it eliminates the need for node data fields when navigating.","c":false,"fb":"(M1) doubly linked lists still store data alongside two pointers"}]},{"cat":"02","type":"fitb","stem":"In the doubly linked list backward traversal loop below starting at `tail`, what pointer property must replace the blank so traversal moves toward the start of the list?","subtype":"term","answer":["prev"],"caseSensitive":true,"fb":"In a doubly linked list, backward traversal from `tail` is achieved by updating the current pointer using `cur.prev`.","code":"Node cur = tail;\nwhile (cur != null) {\n    System.out.print(cur.data + \" <-> \");\n    cur = cur.____;\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"mcq","stem":"In the Java linked list traversal loop below, what is the purpose of the statement `current = current.next;`?","options":[{"t":"It resets the current pointer back to the head of the list.","c":false,"fb":"(M2) resetting to head would loop the first element rather than advancing forward"},{"t":"It advances the reference pointer to the next consecutive node in the sequence.","c":true,"fb":"assigning current.next updates current so the loop visits each node until reaching null"},{"t":"It calculates the direct integer memory offset of the following slot.","c":false,"fb":"(M3) linked lists use reference reassignment, not contiguous memory offset math"},{"t":"It deletes the current node from the linked list after printing its value.","c":false,"fb":"(M1) reading and advancing pointers does not unlink or delete nodes"}],"code":"Node current = head;\nwhile (current != null) {\n    System.out.println(current.data);\n    current = current.next;\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"mcq","stem":"A singly linked list contains nodes in the order: `10 -> 20 -> 30 -> null`. If a traversal begins at `head` (`10`) and advances using `current = current.next`, what causes the traversal loop to stop?","options":[{"t":"`current` becomes `null` after advancing past node `30`.","c":true,"fb":"when the loop advances past the last node, current becomes null, terminating the while condition"},{"t":"`current.data` equals 30, which triggers an automatic break condition.","c":false,"fb":"(M2) traversal does not check data values; it checks whether the node reference itself is null"},{"t":"`current.next` wraps around and points back to node `10`.","c":false,"fb":"(M2) singly linked lists terminate with next = null, not an automatic circular loop back to head"},{"t":"The memory manager throws an out-of-bounds index exception.","c":false,"fb":"(M3) linked lists do not have bounds checks; they stop when reference evaluates to null"}]},{"cat":"02","type":"fitb","stem":"In the Java linked list traversal loop below, what terminal reference must replace the blank so the loop visits every node and halts cleanly?","subtype":"term","answer":["null"],"caseSensitive":true,"fb":"Traversal terminates when `current` reaches `null`, signifying the end of the linked list.","code":"Node current = head;\nwhile (current != ____) {\n    System.out.println(current.data);\n    current = current.next;\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"mcq","stem":"When implementing a while loop to traverse a singly linked list, which practice will NOT produce correct traversal behavior?","options":[{"t":"Checking `current != null` as the loop condition to visit each node.","c":false,"fb":"this is standard and correct practice for traversing all nodes"},{"t":"Omitting `current = current.next;` from the body of the while loop.","c":true,"fb":"(M1) correctly identifies the incorrect practice; without advancing the pointer, the loop repeatedly inspects the same node forever"},{"t":"Initializing a temporary pointer `Node current = head` before starting the loop.","c":false,"fb":"this is standard and correct practice to avoid modifying the head pointer"},{"t":"Printing or processing `current.data` inside the loop body.","c":false,"fb":"this is standard and correct practice during traversal"}]},{"cat":"02","type":"mcq","stem":"In Java, when inserting a node at the end of a singly linked list via the code below, what does the final assignment `temp.next = newNode;` accomplish?","options":[{"t":"It shifts all subsequent nodes forward by one position in physical memory.","c":false,"fb":"(M1) linked list insertion rewires pointer references rather than shifting elements in physical memory"},{"t":"It replaces the head pointer of the linked list with the new node.","c":false,"fb":"(M4) temp has traversed to the end of the list, so it appends the node rather than replacing head"},{"t":"It links the last node of the list to the newly created node.","c":true,"fb":"after traversing to the node where temp.next is null, assigning temp.next links newNode to the end"},{"t":"It clears all preceding node references to prevent duplicate entries.","c":false,"fb":"(M2) it preserves the preceding chain and attaches newNode at the end"}],"code":"Node newNode = new Node(30);\nNode temp = head;\nwhile (temp.next != null) {\n    temp = temp.next;\n}\ntemp.next = newNode;","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"scenario","stem":"Why does inserting a node into a linked list avoid this latency once the target position is found?","context":"An event monitoring system inserts thousands of records per second into the middle of a collection of 100,000 items. When using a static array, each insertion causes unacceptable system latency.","options":[{"t":"It only requires updating surrounding pointer references without shifting subsequent elements in memory.","c":true,"fb":"linked lists splice nodes by updating pointer links, avoiding the O(n) element shifting of arrays"},{"t":"It reallocates the entire collection into contiguous stack memory slots.","c":false,"fb":"(M1) reallocating and shifting is the source of array latency, which linked lists avoid"},{"t":"It assigns the new element directly using a computed contiguous index offset.","c":false,"fb":"(M3) linked list nodes are not accessed or inserted via contiguous index offsets"},{"t":"It automatically overwrites the oldest existing node without allocating new space.","c":false,"fb":"(M4) insertion allocates a new node and links it, rather than overwriting existing nodes"}]},{"cat":"02","type":"multi","stem":"Select the TWO correct statements describing how a new node `n` is inserted at the end of a non-empty doubly linked list with a known `tail`.","options":[{"t":"Every preceding node must shift its memory address to make room for `n`.","c":false,"fb":"(M1) nodes remain at their existing memory locations; only references are updated"},{"t":"The current `tail.next` reference is set to point to `n`.","c":true,"fb":"tail.next must point to the new node to extend the forward chain"},{"t":"The new node's `n.prev` reference is set to point to `tail`.","c":true,"fb":"n.prev must reference the previous tail to establish the backward chain"},{"t":"The `tail` pointer must remain pointing to the original last node permanently.","c":false,"fb":"(M2) tail must be updated to point to the new node n"},{"t":"The `head` pointer must be set to `null` while links are rewired.","c":false,"fb":"(M2) modifying tail insertion does not clear or nullify the head pointer"}]},{"cat":"02","type":"fitb","stem":"In a doubly linked list insertion where `head == null`, what variable must replace the blank in the code below so both `head` and `tail` reference the first node?","subtype":"term","answer":["n"],"caseSensitive":true,"fb":"When inserting into an empty list, both `head` and `tail` must reference the newly created node `n`.","code":"Node n = new Node(value);\nif (head == null) {\n    head = tail = ____;\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"mcq","stem":"What are the primary steps required to delete an internal node from a singly linked list?","options":[{"t":"Find the node, shift all subsequent node data into preceding memory slots, and decrement list capacity.","c":false,"fb":"(M1) element shifting is an array operation; linked lists rewire pointers instead"},{"t":"Set the target node's data value to null without altering any `.next` pointer references.","c":false,"fb":"(M2) changing data does not unlink or remove the node from the sequence"},{"t":"Reset the list's `head` reference to null and re-insert remaining nodes one by one.","c":false,"fb":"(M3) resetting head would destroy the entire list rather than removing a single target node"},{"t":"Find the node, adjust the predecessor's `.next` pointer to bypass it, and safely discard memory references.","c":true,"fb":"deleting requires finding the node, bypassing it via the preceding node's pointer, and releasing references"}]},{"cat":"02","type":"multi","stem":"A singly linked list has three nodes: `A -> B -> C -> null`. Select the TWO statements that correctly describe removing node `B`.","options":[{"t":"The `.next` pointer of node `A` must be updated to point directly to node `C`.","c":true,"fb":"updating A.next to C bypasses node B, removing it from the sequence"},{"t":"Node `C` must be copied into node `B`'s physical memory address slot.","c":false,"fb":"(M1) nodes are not physically moved or copied to delete an element in a linked list"},{"t":"The reference to node `B` must be safely discarded so memory can be reclaimed.","c":true,"fb":"discarding references ensures unused objects are eligible for garbage collection"},{"t":"Setting the local variable `B = null` without updating node `A` removes node `B`.","c":false,"fb":"(M2) clearing a local reference does not alter node A's next pointer, leaving B connected in the list"},{"t":"Node `A` must have its `.next` pointer set to null to indicate end of list.","c":false,"fb":"(M3) setting A.next to null truncates the rest of the list, dropping node C as well"}]},{"cat":"02","type":"scenario","stem":"What happens when the scheduler next traverses the list?","context":"A task scheduler maintains a singly linked list of pending tasks. A user cancels a task located in the middle of the list. The developer assigns `cancelledTask = null;` to clear the reference variable, but fails to update the preceding node's `.next` pointer.","options":[{"t":"The cancelled task is still visited because the preceding node's `.next` pointer still references it.","c":true,"fb":"clearing a local reference variable does not unlink the node from the list chain"},{"t":"The cancelled task is automatically skipped because its reference variable was set to null.","c":false,"fb":"(M2) traversal follows node pointers in the chain rather than local reference variables"},{"t":"The entire list past the cancelled task is deleted because subsequent nodes are severed.","c":false,"fb":"(M3) the cancelled node's next pointer remains intact, keeping subsequent nodes connected"},{"t":"Subsequent tasks are automatically shifted forward in memory to fill the vacated spot.","c":false,"fb":"(M1) linked lists rewire pointers rather than shifting elements in memory"}]},{"cat":"02","type":"mcq","stem":"Which action is NOT part of deleting a node from a singly linked list in Java?","options":[{"t":"Locating the target node to be removed from the chain.","c":false,"fb":"finding the target node is an essential first step in deletion"},{"t":"Adjusting the preceding node's `.next` pointer to link to the target node's successor.","c":false,"fb":"adjusting pointers is required to bypass the deleted node"},{"t":"Shifting all subsequent nodes one index to the left in contiguous memory.","c":true,"fb":"(M1) correctly identifies the non-existent step; linked lists do not store elements contiguously or shift elements on deletion"},{"t":"Ensuring memory references to the removed node are safely discarded.","c":false,"fb":"ensuring memory references are safely discarded is one of the essential steps in linked list deletion"}]},{"cat":"02","type":"mcq","stem":"How does a search operation determine whether a target value exists in a singly linked list?","options":[{"t":"It jumps directly to the midpoint node by dividing the head memory address by two.","c":false,"fb":"(M1) linked list nodes are non-contiguous and do not support random midpoint jumps"},{"t":"It hashes the target value to compute the exact node reference in constant time.","c":false,"fb":"(M1) linked lists do not use hash tables or direct key calculation"},{"t":"It inspects only the head and tail nodes because intermediate nodes cannot hold searchable data.","c":false,"fb":"(M2) every node holds data and must be examined sequentially during search"},{"t":"It begins at `head`, compares each node's data to the target, and stops when matched or `current == null`.","c":true,"fb":"search traverses sequentially node-by-node from head until matching or reaching the null terminal"}]},{"cat":"02","type":"fitb","stem":"When searching a linked list for a value that does not exist in the list, the sequential comparison process continues until the pointer reaches ____.","subtype":"term","answer":["null","current == null"],"caseSensitive":false,"fb":"In a linked list search, if the target value is not present, traversal stops when `current` reaches `null` (the end of the list)."},{"cat":"02","type":"mcq","stem":"Why does sorting a linked list differ fundamentally from sorting an array?","options":[{"t":"Linked lists lack random access, requiring sorting to rearrange node links or values manually rather than swapping by index.","c":true,"fb":"without index-based random access, linked lists must adjust node links or values rather than using index swaps"},{"t":"Linked lists cannot be sorted because their sequential structure prevents elements from being rearranged.","c":false,"fb":"(M2) linked lists can be sorted by rearranging pointer links, updating values, or using Collections.sort()"},{"t":"Linked lists sort by calculating base memory addresses to swap elements directly by index offset.","c":false,"fb":"(M1) linked lists do not support contiguous base-address calculations or index-based random access"},{"t":"Linked lists can be sorted in a single step by updating only the head pointer to the smallest value.","c":false,"fb":"(M3) sorting requires ordering the entire chain of nodes rather than just reassigning the head pointer"}]},{"cat":"02","type":"mcq","stem":"Given the Java statements below, what is the output displayed on the console?","options":[{"t":"`[40, 10, 30]`","c":false,"fb":"(M2) this is the unsorted original order; Collections.sort() reorders the elements"},{"t":"`[10, 30, 40]`","c":true,"fb":"Collections.sort() arranges the LinkedList elements in ascending numerical order"},{"t":"`[40, 30, 10]`","c":false,"fb":"(M1) default sorting arranges in ascending order, not descending order"},{"t":"A compilation error occurs because `LinkedList` cannot be sorted by `Collections`.","c":false,"fb":"(M2) Java's Collections.sort() natively supports sorting LinkedList instances"}],"code":"LinkedList<Integer> list = new LinkedList<>();\nlist.add(40);\nlist.add(10);\nlist.add(30);\nCollections.sort(list);\nSystem.out.println(list);","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"fitb","stem":"To use Java's built-in doubly linked list collection class, a developer must import the class from the package `java.util.____`.","subtype":"term","answer":["LinkedList"],"caseSensitive":true,"fb":"Java's standard linked list implementation is provided by `java.util.LinkedList`."},{"cat":"02","type":"mcq","stem":"In the Java node definition below, why is the `next` field declared with the type `Node` instead of `int`?","options":[{"t":"It stores the integer array index position of the next element in memory.","c":false,"fb":"(M1) linked list nodes use object references, not integer array indices"},{"t":"It prevents the node from storing any numerical values.","c":false,"fb":"(M1) data already stores the integer value; next is dedicated to holding the reference"},{"t":"It must store a reference to another `Node` object rather than a primitive integer value.","c":true,"fb":"next holds the memory reference of the successor Node in the chain"},{"t":"It automatically connects the new node to the head of the list upon construction.","c":false,"fb":"(M2) constructor initializes next to null; linking to head requires explicit assignment"}],"code":"class Node {\n    int data;\n    Node next;\n\n    public Node(int data) {\n        this.data = data;\n        this.next = null;\n    }\n}","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"mcq","stem":"In Java, given the following statements, what is printed to the console?","options":[{"t":"`Data: 100` followed by `Next: null`","c":true,"fb":"n.data receives 100, while n.next is initialized to null because it is not yet linked to another node"},{"t":"`Data: 100` followed by `Next: 100`","c":false,"fb":"(M2) next stores a node reference (which defaults to null), not a duplicate of the data field"},{"t":"`Data: 100` followed by `Next: 0`","c":false,"fb":"(M1) next is an object reference, so its unlinked value prints as null, not primitive 0"},{"t":"`Data: 0` followed by `Next: null`","c":false,"fb":"(M2) data is initialized with the passed constructor argument 100"}],"code":"Node n = new Node(100);\nSystem.out.println(\"Data: \" + n.data);\nSystem.out.println(\"Next: \" + n.next);","codeLang":"java","codeEyebrow":"JAVA CODE"},{"cat":"02","type":"scenario","stem":"Which collection structure and memory allocation strategy best satisfy these requirements?","context":"A software engineer is designing a transaction logging module for a financial application. The number of transactions fluctuates heavily throughout business hours, starting near zero and scaling unpredictably into millions of entries.","options":[{"t":"A dynamic array (`ArrayList`), because its heap memory allocation allows capacity to expand at runtime.","c":true,"fb":"dynamic arrays on the heap resize flexibly to accommodate unpredictable and growing workloads"},{"t":"A static array, because its stack memory allocation allows dynamic resizing with minimal latency.","c":false,"fb":"(M1) static arrays reside on the stack and cannot resize once allocated"},{"t":"A dynamic array (`ArrayList`), because its stack memory allocation eliminates heap management overhead.","c":false,"fb":"(M1) dynamic arrays like `ArrayList` reside on the heap, not on the stack"},{"t":"A static array, because its fixed capacity prevents the memory manager from throwing an overflow error.","c":false,"fb":"(M2) a fixed static array cannot accommodate unpredictable volume and will overflow when capacity is exceeded"}]},{"cat":"02","type":"scenario","stem":"Which linked list architecture is most suitable for this navigation requirement, and why?","context":"A developer is building an Undo/Redo history manager for a code editor. The application must move back and forth sequentially between saved editing states as the user presses Undo or Redo.","options":[{"t":"A singly linked list, because each node contains a `prev` reference allowing direct backward movement.","c":false,"fb":"(M1) singly linked list nodes only contain a forward `next` reference, not a `prev` reference"},{"t":"A singly linked list, because its nodes naturally support bidirectional traversal without extra pointers.","c":false,"fb":"(M4) singly linked lists can only be traversed forward in one direction"},{"t":"A doubly linked list, because its nodes contain both `next` and `prev` pointers for bidirectional traversal.","c":true,"fb":"doubly linked list nodes store both next and prev references, allowing seamless forward and backward stepping"},{"t":"A doubly linked list, because omitting the `prev` pointer reduces memory overhead during reverse steps.","c":false,"fb":"(M2) doubly linked lists require the `prev` pointer specifically to enable reverse traversal"}]},{"cat":"02","type":"scenario","stem":"How does this deletion affect the surrounding nodes and memory allocation in Java?","context":"A service desk application tracks waiting clients in a singly linked list. When a customer in the middle of the line cancels their appointment, the application deletes their node from the active chain.","options":[{"t":"All downstream nodes must shift forward by one memory address to fill the vacated slot.","c":false,"fb":"(M1) linked lists are stored non-contiguously, so nodes are never shifted in physical memory"},{ // How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatInline(s) {
  if (!s) return '';
  return String(s).replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);
}

function formatContent(s) {
  if (!s) return '';
  let text = String(s);

  // 1. Fenced code blocks ```lang\ncode\n``` or ```code```
  const codeBlockRegex = /```(?:([a-zA-Z0-9_-]+)\n)?([\s\S]*?)```/g;
  text = text.replace(codeBlockRegex, (match, lang, code) => {
    const badge = (lang ? lang.toUpperCase() + ' ' : '') + 'CODE';
    return `<div class="code-box"><div class="code-box-eyebrow">${escapeHtml(badge)}</div><pre class="code-box-pre"><code>${escapeHtml(code.trim())}</code></pre></div>`;
  });

  // 2. Inline code backticks `code`
  text = text.replace(/`([^`]+)`/g, (match, p1) => `<code>${escapeHtml(p1)}</code>`);

  return text;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'fitb') {
    const res = { type: q.type, stem: q.stem, answer: q.answer,
                  caseSensitive: q.caseSensitive || false, hint: q.hint || '',
                  fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
    if (q.code) {
      res.code = q.code;
      if (q.codeLang) res.codeLang = q.codeLang;
      if (q.codeEyebrow) res.codeEyebrow = q.codeEyebrow;
    }
    return res;
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  if (q.code) {
    base.code = q.code;
    if (q.codeLang) base.codeLang = q.codeLang;
    if (q.codeEyebrow) base.codeEyebrow = q.codeEyebrow;
  }
  return base;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked  = shuffle(pool).slice(0, finalCount);
  return picked.map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(shuffle(pool).slice(0, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}
