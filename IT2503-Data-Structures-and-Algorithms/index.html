terface designs."}]},{"cat":"01","type":"mcq","stem":"A structure is made of individual units, where each unit stores a value plus a reference pointing to the next unit in sequence, and the units are not required to sit next to each other in memory. What is each unit called?","options":[{"t":"An index","c":false,"fb":"An index is an integer offset in an array."},{"t":"A node","c":true,"fb":"correct — a linked list is a chain of nodes, each holding data and a link."},{"t":"A slot","c":false,"fb":"A slot is a position in a hash table."},{"t":"A key","c":false,"fb":"A key is a search value used in hashing."}]},{"cat":"01","type":"fitb","stem":"In a linked list, each individual component containing data and a reference to the next element is called a ____.","subtype":"term","answer":["node"],"caseSensitive":false,"fb":"A linked list consists of chains of nodes containing data and a reference to the next node."},{"cat":"01","type":"mcq","stem":"A node class is defined with two fields: `data` and `next`. What does the `next` field hold?","options":[{"t":"A copy of the data stored in every other node","c":false,"fb":"`next` holds an address link, not duplicate data."},{"t":"The array index of the following element","c":false,"fb":"Nodes use memory references, not array integer indices."},{"t":"A reference or pointer to the following node in the chain","c":true,"fb":"correct — `next` stores a reference to the subsequent node."},{"t":"A reference to the previous node in the chain","c":false,"fb":"In a basic singly-linked node, the link points to the next node."}]},{"cat":"01","type":"mcq","stem":"Which of the following is NOT true about a linked list?","options":[{"t":"Its elements need not be stored contiguously in memory","c":false,"fb":"True — linked list nodes can reside anywhere in memory."},{"t":"Elements can be inserted or removed without reallocating the entire structure","c":false,"fb":"True — this is the principal advantage over an array."},{"t":"A linked list is a chain of nodes","c":false,"fb":"True — this is the foundational definition."},{"t":"Each node contains only data, with no reference to another node","c":true,"fb":"correct — every node must contain both data and a link to the next node."}]},{"cat":"01","type":"scenario","stem":"Which data structure directly provides this capability?","context":"A developer is designing a data storage component where elements must frequently be inserted and removed without requiring reallocation or reorganization of the entire structure.","options":[{"t":"A linked list","c":true,"fb":"correct — linked lists allow insertions/removals without reallocating or shifting contiguous memory."},{"t":"An array","c":false,"fb":"Arrays have fixed capacity and require shifting elements or reallocating memory to insert."},{"t":"A hash table","c":false,"fb":"Hash tables map keys to slots via address calculation rather than dynamic sequence insertion."},{"t":"A stream","c":false,"fb":"A stream represents an infinite sequence, not an insert/delete container."}]},{"cat":"01","type":"mcq","stem":"What is the principal benefit of a linked list over a conventional array?","options":[{"t":"Elements occupy less memory because pointer fields carry no overhead","c":false,"fb":"Pointer fields add memory overhead to each node."},{"t":"Elements can be inserted or removed without reorganizing the entire structure","c":true,"fb":"correct — nodes are linked by references, avoiding mass element shifting."},{"t":"Elements provide direct random indexing faster than contiguous memory blocks","c":false,"fb":"Arrays provide O(1) random access; linked lists require O(N) traversal."},{"t":"Elements are guaranteed to be stored sequentially in cache lines","c":false,"fb":"Nodes are scattered throughout memory, not sequentially arranged."}]},{"cat":"01","type":"multi","stem":"Regarding list implementations and structures, which TWO statements are correct? Select the TWO correct statements.","options":[{"t":"In a list, the same value cannot appear more than once","c":false,"fb":"Lists explicitly permit duplicate values."},{"t":"One family of lists exposes an infrastructure for the first element and the rest of elements","c":true,"fb":"correct — this is one of the two primary list access families."},{"t":"Linked list nodes require data to be stored strictly in contiguous disk blocks","c":false,"fb":"Linked list nodes do not require contiguous memory or disk storage."},{"t":"Each linked list node is composed of data and a reference to the next node in the sequence","c":true,"fb":"correct — nodes contain payload data plus a next-node reference."},{"t":"Conventional arrays allow insertions without memory reallocation or shifting","c":false,"fb":"Arrays require shifting elements or reallocating when inserting."}]},{"cat":"01","type":"mcq","stem":"A text editor's undo feature reverses actions in the exact opposite order they were performed — the most recently typed action is undone first. Which ordering principle does this match?","options":[{"t":"First-In-First-Out (FIFO)","c":false,"fb":"FIFO removes the oldest item first, which would undo the user's first action."},{"t":"Random access order","c":false,"fb":"Undo follows a strict sequential reverse order."},{"t":"Sorted numerical order","c":false,"fb":"No sorting is involved."},{"t":"Last-In-First-Out (LIFO)","c":true,"fb":"correct — the most recently added action is reversed first (LIFO, a stack)."}]},{"cat":"01","type":"mcq","stem":"Given the operations `push(A); push(B); push(C); pop();` on an empty stack, which element does `pop()` remove?","options":[{"t":"A","c":false,"fb":"A was pushed first, so in a LIFO stack it would be popped last."},{"t":"C","c":true,"fb":"correct — C was pushed last, so it is popped first."},{"t":"B","c":false,"fb":"B was pushed second, so it remains beneath C."},{"t":"All three elements at once","c":false,"fb":"pop() extracts exactly one element, the current top."}]},{"cat":"01","type":"mcq","stem":"In a stack, at which point(s) can push and pop operations occur?","options":[{"t":"At either end, depending on the operation","c":false,"fb":"Both operations are restricted to the same single endpoint."},{"t":"Only at opposite ends from each other","c":false,"fb":"Push and pop occur at the same end, not opposite ends."},{"t":"Only at one end, called the top","c":true,"fb":"correct — stack operations occur strictly at the top."},{"t":"Anywhere in the middle of the structure","c":false,"fb":"Stacks forbid mid-structure insertions or deletions."}]},{"cat":"01","type":"mcq","stem":"A program needs to inspect what the top value of a stack currently is, without modifying the stack's contents in any way. Which operation should it use?","options":[{"t":"Pop","c":false,"fb":"Pop removes the top element, modifying the stack."},{"t":"Push","c":false,"fb":"Push adds a new element onto the stack."},{"t":"Enqueue","c":false,"fb":"Enqueue is a queue insertion operation."},{"t":"Peek","c":true,"fb":"correct — peek (or top) inspects the top value without removing it."}]},{"cat":"01","type":"scenario","stem":"After this preview action completes, what does the browser's stack contain?","context":"A browser's page-visit stack currently holds three entries — Home, Search Results, Product Page — with Product Page on top. The user clicks \"Preview last page\" (which internally calls peek()) to see the current top entry's title without navigating anywhere.","options":[{"t":"Home, Search Results, Product Page — unchanged","c":true,"fb":"correct — peek only inspects the top value; it leaves the stack contents unchanged."},{"t":"Home, Search Results — with Product Page removed","c":false,"fb":"That describes pop; peek never removes entries."},{"t":"Home, Search Results, Product Page, Product Page — with a duplicate added","c":false,"fb":"Peek does not insert items onto the stack."},{"t":"An empty stack","c":false,"fb":"Peek does not clear the stack."}]},{"cat":"01","type":"mcq","stem":"A stack has no remaining space to accept a new entity that a program is trying to push onto it. What state is the stack in?","options":[{"t":"Underflow","c":false,"fb":"Underflow refers to attempting to pop from an empty structure."},{"t":"Overflow","c":true,"fb":"correct — a full stack unable to accept a push is in an overflow state."},{"t":"Deadlock","c":false,"fb":"Deadlock describes processes mutually waiting for resources."},{"t":"Null state","c":false,"fb":"Null state describes an empty structure, not a full one."}]},{"cat":"01","type":"scenario","stem":"What condition or state occurs as a result of this action?","context":"An execution environment allocates a fixed-size stack of 5 elements. The stack currently holds 5 elements, and an instruction attempts to push a 6th element.","options":[{"t":"Dequeue state","c":false,"fb":"Dequeue is a queue removal operation, not an error state."},{"t":"Underflow state","c":false,"fb":"Underflow occurs when popping from an empty stack."},{"t":"Overflow state","c":true,"fb":"correct — attempting to push to a full stack triggers an overflow state."},{"t":"Terminal state","c":false,"fb":"Terminal denotes start/end in flowcharts."}]},{"cat":"01","type":"fitb","stem":"When a stack does not contain enough space to accept an entity to be pushed, it is said to be in an ____ state.","subtype":"term","answer":["overflow"],"caseSensitive":false,"fb":"A stack without sufficient space to accept a push enters an overflow state."},{"cat":"01","type":"multi","stem":"Which TWO statements regarding stack operations and states are correct? Select the TWO correct statements.","options":[{"t":"A peek operation returns the value of the top element and deletes it immediately","c":false,"fb":"Peek inspects the top value without deleting it."},{"t":"Elements are removed from a stack in the reverse order of their addition","c":true,"fb":"correct — LIFO means newest in is first out."},{"t":"When a stack does not contain enough space to accept a push, it is in overflow","c":true,"fb":"correct — a full stack entering a push is in overflow."},{"t":"The push and pop operations occur at opposite ends of the structure","c":false,"fb":"Push and pop both occur strictly at the top."},{"t":"Stacks are classified as non-linear hierarchical data structures","c":false,"fb":"Stacks are linear collections."}]},{"cat":"01","type":"mcq","stem":"A shared office printer processes print jobs in the exact order they were submitted — the job submitted first is printed first, no matter how many jobs come after it. Which ordering principle does this match?","options":[{"t":"Last-In-First-Out (LIFO)","c":false,"fb":"LIFO would process the most recent job first."},{"t":"Random order","c":false,"fb":"Jobs are processed in strict submission sequence."},{"t":"First-In-First-Out (FIFO)","c":true,"fb":"correct — the first item in is the first item served (FIFO, a queue)."},{"t":"Priority order by job size","c":false,"fb":"No size-based prioritization is used."}]},{"cat":"01","type":"mcq","stem":"Given the operations `enqueue(A); enqueue(B); enqueue(C); dequeue();` on an empty queue, which element does `dequeue()` remove?","options":[{"t":"C","c":false,"fb":"Removing C first would be LIFO behavior, not FIFO."},{"t":"B","c":false,"fb":"B was added second, so it is served after A."},{"t":"All three elements at once","c":false,"fb":"dequeue() removes exactly one item from the front."},{"t":"A","c":true,"fb":"correct — A was enqueued first, so it is dequeued first."}]},{"cat":"01","type":"mcq","stem":"In a queue, at which two positions do the principal operations occur?","options":[{"t":"Entities are added at the front and removed from the rear","c":false,"fb":"This reverses the actual queue positions."},{"t":"Entities are added at the rear and removed from the front","c":true,"fb":"correct — additions occur at the rear; removals occur from the front."},{"t":"Entities are both added and removed at the same end","c":false,"fb":"Single-ended operations define a stack, not a queue."},{"t":"Entities can be added or removed from any position","c":false,"fb":"Queue operations are restricted strictly to the terminal endpoints."}]},{"cat":"01","type":"scenario","stem":"Which data structure best models this first-come, first-served processing requirement?","context":"A network print server receives multiple print requests from different workstations. It must service and complete each print request strictly in the order it was submitted.","options":[{"t":"Stack","c":false,"fb":"Stacks process items in reverse order of arrival (LIFO)."},{"t":"Queue","c":true,"fb":"correct — queues maintain FIFO ordering where first added is first served."},{"t":"Hash table","c":false,"fb":"Hash tables do not preserve chronological arrival order."},{"t":"Tree","c":false,"fb":"Trees model branching hierarchies rather than sequential queues."}]},{"cat":"01","type":"fitb","stem":"In an abstract queue, the operation used to remove the first element from the collection is called ____.","subtype":"term","answer":["dequeue"],"caseSensitive":false,"fb":"Dequeue is the operation that removes the front element from a queue."},{"cat":"01","type":"multi","stem":"Which TWO characteristics properly describe a Queue? Select the TWO correct statements.","options":[{"t":"It functions as a Last-In-First-Out data structure","c":false,"fb":"A queue is First-In-First-Out (FIFO)."},{"t":"The front operation accesses and serves the first element in the queue","c":true,"fb":"correct — front examines the earliest element."},{"t":"It is categorized as an example of a linear data structure","c":true,"fb":"correct — the handout explicitly classifies queues as linear data structures."},{"t":"Insertion into the queue is performed using the pop operation","c":false,"fb":"Pop is a stack operation; enqueue adds to a queue."},{"t":"Elements are retrieved in the reverse order of their arrival","c":false,"fb":"Stacks reverse arrival order; queues preserve it."}]},{"cat":"01","type":"mcq","stem":"A stack and a queue each receive the same three insertions in the order X, then Y, then Z. If one element is now removed from each structure, which pairing correctly matches structure to the element it removes?","options":[{"t":"Stack removes X; queue removes X","c":false,"fb":"Only the queue removes X first; the stack removes Z."},{"t":"Stack removes Z; queue removes X","c":true,"fb":"correct — stack removes the most recent (Z); queue removes the earliest (X)."},{"t":"Stack removes X; queue removes Z","c":false,"fb":"This swaps the two structures' orderings."},{"t":"Stack removes Z; queue removes Z","c":false,"fb":"Only the stack removes Z first; the queue removes X."}]},{"cat":"01","type":"scenario","stem":"Which ordering principle should each feature use?","context":"A software team is designing two features: an \"Undo\" button that must reverse the user's most recent edit first, and a support-ticket system that must resolve the oldest submitted ticket before any newer ones.","options":[{"t":"Undo: LIFO; Support ticket: FIFO","c":true,"fb":"correct — Undo reverses the newest action first (LIFO); tickets serve the oldest request first (FIFO)."},{"t":"Undo: FIFO; Support ticket: LIFO","c":false,"fb":"This swaps the requirements of both systems."},{"t":"Undo: LIFO; Support ticket: LIFO","c":false,"fb":"A support ticket system serving oldest requests first cannot use LIFO."},{"t":"Undo: FIFO; Support ticket: FIFO","c":false,"fb":"An undo feature reversing the most recent action first cannot use FIFO."}]},{"cat":"01","type":"mcq","stem":"Which pair of terms correctly identifies the removal order of a stack compared to that of a queue?","options":[{"t":"Stack uses FIFO; Queue uses LIFO","c":false,"fb":"This swaps the two principles."},{"t":"Stack uses LIFO; Queue uses FIFO","c":true,"fb":"correct — stacks are Last-In-First-Out; queues are First-In-First-Out."},{"t":"Both structures operate strictly under LIFO","c":false,"fb":"Queues operate under FIFO."},{"t":"Both structures operate strictly under FIFO","c":false,"fb":"Stacks operate under LIFO."}]},{"cat":"01","type":"mcq","stem":"A database needs to insert, delete, and search for customer records using each customer's ID as the lookup value, storing records in an array-like structure whose position is computed directly from that ID. What is this storage/retrieval method called?","options":[{"t":"A linked list","c":false,"fb":"Linked lists locate items through sequential pointer traversal."},{"t":"A stack","c":false,"fb":"Stacks restrict access strictly to the top element."},{"t":"A tree","c":false,"fb":"Trees locate records through hierarchical traversal."},{"t":"Hashing","c":true,"fb":"correct — hashing maps search keys to array slots via a mathematical hash function."}]},{"cat":"01","type":"mcq","stem":"In a hash system, what value does the hash function actually perform its computation on to identify a record's position?","options":[{"t":"The full contents of the record's data fields","c":false,"fb":"The hash function computes on the search key, not the full payload."},{"t":"The search key K of the record","c":true,"fb":"correct — the hash function computes the slot from search key K."},{"t":"The current size of the hash table only","c":false,"fb":"Table size alone cannot distinguish individual records."},{"t":"The record's insertion timestamp","c":false,"fb":"Hashing is based on search key values, not timestamps."}]},{"cat":"01","type":"mcq","stem":"Which of the following is NOT true of hashing?","options":[{"t":"Records are stored in an array called a hash table","c":false,"fb":"True — hash systems use an underlying array of slots."},{"t":"The hash function computes a position based on a search key","c":false,"fb":"True — this is the defining mechanism of hashing."},{"t":"Records in a hash table are ordered by value","c":true,"fb":"correct — records are placed by address calculation, NOT sorted by value."},{"t":"Hashing supports inserting, deleting, and searching for records","c":false,"fb":"True — these are the core operations of hashing."}]},{"cat":"01","type":"mcq","stem":"In a hash table containing M total slots, what is the valid range of slot index numbers?","options":[{"t":"1 to M","c":false,"fb":"Slot indexing starts at 0, not 1."},{"t":"0 to M - 1","c":true,"fb":"correct — with M slots starting at index 0, the last slot is M - 1."},{"t":"0 to M","c":false,"fb":"Numbering 0 to M would produce M + 1 slots."},{"t":"1 to M - 1","c":false,"fb":"This range would only provide M - 1 slots."}]},{"cat":"01","type":"fitb","stem":"In a hash table with M slots, the slots are numbered from 0 to M - ____.","subtype":"term","answer":["1"],"caseSensitive":false,"fb":"The number of slots is M, and since numbering starts at 0, the last slot is M - 1."},{"cat":"01","type":"multi","stem":"Which TWO statements accurately describe hashing concepts? Select the TWO correct statements.","options":[{"t":"Records in a hash table are stored in ascending order of their key values","c":false,"fb":"Placement is dictated by address calculation, not sorted order."},{"t":"A position within a hash table is referred to as a slot","c":true,"fb":"correct — hash table positions are explicitly termed slots."},{"t":"A hash system stores records in an underlying array called a hash table","c":true,"fb":"correct — the underlying storage array is called a hash table."},{"t":"The Abstract Hashing ADT includes operations for Sort and Traversal","c":false,"fb":"Abstract Hashing operations are Add and Delete."},{"t":"The search key K directly matches the slot index without any computation","c":false,"fb":"A hash function performs a computation on K to determine the slot."}]},{"cat":"01","type":"mcq","stem":"A folder structure is organized so that every folder descends from one top-level folder, and no folder can ever be nested inside one of its own subfolders (no folder points back to an ancestor). What kind of data structure best describes this hierarchy?","options":[{"t":"A queue","c":false,"fb":"A queue is a linear sequence, not a branching hierarchy."},{"t":"A hash table","c":false,"fb":"Hash tables map keys to slots via hash functions."},{"t":"A tree that allows a subfolder to loop back to an ancestor folder","c":false,"fb":"Real trees strictly prohibit references to ancestors (cycles)."},{"t":"A tree","c":true,"fb":"correct — trees are hierarchical structures with a root node and no cycles."}]},{"cat":"01","type":"mcq","stem":"A tree data structure currently contains zero nodes. What is this specific tree called?","options":[{"t":"The root tree","c":false,"fb":"A root node exists only in a non-empty tree."},{"t":"The null tree","c":true,"fb":"correct — a tree with no nodes is specifically called the null (or empty) tree."},{"t":"A leaf tree","c":false,"fb":"Leaf refers to a childless node within a non-empty tree."},{"t":"An invalid tree","c":false,"fb":"A zero-node tree is a completely valid, defined boundary case."}]},{"cat":"01","type":"mcq","stem":"Which operation below is one of the Abstract Tree operations listed for this ADT?","options":[{"t":"Push","c":false,"fb":"Push is an operation of an abstract stack."},{"t":"Enqueue","c":false,"fb":"Enqueue is an operation of an abstract queue."},{"t":"Traversal","c":true,"fb":"correct — Abstract Tree operations are Insertion, Deletion, Traversal, and Sort."},{"t":"Dequeue","c":false,"fb":"Dequeue is an operation of an abstract queue."}]},{"cat":"01","type":"mcq","stem":"Which structural constraint is required for a graph of nodes and edges to be considered a tree?","options":[{"t":"Every node must contain exactly two child references","c":false,"fb":"General trees may have arbitrary numbers of children."},{"t":"The structure must contain no cycles","c":true,"fb":"correct — a tree is explicitly defined as nodes and edges without any cycles."},{"t":"Every node must point back to the root node","c":false,"fb":"Tree constraints mandate that no reference points to the root."},{"t":"All nodes must be stored in contiguous memory blocks","c":false,"fb":"Trees link nodes via references, not contiguous memory."}]},{"cat":"01","type":"multi","stem":"In the recursive definition of a tree data structure, which TWO constraints must hold? Select the TWO correct statements.","options":[{"t":"At least one reference must point directly to the root","c":false,"fb":"Tree constraints require that no reference points to the root."},{"t":"No child reference is duplicated","c":true,"fb":"correct — the definition explicitly mandates that no reference is duplicated."},{"t":"Nodes must be arranged in contiguous physical memory","c":false,"fb":"Trees connect nodes dynamically via reference links."},{"t":"None of the references point to the root node","c":true,"fb":"correct — constraints dictate that no reference points back to the root."},{"t":"A tree with no nodes is considered an illegal syntax error","c":false,"fb":"A tree with no nodes is a valid null or empty tree."}]},{"cat":"01","type":"mcq","stem":"What ability of a computer do data structures fundamentally rely on?","options":[{"t":"The ability to execute multiple application threads concurrently","c":false,"fb":"Concurrency is unrelated to the foundational definition of data structures."},{"t":"The capability to transmit packets across network interfaces","c":false,"fb":"Network communication is unrelated to data structure foundations."},{"t":"The capability to render high-resolution raster graphics","c":false,"fb":"Graphic display is unrelated to basic data structure definitions."},{"t":"The ability to fetch and store data anywhere in memory via pointers","c":true,"fb":"correct — data structures rely on memory access specified by pointers."}]},{"cat":"01","type":"mcq","stem":"In the context of computer data structures, what is a pointer?","options":[{"t":"A simple numeric variable restricted strictly to whole numbers","c":false,"fb":"A pointer specifically represents an address, not just any integer."},{"t":"A bit string representing a memory address that can be stored and manipulated","c":true,"fb":"correct — this is the exact formal definition of a pointer."},{"t":"A descriptive label used exclusively for indexing array offsets","c":false,"fb":"Pointers are general address references, not array labels."},{"t":"A specialized sorting algorithm used to arrange memory blocks","c":false,"fb":"Pointers are memory address primitives, not algorithms."}]},{"cat":"01","type":"fitb","stem":"In computer systems, a bit string representing a memory address that can be stored in memory and manipulated by a program is called a ____.","subtype":"term","answer":["pointer"],"caseSensitive":false,"fb":"A pointer is a bit string representing a memory address used to fetch and store data in memory."},{"cat":"01","type":"mcq","stem":"An abstract data type (ADT) is defined by which of the following?","options":[{"t":"The specific programming language syntax chosen for implementation","c":false,"fb":"An ADT is defined independently of any programming language."},{"t":"The physical quantity of bytes allocated in system cache memory","c":false,"fb":"Memory footprints are low-level implementation details."},{"t":"The operations performed on it and mathematical constraints on their effects","c":true,"fb":"correct — an ADT is defined purely by operations and constraints."},{"t":"The chronological sequence in which its records were originally created","c":false,"fb":"Creation timestamps do not define an ADT."}]},{"cat":"01","type":"mcq","stem":"Which of the following best describes an algorithm?","options":[{"t":"Any sequence of steps, regardless of whether it ever terminates","c":false,"fb":"An algorithm must terminate after a finite number of steps."},{"t":"A finite sequence of simple, definite steps for accomplishing a computational task","c":true,"fb":"correct — an algorithm is finite, definite, and terminates."},{"t":"A single machine instruction that generates no computational output","c":false,"fb":"An algorithm always takes input and produces output."},{"t":"A diagrammatic visual chart used exclusively for documentation","c":false,"fb":"A diagram is merely an expression method (flowchart), not the algorithm itself."}]},{"cat":"01","type":"mcq","stem":"A cooking-instructions program solves the exact recipe it was given, but fails whenever a user asks it to scale the recipe to different serving sizes, treating that as an unsolvable case. Which algorithm characteristic is this program failing to satisfy?","options":[{"t":"Unique","c":false,"fb":"Unique means each step's result is uniquely determined by inputs and prior steps."},{"t":"Finiteness","c":false,"fb":"Finiteness concerns terminating after a finite count of steps."},{"t":"Output","c":false,"fb":"The program produces output for the base case; the defect is breadth of coverage."},{"t":"General","c":true,"fb":"correct — \"general\" requires an algorithm to solve every instance of a problem."}]},{"cat":"01","type":"mcq","stem":"A loop is written with a condition that is always true and no `break` statement, so it never stops running. Which algorithm characteristic does this violate?","options":[{"t":"Exact","c":false,"fb":"Exact concerns clear, unambiguous step specifications."},{"t":"Effective","c":false,"fb":"Effective concerns producing correct answers at all times."},{"t":"Finiteness","c":true,"fb":"correct — an algorithm must terminate after a finite number of steps (finiteness / must terminate)."},{"t":"General","c":false,"fb":"General concerns solving every instance of a problem, not termination."}]},{"cat":"01","type":"multi","stem":"Select the TWO correct statements about algorithm characteristics.","options":[{"t":"\"Unique\" means the algorithm must solve every instance of a problem","c":false,"fb":"That describes \"general\"; \"unique\" means each step's result is uniquely determined."},{"t":"\"Exact\" means each step must be precise and unambiguously described","c":true,"fb":"correct — exactness requires unambiguous step formulation."},{"t":"\"Finiteness\" means the algorithm produces output on every run","c":false,"fb":"That describes output; finiteness means it terminates after a finite number of steps."},{"t":"\"Effective\" means the algorithm must provide the correct answers at all times","c":true,"fb":"correct — effectiveness requires producing correct answers."},{"t":"\"General\" means each step's result depends only on input and prior results","c":false,"fb":"That describes uniqueness; generality means solving all instances of the problem."}]},{"cat":"01","type":"mcq","stem":"Which of the following is NOT one of the three ways algorithms can be expressed, according to the handout?","options":[{"t":"Human language","c":false,"fb":"Human language IS one of the three listed expression methods."},{"t":"Machine code","c":true,"fb":"correct — the three ways listed in the handout are Human Language, Pseudocode, and Flowchart."},{"t":"Pseudocode","c":false,"fb":"Pseudocode IS one of the three listed expression methods."},{"t":"Flowchart","c":false,"fb":"Flowchart IS one of the three listed expression methods."}]},{"cat":"01","type":"mcq","stem":"A flowchart is too large to fit on one page, so part of it continues on a separate page. Which symbol shape should link these two separated parts?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"4,4 20,4 20,15 12,22 4,15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A pentagon with its point facing downward","c":true,"fb":"correct — the Off-page Connector is drawn as a downward-pointing pentagon to link flow continued on separate pages."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A small circle","c":false,"fb":"A small circle is the On-page Connector, used to connect parts continued on the same page."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> An oval or rounded rectangle","c":false,"fb":"An oval/rounded rectangle is the Terminal symbol, marking the start or end of a process."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"12,3 21,12 12,21 3,12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A diamond","c":false,"fb":"A diamond is the Decision symbol, marking branching points in a process."}]},{"cat":"01","type":"mcq","stem":"Which flowchart symbol shape connects two parts of the same flowchart that are continued on the same page (e.g., to avoid crossing lines)?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A small circle","c":true,"fb":"correct — the On-page Connector is drawn as a small circle to connect flow parts on the same page."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"4,4 20,4 20,15 12,22 4,15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A pentagon with its point facing downward","c":false,"fb":"A downward-pointing pentagon is the Off-page Connector, used for flow continuing to separate pages."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M3,4 h18 v12 h-18 z M7,4 v12 M17,4 v12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with vertical double side borders","c":false,"fb":"A rectangle with vertical side borders denotes Predefined Processing (a subroutine)."},{"t":"<svg width=\"20\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M19,4 L5,4 L5,16 L19,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A three-sided open rectangle","c":false,"fb":"An open three-sided rectangle denotes a Comment (annotation)."}]},{"cat":"01","type":"mcq","stem":"A process reads its input directly from a printed form and sends its output to a printed physical report. Which flowchart symbol shape specifically represents this?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M4,4 L20,4 L20,16 C16,14 14,19 12,17 C10,15 8,19 4,16 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with a wavy bottom edge","c":true,"fb":"correct — Document Input/Output is drawn with a wavy curved bottom to represent paper documents."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"7,4 21,4 17,16 3,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A parallelogram","c":false,"fb":"A parallelogram shows general I/O, but the wavy-bottom rectangle specifically denotes document I/O."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M3,4 h18 v12 h-18 z M7,4 v12 M17,4 v12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with vertical double side borders","c":false,"fb":"That shape represents Predefined Processing."},{"t":"<svg width=\"20\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M19,4 L5,4 L5,16 L19,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A three-sided open rectangle","c":false,"fb":"That shape represents Comments/annotations."}]},{"cat":"01","type":"mcq","stem":"A process simply reads a value a user types on a keyboard, with no document involved. Which flowchart symbol shape represents this?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M4,4 L20,4 L20,16 C16,14 14,19 12,17 C10,15 8,19 4,16 Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with a wavy bottom edge","c":false,"fb":"The wavy bottom specifically denotes document I/O, not keyboard input."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> An oval or rounded rectangle","c":false,"fb":"An oval represents the Terminal (start/end) symbol."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"7,4 21,4 17,16 3,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A parallelogram","c":true,"fb":"correct — a parallelogram represents any general input/output operation."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A simple rectangle","c":false,"fb":"A simple rectangle represents Computer Processing."}]},{"cat":"01","type":"mcq","stem":"At a specific stage in a flowchart, the program must evaluate whether an account balance is greater than zero and branch to different paths depending on the outcome. Which symbol shape must represent this point?","options":[{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"12,3 21,12 12,21 3,12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A diamond","c":true,"fb":"correct — a diamond indicates any point where a decision must be made to determine further action."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A simple rectangle","c":false,"fb":"A rectangle shows processing performed by a computer system, not conditional branching."},{"t":"<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><circle cx=\"12\" cy=\"12\" r=\"7\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A small circle","c":false,"fb":"A circle is a connector, not a decision point."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> An oval or rounded rectangle","c":false,"fb":"An oval represents the start or end of a process."}]},{"cat":"01","type":"mcq","stem":"A flowchart references an existing complex calculation routine that is documented and specified elsewhere, rather than expanding its detailed steps here. Which symbol shape designates this?","options":[{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M3,4 h18 v12 h-18 z M7,4 v12 M17,4 v12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A rectangle with vertical double side borders","c":true,"fb":"correct — Predefined Processing indicates any process not specially defined in the flowchart."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A simple closed single-border rectangle","c":false,"fb":"A simple rectangle denotes standard computer processing defined inline."},{"t":"<svg width=\"20\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><path d=\"M19,4 L5,4 L5,16 L19,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A three-sided open-ended rectangle","c":false,"fb":"A comment is used for explanatory notes, not subroutines."},{"t":"<svg width=\"22\" height=\"18\" viewBox=\"0 0 24 20\" style=\"vertical-align:middle;display:inline-block;margin-right:8px\"><polygon points=\"7,4 21,4 17,16 3,16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><\/svg> A four-sided slanted parallelogram","c":false,"fb":"A parallelogram denotes input/output operations."}]},{"cat":"01","type":"multi","stem":"Select the TWO correct statements about flowchart symbols.","options":[{"t":"Predefined Processing is used for writing explanatory statements to clarify something","c":false,"fb":"That describes Comment; Predefined Processing indicates a routine not specially defined here."},{"t":"Terminal shows the start and end of a set of computer-related processes","c":true,"fb":"correct — the Terminal symbol marks process beginnings and completions."},{"t":"Computer Processing shows any processing performed by a computer system","c":true,"fb":"correct — Computer Processing represents system calculations and actions."},{"t":"Flow line indicates any point where a decision must be made","c":false,"fb":"That describes Decision; a Flow line simply connects symbols in sequence const CFG_DEFAULT_MINUTES =
  ((CONFIG.timeOptions || []).find(o => o.default) || (CONFIG.timeOptions || [])[0] || {minutes: 10}).minutes;






// Every question declares its own `cat` key in the pack. Anything
// with a missing/unknown key becomes 'other' (excluded from exam
// simulation, still reachable in normal practice mode).
BANK.forEach(q => {
  if (!q.cat || !CATEGORIES.some(c => c.key === q.cat)) q.cat = 'other';
});

// Per-category counts. Counted from the ACTUAL tagged questions (not
// from the range arithmetic) so the numbers shown on topic chips and
// the coverage meter are always truthful, even if a range over-reaches.
const CAT_COUNTS = Object.fromEntries(
  CATEGORIES.map(c => [c.key, BANK.filter(q => q.cat === c.key).length])
);

/* ── Exam-blueprint helpers (engine code — no edits needed) ──────── */
// How many questions exam mode WANTS in total (weights × multiplier).
function examTargetTotal() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.reduce((s, c) => s + c.weight * m, 0);
}
// The per-objective draw plan given what the bank currently holds:
// [{cat, want, have, take}]  where take = min(want, have).
function examPlan() {
  const m = (CONFIG.examSim && CONFIG.examSim.multiplier) || 1;
  return CATEGORIES.map(c => {
    const want = c.weight * m;
    const have = CAT_COUNTS[c.key] || 0;
    return { cat: c, want, have, take: Math.min(want, have) };
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Pool size given current focus selection.
function poolSize() {
  if (!state.focusEnabled || state.focusedCats.length === 0) return BANK.length;
  return BANK.filter(q => state.focusedCats.includes(q.cat)).length;
}

// Shared question normalizer: shuffles options, strips authoring-only
// fields, keeps origIdx + cat for review and the objective breakdown.
function normalizeQuestion(q) {
  if (q.type === 'fitb') {
    return { type: q.type, stem: q.stem, answer: q.answer,
             caseSensitive: q.caseSensitive || false, hint: q.hint || '',
             fb: q.fb || '', subtype: q.subtype || '', origIdx: q.origIdx, cat: q.cat };
  }
  const base = { type: q.type, stem: q.stem,
                 options: shuffle(q.options.map((o, i) => ({ ...o, origIdx: i }))),
                 origIdx: q.origIdx, cat: q.cat };
  if (q.type === 'scenario') base.context = q.context || '';
  return base;
}

function buildQuiz(count) {
  let pool = BANK.map((q, i) => ({ ...q, origIdx: i }));
  if (state.focusEnabled && state.focusedCats.length > 0) {
    pool = pool.filter(q => state.focusedCats.includes(q.cat));
  }
  const finalCount = Math.min(count, pool.length);
  const picked  = shuffle(pool).slice(0, finalCount);
  return picked.map(normalizeQuestion);
}

// Weighted blueprint draw: take `weight × multiplier` questions from
// EACH objective (capped at what the bank holds), then shuffle the
// combined paper so objectives are interleaved like the real exam.
function buildExamQuiz() {
  const indexed = BANK.map((q, i) => ({ ...q, origIdx: i }));
  let paper = [];
  examPlan().forEach(p => {
    if (p.take === 0) return;
    const pool = indexed.filter(q => q.cat === p.cat.key);
    paper = paper.concat(shuffle(pool).slice(0, p.take));
  });
  return shuffle(paper).map(normalizeQuestion);
}

// Single entry point used by Start and Retake — respects current mode.
function buildActiveQuiz() {
  return state.examMode ? buildExamQuiz() : buildQuiz(state.count);
}

function formatTime(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function scoreQuestion(q, selectedIdxs) {
  // ── Fill-in-the-blank ───────────────────────────────────────────
  if (q.type === 'fitb') {
    const userText = typeof selectedIdxs === 'string' ? selectedIdxs.trim() : '';
    if (!userText) return { score: 0, status: 'skipped', userText: '' };
    const correct = Array.isArray(q.answer) ? q.answer : [q.answer];
    const match = correct.some(a =>
      q.caseSensitive ? a.trim() === userText : a.trim().toLowerCase() === userText.toLowerCase()
    );
    return { score: match ? 1 : 0, status: match ? 'correct' : 'wrong', userText };
  }
  if (selectedIdxs.length === 0) return { score: 0, status: 'skipped' };
  // scenario behaves like a single-answer MCQ
  if (q.type === 'mcq' || q.type === 'scenario') {
    const isCorrect = q.options[selectedIdxs[0]].c === true;
    return { score: isCorrect ? 1 : 0, status: isCorrect ? 'correct' : 'wrong' };
  }
  const correctIdxs = q.options.map((o,i)=>o.c?i:-1).filter(i=>i>=0);
  const wrongIdxs   = q.options.map((o,i)=>!o.c?i:-1).filter(i=>i>=0);
  const C = correctIdxs.length, W = wrongIdxs.length;
  let score = 0;
  selectedIdxs.forEach(i => {
    if (q.options[i].c) score += 1 / C;
    else                score -= 1 / Math.max(W, 1);
  });
  score = Math.max(0, Math.min(1, score));
  const allCorrectChosen = correctIdxs.every(i => selectedIdxs.includes(i));
  const noneWrongChosen  = !selectedIdxs.some(i => !q.options[i].c);
  let status;
  if (allCorrectChosen && noneWrongChosen) status = 'correct';
  else if (score === 0) status = 'wrong';
  else status = 'partial';
  return { score, status };
}

// ----- summary line + start button gating -----
function updateSetupSummary() {
  const examCfg = CONFIG.examSim || {};

  /* ── EXAM SIMULATION BRANCH ─────────────────────────────────── */
  if (state.examMode) {
    const plan   = examPlan();
    const drawn  = plan.reduce((s, p) => s + p.take, 0);
    const target = examTargetTotal();
    const missing = plan.filter(p => p.take < p.want);

    $('ssLength').textContent = `${drawn} question${drawn === 1 ? '' : 's'}`;
    $('ssMode').textContent   = 'Exam simulation';
    $('ssFocus').textContent  = 'All objectives · weighted';
    $('ssTime').textContent   = `${state.timerMinutes} min`;

    $('examSub').textContent  = 'ON — drawing per the blueprint weights, feedback at the end';
    $('examSub').classList.add('live');
    $('focusSub').textContent = 'Locked — the exam draws from every objective';
    $('focusSub').classList.remove('live');
    $('timerSub').textContent = `Locked to ${state.timerMinutes} minutes by exam simulation`;
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';

    // Coverage meter: how much of the 40-slot blueprint the bank fills.
    let cov = `Blueprint coverage: <strong>${drawn} / ${target}</strong> exam slots filled`;
    if (missing.length > 0) {
      const keys = missing.map(p => p.cat.key);
      const shown = keys.slice(0, 8).join(', ') + (keys.length > 8 ? ` +${keys.length - 8} more` : '');
      cov += ` <span class="ec-missing">· awaiting questions: ${shown}</span>`;
    } else {
      cov += ` <span class="ec-missing">· full blueprint — this is a true exam form</span>`;
    }
    $('examCoverageLine').innerHTML = cov;

    $('poolAvailable').textContent = drawn;
    const startBtn = $('startBtn');
    startBtn.disabled = drawn === 0;
    startBtn.textContent = drawn === 0 ? 'Bank is empty' : 'Begin Exam →';
    return;
  }

  /* ── NORMAL PRACTICE BRANCH ─────────────────────────────────── */
  $('examSub').textContent = examCfg.enabled === false ? '' :
    `Replicates the official weighted blueprint — ${examTargetTotal()} questions · ${examCfg.minutes || 60} min · all objectives`;
  $('examSub').classList.remove('live');

  const available = poolSize();
  const effectiveCount = Math.min(state.count, available);

  // length
  $('ssLength').textContent = `${effectiveCount} question${effectiveCount === 1 ? '' : 's'}`;

  // mode
  $('ssMode').textContent = state.timerEnabled ? 'Timed test' : 'Practice';

  // focus
  if (!state.focusEnabled || state.focusedCats.length === 0 || state.focusedCats.length === CATEGORIES.length) {
    $('ssFocus').textContent = 'All topics';
    $('focusSub').textContent = `All ${BANK.length} questions across ${CATEGORIES.length} topics`;
    $('focusSub').classList.remove('live');
  } else {
    const n = state.focusedCats.length;
    $('ssFocus').textContent = `${n} topic${n === 1 ? '' : 's'} • ${available} q`;
    $('focusSub').textContent = `${n} of ${CATEGORIES.length} topics selected — ${available} questions available`;
    $('focusSub').classList.add('live');
  }

  // timing
  if (state.timerEnabled) {
    $('ssTime').textContent = `${state.timerMinutes} min`;
    $('timerSub').textContent = `${state.timerMinutes} minutes total — feedback shows at the end`;
    $('timerSub').classList.add('live');
    $('feedbackTimingMeta').innerHTML = 'Deferred — shown after <code>Finish</code>';
  } else {
    $('ssTime').textContent = 'Untimed';
    $('timerSub').textContent = 'No time limit — feedback after every Check';
    $('timerSub').classList.remove('live');
    $('feedbackTimingMeta').innerHTML = 'Instant — after each <code>Check</code>';
  }

  // pool note
  $('poolAvailable').textContent = available;

  // start gating: need at least 1 question available
  const startBtn = $('startBtn');
  if (available === 0) {
    startBtn.disabled = true;
    startBtn.textContent = 'Pick at least one topic';
  } else {
    startBtn.disabled = false;
    startBtn.textContent = 'Begin Quiz →';
  }
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(ms) {
  state.timerEndAt = Date.now() + ms;
  if (state.timerInterval) clearInterval(state.timerInterval);
  // tick every 250ms for smoother last-seconds feel
  state.timerInterval = setInterval(tickTimer, 250);
  tickTimer();
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function tickTimer() {
  const remaining = state.timerEndAt - Date.now();
  const badge = $('timerBadge');
  if (badge) {
    badge.textContent = formatTime(remaining);
    badge.classList.remove('warn', 'danger');
    if (remaining <= 10000)      badge.classList.add('danger');
    else if (remaining <= 60000) badge.classList.add('warn');
  }
  if (remaining <= 0) {
    stopTimer();
    state.timeUp = true;
    state.timeUsedMs = state.timerMinutes * 60 * 1000;
    // Mark all as checked so review (after results) shows per-question feedback.
    state.checked = state.checked.map(() => true);
    showResults();
  }
}

/* ============================================================
   QUIZ VIEW
   ============================================================ */
function renderQuiz() {
  const q = state.questions[state.current];
  const isFitb     = q.type === 'fitb';
  const isScenario = q.type === 'scenario';
  const isMulti    = q.type === 'multi';
  const isChecked = state.checked[state.current];
  const allChecked = state.checked.every(c => c);
  // "Active" timed session: timer is on AND we haven't finished yet.
  const timedActive = state.timerEnabled && !allChecked;
  const selectedIdxs = state.answers[state.current];

  $('qNow').textContent = state.current + 1;

  // Test-mode notice strip — only during an active timed session.
  $('testNotice').classList.toggle('hidden', !timedActive);

  // Right side of progress row: timer in active timed mode, otherwise checked count
  const progressRight = $('progressRight');
  if (timedActive) {
    progressRight.innerHTML = `<div class="timer-badge" id="timerBadge">${formatTime(state.timerEndAt - Date.now())}</div>`;
    tickTimer();
  } else {
    const checkedN = state.checked.filter(c => c).length;
    progressRight.innerHTML = `<span id="checkedCount">${checkedN}</span> checked`;
  }

  // Progress bar fill: count "answered" during timed mode, "checked" otherwise.
  const filledN = timedActive
    ? state.answers.filter(a => a.length > 0).length
    : state.checked.filter(c => c).length;
  $('progressFill').style.width = (filledN / state.questions.length * 100) + '%';

  // Jumper
  const jumper = $('jumper');
  jumper.innerHTML = '';
  state.questions.forEach((qq, i) => {
    const dot = document.createElement('button');
    dot.className = 'jump-dot';
    if (timedActive) {
      // During active timed session, don't reveal correctness — just answered vs not.
      if (state.answers[i].length > 0) dot.classList.add('has-selection');
    } else if (state.checked[i]) {
      const r = scoreQuestion(qq, state.answers[i]);
      if (r.status === 'correct')      dot.classList.add('checked-correct');
      else if (r.status === 'partial') dot.classList.add('checked-partial');
      else                              dot.classList.add('checked-wrong');
    } else if (state.answers[i].length > 0) {
      dot.classList.add('has-selection');
    }
    if (i === state.current) dot.classList.add('current');
    dot.textContent = i + 1;
    dot.addEventListener('click', () => { state.current = i; renderQuiz(); });
    jumper.appendChild(dot);
  });

  // Build question card
  let tagLabel, tagClass;
  if (isFitb)          { tagLabel = 'Fill in the blank'; tagClass = 'fitb'; }
  else if (isScenario) { tagLabel = 'Scenario';          tagClass = 'scenario'; }
  else if (isMulti)    { tagLabel = 'Select all that apply'; tagClass = 'multi'; }
  else                 { tagLabel = 'Single answer';      tagClass = ''; }

  let html = '<div class="qcard fade-in">';

  // Verdict banner if checked
  let r = null;
  if (isChecked) {
    r = scoreQuestion(q, selectedIdxs);
    let vCls, vIcon, vTitle, vSub;
    if (r.status === 'correct') {
      vCls = 'correct'; vIcon = '\u2713';
      vTitle = 'Correct';
      vSub = isFitb ? 'Your answer matched.' : (isMulti ? 'You picked every right answer.' : '+1 point');
    } else if (r.status === 'partial') {
      vCls = 'partial'; vIcon = '\u25D0';
      vTitle = 'Partial credit';
      vSub = `Score: ${r.score.toFixed(2)} / 1.00`;
    } else if (r.status === 'wrong') {
      vCls = 'wrong'; vIcon = '\u2715';
      vTitle = 'Incorrect';
      vSub = isFitb ? "Your answer wasn\u2019t matched \u2014 see below."
                    : (isMulti ? 'See the marked correct answers below.'
                               : 'See the correct answer below.');
    } else {
      vCls = 'wrong'; vIcon = '?';
      vTitle = 'Skipped';
      vSub = isFitb ? 'No answer was entered.' : 'No selection was made.';
    }
    html += `
      <div class="qverdict ${vCls}">
        <div class="qverdict-icon">${vIcon}</div>
        <div class="qverdict-text"><strong>${vTitle}</strong>${vSub}</div>
      </div>
    `;
  }

  html += `<span class="qtype-tag ${tagClass}">${tagLabel}</span>`;
  if (isScenario && q.context) {
    html += `<div class="scenario-context"><div class="scenario-context-eyebrow">Situation</div><div class="scenario-context-body">${q.context}</div></div>`;
  }
  html += `<div class="qstem">${q.stem}</div>`;

  if (isFitb) {
    // ── Fill-in-the-blank input ────────────────────────────────────
    const inputCls = isChecked ? (r && r.status === 'correct' ? 'is-correct' : 'is-wrong') : '';
    html += `<div class="fitb-wrapper">`;
    html += `<input type="text" class="fitb-input ${inputCls}" ${isChecked ? 'readonly' : ''} placeholder="Type your answer\u2026">`;
    if (!isChecked && q.hint) {
      html += `<div class="fitb-hint">\u2192 Hint: ${q.hint}</div>`;
    }
    if (isChecked && r) {
      const ca = Array.isArray(q.answer) ? q.answer : [q.answer];
      if (r.status === 'correct') {
        html += `<div class="fitb-result correct">\u2713 Correct \u2014 <code>${escapeHtml(ca[0])}</code></div>`;
      } else {
        const ut = r.userText || '';
        html += `<div class="fitb-result wrong">`;
        html += ut
          ? `<div>\u2715 Your answer: <code>${escapeHtml(ut)}</code></div>`
          : `<div>\u2715 No answer entered.</div>`;
        html += `<div style="margin-top:6px">Correct: <code>${escapeHtml(ca[0])}</code>`;
        if (ca.length > 1) html += ` <span style="color:var(--ink-mute)"> or <code>${escapeHtml(ca[1])}</code></span>`;
        html += `</div></div>`;
      }
      if (q.fb) html += `<div class="fitb-fb">${q.fb}</div>`;
    }
    html += `</div>`;
  } else {
    // ── MCQ / Multi / Scenario options ────────────────────────────
    html += `<div class="options">`;
    q.options.forEach((opt, i) => {
      const wasSelected = selectedIdxs.includes(i);
      let cls = '';
      let marker;
      let tagsHtml = '';
      let showFeedback = false;

      if (isChecked) {
        cls += ' locked';
        if (opt.c && wasSelected) {
          cls += ' is-correct';
          marker = '\u2713';
          tagsHtml = '<span class="opt-tag you">Your pick</span><span class="opt-tag ans">Correct</span>';
          showFeedback = true;
        } else if (opt.c && !wasSelected) {
          cls += ' is-missed';
          marker = '\u25CB';
          tagsHtml = '<span class="opt-tag miss">Correct answer</span>';
          showFeedback = true;
        } else if (!opt.c && wasSelected) {
          cls += ' is-wrong';
          marker = '\u2715';
          tagsHtml = '<span class="opt-tag you">Your pick</span>';
          showFeedback = true;
        } else {
          marker = isMulti ? '' : String.fromCharCode(65 + i);
        }
      } else {
        if (wasSelected) cls += ' selected';
        marker = isMulti ? (wasSelected ? '\u2713' : '') : String.fromCharCode(65 + i);
      }

      html += `
        <div class="opt ${cls}" data-type="${q.type}" data-idx="${i}">
          <div class="opt-main">
            <div class="opt-marker">${marker}</div>
            <div class="opt-text">${opt.t}${tagsHtml}</div>
          </div>
          ${showFeedback ? `<div class="opt-feedback">${opt.fb}</div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `</div>`; // close .qcard

  $('quizContent').innerHTML = html;

  // ── Input / click wiring ─────────────────────────────────────────
  if (isFitb) {
    const input = $('quizContent').querySelector('.fitb-input');
    if (input) {
      const stored = typeof state.answers[state.current] === 'string' ? state.answers[state.current] : '';
      input.value = isChecked ? (r ? r.userText || '' : stored) : stored;
      if (!isChecked) {
        input.addEventListener('input', e => {
          state.answers[state.current] = e.target.value;
          $('checkBtn').disabled = e.target.value.trim() === '';
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
        });
        input.focus();
      }
    }
  } else if (!isChecked) {
    $('quizContent').querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        const arr = state.answers[state.current];
        if (q.type === 'mcq' || q.type === 'scenario') {
          state.answers[state.current] = [idx];
        } else {
          const at = arr.indexOf(idx);
          if (at >= 0) arr.splice(at, 1);
          else arr.push(idx);
        }
        renderQuiz();
      });
    });
  }

  // Buttons
  $('prevBtn').disabled = state.current === 0;
  const isLast = state.current === state.questions.length - 1;

  if (timedActive) {
    // Active timed session: no Check, free navigation, Finish always available.
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').disabled = isLast;
    $('finishBtn').classList.remove('hidden');
  } else {
    // Practice mode (or post-finish review): original flow.
    if (!isChecked) {
      $('checkBtn').classList.remove('hidden');
      $('checkBtn').disabled = selectedIdxs.length === 0;
      $('nextBtn').classList.add('hidden');
      $('finishBtn').classList.add('hidden');
    } else {
      $('checkBtn').classList.add('hidden');
      if (isLast && allChecked) {
        $('nextBtn').classList.add('hidden');
        $('finishBtn').classList.remove('hidden');
      } else {
        $('nextBtn').classList.remove('hidden');
        $('nextBtn').disabled = isLast;
        $('finishBtn').classList.toggle('hidden', !allChecked);
      }
    }
  }
}

$('prevBtn').addEventListener('click', () => {
  if (state.current > 0) { state.current--; renderQuiz(); }
});
$('nextBtn').addEventListener('click', () => {
  if (state.current < state.questions.length - 1) {
    state.current++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
$('checkBtn').addEventListener('click', () => {
  if (state.answers[state.current].length === 0) return;
  state.checked[state.current] = true;
  renderQuiz();
});
$('finishBtn').addEventListener('click', () => {
  if (state.timerEnabled && !state.timeUp) {
    state.timeUsedMs = (state.timerMinutes * 60 * 1000) - Math.max(0, state.timerEndAt - Date.now());
    stopTimer();
  }
  // Mark all as checked so review (after results) shows per-question feedback.
  state.checked = state.checked.map(() => true);
  showResults();
});
$('abandonBtn').addEventListener('click', () => {
  if (confirm('Abandon this quiz and return to setup? Your progress will be lost.')) {
    stopTimer();
    state.timeUp = false;
    $('view-quiz').classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});
document.querySelectorAll('a[href="../index.html"]').forEach(link => {
  link.addEventListener('click', (e) => {
    const quiz = $('view-quiz');
    if (quiz && !quiz.classList.contains('hidden')) {
      if (!confirm('Leave this quiz and return to the Reviewer Hub? Your current progress will be lost.')) {
        e.preventDefault();
      } else {
        stopTimer();
      }
    }
  });
});

/* ============================================================
   RESULTS VIEW (final summary)
   ============================================================ */
function showResults() {
  $('view-quiz').classList.add('hidden');
  const view = $('view-results');
  view.classList.remove('hidden');
  view.classList.add('fade-in');

  const breakdown = state.questions.map((q, i) => {
    const r = scoreQuestion(q, state.answers[i]);
    return { q, selected: state.answers[i], ...r };
  });
  const totalScore = breakdown.reduce((s, b) => s + b.score, 0);
  const total = breakdown.length;
  const pct = Math.round((totalScore / total) * 100);
  const correctCount = breakdown.filter(b => b.status === 'correct').length;
  const partialCount = breakdown.filter(b => b.status === 'partial').length;
  const wrongCount   = breakdown.filter(b => b.status === 'wrong' || b.status === 'skipped').length;

  // Score tier lookup — driven by CONFIG.scoreTiers (edit at the top of <script>)
  const tier = CONFIG.scoreTiers.find(t => pct >= t.minPct)
            || CONFIG.scoreTiers[CONFIG.scoreTiers.length - 1];
  const eyebrow    = tier.eyebrow;
  const verdict    = tier.verdictHtml;
  const verdictSub = tier.verdictSub;

  // Optional time-up banner
  const timeupHtml = state.timeUp
    ? `<div class="timeup-banner"><strong>Time's up.</strong> The quiz auto-submitted when the ${state.timerMinutes}-minute timer expired. Unanswered questions are counted as skipped.</div>`
    : '';

  // Optional time-used line under the dial
  const timeUsedHtml = state.timerEnabled
    ? `<div class="score-frac" style="margin-top: 8px;">Time used: ${formatTime(state.timeUsedMs)} / ${state.timerMinutes}:00</div>`
    : '';

  /* ── Per-objective breakdown ──────────────────────────────────
     Shown whenever the paper spans 2+ objectives (always true in
     exam simulation). Rows under the pack's pass mark (default 65%) —
     are flagged red: those are the objectives to drill next.       */
  let objHtml = '';
  {
    const byCat = {};
    breakdown.forEach(b => {
      const k = b.q.cat || 'other';
      (byCat[k] = byCat[k] || { score: 0, n: 0 }).score += b.score;
      byCat[k].n += 1;
    });
    const catKeys = Object.keys(byCat);
    if (catKeys.length >= 2) {
      const rows = CATEGORIES
        .filter(c => byCat[c.key])
        .map(c => ({ label: c.label, ...byCat[c.key] }))
        .concat(byCat['other'] ? [{ label: 'Uncategorised', ...byCat['other'] }] : [])
        .map(r => {
          const p = Math.round((r.score / r.n) * 100);
          return `<div class="obj-row${p < PASS_PCT ? ' weak' : ''}">
                    <div class="obj-row-label">${r.label}</div>
                    <div class="obj-row-bar"><i style="width:${p}%"></i></div>
                    <div class="obj-row-pct">${r.score.toFixed(1)}/${r.n} · ${p}%</div>
                  </div>`;
        }).join('');
      objHtml = `<div class="obj-break">
                   <div class="obj-break-title">Performance by objective — red rows are below the ~${PASS_PCT}% pass line</div>
                   ${rows}
                 </div>`;
    }
  }

  // Auto-accumulate session results into localStorage (for health analysis & loop closure)
  try {
    const packId = _meta.packId || _meta.subject || 'quiz';
    const storageKey = 'quizforge_history_' + packId;
    const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const record = {
      timestamp: new Date().toISOString(),
      packId: packId,
      score: totalScore,
      total: total,
      pct: pct,
      results: breakdown.map(b => ({
        stem: b.q.stem,
        cat: b.q.cat || 'other',
        type: b.q.type,
        score: b.score,
        status: b.status
      }))
    };
    history.push(record);
    localStorage.setItem(storageKey, JSON.stringify(history));
  } catch (e) {
    // localStorage might be unavailable or disabled
  }

  view.innerHTML = `
    ${timeupHtml}
    <div class="results-hero">
      <div class="score-dial">
        <svg viewBox="0 0 120 120">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
          <circle class="fill"  cx="60" cy="60" r="52" fill="none" stroke-width="9"
                  stroke-dasharray="${(2*Math.PI*52).toFixed(2)}"
                  stroke-dashoffset="${((2*Math.PI*52)*(1 - pct/100)).toFixed(2)}"/>
        </svg>
        <div class="score-dial-inner">
          <div class="score-pct">${pct}<span style="font-size: 24px; color: var(--ink-mute);">%</span></div>
          <div class="score-frac">${totalScore.toFixed(1)} / ${total}</div>
        </div>
      </div>
      <div>
        <div class="verdict-eyebrow">${eyebrow}</div>
        <div class="verdict">${verdict}</div>
        <div class="verdict-sub">${verdictSub}</div>
        ${timeUsedHtml}
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card correct">
        <div class="stat-num correct">${correctCount}</div>
        <div class="stat-label">Fully correct</div>
      </div>
      <div class="stat-card partial">
        <div class="stat-num partial">${partialCount}</div>
        <div class="stat-label">Partial credit</div>
      </div>
      <div class="stat-card wrong">
        <div class="stat-num wrong">${wrongCount}</div>
        <div class="stat-label">Incorrect / skipped</div>
      </div>
    </div>

    ${objHtml}

    <div class="btn-row">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="../index.html" class="btn ghost">← Back to Index</a>
        <button class="btn ghost" id="reviewSetupBtn">← Change quiz length</button>
        <button class="btn ghost" id="exportResultsBtn">⤓ Export JSON</button>
      </div>
      <div class="nav-right">
        <button class="btn ghost" id="reviewBackBtn">↩ Back to questions</button>
        <button class="btn primary" id="retakeBtn">↻ Retake (new shuffle)</button>
      </div>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });

  $('exportResultsBtn').addEventListener('click', () => {
    try {
      const packId = _meta.packId || _meta.subject || 'quiz';
      const storageKey = 'quizforge_history_' + packId;
      const history = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const exportData = {
        packId: packId,
        subject: _meta.subject || packId,
        exportedAt: new Date().toISOString(),
        sessions: history.length > 0 ? history : [{
          timestamp: new Date().toISOString(),
          packId: packId,
          score: totalScore,
          total: total,
          pct: pct,
          results: breakdown.map(b => ({
            stem: b.q.stem,
            cat: b.q.cat || 'other',
            type: b.q.type,
            score: b.score,
            status: b.status
          }))
        }]
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${packId}-results-${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      alert('Could not export results: ' + err);
    }
  });

  $('retakeBtn').addEventListener('click', () => {
    state.questions = buildActiveQuiz();
    state.answers   = state.questions.map(q => q.type === 'fitb' ? '' : []);
    state.checked   = state.questions.map(() => false);
    state.current   = 0;
    state.timeUp    = false;
    state.timeUsedMs = 0;
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    $('qTotal').textContent = state.questions.length;
    // Restart timer if timed mode is on
    if (state.timerEnabled) {
      startTimer(state.timerMinutes * 60 * 1000);
    }
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewBackBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-quiz').classList.remove('hidden');
    state.current = 0;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  $('reviewSetupBtn').addEventListener('click', () => {
    view.classList.add('hidden');
    $('view-setup').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

</script>
</body>
</html>
